        <section class="kg-tier kg-tier-intro" data-tier="intro"><dl class="kg-infobox" data-kind="infobox"><div
        class="kg-info__row"><dt>Type</dt><dd data-field="type">core</dd></div></dl><p>Kagekuni is a civilisation built
        on hierarchy. It is not a suggestion, not a tradition that has softened with time — it is the architecture of
        daily life, enforced by law, reinforced by custom, and internalised by nearly everyone who lives within it. From
        the moment a child is born, their place in the order is known. What they may do, where they may go, how they
        must speak to those above and below them — all of it is governed by structures older than most of the buildings
        they live in.</p>

        <p>Understanding this society is essential to moving through it. The adventurer who ignores social rank will
        find doors closed, prices raised, and patience exhausted long before any blade is drawn.</p>

        <h2 id="kg-the-imperial-order" data-section="the-imperial-order">The Imperial Order</h2>

        <p>At the apex of Kagekuni&#39;s political structure sits the Emperor — or, more precisely, the empty throne
        where an emperor should sit. For over eight thousand years, the imperial line traced its descent from
        <strong>Tenryū no Mikado</strong>, the first emperor, who united the warring dragon clans and forged the
        archipelago into a single civilisation. The emperor&#39;s authority was absolute in theory and considerable in
        practice, tempered by the realities of governing a vast island chain through intermediaries.</p>

        <p>Beneath the emperor, the <strong>Shogun</strong> served as supreme military commander — a wartime appointment
        granted by imperial decree, carrying the authority to mobilise armies, impose martial law, and compel obedience
        from the daimyō. The position was never permanent by design. In practice, some shoguns held power for
        decades.</p>

        <p>The <strong>Kokushi Kyōkai</strong> — the Council of Five Ministers — administers the empire&#39;s civilian
        machinery. Five departments cover the essential functions of governance:</p>

        <table>

        <thead>

        <tr>

        <th>Title</th>

        <th>Role</th>

        </tr>

        </thead>

        <tbody><tr>

        <td><strong>Anzen Hoshō Daijin</strong></td>

        <td>Minister of Security — intelligence, imperial protectorate</td>

        </tr>

        <tr>

        <td><strong>Fukushi Daijin</strong></td>

        <td>Minister of Welfare — healthcare, education, public assistance</td>

        </tr>

        <tr>

        <td><strong>Gaikō Daijin</strong></td>

        <td>Minister of Foreign Affairs — diplomacy, trade, foreign nationals</td>

        </tr>

        <tr>

        <td><strong>Seimu Daijin</strong></td>

        <td>Minister of Administration — provincial governance, infrastructure</td>

        </tr>

        <tr>

        <td><strong>Zaiumu Daijin</strong></td>

        <td>Minister of Finance — treasury, taxation, revenue</td>

        </tr>

        </tbody></table>

        <p>Below the national level, provincial administration follows its own chain: <strong>Chiji</strong> (Governor)
        to <strong>Gunji</strong> (County Magistrate) to <strong>Shi</strong> (Municipal Assembly) to
        <strong>Shichō</strong> (Mayor) to <strong>Sonchō</strong> (Village Leader). In theory, each level answers to
        the one above. In practice, local power depends heavily on who controls the samurai in the region.</p>

        <p>The <strong>Teikoku Keisatsu</strong> — the Imperial Police — maintain order at a local level. Once an
        empire-wide institution, the police have retreated to a regional footprint in the absence of central authority.
        They cooperate with local clan forces where relations allow it and operate independently where they do not.</p>

        <h2 id="kg-the-three-castes" data-section="the-three-castes">The Three Castes</h2>

        <p>Kagekuni&#39;s population is divided into three castes. Movement between them is rare, difficult, and in most
        cases functionally impossible. A person&#39;s caste determines what occupations they may hold, who they may
        marry, where they may live, and how they are treated under law.</p>

        <h3 id="kg-kugai-the-elite" data-section="kugai-the-elite">Kugai — The Elite</h3>

        <p>The ruling class. Kugai families claim descent from the imperial founders or the dragon clans that preceded
        them. In practice, the caste is dominated by humans and dragonborn, though other races with sufficient political
        connections have occasionally been elevated. The Kugai includes the daimyō, their courts, senior scholars, and
        the highest-ranking samurai — the <strong>hatamoto</strong>, or bannermen, who serve as personal retainers to
        clan lords.</p>

        <p>Kugai families maintain genealogical records stretching back centuries. Some are genuine. Some are creative.
        All are taken seriously.</p>

        <h3 id="kg-zokumin-the-commonfolk" data-section="zokumin-the-commonfolk">Zokumin — The Commonfolk</h3>

        <p>The broad middle of society, encompassing everyone from samurai to merchants. The Zokumin are not a single
        class but a gradient, and the distinctions within it matter enormously to those who live them.</p>

        <p>At the top sit <strong>samurai</strong> in active service — warriors sworn to a lord, carrying the authority
        of their clan. Below them, <strong>rōnin</strong> — masterless samurai — occupy an uncomfortable middle ground:
        they retain the right to carry weapons but lack the social anchor of a lord&#39;s name. Below rōnin come
        <strong>peasants</strong>, who work the land and form the backbone of the food supply. <strong>Artisans</strong>
        follow — craftspeople whose skills are valued but whose social standing reflects the society&#39;s bias toward
        land and loyalty over craft. At the very bottom of the Zokumin sit <strong>merchants</strong>.</p>

        <p>This last distinction is the source of chronic social tension. Merchants often possess considerable wealth —
        in some cases more than the samurai who look down on them. But wealth without rank buys comfort, not respect. A
        merchant who forgets this distinction will be reminded of it quickly and without sympathy.</p>

        <h3 id="kg-burakumin-the-outcasts" data-section="burakumin-the-outcasts">Burakumin — The Outcasts</h3>

        <p>Those whose work involves death or pollution. Leather workers, butchers, executioners, undertakers,
        gravediggers — anyone whose livelihood touches the boundary between life and death. The Burakumin live in
        segregated communities called <strong>buraku</strong>, subject to limited civil rights and systemic harassment.
        They are not enslaved, but the freedoms available to them are narrow and the prejudice they face is open.</p>

        <p>The caste system predates the current empire. It survived the Dark Ages, the return of magic, and every
        political upheaval in between. It will likely survive whatever comes next.</p>

        <h2 id="kg-honour" data-section="honour">Honour</h2>

        <p>Honour in Kagekuni is not an abstraction. It is a currency, a weapon, and a sentence.</p>

        <p>A samurai&#39;s honour determines their standing within their clan, their right to speak in councils, the
        marriages their children may make, and the manner of their death. Honour is earned through service, loyalty, and
        sacrifice. It is lost through cowardice, betrayal, or failure — and once lost, it is extraordinarily difficult
        to recover. A samurai who loses their honour may face exile, ritual punishment, or the expectation that they
        will take their own life to restore their family&#39;s name.</p>

        <p>The codes of <strong>bushidō</strong> — the way of the warrior — govern samurai conduct. Duty to one&#39;s
        lord supersedes personal desire. Courage in battle is expected, not celebrated. Loyalty is absolute until the
        moment it isn&#39;t, at which point it becomes treason. The tension between these demands — when duty conflicts
        with conscience, when loyalty to a corrupt lord meets personal honour — is the engine that drives much of
        Kagekuni&#39;s political drama.</p>

        <p>Honour applies differently across the castes. Peasants and merchants are not bound by bushidō, but they live
        within its shadow. A merchant who shames a samurai may find their shop burned. A peasant who fails to show
        proper deference may be struck without legal consequence. The social codes are enforced not by law alone but by
        a pervasive understanding that hierarchy is the natural order — and that those who disrupt it invite
        consequences not just for themselves but for their families.</p>

        <h2 id="kg-the-peoples-of-kagekuni" data-section="the-peoples-of-kagekuni">The Peoples of Kagekuni</h2>

        <p>The archipelago is home to many races, though not all enjoy equal standing. Humans and dragonborn —
        particularly those claiming descent from the founding dragon clans — move through society with the fewest
        barriers. Other races face varying degrees of prejudice depending on the region, the local clan&#39;s attitudes,
        and the circumstances of their presence.</p>

        <table>

        <thead>

        <tr>

        <th>Race</th>

        <th>Cultural Name</th>

        <th>Notes</th>

        </tr>

        </thead>

        <tbody><tr>

        <td>Elves</td>

        <td><strong>Arcadians</strong></td>

        <td>Near-immortal; the imperial line was Arcadian; last emperor Ryūjin died 16739</td>

        </tr>

        <tr>

        <td>Dwarves</td>

        <td><strong>Zirak</strong></td>

        <td>Ancestral homeland in Mizuho, on the island of Tatara</td>

        </tr>

        <tr>

        <td>Gnomes</td>

        <td><strong>Glimfyr</strong></td>

        <td>Ancestral homeland in Shugyoku, on the island of Tatara</td>

        </tr>

        <tr>

        <td>Great Apes</td>

        <td><strong>Guhuza</strong></td>

        <td>Distinct race of Seizan; powerful build; fur from black to silvered; capable of great age</td>

        </tr>

        <tr>

        <td>Dragonborn</td>

        <td>Dragonborn</td>

        <td>Prominent among the Kugai; claim descent from the founding dragons</td>

        </tr>

        <tr>

        <td>Halflings</td>

        <td>Halflings</td>

        <td>Present across the archipelago; lower social standing</td>

        </tr>

        </tbody></table>

        <p>The <strong>Zirak</strong> and <strong>Glimfyr</strong> have maintained an eternal feud on their shared
        island of Tatara. They rarely stop fighting. Historically, only an emperor&#39;s direct command has imposed
        truces — and those truces have always ended sooner than intended. Their conflict once sparked the empire-wide
        <strong>War of Fractured Banners</strong>. With no emperor to restrain them, the feud has recently escalated
        again.</p>

        <p>Characters who are not dragonborn, human, or the locally dominant non-human race will encounter prejudice in
        social situations. Doors close. Prices rise. Patience runs thin. This is not universal — individual NPCs may be
        more or less tolerant — but the systemic bias is real and pervasive.</p>

        <h2 id="kg-the-military" data-section="the-military">The Military</h2>

        <p>War in Kagekuni is the domain of the samurai, but the dying is shared widely.</p>

        <p>The military command hierarchy runs from the <strong>Shōgun</strong> (currently a vacant position) down
        through the <strong>daimyō</strong>, who command their clan&#39;s forces directly. Below the daimyō, the chain
        continues:</p>

        <p><strong>Sotaishō</strong> (Supreme Commander) → <strong>Karō</strong> (Chief Retainer) →
        <strong>Taishō</strong> (General) → <strong>Kumigashira</strong> (Squad Leader) → <strong>Kogashira</strong>
        (Corporal)</p>

        <p>Samurai form the officer class, ranked from <strong>gokenin</strong> (housemen) through
        <strong>goshi</strong> (rustic warriors) to <strong>hatamoto</strong> (bannermen — the elite retainers of a
        daimyō). Below them, the <strong>ashigaru</strong> — peasant infantry — fill the ranks with sword, spear, and
        bow.</p>

        <p>An extensive logistics corps of <strong>bugyō</strong> (commissioners) manages everything from weapons and
        armour to provisions, boats, and battlefield flags. War in Kagekuni is not simply a matter of warriors meeting
        on a field — it is an administrative enterprise requiring coordination across difficult terrain, unpredictable
        weather, and supply lines that stretch through mountains and across water.</p>

        <h3 id="kg-the-ronin-crisis" data-section="the-ronin-crisis">The Ronin Crisis</h3>

        <p>The current political vacuum has produced a surge in <strong>rōnin</strong> — masterless samurai — at numbers
        not seen in living memory. Some lost their lords to the war. Others served clans that dissolved during the
        upheaval. Some walked away by choice, unable to reconcile their duty with their conscience.</p>

        <p>Rōnin are a destabilising force. They retain the right to bear arms and the training to use them, but lack
        the social anchor of a lord&#39;s authority. Some seek new masters. Some sell their swords. Some turn to
        banditry. The roads of Kagekuni are significantly less safe than they were a decade ago, and rōnin are the
        primary reason.</p>

        </section>

        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-overview"
        data-section="overview">Overview</h3>

        <p>Ayame occupies the valley at the base of the Tenchusan Ren pass -- the primary land route between Hana&#39;s
        southern lowlands and the northern provinces. Everything that travels overland between these regions passes
        through Ayame. This geographic chokepoint function defines the town&#39;s character: it is less a community than
        a transit organism.</p>

        <p>The town is organized around the pass road. The main thoroughfare runs straight through parallel to the
        Kinryugawa, broadening into a market square at the center. Secondary streets branch off at intervals --
        accommodation, services, and residential areas spreading outward in concentric zones of decreasing
        formality.</p>

        <p>The military overseer structure means Ayame is administered by appointed officials with military backgrounds.
        This produces efficient governance but can feel impersonal; permanent residents are pragmatic people who work
        with whoever is in charge.</p>

        <h3 id="kg-districts-landmarks" data-section="districts-landmarks">Districts / Landmarks</h3>

        <p><strong>Chuo-ku (Central District)</strong> -- Main thoroughfare and market square. Most commercial activity.
        The Marketplace operates daily.</p>

        <p><strong>Tenchusan Chiku (Mountain District)</strong> -- The approach zone toward the pass. Stables, equipment
        rental, guide services, outfitter shops. Increasingly sparse toward the pass entrance.</p>

        <h3 id="kg-notable-establishments" data-section="notable-establishments">Notable Establishments</h3>

        <p><strong>The Marketplace</strong> -- Permanent covered market stalls along the main street. Serves local needs
        and traveler provisioning. Prices reflect the captive market.</p>

        <p><strong>Blacksmith&#39;s Forge</strong> -- Military-grade equipment maintenance and standard smithing. Works
        in cooperation with the garrison.</p>

        <p><strong>Weaver&#39;s Shop</strong> -- Mountain-weight textiles and cold-weather clothing. Genuinely
        excellent; mountain gear quality is a survival matter.</p>

        <p><strong>Kawabe no Tengaku (Riverside Haven)</strong> -- Inn along the river approach. Quieter; favored by
        travelers wanting rest over socialization.</p>

        <p><strong>Kin no Chochin Ryokan (Golden Lantern Inn)</strong> -- Main waypoint inn on the central street. Busy,
        efficient, well-run. The party stayed here during their Ayame transit.</p>

        <p><strong>Ryu no Yasuragi Yado (Dragon&#39;s Rest Lodge)</strong> -- Secondary inn; the party stayed here after
        the wagon impoundment situation. Slightly more modest.</p>

        <p><strong>Ayame Temple</strong> -- Small temple in the residential quarter. Patron deity is a traveling spirit
        protector. Resident monk maintains the shrine to the pass spirits.</p>

        <h3 id="kg-key-figures" data-section="key-figures">Key Figures</h3>

        <ul>

        <li>Takeda Yoshinobu -- Town leader; competent administrator -&gt; npcs/takeda-yoshinobu.md</li>

        <li>Chief Inspector Oshiro Masahiro -- Teikoku Keisatsu; confirmed party ally -&gt; npcs/oshiro-masahiro.md</li>

        </ul>

        </section>

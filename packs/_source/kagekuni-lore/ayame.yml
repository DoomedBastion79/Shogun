        <section class="secret kg-secret-discoverable">

        <p><strong>Details</strong></p>

        <p><em lang="ja-Latn">discoverable</em></p>

        <ul>

        <li>Oshiro Masahiro&#39;s intelligence network extends far beyond what his official position suggests.</li>

        <li>The Tenchusan Ren pass approach is under more surveillance than it appears.</li>

        <li>Mountain guides have been returning from upper-route jobs shaken and unwilling to specify what they
        saw.</li>

        </ul>


        </section>



        <section class="secret kg-secret-sealed">

        <p><strong>DM Secrets</strong></p>

        <p><em lang="ja-Latn">sealed</em></p>

        <p><strong>Oshiro Masahiro -- Intelligence Asset</strong>

        Oshiro&#39;s decision to assist the party was not simply a judgment about innocence. He had received information
        suggesting their mission was legitimate and the impoundment was creating an obstacle. He knows more about the
        Gekko situation than he has shared. He is a potential ongoing intelligence ally.</p>

        <p><strong>The Pass Road -- Surveillance</strong>

        The pass approach is watched more carefully than it appears. Oshiro has informants at both the waypoint inn and
        the outfitter district who log significant travelers and goods movements. The network also detected a group with
        no identifiable clan affiliation, moving fast and carrying unusual cargo, approximately three weeks before the
        party&#39;s transit.</p>

        <p><strong>Takeda Yoshinobu&#39;s Concerns</strong>

        Yoshinobu has been receiving reports from mountain guides about unusual activity in the upper pass -- disrupted
        trail markers, signs of large encampment at non-standard locations, and two guides who came back shaken and
        unwilling to specify what they saw. He has not reported upward because he has no official channels he
        trusts.</p>


        </section>






        <section class="secret kg-secret-sealed">

        <p><strong>Plot Hooks</strong></p>

        <p><em lang="ja-Latn">sealed</em></p>

        <ul>

        <li>Oshiro sends a discrete message: he has information relevant to the party&#39;s mission that he couldn&#39;t
        share safely in Ayame; proposes a meeting at the next Michibata up the pass</li>

        <li>One of the mountain guides who returned early is drinking heavily at the Dragon&#39;s Rest and muttering
        fragments of what they saw</li>

        </ul>


        </section>


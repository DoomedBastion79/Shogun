        <h2 id="kg-culture-amp-trade" data-section="culture-amp-trade">Culture &amp; Trade</h2>

        <p>Kawa is the agricultural heartland of the archipelago — its seasonal floodplains produce yields that dwarf
        anything achievable on permanently dry land. The island&#39;s economy revolves around the winter growing season
        and the export of grain, rice, and preserved produce to the other islands.</p>

        <p><em lang="ja-Latn">&lt;placeholder — Kawa governance, cultural detail, and inter-island trade relationships
        to be developed&gt;</em></p>

        <section class="secret">


        <h4 id="kg-dm-note-kawa-and-the-azure-dragon" data-section="dm-note-kawa-and-the-azure-dragon">DM Note — Kawa
        and the Azure Dragon</h4>

        <p><strong>Aoryū</strong> (Azure Dragon) is associated with Kawa — domain of water, storms, and coastal
        protection. The dragon is alive and slumbering. Seirei Mizuumi&#39;s reputation as a connection to the
        underworld may be a folk-memory distortion of the dragon&#39;s presence beneath or within the lake. The Great
        Library&#39;s proximity to the lake is not coincidental — the library was built there because the site&#39;s sei
        concentration was the strongest on the island, a consequence of the dragon&#39;s presence.</p>

        </section></section>

        <section class="kg-tier kg-tier-intro" data-tier="intro"><dl class="kg-infobox" data-kind="infobox"><div
        class="kg-info__row"><dt>Type</dt><dd data-field="type">core</dd></div></dl><p>Kawa is an island that breathes
        with the seasons. For most of the year, only its highest terrain rises above water — ridgelines, hilltops, and a
        handful of elevated settlements that persist as islands within an island. In winter, the waters recede and the
        lowlands emerge: vast, extraordinarily fertile floodplains that have been farmed for millennia using
        agricultural techniques found nowhere else in the archipelago. The annual cycle of submersion and emergence
        defines everything about Kawa — its architecture (built on stilts and elevated stone foundations), its economy
        (one explosive growing season), and its people (patient, methodical, and deeply attuned to tidal calendars).</p>

        <p>Kawa lies to the east of Hokori, visible from the Stormwatch Cliffs in Nami province on clear days. The
        waters surrounding it are navigable but treacherous — shifting sandbars and unpredictable currents created by
        the interaction of four lunar tidal patterns make piloting around Kawa a specialist skill.</p>

        <h2 id="kg-points-of-interest" data-section="points-of-interest">Points of Interest</h2>

        <p>The <strong>Great Library</strong> sits at <strong>Nagisawa</strong>, on the shores of <strong>Seirei
        Mizuumi</strong> (Spirit Lake) — a body of water said to connect to the underworld. The library was built during
        the reign of the First Emperor, Tenryū no Mikado, and remains one of the most significant repositories of
        knowledge in the archipelago. It was partially destroyed by an earthquake during the Dark Ages and restored
        during the Jinshō Reformation (~15642–15691).</p>

        <p>Seirei Mizuumi itself is a place of deep spiritual significance. The Battle of Seirei Mizuumi — fought during
        the era of imperial unification — secured Kawa for the empire and broke the Azure Clan navy. The lake&#39;s
        waters remain a site of pilgrimage and scholarly study.</p>


        <section class="kg-tier kg-tier-discoverable" data-tier="discoverable"><ul>

        <li><strong>Reforms of Ryūjin no Mikado (16732)</strong>: 18th emperor; last near-immortal elf; banned Kokushi
        Kyōkai from appointing Shogun without imperial approval</li>

        <li><strong>End of Imperial Line (16739)</strong>: Ryūjin no Mikado died under mysterious circumstances;
        officially old age; foul play suspected but unproven</li>

        <li><strong>Widespread Aggression (16742)</strong>: War between Genso and Arashi alliances begins</li>

        <li><strong>Current Year: 16744</strong></li>

        </ul>

        </section>

      content: >-
        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-overview"
        data-section="overview">Overview</h3>

        <p>Sakura Mura did not begin as a planned settlement -- it accumulated around a single inn on the Emperor&#39;s
        Highway that proved well-positioned for a rest stop. Over generations, the inn attracted other services, the
        services attracted residents, and the residents built a community. The village retains its highway-dependent
        character.</p>

        <p>A river runs east-west through the village, spanned at the north end by Shadowfen Bridge -- a stone bridge
        leading into a stretch of marsh forest. A secondary road path continues north from the bridge&#39;s far
        bank.</p>

        <p>The village is surrounded by forest on three sides, with a lake visible to the southeast. The cherry trees
        that give the village its name line the Highway approach for a quarter-mile -- planted two centuries ago by a
        traveling monk as a gift.</p>

        <h3 id="kg-notable-establishments" data-section="notable-establishments">Notable Establishments</h3>

        <p><strong>Oka-tei Inn</strong> -- The original settlement&#39;s reason for existing. Large, well-run, designed
        for highway travelers. Stabling for horses and oxen; common room with a good fire; private rooms at premium
        rates.</p>

        <p><strong>Takahashi&#39;s Hunting Lodge</strong> -- Equipment, local guides, and hunting licenses for the
        surrounding forest. Serves both dedicated hunters and travelers wanting fresh game.</p>

        <h3 id="kg-key-figures" data-section="key-figures">Key Figures</h3>

        <p>None specifically documented.</p>

        </section>

        <section class="kg-tier kg-tier-intro" data-tier="intro"><dl class="kg-infobox" data-kind="infobox"><div
        class="kg-info__row"><dt>Type</dt><dd data-field="type">system-reference</dd></div></dl><p>In Kagekuni, nothing
        is taken lightly from the land. A hunter who kills a deer owes the forest an accounting. A smith who pulls iron
        from the mountain asks the stone&#39;s permission before the first strike of the pick. A cook who gathers
        mountain sage bows to the plant before cutting. The materials of the world are not commodities — they are
        borrowed, and the borrower is expected to honor the source.</p>

        <p>This document is the canonical reference for every material that can be gathered, harvested, mined,
        scavenged, or otherwise pulled from the world of Kagekuni, and for the mechanics that govern both their
        gathering and their use in craft. It is the DM&#39;s single source of truth. When Foundry item definitions are
        generated, they are generated from this file. When a recipe in <code>core/recipes.md</code> references an
        ingredient, it references a Part I entry here. When a player asks &quot;what can I forage in the cedar
        forest,&quot; the answer comes from Part II.</p>

        <h2 id="kg-how-this-document-works" data-section="how-this-document-works">How This Document Works</h2>

        <p>The file is organized in two parts.</p>

        <p><strong>Part I — The Material Catalogue.</strong> Every material has a single authoritative entry, organized
        by category. Part I is the source of truth for what a material <em lang="ja-Latn">is</em>: its name, rarity,
        weight, value, grade variants, preservation rules, descriptions, and DM notes. Part I never describes where a
        material comes from — that belongs in Part II.</p>

        <p><strong>Part II — Gathering &amp; Yield Tables.</strong> The mechanic for harvesting materials, the five
        activities used to gather them, the grade system at the point of harvest, failure modes for both gathering and
        crafting, the seasons and seasonal events of Kagekuni, the biomes of the archipelago and what each one yields,
        and the named beast harvests that produce one-time legendary rewards.</p>

        <p>Cross-references between the two halves use markdown anchors: <code>[Ōkami-niku](#ōkami-niku)</code>. Part II
        tables link back to Part I entries so the DM can jump from &quot;what did they find&quot; to &quot;what does
        that mean&quot; in one click.</p>

        <h2 id="kg-knowledge-tiers" data-section="knowledge-tiers">Knowledge Tiers</h2>

        <p>All Part I entries respect the campaign&#39;s three-tier knowledge system:</p>

        <ul>

        <li><strong>[KNOWN]</strong> — Information the players have learned through play. Safe to reference
        anywhere.</li>

        <li><strong>[DISCOVERABLE]</strong> — Exists in-world and could be learned. Lives in the DM Notes section of
        each entry. Quest seeds marked</li>

        </ul>

        <div class="kg-quest-seed" data-kind="quest-seed"><span class="kg-quest-seed__label">QUEST SEED</span> .

        - <strong>[SEALED]</strong> — Campaign-level secrets. Never surface in player-facing descriptions. Mark
        undecided elements as TBD.</div>




        <p>The player-facing description field of each entry is always safe to export to Foundry or share with players.
        The DM Notes field is never exported.</p>

        <h2 id="kg-on-grades-and-foundry" data-section="on-grades-and-foundry">On Grades and Foundry</h2>

        <p>Every material that supports grading exists as four distinct Foundry items — one per grade (並 Nami, 上 Jō, 特上
        Tokujō, 極上 Gokujō). Within this document, a material has a single Part I entry with a Grade Variants sub-block
        listing the four tiers, their value multipliers, their craft modifiers, and reserved Foundry item ID slots. The
        4× proliferation exists only in Foundry. This file remains the single source of truth. The full grade system is
        documented in Part II.</p>

        <hr>

        <h1>Part I — The Material Catalogue</h1>

        <p>Part I is divided into twelve categories. Some will start full; others (Sen&#39;i, Hōseki, Ekitai) will begin
        mostly empty and fill as the campaign surfaces new materials. Every entry follows the schema documented at the
        end of this Part I header.</p>

        <h2 id="kg-part-i-entry-schema-reference" data-section="part-i-entry-schema-reference">Part I Entry Schema
        (Reference)</h2>

        <p>Every Part I entry must use this schema. Fields in square brackets are optional and may be omitted if
        irrelevant.</p>

        <pre><code>### [Material Name] ([日本語名]) ([English Gloss])


        **Category:** Niku | Yakusō | Kinoko | Chōmiryō | Shushoku | Kegawa | Hone | Sen&#39;i | Kōseki | Hōseki |
        Mokuzai | Ekitai

        **Rarity:** Common (並) | Uncommon (上) | Rare (特上) | Very Rare (極上) | Legendary (伝説) | Artifact (神器)

        **Source Type:** Foraged | Hunted | Mined | Harvested | Scavenged | One-Time | Purchased

        **Biomes:** [list of biomes where found, referencing Part II biome names]

        **Seasons:** Haru | Natsu | Aki | Fuyu | All | [or seasonal event tag like Hikarishō]

        **Yield per Success:** [e.g., &quot;1d4 per resource point&quot; or &quot;fixed: 1 sample&quot;]

        **Weight:** [per portion/unit]

        **Base Value:** [gold pieces per unit, before grade multiplier]

        **Preservation:** [fresh shelf life / preserved shelf life]

        **Tool Proficiency:** [tool needed to harvest or process, if any]

        [**Restrictions:** any legal, cultural, or ritual constraints on harvest]


        #### Grade Variants


        | Grade | Value Multiplier | Craft Modifier | Foundry Item ID |

        |---|---|---|---|

        | 並 Nami (Run-of-the-mill) | ×0.75 | −2 | tbd |

        | 上 Jō (Clean / Standard) | ×1.0 | +0 | tbd |

        | 特上 Tokujō (High-Purity) | ×1.5 | +2 | tbd |

        | 極上 Gokujō (Legendary Bloom) | ×2.5 | +5 or advantage on craft check | tbd |


        *Legendary and Artifact materials may specify a fixed grade; see individual entries.*


        #### Description (Player-Facing)


        Sensory, evocative, spoiler-free prose. This is what a player with full knowledge sees in Foundry when they
        inspect the item. Never contains [DISCOVERABLE] or [SEALED] content.


        #### Unidentified Description


        What the item looks like to a player who has *not* identified it — found in a crate, pulled from a beast with no
        naming knowledge, sitting on a shrine altar. Visual and tactile description only. Foundry shows this to players
        who have not yet identified the material.


        #### Image Prompt


        Prompt for watercolor-style token generation. Should evoke the material without depicting a specific shape or
        branded pose. Muted natural palette. Soft edges. The image is a suggestion of the thing, not a catalog
        photograph.


        #### Used In


        *(This section is auto-populated by the reindex skill by crawling recipes.md. Do not edit manually.)*


        #### DM Notes


        Lore, ecology, cultural significance, harvesting taboos, plot hooks, alternate uses. May contain **[KNOWN]**,
        **[DISCOVERABLE]**, or **[SEALED]** content with tier markers. This field is never exported to Foundry
        player-facing descriptions.

        </code></pre>

        <p><strong>Structural note.</strong> Category headers are <code>##</code>, rarity tier headers within categories
        use bold text (not <code>###</code>), individual material entries use <code>###</code>, and entry subsections
        use <code>####</code>. This keeps the markdown outline navigable and avoids collision between category and entry
        header levels.</p>

        <hr>

        <h2 id="kg-niku-meat-amp-edible-animal-products" data-section="niku-meat-amp-edible-animal-products">Niku 肉 —
        Meat &amp; Edible Animal Products</h2>

        <p>The meat of Kagekuni runs the full span from humble river fish to the heart of a mountain god. Hunting
        traditions are deeply tied to the warrior caste — the samurai on a hunt is not pursuing food but practicing the
        discipline of the kill — while fishing and small-game trapping belong to the peasantry and to the half-feral
        communities of the deep forest. Edible organs carry their own significance; the liver of a bear is a gift to an
        elder, the heart of a killed enemy is a ritual offering, and certain rare beasts yield parts that are considered
        medicine more than food.</p>

        <p><strong>Common</strong></p>


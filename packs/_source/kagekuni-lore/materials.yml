        <h4 id="kg-description-player-facing" data-section="description-player-facing">Description (Player-Facing)</h4>

        <p>Slender river fish prized for the distinctive cucumber-melon scent of their flesh in the height of summer.
        Grilled whole on a split-bamboo skewer over charcoal, salted simply, the belly fat melts and the skin crisps.
        The single most perfect expression of a summer river in Hokori.</p>

        <h4 id="kg-unidentified-description" data-section="unidentified-description">Unidentified Description</h4>

        <p>Slim silver-green fish, eight to ten inches long, with delicate iridescent scales and the faint melon scent
        that rises from them as they warm.</p>

        <h4 id="kg-image-prompt" data-section="image-prompt">Image Prompt</h4>

        <p>Watercolor of several small silver river fish laid on a bamboo mat, damp and glistening. Pale blue-green
        palette with hints of copper along the flanks. Gentle ripples suggested in wash behind them.</p>

        <h4 id="kg-used-in" data-section="used-in">Used In</h4>

        <p><em lang="ja-Latn">Auto-populated by reindex.</em></p>

        <h4 id="kg-dm-notes" data-section="dm-notes">DM Notes</h4>

        <p>The quintessential summer river fish. Tradition holds the very best ayu come from the upper Kinryūgawa in
        late Natsu. A master fisher can catch them bare-handed in shallow riffles; most use tackle or traditional
        cormorant fishing.</p>


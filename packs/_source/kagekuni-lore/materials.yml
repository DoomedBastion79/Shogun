        <h4 id="kg-description-player-facing" data-section="description-player-facing">Description (Player-Facing)</h4>

        <p>Small songbirds netted in cultivated fields and eaves of village houses. The meat is dark and intensely
        flavoured for its size, traditionally grilled whole on a skewer — head, bones, and all. A peasant&#39;s protein,
        eaten without ceremony.</p>

        <h4 id="kg-unidentified-description" data-section="unidentified-description">Unidentified Description</h4>

        <p>Tiny plucked birds the size of a thumb, arranged on skewers or in a small bundle. Dark reddish flesh, almost
        all bone.</p>

        <h4 id="kg-image-prompt" data-section="image-prompt">Image Prompt</h4>

        <p>Watercolor of small skewered birds grilled over faint ember glow, dark silhouettes against a warm orange
        blur. Minimal detail; texture of char and rising steam suggested.</p>


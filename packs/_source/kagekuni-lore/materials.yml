        <h5>Batsuboku — Timber Table</h5>

        <p><em lang="ja-Latn">Stub pending Mokuzai category build-out.</em> Sugi no Mori is one of the great timber
        biomes of Kagekuni — sugi (cedar) and kuromatsu (black pine) are the signature cuts — but individual Mokuzai
        entries are not yet catalogued in Part I. Until then, Batsuboku attempts in Sugi no Mori return structured
        quantities of &quot;cedar timber&quot; or &quot;black pine timber&quot; at the DM&#39;s narrative discretion,
        and the phase-4 Mokuzai pass will retrofit this table with proper entries (likely: Sugi-zai, Kuromatsu-zai,
        Kuromatsu-yani black pine resin, Suginoha aromatic needles, Taki-sanshō stream bamboo). A successful Batsuboku
        opportunity roll currently grants: 1 resource point = 1d4 board-feet of cedar or 1d3 of black pine, with an
        Aki-only chance of resin collection.</p>

        <h4 id="kg-tambo-rice-paddy-amp-farmland" data-section="tambo-rice-paddy-amp-farmland">Tambo 田んぼ — Rice Paddy
        &amp; Farmland</h4>

        <p>Managed agricultural land around and between settlements. Rice paddies, wheat fields, millet terraces,
        vegetable plots. The biome where most peasants earn their food and where a traveling party can legally forage
        only with the landowner&#39;s permission.</p>

        <p><strong>Biome Tier:</strong> Accessible (DC 10)

        <strong>Activities Supported:</strong> Saishū, Shuryō (paddy fish, waterfowl, vermin), Kaishū (after harvest or
        in abandoned fields)

        <strong>Seasonal Notes:</strong> Highly seasonal — Haru for young shoots, Natsu for growing season, Aki for
        harvest leavings, Fuyu mostly empty.

        <strong>Restrictions:</strong> Foraging on private farmland without permission is trespass and may carry legal
        consequences depending on province and season.

        <strong>Typical Yields:</strong> Paddy fish, waterfowl, field herbs, rice leavings, vegetable gleanings, waste
        grain.</p>

        <p><em lang="ja-Latn">Tables: TBD</em></p>

        <h4 id="kg-kawa-to-numa-river-amp-wetland" data-section="kawa-to-numa-river-amp-wetland">Kawa to Numa 川と沼 —
        River &amp; Wetland</h4>

        <p>The wide slow rivers of the lowland provinces — Midori, Tsuchikawa, Kinryugawa — along with their oxbow
        lakes, reed marshes, estuarine mouths, and seasonal floodplains. A rich gathering environment in summer, an
        impassable morass in winter thaw.</p>

        <p><strong>Biome Tier:</strong> Wild (DC 13); Accessible (DC 10) along established riverside paths

        <strong>Activities Supported:</strong> Saishū, Shuryō (fishing, waterfowl), Batsuboku (reeds, water willow)

        <strong>Seasonal Notes:</strong> Natsu peak for most yields; Haru runoff brings exceptional fishing; Aki
        mushroom flushes along banks; Fuyu frozen in northern stretches.

        <strong>Typical Yields:</strong> Freshwater fish, waterfowl, reeds, wetland herbs, river clay, lily root,
        aquatic mushrooms.</p>

        <p><em lang="ja-Latn">Tables: TBD</em></p>

        <h4 id="kg-fumoto-foothills" data-section="fumoto-foothills">Fumoto 麓 — Foothills</h4>

        <p>The transition zone between lowland and highland, covering the slopes of Sora, the approaches to Tsuchi&#39;s
        mountains, and the edges of the Tenchūsan Ren. The most-traveled biome for parties crossing provinces — every
        road between coastal lowland and mountain pass runs through Fumoto at some point.</p>

        <p><strong>Biome Tier:</strong> Wild (DC 13)

        <strong>Activities Supported:</strong> Saishū, Shuryō, Saikutsu (surface deposits), Batsuboku

        <strong>Seasonal Notes:</strong> All seasons productive except deep Fuyu at higher elevations. Fumoto is the
        archetypal travel-day biome — most parties will roll here more than anywhere else over the course of a campaign.

        <strong>Typical Yields:</strong> Mountain game, mixed forage, surface ore, mid-altitude herbs, hardwood timber,
        wild fruit.</p>

        <h5>Saishū — Foraging Table</h5>

        <p>Fumoto forage is broad rather than specialized — mixed hardwood, cut-grass meadows, scree slopes, and the
        occasional spring-fed basin. A lot of Kaze&#39;s middle-road herbs grow here, as do the cliff-face
        specialists.</p>


        <h4 id="kg-description-player-facing" data-section="description-player-facing">Description (Player-Facing)</h4>

        <p>Lean, dark-rose meat from the wild hares that populate Hokori&#39;s lower forests and upland meadows. The
        flavour is clean and faintly grassy — not gamey, not strong, but distinctly wild. A single hare feeds two
        travellers well with rice.</p>

        <h4 id="kg-unidentified-description" data-section="unidentified-description">Unidentified Description</h4>

        <p>A field-dressed small mammal, perhaps four to six pounds, pale rose flesh with darker muscle striping along
        the haunches. The smell is faint — clean meat, a trace of woodland soil.</p>

        <h4 id="kg-image-prompt" data-section="image-prompt">Image Prompt</h4>

        <p>Watercolor wash of a lean rose-pink cut of small game meat laid on a bamboo leaf. Muted earth palette —
        ochre, sage, umber. Soft edges, loose brushwork. No anatomical specificity; a suggestion of meat, not a
        butcher&#39;s diagram.</p>

        <h4 id="kg-used-in" data-section="used-in">Used In</h4>

        <p><em lang="ja-Latn">Auto-populated by reindex.</em></p>

        <h4 id="kg-dm-notes" data-section="dm-notes">DM Notes</h4>

        <p>Common throughout Hokori&#39;s forested provinces. Hunters set snares along known game trails in lower Fumoto
        and within any Satoyama. A Wisdom (Survival) check with trapper&#39;s tools yields the best results; bow hunting
        works at higher cost in time.</p>

        <hr>


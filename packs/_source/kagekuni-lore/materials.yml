        <h3 id="kg-cross-biome-tags" data-section="cross-biome-tags">Cross-Biome Tags</h3>

        <p>A cross-biome tag is <em lang="ja-Latn">not</em> a physical biome — it cannot be pointed to on a map and does
        not replace a biome entry on a material. It is a descriptor that modifies an existing biome to mark a distinct
        mode of presence. A material tagged with a cross-biome tag must <em lang="ja-Latn">also</em> carry a physical
        biome (Sugi no Mori, Kaigan, Haikyo, etc.); the tag identifies which subset of that biome&#39;s sites produce
        the yield.</p>

        <p>The gathering mechanic treats a tag as a tier escalator and a frequency gate: a cross-biome-tagged site is
        typically at least Hostile (DC 16) and often Otherworldly (DC 20), and such sites are rare enough that a party
        should feel finding one is an event, not a routine travel stop.</p>

        <h4 id="kg-spirit-touched" data-section="spirit-touched">Spirit-Touched (精霊触れ)</h4>

        <p>Sei flows visibly through a Spirit-Touched site. The tag covers any location where raw sei has pooled,
        lingered, or bled into the material world strongly enough to alter what grows, lives, and settles there.
        Examples of qualifying sites include: Progenitor caverns, active shrine pools, the Yōsei Mori&#39;s oldest
        hardwoods, the Seidōrin Mori interior, the Hoshimori Plateau during Hikarishō, and Ginryū-associated mineral
        sites. The tag does <em lang="ja-Latn">not</em> apply to routine shrine grounds — sei must be actively
        perceptible, not merely venerated.</p>

        <p><strong>Tier default:</strong> Otherworldly (DC 20) at the tagged site, regardless of the underlying
        biome&#39;s base tier. A Spirit-Touched Kaigan grotto is treated at DC 20 even though generic Kaigan is Wild.

        <strong>Activity effects:</strong> Yield tables for the underlying biome apply normally, but the Very Rare
        column (row 20) is considered <em lang="ja-Latn">thematically unlocked</em> at Spirit-Touched sites — a
        margin-15 opportunity roll at such a site is almost certain to produce a sei-resonant result.

        <strong>Restrictions:</strong> Most Spirit-Touched sites sit within another faction&#39;s claim (Forest of
        Spirits, Hoshimori seimasters, Dragon Clan shrine remnants) or under spirit-world attention. Unauthorized
        harvest frequently triggers consequences that land outside the gathering system — quests, curses, or direct
        response.

        <strong>DM guidance:</strong> Spirit-Touched is the mechanism by which a handful of materials (Ryūsō, Yūrei-kusa
        variants, Hoshimori silver-grass, Progenitor-cavern crystals) can appear across otherwise unrelated physical
        biomes without breaking the biome taxonomy. Use it sparingly — the tag loses meaning if every sei-active rock
        qualifies.</p>

        <h2 id="kg-named-beast-harvests" data-section="named-beast-harvests">Named Beast Harvests</h2>


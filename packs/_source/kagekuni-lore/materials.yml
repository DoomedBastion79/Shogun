        <h2 id="kg-kegawa-hides-pelts-amp-leather" data-section="kegawa-hides-pelts-amp-leather">Kegawa 毛皮 — Hides,
        Pelts &amp; Leather</h2>

        <p>The worked and unworked hides of Kagekuni&#39;s beasts. Deer leather for common armor, bear hide for the
        winter coats of mountain provinces, wolf pelts for the cloaks of warriors who can earn the right to wear them,
        and the rare spirit-touched hides that carry their own faint charge of sei. Kegawa work is a caste profession —
        tanners occupy a complicated social position, necessary but ritually impure — and the best leatherworkers are
        concentrated in communities that outsiders rarely visit. The distinction between raw pelt and finished leather
        matters both mechanically and economically: a raw hide is worth a tenth of a finished one, but finishing
        requires weeks of downtime and specialist tools.</p>

        <p>Kegawa is primarily a secondary-harvest category: almost every Niku entry with a mammalian source yields hide
        material as part of the butchering process. Routine hides (deer, boar, bear, fox) will be catalogued as the
        campaign surfaces specific needs; for now, Kegawa entries are reserved for named-beast harvests and sei-touched
        pelts where the material&#39;s identity matters enough to track individually.</p>

        <h3 id="kg-named-beast-harvests" data-section="named-beast-harvests">Named Beast Harvests</h3>

        <h4 id="kg-kami-no-kegawa-mountain-god39s-pelt" data-section="kami-no-kegawa-mountain-god39s-pelt">Ōkami no
        Kegawa (狼の毛皮) (Mountain God&#39;s Pelt)</h4>

        <p><strong>Category:</strong> Kegawa

        <strong>Rarity:</strong> 極上 Gokujō (single-grade-locked — nat-20 harvest)

        <strong>Source Type:</strong> One-time harvest — Yama-no-Ōkami

        <strong>Biomes:</strong> N/A (harvested from the Yama-no-Ōkami during the Fushichō ashfall, Tenchūsan Ren
        mountain pass)

        <strong>Seasons:</strong> N/A (one-time harvest)

        <strong>Yield:</strong> 1 primary pelt (back and flanks) + 2 secondary sections (belly and limbs)

        <strong>Weight:</strong> 100 lb primary section; 35 lb each secondary section

        <strong>Base Value:</strong> 400–600 gp for the primary pelt raw; 1,200+ gp if commissioned into a finished
        cloak by a master leatherworker. Secondary sections: 80–120 gp each raw.

        <strong>Preservation:</strong> Indefinite if properly cured and stored cool and dry. Requires specialist
        leatherworker for finishing (weeks of downtime work).

        <strong>Tool Proficiency:</strong> Leatherworker&#39;s tools for curing and finishing; ceremonial stitching
        requires a master, not a journeyman

        <strong>Restrictions:</strong> Single-grade-locked. This entry does not follow the standard
        Nami/Jō/Tokujō/Gokujō grade progression — the nat-20 harvest check locked the pelt at 極上 Gokujō at the moment of
        butchering, and no lesser grade exists for this material.</p>

        <h4 id="kg-description-player-facing" data-section="description-player-facing">Description (Player-Facing)</h4>

        <p>A single enormous pelt taken from the back, flanks, and shoulders of the beast. The fur is silver-grey at the
        roots and deepens to charcoal at the tips, dense enough to turn a winter wind and long enough at the ruff that a
        man could bury both hands to the wrist in it. In low light the guard hairs catch a faint cool sheen — not
        luminous, but suggestive, the way frost catches starlight. Two further sections — one from the belly, one
        stitched from the limb hide — come off cleaner than any hunter could reasonably expect, bringing the total
        usable pelt to something well beyond a single cloak.</p>

        <h4 id="kg-unidentified-description" data-section="unidentified-description">Unidentified Description</h4>

        <p>An enormous wolf pelt, silver-grey shading to charcoal, far larger than any ordinary wolf should grow. The
        fur is dense and heavy, catches the light oddly in dim rooms, and carries a faint cold smell of mountain
        stone.</p>

        <h4 id="kg-image-prompt" data-section="image-prompt">Image Prompt</h4>

        <p>An immense silver-grey and charcoal wolf pelt laid flat on a dark wooden cutting-bench, ruff thick enough to
        bury a hand in, guard hairs catching a faint cool sheen in low candlelight; beside it two smaller pelt sections
        (belly, limbs); feudal Japanese leatherworker&#39;s workshop with shoji walls and tatami, soft indirect light,

        <h2 id="kg-chmiry-seasonings-amp-fermented-goods" data-section="chmiry-seasonings-amp-fermented-goods">Chōmiryō
        調味料 — Seasonings &amp; Fermented Goods</h2>

        <p>Salt, miso, soy sauce, vinegar, rice wine for cooking, dried spice blends, fermented pastes, pickled
        vegetables. The backbone of every Kagekuni kitchen and the element that most distinguishes regional cooking. A
        Mizu fisherman&#39;s stew and a Tsuchi farmer&#39;s stew may share every other ingredient and still taste
        nothing alike because of the Chōmiryō applied. Fermentation is considered a sacred art — the kōji mold that
        underpins miso, soy sauce, sake, and a dozen other staples is sometimes described as a gift of the kami, and an
        old fermentation house is tended like a shrine.</p>

        <p><strong>並 Nami — Common</strong></p>


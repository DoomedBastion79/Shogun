        component is exhausted, strike it through here but leave the Part I entry intact for historical reference.</p>

        <p><strong>Skill-check knowledge.</strong> The non-food components (Kegawa and Hone categories) each carry
        DM-only Religion / Nature / Arcana reveal thresholds. See the DM Notes block of each individual component entry
        for the specific DCs and what each check reveals. A natural 20 on any one check reveals the information across
        all three skills for that component.</p>

        <p><strong>The Reikokoro.</strong> The Spirit Heart is unique even among the Yama-no-Ōkami components — it is
        the only entry in the entire harvest catalogued at the <strong>Legendary</strong> tier rather than 極上 Gokujō. It
        feeds up to six generously from a single preparation and is suitable for a Masterwork dish. Religion, Nature,
        and Arcana reveals on the Reikokoro are documented with the Niku entry and should be read before the party
        considers consuming it.</p>

        <hr>

        <h2 id="kg-appendix-document-maintenance" data-section="appendix-document-maintenance">Appendix — Document
        Maintenance</h2>

        <p><strong>Source of truth.</strong> This file is canonical. When conflicts arise between materials.md and other
        files (recipes.md, lore-index.md, campaign-state.md, the Sanzai Campaign Guide), this file wins for material
        definitions and gathering mechanics.</p>

        <p><strong>Reindex integration.</strong> The <code>reindex</code> skill is responsible for rebuilding the
        &quot;Used In&quot; section of each Part I entry by crawling <code>core/recipes.md</code> and any future split
        recipe files. This section is regenerated on every reindex pass. Do not edit Used In manually.</p>

        <p><strong>Foundry export.</strong> When a Foundry export pipeline is built, it will read Part I entries and
        generate four item definitions per graded material (Path D). The Grade Variants sub-block reserves the Foundry
        item ID slots. Player-facing fields (Description, Unidentified Description, Image Prompt) become the item&#39;s
        visible properties. DM Notes are excluded from export.</p>

        <p><strong>Schema evolution.</strong> If the Part I entry schema changes, all existing entries must be updated
        in the same pass to maintain consistency. A schema change without a full sweep is a source-of-truth
        corruption.</p>

        <p><strong>Knowledge tier enforcement.</strong> Never surface [DISCOVERABLE] or [SEALED] content in
        player-facing fields. The description and unidentified description fields are exports; DM Notes is the only safe
        home for tiered content.</p>

        </section>

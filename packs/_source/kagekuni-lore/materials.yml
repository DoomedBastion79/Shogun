        <tr>

        <td>Natural 20 (with bonus d10 per house rule)</td>

        <td>+1 bonus point</td>

        <td>Unlocks the Very Rare column of the yield table.</td>

        </tr>

        <tr>

        <td>Total of 40+</td>

        <td>—</td>

        <td>Unlocks Legendary yields where the table supports them. Most biome tables do not carry Legendary tiers;
        Legendary materials are usually tied to named-beast harvests in the dedicated section below.</td>

        </tr>

        </tbody></table>

        <p><strong>Attempts per rest cycle.</strong> A character may make one gathering attempt per short rest and a
        maximum of two per long rest. If the party is traveling the same day, the maximum drops to one per long rest.
        Each attempt takes one in-world hour of focused effort.</p>

        <p><strong>Multiple activities per day.</strong> A character may pursue a different activity on a second attempt
        — morning hunt, afternoon forage — and each is rolled separately. An exceptional morning does not carry over
        into the afternoon. A character may not pursue the same activity twice in the same day in the same biome (the
        area is already worked); a second attempt must either be a different activity or a different biome.</p>

        <p><strong>Party gathering.</strong> Multiple characters may gather simultaneously, each rolling their own
        opportunity roll. Characters may use the Help action to grant advantage to a companion&#39;s opportunity roll in
        place of their own attempt, which is often the right play when one character is significantly more skilled than
        the others.</p>

        <h3 id="kg-stage-3-the-yield-roll" data-section="stage-3-the-yield-roll">Stage 3 — The Yield Roll</h3>

        <p>For each resource point, the character rolls a d20 on the relevant biome-activity-season table in the Biomes
        of Kagekuni section below. Results are organized by rarity column:</p>

        <ul>

        <li><strong>1–10 → Common</strong></li>

        <li><strong>11–17 → Uncommon</strong></li>

        <li><strong>18–19 → Rare</strong></li>

        <li><strong>20 → Very Rare</strong> (only if the Very Rare column is unlocked by the opportunity roll; otherwise
        re-roll as Rare)</li>

        </ul>

        <p>If the biome, activity, or season combination is not supported, the attempt returns nothing — Saikutsu in an
        open wetland, Batsuboku on a volcanic glass field. Each biome entry lists which activities are supported and in
        which seasons.</p>

        <p>Yield entries are written as links to Part I material entries, with the per-roll quantity specified. For
        example, an entry might read: <em lang="ja-Latn">&quot;<a href="#mountain-sage">Mountain Sage</a> — 1d4
        bundles&quot;</em>, meaning the character rolls 1d4 to determine how many bundles this single resource point
        produced, and receives that many instances of Mountain Sage with the grade determined by the opportunity roll
        margin.</p>

        <h2 id="kg-grade-at-the-point-of-harvest" data-section="grade-at-the-point-of-harvest">Grade at the Point of
        Harvest</h2>

        <p>Every material produced by a gathering attempt receives a grade, determined by the margin of the opportunity
        roll that produced it:</p>

        <table>

        <thead>

        <tr>

        <th>Opportunity Roll Margin</th>

        <th>Grade</th>

        </tr>

        </thead>

        <tbody><tr>

        <td>Meet DC to DC + 4</td>

        <td>並 Nami — Run-of-the-mill. Standard sample, no bonus, −2 craft modifier.</td>

        </tr>

        <tr>

        <td>DC + 5 to DC + 9</td>

        <td>上 Jō — Clean and standard. Baseline craft material, +0 modifier.</td>

        </tr>

        <tr>

        <td>DC + 10 to DC + 14</td>

        <td>特上 Tokujō — High-purity. Notable sample, +2 craft modifier, value ×1.5.</td>

        </tr>

        <tr>

        <td>DC + 15 or more</td>

        <td>極上 Gokujō — Legendary bloom. The kind of sample master craftsmen remember, +5 or advantage on craft check,
        value ×2.5.</td>

        </tr>

        </tbody></table>

        <p><strong>Natural 20 rule.</strong> A natural 20 on the opportunity roll <em lang="ja-Latn">always</em>
        produces at least one 特上 sample from that attempt, regardless of total margin. The luck goes into finding an
        exceptional specimen rather than just extra quantity.</p>

        <p><strong>Per-Foundry-item implementation.</strong> Each grade corresponds to a separate item definition in
        Foundry (Path D). When a character produces a 特上 Iron Ore on their roll, they receive the &quot;Iron Ore
        (特上)&quot; item in their inventory — not a generic Iron Ore with a grade tag. Part I entries list all four grade
        variants in their Grade Variants sub-block with reserved Foundry item IDs.</p>

        <p><strong>Legendary and Artifact materials.</strong> Most Legendary and Artifact materials do not use the
        four-grade variant system. They exist as a single canonical grade (usually 極上 or a fixed Legendary designation)
        because they are tied to specific sources — a Progenitor dragon&#39;s scale, the heart of a slain named beast, a
        sample from a unique location — and rolling quality on them makes no narrative sense. Individual entries
        specify.</p>

        <h2 id="kg-failure-modes-gathering" data-section="failure-modes-gathering">Failure Modes — Gathering</h2>

        <p>When an opportunity roll fails, the character spent an hour of field time for nothing — and possibly worse.
        The consequence scales with biome tier.</p>

        <table>

        <thead>

        <tr>

        <th>Biome Tier</th>

        <th>On Failure</th>

        <th>On Critical Failure (natural 1)</th>

        </tr>

        </thead>

        <tbody><tr>

        <td>Accessible</td>

        <td>1 hour lost, no yield.</td>

        <td>1 hour lost + minor setback — insect bites, torn clothing, a sprained wrist (disadvantage on next physical
        check).</td>

        </tr>

        <tr>

        <td>Wild</td>

        <td>1 hour lost + minor complication — bad weather, route unclear, small tool damaged, scavengers in the
        area.</td>

        <td>1 hour lost + tool loss — herbalism kit contaminated, miner&#39;s pick snapped, fishing line cut,
        carpenter&#39;s blade chipped.</td>

        </tr>

        <tr>

        <td>Hostile</td>

        <td>1 hour lost + weather, terrain, or wildlife complication.</td>

        <td>1 hour lost + hostile encounter — a CR-appropriate creature drawn by the noise, the smell of blood, or the
        disturbance to its territory.</td>

        </tr>

        <tr>

        <td>Otherworldly</td>

        <td>1 hour lost + sei backlash — disadvantage on the next saving throw, eerie attention from unseen watchers, a
        minor dissociative effect that passes after a short rest.</td>

        <td>1 hour lost + major complication — spirit attention from a territorial entity, a cursed or tainted yield
        that looks valuable but carries a hidden cost, or a CR+2 encounter with something that considers the
        character&#39;s presence an offense.</td>

        </tr>

        </tbody></table>

        <p>The DM is encouraged to narrate failures as story beats, not dead ends. The hour is already spent — use it to
        advance something.</p>

        <h2 id="kg-failure-modes-crafting" data-section="failure-modes-crafting">Failure Modes — Crafting</h2>

        <p>When a craft check fails, the consequence depends on the rarity of the item being made. Lower-tier items are
        forgiving; higher-tier items are not.</p>

        <ul>

        <li><strong>Common result</strong> — Materials recoverable on failure. The character can try again without cost
        beyond the time spent.</li>

        <li><strong>Uncommon result</strong> — Half the materials consumed on failure; the other half salvageable for
        another attempt.</li>

        <li><strong>Rare result</strong> — Most materials consumed on failure. One key component may survive at the
        DM&#39;s discretion, usually tied to a good roleplay moment or a clever use of tools.</li>

        <li><strong>Very Rare result</strong> — Materials fully consumed on failure. The character must re-gather before
        trying again.</li>

        <li><strong>Legendary result</strong> — Failure destroys all materials <em lang="ja-Latn">and</em> may damage or
        destroy the tools used. A failed legendary craft is a genuine disaster, narratively and mechanically. The
        character may suffer reputation or honor consequences.</li>

        <li><strong>Artifact result</strong> — Materials destroyed, tools destroyed or permanently damaged, and the
        character may suffer a significant narrative consequence: honor loss, spirit backlash, or a lingering curse tied
        to the wasted material.</li>

        </ul>

        <p><strong>Critical failures</strong> (natural 1) on craft checks at Rare or above may trigger additional
        effects at the DM&#39;s discretion — a tainted item that looks successful until used, a cursed result, or a
        partial success with a hidden flaw that only reveals itself in play.</p>

        <h2 id="kg-seasons-of-kagekuni" data-section="seasons-of-kagekuni">Seasons of Kagekuni</h2>

        <p>The gathering system uses four seasons plus a set of named seasonal events that transform specific biomes
        temporarily.</p>

        <ul>

        <li><strong>Haru 春 — Spring.</strong> Budding, young growth, the first fish runs, mountain snowmelt, the opening
        of foraging season after winter dormancy. Many herbs and wild vegetables are at their most potent in spring.
        Saishū is productive everywhere; Shuryō is lean until mid-spring when game emerges.</li>

        <li><strong>Natsu 夏 — Summer.</strong> Peak growth, abundance, long days, the heavy rains of tsuyu-no-toki (the
        rainy window of early summer). Mushroom flushes follow the rains; game is fat and plentiful; the mountain herbs
        set seed. The best season for most gathering activities in most biomes.</li>

        <li><strong>Aki 秋 — Autumn.</strong> Harvest, rutting season, the falling of bronze and copper leaves in the
        Seidorin. Kegawa is at its best in autumn when pelts are thick for the coming winter; the final mushroom flushes
        of the year; the last herbs before dormancy. Hunting is exceptional.</li>

        <li><strong>Fuyu 冬 — Winter.</strong> Dormancy and scarcity. Preserved stores matter most. Saikutsu and
        Batsuboku are actually <em lang="ja-Latn">easier</em> in winter because vegetation is reduced and access is
        clearer; Shuryō is harder because animals are wary, hibernating, or gone; Saishū is nearly impossible in most
        biomes. Some alpine and sei-touched biomes have winter-only yields.</li>

        </ul>

        <h3 id="kg-seasonal-events" data-section="seasonal-events">Seasonal Events</h3>

        <p>Certain biomes transform during named in-world events. These are catalogued here and referenced in the
        individual biome entries below.</p>

        <ul>

        <li><strong>Hikarishō 光祥 — The Dragon Aurora.</strong> Celestial alignment that produces unique sei conditions
        across the entire archipelago. During Hikarishō, certain Very Rare materials become temporarily gatherable that
        are otherwise impossible to find. Hoshimori Kōgen is the most affected biome; secondary effects touch Yōrin and
        Kazan. Predictable — seimasters at Hoshino Tō can calculate the window.</li>

        <li><strong>Tatsunami 龍波 — Dragon Wave Season.</strong> Nami province phenomenon during which storm swells
        overwash coastal roads and villages. Standard Kaigan gathering is impossible on Nami&#39;s outer coast during
        this window, but the Stormwatch Cliffs produce unique weather-sei materials for those willing to brave the
        storms. Dangerous — Hostile biome tier during Tatsunami regardless of the normal rating.</li>

        <li><strong>Nagaikage 長影 — The Long Shadow.</strong> A late-autumn Kusa phenomenon during which the Whispering
        Flats grow silent in a way locals say allows the dead to speak. Murasaki-hara yields shift — certain grasses and
        night-blooming plants become gatherable that are otherwise dormant, and some carry spirit-touched properties.
        Requires local knowledge to exploit; strangers rarely time it right.</li>

        <li><strong>Compound Low Tide.</strong> A recurring coastal event driven by Kagekuni&#39;s four-moon tidal
        system. At compound low tide, the Shirakawa Estuary flats extend for miles, the Tidal Caves of Umigakure become
        accessible, and the Serenia-kai&#39;s shoreline retreats several hundred meters. Kaigan and Uchi-umi yields are
        exceptional during these windows — materials visible that are normally underwater. The timing is predictable and
        published in almanacs.</li>

        </ul>

        <p>Additional seasonal events will be added to this section as the campaign surfaces them.</p>

        <h2 id="kg-the-five-activities-tool-details" data-section="the-five-activities-tool-details">The Five Activities
        — Tool Details</h2>

        <p>A brief reference on tool proficiencies and what each activity expects.</p>

        <p><strong>Saishū 採集</strong> — Herbalism kit grants full opportunity roll with normal advantage rules. Without
        the kit, a character may still forage but rolls with disadvantage on the opportunity roll. Without <em
        lang="ja-Latn">any</em> tool, the character can still gather the most obvious surface materials (nuts, berries,
        obvious mushrooms) at Accessible-tier biomes only, and cannot grade higher than 並 Nami.</p>

        <p><strong>Shuryō 狩猟</strong> — Any weapon the character is proficient with. Hunting uses different weapons than
        fishing — a hunter needs bow or spear; a fisher needs line or net. Specialist equipment (falconry glove, hunting
        dog, trap kit) may grant advantage at DM discretion when used in the right biome.</p>

        <p><strong>Saikutsu 採掘</strong> — Miner&#39;s tools (mattock, pick, chisel, wedge) grant full roll. Improvised
        tools impose disadvantage and cannot produce higher than 上 Jō. Specialist equipment (sei-conductive pick,
        dwarven stoneworking kit) may grant advantage in specific biomes.</p>

        <p><strong>Batsuboku 伐木</strong> — Woodcarver&#39;s or carpenter&#39;s tools. An axe alone is sufficient for
        basic timber but cannot produce higher than 上 Jō; full tool kits are required for 特上 and above. A
        woodcarver&#39;s tools are preferred for specialty materials (sei-bark stripping, sap collection);
        carpenter&#39;s tools for structural lumber.</p>

        <p><strong>Kaishū 回収</strong> — No tool required, but specialized tools (a torch, a crowbar, a bone saw for
        scavenging battlefields) may grant advantage in context. The Investigation skill is the core requirement;
        without proficiency in Investigation, the character may still scavenge but rolls with disadvantage.</p>

        <h2 id="kg-source-types" data-section="source-types">Source Types</h2>

        <p>Beyond the five gathering activities, Part I entries may list a sixth source type:
        <strong>Purchased</strong>. This is used for materials that exist in the economy but are not practical to gather
        in the field — imports from other islands, materials that require industrial-scale processing, or goods
        controlled by merchant guilds. A Purchased material has no biome or season entries and instead lists the
        settlements, markets, or trade routes where it is available. Purchased materials never receive grades from
        gathering rolls; if they are graded at all, the grade is set by the source vendor and reflected in the
        price.</p>

        <h2 id="kg-biomes-of-kagekuni" data-section="biomes-of-kagekuni">Biomes of Kagekuni</h2>

        <p>This section catalogues the gatherable biomes of the Kagekuni archipelago, drawn from the canonical
        geography. Each entry describes the biome, lists the activities supported, notes which seasons are productive or
        unproductive, identifies any restrictions or hazards, and houses the yield tables used during play.</p>

        <p>Biomes are grouped into three tiers: <strong>Core</strong> (common biomes every party will hit),
        <strong>Distinctive</strong> (unique biomes with specialized yields), and <strong>Periphery</strong> (stubbed
        for future build-out).</p>

        <p><strong>Phase 3 status.</strong> Yield tables have been built for the three priority biomes the current
        campaign is most likely to hit: <strong>Sugi no Mori</strong>, <strong>Fumoto</strong>, and
        <strong>Haikyo</strong> (including the Oryuzan Tenku-ji site-specific sub-table). Other biomes carry
        <code>*Tables: TBD*</code> placeholders and will be built as the party approaches them.</p>

        <p><strong>Biome nomenclature.</strong> All Part I and Part II entries use the canonized Japanese biome names
        listed in this section. During Phase 2 migration, early entries briefly used descriptive English aliases; these
        were swept and normalized in Phase 4. The canonical alias map is preserved in <code>dm/skill-reference.md</code>
        for any external notes that may still reference the old naming. Any future ingest from external sources should
        be normalized on import.</p>

        <h3 id="kg-core-biomes" data-section="core-biomes">Core Biomes</h3>

        <h4 id="kg-kaigan-coastal-edge" data-section="kaigan-coastal-edge">Kaigan 海岸 — Coastal Edge</h4>

        <p>Headlands, beaches, tidal flats, estuaries, sea caves, and the rugged shorelines of Mizu, Nami, and Hana. The
        boundary between Kagekuni and the Raijin no Fukai sea. Compound low tides expose materials normally
        submerged.</p>

        <p><strong>Biome Tier:</strong> Wild (DC 13)

        <strong>Activities Supported:</strong> Saishū, Shuryō, Kaishū

        <strong>Seasonal Notes:</strong> All seasons productive; exceptional yields during Compound Low Tide events.
        Tatsunami makes Nami coast temporarily Hostile.

        <strong>Typical Yields:</strong> Shellfish, seaweed, sea salt, driftwood, coastal herbs, shore game, wrecked
        cargo.</p>

        <p><em lang="ja-Latn">Tables: TBD (Phase 3 or later)</em></p>

        <h4 id="kg-satoyama-village-forest" data-section="satoyama-village-forest">Satoyama 里山 — Village Forest</h4>

        <p>The managed coppice-edge between settlement and wilderness. The ambient biome around nearly every Kagekuni
        village. Regular foot traffic keeps the biome thin but accessible; traditional village knowledge keeps
        productive areas productive.</p>

        <p><strong>Biome Tier:</strong> Accessible (DC 10)

        <strong>Activities Supported:</strong> Saishū, Shuryō (small game only), Batsuboku (coppiced wood)

        <strong>Seasonal Notes:</strong> Productive in Haru, Natsu, Aki; poor in Fuyu.

        <strong>Typical Yields:</strong> Bamboo, small game (rabbit, fowl), common herbs, mushrooms after rain,
        firewood.</p>

        <p><em lang="ja-Latn">Tables: TBD</em></p>

        <h4 id="kg-sugi-no-mori-deep-cedar-forest" data-section="sugi-no-mori-deep-cedar-forest">Sugi no Mori 杉の森 — Deep
        Cedar Forest</h4>

        <p>Ancient dense cedar and black pine forest, canopy so thick that sunlight reaches the floor only in scattered
        shafts. The signature biome of Kaze province, with smaller stretches in Kusa and the Tenchūsan Ren foothills.
        Mist is constant; navigation relies on landmark and feel more than sight.</p>

        <p><strong>Biome Tier:</strong> Wild (DC 13)

        <strong>Activities Supported:</strong> Saishū, Shuryō, Batsuboku

        <strong>Seasonal Notes:</strong> All seasons productive; Kinoko flush best in Natsu after rain (advantage on the
        yield roll within 24 hours of a rainfall); Kegawa best in Aki (hunters automatically trade up one yield column
        when the Aki rut is active); Fuyu passable but game scattered.

        <strong>Typical Yields:</strong> Large game (deer, boar, occasional bear), rare shade-loving mushrooms, cedar
        timber, black pine resin, shaded herbs.</p>


        <h2 id="kg-appendix-document-maintenance" data-section="appendix-document-maintenance">Appendix — Document
        Maintenance</h2>

        <p><strong>Source of truth.</strong> <code>items/materials.json</code> is canonical for individual material
        definitions (names, rarities, values, descriptions, grades, DM notes). This file
        (<code>core/materials.md</code>) is canonical for gathering mechanics (Part II) and category worldbuilding
        context. When conflicts arise, the JSON wins for material data; this file wins for mechanics.</p>

        <p><strong>Foundry export.</strong> The Foundry pipeline reads <code>items/materials.json</code> and generates
        four item definitions per graded material via <code>build-material.mjs</code>. Player-facing fields
        (description, unidentifiedDescription, imagePrompt) become the item&#39;s visible properties. DM notes are
        excluded from export.</p>

        <p><strong>Schema evolution.</strong> If the materials.json schema changes, all existing entries must be updated
        in the same pass to maintain consistency. A schema change without a full sweep is a source-of-truth
        corruption.</p>

        <p><strong>Knowledge tier enforcement.</strong> Never surface [DISCOVERABLE] or [SEALED] content in
        player-facing fields. The description and unidentifiedDescription JSON fields are exports; dmNotes is the only
        safe home for tiered content.</p>

        </section>

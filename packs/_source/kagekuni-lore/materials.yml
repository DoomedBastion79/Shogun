        <h5>Saikutsu — Mining Table</h5>

        <p><em lang="ja-Latn">Stub pending Kōseki category build-out.</em> Fumoto surface deposits are rarely
        world-class but consistently productive — iron ore, copper traces, clay beds, river gravel gold, and the odd
        surfaced gem that washed down from higher country. A successful Saikutsu opportunity roll currently grants: 1
        resource point = 1d4 lb raw iron ore or 1d3 lb copper or clay at the DM&#39;s narrative discretion, with rare
        chances for surfaced silver or placer gold in Tsuchi-adjacent foothills. The Phase 4 Kōseki pass will retrofit
        this table with proper entries.</p>

        <h5>Batsuboku — Timber Table</h5>

        <p><em lang="ja-Latn">Stub pending Mokuzai category build-out.</em> Fumoto timber is the mixed-hardwood
        workhorse — oak, maple, hornbeam, and lower-altitude cedar — and the most commonly cut wood in Kagekuni after
        coppiced Satoyama bamboo. A successful Batsuboku opportunity roll currently grants: 1 resource point = 1d4
        board-feet of mixed hardwood, 1d3 of workable oak, or 1d2 of maple. Phase 4 will retrofit this table.</p>

        <h4 id="kg-takane-alpine-peaks" data-section="takane-alpine-peaks">Takane 高嶺 — Alpine Peaks</h4>

        <p>The high mountain biome of Sora, the Tenchūsan Ren, the Kazeyama Ren, and Kurogane Yama&#39;s upper slopes.
        Thin air, exposed rock, stunted vegetation, and game adapted to altitude. Winter makes most of Takane
        impassable; summer opens brief windows for exceptional finds.</p>

        <p><strong>Biome Tier:</strong> Hostile (DC 16)

        <strong>Activities Supported:</strong> Saishū (alpine herbs), Shuryō (mountain goat, eagle, rare yaks), Saikutsu
        (exposed ore veins)

        <strong>Seasonal Notes:</strong> Natsu is the productive window; Aki becomes dangerous; Fuyu and Haru are
        impassable except for experienced climbers with equipment.

        <strong>Typical Yields:</strong> Alpine herbs, goat and eagle meat, exposed-vein ore, bone and horn from
        mountain beasts, rare cold-adapted mushrooms.</p>

        <p><em lang="ja-Latn">Tables: TBD</em></p>

        <h3 id="kg-distinctive-biomes" data-section="distinctive-biomes">Distinctive Biomes</h3>

        <h4 id="kg-seidorin-bronze-wood-forest" data-section="seidorin-bronze-wood-forest">Seidorin 青銅林 — Bronze Wood
        Forest</h4>

        <p>The ancient metallic-barked woodland of western Hana. Trees with bark of burnished bronze that chime faintly
        in the wind and shed their copper leaves in a single night when temperature drops below threshold. Unique
        endemic flora and fauna. Harvest is regulated by Clan Kaminari under capital-offense penalty.</p>

        <p><strong>Biome Tier:</strong> Otherworldly (DC 20)

        <strong>Activities Supported:</strong> Saishū, Shuryō, Batsuboku (license only)

        <strong>Seasonal Notes:</strong> Exceptional Aki yields during the leaf-fall event; otherwise modest but always
        unique.

        <strong>Restrictions:</strong> Unlicensed harvest is a capital offense. Licensed harvest is available only to
        clan-approved parties under supervision. Penalties apply even for accidental damage.

        <strong>Typical Yields:</strong> Bronze-bark timber (licensed only), copper-leaf material, rare endemic herbs
        and fungi, unique beast products from the silent-canopy fauna.</p>

        <p><em lang="ja-Latn">Tables: TBD</em></p>

        <h4 id="kg-yrin-spirit-touched-woodland" data-section="yrin-spirit-touched-woodland">Yōrin 妖林 — Spirit-Touched
        Woodland</h4>

        <p>The sei-active ancient woodland of the Yosei Mori and similar scattered sites. Navigation is unreliable — the
        forest itself resists mapping. Creatures in deeper reaches show elevated intelligence. The Forest of Spirits
        faction maintains sanctuaries within.</p>

        <p><strong>Biome Tier:</strong> Otherworldly (DC 20)

        <strong>Activities Supported:</strong> Saishū, Shuryō (with caution — some game here is aware of you), Kaishū
        (old shrines and forgotten cairns)

        <strong>Seasonal Notes:</strong> Sei conditions shift with the seasons unpredictably. Certain materials appear
        only during specific moon phases.

        <strong>Restrictions:</strong> The Forest of Spirits may consider outsiders&#39; gathering as trespass and
        respond accordingly. Local guides are strongly recommended.

        <strong>Typical Yields:</strong> Sei-infused herbs and fungi, spirit-touched water, rare wood from
        older-than-mapped trees, memory-fragments (Kaishū only, rare).</p>

        <p><em lang="ja-Latn">Tables: TBD</em></p>

        <h4 id="kg-murasaki-hara-violet-grasslands" data-section="murasaki-hara-violet-grasslands">Murasaki-hara 紫原 —
        Violet Grasslands</h4>

        <p>The tall indigo grasslands of Kusa&#39;s interior, including the Whispering Flats. Grass grows chest-high and
        endemic violet and deep-blue flora gives the landscape its unique character. Exposed and open; navigation easy
        except in fog.</p>

        <p><strong>Biome Tier:</strong> Wild (DC 13); deep interior and Whispering Flats Hostile (DC 16)

        <strong>Activities Supported:</strong> Saishū, Shuryō

        <strong>Seasonal Notes:</strong> Natsu peak for most flora; Nagaikage (late Aki) transforms the Whispering Flats
        and enables spirit-touched gathering.

        <strong>Typical Yields:</strong> Violet grass and indigo flora, plains game, wind-seeded mushrooms, rare
        night-blooming plants (Nagaikage only).</p>

        <p><em lang="ja-Latn">Tables: TBD</em></p>

        <h4 id="kg-kazan-volcanic-slopes" data-section="kazan-volcanic-slopes">Kazan 火山 — Volcanic Slopes</h4>

        <p>The fire-province biome of Hi — Enshiyama&#39;s active slopes, the Kuroso obsidian fields, fumarole vents,
        and thermal rivers. Deadly and abundant in equal measure. Obsidian of exceptional quality, sulfur deposits,
        thermal-dwelling fish, fire-touched flora. Includes the hot springs sub-area as a distinct yield source.</p>

        <p><strong>Biome Tier:</strong> Hostile (DC 16); Kazan summit and obsidian fields Otherworldly (DC 20)

        <strong>Activities Supported:</strong> Saishū (fire-touched herbs, rare), Shuryō (thermal-dwelling fish,
        volcanic-adapted game), Saikutsu (obsidian, sulfur, rare metals)

        <strong>Seasonal Notes:</strong> Year-round productive but winter makes approach easier (no vegetation) and
        summer more dangerous (increased volcanic activity).

        <strong>Restrictions:</strong> Obsidian harvest in Kuroso is claimed by local clans; unauthorized extraction may
        provoke response.

        <strong>Typical Yields:</strong> Obsidian (blade-grade), sulfur, thermal salts from hot springs, fire-touched
        herbs, thermal fish, rare volcanic ores.</p>

        <p><em lang="ja-Latn">Tables: TBD</em></p>

        <h4 id="kg-hoshimori-kgen-star-keeper39s-plateau" data-section="hoshimori-kgen-star-keeper39s-plateau">Hoshimori
        Kōgen 星守高原 — Star Keeper&#39;s Plateau</h4>

        <p>The unique high plateau of central Sora, home to the Golden Age observatories and the silver-grass fields
        that catch light differently from anywhere else in the archipelago. Star-touched flora grows only here. The
        single most-affected biome during Hikarishō.</p>

        <p><strong>Biome Tier:</strong> Otherworldly (DC 20)

        <strong>Activities Supported:</strong> Saishū (only — nothing else is productive here)

        <strong>Seasonal Notes:</strong> All seasons have some yield; Hikarishō window produces materials found nowhere
        else in Kagekuni and unlocks Very Rare and above on the table.

        <strong>Restrictions:</strong> The seimaster community at Hoshimori may regard unsupervised gathering as
        interference with research. Respectful visits are welcomed; extractive harvest is not.

        <strong>Typical Yields:</strong> Silvered grasses, star-touched herbs, moon-water from plateau springs, unique
        sei-resonant flora. During Hikarishō: materials that exist only in the aurora-lit soil, some of which are
        Artifact-tier.</p>

        <p><em lang="ja-Latn">Tables: TBD</em></p>

        <h4 id="kg-uchi-umi-inland-sea-serenia-kai" data-section="uchi-umi-inland-sea-serenia-kai">Uchi-umi 内海 — Inland
        Sea (Serenia-kai)</h4>

        <p>The vast inland sea of Hana, covering more than a thousand square miles, fed by twenty-five rivers and
        thirteen waterfalls. Its surface shifts color with the seasons, and compound low tides retreat the shoreline by
        hundreds of meters, exposing a tidal floor unique in the archipelago.</p>

        <p><strong>Biome Tier:</strong> Wild (DC 13); Compound Low Tide windows Accessible (DC 10) for easy gathering

        <strong>Activities Supported:</strong> Saishū (shoreline and exposed floor), Shuryō (fishing, waterfowl), Kaishū
        (during compound low tide — exposed wrecks and sealed caves)

        <strong>Seasonal Notes:</strong> Color-shift seasons produce unique phenomena; Compound Low Tide events are the
        gathering prime windows.

        <strong>Typical Yields:</strong> Brackish fish, freshwater fish, waterfowl, exposed-floor shellfish,
        moon-touched water plants, rare finds from compound-tide-exposed shrines.</p>

        <p><em lang="ja-Latn">Tables: TBD</em></p>

        <h3 id="kg-periphery-biomes" data-section="periphery-biomes">Periphery Biomes</h3>

        <p>Biomes below are canonized but not yet built out. They will receive full treatment as the campaign approaches
        them.</p>

        <h4 id="kg-haikyo-ruins" data-section="haikyo-ruins">Haikyo 廃墟 — Ruins</h4>

        <p><strong>Promoted to core biome in the Phase 2 materials rework</strong> — the party is currently working in
        the Oryuzan Tenku-ji ruin, and this biome has received its full table build as part of Phase 3.</p>

        <p>Haikyo is the scavenging biome — abandoned temples, collapsed observatories, ruined fortresses, pre-imperial
        sites, burned villages, the Buried Road of Tsuchi, the forgotten outposts of the Dark Ages. Each ruin has its
        own character, and the Kaishū activity here is far more than picking through rubble — it is historical recovery,
        sometimes archaeology, sometimes grave-robbing depending on perspective.</p>

        <p><strong>Biome Tier:</strong> Variable by site — most ruins Wild (DC 13); sei-touched or actively haunted
        ruins Hostile (DC 16) or Otherworldly (DC 20). Tenku-ji itself is <strong>Otherworldly (DC 20)</strong> on
        account of its Golden Dragon Clan preservation magic and sei-active inner chambers.

        <strong>Activities Supported:</strong> Kaishū primarily; Saikutsu in worked-stone ruins; occasional Saishū for
        plants that have overgrown the site.

        <strong>Seasonal Notes:</strong> Winter often makes ruins more accessible (vegetation cleared); summer conceals
        hazards under growth.

        <strong>Restrictions:</strong> Varies by site. Temple ruins may be considered sacred by local communities and
        disturbed at spiritual cost. Clan lands require permission. Imperial-era sites are nominally Kokushi Kyokai
        jurisdiction. Oryuzan Tenku-ji specifically carries its own set of conditions catalogued in
        <code>locations/tenkuji-temple/</code>.

        <strong>Typical Yields:</strong> Pre-imperial artifacts and tools, forgotten tools and weapons, worked stone,
        salvaged metal, old documents and scrolls, ceremonial materials, rare finds with attached history. Some ruins
        yield sei-touched items; some yield cursed ones; a few yield both and the difference is only clear later.</p>


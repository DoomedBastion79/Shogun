        <h4 id="kg-description-player-facing" data-section="description-player-facing">Description (Player-Facing)</h4>

        <p>The foundation of nearly every meal in Kagekuni. White polished rice is carried by all travellers in small
        cloth bags and purchased in any settlement. Peasant households stretch it with brown rice or mixed grains;
        samurai eat it white. Quality varies subtly by province — Tsuchi rice is said to be the finest for daily eating,
        while Kusa&#39;s slightly sweeter grain is favoured for festival dishes. A traveller without kome in their pack
        is a traveller who expects hospitality.</p>


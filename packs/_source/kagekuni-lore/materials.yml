        <section class="kg-tier kg-tier-intro" data-tier="intro"><dl class="kg-infobox" data-kind="infobox"><div
        class="kg-info__row"><dt>Type</dt><dd data-field="type">system-reference</dd></div></dl><p>In Kagekuni, nothing
        is taken lightly from the land. A hunter who kills a deer owes the forest an accounting. A smith who pulls iron
        from the mountain asks the stone&#39;s permission before the first strike of the pick. A cook who gathers
        mountain sage bows to the plant before cutting. The materials of the world are not commodities — they are
        borrowed, and the borrower is expected to honor the source.</p>

        <p>This document covers the worldbuilding context for Kagekuni&#39;s material categories and the mechanics that
        govern gathering and craft. Individual material entries — names, rarities, values, descriptions, grades, and DM
        notes — live in <code>items/materials.json</code>, which is the canonical source of truth for all material
        definitions and the input for Foundry item generation. When a recipe in <code>core/recipes.md</code> references
        an ingredient, it references an entry in <code>items/materials.json</code>. When a player asks &quot;what can I
        forage in the cedar forest,&quot; the answer comes from Part II of this document.</p>

        <h2 id="kg-how-this-document-works" data-section="how-this-document-works">How This Document Works</h2>

        <p>The file is organized in two parts.</p>

        <p><strong>Part I — Category Context &amp; Schema.</strong> Each of the twelve material categories has a
        worldbuilding introduction describing its cultural, economic, and narrative role in Kagekuni. Individual
        material entries (names, rarities, values, descriptions, grades, DM notes) live in
        <code>items/materials.json</code>. Part I never describes where a material comes from — that belongs in Part
        II.</p>

        <p><strong>Part II — Gathering &amp; Yield Tables.</strong> The mechanic for harvesting materials, the five
        activities used to gather them, the grade system at the point of harvest, failure modes for both gathering and
        crafting, the seasons and seasonal events of Kagekuni, the biomes of the archipelago and what each one yields,
        and the named beast harvests that produce one-time legendary rewards.</p>

        <p>Cross-references between the two halves use markdown anchors: <code>[Ōkami-niku](#ōkami-niku)</code>. Part II
        tables link back to Part I entries so the DM can jump from &quot;what did they find&quot; to &quot;what does
        that mean&quot; in one click.</p>

        <h2 id="kg-knowledge-tiers" data-section="knowledge-tiers">Knowledge Tiers</h2>

        <p>All Part I entries respect the campaign&#39;s three-tier knowledge system:</p>

        <ul>

        <li><strong>[KNOWN]</strong> — Information the players have learned through play. Safe to reference
        anywhere.</li>

        <li><strong>[DISCOVERABLE]</strong> — Exists in-world and could be learned. Lives in the DM Notes section of
        each entry. Quest seeds marked</li>

        </ul>

        <div class="kg-quest-seed" data-kind="quest-seed"><span class="kg-quest-seed__label">QUEST SEED</span> .

        - <strong>[SEALED]</strong> — Campaign-level secrets. Never surface in player-facing descriptions. Mark
        undecided elements as TBD.</div>




        <p>The player-facing description field of each entry is always safe to export to Foundry or share with players.
        The DM Notes field is never exported.</p>

        <h2 id="kg-on-grades-and-foundry" data-section="on-grades-and-foundry">On Grades and Foundry</h2>

        <p>Every material that supports grading exists as four distinct Foundry items — one per grade (並 Nami, 上 Jō, 特上
        Tokujō, 極上 Gokujō). In <code>items/materials.json</code>, each material has a single entry with grade defaults
        defined at the top level (<code>gradeDefaults</code>) and per-material overrides where needed. The 4×
        proliferation exists only in Foundry. The full grade system is documented in Part II.</p>

        <hr>

        <h1>Part I — Category Context &amp; Schema</h1>

        <p>Part I provides the worldbuilding context for each of the twelve material categories and the entry schema
        that governs <code>items/materials.json</code>. Individual material entries live in the JSON file; this section
        describes each category&#39;s cultural, economic, and narrative significance.</p>

        <h2 id="kg-part-i-entry-schema-reference" data-section="part-i-entry-schema-reference">Part I Entry Schema
        (Reference)</h2>

        <p>Every Part I entry must use this schema. Fields in square brackets are optional and may be omitted if
        irrelevant.</p>

        <pre><code>### [Material Name] ([日本語名]) ([English Gloss])


        **Category:** Niku | Yakusō | Kinoko | Chōmiryō | Shushoku | Kegawa | Hone | Sen&#39;i | Kōseki | Hōseki |
        Mokuzai | Ekitai

        **Rarity:** Common (並) | Uncommon (上) | Rare (特上) | Very Rare (極上) | Legendary (伝説) | Artifact (神器)

        **Source Type:** Foraged | Hunted | Mined | Harvested | Scavenged | One-Time | Purchased

        **Biomes:** [list of biomes where found, referencing Part II biome names]

        **Seasons:** Haru | Natsu | Aki | Fuyu | All | [or seasonal event tag like Hikarishō]

        **Yield per Success:** [e.g., &quot;1d4 per resource point&quot; or &quot;fixed: 1 sample&quot;]

        **Weight:** [per portion/unit]

        **Base Value:** [gold pieces per unit, before grade multiplier]

        **Preservation:** [fresh shelf life / preserved shelf life]

        **Tool Proficiency:** [tool needed to harvest or process, if any]

        [**Restrictions:** any legal, cultural, or ritual constraints on harvest]


        #### Grade Variants


        | Grade | Value Multiplier | Craft Modifier | Foundry Item ID |

        |---|---|---|---|

        | 並 Nami (Run-of-the-mill) | ×0.75 | −2 | tbd |

        | 上 Jō (Clean / Standard) | ×1.0 | +0 | tbd |

        | 特上 Tokujō (High-Purity) | ×1.5 | +2 | tbd |

        | 極上 Gokujō (Legendary Bloom) | ×2.5 | +5 or advantage on craft check | tbd |


        *Legendary and Artifact materials may specify a fixed grade; see individual entries.*


        #### Description (Player-Facing)


        Sensory, evocative, spoiler-free prose. This is what a player with full knowledge sees in Foundry when they
        inspect the item. Never contains [DISCOVERABLE] or [SEALED] content.


        #### Unidentified Description


        What the item looks like to a player who has *not* identified it — found in a crate, pulled from a beast with no
        naming knowledge, sitting on a shrine altar. Visual and tactile description only. Foundry shows this to players
        who have not yet identified the material.


        #### Image Prompt


        Prompt for watercolor-style token generation. Should evoke the material without depicting a specific shape or
        branded pose. Muted natural palette. Soft edges. The image is a suggestion of the thing, not a catalog
        photograph.


        #### Used In


        *(This section is auto-populated by the reindex skill by crawling recipes.md. Do not edit manually.)*


        #### DM Notes


        Lore, ecology, cultural significance, harvesting taboos, plot hooks, alternate uses. May contain **[KNOWN]**,
        **[DISCOVERABLE]**, or **[SEALED]** content with tier markers. This field is never exported to Foundry
        player-facing descriptions.

        </code></pre>

        <p><strong>Structural note.</strong> Category headers are <code>##</code>, rarity tier headers within categories
        use bold text (not <code>###</code>), individual material entries use <code>###</code>, and entry subsections
        use <code>####</code>. This keeps the markdown outline navigable and avoids collision between category and entry
        header levels.</p>

        <hr>

        <h2 id="kg-niku-meat-amp-edible-animal-products" data-section="niku-meat-amp-edible-animal-products">Niku 肉 —
        Meat &amp; Edible Animal Products</h2>

        <p>The meat of Kagekuni runs the full span from humble river fish to the heart of a mountain god. Hunting
        traditions are deeply tied to the warrior caste — the samurai on a hunt is not pursuing food but practicing the
        discipline of the kill — while fishing and small-game trapping belong to the peasantry and to the half-feral
        communities of the deep forest. Edible organs carry their own significance; the liver of a bear is a gift to an
        elder, the heart of a killed enemy is a ritual offering, and certain rare beasts yield parts that are considered
        medicine more than food.</p>

        <p><em lang="ja-Latn">Entries: <code>items/materials.json</code> → category &quot;niku&quot;</em></p>

        <hr>

        <h2 id="kg-yakus-herbs-amp-medicinal-plants" data-section="yakus-herbs-amp-medicinal-plants">Yakusō 薬草 — Herbs
        &amp; Medicinal Plants</h2>

        <p>Yakusō covers culinary herbs, medicinal plants, teas, and any green gathered for its flavor, scent, or
        healing property. The boundary with Kinoko is soft — many traditional formulas combine the two — and the
        boundary with Chōmiryō is cultural rather than botanical. A mountain sage is Yakusō; a sage dried, ground, and
        mixed into a spice blend is Chōmiryō. The distinction is <em lang="ja-Latn">use</em>, not species. Herbal
        knowledge in Kagekuni is concentrated in the shrine maiden tradition and in the scattered communities of
        forest-dwelling druids, with village healers working from whatever lineage their teacher left them.</p>

        <p><em lang="ja-Latn">Entries: <code>items/materials.json</code> → category &quot;yakuso&quot;</em></p>

        <hr>

        <h2 id="kg-kinoko-mushrooms-amp-fungi" data-section="kinoko-mushrooms-amp-fungi">Kinoko 茸 — Mushrooms &amp;
        Fungi</h2>

        <p>The fungi of Kagekuni’s forests are prized beyond their weight in silver. Some are food, some are medicine,
        some are sei-resonant and used in the preparations of seimasters, and a few are lethally poisonous in ways that
        imitate the safe ones precisely enough to kill the careless. Mushroom gathering is a trained art; a forager who
        cannot distinguish the ryūkinoko from its deadly mimic does not forage for long. The best flushes follow the
        tsuyu-no-toki rains of early summer, and the deep cedar forests of Kaze produce varieties that grow nowhere
        else.</p>

        <p><em lang="ja-Latn">Entries: <code>items/materials.json</code> → category &quot;kinoko&quot;</em></p>

        <hr>

        <h2 id="kg-chmiry-seasonings-amp-fermented-goods" data-section="chmiry-seasonings-amp-fermented-goods">Chōmiryō
        調味料 — Seasonings &amp; Fermented Goods</h2>

        <p>Salt, miso, soy sauce, vinegar, rice wine for cooking, dried spice blends, fermented pastes, pickled
        vegetables. The backbone of every Kagekuni kitchen and the element that most distinguishes regional cooking. A
        Mizu fisherman’s stew and a Tsuchi farmer’s stew may share every other ingredient and still taste nothing alike
        because of the Chōmiryō applied. Fermentation is considered a sacred art — the kōji mold that underpins miso,
        soy sauce, sake, and a dozen other staples is sometimes described as a gift of the kami, and an old fermentation
        house is tended like a shrine.</p>

        <p><em lang="ja-Latn">Entries: <code>items/materials.json</code> → category &quot;chomiryo&quot;</em></p>

        <hr>

        <h2 id="kg-shushoku-staples-grains-amp-cooking-fats"
        data-section="shushoku-staples-grains-amp-cooking-fats">Shushoku 主食 — Staples, Grains &amp; Cooking Fats</h2>

        <p>Rice in all its varieties, wheat and barley in the north and south, millet in the poor mountain soil, and the
        rendered fats that every kitchen relies on. Oils from pressed seeds, lard from butchered pigs, rendered
        beast-fats from large game, and clarified butter from the few herds that exist on Hokori’s high pastures.
        Shushoku is the foundation of every meal — everything else is applied to the staple, not the other way around.
        Rice especially carries weight far beyond its nutrition: a bowl of rice is a political act, the grain is an
        object of veneration in shrine offerings, and the control of rice paddies is the single most important lever of
        power in rural Kagekuni.</p>

        <p><em lang="ja-Latn">Entries: <code>items/materials.json</code> → category &quot;shushoku&quot;</em></p>

        <hr>

        <h2 id="kg-kegawa-hides-pelts-amp-leather" data-section="kegawa-hides-pelts-amp-leather">Kegawa 毛皮 — Hides,
        Pelts &amp; Leather</h2>

        <p>The worked and unworked hides of Kagekuni’s beasts. Deer leather for common armor, bear hide for the winter
        coats of mountain provinces, wolf pelts for the cloaks of warriors who can earn the right to wear them, and the
        rare spirit-touched hides that carry their own faint charge of sei. Kegawa work is a caste profession — tanners
        occupy a complicated social position, necessary but ritually impure — and the best leatherworkers are
        concentrated in communities that outsiders rarely visit. The distinction between raw pelt and finished leather
        matters both mechanically and economically: a raw hide is worth a tenth of a finished one, but finishing
        requires weeks of downtime and specialist tools.</p>

        <p>Kegawa is primarily a secondary-harvest category: almost every Niku entry with a mammalian source yields hide
        material as part of the butchering process. Routine hides (deer, boar, bear, fox) will be catalogued as the
        campaign surfaces specific needs; for now, Kegawa entries are reserved for named-beast harvests and sei-touched
        pelts where the material’s identity matters enough to track individually.</p>

        <p><em lang="ja-Latn">Entries: <code>items/materials.json</code> → category &quot;kegawa&quot;</em></p>

        <hr>

        <h2 id="kg-hone-bone-horn-shell-amp-sinew" data-section="hone-bone-horn-shell-amp-sinew">Hone 骨 — Bone, Horn,
        Shell &amp; Sinew</h2>

        <p>The hard parts of beasts. Bone for carving, horn for ornament and functional tool-making, shell for
        lacquerwork inlay and protective scaling, sinew for bowstrings and for the binding of composite materials.
        Tooth, claw, antler, and keratin-adjacent materials all live here. In Kagekuni’s spiritual framework, these
        parts are considered the <em lang="ja-Latn">most</em> sacred portion of a slain beast because they are what
        remains when everything else has rotted or been eaten — they are the memory of the animal. Carved bone and horn
        objects are frequently offered to shrines as memorial pieces, and a weapon or tool made from the bone of a named
        creature carries a fragment of that creature’s legend with it.</p>

        <p>Like Kegawa, Hone is primarily a secondary-harvest category — nearly every hunted animal yields bone
        material, and routine bones (deer antler, boar tusk, fish bone) will be catalogued as the campaign surfaces
        specific needs. For now, Hone entries are reserved for named-beast harvests and resonant bones where the
        material’s identity matters enough to track individually.</p>

        <p><em lang="ja-Latn">Entries: <code>items/materials.json</code> → category &quot;hone&quot;</em></p>

        <hr>

        <h2 id="kg-seni-fibers-amp-cordage-materials" data-section="seni-fibers-amp-cordage-materials">Sen’i 繊維 — Fibers
        &amp; Cordage Materials</h2>

        <p>Silk, hemp, ramie, cotton where it grows, plant fibers for rope and net-making, and the rare materials used
        in ceremonial weaving. Silk production is concentrated in the temperate lowlands of Hana and Kusa and is
        controlled by merchant guilds with clan backing. Hemp is grown everywhere and is the material of peasant
        clothing, rope, and paper. Specialist fibers — sei-conductive threads, spirit-silk from certain rare cocoons,
        fireproof woven minerals from volcanic regions — exist at the high end.</p>

        <p><em lang="ja-Latn">Entries: <code>items/materials.json</code> → category &quot;seni&quot; — Framework
        category; entries added as the campaign introduces them.</em></p>

        <hr>

        <h2 id="kg-kseki-ores-metals-amp-stone" data-section="kseki-ores-metals-amp-stone">Kōseki 鉱石 — Ores, Metals
        &amp; Stone</h2>

        <p>Iron, copper, tin, silver, gold, and the rarer metals that flow through Kagekuni’s legendary metallurgy —
        mithral where it can be found, the sei-conductive alloys of the Golden Age, the obsidian of the Kuroso fields
        that is technically not a metal but is worked like one for blade-making. Mining in Kagekuni carries its own
        ritual weight: the mountain is asked, the first strike is blessed, and the miners who practice their trade
        full-time are often regarded with a mixture of respect and unease by the communities around them. Kurogane Yama
        in Tsuchi and the scattered mineral deposits of Hi province are the principal canonical sources.</p>

        <p><em lang="ja-Latn">Entries: <code>items/materials.json</code> → category &quot;koseki&quot; — Framework
        category; entries added as the campaign introduces them.</em></p>

        <hr>

        <h2 id="kg-hseki-gemstones-amp-crystals" data-section="hseki-gemstones-amp-crystals">Hōseki 宝石 — Gemstones &amp;
        Crystals</h2>

        <p>Quartz, jade, amethyst, and the rarer sei-resonant crystals that form in specific conditions — Dragon
        Crystal, the artifact-tier material that forms only where a Progenitor’s breath has touched stone; moon-pearls
        from the deep tidal caves; star-touched quartz from Hoshimori. Gemstones in Kagekuni are prized more for their
        metaphysical properties than for their beauty — a raw, unfinished crystal with strong sei resonance is worth
        more to a seimaster than a perfectly cut stone with none.</p>

        <p><em lang="ja-Latn">Entries: <code>items/materials.json</code> → category &quot;hoseki&quot; — Framework
        category; entries added as the campaign introduces them.</em></p>

        <hr>

        <h2 id="kg-mokuzai-wood-bark-sap-amp-resin" data-section="mokuzai-wood-bark-sap-amp-resin">Mokuzai 木材 — Wood,
        Bark, Sap &amp; Resin</h2>

        <p>The wood of Kagekuni’s forests, from common pine and cedar for construction to the legendary bronze-bark of
        Seidorin Mori for weapons and structural reinforcement. Bark for dyes and medicines, sap for resins and lacquer,
        specialty woods for instrument-making and temple construction. Logging is heavily regulated in the canonical
        forests — Seidorin Mori is license-only on pain of capital punishment — and the best timber passes through
        clan-controlled supply chains that keep the highest-grade material out of common hands.</p>

        <p><em lang="ja-Latn">Entries: <code>items/materials.json</code> → category &quot;mokuzai&quot; — Framework
        category; entries added as the campaign introduces them.</em></p>

        <hr>

        <h2 id="kg-ekitai-oils-inks-dyes-amp-distillations"
        data-section="ekitai-oils-inks-dyes-amp-distillations">Ekitai 液体 — Oils, Inks, Dyes &amp; Distillations</h2>

        <p>The liquid materials that don’t fit elsewhere. Lamp oils pressed from seeds, calligraphy inks ground from
        soot and bound with resin, natural dyes for textiles, poisons extracted from frogs and snakes and certain
        plants, alchemical distillations, and the rare sei-infused liquids that seimasters harvest from specific sites —
        the luminescent water of certain rivers, the incense-scented fog of the high marsh, the tears wept by certain
        statues on certain nights. Ekitai is the most esoteric category and will fill slowly.</p>

        <p><em lang="ja-Latn">Entries: <code>items/materials.json</code> → category &quot;ekitai&quot; — Framework
        category; entries added as the campaign introduces them.</em></p>

        <hr>

        <h1>Part II — Gathering &amp; Yield Tables</h1>

        <p>Part II defines <em lang="ja-Latn">how</em> materials are found and <em lang="ja-Latn">where</em>. It is the
        mechanical heart of the gathering system and the reference the DM consults during play when a player declares
        they want to forage, hunt, mine, cut timber, or scavenge.</p>

        <h2 id="kg-the-gathering-mechanic" data-section="the-gathering-mechanic">The Gathering Mechanic</h2>

        <p>Gathering in Kagekuni resolves in three stages. A full attempt takes one in-world hour and resolves with a
        single opportunity roll plus one to five yield rolls.</p>

        <h3 id="kg-stage-1-declare-the-activity" data-section="stage-1-declare-the-activity">Stage 1 — Declare the
        Activity</h3>

        <p>Before any dice are rolled, the gathering character declares which of the five activities they are
        attempting. Each activity uses different skills, tools, and yield tables. A character pursues only one activity
        per attempt — an hour spent foraging herbs does not incidentally yield game, ore, or timber. A character who
        wants to gather across categories must spend multiple attempts.</p>

        <p>The five activities are:</p>

        <ul>

        <li><strong>Saishū 採集 — Foraging.</strong> Hunting for plants, fungi, fruits, nuts, and small surface materials.
        Skill: Wisdom (Survival) or Intelligence (Nature). Tool: Herbalism kit recommended; a failure without
        proficiency imposes disadvantage on the opportunity roll. Yields from: Yakusō, Kinoko, some Shushoku, some
        Ekitai, occasional Sen&#39;i.</li>

        <li><strong>Shuryō 狩猟 — Hunting.</strong> Pursuing game of any size, on land or in water. Both land hunting and
        fishing fall under Shuryō — a rabbit snare and a river line are mechanically the same activity for the purposes
        of the gathering system. Skill: Wisdom (Survival). Tool: weapons or fishing tackle. Yields from: Niku, Kegawa,
        Hone, occasional Ekitai.</li>

        <li><strong>Saikutsu 採掘 — Mining.</strong> Extracting ore, stone, and gems from surface deposits, cave walls,
        riverbed gravel, or spoil heaps. Skill: Strength (Athletics) or Intelligence (Investigation). Tool: miner&#39;s
        tools (mattock, pick, chisel). Yields from: Kōseki, Hōseki, sometimes Ekitai (thermal waters).</li>

        <li><strong>Batsuboku 伐木 — Timber Harvest.</strong> Cutting wood, stripping bark, collecting sap and resin.
        Skill: Wisdom (Survival) or Strength (Athletics). Tool: woodcarver&#39;s or carpenter&#39;s tools. Yields from:
        Mokuzai, some Sen&#39;i (plant fibers), some Ekitai (saps, resins).</li>

        <li><strong>Kaishū 回収 — Scavenging.</strong> Searching ruins, battlefields, abandoned sites, crashed carts,
        refuse heaps, and the fringes of civilization for useful materials of any category. Skill: Intelligence
        (Investigation). Tool: none required. Yields from: any category, depending on the site — a ruined temple yields
        different things from a battlefield, a burned farmhouse, or a shipwreck.</li>

        </ul>

        <h3 id="kg-stage-2-the-opportunity-roll" data-section="stage-2-the-opportunity-roll">Stage 2 — The Opportunity
        Roll</h3>

        <p>Once the activity is declared, the character makes a single d20 check against the biome&#39;s Opportunity DC.
        This roll determines <em lang="ja-Latn">how productive</em> the attempt was — not <em lang="ja-Latn">what</em>
        was found.</p>

        <table>

        <thead>

        <tr>

        <th>Biome Tier</th>

        <th>Opportunity DC</th>

        <th>Example Biomes</th>

        </tr>

        </thead>

        <tbody><tr>

        <td>Accessible</td>

        <td>10</td>

        <td>Satoyama, Tambo, lowland Kawa to Numa</td>

        </tr>

        <tr>

        <td>Wild</td>

        <td>13</td>

        <td>Kaigan, Sugi no Mori, Fumoto, lower Murasaki-hara</td>

        </tr>

        <tr>

        <td>Hostile</td>


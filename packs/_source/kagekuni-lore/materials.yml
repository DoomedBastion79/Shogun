        <h4 id="kg-description-player-facing" data-section="description-player-facing">Description (Player-Facing)</h4>

        <p>Small ground-dwelling birds hunted in grasslands, scrub, and the margins of cultivated fields. The meat is
        darker than chicken and carries a slightly mineral sweetness — perfect for a single-skewer meal over a cooking
        fire.</p>

        <h4 id="kg-unidentified-description" data-section="unidentified-description">Unidentified Description</h4>

        <p>Small plucked game birds, each no larger than a fist, with pale-to-rose flesh and tiny bones. Faint scent of
        grass and warm feathers.</p>

        <h4 id="kg-image-prompt" data-section="image-prompt">Image Prompt</h4>

        <p>Watercolor of small game birds, plucked and trussed, arranged on a flat stone. Warm terra cotta and ochre
        palette. Loose, suggestive brushwork.</p>

        <h4 id="kg-used-in" data-section="used-in">Used In</h4>

        <p><em lang="ja-Latn">Auto-populated by reindex.</em></p>

        <h4 id="kg-dm-notes" data-section="dm-notes">DM Notes</h4>

        <p>Abundant in grasslands and scrub. Often driven into nets by beaters; rural households maintain standing snare
        lines near paddy margins during harvest season.</p>


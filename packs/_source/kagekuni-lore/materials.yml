        <h4 id="kg-description-player-facing" data-section="description-player-facing">Description (Player-Facing)</h4>

        <p>A glutinous variant of rice used for mochi, festival dishes, and celebratory meals. Heavier and stickier than
        ordinary kome when cooked, with a distinctive chewiness that ordinary rice lacks. Commanded as ceremonial food
        in noble households and shrines. Sold in smaller bags at slightly higher prices than common rice, it marks the
        difference between a weekday meal and a celebration.</p>


        <h4 id="kg-description-player-facing" data-section="description-player-facing">Description (Player-Facing)</h4>

        <p>Small freshwater crabs pulled from clear streams and the edges of rice paddies. The shells are dark mottled
        green in life, turning vivid orange when cooked. Sweet, briny flesh inside a shell that must be cracked with
        fingers or the butt of a knife. Grilled whole, their flavour intensifies into something far greater than their
        size suggests.</p>

        <h4 id="kg-unidentified-description" data-section="unidentified-description">Unidentified Description</h4>

        <p>Small armored arthropods, palm-sized, with dark mottled shells and pincers held defensively. They clack
        faintly when disturbed.</p>

        <h4 id="kg-image-prompt" data-section="image-prompt">Image Prompt</h4>

        <p>Watercolor sketch of small orange-shelled river crabs clustered on a wet stone, surrounded by flowing
        ripples. Muted teal water, umber shell tones. Soft wash, no sharp lines.</p>

        <h4 id="kg-used-in" data-section="used-in">Used In</h4>

        <p><em lang="ja-Latn">Auto-populated by reindex.</em></p>

        <h4 id="kg-dm-notes" data-section="dm-notes">DM Notes</h4>

        <p>Gathered by hand from clear streams and paddy margins. Peasant children often harvest them as a side activity
        during other work. Fishing tackle not required. Best yields immediately after rainfall.</p>


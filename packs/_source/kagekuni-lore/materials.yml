        <li>Shrine offerings of extraordinary weight — mountain kami regard such a pelt as an offering of dynastic
        significance</li>

        </ul>

        <h4 id="kg-dm-notes" data-section="dm-notes">DM Notes</h4>

        <p><strong>One-time harvest.</strong> Single-grade-locked at 極上 Gokujō. The party currently holds the full yield
        — 1 primary pelt + 2 secondary sections. Track in <code>dm/campaign-state.md</code>.</p>

        <p><strong>Skill-Check Reveals</strong> — the full value of this component is not obvious. A character may
        attempt one check per skill when the pelt is first examined or investigated further. A natural 20 reveals
        everything across all three skills.</p>

        <ul>

        <li><strong>Religion (DC 13)</strong> — Wolves are sacred to many of the mountain kami, and a pelt of this
        clarity would be received as an extraordinary offering at any mountain shrine. A shrine receiving it would owe
        the giver a favour — the kind of favour that gets remembered for years. In Sora, Tsuchi, or upper Kaze, this
        could open doors that gold cannot.</li>

        <li><strong>Nature (DC 12)</strong> — The pelt is from a once-in-a-generation specimen. The character
        understands which sections are most valuable, how the hide must be cured, and that a master leatherworker (not a
        common one) is required to do the work properly. Identifies the leatherworkers of Heian, Kumo-no-Ue, and
        Akatsuki as having the requisite skill.</li>

        <li><strong>Arcana (DC 15)</strong> — The faint cool sheen in low light is real sei resonance — the
        creature&#39;s spiritual nature has imprinted on its fur. Worked into a ceremonial garment, the pelt could serve
        as an arcane focus for protection, divination, or ward-based magics. A seimaster who handles such a cloak would
        feel it.</li>

        </ul>

        <p>Cross-references: See Niku → Ōkami-niku and related cuts; Hone → Ōkami no Hone / Zugai / Kiba / Tenohira;
        Shushoku → Ōkami no Abura. All Yama-no-Ōkami components share the single-grade-locked Gokujō convention.</p>

        <hr>

        <h2 id="kg-hone-bone-horn-shell-amp-sinew" data-section="hone-bone-horn-shell-amp-sinew">Hone 骨 — Bone, Horn,
        Shell &amp; Sinew</h2>

        <p>The hard parts of beasts. Bone for carving, horn for ornament and functional tool-making, shell for
        lacquerwork inlay and protective scaling, sinew for bowstrings and for the binding of composite materials.
        Tooth, claw, antler, and keratin-adjacent materials all live here. In Kagekuni&#39;s spiritual framework, these
        parts are considered the <em lang="ja-Latn">most</em> sacred portion of a slain beast because they are what
        remains when everything else has rotted or been eaten — they are the memory of the animal. Carved bone and horn
        objects are frequently offered to shrines as memorial pieces, and a weapon or tool made from the bone of a named
        creature carries a fragment of that creature&#39;s legend with it.</p>

        <p>Like Kegawa, Hone is primarily a secondary-harvest category — nearly every hunted animal yields bone
        material, and routine bones (deer antler, boar tusk, fish bone) will be catalogued as the campaign surfaces
        specific needs. For now, Hone entries are reserved for named-beast harvests and resonant bones where the
        material&#39;s identity matters enough to track individually.</p>

        <h3 id="kg-named-beast-harvests" data-section="named-beast-harvests">Named Beast Harvests</h3>

        <h4 id="kg-kami-no-hone-mountain-god39s-bones" data-section="kami-no-hone-mountain-god39s-bones">Ōkami no Hone
        (狼の骨) (Mountain God&#39;s Bones)</h4>

        <p><strong>Category:</strong> Hone

        <strong>Rarity:</strong> 極上 Gokujō (single-grade-locked — nat-20 harvest)

        <strong>Source Type:</strong> One-time harvest — Yama-no-Ōkami

        <strong>Biomes:</strong> N/A (harvested from the Yama-no-Ōkami during the Fushichō ashfall, Tenchūsan Ren
        mountain pass)

        <strong>Seasons:</strong> N/A (one-time harvest)

        <strong>Yield:</strong> ~350 lb of usable carving bone (long bones, ribs, vertebrae)

        <strong>Weight:</strong> 350 lb total — too much to carry whole; typically broken down and stored or sold by the
        lot

        <strong>Base Value:</strong> 5–8 gp per lb raw; 12–20 gp per lb cut and sized for craftsmen

        <strong>Preservation:</strong> Indefinite if kept dry. Raw bone benefits from cleaning and bleaching soon after
        harvest.

        <strong>Tool Proficiency:</strong> Woodcarver&#39;s or bonecarver&#39;s tools for shaping; butcher&#39;s cleaver
        for initial sectioning


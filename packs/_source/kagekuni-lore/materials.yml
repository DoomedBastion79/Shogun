        dense, with a subtle herbal aftertaste from the alpine browse of berries and conifer shoots. Mountain villages
        consider a snow-pheasant kill a mark of hunting skill.</p>

        <h4 id="kg-unidentified-description" data-section="unidentified-description">Unidentified Description</h4>

        <p>A plucked white-skinned game bird with pale, almost ivory flesh. Cold to the touch even hours after
        killing.</p>


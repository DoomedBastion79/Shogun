        <h2 id="kg-kinoko-mushrooms-amp-fungi" data-section="kinoko-mushrooms-amp-fungi">Kinoko 茸 — Mushrooms &amp;
        Fungi</h2>

        <p>The fungi of Kagekuni&#39;s forests are prized beyond their weight in silver. Some are food, some are
        medicine, some are sei-resonant and used in the preparations of seimasters, and a few are lethally poisonous in
        ways that imitate the safe ones precisely enough to kill the careless. Mushroom gathering is a trained art; a
        forager who cannot distinguish the ryūkinoko from its deadly mimic does not forage for long. The best flushes
        follow the tsuyu-no-toki rains of early summer, and the deep cedar forests of Kaze produce varieties that grow
        nowhere else.</p>

        <p><strong>並 Nami — Common</strong></p>


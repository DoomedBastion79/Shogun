      content: >-
        <section class="kg-tier kg-tier-intro" data-tier="intro"><dl class="kg-infobox" data-kind="infobox"><div
        class="kg-info__row"><dt>Type</dt><dd data-field="type">recipe</dd></div></dl><p>A demonstration recipe used to
        validate the Mastercrafted export pipeline. Mirrors the live &quot;Test → Recipe&quot; page dumped from the
        world: three ingredient slots, one product slot, cooking + survival check.</p>

        <h2 id="kg-ingredients" data-section="ingredients">Ingredients</h2>

        <h2 id="kg-products" data-section="products">Products</h2>

        <h2 id="kg-description" data-section="description">Description</h2>

        <p>Round-trip test recipe. When the export pipeline writes this file into the <code>kagekuni-recipes</code>
        compendium pack, the resulting Mastercrafted recipe page should be byte-equivalent to the live one we dumped
        from the world.</p>

        <h2 id="kg-reference-format" data-section="reference-format">Reference Format</h2>

        <p>The <code>ref:</code> field on each component supports three forms:</p>

        <ul>

        <li><strong><code>world:Item.&lt;world-id&gt;</code></strong> — references an existing world-level item by its
        Foundry-assigned ID. Used for items that haven&#39;t been migrated to markdown yet. Will not survive a fresh
        world.</li>

        <li><strong><code>item:&lt;slug&gt;</code></strong> — references a Kagekuni item file by its markdown slug (e.g.
        <code>item:katana</code>). The build pipeline resolves this to the stable compendium UUID.</li>

        <li><strong><code>compendium:&lt;pack&gt;.&lt;id&gt;</code></strong> — direct reference to a compendium item by
        its <code>_id</code>. Use sparingly.</li>

        </ul>

        <p>For new recipes, prefer <code>item:&lt;slug&gt;</code> so the recipe survives world rebuilds and renames.</p>

        </section>

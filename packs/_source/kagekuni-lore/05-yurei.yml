      content: >-
        <section class="kg-tier kg-tier-intro" data-tier="intro"><dl class="kg-infobox" data-kind="infobox"><div
        class="kg-info__row"><dt>Type</dt><dd data-field="type">core</dd></div></dl><p>Yurei is avoided. The island lies
        somewhere in the archipelago — its exact position known to navigators but rarely marked on maps sold to the
        public. Sailors alter course to keep it below the horizon. Fishermen who drift too close report unease that
        builds to physical nausea before they&#39;ve sighted land. The island is barren, cursed, and home to things that
        do not welcome the living.</p>

        <p>An ancient catastrophe — its nature lost to the Dark Ages — left Yurei scarred in ways that have not healed.
        The land itself is blighted: grey soil, dead trees standing like bones, coastlines of sharp black rock where
        nothing grows. Spectres, undead, and creatures of unknown origin inhabit the interior. The few expeditions that
        have attempted to chart the island&#39;s geography have returned incomplete, or not at all.</p>

        <h2 id="kg-points-of-interest" data-section="points-of-interest">Points of Interest</h2>

        <p><strong>Kuroshi Temple</strong> is the most significant known site on Yurei — a dark temple whose origins
        predate the catastrophe. It was here that <strong>Takeda Arata</strong> found the necromantic tome that
        transformed him into <strong>Kuroyami no Akuma</strong> and set in motion the Plague Campaign of 16609–16616.
        What else the temple contains, and what other structures survive on the island, is largely unknown. Few have
        gone looking. Fewer have returned to report.</p>

        <h2 id="kg-settlements" data-section="settlements">Settlements</h2>

        <p>None known. If anyone lives on Yurei, they are not living in any conventional sense of the word.</p>

        <h2 id="kg-culture-amp-trade" data-section="culture-amp-trade">Culture &amp; Trade</h2>

        <p>There is no trade with Yurei. There is no culture on Yurei — not anymore. The island serves as a cautionary
        reference in the folklore of every other island in the archipelago. &quot;Yurei&#39;s shore&quot; is a common
        idiom for a place of no return.</p>

        <p><em lang="ja-Latn">&lt;placeholder — the nature of the original catastrophe, pre-curse civilisation, and the
        island&#39;s deeper history to be developed&gt;</em></p>

        <section class="secret">


        <h4 id="kg-dm-note-yurei-secrets" data-section="dm-note-yurei-secrets">DM Note — Yurei Secrets</h4>

        <p>The nature of Yurei&#39;s curse and its connection to the Progenitor dragons is undeveloped. Possible
        connections include Murasakiryū (Amethyst Dragon) influence, given the necromantic character of the curse and
        Kuroyami&#39;s discovery of the tome there. Whether the curse predates or postdates the Great Aphelion is an
        open question with significant implications for the campaign&#39;s cosmological timeline.</p>

        <p><em lang="ja-Latn">&lt;placeholder — Yurei&#39;s deeper secrets, curse origin, and potential campaign
        relevance to be developed&gt;</em></p>

        </section></section>

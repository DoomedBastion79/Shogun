        <section class="secret kg-secret-discoverable">

        <p><strong>Introduction</strong></p>

        <p><em>discoverable</em></p>

        <ul>

        <li>@UUID[Compendium.assistant.npcs-lore.JournalEntry.A1IgNg32hleJFjNB]{Ren Nakamura} has discovered the true
        source of the Bronze Wood&#39;s metallic quality and is working with a merchant guild to exploit it.</li>

        <li>@UUID[Compendium.assistant.npcs-lore.JournalEntry.fbx0optmtxCbt7X7]{Haruto Masashige} is building an
        informant network and has noticed irregularities in the licensing records.</li>

        <li>Ko&#39;jiri carries both a legitimate letter from Ren Nakamura and a forged version -- a ticking clock.</li>

        </ul>


        </section>

        <section class="secret kg-secret-sealed">

        <p><strong>DM Secrets</strong></p>

        <p><em>sealed</em></p>

        <p><strong>The Bronze Wood Secret</strong>

        The Seidorin Mori grows over an underground branch of Kinkokyo&#39;s ancient canal system. The metallic quality
        is caused by trace gold and copper in groundwater flowing through the buried city&#39;s infrastructure for
        thousands of years. @UUID[Compendium.assistant.npcs-lore.JournalEntry.A1IgNg32hleJFjNB]{Ren Nakamura} has
        discovered this. His allied merchant guild wants to locate and exploit the source directly, bypassing
        tree-harvesting -- requiring excavation that would destroy the forest.</p>

        <p><strong>@UUID[Compendium.assistant.npcs-lore.JournalEntry.fbx0optmtxCbt7X7]{Haruto Masashige}&#39;s True
        Purpose</strong>

        Masashige suspects something significant about the licensing system. He has noticed irregularities -- specific
        harvesting zones consistently licensed to a single merchant entity with documentation that obscures the pattern.
        He is three to four months from a coherent accusation.</p>

        <p><strong>Ren Nakamura&#39;s Alliance</strong>

        The merchant guild is based in @UUID[Compendium.assistant.lore.JournalEntry.hzsa2iSlnRd38adi]{Heian} with
        operations across @UUID[Compendium.assistant.lore.JournalEntry.LGWViZizhJlD3KdR]{Hana} and beyond. The alliance
        provides financial support for Clan Minato&#39;s elevation ambitions and exclusive export contracts. Nakamura is
        not villainous by nature but has made compromises requiring further compromises to sustain.</p>

        <p><strong>Ko&#39;jiri&#39;s Forged Letter -- Ticking Clock</strong>

        Ko&#39;jiri carries a legitimate letter and a forged version requesting additional materials. The real letter
        has already been sent to Heian through official channels. When the discrepancy is discovered, Ko&#39;jiri&#39;s
        Conditional Pardon will be immediately at risk. Estimate: 2-4 sessions.</p>

        <p><strong>Ancient Dragonborn Ritual Knowledge</strong>

        Haruto Masashige&#39;s knowledge of ancient Dragonborn rituals includes a purification and restoration rite
        preserved in his family&#39;s oral tradition -- directly applicable to the Nagaji situation if someone connected
        the dots.</p>


        </section>

        <section class="secret kg-secret-sealed">

        <p><strong>Plot Hooks</strong></p>

        <p><em>sealed</em></p>

        <ul>

        <li>Haruto sends word to the party in @UUID[Compendium.assistant.lore.JournalEntry.hzsa2iSlnRd38adi]{Heian}: he
        has found something in the licensing records connecting to their mission</li>

        <li>A merchant guild representative in Kikyo attempts to discourage the party from returning there with unusual
        vehemence</li>

        <li>@UUID[Compendium.assistant.npcs-lore.JournalEntry.A1IgNg32hleJFjNB]{Ren Nakamura} contacts Ko&#39;jiri
        separately with an additional, unwritten request</li>

        </ul>


        </section>

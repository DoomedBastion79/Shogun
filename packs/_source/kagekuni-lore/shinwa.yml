  - _id: SjhCul8iWYzX3mWv
    _key: '!journal.pages!FAOlL8D3kPY1rEAc.SjhCul8iWYzX3mWv'
    name: Ritual Purification
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >
        <p>Purification is the most universally practiced spiritual act in Kagekuni. It crosses caste, clan, and
        regional boundaries. The principle is simple: contact with death, blood, illness, spiritual pollution, or moral
        transgression creates impurity that must be cleansed before a person can properly interact with the sacred.</p>

        <p>In practice, purification takes many forms. Water is the most common agent — the ritual washing of hands and
        mouth at a shrine&#39;s <strong>temizuya</strong> (water basin) before entering. Salt is scattered at thresholds
        to ward off impurity. Incense smoke purifies spaces. Priests perform formal ceremonies of cleansing for
        individuals, buildings, and even weapons. Before a battle, entire armies may undergo purification rites — not
        for divine protection, but to ensure they enter combat in a state of spiritual clarity.</p>

        <p>The most significant purifications mark life transitions: birth, coming of age, marriage, and death. A house
        where someone has died is purified before the living resume normal activity. A blade that has taken a life may
        be ritually cleansed. A warrior returning from battle washes not just the blood from their skin but the
        spiritual residue of killing from their soul.</p>

        <p>This practice intersects with the caste system in uncomfortable ways. The Burakumin — whose occupations
        involve constant contact with death and spiritual pollution — are considered permanently impure by those who
        observe the strictest interpretations of purification law. Their segregation is, in part, a spiritual
        justification layered over social prejudice.</p>
      markdown: ''

  - _id: I7lHJcDUEVr3LdHM
    _key: '!journal.pages!FAOlL8D3kPY1rEAc.I7lHJcDUEVr3LdHM'
    name: Amaterasu — The Anchor
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >
        <p><strong>Mass</strong>: Primary; largest of the three stars. <strong>Orbit</strong>: Moves around the
        barycenter, but its greater mass means the barycenter sits relatively close to it — Amaterasu&#39;s orbital
        movement is the least dramatic of the three. Its planetary family travels with it throughout. <strong>Sei
        signature</strong>: Core life energy; baseline sei. Foundational and stable. <strong>Projection color</strong>:
        Golden-yellow. <strong>During the drought</strong>: Never goes dark. Amaterasu&#39;s projection in the orrery
        holds throughout the entire drought period. It is the one point of gold that remains in the dome regardless of
        what date the operator sets. This is why the dark ages were cultural and intellectual collapse rather than
        extinction — Amaterasu&#39;s baseline sei sustained life, agriculture, and the physical world while the more
        complex magical expressions that depended on the full trinary system became inaccessible.</p>
      markdown: ''

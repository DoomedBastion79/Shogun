  - _id: lJghSxnkVHModB9B
    _key: '!journal.pages!FAOlL8D3kPY1rEAc.lJghSxnkVHModB9B'
    name: The Practice of Faith
    type: text
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >
        <p>For most people in Kagekuni, religion is not a matter of doctrine but of practice. A farmer does not study
        theology. He maintains his family shrine, makes offerings to the kami of his fields, honours his ancestors at
        the butsudan, and visits the local temple on festival days. His faith is expressed through action — through the
        rituals that mark the rhythm of the year, the prayers that accompany daily work, and the quiet understanding
        that the world is populated by forces larger and older than himself.</p>

        <p>This practical faith produces a population that is simultaneously devout and pragmatic. The people of
        Kagekuni believe in the spiritual world because they live in it — because the rivers glow faintly at night,
        because the fog sometimes carries incense from no source, because the trees in certain forests have bark of
        burnished bronze and no one considers this remarkable. The sacred is not separate from the ordinary. It is the
        ordinary, seen clearly.</p>
      markdown: ''

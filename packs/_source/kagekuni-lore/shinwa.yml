  - _id: rVkmUqHQp8iCFmkf
    _key: '!journal.pages!FAOlL8D3kPY1rEAc.rVkmUqHQp8iCFmkf'
    name: Susanoo — Second to Fade, First to Return
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >
        <p><strong>Mass</strong>: Smallest blue-white dwarf. <strong>Orbit</strong>: Complex barycentric orbit — not
        elongated like Tsukuyomi&#39;s, but highly variable. Produces both the closest approaches (Nagorikaze) and
        meaningful retreats. Being the least massive of the three, its sei output is the most sensitive to distance.
        <strong>Sei signature</strong>: Water magic, healing, purification. <strong>Projection color</strong>:
        Blue-white.</p>

        <p><strong>Fade sequence</strong>: Susanoo&#39;s blue-white dims approximately 50–80 years before the Great
        Aphelion nadir (~14264–14294). The order would have watched Tsukuyomi declining for nearly a century before
        Susanoo began to follow. Susanoo&#39;s failure was the loss that reached the general population — healers losing
        effectiveness, coastal and maritime practices becoming unreliable. Tsukuyomi&#39;s decline was a practitioner
        problem; Susanoo&#39;s was a human one.</p>

        <p><strong>Return sequence</strong>: Because its orbit is complex rather than elongated, Susanoo&#39;s return
        path is more direct. It is the first secondary star to show meaningful recovery in the orrery — a faint but
        perceptible blue-white appearing in the dome while Tsukuyomi&#39;s arm remains dark. Susanoo&#39;s return is the
        first confirmation that the system is correcting rather than continuing to deteriorate. The first Talents
        (<del>15962) emerge after dawn (</del>15883) and correlate with Susanoo&#39;s partial return, consistent with
        healing and purification being among the earliest accessible sei expressions.</p>


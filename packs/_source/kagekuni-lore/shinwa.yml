  - _id: NKx2QC4aBuHazpxx
    _key: '!journal.pages!FAOlL8D3kPY1rEAc.NKx2QC4aBuHazpxx'
    name: Planetary and Lunar Behavior
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >
        <p>Because the planets orbit Amaterasu and travel with it, <strong>the seven planets do not participate in the
        Great Aphelion</strong>. Their positions relative to Seizan shift only in their normal orbital patterns around
        Amaterasu throughout the drought period. The moons, which orbit Seizan directly, are similarly unaffected by the
        positions of Susanoo and Tsukuyomi.</p>

        <p>In the orrery, this means planetary and lunar armatures continue their normal motion through the entire dark
        ages period. The sei drought is visible in the orrery as exclusively a two-star withdrawal — Susanoo and
        Tsukuyomi receding while everything else continues its ordinary dance. This is more striking than a general
        dimming: the machine keeps working, the planets keep moving, and two of the three stars are simply not where
        they should be.</p>
      markdown: ''
    video:
      controls: true
      volume: 0.5
    src: null

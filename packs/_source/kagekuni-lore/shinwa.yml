  - _id: XrDKIMIEILzTnY8J
    _key: '!journal.pages!FAOlL8D3kPY1rEAc.XrDKIMIEILzTnY8J'
    name: Tsukuyomi — First to Fade, Last to Return
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >
        <p><strong>Mass</strong>: Larger deep-red dwarf; second most massive. <strong>Orbit</strong>: Elongated
        barycentric orbit — already has the most dramatic near-far swing of the three under normal conditions. Long
        Shadow events are the routine expression of this elongation. During the Great Aphelion, the elongation compounds
        to an extreme that no living record had prepared the order to anticipate. <strong>Sei signature</strong>:
        Transformation magic, energy manipulation. <strong>Projection color</strong>: Deep red.</p>

        <p><strong>Fade sequence</strong>: Tsukuyomi&#39;s deep red begins bleeding from the orrery&#39;s projection
        approximately 150–170 years before the Great Aphelion nadir (~14174–14194). Because its elongated orbit already
        produces dramatic near-far variation, the early stages of its decline would have been logged by the order as an
        unusually extended Long Shadow before the true nature of the event became clear. Practitioners of the period
        would have noticed transformation magic becoming unreliable first — the most complex sei expressions failing
        before the simpler ones.</p>

        <p><strong>Return sequence</strong>: Because its orbit is the most elongated, Tsukuyomi&#39;s return is the
        slowest. Its deep red is the last color to reappear in the orrery during the recovery arc — faint and
        intermittent for centuries before becoming reliable. The moment all three stars are clearly visible
        simultaneously, which defines the Great Awakening (~16693), is effectively the moment Tsukuyomi&#39;s red
        crosses the threshold of clarity. It is the completion of the return, not its beginning.</p>
      markdown: ''
    video:
      controls: true
      volume: 0.5
    src: null

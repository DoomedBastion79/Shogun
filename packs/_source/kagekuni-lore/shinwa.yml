  - _id: XjbItsgQDFW8eGxN
    _key: '!journal.pages!FAOlL8D3kPY1rEAc.XjbItsgQDFW8eGxN'
    name: Religion and Mythology
    type: text
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >
        <p>The spiritual life of Kagekuni is layered, ancient, and deeply woven into daily existence. There is no
        separation between the sacred and the mundane — a farmer who plants rice in the spring does so with a prayer to
        the kami of the paddy. A samurai who draws their blade offers a silent word to their ancestors. A merchant who
        opens their shop at dawn bows to the small shrine beside the door, and means it. Religion in Kagekuni is not
        practiced in isolation; it is practiced in everything.</p>
      markdown: ''

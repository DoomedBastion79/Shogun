  - _id: FVZcs5Ya9CtxqfUr
    _key: '!journal.pages!FAOlL8D3kPY1rEAc.FVZcs5Ya9CtxqfUr'
    name: Kannazuki — The Month of No Gods
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>The tenth month of the calendar is called <strong>Kannazuki</strong> — the Month of No Gods. Tradition holds
        that during this month, the kami leave their shrines and territories to gather at a great convocation, leaving
        the mortal world temporarily unattended. Shrines see reduced attendance. Certain rituals are suspended. The
        month carries a faint unease — a feeling of being unwatched, which in Kagekuni is not a comfort but a
        vulnerability.</p>

        <p>The name is ancient — far older than the current empire — and its origin has been debated by scholars and
        priests for millennia without resolution.</p>


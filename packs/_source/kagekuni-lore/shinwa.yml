  - _id: iIZVQjFHsk3BjphE
    _key: '!journal.pages!FAOlL8D3kPY1rEAc.iIZVQjFHsk3BjphE'
    name: Kami — The Spirits of the World
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >
        <p>Kami are the spiritual inhabitants of the natural world — beings of place, element, and phenomenon who exist
        alongside the mortal population. They are not gods. They are not saints. They are something else entirely:
        presences that dwell in rivers, mountains, ancient trees, crossroads, waterfalls, and any place where the
        natural world gathers unusual weight or beauty.</p>

        <p>A kami may be benevolent, indifferent, or dangerous — and sometimes all three, depending on how it is
        treated. The kami of a river might bless the villages along its banks with clean water and good fishing for
        generations, then drown a child who wades too deep without offering respect. This is not cruelty. It is nature.
        Kami do not operate by human morality. They operate by their own logic, which mortals can learn to read but
        never fully control.</p>

        <p>Shrines mark the resting places and territories of known kami. These range from grand structures maintained
        by dedicated priests to simple roadside markers — a torii gate, a stone basin, a length of sacred rope tied
        around an ancient tree. The distinction between a great shrine and a humble one is not a measure of the
        kami&#39;s power but of the community&#39;s resources. A village kami honoured with a mossy stone and a daily
        cup of rice may be every bit as potent as one housed in a lacquered hall.</p>

        <p>Interaction with kami follows established protocols: purification before approach, offerings appropriate to
        the spirit&#39;s nature, prayers spoken with correct form, and gratitude expressed whether the request is
        granted or not. Disturbing a kami — through disrespect, pollution of its territory, or destruction of its shrine
        — invites consequences that can persist for generations.</p>
      markdown: ''
    video:

  - _id: cMmPxjW40ZIICht2
    _key: '!journal.pages!FAOlL8D3kPY1rEAc.cMmPxjW40ZIICht2'
    name: Why the Great Aphelion Is Singular
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >
        <p>Under normal orbital conditions, the three stars periodically reach individual far points from each other —
        this is routine. The Great Aphelion requires three independent conditions to align simultaneously:</p>

        <ul>

        <li>Amaterasu at maximum distance from the barycenter on one side of its orbit, carrying Seizan with it</li>

        <li>Susanoo at maximum distance on the opposing side of its orbital arc</li>

        <li>Tsukuyomi at maximum distance on the opposing extreme of its own inclined arc</li>

        </ul>

        <p>Because the three orbital periods and inclinations are entirely independent, the probability of all three
        peaking simultaneously is the product of three separate low-probability alignments. More critically, the
        compounding is <strong>geometric rather than additive</strong> — when Amaterasu swings to its extreme, it
        carries Seizan away from the barycenter; Susanoo and Tsukuyomi simultaneously reaching their opposing extremes
        means Seizan is not simply far from two stars, but has been actively carried in the opposite direction while
        they retreated. The distance at nadir is the sum of three orbital extremes working against each other.</p>

        <p>This event has been recorded once — imperfectly, in fragmentary form. The possibility of a future occurrence
        exists but is considered by any scholar who has assembled the relevant data to be a matter for timescales beyond
        meaningful planning.</p>

        <hr>
      markdown: ''

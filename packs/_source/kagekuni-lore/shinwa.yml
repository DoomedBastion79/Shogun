    name: The Divine Structure
    type: text
    title:
      show: false
      level: 3
    image: {}
    text:
      format: 1
      content: >
        <ul>

        <li><strong>Single supreme divine entity</strong> — analogous to Christianity&#39;s monotheism</li>

        <li>Historical deities venerated as saint-equivalents — subordinate to supreme being</li>

        <li>Shrines and temples may be dedicated to specific divine figures without contradicting monotheistic
        faith</li>

        <li>Different clans/regions have patron divine figures</li>

        <li><strong>Dragons</strong> occupy a unique revered position — between saints-equivalent and kami</li>

        <li>Kami (nature spirits) exist as a separate category of minor spiritual beings</li>

        </ul>

  - _id: v45LwVRv04vI5A9y
    _key: '!journal.pages!FAOlL8D3kPY1rEAc.v45LwVRv04vI5A9y'
    name: DM Note — The Dragons Live
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <p>All seven founding dragons are still alive. They are not dead, not ascended, and not mythological. They are
        hidden — withdrawn into deep slumber across the archipelago, their locations known only to the <strong>Order of
        the Ancient Guard</strong>, the secret organisation dedicated to their protection.</p>

        <p>The world considers the Progenitors purely historical. The Ancient Guard works to maintain this belief,
        understanding that the revelation of living dragons would destabilise every political, religious, and military
        institution in Kagekuni simultaneously.</p>

        <p>Dragon eggs are not fossils. Their viability is unknown to the world at large, but the Ancient Guard treats
        them as potentially living.</p>

        <p>The implications for religious life are profound: the saints and demigods that the faithful venerate are not
        distant memories but sleeping beings, physically present somewhere beneath the mountains, the forests, or the
        sea. The shrines built in their honour sometimes sit directly above the sites where they rest.</p>

        </section>

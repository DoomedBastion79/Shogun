  - _id: coXt5kNPHsydfMoA
    _key: '!journal.pages!FAOlL8D3kPY1rEAc.coXt5kNPHsydfMoA'
    name: Ancestor Veneration
    type: text
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >
        <p>The dead do not leave. Not entirely. In Kagekuni&#39;s understanding, the boundary between the living and the
        deceased is less a wall than a screen — translucent, permeable, and never quite solid. The ancestors watch. They
        listen. And they care, deeply, about the conduct of their descendants.</p>

        <p>Every household of any standing maintains a <strong>butsudan</strong> — a family shrine where the names,
        images, and memorial tablets of the dead are kept. Daily offerings of rice, incense, water, and sometimes
        @UUID[Compendium.kagekuni-assistant.items.Item.aWfQyc0LZGZ3GPk6]{sake} are made to the ancestors, accompanied by
        prayers that range from formal invocations to quiet conversation. A samurai may inform his grandfather&#39;s
        tablet of a promotion. A merchant may ask a deceased parent&#39;s forgiveness for a poor decision. A child may
        simply say good morning.</p>

        <p>At the community level, temples maintain records of the dead and conduct ceremonies marking the anniversaries
        of passing, seasonal remembrances, and festivals where the boundary between worlds thins and the ancestors are
        believed to return briefly to the mortal realm. These are not sombre occasions — they are celebrations, feasts,
        and reunions with the dead conducted in a spirit of joy and gratitude rather than grief.</p>

        <p>Ancestor veneration carries practical weight in Kagekuni&#39;s political life. A daimyō whose ancestors
        served with honour can invoke that legacy as a source of authority. A family whose ancestors committed shameful
        acts may carry that burden for generations. The dead vote, in a sense — their reputation shapes the living&#39;s
        standing in ways that no amount of present achievement can entirely overcome.</p>
      markdown: ''

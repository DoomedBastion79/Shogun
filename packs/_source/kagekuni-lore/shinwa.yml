  - _id: yuMqov3mWxZrVTnq
    _key: '!journal.pages!FAOlL8D3kPY1rEAc.yuMqov3mWxZrVTnq'
    name: Structure
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >
        <p>The Miyosai system is a gravitationally bound trinary stellar system. All three stars orbit a common
        <strong>barycenter</strong> — the true gravitational center of the system. Amaterasu is the most massive of the
        three and carries its planetary family with it as it completes its barycentric orbit. Seizan, as one of those
        planets, travels with Amaterasu.</p>

        <pre><code>Barycenter (common gravitational center)

        ├── Amaterasu — orbits barycenter on its own inclined plane

        │   └── Planetary system — orbits Amaterasu (includes Seizan)

        │       └── Moons — orbit Seizan

        ├── Susanoo — orbits barycenter on its own inclined plane

        └── Tsukuyomi — orbits barycenter on its own inclined plane

        </code></pre>

        <p>The three stars travel on <strong>different orbital inclinations</strong> relative to each other, producing a
        three-dimensional dance rather than a flat orbital disc. Each star&#39;s position in Seizan&#39;s sky shifts
        continuously as all three complete their individual barycentric orbits. The named astrological events in the
        existing record — Nagorikaze, Long Shadow — are the routine expressions of this dance: individual stars reaching
        notable positions within normal orbital variation.</p>
      markdown: ''
    video:
      controls: true
      volume: 0.5
    src: null
    system: {}
    category: null
    sort: 180

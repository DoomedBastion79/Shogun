    image: {}
    text:
      format: 1
      content: >
        <p>All three stars at maximum mutual distance. Amaterasu&#39;s armature sits at one extreme of its barycentric
        arc, the planetary family clustered around it. Susanoo&#39;s armature sits at the opposing extreme on its
        inclined plane. Tsukuyomi&#39;s armature sits at its own opposing extreme on its differently inclined plane.
        Three separate arms on three separate planes, all pointing away from each other. The geometry of the event is
        legible in the mechanism before the party processes the darkness — they can see <em lang="ja-Latn">why</em> it

  - _id: 2f8whY6wykoI9zhW
    _key: '!journal.pages!FAOlL8D3kPY1rEAc.2f8whY6wykoI9zhW'
    name: The Divine
    type: text
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >
        <p>At the foundation of Kagekuni&#39;s faith is a single supreme divine being — an ultimate creator whose nature
        is understood to transcend mortal comprehension. This entity is not named in common speech, not depicted in art,
        and not the subject of direct worship in the way a familiar god might be. It simply is. The divine is the origin
        point from which all other spiritual beings descend, the source of the natural order, and the reason the world
        holds together rather than falling apart.</p>

        <p>Beneath this supreme being, a hierarchy of venerated figures serves as intermediaries between the divine and
        the mortal world. These figures — historical heroes, legendary seimasters, mythologised rulers, and great
        spiritual teachers — occupy a role analogous to saints. Shrines and temples may be dedicated to specific figures
        without contradiction; a shrine to a legendary healer and a shrine to a dragon ancestor both point upward toward
        the same ultimate source.</p>

        <p>This structure allows for enormous local variation. A fishing village on the coast of
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.ijGHvVOlw9tFpBo8]{Nami}
        may venerate a storm-calming saint unknown in the interior of
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.EPAWGqYCrUzYfngV]{Kusa}.
        A mountain monastery may honour a philosopher whose name has never been spoken in
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.Zk6QD9Sdfud4SuRV]{Heian}. The faith accommodates these
        differences without strain — local devotion and universal truth coexist.</p>
      markdown: ''

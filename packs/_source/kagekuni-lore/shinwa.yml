  - _id: JASqWsgPK2OksWAy
    _key: '!journal.pages!FAOlL8D3kPY1rEAc.JASqWsgPK2OksWAy'
    name: The Seven Dragons
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>The founding dragons occupy a unique position in Kagekuni&#39;s spiritual landscape — elevated above saints,
        distinct from kami, revered as something closer to demigods. They are the seven Progenitors who ruled the
        archipelago before the first human emperor rose to power, and whose bloodlines, according to tradition, flow
        through the veins of the dragonborn elite and the imperial line itself.</p>

        <table>

        <thead>

        <tr>

        <th>Clan</th>

        <th>Dragon</th>

        <th>Color</th>

        <th>Domain</th>

        </tr>

        </thead>

        <tbody><tr>

        <td><strong>Crimson Clan</strong></td>

        <td>Akaryū</td>

        <td>Red</td>

        <td>Fire, volcanic power, strength</td>

        </tr>

        <tr>

        <td><strong>Azure Clan</strong></td>

        <td>Aoryū</td>

        <td>Blue</td>

        <td>Water, storms, coastal protection</td>

        </tr>

        <tr>

        <td><strong>Emerald Clan</strong></td>

        <td>Midoryū</td>

        <td>Green</td>

        <td>Nature, earth, healing, balance</td>

        </tr>

        <tr>

        <td><strong>Onyx Clan</strong></td>

        <td>Kokuryū</td>

        <td>Black</td>

        <td>Shadow, darkness, cunning, mystery</td>

        </tr>

        <tr>

        <td><strong>Golden Clan</strong></td>

        <td>Kinryū</td>

        <td>Gold</td>

        <td>Honour, justice, nobility, mediation</td>

        </tr>

        <tr>

        <td><strong>Silver Clan</strong></td>

        <td>Ginryū</td>

        <td>Silver</td>

        <td>Grace, purity, ice, moon and stars</td>

        </tr>

        <tr>

        <td><strong>Amethyst Clan</strong></td>

        <td>Murasakiryū</td>

        <td>Purple</td>

        <td>Arcane knowledge, divination, mystical arts</td>

        </tr>

        </tbody></table>

        <p>Each dragon clan once ruled from a specific island or region of the archipelago, and the cultural memory of
        those domains persists in regional identity, local festivals, and the heraldry of the clans that claim descent
        from them. Temples and shrines dedicated to the founding dragons are found across Kagekuni — some grand and
        well-maintained, others ancient and half-forgotten, their stonework crumbling under moss and rain.</p>

        <p>The first emperor, <strong>Tenryū no Mikado</strong>, is said to have descended from both the Crimson and
        Golden bloodlines — fire and justice united in a single line. His unification of the warring dragon clans
        approximately eight thousand years ago established the imperial dynasty and the political order that persists,
        in increasingly fractured form, to this day.</p>

        <p>In the current era, the founding dragons are considered historical and mythological figures. The world at
        large believes them long dead or ascended beyond mortal reach. Dragon eggs — occasionally unearthed from ancient
        sites — are treated as fossils and collectibles rather than signs of living beings.</p>

        <p>Dragonborn within the Kugai elite claim direct descent from the founding dragons, and this claim forms the
        bedrock of noble authority in many clans. Whether the genealogies are genuine or constructed, the social power
        they convey is real.</p>


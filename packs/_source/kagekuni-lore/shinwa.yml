  - _id: okYaQ2sJ15fNUVFv
    _key: '!journal.pages!FAOlL8D3kPY1rEAc.okYaQ2sJ15fNUVFv'
    name: Temples & Monastic Traditions
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >
        <p>Monasteries serve as centres of learning, contemplation, and — not infrequently — political refuge. The
        monastic traditions of Kagekuni draw on a contemplative philosophy that emphasises mindfulness, detachment from
        worldly desire, and the cultivation of inner stillness. Monks and nuns withdraw from the hierarchies of secular
        life, though in practice monasteries are never entirely free from political entanglement.</p>

        <p>Several monastic orders maintain influence across the archipelago:</p>

        <p>The <strong>Order of the Tranquil Lotus</strong> on Unmeijima combines nature-focused spirituality with
        rigorous physical discipline. Their elder,
        <strong>@UUID[Compendium.assistant.npcs-lore.JournalEntry.AxEPHd8zzzGU9DdG]{Benkei}</strong> — a Guhuza of 198
        years — is among the oldest known living individuals in Kagekuni.</p>

        <p>The <strong>Order of the Sacred Grove</strong> follows a druidic tradition devoted to protecting specific
        sacred sites. Their guardians tend individual locations for decades, maintaining a quiet vigil that most of the
        world never notices.</p>

        <p>The <strong>Order of the Black Lily</strong>, based above
        @UUID[Compendium.assistant.lore.JournalEntry.G73nlQAKU99FLB4T]{Akatsuki} village in
        @UUID[Compendium.assistant.lore.JournalEntry.bOpGneyl1iZ9BpRy]{Kaze} province, is less a spiritual order than a
        professional one — Kagekuni&#39;s premier infiltration specialists, operating from a monastery that serves as
        both temple and training facility.</p>

        <p>The tension between worldly duty and spiritual withdrawal runs through all of these traditions. A monk who
        retreats from the world still lives in it. A monastery that claims neutrality still sits on land that someone
        claims to own. The spiritual life of Kagekuni is never purely spiritual — it is always, in some measure,
        political.</p>
      markdown: ''

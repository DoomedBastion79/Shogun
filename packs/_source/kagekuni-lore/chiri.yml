    text:
      format: 1
      content: >+
        <h3 id="kg-geography-amp-terrain" data-section="geography-amp-terrain">Geography &amp; Terrain</h3>

        <p>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.OgpA5KI2G94uYoN7]{Sora}
        -- Sky -- is the highest-altitude province in Hokori and encompasses the majority of the lightly populated
        mountainous interior at the island&#39;s center. It is often the most dangerous region to traverse. Much of it
        sits above the cloud ceiling. A traveler ascending from lower provinces will emerge through dense cloud into a
        world of startling clarity: thin air, intense sunlight, vast visibility, and a profound silence broken only by
        wind.</p>

        <p>The province occupies the central mountain ranges that form the connective barrier between most of
        Hokori&#39;s other provinces. It borders nearly every other province in some capacity -- a sprawling, thinly
        governed wilderness between centres of population. The plateau itself is high grassland -- silvered grasses that
        catch light differently, giving the landscape an almost lunar quality. Standing water freezes for months; the
        ground is rocky and thin-soiled.</p>

        <p>The Hoshimori Plateau (Star Keeper&#39;s Plateau) is the defining feature -- wide, flat, and high enough that
        stars are visibly brighter than anywhere else in the archipelago. This made it the site of observatories and
        sei-research installations during the Golden Age, several of which still stand.</p>

        <p>The province has few settlements relative to its area, but the routes through it connect northern Hokori to
        the central, and controlling them carries strategic importance disproportionate to population.</p>

        <p>Points of Interest:</p>

        <ul>

        <li>Hoshimori Plateau (Star Keeper&#39;s Plateau) -- Exceptional astronomical observation site. The sky here
        behaves slightly differently -- star density appears higher and moons seem slightly larger. Whether this is
        optical illusion or something else has not been resolved.</li>

        <li>The Golden Age Observatories -- Three of seven observatories built during Emperor Kinryu no Mikado&#39;s
        reign remain structurally intact. Their instruments -- large bronze mechanisms -- are still functional and
        oriented to alignments no current seimaster fully understands. A fourth, largely collapsed, contains sealed
        records.</li>

        <li>The Storm Road -- Mountain route through Sora connecting
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.eAI9SnbW1RmsWOGw]{Hana}/Hi
        to the northern coast. Impassable in winter; deteriorating without central maintenance authority.</li>

        </ul>

        <h3 id="kg-settlements" data-section="settlements">Settlements</h3>

        <table>

        <thead>

        <tr>

        <th>Settlement</th>

        <th>Type</th>

        <th>Notes</th>

        </tr>

        </thead>

        <tbody><tr>

        <td>Kumo-no-Ue</td>

        <td>Town</td>

        <td>&quot;Above the Clouds&quot;; provincial capital; cold year-round</td>

        </tr>

        <tr>

        <td>Hoshimori</td>

        <td>Village</td>

        <td>On the plateau; observatory town; seimaster community</td>

        </tr>

        <tr>

        <td>Kanransha</td>

        <td>Village</td>

        <td>Mountain pass waypoint; transit community; temporary lodging industry</td>

        </tr>

        </tbody></table>

        <h3 id="kg-culture-amp-trade" data-section="culture-amp-trade">Culture &amp; Trade</h3>

        <p>Sora&#39;s small population is centered around the observatory communities and the transit routes that cross
        the province. The seimaster community at Hoshimori represents a concentration of astronomical and magical
        expertise. The province&#39;s isolation and altitude make it a natural retreat for those seeking contemplation
        or research.</p>

        <h3 id="kg-history" data-section="history">History</h3>

        <p>During the Golden Age, Sora was a center of astronomical research and sei study, with seven observatories
        constructed on the Hoshimori Plateau. The Dark Ages saw these installations abandoned. The province&#39;s
        strategic importance lies in controlling the mountain routes connecting northern and central Hokori.</p>

        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>Details</strong></p>

        <p>The functional observatories are producing readings that match a pattern the ancient seimasters considered
        significant -- the Ryushinki (Dragon Awakening).</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>A seimaster from Hoshimori has been trying to reach
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.Zk6QD9Sdfud4SuRV]{Heian} with urgent information for three
        months and has not arrived.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>The Abandoned Observatory Records</strong></p>

        <p>The sealed records in the collapsed fourth observatory contain documentation of a celestial alignment the
        Kinryu-era seimasters considered dangerous. The alignment -- involving all three stars, two specific moons, and
        a specific planetary configuration -- they called Ryushinki (Dragon Awakening). Their records suggest this
        alignment is associated with the founding dragons becoming active, visible, or vulnerable. The next occurrence
        is calculable and is not far away.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>The Silver Dragon Connection</strong></p>

        <p>Ginryu, the Silver Dragon, is connected to
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.OgpA5KI2G94uYoN7]{Sora}
        through the province&#39;s astronomical nature. She has been known to spend time on the Hoshimori Plateau. The
        plateau&#39;s unusual stellar appearance is partly her influence. She has not been seen in decades, but her
        presence would explain the plateau&#39;s anomalous sei readings.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>Plot Hooks</strong></p>

        <p>One of the functional observatories has started producing readings matching the Ryushinki pattern ahead of
        schedule -- something is wrong with the calculation, or something is accelerating</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>A seimaster from Hoshimori sent a letter ahead that references &quot;something moving in the clouds that is
        not a cloud&quot;</p>


        </section>


      content: >+
        <h3 id="kg-geography-amp-terrain" data-section="geography-amp-terrain">Geography &amp; Terrain</h3>

        <p>Hi is the most geologically violent province on Hokori -- a region of active volcanism, fumarole fields,
        obsidian plains, and mountains that periodically tear themselves apart. It encompasses the majority of the
        island&#39;s western side, surrounded by mountains and the sea.
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.qODDmax1GHoTx3fx]{Tsuchi}
        borders it to the southeast,
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.eAI9SnbW1RmsWOGw]{Hana}
        shares a small stretch of its eastern border,
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.OgpA5KI2G94uYoN7]{Sora}
        encompasses its northern boundary, and
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.M72zAjYRdrTCan30]{Mizu}
        sits along its western edge. Earthquakes are ambient. Residents learn to read tremors the way sailors read
        wind.</p>

        <p>The province takes its name -- Hi, meaning fire -- from the volcanic peaks that define it. The largest,
        Enshiyama (Flame Peak Mountain), is the third highest peak on Hokori. It last erupted in full approximately two
        hundred years ago.</p>

        <p>The terrain is dramatic and hostile. Black obsidian fields stretch for miles where ancient lava flows cooled
        and cracked. Fumarole vents release sulfurous steam. Soil, where it exists, is extraordinarily fertile --
        volcanic ash enriches it beyond anything in the southern provinces. Terraced farming on the slopes between
        active zones produces crops of startling quality. This contradiction -- death and abundance in tight proximity
        -- defines Hi&#39;s cultural character.</p>

        <p>Rivers here run fast and hot from thermal sources. The Honogawa (Flame River) originates from a thermal lake
        near Enshiyama&#39;s base and is warm to the touch for its entire upper reach.</p>

        <p>Points of Interest:</p>

        <ul>

        <li>Enshiyama (Flame Peak Mountain) -- Dominant volcano of Hokori&#39;s north. Currently active at low levels.
        Crater contains a mineral-rich lake that glows faintly orange at night.</li>

        <li>Honogawa (Flame River) -- Warm thermal river. Upper reach near the source is hot enough to scald. Runs
        through a narrow volcanic gorge.</li>

        <li>Obsidian Fields of Kuroso -- Vast plains of black volcanic glass. Obsidian of exceptional quality, ideal for
        blades and lenses. Seismically active and hazardous.</li>

        <li>The Crimson Shrine -- Deep in the volcanic highlands, predating the empire. Torii of natural red stone.
        Local tradition holds Akaryu&#39;s presence can be felt during major eruptions. Never absorbed into the imperial
        religious system.</li>

        <li>Onsen-machi Hot Springs -- The only genuinely comfortable location in Hi. Natural hot spring pools developed
        into a resort town maintaining political neutrality.</li>

        </ul>


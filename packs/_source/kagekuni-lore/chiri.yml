  - _id: M72zAjYRdrTCan30
    _key: '!journal.pages!IxWbWZoFox1yoTDs.M72zAjYRdrTCan30'
    name: Mizu
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >+
        <h3 id="kg-geography-amp-terrain" data-section="geography-amp-terrain">Geography &amp; Terrain</h3>

        <p>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.M72zAjYRdrTCan30]{Mizu}
        is a province of water in all its forms -- crashing coastal surf, wide navigable rivers, reed-choked estuaries,
        tidal flats that stretch for miles at low compound tide, and interior lakes fed by reliable rainfall. It wraps
        around the northwestern string of mountains on Hokori, with Hi to the southeast,
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.OgpA5KI2G94uYoN7]{Sora}
        along its eastern and southern borders, and
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.EPAWGqYCrUzYfngV]{Kusa}
        to the northeast. The Raijin no Fukai sea drives against its western and northern coastline with consistent
        force. The Kōri-no-Mori forest occupies its northern shores.</p>

        <p>The coastline is irregular and complex -- carved into headlands, sheltered coves, sea-stacks, and natural
        harbors. The Shirakawa Estuary (White River Estuary) at the province&#39;s center is one of the largest
        navigable estuaries in the archipelago. The city of Minato-jo occupies a raised headland at the estuary&#39;s
        mouth.</p>

        <p>Inland, the terrain transitions through agricultural floodplains and into the foothills of the central Hokori
        ranges. Rice production in Mizu&#39;s river valleys is among the highest in the archipelago -- the combination
        of reliable rainfall, mineral-rich alluvial soil, and excellent river irrigation infrastructure makes the
        province&#39;s farming output disproportionately important to regional food security.</p>

        <p>Relc&#39;s home village of @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.glkgG2E8eJWrxCrm]{Koriwara}
        is located in Mizu province&#39;s interior, in a foothills region where the climate shifts from maritime to
        montane.</p>

        <p>Points of Interest:</p>

        <ul>

        <li>Shirakawa Estuary -- The great river mouth. At compound low tide, the tidal flats extend so far the estuary
        looks almost dry. Channel navigation is complex; experienced local pilots are required for larger vessels.</li>

        <li>Koriwara and the Sacred Grove Elder -- The village is unremarkable on its surface. What makes it significant
        is Elder Sato Hideaki, whose connection to the Order of the Sacred Grove gives Koriwara significance
        disproportionate to its size.</li>

        <li>The Tidal Caves of Umigakure -- Sea caves accessible only during compound low tides. The caves extend far
        back into the coastal cliffs. Internal airflow suggests a significant interior cavity somewhere behind the
        accessible chambers.</li>

        </ul>

        <h3 id="kg-settlements" data-section="settlements">Settlements</h3>

        <table>

        <thead>

        <tr>

        <th>Settlement</th>

        <th>Type</th>

        <th>Notes</th>

        </tr>

        </thead>

        <tbody><tr>

        <td>Minato-jo</td>

        <td>City</td>

        <td>Provincial capital; major western port; Arashi-aligned; significant naval presence</td>

        </tr>

        <tr>

        <td>Shirakawa</td>

        <td>Town</td>

        <td>Estuary trading town; river barge terminus; fishing fleet base</td>

        </tr>

        <tr>

        <td>Koriwara</td>

        <td>Village</td>

        <td>Relc&#39;s home village; Elder Sato Hideaki; Order of the Sacred Grove connection</td>

        </tr>

        <tr>

        <td>Umigakure</td>

        <td>Village</td>

        <td>&quot;Sea-hidden&quot;; small cove settlement; smuggling history</td>

        </tr>

        <tr>

        <td>Inasato</td>

        <td>Village</td>

        <td>Interior rice farming; cooperative agricultural commune</td>

        </tr>

        </tbody></table>

        <h3 id="kg-culture-amp-trade" data-section="culture-amp-trade">Culture &amp; Trade</h3>

        <p>Mizu&#39;s economy is built on maritime trade, fishing, and rice agriculture. Minato-jo serves as the primary
        western port of Hokori, handling trade routes across the Raijin no Fukai sea. The province&#39;s rice production
        is a strategic asset, and its river systems support extensive barge commerce connecting the coast to the
        interior.</p>

        <h3 id="kg-history" data-section="history">History</h3>

        <p>Mizu has long been one of Hokori&#39;s most strategically important provinces due to its western coastline
        and natural harbors. The province&#39;s current alignment with the Arashi Alliance reflects its maritime
        orientation and the naval capabilities centered at Minato-jo.</p>

        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>Details</strong></p>

        <p>Elder Sato Hideaki in @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.glkgG2E8eJWrxCrm]{Koriwara} is
        more than a village elder with nature connections -- he has deep ties to the Order of the Sacred Grove.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>One of the three stones referenced in Solas&#39;s cipher poem is near
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.glkgG2E8eJWrxCrm]{Koriwara}.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>The Tidal Caves of Umigakure have started showing light from deep within during night compound tides -- a new
        phenomenon.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>The Order of the Sacred Grove --
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.glkgG2E8eJWrxCrm]{Koriwara} Connection</strong></p>

        <p>Elder Sato Hideaki is a mid-rank member of the Order of the Sacred Grove. He has interacted with Order of the
        Ancient Guard agents, including
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.Tpou815uKS3CU4HS]{Solas
        Evergreen} directly. He knows Solas was Ancient Guard (not just Sacred Grove). He has not told Relc because he
        was following Solas&#39;s instruction to let Relc develop organically.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>The Cipher Poem&#39;s Connection to
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.glkgG2E8eJWrxCrm]{Koriwara}</strong></p>

        <p>One of the three stones referenced in Solas&#39;s cipher poem is near Koriwara -- in the foothills. Elder
        Sato knows this stone and knows, vaguely, what the Warden&#39;s Wisdom is: protected knowledge about the
        locations of the living dragons.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>Arashi Naval Presence</strong></p>

        <p>Minato-jo&#39;s Arashi Alliance-aligned clan has been quietly building naval capacity beyond defensive
        requirements. Someone is planning an offensive operation involving the western sea. The scope of construction
        suggests something significant.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>Plot Hooks</strong></p>

        <p>Sato Hideaki has sent word through a traveling merchant -- he needs to speak with Relc urgently; something
        happened near the sacred grove he tends</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>The Tidal Caves of Umigakure have started showing light from deep within during night compound tides -- a
        phenomenon not present three months ago</p>


        </section>


        <td>Village</td>

        <td>Black river settlement; obsidian crafting; trade in volcanic glass</td>

        </tr>

        <tr>

        <td>Onsen-machi</td>

        <td>Town</td>

        <td>Hot spring resort town; wealthy visitors; nominal neutrality</td>

        </tr>

        <tr>

        <td>Takibi</td>

        <td>Village</td>

        <td>Remote highland farming community; terraced volcanic fields</td>

        </tr>

        </tbody></table>

        <h3 id="kg-culture-amp-trade" data-section="culture-amp-trade">Culture &amp; Trade</h3>

        <p>Hi&#39;s culture is defined by proximity to death. The people are laconic, practical, and possess a dark
        humor about their circumstances. They do not flee volcanic activity -- they have developed sophisticated systems
        for reading, mitigating, and living alongside it. Hi&#39;s volcano-guides, engineers, and evacuation specialists
        are prized across the archipelago.</p>

        <p>Primary exports are obsidian, volcanic sulfur (used in alchemy and sei-related preparations), hot spring
        minerals, and surprisingly excellent agricultural products from volcanic terraces. The Onsen-machi resort draws
        wealthy visitors from across Hokori and beyond.</p>

        <h3 id="kg-history" data-section="history">History</h3>

        <p>Hi was long considered a backwater -- too dangerous and too remote. The Crimson Dragon Clan had their true
        stronghold here before unification, and the western reaches refused submission to Tenryu no Mikado. That refusal
        left a cultural legacy: Hi&#39;s people are fiercely independent and deeply skeptical of imperial authority.</p>

        <p>During the Dark Ages, Hi was almost entirely abandoned by formal authority. Small communities developed their
        own governance structures, spiritual practices, and martial traditions largely divorced from the broader
        empire.</p>

        <p>The province is currently in contested administration. The previous governing clan was wiped out in the
        opening engagements of the Arashi-Genso war, and neither alliance has installed a replacement. Several smaller
        clans are vying for the position.</p>

        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>Details</strong></p>

        <p>The Crimson Shrine&#39;s keeper,
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.oACSZZYBMIV9sr54]{Tsubaki},
        has served for sixty years and communicates with something through the shrine&#39;s ember-bowl.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>The western territories of Hi are home to descendants of the Crimson Clan faction that refused unification,
        organized into loose tribal confederacies preserving forgotten traditions.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>Seimasters debate whether Enshiyama&#39;s current activity signals a major eruption building.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>The Crimson Dragon Clan&#39;s Hidden Presence</strong></p>

        <p>Akaryu, the Crimson Dragon, is still alive and hidden. She maintains a tenuous connection to Hi through the
        Crimson Shrine. The shrine&#39;s keeper
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.oACSZZYBMIV9sr54]{Tsubaki}
        is an Initiate of the Order of the Ancient Guard. She does not know Akaryu&#39;s location, but knows the dragon
        is alive. Offerings burned in the shrine&#39;s ember-bowl reach something that responds.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>The Western Territories</strong></p>

        <p>The western reaches are effectively a separate entity. Descendants of the Crimson Clan faction that refused
        Tenryu&#39;s unification live there in loose tribal confederacies that have preserved traditions the rest of the
        empire forgot. They are fiercely territorial and know things about the volcanic highlands that no imperial map
        captures.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>Enshiyama and the Coming Eruption</strong></p>

        <p>The current low-level activity is the precursor to a significant eruption -- within one to three years. The
        seimasters who know this are divided on whether to publicize it; the political vacuum means there is no
        coordinating authority capable of organizing evacuation. This is an unlit fuse.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>The Contested Administration</strong></p>

        <p>The three clans competing for Hi&#39;s governance are being quietly manipulated by a fourth party -- a
        merchant consortium that wants provincial administration too weak to enforce trade regulations. The current
        chaos is, to some degree, manufactured.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>Plot Hooks</strong></p>

        <p>A volcano-guide from Kazan Mura has seen something in the upper reaches of Enshiyama -- something that moved
        against the wind -- and is too frightened to go back alone</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>The Crimson Shrine&#39;s ember-bowl responded to an offering in a way it never has before;
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.oACSZZYBMIV9sr54]{Tsubaki}
        needs discreet help interpreting what it means</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>A seimaster studying the eruption precursors has disappeared; her notes suggest she found something in the
        obsidian fields that was not geological</p>


        </section>


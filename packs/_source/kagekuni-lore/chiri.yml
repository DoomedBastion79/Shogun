    text:
      format: 1
      content: >+
        <h3 id="kg-geography-amp-terrain" data-section="geography-amp-terrain">Geography &amp; Terrain</h3>

        <p>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.D2VV9bFa1txuKDxB]{Kaze}
        is a province of shadows and mist. It occupies the eastern side of Hokori&#39;s northeastern leg -- the
        X-shape&#39;s upper-right arm.
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.ijGHvVOlw9tFpBo8]{Nami}
        sits to the north,
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.EPAWGqYCrUzYfngV]{Kusa}
        to the west,
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.eAI9SnbW1RmsWOGw]{Hana}
        to the south, and
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.OgpA5KI2G94uYoN7]{Sora}
        shares a brief stretch of its southwestern border. Sheltered from direct coastal weather by mountain ranges, it
        has a microclimate of cool, damp air that never fully clears. The province averages fewer clear days per year
        than any other on the island. Its forests -- dense stands of dark cedar and ancient black pine -- grow so
        thickly that the canopy blocks most sunlight even in summer. Locals navigate by landmark and feel rather than by
        sun or stars.</p>

        <p>The terrain is mountainous, cut by deep river valleys and narrow gorges. The Kazeyama Ren (Wind Mountain
        Range) runs along the province&#39;s southern border, channeling wind up the valleys in complex, disorienting
        patterns. Sounds carry strangely here, seeming to come from the wrong direction.</p>

        <p>The Kagero River (Shimmer River) is the primary waterway -- named for the heat shimmer visible over its
        surface on rare warm days, caused by thermal differential between the water temperature and the cool air.</p>

        <p>The town of @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.ow3AGqlvFevncAwN]{Akatsuki} (Dawn) occupies
        a peculiar position -- its name suggests emergence and new light, but it is one of the most shrouded settlements
        in the archipelago. The name predates the current settlement.</p>

        <p>Points of Interest:</p>

        <ul>

        <li>Tsukikage (Moonlit Shadow) -- Abandoned former capital of Clan Gekko. Not destroyed or obviously fled in
        panic -- it simply emptied gradually over several months. Personal belongings remain in homes. The daimyo&#39;s
        residence is locked from the outside.</li>

        <li>Monastery of the Black Lily -- Above Akatsuki village, accessible by stone staircase cut into rock. Dark
        stone and iron construction; austere; forbidding. The Order of the Black Lily operates here -- Kagekuni&#39;s
        most skilled infiltrators and intelligence operatives.</li>

        <li>The Kagero Gorge -- Narrow river gorge with complex, disorienting acoustics. The gorge wall contains
        numerous carved reliefs depicting serpentine figures that do not match any known iconographic tradition.</li>

        <li>The Hollow Peaks -- Three mountains in the Kazeyama Ren that are demonstrably hollow. Cold air vents from
        fissures at their bases year-round. Sei-sensitive individuals report a powerful residual presence.</li>

        </ul>

        <h3 id="kg-settlements" data-section="settlements">Settlements</h3>

        <table>

        <thead>

        <tr>

        <th>Settlement</th>

        <th>Type</th>

        <th>Notes</th>

        </tr>

        </thead>

        <tbody><tr>

        <td>Tsukikage</td>

        <td>Town</td>

        <td>Traditional Gekko capital; functionally abandoned; eerie and intact</td>

        </tr>

        <tr>

        <td>Akatsuki</td>

        <td>Village</td>

        <td>De facto administrative center; above it: Monastery of the Black Lily</td>

        </tr>

        <tr>

        <td>Kazetani</td>

        <td>Village</td>

        <td>Deep valley settlement; largely cut off; residents haven&#39;t left in months</td>

        </tr>

        <tr>

        <td>Kirigakure</td>

        <td>Village</td>

        <td>Literally &quot;hidden in mist&quot;; the most isolated settlement; some suggest it moves</td>

        </tr>

        <tr>

        <td>Mikazuki</td>

        <td>Village</td>

        <td>Crescent Moon Village; southern border; last outpost before Hana</td>

        </tr>

        </tbody></table>

        <h3 id="kg-culture-amp-trade" data-section="culture-amp-trade">Culture &amp; Trade</h3>

        <p>Kaze&#39;s culture is inward-facing. Primary exports have historically been information -- Clan Gekko&#39;s
        intelligence networks and the Order of the Black Lily&#39;s trained specialists. In tangible terms, Kaze
        produces excellent black pine lumber, rare mountain herbs for medicine and alchemy, and distinctive lacquerware
        using naturally sourced pigments from mineral-rich soil.</p>

        <p>The people of Kaze are not cold -- they are careful. A culture of watching and listening developed naturally
        in a province where visibility is limited and sound behaves unreliably. They form deep loyalties within small
        groups and extend trust to outsiders only after extended familiarity.</p>

        <h3 id="kg-history" data-section="history">History</h3>

        <p>Kaze was historically the domain of Clan Gekko, an independent clan that maintained careful neutrality
        through successive political upheavals. The Gekko were notable for producing seimasters specializing in shadow
        and illusion magic -- linked to the province&#39;s physical character and lingering influence from the Onyx
        Dragon Clan.</p>

        <p>The province was never fully subdued -- even Tenryu no Mikado secured Gekko cooperation through negotiation
        rather than conquest. This arrangement eventually crystallized into the Order of the Black Lily, Kagekuni&#39;s
        premier infiltration school.</p>

        <p>Clan Gekko&#39;s recent disappearance has plunged the province into deep unease. Trade has slowed. The
        provincial administration has stopped communicating with
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.Zk6QD9Sdfud4SuRV]{Heian}. Small communities have reported
        strange encounters -- serpentine figures glimpsed on mountain trails, abandoned buildings showing signs of
        violent disturbance, livestock found dead in unnatural ways.</p>

        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>Details</strong></p>

        <p>Clan Gekko&#39;s disappearance was not caused by an outside force -- the senior seimasters attempted
        something that went catastrophically wrong.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>The Order of the Black Lily knows the truth about what happened and has made a calculated decision about when
        to reveal it.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>The Hollow Peaks were structures of the Onyx Dragon Clan -- hollow mountains used as nesting and storage
        spaces.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>The gorge carvings depict something connected to the transformation that befell Clan Gekko.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>The Nagaji Truth -- Core Campaign Revelation</strong></p>

        <p>Clan Gekko&#39;s disappearance was not caused by an outside force. The clan&#39;s senior seimasters,
        searching for a way to elevate their shadow magic capability, discovered fragmentary texts describing an Onyx
        Dragon ritual -- a transformation rite tied to Kokuryu. It transformed those who underwent it into Nagaji --
        serpentine humanoids driven by new instincts they cannot fully suppress. The transformation spread. Masota no
        Gekko himself underwent the ritual last, in a desperate attempt to maintain control. He is now Nagaji as well --
        somewhere in the
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.D2VV9bFa1txuKDxB]{Kaze}
        highlands.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>The Order of the Black Lily -- What They Know</strong></p>

        <p>The Order knows the truth about the Nagaji transformation. Several operatives witnessed the early stages. The
        Order has made a calculated decision: the information is too dangerous to release without a reversal plan. They
        will share the complete truth with parties who reach them -- but only the complete truth, no partial
        admissions.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>Is the Transformation Reversible?</strong></p>

        <p>Yes -- but the answer lies in the Temple of Kinryu, specifically in the clan&#39;s records about
        Kokuryu&#39;s original ritual and the countermeasure that the Golden Dragon Clan developed. This creates a
        direct link between the party&#39;s current location (the gold doors) and the
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.D2VV9bFa1txuKDxB]{Kaze}
        storyline.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>Masota no Gekko -- Current State</strong></p>

        <p>He is alive, in the
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.D2VV9bFa1txuKDxB]{Kaze}
        highlands. He retains fragments of his original identity but the transformation suppresses rational thought
        during stress or combat. He is not a villain. He is a leader who made a terrible decision in desperation. A
        potential redemption arc exists if the party can find a reversal.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>The Hollow Peaks</strong></p>

        <p>These were Onyx Dragon Clan structures. The interior of at least one is accessible from the gorge. What
        remains inside is ancient and significant: Onyx Clan cultural artifacts, including documentation of the
        transformation ritual.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>Plot Hooks</strong></p>

        <p>The Order of the Black Lily sends a message via an intermediary: &quot;Come to
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.ow3AGqlvFevncAwN]{Akatsuki}. Come alone. Come before the
        moon is full.&quot;</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>Masota no Gekko leaves something behind at a ransacked site -- something a transformed being could not have
        done deliberately unless part of him was still trying to communicate</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>A scholar in Mikazuki has been studying the gorge carvings for years and has just realized what they
        depict</p>


        </section>


    text:
      format: 1
      content: >+
        <h3 id="kg-geography-amp-terrain" data-section="geography-amp-terrain">Geography &amp; Terrain</h3>

        <p>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.EPAWGqYCrUzYfngV]{Kusa}
        is Hokori&#39;s verdant interior -- a province of dense forests, wide river floodplains, and grasslands so deep
        and tall that travelers on foot are hidden from view within a hundred paces. It occupies the western side of
        Hokori&#39;s northeastern leg, with
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.OgpA5KI2G94uYoN7]{Sora}
        encroaching on its southeastern border,
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.M72zAjYRdrTCan30]{Mizu}
        to the southwest,
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.ijGHvVOlw9tFpBo8]{Nami}
        to the north, and
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.D2VV9bFa1txuKDxB]{Kaze}
        to the east. Drainage from surrounding mountain ranges converges here, creating a network of rivers, oxbow
        lakes, and seasonal wetlands that makes the land extraordinarily fertile and difficult to traverse without
        knowing the paths.</p>

        <p>The forests are ancient and immense, dark-trunked hardwoods with canopies that diffuse light into a permanent
        green twilight. The forest floor grows in luminous violet and deep blue hues -- murasaki-gusa (purple grass) and
        aoi-koke (blue moss) -- endemic to the interior lowlands and giving the province a distinctive visual character
        unique in Hokori.</p>

        <p>The Midori River is the primary artery -- wide, slow-moving, navigable for flat-bottomed vessels. The capital
        Midoriko sits at the junction of the Midori and its largest tributary, the Futago-kawa (Twin River).</p>

        <p>The Kusayama Ren (Grass Mountains) forms the province&#39;s northern boundary. Notable for the Yosei Mori
        (Forest of Spirits), a region of ancient woodland where sei activity is consistently elevated and unusual
        phenomena are reported year-round.</p>

        <p>Points of Interest:</p>

        <ul>

        <li>Yosei Mori (Forest of Spirits) -- Sei-active ancient woodland. Navigation is genuinely unreliable. The
        Forest of Spirits faction maintains sanctuaries within. Unusual creatures in deeper reaches exhibit
        significantly elevated intelligence.</li>

        <li>Heiwa-mizo (Peace Ditch) -- Old defensive trench in Midoriko, now a long public garden with cherry trees.
        Hosts the Sakura no Nagori (Lingering Cherry Festival) -- a political event as much as a cultural one.</li>

        <li>The Whispering Flats -- Unusual terrain in Kusa&#39;s central lowlands where violet grass grows to chest
        height and wind creates complex auditory patterns that some claim carry intelligible whispers. Local tradition
        says the dead speak from the Flats during the Long Shadow season.</li>

        </ul>

        <h3 id="kg-settlements" data-section="settlements">Settlements</h3>

        <table>

        <thead>

        <tr>

        <th>Settlement</th>

        <th>Type</th>

        <th>Notes</th>

        </tr>

        </thead>

        <tbody><tr>

        <td>Midoriko</td>

        <td>City</td>

        <td>Provincial capital; river junction; rebuilt from siege; significant military infrastructure</td>

        </tr>

        <tr>

        <td>Kusamoto</td>

        <td>Town</td>

        <td>Northern gateway to Kusayama Ren; staging point for forest expeditions</td>

        </tr>

        <tr>

        <td>Kawatsuki</td>

        <td>Town</td>

        <td>River trading town; barge terminus; merchant hub</td>

        </tr>

        <tr>

        <td>Mori no Sato</td>

        <td>Village</td>

        <td>Near the Yosei Mori border; Forest of Spirits&#39; public-facing community</td>

        </tr>

        <tr>

        <td>Hiranohara</td>

        <td>Village</td>

        <td>Grassland farming community; large flat-field agriculture</td>

        </tr>

        </tbody></table>

        <h3 id="kg-culture-amp-trade" data-section="culture-amp-trade">Culture &amp; Trade</h3>

        <p>Kusa&#39;s economy is built on agriculture, river trade, and the unique resources of its forests. The Midori
        River supports extensive barge commerce connecting the interior to coastal trade routes. The Forest of Spirits
        faction, which publicly revealed itself during the Plague Campaign, operates from sanctuaries within the Yosei
        Mori and represents a significant if unusual economic and cultural presence.</p>

        <h3 id="kg-history" data-section="history">History</h3>

        <p>Kusa was a battleground during the War of Fractured Banners. The Defense of Midoriko was one of the war&#39;s
        early major engagements -- the provincial capital was besieged and nearly fell before a relief force broke
        through. The scars of that siege are still visible in Midoriko&#39;s architecture.</p>

        <p>During the Dark Ages, the Forest of Spirits became a refuge -- its elevated sei activity, present even when
        magic was absent everywhere else, drew survivors. The communities formed there eventually became the Forest of
        Spirits magical faction that publicly revealed itself during the Plague Campaign.</p>

        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>Details</strong></p>

        <p>The Forest of Spirits faction holds research and findings from the Dark Ages that they have not shared
        publicly -- discoveries about sei behavior during the magic-absent era that would upend current seimaster
        orthodoxy.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>The Whispering Flats produce sounds that are not random and not the dead -- they are sei resonance from a
        buried structure beneath.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>The Forest of Spirits</strong></p>

        <p>The faction&#39;s sanctuary in Yosei Mori is more significant than their public profile suggests. During
        centuries in the forest, they didn&#39;t just survive -- they studied. They have records, experiments, and
        findings from the Dark Ages that would upend current seimaster orthodoxy.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>Midoriko&#39;s Garrison</strong></p>

        <p>The city&#39;s military infrastructure is controlled by a Genso Alliance-aligned clan. Its strategic location
        in the center of Hokori makes it a key pressure point -- control of Midoriko means control of Hokori&#39;s
        interior road network.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>The Whispering Flats</strong></p>

        <p>The sounds are sei resonance from a buried structure beneath the flats -- a pre-imperial site, possibly
        connected to the Emerald Dragon Clan (Midoryu). The structure has not been rediscovered. The violet grass grows
        most densely directly over it.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>Plot Hooks</strong></p>

        <p>The Forest of Spirits has a problem they cannot handle internally -- related to something their research
        during the Dark Ages disturbed that has recently become active again</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>Someone in Midoriko is passing military intelligence to the Arashi Alliance; the Genso governing clan needs
        quiet investigation</p>


        </section>


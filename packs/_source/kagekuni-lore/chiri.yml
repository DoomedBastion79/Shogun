    text:
      format: 1
      content: >
        <p>Hokori is the largest island in the Kagekuni archipelago — approximately 237,000 square miles, stretching 750
        miles long and 600 miles wide. Seen from above, the island is X-shaped, its form carved by the collision of four
        tectonic plates that converge beneath it. The geology is restless. Earthquakes are frequent. Volcanic peaks
        trail smoke from the northern highlands. Tsunamis reshape the coastline. The people of Hokori have built their
        civilisation not despite this instability but in conversation with it — their architecture flexes, their
        settlements relocate, and their culture carries the pragmatic resilience of people who know the ground beneath
        them is never truly still.</p>

        <p>Hokori is divided into <strong>eight provinces</strong>, each with its own geography, climate, political
        allegiance, and character. The imperial capital of
        <strong>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.Zk6QD9Sdfud4SuRV]{Heian}</strong> sits in the
        eastern province of
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.eAI9SnbW1RmsWOGw]{Hana}.
        The <strong>Emperor&#39;s Highway</strong> extends from Heian in three directions, forming the primary overland
        transportation network. River systems — particularly the Midori, Tsuchikawa, and Kinryūgawa — serve as major
        trade arteries, while coastal shipping connects the port cities of Minato-jō in the west and Namigashira in the
        east.</p>


  - _id: 9v08UUPM5EoJoiz3
    _key: '!journal.pages!IxWbWZoFox1yoTDs.9v08UUPM5EoJoiz3'
    name: Tatara
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >
        <p>Tatara is the second largest island in the archipelago — mountainous, heavily fortified, and defined by a
        conflict older than the empire itself. The island is the heartland of two peoples: the <strong>Zirak</strong>
        (dwarves) and the <strong>Glimfyr</strong> (gnomes), whose rivalry predates human settlement and has outlasted
        every attempt at permanent resolution. When the emperor commands peace, they comply. When the emperor dies, they
        resume. There is no emperor now.</p>

        <p>The island&#39;s terrain is rugged — dense mountain ranges, deep valleys, and fortified passes that have been
        fought over so many times the stone itself shows the scars. The <strong>Adamanzan Ren</strong> mountains contain
        the great Zirak fortress complexes — engineering achievements carved into living rock over millennia. The
        Glimfyr hold their own territory through ingenuity, traps, misdirection, and a willingness to fight
        asymmetrically that the Zirak find deeply offensive.</p>

        <h2 id="kg-points-of-interest" data-section="points-of-interest">Points of Interest</h2>

        <p>The <strong>Kokuyō Ryūkyūjō</strong> is an imperial fortress built during the Golden Age — one of the most
        significant military constructions in the archipelago. <strong>Kuroi Yama</strong> (Black Mountain) was
        destroyed during the Onyx Rebellion (8238–8611), a four-hundred-year guerrilla war waged by Kokuryū against
        imperial forces. Kokuryū escaped when Kuroi Yama fell, and the mountain&#39;s ruins remain a place of dark
        reputation.</p>

        <h2 id="kg-regions" data-section="regions">Regions</h2>

        <table>

        <thead>

        <tr>

        <th>Region</th>

        <th>Governance</th>

        <th>Notes</th>

        </tr>

        </thead>

        <tbody><tr>

        <td><strong>Mizuho</strong></td>

        <td>Clan Tsuchiura</td>

        <td>Genso Alliance-aligned</td>

        </tr>

        <tr>

        <td><strong>Shūgyoku</strong></td>

        <td>Clan Shirotsuru</td>

        <td>Arashi Alliance-aligned</td>

        </tr>

        <tr>

        <td>**</td>

        <td></td>

        <td></td>

        </tr>

        </tbody></table>

        <h2 id="kg-settlements" data-section="settlements">Settlements</h2>

        <p>**</p>

        <h2 id="kg-culture-amp-trade" data-section="culture-amp-trade">Culture &amp; Trade</h2>

        <p>Tatara&#39;s economy is built on mining, metalwork, and fortress construction. Stone quarried from the
        Adamanzan Ren was used to build the Great Library on Kawa. Zirak weaponry and armour are prized across the
        archipelago. The Glimfyr produce precision instruments, alchemical components, and mechanical devices of
        extraordinary sophistication.</p>

        <p>The recent escalation — gnomes deliberately sabotaging a dwarven relic site — represents a dangerous
        provocation. Without imperial authority to impose restraint, the conflict is intensifying in ways that may
        eventually draw in outside powers.</p>

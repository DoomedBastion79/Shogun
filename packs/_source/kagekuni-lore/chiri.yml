        <h3 id="kg-culture-amp-trade" data-section="culture-amp-trade">Culture &amp; Trade</h3>

        <p>Hana&#39;s culture is the closest to the old imperial ideal -- formal, ceremonially rich, and deeply aware of
        its historical weight. The proximity to Heian means merchants, scholars, monks, and diplomats pass through
        constantly, and even small villages carry themselves with a certain civic dignity uncommon in frontier
        provinces.</p>

        <p>The Bronze Wood trade defines the province&#39;s economy. Seidorin timber commands extraordinary prices
        across the archipelago -- weapons and armor crafted from it are status symbols as much as tools. The licensing
        system for harvesting creates significant corruption opportunities at every level of local administration.</p>

        <p>Fishing on the Serenia-kai and the Kinryugawa sustains much of the rural population. The Gold Dragon River
        runs fat with a fish called @UUID[Compendium.kagekuni-assistant.items.Item.aAVMPjIVMn92MoHV]{kinuo} (gold-tail)
        that is considered a delicacy in Heian and commands premium prices at market.</p>

        <h3 id="kg-history" data-section="history">History</h3>

        <p>Hana is the oldest continuously inhabited province in the archipelago. The Golden Dragon Clan held dominion
        over these southern highlands long before human settlement -- their capital Kinkokyo is believed to have stood
        somewhere in or beneath the Tenchusan Ren, buried by the avalanche triggered during the Onyx Rebellion. The
        province&#39;s rivers still run faintly gold at dawn -- a phenomenon locals call Kinryu no Namida (the Golden
        Dragon&#39;s Tears).</p>

        <p>Heian was chosen as the imperial capital by the First Emperor Tenryu no Mikado for strategic and spiritual
        reasons -- it stood at the convergence of three rivers, on a defensible peninsula, and was reportedly the site
        of a vision in which Kinryu declared the land under divine protection.</p>

        <p>The province suffered heavily during the Dark Ages -- Heian was sacked twice -- but its infrastructure proved
        resilient. The Emperor&#39;s Highway remains largely intact through Hana.</p>

        <p>Clan Kaminari has governed Hana for the past several centuries. The clan rose to prominence when
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.1J9hy9Hs6EVuYjyz]{Raijin
        no Kazuhiko} unified the province under a single authority following a period of fractious minor-clan
        governance.</p>

        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>Details</strong></p>

        <p>The Bronze Wood Forest&#39;s metallic quality has a deeper origin than simple mineral runoff -- connected to
        the buried city of Kinkokyo beneath the Tenchusan Ren.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>The Shadowfen Bridge exhibits genuine sei resonance that produces mild disorientation in those who speak
        falsehoods while crossing.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>A seimaster from Hoshino To has gone missing after reporting an unusual celestial alignment that matches
        nothing in the records.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>The Buried City of Kinkokyo</strong></p>

        <p>The Golden Dragon Clan&#39;s capital is not simply buried rubble. Significant portions survived structurally
        intact, sealed beneath hundreds of feet of rock and earth. The gold doors the party currently stands before are
        an outer entrance to this buried complex, exposed by a recent earthquake. The temple above is connected to
        Kinkokyo below. Ko&#39;jiri&#39;s research is essentially correct.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>Kinryu no Hikari</strong></p>

        <p>The artifact exists. It is held in a sealed vault deep within the temple, in the farthest underground section
        of Kinkokyo. It is not a weapon or a key. It is a communication device: a golden mirror that allows direct
        communion with Kinryu, the living Golden Dragon, wherever she is hidden. She will answer if called by someone
        she deems worthy.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>The Bronze Wood Secret</strong></p>

        <p>The Seidorin Mori grows over a second branch of the buried Kinkokyo canal system. The metallic quality of the
        trees is caused by trace mineral content in the groundwater -- water flowing through golden veins in the buried
        city&#39;s infrastructure for thousands of years.
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.YSPRToQNBVq5NJFZ]{Ren
        Nakamura} (Shicho of @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.8BPLYleAkYpmvX5a]{Kikyo}) knows this.
        The merchant guild he is allied with wants to find the source and exploit it directly.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.JLGqqI474AH04SDL]{Hiroshi
        Nakamura} -- Traitor in Place</strong></p>

        <p>As Shugo of @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.Zk6QD9Sdfud4SuRV]{Heian}, Hiroshi controls
        the administrative heart of the province. His access to Clan Kaminari intelligence is nearly total. He has been
        feeding information to an outside party (undeveloped) for at least three years. His warm, approachable public
        persona is his most effective weapon -- even his brother Hideo does not suspect how deep the betrayal runs.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>Plot Hooks</strong></p>

        <p>Unlicensed Bronze Wood poaching tied to a merchant guild front operation in
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.8BPLYleAkYpmvX5a]{Kikyo} --
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.YSPRToQNBVq5NJFZ]{Ren
        Nakamura}&#39;s faction or a rival?</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>Strange behavior reported in Shadowfen Bridge area -- a traveler arrived at the wrong destination and has no
        memory of the crossing</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>A seimaster from Hoshino To has gone missing after reporting an unusual celestial alignment that matches
        nothing in the records</p>


        </section>


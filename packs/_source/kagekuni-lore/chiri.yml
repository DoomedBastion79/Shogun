    text:
      format: 1
      content: >+
        <h3 id="kg-geography-amp-terrain" data-section="geography-amp-terrain">Geography &amp; Terrain</h3>

        <p>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.ijGHvVOlw9tFpBo8]{Nami}
        sits on the northeastern tip of Hokori and faces the unabated ocean without shelter.
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.EPAWGqYCrUzYfngV]{Kusa}
        lies to the southwest and
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.D2VV9bFa1txuKDxB]{Kaze}
        to the southeast. Its shores receive the full force of oceanic weather systems -- storms that have built across
        open water for thousands of miles. The province&#39;s coastal architecture reflects this: every structure is
        built low and heavy, walls thick, roofs angled away from prevailing winds, shutters reinforced with iron.</p>

        <p>The coastline is rugged and often spectacular -- dramatic sea cliffs dropping directly to churning water,
        narrow beaches of black volcanic sand between rocky headlands, sea arches and stacks in the offshore shallows.
        During Tatsunami season, storm swells overwash lower coastal roads entirely, and some villages are evacuated to
        higher ground as standard annual precaution.</p>

        <p>The interior rises quickly from coastal cliffs into the eastern slopes of Hokori&#39;s central highlands. The
        terrain is less hospitable than the island&#39;s interior -- thinner soil, more exposure, colder -- but fishing
        and maritime trade make the province economically significant.</p>

        <p>Fujisato, one of
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.eAI9SnbW1RmsWOGw]{Hana}
        province&#39;s northeastern ports, sits at the provincial boundary -- a natural gateway between the two
        provinces&#39; maritime economies.</p>

        <p>Points of Interest:</p>

        <ul>

        <li>The Eastern Lighthouse Chain -- Signal towers and lighthouses along Nami&#39;s coast, serving as
        navigational aids and early warning systems. Some stone bases predate recorded history. During wartime, the
        chain serves as a communication relay.</li>

        <li>The Stormwatch Cliffs -- The highest sea cliffs in Hokori, at Nami&#39;s northern reach. On clear days, Kawa
        island is visible in the distance. Seimasters come here to study weather sei during Tatsunami.</li>

        </ul>

        <h3 id="kg-settlements" data-section="settlements">Settlements</h3>

        <table>

        <thead>

        <tr>

        <th>Settlement</th>

        <th>Type</th>

        <th>Notes</th>

        </tr>

        </thead>

        <tbody><tr>

        <td>Kogarashi</td>

        <td>City</td>

        <td>Provincial capital; fortress-port; commands the northern strait</td>

        </tr>

        <tr>

        <td>Namigashira</td>

        <td>City</td>

        <td>Major eastern port; fortified against storm and invasion</td>

        </tr>

        <tr>

        <td>Takaiso</td>

        <td>Town</td>

        <td>Clifftop town; lighthouse; navigation services</td>

        </tr>

        <tr>

        <td>Kurojima</td>

        <td>Village</td>

        <td>Black sand beach settlement; fishing cooperative; storm-weathered</td>

        </tr>

        <tr>

        <td>Arashizaki</td>

        <td>Village</td>

        <td>Headland village; name means &quot;storm cape&quot;; considered lucky to survive the name</td>

        </tr>

        </tbody></table>

        <h3 id="kg-culture-amp-trade" data-section="culture-amp-trade">Culture &amp; Trade</h3>

        <p>Nami&#39;s culture is shaped by its exposure to the open ocean. The people are resilient, practical, and
        accustomed to living with the constant threat of powerful storms. Maritime trade and fishing form the economic
        backbone, with Namigashira serving as Hokori&#39;s primary eastern port.</p>

        <h3 id="kg-history" data-section="history">History</h3>

        <p>Nami has historically served as Hokori&#39;s eastern gateway, its ports connecting the island to maritime
        trade routes across the open ocean. The province&#39;s current alignment with the Arashi Alliance reflects its
        strategic naval importance.</p>

        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>Details</strong></p>

        <p>The oldest lighthouse foundation at Takaiso was not originally a lighthouse -- it was built atop something
        much older.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.ijGHvVOlw9tFpBo8]{Nami}&#39;s
        Arashi-aligned governing clan is coordinating with
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.M72zAjYRdrTCan30]{Mizu}&#39;s
        Minato-jo for a joint naval operation.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>Arashi Alliance Naval Operations</strong></p>

        <p>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.ijGHvVOlw9tFpBo8]{Nami}&#39;s
        Arashi-aligned governing clan is coordinating with
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.M72zAjYRdrTCan30]{Mizu}&#39;s
        Minato-jo -- together, the eastern and western ports are being positioned for a joint naval operation. The
        target is unknown, but intelligence suggests it involves a landing rather than a sea battle.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>The Ancient Lighthouse Foundation</strong></p>

        <p>The oldest lighthouse foundation in the chain -- at Takaiso -- is built atop something much older. The
        original structure was not a lighthouse. Excavation work decades ago stopped abruptly when workers reported the
        foundation stones were warm to the touch and something moved in the space beneath. The site was sealed and built
        over. The sealed space is still there.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>Plot Hooks</strong></p>

        <p>A vessel arrived at Namigashira from the open ocean with no crew -- cargo intact, navigation logs ending
        mid-sentence, cook fire still warm</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>The lighthouse at Takaiso went dark for three consecutive nights; the keeper is missing; locals won&#39;t go
        near it</p>


        </section>


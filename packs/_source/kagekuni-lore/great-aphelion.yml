        <section class="kg-tier kg-tier-intro" data-tier="intro"><dl class="kg-infobox" data-kind="infobox"><div
        class="kg-info__row"><dt>Type</dt><dd data-field="type">core</dd></div></dl><p><em lang="ja-Latn">This document
        establishes the canonical timeline of the sei drought and Great Aphelion, the orbital mechanics of the Miyosai
        trinary system, and the orrery projection sequence as observed through the Hoshikagami no Ma. Content here
        supersedes or supplements existing entries in world.md, magic.md, and mechanical-arcane-orrery.md.</em></p>

        <hr>

        <h2 id="kg-canonical-timeline" data-section="canonical-timeline">Canonical Timeline</h2>

        <table>

        <thead>

        <tr>

        <th>Date</th>

        <th>Event</th>

        </tr>

        </thead>

        <tbody><tr>

        <td>~12605</td>

        <td>War of Fractured Banners begins; stellar decline starts as Susanoo and Tsukuyomi begin their long
        retreat</td>

        </tr>

        <tr>

        <td>~12806</td>

        <td>First secondary star lost to naked-eye visibility; dark ages begin</td>

        </tr>

        <tr>

        <td>13088</td>

        <td>Temple of Oryuzan Tenku-ji falls; surviving worshipers depart</td>

        </tr>

        <tr>

        <td>~14344</td>

        <td><strong>Great Aphelion</strong> — all three stars at maximum mutual distance; absolute nadir of the dark
        ages</td>

        </tr>

        <tr>

        <td>~15883</td>

        <td>First secondary star returns to naked-eye visibility; dark ages end; dawn</td>

        </tr>

        <tr>

        <td>~15962</td>

        <td>First Talents emerge; sei accessible again in rare individuals</td>

        </tr>

        <tr>

        <td>~16693</td>

        <td><strong>Great Awakening</strong> — all three stars clearly visible; sei fully restored</td>

        </tr>

        <tr>

        <td>16744</td>

        <td>Current campaign date — 51 years post-Awakening</td>

        </tr>

        </tbody></table>

        <p><em lang="ja-Latn">The dark ages span ~12806 to ~15883 — approximately 3,077 years, with the Great Aphelion
        at their midpoint. The decline preceding them runs 201 years. The return arc from dawn to Great Awakening runs
        810 years.</em></p>

        <hr>

        <h2 id="kg-the-miyosai-trinary-system-orbital-mechanics"
        data-section="the-miyosai-trinary-system-orbital-mechanics">The Miyosai Trinary System — Orbital Mechanics</h2>

        <h3 id="kg-structure" data-section="structure">Structure</h3>

        <p>The Miyosai system is a gravitationally bound trinary stellar system. All three stars orbit a common
        <strong>barycenter</strong> — the true gravitational center of the system. Amaterasu is the most massive of the
        three and carries its planetary family with it as it completes its barycentric orbit. Seizan, as one of those
        planets, travels with Amaterasu.</p>

        <pre><code>Barycenter (common gravitational center)

        ├── Amaterasu — orbits barycenter on its own inclined plane

        │   └── Planetary system — orbits Amaterasu (includes Seizan)

        │       └── Moons — orbit Seizan

        ├── Susanoo — orbits barycenter on its own inclined plane

        └── Tsukuyomi — orbits barycenter on its own inclined plane

        </code></pre>

        <p>The three stars travel on <strong>different orbital inclinations</strong> relative to each other, producing a
        three-dimensional dance rather than a flat orbital disc. Each star&#39;s position in Seizan&#39;s sky shifts
        continuously as all three complete their individual barycentric orbits. The named astrological events in the
        existing record — Nagorikaze, Long Shadow — are the routine expressions of this dance: individual stars reaching
        notable positions within normal orbital variation.</p>

        <h3 id="kg-planetary-and-lunar-behavior" data-section="planetary-and-lunar-behavior">Planetary and Lunar
        Behavior</h3>

        <p>Because the planets orbit Amaterasu and travel with it, <strong>the seven planets do not participate in the
        Great Aphelion</strong>. Their positions relative to Seizan shift only in their normal orbital patterns around
        Amaterasu throughout the drought period. The moons, which orbit Seizan directly, are similarly unaffected by the
        positions of Susanoo and Tsukuyomi.</p>

        <p>In the orrery, this means planetary and lunar armatures continue their normal motion through the entire dark
        ages period. The sei drought is visible in the orrery as exclusively a two-star withdrawal — Susanoo and
        Tsukuyomi receding while everything else continues its ordinary dance. This is more striking than a general
        dimming: the machine keeps working, the planets keep moving, and two of the three stars are simply not where
        they should be.</p>

        <h3 id="kg-why-the-great-aphelion-is-singular" data-section="why-the-great-aphelion-is-singular">Why the Great
        Aphelion Is Singular</h3>

        <p>Under normal orbital conditions, the three stars periodically reach individual far points from each other —
        this is routine. The Great Aphelion requires three independent conditions to align simultaneously:</p>

        <ul>

        <li>Amaterasu at maximum distance from the barycenter on one side of its orbit, carrying Seizan with it</li>

        <li>Susanoo at maximum distance on the opposing side of its orbital arc</li>

        <li>Tsukuyomi at maximum distance on the opposing extreme of its own inclined arc</li>

        </ul>

        <p>Because the three orbital periods and inclinations are entirely independent, the probability of all three
        peaking simultaneously is the product of three separate low-probability alignments. More critically, the
        compounding is <strong>geometric rather than additive</strong> — when Amaterasu swings to its extreme, it
        carries Seizan away from the barycenter; Susanoo and Tsukuyomi simultaneously reaching their opposing extremes
        means Seizan is not simply far from two stars, but has been actively carried in the opposite direction while
        they retreated. The distance at nadir is the sum of three orbital extremes working against each other.</p>

        <p>This event has been recorded once — imperfectly, in fragmentary form. The possibility of a future occurrence
        exists but is considered by any scholar who has assembled the relevant data to be a matter for timescales beyond
        meaningful planning.</p>

        <hr>

        <h2 id="kg-individual-star-orbital-profiles" data-section="individual-star-orbital-profiles">Individual Star
        Orbital Profiles</h2>

        <h3 id="kg-amaterasu-the-anchor" data-section="amaterasu-the-anchor">Amaterasu — The Anchor</h3>

        <p><strong>Mass</strong>: Primary; largest of the three stars. <strong>Orbit</strong>: Moves around the
        barycenter, but its greater mass means the barycenter sits relatively close to it — Amaterasu&#39;s orbital
        movement is the least dramatic of the three. Its planetary family travels with it throughout. <strong>Sei
        signature</strong>: Core life energy; baseline sei. Foundational and stable. <strong>Projection color</strong>:
        Golden-yellow. <strong>During the drought</strong>: Never goes dark. Amaterasu&#39;s projection in the orrery
        holds throughout the entire drought period. It is the one point of gold that remains in the dome regardless of
        what date the operator sets. This is why the dark ages were cultural and intellectual collapse rather than
        extinction — Amaterasu&#39;s baseline sei sustained life, agriculture, and the physical world while the more
        complex magical expressions that depended on the full trinary system became inaccessible.</p>

        <h3 id="kg-tsukuyomi-first-to-fade-last-to-return"
        data-section="tsukuyomi-first-to-fade-last-to-return">Tsukuyomi — First to Fade, Last to Return</h3>

        <p><strong>Mass</strong>: Larger deep-red dwarf; second most massive. <strong>Orbit</strong>: Elongated
        barycentric orbit — already has the most dramatic near-far swing of the three under normal conditions. Long
        Shadow events are the routine expression of this elongation. During the Great Aphelion, the elongation compounds
        to an extreme that no living record had prepared the order to anticipate. <strong>Sei signature</strong>:
        Transformation magic, energy manipulation. <strong>Projection color</strong>: Deep red.</p>

        <p><strong>Fade sequence</strong>: Tsukuyomi&#39;s deep red begins bleeding from the orrery&#39;s projection
        approximately 150–170 years before the Great Aphelion nadir (~14174–14194). Because its elongated orbit already
        produces dramatic near-far variation, the early stages of its decline would have been logged by the order as an
        unusually extended Long Shadow before the true nature of the event became clear. Practitioners of the period
        would have noticed transformation magic becoming unreliable first — the most complex sei expressions failing
        before the simpler ones.</p>

        <p><strong>Return sequence</strong>: Because its orbit is the most elongated, Tsukuyomi&#39;s return is the
        slowest. Its deep red is the last color to reappear in the orrery during the recovery arc — faint and
        intermittent for centuries before becoming reliable. The moment all three stars are clearly visible
        simultaneously, which defines the Great Awakening (~16693), is effectively the moment Tsukuyomi&#39;s red
        crosses the threshold of clarity. It is the completion of the return, not its beginning.</p>

        <h3 id="kg-susanoo-second-to-fade-first-to-return" data-section="susanoo-second-to-fade-first-to-return">Susanoo
        — Second to Fade, First to Return</h3>

        <p><strong>Mass</strong>: Smallest blue-white dwarf. <strong>Orbit</strong>: Complex barycentric orbit — not
        elongated like Tsukuyomi&#39;s, but highly variable. Produces both the closest approaches (Nagorikaze) and
        meaningful retreats. Being the least massive of the three, its sei output is the most sensitive to distance.
        <strong>Sei signature</strong>: Water magic, healing, purification. <strong>Projection color</strong>:
        Blue-white.</p>

        <p><strong>Fade sequence</strong>: Susanoo&#39;s blue-white dims approximately 50–80 years before the Great
        Aphelion nadir (~14264–14294). The order would have watched Tsukuyomi declining for nearly a century before
        Susanoo began to follow. Susanoo&#39;s failure was the loss that reached the general population — healers losing
        effectiveness, coastal and maritime practices becoming unreliable. Tsukuyomi&#39;s decline was a practitioner
        problem; Susanoo&#39;s was a human one.</p>

        <p><strong>Return sequence</strong>: Because its orbit is complex rather than elongated, Susanoo&#39;s return
        path is more direct. It is the first secondary star to show meaningful recovery in the orrery — a faint but
        perceptible blue-white appearing in the dome while Tsukuyomi&#39;s arm remains dark. Susanoo&#39;s return is the
        first confirmation that the system is correcting rather than continuing to deteriorate. The first Talents
        (<del>15962) emerge after dawn (</del>15883) and correlate with Susanoo&#39;s partial return, consistent with
        healing and purification being among the earliest accessible sei expressions.</p>

        <hr>

        <h2 id="kg-orrery-projection-sequence" data-section="orrery-projection-sequence">Orrery Projection Sequence</h2>

        <p><em lang="ja-Latn">What the party observes when scrolling through the dial. Mechanical armature motion
        continues normally throughout — only the arcane projection layer responds to sei availability.</em></p>

        <h3 id="kg-pre-decline-pre-12605" data-section="pre-decline-pre-12605">Pre-Decline (pre-~12605)</h3>

        <p>All three stars project at full intensity. Amaterasu golden-yellow at center. Susanoo&#39;s blue-white and
        Tsukuyomi&#39;s deep red visible on their respective inclined armature planes. Planets and moons in full normal
        motion around Amaterasu&#39;s family. The dome is warm and fully lit — this is the room functioning as it was
        designed to function. When the party scrolls to a Golden Age date, they understand for the first time what they
        have been looking at in its damaged state.</p>

        <h3 id="kg-early-decline-1260512700" data-section="early-decline-1260512700">Early Decline (~12605–12700)</h3>

        <p>Tsukuyomi&#39;s deep red begins to bleed at the edges. Subtle — a skilled operator would notice the color
        temperature shifting before they could name it. A pre-existing Long Shadow event during this period would have
        been logged by the order as unusually extended before the deeper pattern was recognized. Susanoo holds full
        brightness. The dome is visibly but not dramatically wrong.</p>

        <h3 id="kg-deepening-decline-1270012806" data-section="deepening-decline-1270012806">Deepening Decline
        (~12700–12806)</h3>

        <p>Tsukuyomi&#39;s red is clearly diminished — no longer a question of interpretation. The dome feels unbalanced
        in a way that is difficult to articulate. Susanoo still holds, which means the order would have had reason to
        hope the event was limited to Tsukuyomi&#39;s orbit. The first star crosses below naked-eye visibility threshold
        at approximately 12806. Dark ages begin.</p>

        <h3 id="kg-late-decline-early-dark-ages-1280614264" data-section="late-decline-early-dark-ages-1280614264">Late
        Decline / Early Dark Ages (~12806–14264)</h3>

        <p>Tsukuyomi&#39;s arm is dark. Susanoo still holds its blue-white in the orrery projection, though dimming as
        it approaches its own far point. The dome is now Amaterasu&#39;s gold, Susanoo&#39;s fading blue-white, and one
        silent arm. The operator&#39;s log from this period — if it survived — would be increasingly terse.</p>

        <h3 id="kg-susanoo39s-failure-approach-to-nadir-1426414344"
        data-section="susanoo39s-failure-approach-to-nadir-1426414344">Susanoo&#39;s Failure / Approach to Nadir
        (~14264–14344)</h3>

        <p>Susanoo&#39;s projection dims and goes dark. The dome is now Amaterasu alone. All planetary and lunar
        armatures continue their ordinary motion — the machine still works — but the two secondary stars are bare
        bronze. The room does not feel like an observatory. It feels like something else.</p>

        <h3 id="kg-great-aphelion-14344" data-section="great-aphelion-14344">Great Aphelion (~14344)</h3>

        <p>All three stars at maximum mutual distance. Amaterasu&#39;s armature sits at one extreme of its barycentric
        arc, the planetary family clustered around it. Susanoo&#39;s armature sits at the opposing extreme on its
        inclined plane. Tsukuyomi&#39;s armature sits at its own opposing extreme on its differently inclined plane.
        Three separate arms on three separate planes, all pointing away from each other. The geometry of the event is
        legible in the mechanism before the party processes the darkness — they can see <em lang="ja-Latn">why</em> it
        was catastrophic. Amaterasu alone in the dome. The nadir.</p>

        <h3 id="kg-post-nadir-continuing-dark-ages-1434415883"
        data-section="post-nadir-continuing-dark-ages-1434415883">Post-Nadir / Continuing Dark Ages (~14344–15883)</h3>

        <p>Scrolling forward through these years changes nothing visible. Amaterasu holds. The two secondary arms remain
        dark. Advancing decades — centuries — in seconds and seeing no change in the darkness has its own effect at the
        table. The absence is not passive.</p>

        <h3 id="kg-dawn-15883" data-section="dawn-15883">Dawn (~15883)</h3>

        <p>Susanoo&#39;s armature shows the first ghost of blue-white. Not full projection — a faint shimmer, barely
        distinguishable from reflected light. A character with sei sensitivity (Relc, Ko&#39;jiri, Sun Wukong) may feel
        warmth in their sternum before the light is visible to anyone. This is the moment the dark ages end — not
        because magic returns, but because the sky does. Sei remains largely inaccessible; the stars are simply
        back.</p>

        <h3 id="kg-first-talents-early-return-1588315962" data-section="first-talents-early-return-1588315962">First
        Talents / Early Return (~15883–15962)</h3>

        <p>Susanoo&#39;s blue-white strengthens slowly. Tsukuyomi&#39;s arm remains dark. The dome is Amaterasu and a
        faint secondary light — the room no longer feels like the nadir, but it does not feel restored. When the party
        scrolls to ~15962, the first Talents date, they can see that sei&#39;s earliest return correlates with Susanoo
        having only partially recovered. The match between star position and magical accessibility is legible if they
        think to look for it.</p>

        <h3 id="kg-return-arc-1596216693" data-section="return-arc-1596216693">Return Arc (~15962–16693)</h3>

        <p>Susanoo continues strengthening. Tsukuyomi&#39;s deep red begins its slower return — faint and intermittent
        for a long period before becoming reliable. Scrolling through this arc in the orrery, the party watches the dome
        gradually fill. The return does not feel like restoration — it feels like recovery from a very long illness.</p>

        <h3 id="kg-great-awakening-16693" data-section="great-awakening-16693">Great Awakening (~16693)</h3>

        <p>Tsukuyomi&#39;s red crosses into clear, reliable visibility. All three stars present. This is the
        recognizable moment — a party member who has seen the Golden Age dates and then scrolled forward through
        centuries of darkness will feel the completion of this arc when all three lights are in the dome together
        again.</p>

        <h3 id="kg-current-date-16744" data-section="current-date-16744">Current Date (16744)</h3>

        <p>The orrery shows the present sky. All three stars lit. Planetary and lunar armatures in their current
        positions. A party member who thinks to compare this against a deep Golden Age date may notice that
        Tsukuyomi&#39;s projection, while present, carries slightly less intensity than its pre-decline readings. The
        return is real. It is not yet complete. The orbital correction is still ongoing.</p>

        <p><em lang="ja-Latn">This is the only moment in the orrery sequence where the party is looking at their own
        world in real time. The comparison between then and now is available to them if they seek it.</em></p>


      content: >-
        <section class="kg-tier kg-tier-intro" data-tier="intro"><dl class="kg-infobox" data-kind="infobox"><div
        class="kg-info__row"><dt>Type</dt><dd data-field="type">core</dd></div></dl><p>A well-prepared meal before rest
        does more than fill the stomach. In Kagekuni, the art of trail cooking is respected — a traveler who can turn
        foraged ingredients into something worth eating earns standing at any campfire.</p>

        <hr>

        <h2 id="kg-cooking-rules" data-section="cooking-rules">Cooking Rules</h2>

        <h3 id="kg-who-can-cook" data-section="who-can-cook">Who Can Cook</h3>

        <p>Any character with <strong>proficiency in cook&#39;s utensils</strong> can attempt to prepare a recipe they
        know. A character without proficiency can prepare <strong>Common</strong> recipes only, and does so at
        disadvantage.</p>

        <h3 id="kg-when-to-cook" data-section="when-to-cook">When to Cook</h3>

        <p>Cooking occurs during a <strong>long rest</strong>. A meal takes <strong>1 hour</strong> to prepare and must
        be consumed during that same rest to gain its benefits. A cook can prepare <strong>one recipe per long
        rest</strong> — enough to serve the entire party (up to 6 servings per preparation).</p>

        <h3 id="kg-how-it-works" data-section="how-it-works">How It Works</h3>

        <p>The cook makes a <strong>Wisdom (Survival) check</strong> using cook&#39;s utensils. The DC depends on the
        recipe&#39;s tier.</p>

        <table>

        <thead>

        <tr>

        <th>Recipe Tier</th>

        <th>Cooking DC</th>

        <th>Ingredient Rarity Required</th>

        </tr>

        </thead>

        <tbody><tr>

        <td>Simple</td>

        <td>10</td>

        <td>Common only</td>

        </tr>

        <tr>

        <td>Hearty</td>

        <td>13</td>

        <td>At least one Uncommon</td>

        </tr>

        <tr>

        <td>Refined</td>

        <td>16</td>

        <td>At least one Rare</td>

        </tr>

        <tr>

        <td>Masterwork</td>

        <td>20</td>

        <td>At least one Very Rare</td>

        </tr>

        </tbody></table>

        <p><strong>Success</strong>: The meal is prepared. All characters who eat it gain the listed buff after
        completing the long rest. The buff lasts <strong>8 hours</strong> or until the next long rest, whichever comes
        first.</p>

        <p><strong>Failure</strong>: The ingredients are consumed but the meal is unremarkable — no buff is granted. The
        characters still eat (no penalty), but the special properties are lost.</p>

        <p><strong>Failure by 5+</strong>: The meal is actively unpleasant. Ingredients are wasted. Each character who
        eats it must succeed on a <strong>DC 10 Constitution saving throw</strong> or suffer disadvantage on their first
        ability check after the rest (the aftertaste lingers).</p>

        <h3 id="kg-buff-stacking" data-section="buff-stacking">Buff Stacking</h3>

        <p>A character can benefit from <strong>only one meal buff</strong> at a time. A new meal replaces the previous
        buff. Meal buffs do <strong>not</strong> stack with the <strong>Kinryū no Megumi</strong> temple blessings — the
        more powerful effect takes precedence.</p>

        <h3 id="kg-ingredient-grade-and-cooking" data-section="ingredient-grade-and-cooking">Ingredient Grade and
        Cooking</h3>

        <p>All gathered ingredients now carry a <strong>grade</strong> from the materials system: 並 Nami
        (rough/damaged), 上 Jō (standard market grade), 特上 Tokujō (exceptional), and 極上 Gokujō (peerless). Ingredient
        grade modifies the cooking check and, on high-grade inputs, can lift a recipe&#39;s outcome beyond its base
        tier.</p>

        <table>

        <thead>

        <tr>

        <th>Ingredient Grade</th>

        <th>Cooking Check Modifier</th>

        <th>Effect on Buff</th>

        </tr>

        </thead>

        <tbody><tr>

        <td>並 Nami</td>

        <td>−2 to the check</td>

        <td>Buff duration halved (4 hours) on success</td>

        </tr>

        <tr>

        <td>上 Jō</td>

        <td>+0 (baseline)</td>

        <td>Standard buff as written</td>

        </tr>

        <tr>

        <td>特上 Tokujō</td>

        <td>+2 to the check</td>

        <td>Buff applies with <strong>advantage</strong> on any roll it modifies, or +1 to any flat numeric bonus it
        grants</td>

        </tr>

        <tr>

        <td>極上 Gokujō</td>

        <td>+5 OR advantage on the check</td>

        <td>Recipe may be prepared as if one tier higher (Simple→Hearty, Hearty→Refined, etc.) for effect purposes; the
        cook still rolls against the original DC, and if they would clear the higher-tier DC the meal delivers the
        upgraded buff described in the recipe&#39;s &quot;Gokujō Variant&quot; note (or, absent that note, DM discretion
        applies an appropriately scaled effect)</td>

        </tr>

        </tbody></table>

        <p>When a recipe lists multiple ingredients at different grades, use the <strong>lowest grade present</strong>
        as the cooking modifier, but the highest-grade ingredient determines whether the meal is eligible for tier-up. A
        Gokujō centrepiece can still anchor a recipe built on Jō vegetables; the result is exceptional only if the cook
        clears the upgraded DC.</p>

        <h3 id="kg-ingredient-cross-reference" data-section="ingredient-cross-reference">Ingredient Cross-Reference</h3>

        <p>Every recipe ingredient below corresponds to a Part I entry in <code>core/materials.md</code>. When a DM or
        player wants the full stat block — rarity, yield, weight, base value, grade variants, biomes, cultural notes —
        that file is the source of truth. Recipes cite ingredients by name only; materials.md carries the mechanical
        detail.</p>

        <hr>

        <h2 id="kg-recipe-list" data-section="recipe-list">Recipe List</h2>

        <h3 id="kg-simple-recipes-dc-10" data-section="simple-recipes-dc-10">Simple Recipes (DC 10)</h3>

        <hr>

        <h4 id="kg-yama-usagi-no-nabemono-mountain-hare-stew"
        data-section="yama-usagi-no-nabemono-mountain-hare-stew">Yama-usagi no Nabemono — Mountain Hare Stew</h4>

        <p><em lang="ja-Latn">A straightforward one-pot stew simmered with whatever is at hand. Every traveler in
        Kagekuni has eaten some version of this on a cold mountain road.</em></p>

        <p><strong>Ingredients</strong>: Yama-usagi (1 portion) + Seri or Nobiru (1 portion) + Kome (rice, carried)

        <strong>Buff</strong>: <strong>Warming Rest</strong> — Resistance to cold weather exhaustion checks for 8 hours.
        Characters ignore the effects of temperatures down to -10°F for the duration.

        <strong>Where Found</strong>: Common knowledge — any character proficient with cook&#39;s utensils knows this
        recipe.</p>

        <hr>

        <h4 id="kg-kawa-gani-no-suimono-river-crab-clear-soup"
        data-section="kawa-gani-no-suimono-river-crab-clear-soup">Kawa-gani no Suimono — River Crab Clear Soup</h4>

        <p><em lang="ja-Latn">Delicate broth made from freshwater crab, wild garlic, and a touch of rice vinegar. Light
        enough for a warm evening, restorative enough for a weary body.</em></p>

        <p><strong>Ingredients</strong>: Kawa-gani (1 portion) + Nobiru (1 portion) + Rice Vinegar (carried)

        <strong>Buff</strong>: <strong>Clear Head</strong> — +1 bonus to Wisdom (Perception) checks for 8 hours.

        <strong>Where Found</strong>: Common knowledge — any character proficient with cook&#39;s utensils knows this
        recipe.</p>

        <hr>

        <h4 id="kg-uzura-no-yakitori-grilled-quail-skewers" data-section="uzura-no-yakitori-grilled-quail-skewers">Uzura
        no Yakitori — Grilled Quail Skewers</h4>

        <p><em lang="ja-Latn">Quail speared on green sticks and turned over coals, basted with soy paste and sake.
        Simple, satisfying, and impossible to ruin completely.</em></p>

        <p><strong>Ingredients</strong>: Uzura (1 portion) + Shōyu (carried) + Sake (carried)

        <strong>Buff</strong>: <strong>Road Endurance</strong> — +5 feet to walking speed for 8 hours.

        <strong>Where Found</strong>: Common knowledge — any character proficient with cook&#39;s utensils knows this
        recipe.</p>

        <hr>

        <h4 id="kg-kinoko-miso-shiru-mushroom-miso-soup" data-section="kinoko-miso-shiru-mushroom-miso-soup">Kinoko
        Miso-shiru — Mushroom Miso Soup</h4>

        <p><em lang="ja-Latn">A traveler&#39;s best friend. Dried mushrooms reconstituted in miso broth with whatever
        greens are available. Warm, umami-rich, and deeply comforting after a day on the road.</em></p>

        <p><strong>Ingredients</strong>: Shiitake or Nameko (1 portion) + Miso (carried) + Seri (1 portion, optional)

        <strong>Buff</strong>: <strong>Settled Stomach</strong> — Advantage on Constitution saving throws against poison
        and disease for 8 hours.

        <strong>Where Found</strong>: Common knowledge — any character proficient with cook&#39;s utensils knows this
        recipe.</p>

        <hr>

        <h4>☆ Tabibito no Zōsui — Traveller&#39;s Rice Porridge <em lang="ja-Latn">(Wildcard)</em></h4>

        <p><em lang="ja-Latn">The most forgiving recipe on the road. Whatever meat is at hand goes into the pot with
        rice and water, simmered until it thickens into something warm and filling. Every version tastes different. None
        of them taste bad.</em></p>

        <p><strong>Ingredients</strong>: Any 1 common meat/fish (1 portion) + Kome (carried) + Shio (carried) or any 1
        common herb (1 portion, optional)

        <strong>Buff</strong>: <strong>Trail Stamina</strong> — Recover 1 additional Hit Die at the end of the long
        rest.

        <strong>Where Found</strong>: Common knowledge — any character proficient with cook&#39;s utensils knows this
        recipe.</p>

        <hr>

        <h4>☆ Nobi no Itamemono — Roadside Stir-Fry <em lang="ja-Latn">(Wildcard)</em></h4>

        <p><em lang="ja-Latn">Hot oil, whatever greens are at hand, a splash of soy paste, and the sizzle that draws
        everyone around the fire. Speed is the art here — cook fast, eat hot.</em></p>

        <p><strong>Ingredients</strong>: Any 2 different common herbs/greens (1 portion each) + Shōyu (carried) + Goma
        (1 portion, optional)

        <strong>Buff</strong>: <strong>Light Step</strong> — Difficult terrain costs no extra movement for 8 hours.

        <strong>Where Found</strong>: Common knowledge — any character proficient with cook&#39;s utensils knows this
        recipe.</p>

        <hr>

        <h4 id="kg-ayu-no-shioyaki-salt-grilled-sweetfish" data-section="ayu-no-shioyaki-salt-grilled-sweetfish">Ayu no
        Shioyaki — Salt-Grilled Sweetfish</h4>

        <p><em lang="ja-Latn">Whole sweetfish skewered and grilled upright beside the fire, salted and nothing more. The
        simplest preparation, and one of the best — the clean, melon-sweet flesh needs no embellishment. Festival food,
        trail food, good food.</em></p>

        <p><strong>Ingredients</strong>: Ayu (1 portion) + Shio (carried)

        <strong>Buff</strong>: <strong>Refreshed</strong> — Advantage on the first ability check made after the long
        rest.

        <strong>Where Found</strong>: Common knowledge — any settlement near a river.</p>

        <hr>

        <h4>☆ Kinoko no Takikomi-gohan — Mixed Mushroom Rice <em lang="ja-Latn">(Wildcard)</em></h4>

        <p><em lang="ja-Latn">Rice cooked with whatever fungi are available, the mushrooms cut small and stirred through
        so every bite carries their earthiness. The type of mushroom changes the character of the dish entirely — a
        different meal at every campsite.</em></p>

        <p><strong>Ingredients</strong>: Any 2 different common fungi (1 portion each) + Kome (carried) + Shōyu
        (carried)

        <strong>Buff</strong>: <strong>Rooted Rest</strong> — +1 bonus to Constitution checks (not saving throws) for 8
        hours, including checks to maintain a forced march.

        <strong>Where Found</strong>: Common knowledge — any character proficient with cook&#39;s utensils knows this
        recipe.</p>

        <hr>

        <h3 id="kg-hearty-recipes-dc-13" data-section="hearty-recipes-dc-13">Hearty Recipes (DC 13)</h3>

        <hr>

        <h4 id="kg-kinuo-no-sashimi-gold-tail-sashimi" data-section="kinuo-no-sashimi-gold-tail-sashimi">Kinuo no
        Sashimi — Gold-Tail Sashimi</h4>

        <p><em lang="ja-Latn">Thinly sliced raw kinuo, arranged with care and served with wasabi and soy. The Heian
        elite pay handsomely for this in restaurants — preparing it fresh from a river catch is a rare
        pleasure.</em></p>

        <p><strong>Ingredients</strong>: Kinuo (1 portion) + Wasabi (1 portion) + Shōyu (carried)

        <strong>Buff</strong>: <strong>Golden Vigor</strong> — Gain temporary hit points equal to your proficiency bonus
        + your Constitution modifier (minimum 1) after the long rest. These last until depleted or 8 hours, whichever
        comes first.

        <strong>Where Found</strong>: Natsumura (any fisherman will share it for a good story); Heian&#39;s Mizu-gai
        (purchased from a seafood stall for 5 gp).</p>

        <hr>

        <h4 id="kg-inoshishi-no-kakuni-slow-braised-boar-belly"
        data-section="inoshishi-no-kakuni-slow-braised-boar-belly">Inoshishi no Kakuni — Slow-Braised Boar Belly</h4>

        <p><em lang="ja-Latn">Wild boar braised for hours in sake, soy, and mountain garlic until the fat renders and
        the meat falls apart. Rich, dense, and fortifying. A meal for the night before a hard day.</em></p>

        <p><strong>Ingredients</strong>: Inoshishi (2 portions) + Nobiru (1 portion) + Sake (carried) + Shōyu (carried)

        <strong>Buff</strong>: <strong>Boar&#39;s Fortitude</strong> — +1 bonus to Constitution saving throws for 8
        hours.

        <strong>Where Found</strong>: Ayame — the inn there serves a version of this to soldiers before the mountain
        crossing. The innkeeper shares the recipe with anyone who buys a round for the garrison.</p>

        <hr>

        <h4 id="kg-kurokaze-cha-gayu-black-wind-tea-porridge"
        data-section="kurokaze-cha-gayu-black-wind-tea-porridge">Kurokaze Cha-gayu — Black Wind Tea Porridge</h4>

        <p><em lang="ja-Latn">Rice porridge steeped with the bitter kurokaze herb of Kaze province. Not delicious,
        precisely — but the alertness it brings is unmistakable. Gekkō sentries drank this before night watch.</em></p>

        <p><strong>Ingredients</strong>: Kurokaze-sō (1 portion) + Kome (carried) + Shio (carried)

        <strong>Buff</strong>: <strong>Watchful Mind</strong> — Cannot be surprised for 8 hours. Additionally, +2 bonus
        to passive Perception during the duration.

        <strong>Where Found</strong>: Kaze province — Akatsuki village elder, or discovered in the abandoned Tsukikage
        settlement (scroll in a guardhouse).</p>

        <hr>

        <h4 id="kg-enokidake-no-takikomi-gohan-bronze-wood-mushroom"
        data-section="enokidake-no-takikomi-gohan-bronze-wood-mushroom">Enokidake no Takikomi-gohan — Bronze Wood
        Mushroom Rice</h4>

        <p><em lang="ja-Latn">Rice steamed with the copper-noted enokidake mushrooms unique to the Seidōrin Mori,
        seasoned with Bronze Wood Salt. A dish with a faintly metallic sweetness that lingers.</em></p>

        <p><strong>Ingredients</strong>: Enokidake (1 portion) + Seidōrin no Shio (1 portion) + Kome (carried)

        <strong>Buff</strong>: <strong>Ironbark Resolve</strong> — +1 bonus to AC against the first attack that hits you
        each combat (the bonus is consumed on the first hit, reducing damage by your proficiency bonus; minimum 1).

        <strong>Where Found</strong>: Kikyo — lumber merchants share this recipe freely, considering it common regional
        knowledge.</p>

        <hr>

        <h4 id="kg-hi-no-ha-rmen-fire-leaf-noodle-broth" data-section="hi-no-ha-rmen-fire-leaf-noodle-broth">Hi no Ha
        Rāmen — Fire Leaf Noodle Broth</h4>

        <p><em lang="ja-Latn">A searing broth built on dried dashi, laced with the volcanic hi no ha, and served over
        thick wheat noodles. Sweat-inducing, breath-clearing, and beloved in Hi province where the locals consider
        anything less spicy to be &quot;children&#39;s food.&quot;</em></p>

        <p><strong>Ingredients</strong>: Hi no Ha (1 portion) + Dried Dashi (carried) + Kome or noodles (carried) +
        Shōyu (carried)

        <strong>Buff</strong>: <strong>Inner Fire</strong> — Resistance to fire damage from environmental sources (not
        attacks) for 8 hours. Additionally, immune to the effects of extreme cold weather for the duration.

        <strong>Where Found</strong>: Hi province — any settlement. Enshiro&#39;s garrison cooks prepare it daily.
        Onsen-machi serves an upscale version.</p>

        <hr>

        <h4 id="kg-tsukimis-no-ochazuke-moonflower-tea-rice"
        data-section="tsukimis-no-ochazuke-moonflower-tea-rice">Tsukimisō no Ochazuke — Moonflower Tea Rice</h4>

        <p><em lang="ja-Latn">A calming dish of rice bathed in moonflower tea, served with pickled vegetables and a
        scatter of sesame. Traditionally eaten before diplomatic meetings, but equally useful before any encounter where
        a steady hand matters.</em></p>

        <p><strong>Ingredients</strong>: Tsukimisō (1 portion) + Kome (carried) + Tsukemono (carried)

        <strong>Buff</strong>: <strong>Serene Focus</strong> — +1 bonus to Charisma (Persuasion) and Wisdom (Insight)
        checks for 8 hours.

        <strong>Where Found</strong>: Heian — a tea house in the Ryū Jikuchiku sells this recipe for 10 gp.
        Alternatively, shrine monks at Kodan no Jinja share it with respectful visitors.</p>

        <hr>

        <h4 id="kg-unagi-no-kabayaki-grilled-eel-with-sweet-glaze"
        data-section="unagi-no-kabayaki-grilled-eel-with-sweet-glaze">Unagi no Kabayaki — Grilled Eel with Sweet
        Glaze</h4>

        <p><em lang="ja-Latn">Freshwater eel split, boned, and grilled repeatedly with a glaze of soy, sake, and a touch
        of sweetness. The fat renders between each pass over the coals until the skin crisps and the flesh melts.
        Regarded as a stamina food across all provinces — no coincidence that eel vendors do brisk business before
        military campaigns.</em></p>

        <p><strong>Ingredients</strong>: Unagi (1 portion) + Shōyu (carried) + Sake (carried) + Sanshō (1 portion)

        <strong>Buff</strong>: <strong>Eel&#39;s Endurance</strong> — Advantage on Constitution checks to maintain
        concentration and to avoid exhaustion from forced marches for 8 hours.

        <strong>Where Found</strong>: Natsumura — the eel-griller on the wharf teaches the technique to anyone patient
        enough to watch. Nishihara&#39;s river market also knows it.</p>

        <hr>

        <h4>☆ Yama no Nabe — Mountain Hot Pot <em lang="ja-Latn">(Wildcard)</em></h4>

        <p><em lang="ja-Latn">The quintessential trail meal for a cold evening in high country. A communal pot over the
        fire, filled with whatever the day&#39;s foraging turned up — any game, any greens, any mushroom. The broth does
        the work.</em></p>

        <p><strong>Ingredients</strong>: Any 1 uncommon meat/fish (1 portion) + any 1 common or uncommon herb/green (1
        portion) + any 1 common or uncommon fungi (1 portion) + Dried Dashi or Miso (carried)

        <strong>Buff</strong>: <strong>Shared Warmth</strong> — All characters who share the meal gain +2 to saving
        throws against cold weather effects and exhaustion from exposure for 8 hours. If at least 3 characters share the
        meal, each also gains 1d4 temporary hit points.

        <strong>Where Found</strong>: Ayame — soldiers share their version around the garrison fire. Takamine — the
        mountain guides know a dozen variations.</p>

        <hr>

        <h4 id="kg-kamo-no-tsukune-wild-duck-meatball-skewers"
        data-section="kamo-no-tsukune-wild-duck-meatball-skewers">Kamo no Tsukune — Wild Duck Meatball Skewers</h4>

        <p><em lang="ja-Latn">Wild duck minced with ginger and scallion, shaped into small balls and grilled over
        charcoal. The outside chars while the inside stays tender. Simple construction, but the richness of the duck
        meat carries a depth that domestic poultry cannot match.</em></p>

        <p><strong>Ingredients</strong>: Kamo (1 portion) + Myōga (1 portion) + Shōyu (carried)

        <strong>Buff</strong>: <strong>Sharpened Senses</strong> — +2 to passive Perception and +1 to initiative rolls
        for 8 hours.

        <strong>Where Found</strong>: Koriwara — a retired samurai who runs a yakitori stall in the market ward teaches
        the recipe to anyone who compliments his cooking with apparent sincerity.</p>

        <hr>

        <h4 id="kg-umikaze-chazuke-sea-wind-rice" data-section="umikaze-chazuke-sea-wind-rice">Umikaze Chazuke — Sea
        Wind Rice</h4>

        <p><em lang="ja-Latn">A coastal traveller&#39;s meal — hot dashi poured over rice, topped with the thick, salty
        umikaze greens and flaked fish. The briny greens cut the richness of the broth. Nami fishermen eat this before
        dawn watches when the storms are coming.</em></p>

        <p><strong>Ingredients</strong>: Umikaze-na (1 portion) + any 1 common fish (1 portion) + Kome (carried) + Dried
        Dashi (carried)

        <strong>Buff</strong>: <strong>Storm Ready</strong> — Advantage on Strength (Athletics) checks made to resist
        being knocked prone or pushed, and advantage on saving throws against effects caused by wind or lightning for 8
        hours.

        <strong>Where Found</strong>: Nami coastline — any fishing village. The recipe travels with the tides.</p>

        <hr>

        <h4 id="kg-iwatake-no-nimono-simmered-rock-mushroom"
        data-section="iwatake-no-nimono-simmered-rock-mushroom">Iwatake no Nimono — Simmered Rock Mushroom</h4>

        <p><em lang="ja-Latn">Rock mushroom rehydrated in dashi, simmered slowly until the leathery texture softens into
        something rich and gelatinous. The mineral depth of the fungus fills the broth. Monk&#39;s food — austere,
        deliberate, and quietly satisfying.</em></p>

        <p><strong>Ingredients</strong>: Iwatake (1 portion) + Dried Dashi (carried) + Shōyu (carried) + Miso (carried)

        <strong>Buff</strong>: <strong>Mountaineer&#39;s Grip</strong> — +2 to Strength (Athletics) checks for climbing
        and advantage on saving throws against falling for 8 hours.

        <strong>Where Found</strong>: Takamine — a monastery cook shares this with pilgrims who help with kitchen
        duties. Also known at high-altitude shrines throughout Sora.</p>

        <hr>

        <h3 id="kg-refined-recipes-dc-16" data-section="refined-recipes-dc-16">Refined Recipes (DC 16)</h3>

        <hr>

        <h4 id="kg-seireiuo-no-sunomono-spirit-fish-vinegar-salad"
        data-section="seireiuo-no-sunomono-spirit-fish-vinegar-salad">Seireiuo no Sunomono — Spirit Fish Vinegar
        Salad</h4>

        <p><em lang="ja-Latn">Translucent spirit fish, briefly cured in rice vinegar, served over shredded daikon with a
        whisper of wasabi. The flesh still carries a faint luminescence on the plate. The taste is unlike anything from
        ordinary waters.</em></p>

        <p><strong>Ingredients</strong>: Seireiuo (1 portion) + Wasabi (1 portion) + Rice Vinegar (carried)

        <strong>Buff</strong>: <strong>Sei Attunement</strong> — +1 bonus to spell attack rolls and spell save DCs for 8
        hours. Non-casters instead gain advantage on saving throws against magical effects.

        <strong>Where Found</strong>: Yōsei Mori — the Forest of Spirits faction shares this with allies who prove
        trustworthy. Alternatively, a scroll may be found in ruins with sei-active water sources.</p>

        <hr>

        <h4 id="kg-ryjika-no-sumibi-yaki-charcoal-grilled-dragon-de"
        data-section="ryjika-no-sumibi-yaki-charcoal-grilled-dragon-de">Ryūjika no Sumibi-yaki — Charcoal-Grilled Dragon
        Deer</h4>

        <p><em lang="ja-Latn">Dragon deer venison, seared over hardwood charcoal and finished with a glaze of sake and
        dragon salt. The meat&#39;s natural warmth intensifies over the flame. Those who eat it report a sensation of
        quiet strength settling into the bones.</em></p>

        <p><strong>Ingredients</strong>: Ryūjika (1 portion) + Ryūjio (1 portion) + Sake (carried)

        <strong>Buff</strong>: <strong>Draconic Fortitude</strong> — Gain advantage on death saving throws for 8 hours.
        Additionally, when you spend Hit Dice during a short rest within the duration, you may reroll any Hit Die that
        shows a 1 or 2 (keeping the new result).

        <strong>Where Found</strong>: Ancient Guard knowledge — Benkei knows this recipe and will share it with a party
        that has earned his trust. May also be inscribed on stone near Progenitor shrine sites.</p>

        <hr>

        <h4 id="kg-kageboushi-no-ankake-shadow-cap-mushroom-in-thic"
        data-section="kageboushi-no-ankake-shadow-cap-mushroom-in-thic">Kageboushi no Ankake — Shadow Cap Mushroom in
        Thickened Broth</h4>

        <p><em lang="ja-Latn">Shadow mushrooms simmered in a rich thickened dashi, their smoky depth intensified by slow
        reduction. The broth is dark as ink and just as staining. Eaten in near-darkness in Kaze, where they say the
        dish teaches you to see without light.</em></p>

        <p><strong>Ingredients</strong>: Kageboushi (1 portion) + Kuro-koshō (1 portion) + Dried Dashi (carried) + Shōyu
        (carried)

        <strong>Buff</strong>: <strong>Shadow Sight</strong> — Gain darkvision 30 feet for 8 hours. Characters who
        already have darkvision extend its range by 30 feet. Additionally, +2 to Dexterity (Stealth) checks in dim light
        or darkness.

        <strong>Where Found</strong>: Kaze province — the Black Lily monastery. The recipe is not secret, but the
        monastery shares it only with those who have done the Order a service.</p>

        <hr>

        <h4 id="kg-seikinoko-no-chawanmushi-sei-mushroom-custard"
        data-section="seikinoko-no-chawanmushi-sei-mushroom-custard">Seikinoko no Chawanmushi — Sei Mushroom
        Custard</h4>

        <p><em lang="ja-Latn">A savory egg custard steamed with luminescent sei mushrooms, their violet-blue glow
        dimming slowly as the custard sets. Served in ceramic cups and eaten with a small wooden spoon. The flavor is
        elusive — forest, rain, and something older.</em></p>

        <p><strong>Ingredients</strong>: Seikinoko (1 portion) + Seri (1 portion) + Dried Dashi (carried)

        <strong>Buff</strong>: <strong>Sei Reservoir</strong> — Recover one expended spell slot of 1st or 2nd level at
        the end of the long rest (in addition to normal recovery). Non-casters instead recover an additional Hit Die.

        <strong>Where Found</strong>: Mori no Sato village on the Yōsei Mori border — the village herbalist teaches it
        to those who bring her a fresh seikinoko specimen as proof of their foraging ability.</p>

        <hr>

        <h4 id="kg-hinotake-no-dengaku-fire-stalk-grilled-with-miso"
        data-section="hinotake-no-dengaku-fire-stalk-grilled-with-miso">Hinotake no Dengaku — Fire Stalk Grilled with
        Miso Glaze</h4>

        <p><em lang="ja-Latn">Fire stalk mushrooms, carefully peeled to avoid the caustic outer membrane, then glazed
        with sweetened miso and grilled until the edges char. The heat builds slowly — not unpleasant, but insistent. Hi
        province miners eat this before descending into volcanic shafts.</em></p>

        <p><strong>Ingredients</strong>: Hinotake (1 portion) + Miso (carried) + Sake (carried)

        <strong>Buff</strong>: <strong>Volcanic Resilience</strong> — Resistance to fire damage (all sources, including
        attacks) for 8 hours.

        <strong>Where Found</strong>: Hi province — Kurokawa village. The obsidian crafters share it with outsiders who
        help with a day&#39;s labor in the fields. Also found carved into a wall near the Crimson Shrine&#39;s outer
        approach.</p>

        <hr>

        <h4 id="kg-oniuo-no-nitsuke-demon-fish-braised-in-soy"
        data-section="oniuo-no-nitsuke-demon-fish-braised-in-soy">Oniuo no Nitsuke — Demon Fish Braised in Soy</h4>

        <p><em lang="ja-Latn">The demon fish&#39;s bony plates are pried apart to reveal dense white flesh, braised in a
        dark reduction of soy, sake, and ginger until the meat turns glossy and falls from the bone. The fishermen who
        hunt oniuo say the fight to land one is half the preparation — the braising is the easy part.</em></p>

        <p><strong>Ingredients</strong>: Oniuo (1 portion) + Tsuchi-shōga (1 portion) + Shōyu (carried) + Sake (carried)

        <strong>Buff</strong>: <strong>Predator&#39;s Tenacity</strong> — When you are reduced below half your hit point
        maximum, gain +1 to attack rolls until the end of your next turn. This triggers once per combat.

        <strong>Where Found</strong>: Kaze province — a ferryman on the Kagerō River who has fished its deep pools for
        forty years. He teaches the recipe as payment for help clearing debris from his crossing.</p>

        <hr>

        <h4 id="kg-kumokiji-no-mushiyaki-cloud-pheasant-steamed-in-"
        data-section="kumokiji-no-mushiyaki-cloud-pheasant-steamed-in-">Kumokiji no Mushiyaki — Cloud Pheasant Steamed
        in Leaves</h4>

        <p><em lang="ja-Latn">Cloud pheasant breast wrapped in murasaki-ha leaves and steamed over a low fire. The
        purple leaf imparts a faint sweetness and tints the meat a pale violet. A dish of high altitude and rare beauty
        — the kind of thing you eat once and remember for the rest of your life.</em></p>

        <p><strong>Ingredients</strong>: Kumokiji (1 portion) + Murasaki-ha (1 portion) + Yuzu (1 portion)

        <strong>Buff</strong>: <strong>Clarity of the Heights</strong> — Advantage on Wisdom saving throws for 8 hours.

        <strong>Where Found</strong>: Takamine — an elderly guide who leads parties above the cloud line. She cooks this
        at the summit camp and shares the recipe only with those who complete the ascent without complaint.</p>

        <hr>

        <h4>☆ Sansai no Sunomono — Wild Harvest Vinegar Salad <em lang="ja-Latn">(Wildcard)</em></h4>

        <p><em lang="ja-Latn">A dish of raw preparation — whatever rare greens and herbs are at hand, sliced thin and
        dressed in vinegar with a scatter of sesame. No cooking, no broth, no fire. The ingredients must be exceptional,
        because nothing hides behind heat.</em></p>

        <p><strong>Ingredients</strong>: Any 2 different rare herbs/greens (1 portion each) + Rice Vinegar (carried) +
        Goma (1 portion)

        <strong>Buff</strong>: <strong>Sei Sensitivity</strong> — Gain the ability to detect sei-active objects and
        creatures within 10 feet for 8 hours (functions as detect magic, but limited to sei energy only).

        <strong>Where Found</strong>: Yōsei Mori border communities — shared among herbalists who trade in rare plants.
        A version of the recipe circulates among the Seishin Enclave&#39;s outer circle.</p>

        <hr>

        <h4 id="kg-kaseki-gani-no-kani-miso-stone-crab-tomalley-gra"
        data-section="kaseki-gani-no-kani-miso-stone-crab-tomalley-gra">Kaseki-gani no Kani-miso — Stone Crab Tomalley
        Gratin</h4>

        <p><em lang="ja-Latn">The dense claw meat of the stone crab, mixed with its own tomalley and broiled in the
        upturned shell until it sets into a rich, savoury custard. The mineral crust of the shell chars and seasons the
        dish from without. A cave-diver&#39;s reward — earned by anyone brave enough to wade into a tidal
        cavern.</em></p>

        <p><strong>Ingredients</strong>: Kaseki-gani (1 portion) + Umi-shio (1 portion) + Sake (carried)

        <strong>Buff</strong>: <strong>Ironhide</strong> — Gain +1 to AC for 8 hours (does not stack with shield or
        magical armor bonuses above +2).

        <strong>Where Found</strong>: Mizu coastline — the pearl-divers of Umigakure know it. Also traded among the
        sailors who shelter in Nami&#39;s cove villages during storm season.</p>

        <hr>

        <h4 id="kg-yrei-kusa-no-chakai-ghost-grass-ceremony-tea"
        data-section="yrei-kusa-no-chakai-ghost-grass-ceremony-tea">Yūrei-kusa no Chakai — Ghost Grass Ceremony Tea</h4>

        <p><em lang="ja-Latn">Not a meal in the traditional sense — a tea ceremony built around the pale,
        cold-to-the-touch ghost grass of Kaze&#39;s ruined settlements. The preparation is slow and deliberate: the
        grass is steeped three times, each steeping drawing out a different quality. The first is bitter. The second is
        smooth. The third carries something that makes the drinker acutely aware of nearby presences.</em></p>

        <p><strong>Ingredients</strong>: Yūrei-kusa (1 portion) + Kome (carried, for accompanying rice cakes) + Shio
        (carried)

        <strong>Buff</strong>: <strong>Spirit Sight</strong> — Gain the ability to see invisible creatures and objects
        within 15 feet for 8 hours. Additionally, you cannot be surprised by undead or spirit creatures.

        <strong>Where Found</strong>: Akatsuki — an elderly herbalist living on the edge of the settlement. The recipe
        is also referenced in fragmentary notes found in Tsukikage&#39;s abandoned guardhouse.</p>

        <hr>

        <h3 id="kg-masterwork-recipes-dc-20" data-section="masterwork-recipes-dc-20">Masterwork Recipes (DC 20)</h3>

        <hr>

        <h4 id="kg-ryketsu-kaiseki-dragon39s-blood-banquet"
        data-section="ryketsu-kaiseki-dragon39s-blood-banquet">Ryūketsu Kaiseki — Dragon&#39;s Blood Banquet</h4>

        <p><em lang="ja-Latn">A multi-course meal built around the impossibly rare dragon&#39;s blood flower. The petals
        are incorporated into every element — infused into the broth, pressed into the rice, scattered over seared
        venison. The meal takes two hours to prepare and demands the cook&#39;s complete attention. Those who eat it
        feel, for a time, as though something ancient is watching over them.</em></p>

        <p><strong>Ingredients</strong>: Ryūketsu-bana (1 portion) + Ryūjika (1 portion) + Kinuo (1 portion) + Ryūjio (1
        portion) + Kome (carried)

        <strong>Buff</strong>: <strong>Progenitor&#39;s Blessing</strong> — +1 bonus to all saving throws for 8 hours.
        Once during the duration, when you are reduced to 0 hit points, you may immediately regain hit points equal to
        1d10 + your character level. This consumes the blessing entirely.

        <strong>Where Found</strong>: Cannot be purchased or casually discovered. Possible sources: deep within
        Progenitor-associated ruins; a gift from a being of great age and wisdom; reward for completing a quest tied to
        dragon legacy.</p>

        <hr>

        <h4 id="kg-seiryoku-nabe-sei-vigor-hot-pot" data-section="seiryoku-nabe-sei-vigor-hot-pot">Seiryoku Nabe —
        Sei-Vigor Hot Pot</h4>

        <p><em lang="ja-Latn">A communal hot pot built around the luminous seiryoku grass, simmered with spirit fish,
        sei mushrooms, and whatever the wilderness provides. The pot glows faintly as it cooks. The ingredients must all
        be fresh — no dried or preserved components. Eating it is a communal act; the buff only functions if shared
        among at least two people.</em></p>

        <p><strong>Ingredients</strong>: Seiryoku-gusa (1 portion) + Seireiuo (1 portion) + Seikinoko (1 portion) + any
        2 common herbs/greens

        <strong>Buff</strong>: <strong>Sei Communion</strong> — All characters who share the meal gain the following for
        8 hours: advantage on concentration checks, +1 to all ability checks, and the ability to communicate
        telepathically with other characters who shared the meal (30 ft range). Requires at least 2 participants.

        <strong>Where Found</strong>: The Seishin Enclave on Unmeijima. Alternatively, fragments of this recipe appear
        across multiple locations — a hermit&#39;s cave in Sora, a shrine wall in the Yōsei Mori, a damaged scroll in
        the Temple of Kinryū. Assembling the complete recipe from fragments is itself a quest.</p>

        <hr>

        <h4>☆ Hoshizora Kaiseki — Starlight Banquet <em lang="ja-Latn">(Wildcard)</em></h4>

        <p><em lang="ja-Latn">A multi-course meal that can only be prepared under open sky when Ryūgetsu is visible. The
        centrepiece is a dish built around any very rare ingredient — meat, herb, or fungus — supported by complementary
        rare and uncommon components. The specific courses change depending on what the cook has gathered. No two
        Starlight Banquets are alike. The meal takes two hours to prepare and demands the cook&#39;s full attention and
        a flawless performance.</em></p>

        <p><strong>Ingredients</strong>: Any 1 very rare ingredient (1 portion) + any 1 rare ingredient from a different
        category (1 portion) + any 1 uncommon seasoning (1 portion) + Kome (carried)

        <strong>Buff</strong>: <strong>Starlit Resolve</strong> — +1 to all ability scores (not modifiers) for 8 hours.
        Additionally, the first time during the duration that you would fail a saving throw, you may choose to succeed
        instead (consumes this portion of the blessing).

        <strong>Where Found</strong>: Cannot be purchased. The recipe exists as a philosophical framework rather than a
        fixed formula — learned from a master cook of extraordinary skill. Possible sources: a retired imperial chef
        living in seclusion, the kitchens of the Hoshimori observatory, or a spirit of the road who tests travellers
        with riddles before teaching the art.</p>

        <hr>

        <h4 id="kg-rykinoko-ryri-dragon-fungus-feast" data-section="rykinoko-ryri-dragon-fungus-feast">Ryūkinoko Ryōri —
        Dragon Fungus Feast</h4>

        <p><em lang="ja-Latn">A meal built around the impossible warmth of the dragon fungus, its golden glow casting
        slow amber light across the cook&#39;s hands as the flesh is sliced thin and layered with seasonal
        accompaniments. Those who eat it describe a feeling of being held — not restrained, but supported, as though the
        earth itself had placed a hand beneath them.</em></p>

        <p><strong>Ingredients</strong>: Ryūkinoko (1 portion) + Ryūjio (1 portion) + any 1 rare herb (1 portion) +
        Dried Dashi (carried)

        <strong>Buff</strong>: <strong>Progenitor&#39;s Calm</strong> — For 8 hours, you are immune to the frightened
        condition. Additionally, you gain advantage on death saving throws and may add your Wisdom modifier to death
        saving throws.

        <strong>Where Found</strong>: A Progenitor-associated cave system deep beneath the mountains. The recipe is
        understood instinctively by anyone who has been in the presence of a living Progenitor. It may also be
        discovered carved into stone near a dragon&#39;s resting chamber.</p>

        <hr>

        <h3 id="kg-named-beast-recipes-yama-no-kami" data-section="named-beast-recipes-yama-no-kami">Named Beast Recipes
        — Yama-no-Ōkami</h3>

        <p>These recipes exist only because the party slew the Mountain God of the Tenchūsan Ren and harvested the beast
        with uncanny skill. Every component is <strong>single-grade-locked at 極上 Gokujō</strong> (see
        <code>core/materials.md</code> → <em lang="ja-Latn">Named Beast Harvests → Yama-no-Ōkami (Slain)</em>), which
        means each dish below automatically clears the grade modifier for tier-up eligibility. A competent cook who can
        clear the upgraded DC delivers a peerless meal; a less skilled cook still produces an exceptional one. There is
        no &quot;ordinary&quot; preparation of these components — the beast will not permit it.</p>

        <p>These recipes are <strong>not on the random loot table</strong>. They can only be learned by DM placement — a
        retired hunter&#39;s journal, a shrine-keeper who remembers the old rites, or a moment of insight at the
        campfire after a long day of travel. They are one-time rewards for a one-time harvest.</p>

        <hr>

        <h4>Ōkami no Kakuni — Mountain God&#39;s Braised Fang-Meat <em lang="ja-Latn">(Masterwork)</em></h4>

        <p><em lang="ja-Latn">Ōkami-niku slow-braised for hours in sake, shōyu, and mountain garlic until the fat
        renders and the meat falls apart in sheets. The flesh is impossibly tender and carries a faint metallic
        brightness on the tongue — the taste of a beast that lived at the edge of the spirit world. Those who eat it
        describe dreams of high passes they have never walked.</em></p>

        <p><strong>Ingredients</strong>: Ōkami-niku (2 portions, Gokujō) + Nobiru (1 portion) + Sake (carried) + Shōyu
        (carried)

        <strong>Cooking DC</strong>: 20 (Masterwork)

        <strong>Buff</strong>: <strong>Mountain God&#39;s Fortitude</strong> — For 8 hours, gain +2 to Constitution
        saving throws and resistance to cold damage. The first time during the duration you would drop to 0 HP, you
        instead drop to 1 HP; this benefit is consumed on use.

        <strong>Gokujō Variant (tier-up)</strong>: As above, plus the eater gains advantage on Strength checks and
        saving throws for the duration, and may add +1d4 to any single attack roll, ability check, or saving throw
        during the duration (consumed on use).

        <strong>Where Found</strong>: Not on the scroll tables. Learned only from direct instruction — a hunter who
        witnessed the harvest, or intuited by a character with proficiency in cook&#39;s utensils who spends downtime
        experimenting with the ingredients.</p>

        <hr>

        <h4>Reikokoro no Kaiseki — Spirit Heart Banquet <em lang="ja-Latn">(Masterwork, Legendary)</em></h4>

        <p><em lang="ja-Latn">A single-sitting banquet built around the Reikokoro — the Spirit Heart — cooked in a
        sealed clay vessel with the marrow, liver, and storm-sinew of the same beast. The heart is cooked whole, and the
        vessel must not be opened until the moment of serving. The meal feeds six and cannot be preserved, split, or
        carried. It is eaten in silence, by the same fire that prepared it, within the same rest period. Those who share
        it describe sensing the wolf&#39;s final thoughts — the smell of snow, the weight of the mountain, the brief and
        perfect stillness before death.</em></p>

        <p><strong>Ingredients</strong>: Reikokoro (1 portion, Gokujō, feeds six) + Shirokiba no Zui (1 portion, Gokujō)
        + Yama no Kimo (1 portion, Gokujō) + Arashi-suji (1 portion, Gokujō) + Kome (carried) + Sake (carried)

        <strong>Cooking DC</strong>: 22 (Masterwork — single hardest check in the recipe list)

        <strong>Buff</strong>: <strong>Bond of the Mountain God</strong> — All characters who share the meal gain the
        following for 24 hours (not 8): +2 to all saving throws, advantage on Wisdom (Survival) checks made in mountain
        terrain, and the ability to sense the direction and approximate distance of any one willing participant at will.
        Additionally, the first time each character would drop to 0 HP during the duration, they instead drop to 1 HP.
        This benefit is consumed individually per character.

        <strong>Gokujō Variant (tier-up)</strong>: As above, plus each participant gains 2d10 temporary hit points for
        the duration, and once during the 24 hours may choose to succeed on a single failed saving throw (each
        character, once, consumed on use).

        <strong>Where Found</strong>: Cannot be purchased, found, or stumbled upon. The recipe is knowledge carried by
        those who remember the old compacts between hunters and mountain kami. Possible sources: a retired hunter who
        served a daimyo of the Tenchūsan Ren; a shrine-keeper at a high-altitude shrine who senses the components the
        party carries; a dream-vision received by a character during a long rest in the mountains while carrying the
        Reikokoro.

        <strong>One-time meal</strong>: The ingredients for this recipe cannot be reassembled. Once the Reikokoro is
        consumed, this dish cannot be made again.</p>

        <hr>

        <h4>Arashi-suji no Dashi — Storm-Sinew Broth <em lang="ja-Latn">(Refined)</em></h4>

        <p><em lang="ja-Latn">A broth rendered from the beast&#39;s sinew — stringy, slow to cook, and startlingly clear
        when it finishes. The first sip is unremarkable. The second carries the taste of wind over a high ridge. The
        drinker finds their step lighter and their lungs deeper.</em></p>

        <p><strong>Ingredients</strong>: Arashi-suji (1 portion, Gokujō) + Shio (carried) + any 1 uncommon herb (1
        portion)

        <strong>Cooking DC</strong>: 16 (Refined)

        <strong>Buff</strong>: <strong>Storm-Lung</strong> — For 8 hours, walking speed increases by 10 ft, you can hold
        your breath for three times the usual duration, and you have advantage on Constitution saving throws made to
        resist exhaustion from forced march or harsh weather.

        <strong>Gokujō Variant (tier-up)</strong>: As above, plus you gain the ability to take the Dash action as a
        bonus action (once per round) for the duration.

        <strong>Where Found</strong>: The simplest of the Yama-no-Ōkami recipes. A character with proficiency in
        cook&#39;s utensils can derive this from the sinew itself after spending an hour studying it at a campfire — the
        preparation is obvious to anyone who has worked with beast sinew before.</p>

        <hr>

        <h2 id="kg-loot-table-recipe-scrolls" data-section="loot-table-recipe-scrolls">Loot Table — Recipe Scrolls</h2>

        <p>Recipes found during exploration are written on scrolls, carved into surfaces, or passed down verbally. The
        DM can place specific recipes as loot, or roll on the following table when a recipe discovery is called for.</p>


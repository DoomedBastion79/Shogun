        <h2 id="kg-design-notes-dm-only" data-section="design-notes-dm-only">Design Notes (DM Only)</h2>

        <p><strong>Wildcard Recipes (☆)</strong>: Recipes marked with ☆ accept flexible ingredient substitutions —
        &quot;any common meat,&quot; &quot;any 2 rare herbs,&quot; etc. These are deliberately front-loaded in the
        system so players who engage with gathering early feel rewarded regardless of which specific ingredients they
        find. Wildcards also encourage experimentation and make the system feel less like a shopping list. The DM should
        let players describe what they&#39;re making with the specific ingredients they chose — this creates organic
        flavour and roleplay moments without requiring a unique recipe for every combination.</p>

        <p><strong>Power Calibration</strong>: Meal buffs are intentionally minor — comparable to a cantrip or a minor
        boon, not a spell effect. They reward engagement with the gathering and cooking system without creating a
        mandatory pre-combat checklist. The Masterwork recipes are deliberately harder to achieve and more impactful,
        serving as adventure rewards in their own right.</p>

        <p><strong>Encouraging the System</strong>: The best way to introduce this is organically — an NPC cooking at a
        campfire, a recipe scroll found as incidental loot, a grateful innkeeper sharing a family recipe. Let the
        players discover that the system exists rather than presenting it as a mechanic to optimize.</p>

        <p><strong>Sei Ingredients and Mystery</strong>: The sei-active ingredients (seireiuo, seikinoko, seiryoku-gusa,
        ryūketsu-bana) are deliberately tied to the world&#39;s deeper lore. Finding them should feel meaningful — these
        are ingredients that connect to the living magic of the world, not commodity goods. Their inability to be
        preserved reinforces this: they are gifts from the moment, not resources to stockpile.</p>

        <p><strong>Interaction with Kinryū no Megumi</strong>: The temple pool blessings are significantly more powerful
        than meal buffs and represent divine-tier effects. Meal buffs are mortal-tier — the difference should be felt.
        If both are active, the more powerful effect (always the temple blessing) takes precedence; the meal buff is
        suppressed but not consumed, resuming if the blessing expires first.</p>


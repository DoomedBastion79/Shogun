        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-overview"
        data-section="overview">Overview</h3>

        <p>Akatsuki -- Dawn -- is a village whose name contradicts its character. It sits in perpetual shadow from the
        peaks above it, reached by a winding stone path gaining significant altitude. The air is cold even in summer.
        Mist collects in the surrounding terrain and rarely lifts before midday, often not at all.</p>

        <p>The village is modest -- terraced farming on steep slopes, stone-built houses with heavy roofs designed for
        snow load, a central well, a small shrine. Residents are not hostile but are compact -- words measured
        carefully, questions answered with just enough to satisfy without offering more. They have maintained this
        posture for generations because they live below the Monastery of the Black Lily.</p>

        <p>Above the village, higher on the mountainside and accessed by a stone staircase cut into the rock face,
        stands the Monastery of the Black Lily.</p>

        <h3 id="kg-districts-landmarks" data-section="districts-landmarks">Districts / Landmarks</h3>

        <p><strong>The Monastery of the Black Lily</strong> -- Dark stone and iron construction; austere; functional
        rather than beautiful. The Order of the Black Lily operates here -- Kagekuni&#39;s premier training facility for
        infiltration specialists, covert intelligence operatives, and precision agents.</p>

        <p>The Order&#39;s relationship with Clan Gekko was long and close. The disappearance of Clan Gekko has severed
        the primary institutional support structure. They are reassessing.</p>

        <p>The monks and initiates know the truth about the Nagaji transformation. They have made a calculated decision
        to not release this information without a reversal plan. They will share the complete truth with parties who
        demonstrate they are positioned to actually address the situation.</p>

        <h3 id="kg-key-figures" data-section="key-figures">Key Figures</h3>

        <p>None publicly documented. The village maintains deliberate anonymity.</p>

        </section>

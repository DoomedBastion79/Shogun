        <section class="kg-tier kg-tier-sealed" data-tier="sealed"><h3 id="kg-dm-secrets" data-section="dm-secrets">DM
        Secrets</h3>

        <p><strong>The Order&#39;s Full Knowledge</strong>

        The Order knows: what ritual was used, who performed it first, approximately how many Gekko clan members were
        transformed, and that Masota no Gekko himself underwent the ritual. They do not know where Masota currently is.
        The transformed Gekko move in patterns that even their surveillance cannot consistently track.</p>

        <p><strong>The Reversal</strong>

        The Order has determined a reversal exists -- theoretical, not practical. It requires three elements: the
        original ritual documentation (in Kinkokyo, in the Golden Dragon Clan&#39;s records); a specific sei
        configuration present only during a particular celestial alignment (upcoming, within the next few sessions); and
        a practitioner capable of performing sei-based restoration at significant scale.</p>

        <p><strong>What the Order Wants from the Party</strong>

        The Order will propose a partnership: the party retrieves the reversal documentation from the Temple of Kinryu;
        the Order handles logistics of gathering the transformed Gekko; together they manage the political revelation on
        a controlled timeline. In exchange, the Order provides intelligence, resources, and full knowledge of the Gekko
        situation.</p>

        <p><strong>The Village&#39;s Role</strong>

        Several former Order members have retired to the village. Two of the village&#39;s farmers are active deep-cover
        agents between assignments. Visitors who threaten this arrangement will encounter more than agricultural
        resistance.</p>

        <h3 id="kg-plot-hooks" data-section="plot-hooks">Plot Hooks</h3>

        <ul>

        <li>A message from the Order reaches the party: &quot;Come to Akatsuki. Complete information will be provided.
        Bring nothing official.&quot;</li>

        <li>The Order has been watching the party since the mountain pass and wants to know what was found beyond the
        gold doors</li>

        <li>An Order initiate has broken protocol and is heading toward Heian with partial information -- needs
        intercepting before triggering political consequences</li>

        </ul>

        </section>

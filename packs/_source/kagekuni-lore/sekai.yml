  - _id: OynrV4dmdEsV78Mj
    _key: '!journal.pages!upvXcfbSR2TcUoKm.OynrV4dmdEsV78Mj'
    name: Sei
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >
        <p><strong>Sei</strong> is the magic energy that flows through all living things on Seizan. It is not an
        external force to be harnessed or a resource to be mined — it is present in the blood, the breath, the roots of
        trees, and the currents of rivers. Sei is woven into the fabric of the world, expressed through celestial
        alignment and natural forces, amplified or diminished by the positions of stars and moons overhead.</p>

        <h2 id="kg-the-nature-of-sei" data-section="the-nature-of-sei">The Nature of Sei</h2>

        <p>Sei responds to the Miyosai system&#39;s celestial bodies. The three stars provide its primary signatures —
        Amaterasu sustains the baseline, Susanoo governs water magic, healing, and purification, and Tsukuyomi shapes
        transformation and energy manipulation. The four moons contribute secondary resonance: tidal, divinatory, and
        amplificatory. When stellar and lunar alignments coincide, the effects compound beyond what either produces
        alone.</p>

        <p>Sei is not evenly distributed. Certain places — ancient groves, mountain peaks, volcanic vents, river
        confluences — concentrate it naturally. Others are sei-dead, drained by catastrophe or corruption. Most people
        live their entire lives within sei&#39;s presence without consciously feeling it, the way a fish does not feel
        the water. Those with the talent to sense and shape sei are rare, and rarer still are those with the discipline
        to master it.</p>

        <h2 id="kg-seimasters" data-section="seimasters">Seimasters</h2>

        <p><strong>Seimasters</strong> are arcane scholars and researchers — though not necessarily practitioners. The
        title connotes scholarship over raw power. A seimaster studies sei as a discipline: mapping its flows,
        theorizing about its celestial dependencies, documenting the correlations between stellar alignment and magical
        expression. A non-casting seimaster may outrank a gifted practitioner socially, in the same way a physician who
        researches disease may outrank the healer who treats it.</p>

        <p>Those who do manifest sei practically map to the familiar arcane traditions — wizards, sorcerers, monks —
        though in Kagekuni these distinctions carry different cultural weight than in other lands. Study typically
        occurs in mountaintop monasteries, removed from the noise of lowland life where the celestial influences can be
        observed more clearly.</p>

        <h2 id="kg-magical-factions" data-section="magical-factions">Magical Factions</h2>

        <p>Several institutions study, practice, or govern the use of sei across Kagekuni:</p>

        <ul>

        <li><strong>Seishin</strong> — The premier magical research institution, located on the island of Unmeijima.
        Seishin maintains the most comprehensive observational records of celestial alignments and their correlations to
        sei fluctuation.</li>

        <li><strong>Raimeiin</strong> (雷鳴院) — Publicly declared during the Plague Campaign. Focus and methods are not
        widely known outside scholarly circles.</li>

        <li><strong>Forest of Spirits</strong> — Publicly declared during the Plague Campaign. Associated with
        naturalistic sei traditions.</li>

        <li><strong>Hikari no Shizuku</strong> — A healing and light magic tradition operating within the capital city
        of @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.Zk6QD9Sdfud4SuRV]{Heian}.</li>

        </ul>

        <h2 id="kg-the-sei-drought" data-section="the-sei-drought">The Sei Drought</h2>

        <p>Sei began declining during the era of the War of Fractured Banners (~12605). The decline was gradual — the
        first secondary star was lost to naked-eye visibility around ~12806, marking the beginning of what scholars now
        call the dark ages. By ~13088, when the last major sei institution — the Temple of Ōryūzan Tenkū-ji — fell, sei
        was effectively inaccessible.</p>

        <p>The period without accessible sei lasted approximately <strong>3,077 years</strong> (<del>12806–</del>15883).
        During those millennia, the magical traditions of Kagekuni were extinguished. Knowledge was lost, institutions
        crumbled, and the cultural and intellectual life of the archipelago collapsed — though the physical world
        survived, sustained by Amaterasu&#39;s baseline energy.</p>

        <p>Sei slowly returned through the emergence of <strong>Talents</strong> beginning <del>15962 — individuals born
        with an innate capacity to sense and shape sei, the first in over three thousand years. The process accelerated
        until the <strong>Great Awakening</strong> (</del>16693), when sei was considered fully restored. The current
        campaign date of 16744 is just 51 years post-Awakening — living memory. The eldest practitioners remember a
        world without magic.</p>

        <p>The drought&#39;s cause is officially unknown. Scholars debate whether it was a consequence of the War of
        Fractured Banners itself, a natural celestial cycle, or something else entirely. No consensus exists.</p>

        <h2 id="kg-kuroyami-no-akuma-and-the-plague-campaign"
        data-section="kuroyami-no-akuma-and-the-plague-campaign">Kuroyami no Akuma and the Plague Campaign</h2>

        <p>Not all who shape sei do so in service of the living. <strong>Kuroyami no Akuma</strong> — formerly Takeda
        Arata — discovered a necromantic tome within Kuroshi Temple on the haunted island of Yurei. The knowledge within
        allowed him to wage the <strong>Plague Campaign</strong> (16609–16616), a war of undeath and corruption that
        scarred Kagekuni.</p>

        <p>Kuroyami no Akuma was defeated but <strong>never captured or killed</strong>. He escaped, and his whereabouts
        remain unknown. His followers, the <strong>Eikyū Yami Clan</strong>, persist — a reminder that sei is a tool,
        and tools serve the hand that holds them.</p>

        <h2 id="kg-dm-note-the-true-cause-of-the-sei-drought"
        data-section="dm-note-the-true-cause-of-the-sei-drought">DM Note — The True Cause of the Sei Drought</h2>

        <p>The sei drought was caused by the <strong>Great Aphelion</strong> — the simultaneous maximum separation of
        all three stars of the Miyosai system. The causal chain (aphelion → Progenitor slumber → drought, or aphelion →
        both independently) is unknown even to the Ancient Guard. The slow orbital return of the secondary stars
        correlates precisely with sei&#39;s gradual restoration, but the orbital correction is <strong>not yet
        complete</strong>. Tsukuyomi&#39;s projection, while present, carries slightly less intensity than its
        pre-decline readings.</p>

        <p>No living scholar has assembled the complete picture. The data exists in fragmentary astronomical records
        across multiple institutions, but no one has connected stellar position to sei availability. The Golden Dragon
        Clan&#39;s observatory at Ōryūzan Tenkū-ji contained the most complete model of the Miyosai system ever
        constructed — the mechanical-arcane orrery capable of projecting celestial positions across millennia. It has
        not been operational since the temple fell in 13088.</p>

        <h2 id="kg-dm-note-murasakiry39s-sei-awareness" data-section="dm-note-murasakiry39s-sei-awareness">DM Note —
        Murasakiryū&#39;s Sei Awareness</h2>

        <p>Every sei use in Kagekuni passes through the awakened Progenitor <strong>Murasakiryū&#39;s</strong>
        awareness. Every spell the party casts, every druidic invocation, every monk ability — all of it is potentially
        observed. Whether Murasakiryū actively monitors individual sei users or maintains passive background awareness
        is unresolved. Whether the party registers as notable is unknown.</p>

  - _id: yuwAaiePf29pzhjk
    _key: '!journal.pages!upvXcfbSR2TcUoKm.yuwAaiePf29pzhjk'
    name: The Current Year 16744
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >
        <p>It has been fifty-one years since the Great Awakening. Within living memory, magic returned to a world that
        had forgotten it existed. The energy called sei — once woven through every living thing on Seizan — went silent
        for over three thousand years. When it returned, it returned to a world that had changed. Institutions built on
        magical foundations had long since crumbled. The knowledge, the traditions, the scholarly lineages that once
        sustained sei practice were gone. What emerged in their place was something rawer: individuals born with innate
        magical talent — <strong>Talents</strong> — appearing without warning, without teachers, and without a society
        that knew what to do with them.</p>

        <p>The first Talents were persecuted. Later ones were tolerated, studied, and eventually recruited. Magical
        enclaves formed — Seishin on the island of Unmeijima became the premier research institution; Hikari no Shizuku
        established a healing tradition within the capital. By the time the Great Awakening made sei fully accessible
        again, the daimyo of Kagekuni were already competing to recruit mages into their service. Magic had returned.
        The question of who would control it had only just begun.</p>

        <h2 id="kg-an-empire-without-an-emperor" data-section="an-empire-without-an-emperor">An Empire Without an
        Emperor</h2>

        <p>Emperor <strong>Ryūjin no Mikado</strong> — the eighteenth emperor, the last of the near-immortal elven line
        stretching back to the founding — died in <strong>16739</strong>. The official cause was old age. He was the
        final link to an unbroken chain of rulers that began with Tenryū no Mikado over eight thousand years ago.</p>

        <p>No confirmed successor has emerged. Multiple claimants have presented genealogical proof of varying
        credibility, but none has secured recognition from the <strong>Kokushi Kyōkai</strong> — the five government
        ministers who administer the empire. The ministers themselves are holdovers, functioning in constitutional
        limbo. They maintain taxation, law, infrastructure, and diplomacy, but they lack the authority to resolve the
        central crisis: who rules?</p>

        <p>The problem is compounded by Ryūjin&#39;s final reform. In <strong>16732</strong>, the emperor decreed that
        the Kokushi Kyōkai could no longer appoint a Shogun without imperial approval. The Shogunate — the military
        authority that has historically held the empire together during periods of crisis — is legally frozen. There is
        no emperor to approve a Shogun, and no Shogun to impose order.</p>

        <h2 id="kg-dm-note-the-emperor39s-death" data-section="dm-note-the-emperor39s-death">DM Note — The Emperor&#39;s
        Death</h2>

        <p>Ryūjin&#39;s death is not what it appears. The official story is old age, but <strong>foul play is
        suspected</strong>. Two independent daimyo —
        <strong>@UUID[Compendium.kagekuni-assistant.npcs-lore.JournalEntry.ckxUlw8oW1BCfkai]{Raijin no
        Kazuhiko}</strong> (Clan Kaminari) and
        <strong>@UUID[Compendium.kagekuni-assistant.npcs-lore.JournalEntry.PvAlkONFgMVdtZW9]{Akihiko Kurohana}</strong>
        (Clan Kurohana) — are both quietly investigating the circumstances of the emperor&#39;s death. Neither has
        shared their suspicions publicly. The 16732 reform that froze the Shogunate may have been motivated by
        Ryūjin&#39;s awareness of threats against the imperial line — a last attempt to prevent his enemies from
        consolidating power after his death.</p>

        <p><strong>@UUID[Compendium.kagekuni-assistant.npcs-lore.JournalEntry.BIHGIXqUS0FLQg7C]{Hiroshi
        Nakamura}</strong>, Shugo (military governor) of
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.Zk6QD9Sdfud4SuRV]{Heian} in Kaminari territory, is a
        <strong>traitor</strong> working with the Genso Alliance. He is using his position to feed intelligence to Genso
        — likely connected to the larger political destabilisation.</p>

        <h2 id="kg-war-between-the-alliances" data-section="war-between-the-alliances">War Between the Alliances</h2>

        <p>Into this vacuum, war has come. In <strong>16742</strong>, tensions between two major clan alliances erupted
        into open conflict.</p>

        <p>The <strong>Genso Alliance</strong> — Clans Fuyugiri, Homoruyama,
        Ryū@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.D2VV9bFa1txuKDxB]{kaze},
        and Tsuchiura — governs the provinces of
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.EPAWGqYCrUzYfngV]{Kusa}
        and
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.qODDmax1GHoTx3fx]{Tsuchi}.
        The <strong>Arashi Alliance</strong> — Clans Arashiyama, Hoshizora, Shirotsuru, and Yūgure — governs
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.M72zAjYRdrTCan30]{Mizu}
        and
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.ijGHvVOlw9tFpBo8]{Nami}.
        Two years of escalating hostility have produced no decisive outcome. Battles are fought, borders shift, villages
        burn, and the common people pay the price.</p>

        <p>Three clans remain independent: <strong>Kaminari</strong>, <strong>Kurohana</strong>, and
        <strong>Gekkō</strong>. Their allegiance — or continued neutrality — could tip the war decisively. Every faction
        knows this. The independents are courted, threatened, and watched. They are the fulcrum on which the future of
        Kagekuni may turn.</p>

        <h2 id="kg-clan-kaminari-independent" data-section="clan-kaminari-independent">Clan Kaminari (Independent)</h2>

        <p>Governed by <strong>Raijin no Kazuhiko</strong>, the Storm-lord — a human warrior of 47 years who was born
        outside the clan and rose through martial prowess alone. Kaminari controls the Province of
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.eAI9SnbW1RmsWOGw]{Hana}
        and its capital, <strong>Heian</strong> — the imperial capital, now without an emperor. Known for mastery of
        storm magic and fierce warriors, Kaminari occupies the most politically sensitive position of any clan: they
        hold the seat of empire without the authority to claim it.</p>

        <h2 id="kg-clan-kurohana-independent" data-section="clan-kurohana-independent">Clan Kurohana (Independent)</h2>

        <p>Led by <strong>Akihiko Kurohana</strong> — a black dragonborn of 54 years, tall and imposing, with scales
        like polished obsidian and eyes that glow faintly red. Kurohana maintains independence through strength and
        reputation. Their daimyo&#39;s intentions are difficult to read, which is precisely as he prefers it.</p>

        <h2 id="kg-clan-gekk-independent-status-uncertain" data-section="clan-gekk-independent-status-uncertain">Clan
        Gekkō (Independent — Status Uncertain)</h2>

        <p>Daimyo <strong>Masota no Gekkō</strong> has not been seen publicly in some time. His clan&#39;s silence has
        drawn attention from both alliances and from the other independents. Rumours vary — illness, a power struggle
        within the clan, or something worse. The truth of Clan Gekkō&#39;s situation is one of the most pressing
        questions in Kagekuni&#39;s current politics.</p>

        <h2 id="kg-dm-note-clan-gekk" data-section="dm-note-clan-gekk">DM Note — Clan Gekkō</h2>

        <p>Clan Gekkō attempted a dark ritual with catastrophic consequences. The entire clan — including Daimyo Masota
        no Gekkō — was <strong>transformed into Nagaji</strong> (serpent folk). Masota retains fragmented awareness, but
        his mental coherence is degrading over time. The longer the situation persists, the less of him remains to
        reach.</p>

        <p>The <strong>Order of the Black Lily</strong> (Monastery of the Black Lily, above
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.ow3AGqlvFevncAwN]{Akatsuki} village in Kaze province)
        knows the truth and has been monitoring the situation. The party has already encountered and <strong>killed
        several Nagaji without knowing they were Gekkō clan members</strong>. The moral reckoning is pending.</p>

        <p>A reversal may be possible but requires rare materials, specific conditions, or Progenitor involvement. The
        details are TBD.</p>

        <h2 id="kg-the-alliances-at-a-glance" data-section="the-alliances-at-a-glance">The Alliances at a Glance</h2>

        <table>

        <thead>

        <tr>

        <th>Alliance</th>

        <th>Clans</th>

        <th>Provinces</th>

        </tr>

        </thead>

        <tbody><tr>

        <td><strong>Genso</strong></td>

        <td>Fuyugiri, Homoruyama, Ryūkaze, Tsuchiura</td>

        <td>Kusa, Tsuchi</td>

        </tr>

        <tr>

        <td><strong>Arashi</strong></td>

        <td>Arashiyama, Hoshizora, Shirotsuru, Yūgure</td>

        <td>Mizu, Nami</td>

        </tr>

        <tr>

        <td><strong>Independent</strong></td>

        <td>Kaminari, Kurohana, Gekkō</td>

        <td>Hana, and others</td>

        </tr>

        </tbody></table>

        <h2 id="kg-the-caste-system" data-section="the-caste-system">The Caste System</h2>

        <p>Kagekuni&#39;s social order is rigid, ancient, and under strain. Three castes define a person&#39;s place in
        the world:</p>

        <p>The <strong>Kugai</strong> — the elite — are primarily humans and dragonborn who claim descent from the
        imperial founders. Daimyo, courtiers, scholars, and high-ranking samurai occupy this tier. Below them, the
        <strong>Zokumin</strong> — the commonfolk — encompass everyone from samurai and ronin to peasants, artisans, and
        merchants. Merchants sit at the bottom of the Zokumin despite their often considerable wealth, a source of
        constant social friction. At the lowest rung, the <strong>Burakumin</strong> — the outcasts — are those whose
        occupations involve death: leather workers, butchers, executioners, undertakers. They live in segregated
        communities with limited civil rights and face systemic harassment.</p>

        <p>Race compounds caste. Dragonborn and humans — particularly those of the locally dominant lineage — move
        through society with relative ease. Others do not. Characters who are not of the dominant race in a given
        territory find doors closed, prices raised, and suspicion constant.</p>

        <h2 id="kg-the-ronin-surge" data-section="the-ronin-surge">The Ronin Surge</h2>

        <p>With the political vacuum, the frozen Shogunate, and open war between the alliances, the number of masterless
        samurai — <strong>ronin</strong> — has reached an all-time high. Former retainers of dead lords, warriors whose
        clans dissolved during the Epoch of Factional Flux, and samurai who simply walked away from service they no
        longer believed in — all of them crowd the roads, the teahouses, and the employment boards of every town. Some
        seek honourable service. Others have abandoned honour entirely. The roads of Kagekuni have never been less
        safe.</p>

        <h2 id="kg-the-eruption-of-akaho-sanmyaku" data-section="the-eruption-of-akaho-sanmyaku">The Eruption of Akaho
        Sanmyaku</h2>

        <p>On <strong>Hachigatsu 29, 16744</strong> — just days ago — the volcanic range of <strong>Akaho
        Sanmyaku</strong> on the northern island of Fushichō erupted. Ash is visible from as far as the Tenchūsan Ren
        mountains on Hokori. The eruption is ongoing. Fushichō has always been a land of fire and ancient secrets; what
        this eruption means for the settlements and peoples of that island remains to be seen.</p>

        <h2 id="kg-tatara-the-eternal-feud" data-section="tatara-the-eternal-feud">Tatara — The Eternal Feud</h2>

        <p>On the southern island of Tatara, the ancient feud between the <strong>Zirak</strong> (dwarves) and the
        <strong>Glimfyr</strong> (gnomes) has escalated again. The conflict — which predates the War of Fractured
        Banners — has historically been held in check only by imperial decree. With no emperor to command restraint, old
        hatreds have resurfaced. Recent reports suggest the gnomes deliberately sabotaged a dwarven relic site, an act
        of provocation that the Zirak are unlikely to answer with diplomacy.</p>

        <h2 id="kg-the-shadow-of-the-plague-campaign" data-section="the-shadow-of-the-plague-campaign">The Shadow of the
        Plague Campaign</h2>

        <p>The Plague Campaign of <strong>16609–16616</strong> remains the defining trauma of the post-Awakening era.
        <strong>Kuroyami no Akuma</strong> — once Takeda Arata, before he found a necromantic tome in the cursed Kuroshi
        Temple on the haunted island of Yurei — raised undead legions and waged a war that scarred the archipelago. The
        response united unlikely allies: the Shogun recruited Talents, and the magical enclaves of Seishin, the
        Raimeiin, and the Forest of Spirits revealed themselves publicly for the first time.</p>

        <p>Kuroyami was defeated. He was <strong>never captured or killed</strong>. His cult, the <strong>Eikyū Yami
        Clan</strong>, persists in some form. The question of where Kuroyami is — and what he has been doing for the
        last 128 years — is one that very few people ask aloud.</p>

        <h2 id="kg-the-magical-landscape" data-section="the-magical-landscape">The Magical Landscape</h2>

        <p>Magic is new. Not new to the world — new to the people living in it. Sei sustained civilisation for millennia
        before the dark ages, but the dark ages lasted long enough to erase nearly all institutional memory of how magic
        worked, who wielded it, and what it meant. The current generation of practitioners is rebuilding from
        fragments.</p>

        <p>The major magical institutions known publicly are:</p>

        <ul>

        <li><strong>Seishin</strong> (Unmeijima) — The premier research institution, founded around the figure of Hikari
        no Kenta, the first known Talent. Now a city in its own right.</li>

        <li><strong>Hikari no Shizuku</strong> (Heian) — A healing and light magic tradition operating within the
        capital.</li>

        <li><strong>Raimeiin</strong> — Revealed during the Plague Campaign; methods and focus not widely known.</li>

        <li><strong>Forest of Spirits</strong> — Revealed during the Plague Campaign; associated with naturalistic sei
        traditions.</li>

        <li><strong>Order of the Tranquil Lotus</strong> (Unmeijima) — A nature-based monastic order near the town of
        Kazehama. Elder @UUID[Compendium.kagekuni-assistant.npcs-lore.JournalEntry.9nQv7OQNP70y8Lc1]{Benkei}, a Guhuza
        of 198 years, leads the order.</li>

        <li><strong>Order of the Sacred Grove</strong> — A druidic tradition protective of specific sacred sites. Its
        former Guardian, @UUID[Compendium.kagekuni-assistant.npcs-lore.JournalEntry.Yk0fOJkKYfbgC0jU]{Solas Evergreen},
        is deceased. A new Guardian has been appointed.</li>

        </ul>

        <h2 id="kg-dm-note-the-order-of-the-ancient-guard" data-section="dm-note-the-order-of-the-ancient-guard">DM Note
        — The Order of the Ancient Guard</h2>

        <p>Behind the known orders lies the most secret organisation in Kagekuni: the <strong>Order of the Ancient
        Guard</strong>. Their purpose is the silent protection of the living founding dragons — the seven Progenitors
        who are believed dead but are in fact in deep slumber. The Ancient Guard maintains hidden sanctuaries, exerts
        subtle influence to prevent any single power from dominating, and guards the conditions under which the dragons
        remain safe and hidden.</p>

        <p>Known members include <strong>Benkei</strong> (rank TBD) and the deceased <strong>Solas Evergreen</strong>
        (rank likely Protector or higher). Solas&#39;s murder means someone killed a member of the order protecting the
        dragons. The scope of the threat is unknown.</p>

        <h2 id="kg-dm-note-the-progenitor-dragons" data-section="dm-note-the-progenitor-dragons">DM Note — The
        Progenitor Dragons</h2>

        <p>All <strong>seven founding dragons are alive</strong>, hidden in deep slumber across the archipelago. Their
        dormancy coincided with the Great Aphelion and the sei drought. Whether one caused the other, or both share a
        common cause, is unknown even to the Ancient Guard.</p>

        <p>One exception: <strong>Murasakiryū</strong> (Amethyst Dragon, domain of arcane knowledge and divination) is
        <strong>awake</strong> — woken by dark mortals who believed they were awakening Kokuryū (Onyx). Murasakiryū is
        actively masquerading as Kokuryū. The Great Awakening (~16687) was not a natural restoration of magic — it was
        the consequence of waking a single malevolent Progenitor. Every sei user in Kagekuni draws power through
        Murasakiryū&#39;s waking awareness.</p>

        <p><strong>Solas Evergreen was killed to prevent the awakening of Kinryū</strong> (Golden Dragon, domain of
        honour and justice) — the natural counter-balance. Relc now holds Solas&#39;s mission: the Warden&#39;s Wisdom
        cipher that leads to methods for waking Kinryū.</p>

        <h2 id="kg-the-season" data-section="the-season">The Season</h2>

        <p>It is <strong>Nagatsuki 1, 16744</strong> — the first day of the Month of Long Nights, the opening of
        <strong>Aki</strong>. Autumn has arrived. The harvest is underway across the lowlands. Violet grasses are
        darkening toward black on the hillsides. Crystal-barked trees have begun to chime in the cooling mountain winds.
        The goldtail fish runs have started in the rivers.</p>

        <p>Above, all three stars of the Miyosai system burn in the sky — Amaterasu&#39;s gold, Susanoo&#39;s
        blue-white, and Tsukuyomi&#39;s deep red. Fifty-one years ago, that was not the case. The eldest among you
        remember a sky with only one star. The world is brighter now. Whether it is safer remains to be seen.</p>

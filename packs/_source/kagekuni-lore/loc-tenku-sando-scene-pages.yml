  - _id: HlQWN63slDjdsXo0
    _key: '!journal.pages!pOY59ySukjVhZJkf.HlQWN63slDjdsXo0'
    name: 登り口 Noborikuchi — The Celestial Approach
    type: text
    title:
      show: false
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <section id="sec-loc-tenku-sando--celestial-approach-delivery" class="secret kg-secret-sealed kg-dm-delivery
        kg-delivery" data-kind="dm-note" data-dmrole="delivery" data-loc="loc-tenku-sando"
        data-scene="celestial-approach">

        <p><strong>Delivery</strong></p>

        <p>Read with quiet gravity — slow and even, as though reading an old inscription aloud for the first time. Pause
        after the second sentence and let the image of the five levels sit before finishing on the gold.</p>


        </section>




        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-noborikuchi-the-celestial-approach" data-section="noborikuchi-the-celestial-approach">登り口
        Noborikuchi — The Celestial Approach</h4></header>

        <p>The mountain track gives out beneath your feet, and the path ahead remembers what it is. Pale cut stone rises
        in five great terraced steps up the southern face — frost has split the tiles and centuries of scree have
        drifted across them, but the scale of it stops you: this was made to be walked by many, over a very long time.
        The wind moves through it without greeting. Dragon-heads of weathered stone stand along the levels, each face
        turned outward over the drop as though they have been watching the lower passes for an age, and against the
        inner cliff a squared pillar of pale stone waits within arm&#39;s reach, its flat top traced with something
        carved. Far above, at the head of the climb, a thin edge of gold catches the morning light.</p>


        </article>

        </div>




        <section id="sec-loc-tenku-sando--celestial-approach-watcher-kindles" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="celestial-approach">

        <p><strong>The Head Wakes</strong></p>

        <p>When a creature passes within roughly ten feet of one of the dragon-head statues during the ascent, something
        stirs inside it. A soft warmth rises in the seams between the carved scales — low and golden, like a coal
        remembering it was once a fire. The head holds this glow while the creature remains close. It asks nothing. It
        simply seems, in some way difficult to defend aloud, glad.</p>


        </section>


        <section id="sec-loc-tenku-sando--celestial-approach-pedestal-inscription" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="celestial-approach">

        <p><strong>What the Pedestal Says</strong></p>

        <p>The flat top surface of the squared pillar carries two inscriptions in worn calligraphy — shallow from the
        wind, but legible with patience and a clean angle of light. The first is cut deep and formal, the lettering of
        something meant to last as long as the stone: <em lang="ja-Latn">&quot;I come without weapons of
        pride.&quot;</em> The second is smaller, set to one side like a signature — a name and a year: <em
        lang="ja-Latn">&quot;Saitō Hagumi · year 13062.&quot;</em></p>


        </section>


        <section id="sec-loc-tenku-sando--celestial-approach-pedestal-warmth" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="celestial-approach">

        <p><strong>Not Quite Cold</strong></p>

        <p>The stone of the pedestal is cold under the hand — but where fingers rest in the carved grooves of the
        letters, the cold seems a half-degree less certain than it ought to be, as though the pedestal is not dead, only
        very deeply asleep, and dreaming faintly of being touched.</p>


        </section>
      markdown: ''

        <section id="sec-loc-tenku-sando--roadside-shrine-delivery" class="secret kg-secret-sealed kg-dm-delivery
        kg-delivery" data-kind="dm-note" data-dmrole="delivery" data-loc="loc-tenku-sando" data-scene="roadside-shrine">

        <p><strong>Delivery</strong></p>

        <p>Read this quietly, almost offhandedly — the shrine is easy to miss. Slow down on the final sentence and let
        the silence do the work. The point is its presence without warmth: something that was meant to answer, and
        doesn&#39;t.</p>


        </section>




        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-dso-no-yashiro-the-roadside-shrine" data-section="dso-no-yashiro-the-roadside-shrine">道祖の社
        Dōso-no-Yashiro — The Roadside Shrine</h4></header>

        <p>Set into the living rock behind the basin — easy to miss against the cliff — a small shrine stands in its own
        shallow recess. A carved dragon spreads its wings in low relief above, worn by weather until the lines barely
        lift from the stone. Below it, a waist-high platform of cut stone juts from the cliff face, its surface smoothed
        by years of hands that are no longer coming. Reach out and you can touch it; the cold of the mountain comes
        through the stone immediately, deep and still. At the platform&#39;s foot, a shallow basin meant for offerings
        holds only a thin drift of wind-sifted grit.</p>


        </article>

        </div>




        <section id="sec-loc-tenku-sando--roadside-shrine-wayside-shrine-type-gate" class="secret kg-secret-sealed
        kg-dm-mechanics" data-kind="dm-note" data-dmrole="mechanics" data-loc="loc-tenku-sando"
        data-scene="roadside-shrine">

        <p><strong>Gate — A Michibata no Jinja</strong></p>

        <p>Religion DC 10, or a traveller&#39;s lived experience of rural shrines. On a success, reveal <em
        lang="ja-Latn">A Michibata no Jinja</em>.</p>


        </section>


        <section id="sec-loc-tenku-sando--roadside-shrine-wayside-shrine-type" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="roadside-shrine">

        <p><strong>A Michibata no Jinja</strong></p>

        <p>This is a <em lang="ja-Latn">michibata no jinja</em> — a roadside shrine, the kind placed at mountain passes
        and lonely crossings to shelter travelling pilgrims. A shrine of this type in active worship answers an offering
        with a small blessing for the road ahead. This one is present, whole, and without any warmth — it has the
        structure of something that once answered, and the silence of something not called in a very long time.</p>


        </section>


        <section id="sec-loc-tenku-sando--roadside-shrine-relief-subject-gate" class="secret kg-secret-sealed
        kg-dm-mechanics" data-kind="dm-note" data-dmrole="mechanics" data-loc="loc-tenku-sando"
        data-scene="roadside-shrine">

        <p><strong>Gate — The Carved Relief</strong></p>

        <p>Religion DC 12 or History DC 12 — a character who studies the carved relief. On a success, reveal <em
        lang="ja-Latn">The Carved Relief — Kinryu</em>.</p>


        </section>


        <section id="sec-loc-tenku-sando--roadside-shrine-relief-subject" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="roadside-shrine">

        <p><strong>The Carved Relief — Kinryu</strong></p>

        <p>The dragon spread above the platform is not decorative convention — wings in full ascent, the long spiral of
        the body — this is <em lang="ja-Latn">Kinryu</em>, the Golden Dragon, rendered in the iconographic style of the
        Kinkozan clan-priests. The same subject as the great sleeping shape in the basin above. The shrine was placed
        here to serve pilgrims making the ascent, and it watches the same thing the path was made to wake.</p>


        </section>


        <section id="sec-loc-tenku-sando--roadside-shrine-dormant-state-gate" class="secret kg-secret-sealed
        kg-dm-mechanics" data-kind="dm-note" data-dmrole="mechanics" data-loc="loc-tenku-sando"
        data-scene="roadside-shrine">

        <p><strong>Gate — The Shrine Is Waiting</strong></p>

        <p>Investigation DC 13 or Religion DC 12. On a success, reveal <em lang="ja-Latn">The Shrine Is
        Waiting</em>.</p>


        </section>


        <section id="sec-loc-tenku-sando--roadside-shrine-dormant-state" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="roadside-shrine">

        <p><strong>The Shrine Is Waiting</strong></p>

        <p>The shrine shows no damage, no defacement, no sign of deliberate sealing or abandonment. The basin is simply
        empty; the stone is simply cold. Whatever kept a shrine like this alive — the prayers of ascending pilgrims, the
        working of the path itself — has been absent for a very long time. The structure is ready. The shrine is not
        broken. It is waiting for something the path has forgotten how to receive.</p>


        </section>

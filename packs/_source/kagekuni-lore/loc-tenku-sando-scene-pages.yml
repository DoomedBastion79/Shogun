      content: >-
        <section id="sec-loc-tenku-sando--nagaji-squad-l5-roster" class="secret kg-secret-sealed kg-dm-brief"
        data-kind="dm-note" data-dmrole="brief" data-loc="loc-tenku-sando" data-scene="nagaji-squad-l5">

        <p><strong>Squad</strong></p>

        <p><strong>The head of the climb.</strong> 10
        @UUID[Compendium.kagekuni-assistant.monsters.Actor.0U3ovqWCecMOrh9C]{Nagaji Ashigaru}, 1
        @UUID[Compendium.kagekuni-assistant.monsters.Actor.d1fY2hMfDH5AEG01]{Nagaji Bushi}, and 1
        @UUID[Compendium.kagekuni-assistant.monsters.Actor.cRhrQ7TL3vVUKO75]{Nagaji Zasu} — a head priest, and the
        commander of the path. They hold the top of the switchback, the last ground before the temple&#39;s gold doors.
        The Zasu stands at the head of the path; the Bushi is its shield; the Ashigaru fill the exposed terrace.</p>

        <p>This is the climax of the ascent. Stage it as one: the largest squad, the highest leader, and behind them — a
        half-seen gleam through the blizzard — the gold doors themselves.</p>


        </section>


        <section id="sec-loc-tenku-sando--nagaji-squad-l5-tactics" class="secret kg-secret-sealed kg-dm-encounter"
        data-kind="dm-note" data-dmrole="encounter" data-loc="loc-tenku-sando" data-scene="nagaji-squad-l5">

        <p><strong>Running the Fight</strong></p>

        <p><strong>The big one — and still survivable.</strong> Ten Ashigaru is a wall of bodies; the terrace should
        feel like the party is carving through an army. It is not an army — it is ten 9-HP soldiers, one Bushi, and one
        Zasu, and by now the party has fought this shape four times and knows it.</p>

        <ul>

        <li>Open wide: Ashigaru pouring across the terrace, the Bushi forward, the Zasu commanding from the head of the
        path. Let the first round look unwinnable, then let the Ashigaru start dropping in threes.</li>

        <li>The Zasu is a commander, not a brawler — it buffs, controls, and rallies. Breaking it should visibly deflate
        the squad (a morale beat: surviving Ashigaru waver and scatter into the storm).</li>

        <li><strong>Off-ramp:</strong> the Zasu can be a <em lang="ja-Latn">parley</em> as readily as a fight — it is a
        priest, it can be reasoned with, and the blizzard is killing its own troops too. A party with the infant in tow
        has real leverage.</li>

        <li>This is the last squad on the path; clearing the terrace opens the way on to the gold doors beyond.</li>

        </ul>


        </section>

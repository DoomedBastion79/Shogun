      content: >-
        <section id="sec-loc-tenku-sando--nagaji-squad-l3-roster" class="secret kg-secret-sealed kg-dm-brief"
        data-kind="dm-note" data-dmrole="brief" data-loc="loc-tenku-sando" data-scene="nagaji-squad-l3">

        <p><strong>Squad</strong></p>

        <p><strong>Middle terrace.</strong> 8
        @UUID[Compendium.kagekuni-assistant.monsters.Actor.0U3ovqWCecMOrh9C]{Nagaji Ashigaru}, 1
        @UUID[Compendium.kagekuni-assistant.monsters.Actor.vWu3fJlU8NZsRRGM]{Nagaji Sōhei}, and 1
        @UUID[Compendium.kagekuni-assistant.monsters.Actor.d1fY2hMfDH5AEG01]{Nagaji Bushi} — the first genuinely
        dangerous Nagaji the party meets. The Bushi (AC 17, enchanted chain) leads from the front; the Sōhei anchors the
        Ashigaru line behind it.</p>

        <p>By this level the squads have heard the fighting below. This one is braced and waiting.</p>


        </section>


        <section id="sec-loc-tenku-sando--nagaji-squad-l3-tactics" class="secret kg-secret-sealed kg-dm-encounter"
        data-kind="dm-note" data-dmrole="encounter" data-loc="loc-tenku-sando" data-scene="nagaji-squad-l3">

        <p><strong>Running the Fight</strong></p>

        <p><strong>The Bushi is the encounter.</strong> Everything else is texture. Run the 8 Ashigaru as a screen the
        Bushi fights behind — they exist to soak the party&#39;s actions for a round or two so the Bushi gets clean
        swings. Once the screen breaks, it is the party&#39;s four against one elite, which they win.</p>

        <ul>

        <li>The lesson is focus-fire discipline: rushing the Bushi through the screen is harder; clearing the screen
        first is safe. Either way it <em lang="ja-Latn">feels</em> big.</li>

        <li>Keep one real threat on the board — rule that the Bushi&#39;s enchanted armor wards it from the cold, so it
        stays dangerous even if you are using the cold-blooded ruling on the rank-and-file.</li>

        <li>Difficult terrain and the 60 ft cap still apply; the Bushi may loom alone out of the white ahead of its
        squad for a nasty opening beat.</li>

        </ul>


        </section>

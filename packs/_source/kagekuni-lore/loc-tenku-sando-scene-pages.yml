    text:
      format: 1
      content: >
        <h2 id="kg-the-sand-puzzle-design-locked" data-section="the-sand-puzzle-design-locked">The Sandō Puzzle — Design
        (Locked)</h2>

        <p><strong>Goal.</strong> Awaken the Sleeping Dragon on Level 2. Awakening sheds millennia of accumulated debris
        and reveals the gold beneath. A small roadside shrine, dormant behind it all along, wakes. Because the
        Sandō&#39;s foundational magic is continuous with the temple&#39;s, this awakening also gates access to the
        broad chamber (Grand Hall — Hiroba) inside — the first beat of the <strong>restoring-the-temple
        thread</strong>.</p>

        <h2 id="kg-mechanics" data-section="mechanics">Mechanics</h2>

        <p>The rite has <strong>three layered components</strong> — passive, active, and culminating.</p>

        <h3 id="kg-1-seven-watchers-passive" data-section="1-seven-watchers-passive">1. Seven Watchers (passive)</h3>

        <p>Seven of the eight dragon-heads kindle softly when a creature passes within ~10 ft of them on the ascent. No
        action required — the act of walking the path is the act of being witnessed. Once kindled, a Watcher remains lit
        so long as any party member remains on the Sandō; it fades within an hour of all party members leaving the path
        entirely.</p>

        <p>Distribution across the five levels: <strong>L1 — 1, L2 — 2 (flanking the Sleeping Dragon), L3 — 2, L4 — 2,
        L5 — 0</strong> — the seven Watchers. The eighth head, the Threshold Head, and its shrine sit apart on Level 1,
        the Lower Landing.</p>

        <h3 id="kg-2-four-prayers-active" data-section="2-four-prayers-active">2. Four Prayers (active)</h3>

        <p>One pedestal per level on Levels 1-4. Each pedestal carries two inscriptions: a <strong>vow</strong> (the
        same on every walking; carved into the path&#39;s making) and a <strong>pilgrim name + year</strong> (which
        cascades — the path&#39;s living memory). The prayer at each pedestal is:</p>

        <ol>

        <li>Read the inscribed pilgrim&#39;s name aloud.</li>

        <li>Speak the inscribed vow.</li>

        <li>Observe a brief moment of silence (a few seconds of focused intent).</li>

        </ol>

        <p>When accepted, the pedestal warms perceptibly under its grime. Any party member can perform the prayer at any
        pedestal; the four prayers can be spread across the party. The same character can perform all four. There is no
        skill check required — only the doing.</p>

        <p><strong>Vow-to-level mapping</strong> (release deepens as the pilgrim ascends):</p>

        <table>

        <thead>

        <tr>

        <th>Level</th>

        <th>Vow</th>

        <th>Theme</th>

        </tr>

        </thead>

        <tbody><tr>

        <td>1</td>

        <td><em lang="ja-Latn">I come without weapons of pride.</em></td>

        <td>Ego</td>

        </tr>

        <tr>

        <td>2</td>

        <td><em lang="ja-Latn">I come without burdens of the dead.</em></td>

        <td>Grief</td>

        </tr>

        <tr>

        <td>3</td>

        <td><em lang="ja-Latn">I come without doubt of the path.</em></td>

        <td>Faith</td>

        </tr>

        <tr>

        <td>4</td>

        <td><em lang="ja-Latn">I come without claim upon the dragon.</em></td>

        <td>Expectation</td>

        </tr>

        </tbody></table>

        <p><strong>Suggested pilgrim inscriptions</strong> (placeholders — DM may swap):</p>

        <table>

        <thead>

        <tr>

        <th>Level</th>

        <th>Name</th>

        <th>Year</th>

        <th>Note</th>

        </tr>

        </thead>

        <tbody><tr>

        <td>1</td>

        <td>Saitō Hagumi</td>

        <td>13062</td>

        <td>Oldest; will be lost from the path when the rite completes.</td>

        </tr>

        <tr>

        <td>2</td>

        <td>Tachibana Riku</td>

        <td>13074</td>

        <td></td>

        </tr>

        <tr>

        <td>3</td>

        <td>Mishima Aiko</td>

        <td>13083</td>

        <td></td>

        </tr>

        <tr>

        <td>4</td>

        <td>Ono Kazue</td>

        <td>13087</td>

        <td>Newest; the last to complete the rite before the temple fell.</td>

        </tr>

        </tbody></table>

        <h3 id="kg-3-the-threshold-head-order-of-ascent-culminating"
        data-section="3-the-threshold-head-order-of-ascent-culminating">3. The Threshold Head + Order of Ascent
        (culminating)</h3>

        <p>The eighth dragon-head, on Level 1, is <strong>visibly different</strong>:</p>

        <ul>

        <li>Smaller than the seven Watchers (~2/3 scale)</li>

        <li>Faces up the path, the way the climb goes, not outward over the drop</li>

        <li>Mouth open (Watchers&#39; mouths are closed)</li>

        <li>Ringed by a faded text-circle on the ground at its base — partially-readable carved characters</li>

        </ul>

        <p>The Threshold Head <strong>does not kindle when passed</strong>. It awaits speech. It lights only when:</p>

        <ul>

        <li>All seven Watchers are already lit, <strong>and</strong></li>

        <li>All four pedestal-prayers have been completed, <strong>and</strong></li>

        <li>The <strong>Order of Ascent</strong> — a short clan-priest&#39;s ritual text — has been proclaimed aloud
        before it.</li>

        </ul>

        <p>When the Threshold Head kindles, the rite is complete. The Sleeping Dragon on Level 2 stirs, the centuries of
        accumulated debris slough off into the basin in slow almost-silent collapse, the gold beneath is revealed, the
        amber eyes open, the head lifts. The roadside shrine behind it wakes with the path.</p>

        <h2 id="kg-the-order-of-ascent-how-the-party-finds-it"
        data-section="the-order-of-ascent-how-the-party-finds-it">The Order of Ascent — How the Party Finds It</h2>

        <p>Two paths, either sufficient:</p>

        <p><strong>Path A — Knowledge.</strong> Two consecutive checks, made on the Sandō itself:</p>

        <ol>

        <li><strong>Recognize the path.</strong> Religion or History DC 12 — recognise the Sandō as a Kinryu
        pilgrim-path with a known historical rite. Any class can attempt.</li>

        <li><strong>Recall the rite.</strong> Religion DC 18 — recall the actual text of the Order of Ascent. Strong fit
        for monk training; Sun Wukong is the natural candidate (monastic instruction in the celestial offices). Possible
        also for a Religion-proficient character with strong INT/WIS.</li>

        </ol>

        <p>The text itself can be improvised by the player or DM. Suggested structure: a brief invocation (three lines),
        a naming of the dragon (one line), an acknowledgement of the path (one line), a final petition (one line). The
        character speaks it aloud at the Threshold Head.</p>

        <p><strong>Path B — Found Item.</strong> The <em lang="ja-Latn">Pilgrim&#39;s Office of Ōryūzan</em> exists as
        an item inside the temple. <strong>Item slug TBD; suggested location: the Scriptorium</strong> (Floor 1) — a
        small folded silk codex among the surviving clan-priest texts. If the party finds it before leaving the temple
        and returns to the Sandō, the text can simply be read.</p>

        <p>Note that Path B requires the party to either (a) engage the puzzle before entering and then re-engage after
        exiting, or (b) realise after exiting that the gate to Hiroba is on the path and choose to descend partway. Path
        A is the path of least resistance and the more likely actual route.</p>

        <h2 id="kg-the-cascade-living-memory" data-section="the-cascade-living-memory">The Cascade — Living Memory</h2>

        <p>When the rite completes, the path <em lang="ja-Latn">remembers</em>:</p>

        <ul>

        <li>The party&#39;s name (or chosen designation) and the current year are inscribed at the top pedestal
        (L4).</li>

        <li>The existing names cascade down: <em lang="ja-Latn">Ono Kazue · 13087</em> → L3 · <em lang="ja-Latn">Mishima
        Aiko · 13083</em> → L2 · <em lang="ja-Latn">Tachibana Riku · 13074</em> → L1.</li>

        <li>The oldest name, <em lang="ja-Latn">Saitō Hagumi · 13062</em>, fades from the L1 stone as if absorbed back
        into it.</li>

        </ul>

        <p>Narrate this. The cascade is a real reward, not flavour.</p>

        <h2 id="kg-the-hiroba-gate-locked-option-1-dust-cloaked-twi"
        data-section="the-hiroba-gate-locked-option-1-dust-cloaked-twi">The Hiroba Gate (locked — Option 1, Dust-Cloaked
        Twin)</h2>

        <p>The broad chamber (Grand Hall — Hiroba) inside the temple is gated on the Sandō&#39;s awakening via the
        <strong>dust-cloaked twin</strong> mechanism: the Grand Hall&#39;s great statue is itself lichen-buried,
        <strong>wings folded tight</strong>, exactly as the Sandō Sleeping Dragon is. The Hall&#39;s pools are dry and
        its statue radiates no warmth. The torches still burn (foundational magic; sconces are continuous with the
        path), but the warm life of the chamber is absent.</p>

        <p>When the Sandō rite completes, <strong>both statues wake together</strong>. On the Sandō, the Sleeping
        Dragon&#39;s wings unfurl outward and the debris falls into the basin. Inside the Hall, simultaneously, the
        great statue&#39;s two-hundred-and-fifty-foot wings unfold outward across the chamber, the centuries of
        accumulated grime slide off in slow almost-silent sheets, the amber eyes open, the pools fill from beneath, and
        the warmth resumes. The Hiroba and the Sandō are one breath; what is restored to one is restored to the
        other.</p>

        <p><strong>Retrofit notes for <code>rm-grand-hall</code>:</strong> add a <em lang="ja-Latn">pre-rite state</em>
        layer to the room — the statue is dust-cloaked with wings folded, pools dry, no warmth. The existing room
        descriptions (warm gold, clear pools, amber eyes meeting Ko&#39;jiri, the cold-mitigation warmth radius) all
        apply <strong>after the Sandō rite completes</strong>. Many of the floor-1 discoveries that depend on the active
        state (statue warmth, pool charges, etc.) only become available post-rite. The
        @UUID[Compendium.kagekuni-assistant.monsters.Actor.ktiauQE10JXYuTV6]{Kageban} remain present in either
        state.</p>

        <h2 id="kg-the-shrine-reward-a-roadside-shrine" data-section="the-shrine-reward-a-roadside-shrine">The Shrine
        Reward — A Roadside Shrine</h2>

        <p>Behind and beneath the basin, set into the living rock, stands a small <strong>roadside shrine</strong> —
        <code>michibata no jinja</code> (路傍の祠). It is present from the party&#39;s first arrival on the second terrace —
        no panel conceals it — but cold and dormant until the rite completes. A single offering platform of cut stone, a
        shallow basin for incense or rice, and a small carved relief of Kinryu in flight above the platform. When the
        rite wakes it, the shrine is still <em lang="ja-Latn">modest</em> — the path is freshly re-awakened and its
        hospitality is humble.</p>

        <p><strong>Canon precedent.</strong> Roadside shrines that grant boons are established in Kagekuni canon. The
        exemplar is <strong>Kodan no Jinja</strong> in
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.eAI9SnbW1RmsWOGw]{Hana}
        province (see <code>core-cg-hana</code>): grants divine boons to supplicants for a period of days equal to three
        times the recipient&#39;s experience level (max 60 days), one boon at a time. The Tenkū Sandō shrine follows the
        same canonical mechanic.</p>

        <p><strong>Mechanic (Sandō shrine).</strong></p>

        <ul>

        <li>A creature may pray at the shrine — a brief act of supplication, a coin or modest offering, a moment of
        silence. One prayer per visit per creature.</li>

        <li>The prayer grants a <strong>minor boon for a period of days equal to 3 × the recipient&#39;s character level
        (maximum 60 days)</strong>. Boons are first-circle in scope — the same family of spell as the lower entries of
        the Grand Hall blessing table (e.g. Aid, Bless, Longstrider, Enhance Ability of one chosen ability, Shield of
        Faith). DM rolls or chooses; if random, use the Grand Hall blessing table rows 1-9 only (no death-ward, no
        resistance, no advantage-on-saves entries — those are reserved for the temple&#39;s full restored state).</li>

        <li><strong>One active boon per creature at a time.</strong> Re-praying before the existing boon expires
        refreshes the duration but does not stack effects, and may not switch to a different boon — the path remembers
        what it gave you.</li>

        <li>The shrine recharges per creature per 24 hours: a creature who has used their prayer may not pray again at
        this shrine for one full day.</li>

        </ul>

        <p>The shrine is the path&#39;s first gift to the pilgrims who woke it. It is small. It is real.</p>

        <h2 id="kg-tone-amp-failure" data-section="tone-amp-failure">Tone &amp; Failure</h2>

        <p>The puzzle is <em lang="ja-Latn">quiet</em>. Not a trap. Not timed. No failure mode — incorrect attempts
        simply do nothing. The rite is the path&#39;s way of recognising that someone has come who can wake it; the path
        is patient.</p>

        <h2 id="kg-connected-entries" data-section="connected-entries">Connected Entries</h2>

        <ul>

        <li><code>loc-tenkuji-temple</code> — the gold doors lie beyond the head of the Sandō; the Grand Hall (Hiroba)
        inside is gated on this rite.</li>

        <li><code>rm-grand-hall</code> — the great statue is the twin of the Sandō&#39;s Sleeping Dragon; both share the
        same dust-cloak mechanism if the recommended Hiroba gate is adopted.</li>

        <li><em lang="ja-Latn">Pilgrim&#39;s Office of Ōryūzan</em> — new item TBD, suggested home: temple
        Scriptorium.</li>

        </ul>

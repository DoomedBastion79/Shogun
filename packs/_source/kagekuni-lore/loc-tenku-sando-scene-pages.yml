        <h2 id="kg-venture-nagatsuki-1-16744" data-section="venture-nagatsuki-1-16744">Venture — Nagatsuki 1, 16744</h2>

        <div class="fvtt quest" data-callout-type="time">

        <article>

        <header><h4 id="kg-weather" data-section="weather">Weather</h4></header>

        <p>Progressive — flurries on leaving the village, thickening through the climb, a full blizzard by the Mountain
        Path. Vision capped at 60 ft (limits region); drop to 30 ft at the crest for the menace beat. Drifts make the
        terraces difficult terrain.</p>


        </article>

        </div>




        <ul>

        <li><strong>Cold-exhaustion clock</strong> — extreme cold (DMG): CON save DC 10 each hour without cold-weather
        gear.
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.zlOMnoUeA7gPFEl1]{Yasutake
        Mai} and the infant are the non-combat pressure point.</li>

        <li><strong>Nagaji ambush</strong> — primed at L3; the 60 ft veil lets them close unseen.</li>

        <li>The Sandō puzzle itself is weather-agnostic, but hold the Sleeping Dragon reveal — it lands hardest against
        a whiteout backdrop.</li>

        </ul>

        <h3 id="kg-cold-amp-blizzard-gm-rules" data-section="cold-amp-blizzard-gm-rules">Cold &amp; Blizzard — GM
        Rules</h3>

        <p><strong>Extreme cold.</strong> Any creature exposed to the blizzard makes a DC 10 Constitution save at the
        end of each hour or gains one level of <em lang="ja-Latn">exhaustion</em>. Cold-weather gear, cold
        resistance/immunity, or natural adaptation grants automatic success. The party has no winter gear — this clock
        is running from the moment they leave the village.</p>

        <p><strong>Yasutake Mai &amp; the infant.</strong> Mai is a civilian and the infant cannot save for itself;
        treat the child as failing each hour unless actively sheltered (wrapped, shared body-warmth, a fire in cover).
        This is the session&#39;s quiet pressure — not a kill timer, but a reason to keep moving and to <em
        lang="ja-Latn">want</em> the gold doors.</p>

        <p><strong>Vision.</strong> Sight is capped at 60 ft by the limits region (drop to 30 ft at the crest if you
        take the menace beat). Beyond the cap the storm is effectively heavily obscured — a creature there is unseen.
        Within the cap, blowing snow gives disadvantage on Wisdom (Perception) checks relying on sight at any
        distance.</p>

        <p><strong>Wind &amp; terrain.</strong> Strong wind: disadvantage on ranged weapon attacks and on Perception
        checks relying on hearing; open flames are extinguished. The snow-drifted terraces are difficult terrain.</p>

        <p><strong>Cold-blooded Nagaji (suggested ruling).</strong> The Nagaji are reptilian, and the blizzard works
        against them. While exposed in extreme cold, a Nagaji moves at half speed and attacks at disadvantage until it
        takes fire damage or reaches shelter/warmth. This is the mechanical heart of &quot;epic but low-risk&quot; — the
        storm the party fears is the storm that hands them the path, and a fire-casting PC (Ko&#39;jiri) shifts the math
        instantly. Drop the ruling if you would rather keep the Nagaji at full strength.</p>

    text:
      format: 1
      content: >-
        <section id="sec-loc-tenku-sando--watcher-head-delivery" class="secret kg-secret-sealed kg-dm-delivery
        kg-delivery" data-kind="dm-note" data-dmrole="delivery" data-loc="loc-tenku-sando" data-scene="watcher-head">

        <p><strong>Delivery</strong></p>

        <p>Solemn and unhurried. Read the first sentence slowly — give the scale a beat to land. Pick up a little for
        the second sentence (the weathering detail), then slow again for the glow. On the final sentence, drop almost to
        a murmur. The head is glad; let that land as quiet, not dramatic.</p>


        </section>




        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-a-watcher-head" data-section="a-watcher-head">A Watcher Head</h4></header>

        <p>The head juts from a squared stone base set against the inner cliff — a dragon&#39;s head, half again the
        height of a tall man, carved jaw to crown from a single block. It faces outward, away from the mountain, over
        the long drop and the pass below, as though it has spent every one of its years watching the road for someone
        climbing up.</p>

        <p>Time has been strange to it. Lichen the colour of rust and old slate furs the scales; dirt has settled into
        every carved hollow; the features are softened almost to suggestion. And yet the stone beneath the grime is not
        cracked, not pitted, not crumbling the way the path&#39;s tiles crack and crumble around it. It has weathered
        without truly wearing.</p>

        <p>And then, as you draw near, it does a thing no weathered stone should do. A soft warmth wakes somewhere deep
        inside the head — not a light to read a page by, but a glow, low and golden, rising in the seams between the
        scales like a coal remembering that it was once a fire. It holds steady while you are close. It asks nothing of
        you. It simply seems, in some way you could not quite defend aloud, glad.</p>


        </article>

        </div>




        <section id="sec-loc-tenku-sando--watcher-head-surface-integrity" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="watcher-head">

        <p><strong>The Surface Beneath the Grime</strong></p>

        <p><strong>Investigation DC 13</strong> (or a tap, a scrape, a careful look): the moss on this head is
        shallow-rooted — far more so than the moss on the stone tiles around it. The surface beneath is too smooth, too
        uniform. When tapped, it rings with a tone slightly wrong for limestone or granite. Something other than stone
        lies under the millennia of accumulation. A character who succeeds does not yet know <em
        lang="ja-Latn">what</em> — only that this is not ordinary rock.</p>


        </section>


        <section id="sec-loc-tenku-sando--watcher-head-kindling-condition" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="watcher-head">

        <p><strong>What the Kindling Answers To</strong></p>

        <p>The glow responds to <em lang="ja-Latn">ascending</em> — to creatures moving upward along the path. A
        character who backtracks past the head may notice the glow dims briefly; approaching again from below re-kindles
        it. The head does not respond to lateral movement or to someone standing still beside it. It is watching for the
        act of climbing, not the fact of presence.</p>


        </section>


        <section id="sec-loc-tenku-sando--watcher-head-number-and-pattern" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="watcher-head">

        <p><strong>Seven Watchers</strong></p>

        <p>Seven heads like this one stand along the Sandō — one on the lowest landing, two flanking the great basin on
        the second terrace, two on the third, two on the fourth. All face outward. All kindle for the ascent.
        <strong>Perception or Investigation DC 10</strong> to count them and map their distribution; a character who
        does notices they are uniform in size, posture, and detail — set at intervals that feel deliberate rather than
        decorative.</p>


        </section>

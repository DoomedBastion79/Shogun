      content: >-
        <section id="sec-loc-tenku-sando--nagaji-squad-l2-roster" class="secret kg-secret-sealed kg-dm-brief"
        data-kind="dm-note" data-dmrole="brief" data-loc="loc-tenku-sando" data-scene="nagaji-squad-l2">

        <p><strong>Squad</strong></p>

        <p><strong>The island terrace.</strong> 8
        @UUID[Compendium.kagekuni-assistant.monsters.Actor.0U3ovqWCecMOrh9C]{Nagaji Ashigaru} and 2
        @UUID[Compendium.kagekuni-assistant.monsters.Actor.vWu3fJlU8NZsRRGM]{Nagaji Sōhei}. Level 2 is cut so the first
        level wraps it on three sides — anyone on it is overlooked from below and behind. The Nagaji use that: Ashigaru
        spread along the rims, the two Sōhei holding the centre near the Sleeping Dragon basin.</p>

        <p>The basin&#39;s lee is the only true windbreak on the path; that is why this squad is the most settled and
        most alert of the lower three.</p>


        </section>


        <section id="sec-loc-tenku-sando--nagaji-squad-l2-tactics" class="secret kg-secret-sealed kg-dm-encounter"
        data-kind="dm-note" data-dmrole="encounter" data-loc="loc-tenku-sando" data-scene="nagaji-squad-l2">

        <p><strong>Running the Fight</strong></p>

        <p><strong>Epic staging, still low-risk.</strong> The three-sided overlook makes this <em
        lang="ja-Latn">look</em> like an ambush kill-zone — Ashigaru above and around the party, snow howling between.
        It plays safe because the Ashigaru are Ashigaru: spread thin across the rims, they arrive a few at a time and
        fold a few at a time. The two Sōhei are the fight.</p>

        <ul>

        <li>Let the party feel surrounded, then let them collapse one rim and watch the encirclement come apart.</li>

        <li>The Sleeping Dragon basin is the warm-ish spot — both sides want it. A party that seizes the basin gets the
        windbreak; under the cold-blooded ruling, Nagaji driven into the open lose speed and accuracy.</li>

        <li>The Sandō puzzle is untouched by the fight — the basin and the dragon take no damage short of deliberate
        vandalism.</li>

        </ul>


        </section>

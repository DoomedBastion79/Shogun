        <section id="sec-loc-tenku-sando--nagaji-squad-l1-roster" class="secret kg-secret-sealed kg-dm-brief"
        data-kind="dm-note" data-dmrole="brief" data-loc="loc-tenku-sando" data-scene="nagaji-squad-l1">

        <p><strong>Squad</strong></p>

        <p><strong>The Lower Landing watch.</strong> 6
        @UUID[Compendium.kagekuni-assistant.monsters.Actor.0U3ovqWCecMOrh9C]{Nagaji Ashigaru} and 1
        @UUID[Compendium.kagekuni-assistant.monsters.Actor.vWu3fJlU8NZsRRGM]{Nagaji Sōhei} (the squad leader). They hold
        the first terrace as a roving picket, not a prepared defense — they did not expect anyone to climb in this
        weather and are hunkered in the lee of the inner cliff, stiff and miserable with cold.</p>

        <p>This is first contact and the lightest squad. It sets the tone: the path is held, but the holders are not
        ready.</p>


        </section>


        <section id="sec-loc-tenku-sando--nagaji-squad-l1-tactics" class="secret kg-secret-sealed kg-dm-encounter"
        data-kind="dm-note" data-dmrole="encounter" data-loc="loc-tenku-sando" data-scene="nagaji-squad-l1">

        <p><strong>Running the Fight</strong></p>

        <p><strong>Run it as a tide that breaks.</strong> The Ashigaru (9 HP, AC 13) drop to almost any solid hit — a
        wave that looks frightening and then simply isn&#39;t. The Sōhei is the only real fight on this level; let it
        rally the line and then go down hard.</p>

        <ul>

        <li>The 60 ft whiteout means the squad looms out of the snow rather than being spotted at range — the party may
        take a surprise round, be surprised, or slip past entirely on a contested Stealth check (the storm cuts both
        ways).</li>

        <li>Snow-drift terraces are difficult terrain for everyone.</li>

        <li><strong>Cold-blooded ruling (if used):</strong> these Nagaji are half-speed and attack at disadvantage until
        warmed — the party should feel the storm fighting <em lang="ja-Latn">for</em> them here.</li>

        <li>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.zlOMnoUeA7gPFEl1]{Yasutake
        Mai} and the child are non-combatants; the party must screen them. That is the tension, not the Ashigaru.</li>

        </ul>


        </section>

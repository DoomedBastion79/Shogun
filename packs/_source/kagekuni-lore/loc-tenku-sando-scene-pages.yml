  - _id: uFkD62p24VyZid6x
    _key: '!journal.pages!pOY59ySukjVhZJkf.uFkD62p24VyZid6x'
    name: 関龍頭 Kanryūtō — The Threshold Head
    type: text
    title:
      show: false
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <section id="sec-loc-tenku-sando--threshold-head-delivery" class="secret kg-secret-sealed kg-dm-delivery
        kg-delivery" data-kind="dm-note" data-dmrole="delivery" data-loc="loc-tenku-sando" data-scene="threshold-head">

        <p><strong>Delivery</strong></p>

        <p>Set a slower, quieter pace — almost conspiratorial. The party has just spent the whole ascent watching heads
        kindle warmly as they passed; lean into the contrast. Read the first three sentences steadily, then pause a full
        beat before the last sentence. Let the silence do the work.</p>


        </section>




        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-kanryt-the-threshold-head" data-section="kanryt-the-threshold-head">関龍頭 Kanryūtō — The
        Threshold Head</h4></header>

        <p>At the base of the Lower Landing, set into the cliff like every head above it, one dragon-head faces the
        wrong way. Where the others look outward over the drop, this one turns up the path — smaller than they are, the
        carving finer, the grime of centuries sitting thin over detail that took time. Its mouth is open: not the closed
        jaw of the heads above, but parted and still, the way a mouth is held in the half-second before speech. Around
        its base runs a wide ring of characters carved into the rock; most are worn to almost nothing, but a few remain
        legible if you crouch into the wind. Below it, a small shrine has been cut into the same stone — a niche, an
        offering-shelf, a shallow basin that holds nothing now but grit.</p>


        </article>

        </div>




        <section id="sec-loc-tenku-sando--threshold-head-ritual-text-gate" class="secret kg-secret-sealed
        kg-dm-mechanics" data-kind="dm-note" data-dmrole="mechanics" data-loc="loc-tenku-sando"
        data-scene="threshold-head">

        <p><strong>Gate — The Text-Circle</strong></p>

        <p>Religion DC 14 — a character who crouches to study the carved text-circle. On a success, reveal <em
        lang="ja-Latn">The Text-Circle</em>.</p>


        </section>


        <section id="sec-loc-tenku-sando--threshold-head-ritual-text" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="threshold-head">

        <p><strong>The Text-Circle</strong></p>

        <p>The surviving fragments of the carved ring are pieces of a formal ritual text — a <em
        lang="ja-Latn">clan-priest&#39;s office</em>, the kind spoken aloud as a rite of threshold. The inscription was
        not carved for reading; it was carved so that someone with the knowledge would know <em lang="ja-Latn">what to
        say</em>.</p>


        </section>


        <section id="sec-loc-tenku-sando--threshold-head-keyed-to-speech-gate" class="secret kg-secret-sealed
        kg-dm-mechanics" data-kind="dm-note" data-dmrole="mechanics" data-loc="loc-tenku-sando"
        data-scene="threshold-head">

        <p><strong>Gate — What It Waits For</strong></p>

        <p>Plain observation, or Investigation DC 12 — for a character who notes that the head stays cold where the
        Watchers warmed. On a success, reveal <em lang="ja-Latn">What It Waits For</em>.</p>


        </section>


        <section id="sec-loc-tenku-sando--threshold-head-keyed-to-speech" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="threshold-head">

        <p><strong>What It Waits For</strong></p>

        <p>Walking near the head does nothing — the warmth that rose in the Watcher Heads never comes. This head is not
        inert, and it is not broken. It is waiting for something the other heads are not: the seven Watchers woke for
        the act of climbing; this one is waiting for a <em lang="ja-Latn">voice</em>.</p>


        </section>


        <section id="sec-loc-tenku-sando--threshold-head-gold-beneath-gate" class="secret kg-secret-sealed
        kg-dm-mechanics" data-kind="dm-note" data-dmrole="mechanics" data-loc="loc-tenku-sando"
        data-scene="threshold-head">

        <p><strong>Gate — Beneath the Stone</strong></p>

        <p>Investigation DC 14 — a character who examines the surface closely, a palm pressed to it or a knuckle tapped
        against the scales. On a success, reveal <em lang="ja-Latn">Beneath the Stone</em>.</p>


        </section>


        <section id="sec-loc-tenku-sando--threshold-head-gold-beneath" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="threshold-head">

        <p><strong>Beneath the Stone</strong></p>

        <p>Something is wrong with the stone. The moss is shallow-rooted, the surface beneath too smooth and too
        uniform, and the material rings differently when struck — a low, dense resonance, not the dull knock of
        weathered rock. Whatever this is made of, it is not what it appears to be.</p>


        </section>


        <section id="sec-loc-tenku-sando--threshold-head-order-of-ascent-knowledge-gate" class="secret kg-secret-sealed
        kg-dm-mechanics" data-kind="dm-note" data-dmrole="mechanics" data-loc="loc-tenku-sando"
        data-scene="threshold-head">

        <p><strong>Gate — The Order of Ascent</strong></p>

        <p>Religion DC 18, or monk training in a celestial order — and only for a character who has already recognised
        the Sandō as a Kinryu pilgrim-path. On a success, reveal <em lang="ja-Latn">The Order of Ascent</em>.</p>


        </section>


        <section id="sec-loc-tenku-sando--threshold-head-order-of-ascent-knowledge" class="secret
        kg-secret-discoverable" data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="threshold-head">

        <p><strong>The Order of Ascent</strong></p>

        <p>A character with sufficient sacred learning may recall the actual text of the <em lang="ja-Latn">Order of
        Ascent</em> — the short ritual proclamation a clan-priest would speak before the Threshold Head to complete the
        rite of the path. No written copy is needed; the words surface from memory, the way a prayer surfaces when you
        are standing in the right place.</p>


        </section>


        <section id="sec-loc-tenku-sando--threshold-head-watcher-contrast" class="secret revealed kg-secret-discoverable
        kg-related" data-kind="related" data-loc="loc-tenku-sando" data-scene="threshold-head">

        <p><strong>The Watcher Heads</strong></p>

        <p>The seven Watcher Heads set along the path all share the same form: large, mouths closed, facing outward over
        the drop. Each kindles with a low golden warmth when a climbing creature passes — no word or gesture required;
        the act of ascending the path is enough. The Threshold Head is carved into the same cliff, but shares nothing
        else: smaller, finer, mouth open, turned to face up the climb — and cold to every footstep.</p>


        </section>


        <section id="sec-loc-tenku-sando--threshold-head-threshold-shrine" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="threshold-head">

        <p><strong>The Shrine Below the Head</strong></p>

        <p>Cut into the rock directly below the Threshold Head is a small shrine — a niche of dressed stone, an
        offering-shelf worn smooth, a shallow basin for incense, all of it cold and grit-filled. This is the threshold
        shrine: where a pilgrim laid a last offering at the end of the climb, before going on to the temple. It is
        distinct from the roadside shrine up on Level 2 — that one served travellers passing through; this one marks the
        <em lang="ja-Latn">end</em> of the rite. Like the head above it, it is present, whole, and long dormant; when
        the rite of the path completes, it wakes with the rest.</p>


        </section>


        <section id="sec-loc-tenku-sando--threshold-head-threshold-cache-contents" class="secret kg-secret-sealed
        kg-dm-mechanics" data-kind="dm-note" data-dmrole="mechanics" data-loc="loc-tenku-sando"
        data-scene="threshold-head">

        <p><strong>Threshold Cache — Contents</strong></p>

        <p>One cache, a cut above the Watchers&#39;. A single modest-but-good item — a well-made fire-charm, a vial of
        blessed water, a quality wool over-robe sized for an adult, or a <em lang="ja-Latn">potion of healing</em> —
        DM&#39;s pick, scaled to what the party needs walking into the temple. The same custom applies: freely taken,
        but the devout expect need, not greed.</p>


        </section>


        <section id="sec-loc-tenku-sando--threshold-head-threshold-cache" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="threshold-head">

        <p><strong>The Threshold Cache</strong></p>

        <p>The Threshold Head, set into the Lower Landing, has its niche too — set in the threshold shrine cut into the
        rock below it, and this one is kept. Where the Watchers&#39; caches are travellers&#39; leavings, the cache at
        the Threshold is the last gift of each completed pilgrimage: the finest small thing the departing pilgrim could
        spare, set down at the very end of the climb for whoever comes next. It is never large. It is always the best
        they had.</p>


        </section>

        <section id="sec-loc-tenku-sando--nagaji-squad-l4-roster" class="secret kg-secret-sealed kg-dm-brief"
        data-kind="dm-note" data-dmrole="brief" data-loc="loc-tenku-sando" data-scene="nagaji-squad-l4">

        <p><strong>Squad</strong></p>

        <p><strong>Upper terrace.</strong> 8 @UUID[Compendium.kagekuni-assistant.monsters.Actor.0U3ovqWCecMOrh9C]{Nagaji
        Ashigaru}, 1 @UUID[Compendium.kagekuni-assistant.monsters.Actor.d1fY2hMfDH5AEG01]{Nagaji Bushi}, and 1
        @UUID[Compendium.kagekuni-assistant.monsters.Actor.OGA1LtjRQuabbHHR]{Nagaji Kannushi} — a priest. The Kannushi
        does not fight the front line; it stands back among the Ashigaru, mending the Bushi and the line, turning a
        clean fight into a grind if it is left alone.</p>

        <p>This is the last climbing squad before the top of the path. They know it, and they have set themselves to
        hold.</p>


        </section>


        <section id="sec-loc-tenku-sando--nagaji-squad-l4-tactics" class="secret kg-secret-sealed kg-dm-encounter"
        data-kind="dm-note" data-dmrole="encounter" data-loc="loc-tenku-sando" data-scene="nagaji-squad-l4">

        <p><strong>Running the Fight</strong></p>

        <p><strong>Two problems, one priority.</strong> The Bushi is the damage; the Kannushi is the <em
        lang="ja-Latn">clock</em>. Left alone, the Kannushi&#39;s healing keeps the Bushi and the Ashigaru standing well
        past their natural lifespan and the fight drags. The encounter teaches threat assessment — the squishy one at
        the back is the one to reach.</p>

        <ul>

        <li>Ashigaru screen the Kannushi exactly as the L3 squad screened the Bushi; a party that has learned to clear
        the screen does fine.</li>

        <li>A mobile PC (Sun Wukong) breaking through to the Kannushi cracks the encounter open — reward it.</li>

        <li>If the party is bruised from L1–L3, soften this: fewer Ashigaru, or let the Kannushi spend its turns healing
        rather than attacking. The intent is a triumphant push to the doors, not a wall.</li>

        </ul>


        </section>

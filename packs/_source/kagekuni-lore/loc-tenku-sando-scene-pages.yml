      content: >-
        <section id="sec-loc-tenku-sando--sleeping-dragon-delivery" class="secret kg-secret-sealed kg-dm-delivery
        kg-delivery" data-kind="dm-note" data-dmrole="delivery" data-loc="loc-tenku-sando" data-scene="sleeping-dragon">

        <p><strong>Delivery</strong></p>

        <p>Solemn, unhurried pace — let each sentence settle before the next. When you reach the final sentence, slow
        down further and drop your voice; the stillness is the point. Do not explain what the shape is; let the players
        arrive at it themselves.</p>


        </section>




        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-gary-the-sleeping-dragon" data-section="gary-the-sleeping-dragon">臥龍 Garyū — The Sleeping
        Dragon</h4></header>

        <p>The second terrace opens against a deep recess in the cliff, and at its heart sits a basin carved from the
        living rock — wide enough to swallow the landing&#39;s center, rimmed in stone that comes to your waist.</p>

        <p>Filling it is a shape so thoroughly buried you nearly take it for a knuckle of old rock: coiled around itself
        in long deliberate loops, every surface carpeted in lichen the color of rust and old slate, rooted growth
        shouldered into every seam, dirt packed dark into every hollow. The cold here carries the smell of wet stone and
        slow damp growth — a smell the mountain has been pressing down for a very long time. Somewhere under the
        overgrowth a small clod of earth breaks loose and drops without sound into the lower coils.</p>

        <p>Two long parallel ridges run the length of the buried shape&#39;s back, each one grown over with the same
        rooted tangle, each folding under at the far end. You could close a hand around either ridge and feel the growth
        give slightly under your grip.</p>


        </article>

        </div>




        <section id="sec-loc-tenku-sando--sleeping-dragon-not-stone-gate" class="secret kg-secret-sealed
        kg-dm-mechanics" data-kind="dm-note" data-dmrole="mechanics" data-loc="loc-tenku-sando"
        data-scene="sleeping-dragon">

        <p><strong>Gate — The Surface Is Not Stone</strong></p>

        <p>Investigation DC 13 — a character who examines the buried surface closely. On a success, reveal <em
        lang="ja-Latn">The Surface Is Not Stone</em>.</p>


        </section>


        <section id="sec-loc-tenku-sando--sleeping-dragon-not-stone" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="sleeping-dragon">

        <p><strong>The Surface Is Not Stone</strong></p>

        <p>The moss and lichen are shallowly rooted — no deeper purchase than a season&#39;s growth, despite the
        apparent centuries. The surface beneath is too smooth, too uniform, and when tapped it does not ring the way
        stone rings. What it is, is not yet clear — only that it is not what it appears to be.</p>


        </section>


        <section id="sec-loc-tenku-sando--sleeping-dragon-sei-sensitivity" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="sleeping-dragon">

        <p><strong>Something a Sei-Sensitive Character Feels</strong></p>

        <p>A Dragonborn PC or a character attuned to sei (such as Relc or Ko&#39;jiri) can sense that the basin is not
        inert. There is a working device here — something that has not been called in a very long time — and it is not
        dead. It is only waiting. The character cannot yet determine what shape that waiting has taken.</p>


        </section>


        <section id="sec-loc-tenku-sando--sleeping-dragon-nagaji-absence-gate" class="secret kg-secret-sealed
        kg-dm-mechanics" data-kind="dm-note" data-dmrole="mechanics" data-loc="loc-tenku-sando"
        data-scene="sleeping-dragon">

        <p><strong>Gate — The Nagaji Avoid This Landing</strong></p>

        <p>Perception or Survival DC 11 — a character who reads the landing for signs of use. On a success, reveal <em
        lang="ja-Latn">The Nagaji Avoid This Landing</em>.</p>


        </section>


        <section id="sec-loc-tenku-sando--sleeping-dragon-nagaji-absence" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="sleeping-dragon">

        <p><strong>The Nagaji Avoid This Landing</strong></p>

        <p>The rest of the Sandō carries faint traces of the Nagaji&#39;s centuries of use — scuff marks, worn edges,
        the occasional dropped scale or shed fragment. This landing has none of it. Nothing has camped near the basin,
        rested against it, or passed close to it. The Nagaji walk this path regularly, and they avoid the Sleeping
        Dragon entirely.</p>


        </section>


        <section id="sec-loc-tenku-sando--sleeping-dragon-wings-folded" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="sleeping-dragon">

        <p><strong>Wings Folded Tight</strong></p>

        <p>Close examination of the buried shape reveals that the two long seams running along the back are not a trick
        of the lichen — they are folded structures. Wings. Pressed tight against the body as a sleeping bird folds its
        wings, waiting. Whatever holds them in that posture, it is not the weight of the accumulated debris. The debris
        settled around the folds; the folds came first.</p>


        </section>

      content: >-
        <section id="sec-loc-tenku-sando--pedestal-mourner-delivery" class="secret kg-secret-sealed kg-dm-delivery
        kg-delivery" data-kind="dm-note" data-dmrole="delivery" data-loc="loc-tenku-sando"
        data-scene="pedestal-mourner">

        <p><strong>Delivery</strong></p>

        <p>Quiet and deliberate. Read the vow line slowly, as if the words are still settling into the stone. Let the
        final sentence — the cold-that-is-not-quite-cold — trail off unhurried. No dramatic lift; this is a patient
        thing.</p>


        </section>




        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-the-mourner39s-pedestal" data-section="the-mourner39s-pedestal">The Mourner&#39;s
        Pedestal</h4></header>

        <p>Against the cliff wall, across the terrace from the great basin and what sleeps in it, a squared pillar of
        pale stone stands waist-high, its top surface worked flat and smooth. Two inscriptions are carved into it — one
        deep and formal, the lettering of something meant to outlast the people who cut it:</p>

        <p><em lang="ja-Latn">&quot;I come without burdens of the dead.&quot;</em></p>

        <p>Beside it, set lighter, like a signature left by a different hand:</p>

        <p><em lang="ja-Latn">&quot;Tachibana Riku · year 13074.&quot;</em></p>

        <p>The stone is cold when you touch it — but in the carved grooves, under your fingers, the cold is a
        half-degree less certain than it ought to be, as though the pedestal is not dead, only asleep, and the stone
        remembers being touched.</p>


        </article>

        </div>




        <section id="sec-loc-tenku-sando--pedestal-mourner-vow-theme-grief" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="pedestal-mourner">

        <p><strong>What the Vow Asks</strong></p>

        <p>The line cut deep — <em lang="ja-Latn">&quot;I come without burdens of the dead&quot;</em> — is the vow of
        this terrace. Its theme is the setting-down of <em lang="ja-Latn">grief</em>. Its placement here, opposite the
        great basin, is not coincidence: a pilgrim speaks these words within sight of the Sleeping Dragon, the heart of
        the whole path, as though the path itself understood what it meant to stand before something ancient and lost
        and still.</p>


        </section>


        <section id="sec-loc-tenku-sando--pedestal-mourner-prayer-form" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="pedestal-mourner">

        <p><strong>How the Pedestal Answers</strong></p>

        <p>The pedestal is not a monument — it is a station. The prayer performed here has a form: read the
        pilgrim&#39;s name aloud (<em lang="ja-Latn">Tachibana Riku</em>), speak the carved vow, and hold a brief
        silence. When the act is done truly, the pedestal warms under the hand — not heat, but the absence of cold,
        settling into the stone from within. This is the second of four such pedestals on the path.</p>


        </section>


        <section id="sec-loc-tenku-sando--pedestal-mourner-pilgrim-identity" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="pedestal-mourner">

        <p><strong>Tachibana Riku · 13074</strong></p>

        <p>The name <em lang="ja-Latn">Tachibana Riku</em> and the year 13074 are the path&#39;s record of a pilgrim who
        once climbed this road and completed its rite. Of the four names the Sandō still holds in its stone, this is the
        second-oldest — younger only than the name on the lower landing.</p>


        </section>

        <section id="sec-loc-tenku-sando--pedestal-faithful-delivery" class="secret kg-secret-sealed kg-dm-delivery
        kg-delivery" data-kind="dm-note" data-dmrole="delivery" data-loc="loc-tenku-sando"
        data-scene="pedestal-faithful">

        <p><strong>Delivery</strong></p>

        <p>Solemn and unhurried. Pause after describing the fallen stone — let the contrast land before the standing
        pillar appears. Keep your voice level and even throughout; slow only when you read the two carved lines, giving
        each its own weight.</p>


        </section>




        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-shin-no-dai-the-faithful-pedestal" data-section="shin-no-dai-the-faithful-pedestal">信の台
        Shin-no-Dai — The Faithful Pedestal</h4></header>

        <p>The middle terrace is open to the sky and the wind finds it without obstruction, pressing cold and steady
        across the pale stone. Stretches of the outer parapet have given way — frost-split blocks lie tumbled across the
        landing — but among the fallen stone, a squared pillar stands, waist-high, its top surface worked flat and
        smooth, utterly undamaged. Two lines of worn calligraphy are cut into that surface: narrow strokes, shallow from
        the wind and the years, but still there if you crouch to a low angle of grey light. Below them, centred in the
        smooth face, sits a circular indentation — a palm-width hollow, its rim worn smooth and clean against the grime
        of the flat stone around it.</p>


        </article>

        </div>




        <section id="sec-loc-tenku-sando--pedestal-faithful-prayer-mechanic" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="pedestal-faithful">

        <p><strong>The Prayer</strong></p>

        <p>The pedestal is a dormant prayer station. The rite it asks is simple: speak the inscribed pilgrim&#39;s name
        aloud, speak the vow, and hold a moment of silence. No skill check required — the doing is the thing. When the
        prayer is accepted, the pedestal warms perceptibly under the hand.</p>


        </section>


        <section id="sec-loc-tenku-sando--pedestal-faithful-vow-theme" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="pedestal-faithful">

        <p><strong>The Vow&#39;s Placement</strong></p>

        <p>The vow — <em lang="ja-Latn">&quot;I come without doubt of the path&quot;</em> — concerns faith. Its
        placement on the middle terrace is deliberate: this is where a climber is exposed, high above the pass, with the
        destination only just coming into view. The path put the faith-vow here because this is where faith might most
        naturally waver.</p>


        </section>


        <section id="sec-loc-tenku-sando--pedestal-faithful-third-pilgrim" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="pedestal-faithful">

        <p><strong>Mishima Aiko · 13083</strong></p>

        <p>The name <em lang="ja-Latn">Mishima Aiko · 13083</em> is the third of four pilgrim inscriptions the Sandō
        still carries — older than the name above, newer than the one below. The four names together are the path&#39;s
        living memory: the last four pilgrim-groups to complete its rite, held in the stone.</p>


        </section>

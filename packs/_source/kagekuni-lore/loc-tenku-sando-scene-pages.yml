      content: >-
        <section id="sec-loc-tenku-sando--roadside-shrine-delivery" class="secret kg-secret-sealed kg-dm-delivery
        kg-delivery" data-kind="dm-note" data-dmrole="delivery" data-loc="loc-tenku-sando" data-scene="roadside-shrine">

        <p><strong>Delivery</strong></p>

        <p>Read this quietly, almost offhandedly — the shrine is easy to miss. Slow down on the final sentence and let
        the silence do the work. The point is its presence without warmth: something that was meant to answer, and
        doesn&#39;t.</p>


        </section>




        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-the-roadside-shrine" data-section="the-roadside-shrine">The Roadside Shrine</h4></header>

        <p>Tucked into the living rock behind and below the great basin, easily overlooked against the cliff, is a small
        shrine. A single platform of cut stone, waist-high, its surface worn smooth: the kind of waymarker a solitary
        traveller might kneel before at any lonely crossing. A shallow basin sits at the platform&#39;s base — the kind
        meant to hold incense or a scattering of rice — and it holds neither. Only wind-sifted grit. Above the platform,
        carved in low relief into the face of the rock, a dragon spreads its wings in flight. The cold from the mountain
        comes off the stone in a slow press. You may set your hand on the platform. You may leave an offering. You may
        speak a prayer into the wind. Nothing answers.</p>


        </article>

        </div>




        <section id="sec-loc-tenku-sando--roadside-shrine-wayside-shrine-type" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="roadside-shrine">

        <p><strong>A Michibata no Jinja</strong></p>

        <p><strong>Religion DC 10 or traveler&#39;s experience with rural shrines.</strong> This is a <em
        lang="ja-Latn">michibata no jinja</em> — a roadside shrine, the kind placed at mountain passes and lonely
        crossings to shelter traveling pilgrims. A shrine of this type in active worship responds to offerings with a
        small blessing for the road ahead. This one is present, whole, and without any warmth — it has the structure of
        something that once answered, and the silence of something that has not been called in a very long time.</p>


        </section>


        <section id="sec-loc-tenku-sando--roadside-shrine-relief-subject" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="roadside-shrine">

        <p><strong>The Carved Relief — Kinryu</strong></p>

        <p><strong>Religion DC 12 or History DC 12.</strong> The dragon spread above the platform is not decorative
        convention — the wings in full ascent, the long spiral of the body — this is <em lang="ja-Latn">Kinryu</em>, the
        Golden Dragon, rendered in the iconographic style of the Kinkozan clan-priests. The same subject as the great
        sleeping shape in the basin above it. The shrine was placed here to serve pilgrims making the ascent, and it
        watches the same thing the path was made to wake.</p>


        </section>


        <section id="sec-loc-tenku-sando--roadside-shrine-dormant-state" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="roadside-shrine">

        <p><strong>The Shrine Is Waiting</strong></p>

        <p><strong>Investigation DC 13 or Religion DC 12.</strong> The shrine shows no damage, no defacement, no sign of
        deliberate sealing or abandonment. The basin is simply empty; the stone is simply cold. Whatever kept a shrine
        like this alive — the prayers of ascending pilgrims, the working of the path itself — has been absent for a very
        long time. The structure is ready. The shrine is not broken. It is waiting for something the path has forgotten
        how to receive.</p>


        </section>

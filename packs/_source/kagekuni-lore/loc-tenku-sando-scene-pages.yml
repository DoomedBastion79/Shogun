  - _id: L2XWRT8Q01A6gAFC
    _key: '!journal.pages!pOY59ySukjVhZJkf.L2XWRT8Q01A6gAFC'
    name: 守龍頭 Shuryūtō — A Watcher Head
    type: text
    title:
      show: false
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <section id="sec-loc-tenku-sando--watcher-head-delivery" class="secret kg-secret-sealed kg-dm-delivery
        kg-delivery" data-kind="dm-note" data-dmrole="delivery" data-loc="loc-tenku-sando" data-scene="watcher-head">

        <p><strong>Delivery</strong></p>

        <p>Solemn and unhurried. Read the first sentence slowly — give the scale a beat to land. Pick up a little for
        the second sentence (the weathering detail), then slow again for the glow. On the final sentence, drop almost to
        a murmur. The head is glad; let that land as quiet, not dramatic.</p>


        </section>




        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-shuryt-a-watcher-head" data-section="shuryt-a-watcher-head">守龍頭 Shuryūtō — A Watcher
        Head</h4></header>

        <p>A dragon&#39;s head juts from a squared stone base set into the inner cliff — half again the height of a tall
        man, facing outward over the long drop and the pass below, as though it has always been watching the road for
        someone climbing up. Lichen furs the carved scales in rust and old slate; years of wind and grit have softened
        the features almost to suggestion, and where the close-set eyes were, shadow pools deep in the grime. You step
        toward it, and something stirs — a warmth wakes low inside the stone, rising in the seams between the scales,
        and holds there, steady, while you remain close. Below you, wind moves through the pass, and the head watches it
        in silence.</p>


        </article>

        </div>




        <section id="sec-loc-tenku-sando--watcher-head-surface-integrity-gate" class="secret kg-secret-sealed
        kg-dm-mechanics" data-kind="dm-note" data-dmrole="mechanics" data-loc="loc-tenku-sando"
        data-scene="watcher-head">

        <p><strong>Gate — The Surface Beneath the Grime</strong></p>

        <p>Investigation DC 13 — or any deliberate physical test of the surface: a tap, a scrape, a careful look. On a
        success, reveal the discoverable below (<em lang="ja-Latn">The Surface Beneath the Grime</em>). The character
        learns only that the head is not ordinary stone — not yet <em lang="ja-Latn">what</em> it is.</p>


        </section>


        <section id="sec-loc-tenku-sando--watcher-head-surface-integrity" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="watcher-head">

        <p><strong>The Surface Beneath the Grime</strong></p>

        <p>The moss on this head is shallow-rooted — far more so than the moss on the stone tiles around it. The surface
        beneath is too smooth, too uniform, and when tapped it rings with a tone slightly wrong for limestone or
        granite. Something other than stone lies under the millennia of accumulation — though what, exactly, is not yet
        clear.</p>


        </section>


        <section id="sec-loc-tenku-sando--watcher-head-kindling-condition" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="watcher-head">

        <p><strong>What the Kindling Answers To</strong></p>

        <p>The glow responds to <em lang="ja-Latn">ascending</em> — to creatures moving upward along the path. A
        character who backtracks past the head may notice the glow dims briefly; approaching again from below re-kindles
        it. The head does not respond to lateral movement or to someone standing still beside it. It is watching for the
        act of climbing, not the fact of presence.</p>


        </section>


        <section id="sec-loc-tenku-sando--watcher-head-number-and-pattern-gate" class="secret kg-secret-sealed
        kg-dm-mechanics" data-kind="dm-note" data-dmrole="mechanics" data-loc="loc-tenku-sando"
        data-scene="watcher-head">

        <p><strong>Gate — Seven Watchers</strong></p>

        <p>Perception or Investigation DC 10 to count the heads and map their distribution along the path. On a success,
        reveal <em lang="ja-Latn">Seven Watchers</em>.</p>


        </section>


        <section id="sec-loc-tenku-sando--watcher-head-number-and-pattern" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="watcher-head">

        <p><strong>Seven Watchers</strong></p>

        <p>Seven heads like this one stand along the Sandō — one on the lowest landing, two flanking the great basin on
        the second terrace, two on the third, two on the fourth. All face outward; all kindle for the ascent. They are
        uniform in size, posture, and detail, set at intervals that feel deliberate rather than decorative.</p>


        </section>


        <section id="sec-loc-tenku-sando--watcher-head-cache-contents" class="secret kg-secret-sealed kg-dm-mechanics"
        data-kind="dm-note" data-dmrole="mechanics" data-loc="loc-tenku-sando" data-scene="watcher-head">

        <p><strong>Cache — Stocking, Safety &amp; Custom</strong></p>

        <p>Each Watcher&#39;s base carries an offering-niche. Whether a given head&#39;s niche is stocked is the
        DM&#39;s call — predetermine which heads hold a cache, or roll per head; a mix reads well. When a character
        searches a stocked niche, narrate the find and reveal its contents.</p>

        <p>For this blizzard, stock the caches cold-useful: a fire-starter kit, charcoal hand-warmers wrapped in cloth,
        strips of dried meat, a sealed gourd of strong warming spirit (advantage on the next save vs extreme cold),
        occasionally 2d10 <em lang="ja-Latn">mon</em> or a pilgrim-charm. Keep each one small — a help on the climb, not
        a haul.</p>

        <p>The caches are not hidden, trapped, or warded. If a wary party tests one before reaching in, simply confirm
        there is nothing to fear.</p>

        <p><strong>Taking is not theft.</strong> The caches are freely given; lifting one triggers nothing and is
        neither hostile nor dishonorable. But the custom is <em lang="ja-Latn">take only at need.</em> A devout NPC — a
        @UUID[Compendium.kagekuni-assistant.monsters.Actor.OGA1LtjRQuabbHHR]{Nagaji Kannushi}, later a temple figure —
        who learns the party stripped caches they did not need thinks less of them: a minor Honor knock in that
        NPC&#39;s regard, never a mechanical penalty. A party genuinely in need (and with the cold clock running, they
        are) takes with the path&#39;s blessing.</p>


        </section>


        <section id="sec-loc-tenku-sando--watcher-head-pilgrim-cache" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="watcher-head">

        <p><strong>A Pilgrim&#39;s Cache</strong></p>

        <p>At the base of the Watcher, where the carved head meets the cliff, a shallow niche has been cut into the
        stone — hand-deep, plainly shaped to hold something.</p>


        </section>


        <section id="sec-loc-tenku-sando--watcher-head-cache-custom-gate" class="secret kg-secret-sealed
        kg-dm-mechanics" data-kind="dm-note" data-dmrole="mechanics" data-loc="loc-tenku-sando"
        data-scene="watcher-head">

        <p><strong>Gate — The Pilgrim Custom</strong></p>

        <p>Religion or History DC 10 — a character may recognise the niche for the wayfarer custom it keeps. On a
        success, reveal <em lang="ja-Latn">The Pilgrim Custom</em>. Without the check, do not volunteer the custom; the
        niche reads only as an old offering-recess. (If a cache itself bears a legible inscription, a character may read
        the custom directly — DM&#39;s option.)</p>


        </section>


        <section id="sec-loc-tenku-sando--watcher-head-cache-custom" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="watcher-head">

        <p><strong>The Pilgrim Custom</strong></p>

        <p>The offering-niches keep an old custom of the pilgrim road: <em lang="ja-Latn">what you no longer need, you
        leave for the one who climbs behind you.</em> A traveller in genuine need takes freely, exactly as the custom
        intends. A traveller who takes without need has stolen nothing — but the devout would mark it as poor form.</p>


        </section>
      markdown: ''

      content: >-
        <section id="sec-loc-tenku-sando--threshold-head-delivery" class="secret kg-secret-sealed kg-dm-delivery
        kg-delivery" data-kind="dm-note" data-dmrole="delivery" data-loc="loc-tenku-sando" data-scene="threshold-head">

        <p><strong>Delivery</strong></p>

        <p>Set a slower, quieter pace — almost conspiratorial. The party has just spent the whole ascent watching heads
        kindle warmly as they passed; lean into the contrast. Read the first three sentences steadily, then pause a full
        beat before the last sentence. Let the silence do the work.</p>


        </section>




        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-the-threshold-head" data-section="the-threshold-head">The Threshold Head</h4></header>

        <p>This one stands apart — out in the open court, not set against the cliff like the others, and smaller than
        any of the heads below. It faces inward, toward the gold doors, as though it climbed the Sandō itself long ago
        and never looked back. Its mouth is open, the way a mouth opens in the half-second before speech. At its feet,
        carved into the paving stones in a wide ring, runs a band of characters — most worn past reading, a handful
        still legible at a crouch. You walk past it, and around it, and it stays cold.</p>


        </article>

        </div>




        <section id="sec-loc-tenku-sando--threshold-head-ritual-text" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="threshold-head">

        <p><strong>The Text-Circle</strong></p>

        <p><strong>Religion DC 14.</strong> A character who crouches to study the carved characters recognises the
        surviving fragments as pieces of a formal ritual text — a <em lang="ja-Latn">clan-priest&#39;s office</em>, the
        kind spoken aloud as a rite of threshold. The inscription was not carved for reading. It was carved so that
        someone with the knowledge would know <em lang="ja-Latn">what to say</em>.</p>


        </section>


        <section id="sec-loc-tenku-sando--threshold-head-keyed-to-speech" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="threshold-head">

        <p><strong>What It Waits For</strong></p>

        <p>Walking near the head does nothing — the warmth that rose in the Watcher Heads never comes. Observation or a
        DC 12 Investigation check makes the distinction explicit: this head is not inert, and it is not broken. It is
        simply waiting for something the other heads are not. The seven Watchers woke for the act of climbing. This one
        is waiting for a <em lang="ja-Latn">voice</em>.</p>


        </section>


        <section id="sec-loc-tenku-sando--threshold-head-gold-beneath" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="threshold-head">

        <p><strong>Beneath the Stone</strong></p>

        <p><strong>Investigation DC 14.</strong> A character who examines the surface closely — pressing a palm to it,
        tapping a knuckle against the scales — notices something wrong with the stone. The moss is shallow-rooted, the
        surface beneath is too smooth and too uniform, and the material rings differently when struck: a low, dense
        resonance, not the dull knock of weathered rock. Whatever this is made of, it is not what it appears to be.</p>


        </section>


        <section id="sec-loc-tenku-sando--threshold-head-order-of-ascent-knowledge" class="secret
        kg-secret-discoverable" data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="threshold-head">

        <p><strong>The Order of Ascent</strong></p>

        <p><strong>Religion DC 18 (or monk training).</strong> A character who has already recognised the Sandō as a
        Kinryu pilgrim-path — and who carries sufficient sacred learning — may recall the actual text of the <em
        lang="ja-Latn">Order of Ascent</em>, the short ritual proclamation a clan-priest would speak before the
        Threshold Head to complete the rite of the path. Monk training in a celestial order is a natural fit; strong
        Religion proficiency is also sufficient. The character need not have a written copy — the words surface from
        memory, the way a prayer surfaces when you are standing in the right place.</p>


        </section>


        <section id="sec-loc-tenku-sando--threshold-head-watcher-contrast" class="secret revealed kg-secret-discoverable
        kg-related" data-kind="related" data-loc="loc-tenku-sando" data-scene="threshold-head">

        <p><strong>The Watcher Heads</strong></p>

        <p>The seven Watcher Heads on the lower levels all share the same form: large, facing outward over the drop,
        mouths closed, set against the inner cliff. Each one kindled with a low golden warmth as the party passed — no
        word or gesture required. The act of ascending the path was enough. This head shares none of those
        responses.</p>


        </section>

        <section id="sec-loc-tenku-sando--pedestal-eldest-delivery" class="secret kg-secret-sealed kg-dm-delivery
        kg-delivery" data-kind="dm-note" data-dmrole="delivery" data-loc="loc-tenku-sando" data-scene="pedestal-eldest">

        <p><strong>Delivery</strong></p>

        <p>Solemn and unhurried — read this one slowly, with a small pause between the vow line and the name. When you
        reach the final sentence about the cold in the grooves, drop your voice just slightly and let it sit for a beat
        before moving on. The pedestal is patient; your delivery should feel the same way.</p>


        </section>




        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-man-no-dai-the-eldest-pedestal" data-section="man-no-dai-the-eldest-pedestal">慢の台 Man-no-Dai
        — The Eldest Pedestal</h4></header>

        <p>A squared pillar of pale stone stands waist-high against the inner cliff, its sides cut true and its top
        surface worked to a deliberate smoothness. Two lines of calligraphy are carved into that surface — shallow now,
        worn by weather — and reading them means crouching close and tilting your head until the light catches the
        grooves at the right angle. Beneath your palm the stone is cold and faintly gritty with the cliff&#39;s own
        dust. At the center of the surface sits a circular indentation, its edges ground smooth and its depth even —
        shaped, not worn.</p>


        </article>

        </div>




        <section id="sec-loc-tenku-sando--pedestal-eldest-vow-meaning" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="pedestal-eldest">

        <p><strong>The Vow</strong></p>

        <p>The deep-cut line — <em lang="ja-Latn">&quot;I come without weapons of pride&quot;</em> — is a
        <strong>vow</strong>, carved into the pedestal when the path was first made. It is the vow of this terrace: the
        same words for every pilgrim who has ever climbed past this stone, the same words that will be here for every
        pilgrim who climbs after. Its theme is the setting-down of <em lang="ja-Latn">ego</em> — the first thing a
        pilgrim must leave behind before the dragon will receive them.</p>


        </section>


        <section id="sec-loc-tenku-sando--pedestal-eldest-pilgrim-record" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="pedestal-eldest">

        <p><strong>The Pilgrim Name</strong></p>

        <p>The smaller inscription — <em lang="ja-Latn">Saitō Hagumi · 13062</em> — is a <strong>pilgrim
        record</strong>: the name and year of someone who once completed the full rite of this path. This pedestal is
        the lowest of four, one on each of the first four terraces. Of the four names the Sandō still carries, this one
        is the oldest.</p>


        </section>


        <section id="sec-loc-tenku-sando--pedestal-eldest-prayer-mechanic" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="pedestal-eldest">

        <p><strong>The Prayer</strong></p>

        <p>The pedestal is not merely a marker — it is an act waiting to be completed. The prayer at each pedestal is
        threefold: read the inscribed pilgrim&#39;s name aloud, speak the vow, then observe a brief moment of silence
        with focused intent. When the pedestal accepts the prayer, it warms perceptibly under the grime. Any member of
        the party may perform it. No skill check is required — only the doing.</p>


        </section>


        <section id="sec-loc-tenku-sando--pedestal-eldest-working-device-gate" class="secret kg-secret-sealed
        kg-dm-mechanics" data-kind="dm-note" data-dmrole="mechanics" data-loc="loc-tenku-sando"
        data-scene="pedestal-eldest">

        <p><strong>Gate — Not Dead Stone</strong></p>

        <p>Arcana or Religion DC 10 — a character who notices the faint warmth in the grooves and investigates it. On a
        success, reveal <em lang="ja-Latn">Not Dead Stone</em>.</p>


        </section>


        <section id="sec-loc-tenku-sando--pedestal-eldest-working-device" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="pedestal-eldest">

        <p><strong>Not Dead Stone</strong></p>

        <p>The faint warmth felt in the carved grooves is not imagination. The pedestal is a working part of the
        path&#39;s sacred mechanism — dormant, but not inert; it has simply not been called in a very long time. This is
        a ritual fixture of some kind, not a gravestone or a boundary marker — it was built to receive something from
        the person standing before it.</p>


        </section>

      content: >-
        <section id="sec-loc-tenku-sando--pedestal-topmost-delivery" class="secret kg-secret-sealed kg-dm-delivery
        kg-delivery" data-kind="dm-note" data-dmrole="delivery" data-loc="loc-tenku-sando"
        data-scene="pedestal-topmost">

        <p><strong>Delivery</strong></p>

        <p>Solemn and unhurried. The doors are already in sight — frame this as a beat of near-arrival, not urgency.
        Read the vow and the pilgrim name at carved-stone pace: formal, a touch slow. Let the final sentence land
        without comment.</p>


        </section>




        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-nozomi-no-dai-the-topmost-pedestal" data-section="nozomi-no-dai-the-topmost-pedestal">望の台
        Nozomi-no-Dai — The Topmost Pedestal</h4></header>

        <p>The last of the four squared pillars stands against the inner cliff at the back of the upper terrace —
        waist-high, worked flat across the top — with the step above visible now, close enough that the climb&#39;s end
        is a thing you can almost touch. Two lines of calligraphy are cut into the surface: the first deep and formal,
        pressed hard into stone as though meant to outlast the hand that made it; the second, set a little apart, is
        shallower — less worn than any name-line on the three pedestals below. Beside that second line the surface is
        bare, a clear unmarked space where the carved work simply ends. Draw a thumb across the top and you find
        something the eye alone misses: a circular hollow ground into the center of the stone, wider than a palm, too
        smooth and too even for weathering, plainly waiting to receive something.</p>


        </article>

        </div>




        <section id="sec-loc-tenku-sando--pedestal-topmost-waiting-space" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="pedestal-topmost">

        <p><strong>The Unmarked Space</strong></p>

        <p>The blank space beside <em lang="ja-Latn">Ono Kazue · 13087</em> is not erosion or damage. The path holds the
        memory of only its last four pilgrim-groups — one name per pedestal, newest at the top, oldest at the foot. The
        space is the path waiting for the next. The name inscribed here will belong to the group that completes the
        rite.</p>


        </section>


        <section id="sec-loc-tenku-sando--pedestal-topmost-last-pilgrim" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="pedestal-topmost">

        <p><strong>Ono Kazue — The Last</strong></p>

        <p><em lang="ja-Latn">Ono Kazue · 13087</em> is the most recent pilgrim the Sandō still carries — the last to
        complete the full rite before the temple fell silent. Year 13087 places the inscription in the final decades of
        the sei drought. After this name, no one climbed the path the way it was meant to be climbed.</p>


        </section>


        <section id="sec-loc-tenku-sando--pedestal-topmost-prayer-station" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="pedestal-topmost">

        <p><strong>Prayer at the Pedestal</strong></p>

        <p>This is a prayer station, one of four on the ascending path. The rite: read the inscribed pilgrim&#39;s name
        aloud, speak the vow, then hold a brief silence. When the prayer is accepted, the stone warms under the hand. No
        check is required — only the doing.</p>


        </section>


        <section id="sec-loc-tenku-sando--pedestal-topmost-cold-sensation" class="secret kg-secret-discoverable"
        data-kind="discoverable" data-loc="loc-tenku-sando" data-scene="pedestal-topmost">

        <p><strong>Not Quite Cold</strong></p>

        <p>A character who presses their fingers into the carved grooves finds something unsettling: the cold in those
        grooves is a fraction less sharp than the stone around them — the way a cooking stone still holds the ghost of
        warmth long after the fire is gone. The pedestal is not dead. It is waiting.</p>


        </section>

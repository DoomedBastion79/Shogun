  - _id: 7OVEgy3QUmdSh685
    _key: '!journal.pages!P63d5AJsqtwbZDmT.7OVEgy3QUmdSh685'
    name: Society of Kagekuni
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >
        <p>Kagekuni is a civilisation built on hierarchy. It is not a suggestion, not a tradition that has softened with
        time — it is the architecture of daily life, enforced by law, reinforced by custom, and internalised by nearly
        everyone who lives within it. From the moment a child is born, their place in the order is known. What they may
        do, where they may go, how they must speak to those above and below them — all of it is governed by structures
        older than most of the buildings they live in.</p>

        <p>Understanding this society is essential to moving through it. The adventurer who ignores social rank will
        find doors closed, prices raised, and patience exhausted long before any blade is drawn.</p>
      markdown: ''

  - _id: jn0POdv8pTovDjPt
    _key: '!journal.pages!P63d5AJsqtwbZDmT.jn0POdv8pTovDjPt'
    name: Clans and Factions
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >
        <p>Power in Kagekuni flows through clans. Each is a political entity unto itself — a family at its core,
        expanded over centuries into a network of vassals, retainers, allied families, and sworn samurai. A clan
        controls territory, maintains armies, administers justice within its borders, and pursues its interests through
        diplomacy, marriage, trade, and war. The daimyō who leads each clan holds authority that is, within their
        province, nearly absolute.</p>

        <p>For most of the empire&#39;s history, the clans answered to the Emperor. With the throne empty and the
        Shogunate frozen, that restraint is gone. What remains is ambition, geography, and the alliances that clans have
        forged to survive what comes next.</p>
      markdown: ''

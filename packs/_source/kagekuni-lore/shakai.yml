        <p><strong>Daimyō:</strong> Masota no Gekkō

        <strong>Race:</strong> Unknown | <strong>Age:</strong> Unknown | <strong>Province:</strong>
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.D2VV9bFa1txuKDxB]{Kaze}
        | <strong>Capital:</strong> Tsukikage</p>

        <p>Daimyō Masota no Gekkō has not been seen publicly in some time. His clan&#39;s silence has drawn attention
        from both alliances and from the other independents. Trade through Kaze province has slowed. The provincial
        administration has stopped communicating with
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.Zk6QD9Sdfud4SuRV]{Heian}. Rumours vary — illness, a power
        struggle within the clan, or something worse.</p>

        <p>Clan Gekkō historically governed Kaze with careful neutrality through successive political upheavals. Their
        sudden silence is one of the most pressing questions in Kagekuni&#39;s current politics, and both Kaminari and
        Kurohana have taken notice.</p>

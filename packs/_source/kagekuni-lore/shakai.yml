  - _id: vkVs2o6q4dK4C24W
    _key: '!journal.pages!P63d5AJsqtwbZDmT.vkVs2o6q4dK4C24W'
    name: The Three Castes
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >
        <p>Kagekuni&#39;s population is divided into three castes. Movement between them is rare, difficult, and in most
        cases functionally impossible. A person&#39;s caste determines what occupations they may hold, who they may
        marry, where they may live, and how they are treated under law.</p>
      markdown: ''

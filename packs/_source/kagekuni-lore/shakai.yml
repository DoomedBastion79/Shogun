      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <p>The merchant class occupies the lowest rung of the Zokumin caste, but their economic influence far exceeds
        their social standing. Merchant guilds operate across clan borders, moving goods, capital, and — inevitably —
        information.
        <strong>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.MS6IzANPTK3RTO60]{Kenta
        Yamada}</strong> is an active guild member.
        <strong>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.YSPRToQNBVq5NJFZ]{Ren
        Nakamura}</strong> of Clan Seishin maintains a secret alliance with a powerful guild branch in
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.8BPLYleAkYpmvX5a]{Kikyo}.</p>

        <p>The tension between merchant wealth and merchant status is one of Kagekuni&#39;s chronic fault lines. Guilds
        cannot openly challenge the social order, but their money flows where swords cannot reach.</p>



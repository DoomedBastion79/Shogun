  - _id: acJwloHGwY71dIip
    _key: '!journal.pages!P63d5AJsqtwbZDmT.acJwloHGwY71dIip'
    name: The Alliances
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >
        <p>Two years of open war have divided Hokori&#39;s major clans into opposing alliances, with three clans
        maintaining a precarious independence between them.</p>

        <table>

        <thead>

        <tr>

        <th>Alliance</th>

        <th>Member Clans</th>

        <th>Provinces</th>

        <th>Status</th>

        </tr>

        </thead>

        <tbody><tr>

        <td><strong>Genso</strong></td>

        <td>Fuyugiri, Homoruyama,
        Ryū@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.D2VV9bFa1txuKDxB]{kaze},
        Tsuchiura</td>

        <td>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.EPAWGqYCrUzYfngV]{Kusa},
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.qODDmax1GHoTx3fx]{Tsuchi}</td>

        <td>At war</td>

        </tr>

        <tr>

        <td><strong>Arashi</strong></td>

        <td>Arashiyama, Hoshizora, Shirotsuru, Yūgure</td>

        <td>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.M72zAjYRdrTCan30]{Mizu},
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.ijGHvVOlw9tFpBo8]{Nami}</td>

        <td>At war</td>

        </tr>

        <tr>

        <td><strong>Independent</strong></td>

        <td>Kaminari, Kurohana, Gekkō</td>

        <td>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.eAI9SnbW1RmsWOGw]{Hana},
        and others</td>

        <td>Neutral — for now</td>

        </tr>

        </tbody></table>

        <p>The <strong>Genso Alliance</strong> controls the verdant interior and the southern frontier. Its strength
        lies in agricultural wealth, ore from the mountains of Tsuchi, and the strategic depth that comes from holding
        the island&#39;s most productive farmland.</p>

        <p>The <strong>Arashi Alliance</strong> commands the northwestern coast and the storm-battered northeast. Its
        advantages are naval — Minato-jō and Namigashira are the two great ports of Hokori — and its clans are hardened
        by generations of living where the weather itself is a combatant.</p>

        <p>Two years of escalating hostility have produced no decisive outcome. Battles are fought, borders shift,
        villages burn, and the common people pay the price.</p>

        <p>The three <strong>independent clans</strong> are the fulcrum on which the war may turn. Every faction knows
        this. The independents are courted, threatened, and watched. Their allegiance — or continued neutrality — could
        end the war overnight.</p>
      markdown: ''

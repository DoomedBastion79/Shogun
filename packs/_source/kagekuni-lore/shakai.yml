  - _id: uZIBBz7GZWc8Ncki
    _key: '!journal.pages!P63d5AJsqtwbZDmT.uZIBBz7GZWc8Ncki'
    name: The Military
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >
        <p>War in Kagekuni is the domain of the samurai, but the dying is shared widely.</p>

        <p>The military command hierarchy runs from the <strong>Shōgun</strong> (currently a vacant position) down
        through the <strong>daimyō</strong>, who command their clan&#39;s forces directly. Below the daimyō, the chain
        continues:</p>

        <p><strong>Sotaishō</strong> (Supreme Commander) → <strong>Karō</strong> (Chief Retainer) →
        <strong>Taishō</strong> (General) → <strong>Kumigashira</strong> (Squad Leader) → <strong>Kogashira</strong>
        (Corporal)</p>

        <p>Samurai form the officer class, ranked from <strong>gokenin</strong> (housemen) through
        <strong>goshi</strong> (rustic warriors) to <strong>hatamoto</strong> (bannermen — the elite retainers of a
        daimyō). Below them, the <strong>ashigaru</strong> — peasant infantry — fill the ranks with sword, spear, and
        bow.</p>

        <p>An extensive logistics corps of <strong>bugyō</strong> (commissioners) manages everything from weapons and
        armour to provisions, boats, and battlefield flags. War in Kagekuni is not simply a matter of warriors meeting
        on a field — it is an administrative enterprise requiring coordination across difficult terrain, unpredictable
        weather, and supply lines that stretch through mountains and across water.</p>
      markdown: ''

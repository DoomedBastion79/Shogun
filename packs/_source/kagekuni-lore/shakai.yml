      content: >
        <p>A nature-focused monastic order based on <strong>Unmeijima</strong>, near the town of Kazehama. The order
        emphasises contemplation, physical discipline, and harmony with the natural world. Their elder,
        <strong>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.5uySp1O85TJzLFmF]{Benkei}</strong>
        — a Guhuza of 198 years — is among the oldest known living individuals in the archipelago.</p>

        <p>The order occasionally dispatches members as delegates or advisors to the clans. <strong>Sun Wukong</strong>,
        a novice, currently serves as delegate to Clan Kaminari.</p>

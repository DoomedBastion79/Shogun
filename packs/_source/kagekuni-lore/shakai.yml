    image: {}
    text:
      format: 1
      content: >
        <p>The return of sei has spawned institutions dedicated to its study and application:</p>

        <p><strong>Seishin</strong> on the island of Unmeijima — the premier research institution for sei, founded
        around <strong>Hikari no Kenta</strong>, the first known Talent. What began as a place of study has grown into a
        city in its own right.</p>

        <p><strong>Hikari no Shizuku</strong> in
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.Zk6QD9Sdfud4SuRV]{Heian} — a healing and light magic
        tradition operating within the imperial capital.</p>

        <p>The <strong>Raimeiin</strong> (雷鳴院 — Institute of Thunder) and the tradition associated with the
        <strong>Forest of Spirits</strong> (Yōsei Mori) in
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.EPAWGqYCrUzYfngV]{Kusa}
        were both revealed publicly during the Plague Campaign of 16609–16616. Their methods and internal workings are
        not widely known.</p>

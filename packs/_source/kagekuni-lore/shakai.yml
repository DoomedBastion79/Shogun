  - _id: 04oGgq7ujrFWQLKu
    _key: '!journal.pages!P63d5AJsqtwbZDmT.04oGgq7ujrFWQLKu'
    name: Clan Kaminari
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >
        <p><strong>Daimyō:</strong>
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.1J9hy9Hs6EVuYjyz]{Raijin
        no Kazuhiko} — <em lang="ja-Latn">The Storm-lord</em>

        <strong>Race:</strong> Human | <strong>Age:</strong> 47 | <strong>Province:</strong>
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.eAI9SnbW1RmsWOGw]{Hana}
        | <strong>Capital:</strong> @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.Zk6QD9Sdfud4SuRV]{Heian}</p>

        <p>Kazuhiko was not born into Clan Kaminari. He rose through martial prowess alone — a fact that earns him both
        grudging respect and quiet resentment among those who believe blood should determine rank. His hair is black
        streaked with silver, his manner direct, and his reputation built on a mastery of storm magic that few in the
        archipelago can match.</p>

        <p>Kaminari controls the Province of Hana and with it the imperial capital of Heian — the most politically
        sensitive position of any clan in Kagekuni. They hold the seat of empire without the authority to claim it.
        Every decision Kazuhiko makes is scrutinised by both alliances, who see in Hana&#39;s independence either a
        potential ally or a threat that must eventually be addressed.</p>

        <p>Kaminari&#39;s warriors are fierce and well-trained, known for discipline under pressure and a willingness to
        fight in conditions that would break lesser forces. The clan&#39;s connection to storm magic is not merely a
        reputation — it shapes their tactics, their training, and the way their enemies plan against them.</p>
      markdown: ''

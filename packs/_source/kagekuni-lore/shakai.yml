    image: {}
    text:
      format: 1
      content: >
        <p>A druidic tradition devoted to protecting specific sacred sites across Kagekuni. The order&#39;s guardians
        are few, scattered, and deeply committed to sites they may tend for decades.</p>

        <p>Their former guardian,
        <strong>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.Tpou815uKS3CU4HS]{Solas
        Evergreen}</strong>, is deceased. His successor, <strong>Relc</strong>, was appointed through a posthumous
        letter — an unusual and somewhat irregular transfer of authority that suggests Solas anticipated his own death.
        <strong>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.1sPbOXGo42Ff4Wtc]{Hideaki
        Sato}</strong>, an elder of the order, resides in Kōriwara village in
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.M72zAjYRdrTCan30]{Mizu}
        province.</p>

      content: >
        <p><strong>Daimyō:</strong>
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.nKNKNY1OExtA3Hhh]{Akihiko
        Kurohana}

        <strong>Race:</strong> Black Dragonborn | <strong>Age:</strong> 54 | <strong>Province:</strong> Varies |
        <strong>Capital:</strong> Unspecified</p>

        <p>Akihiko Kurohana stands six and a half feet tall, with scales like polished obsidian and eyes that glow
        faintly red. He maintains his clan&#39;s independence through strength and reputation rather than diplomacy. His
        intentions are difficult to read, which is precisely as he prefers it.</p>

        <p>Kurohana is a clan that trades on uncertainty. Their daimyō says little in public, commits to nothing without
        advantage, and ensures that neither alliance can take his loyalty for granted. In the current climate, this
        deliberate opacity is both a shield and a provocation — every faction wonders what Kurohana will do, and Akihiko
        ensures they keep wondering.</p>
      markdown: ''

  - _id: fLswarMwPUZCA9NC
    _key: '!journal.pages!P63d5AJsqtwbZDmT.fLswarMwPUZCA9NC'
    name: The Peoples of Kagekuni
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >
        <p>The archipelago is home to many races, though not all enjoy equal standing. Humans and dragonborn —
        particularly those claiming descent from the founding dragon clans — move through society with the fewest
        barriers. Other races face varying degrees of prejudice depending on the region, the local clan&#39;s attitudes,
        and the circumstances of their presence.</p>

        <table>

        <thead>

        <tr>

        <th>Race</th>

        <th>Cultural Name</th>

        <th>Notes</th>

        </tr>

        </thead>

        <tbody><tr>

        <td>Elves</td>

        <td><strong>Arcadians</strong></td>

        <td>Near-immortal; the imperial line was Arcadian; last emperor Ryūjin died 16739</td>

        </tr>

        <tr>

        <td>Dwarves</td>

        <td><strong>Zirak</strong></td>

        <td>Ancestral homeland in Mizuho, on the island of Tatara</td>

        </tr>

        <tr>

        <td>Gnomes</td>

        <td><strong>Glimfyr</strong></td>

        <td>Ancestral homeland in Shugyoku, on the island of Tatara</td>

        </tr>

        <tr>

        <td>Great Apes</td>

        <td><strong>Guhuza</strong></td>

        <td>Distinct race of Seizan; powerful build; fur from black to silvered; capable of great age</td>

        </tr>

        <tr>

        <td>Dragonborn</td>

        <td>Dragonborn</td>

        <td>Prominent among the Kugai; claim descent from the founding dragons</td>

        </tr>

        <tr>

        <td>Halflings</td>

        <td>Halflings</td>

        <td>Present across the archipelago; lower social standing</td>

        </tr>

        </tbody></table>

        <p>The <strong>Zirak</strong> and <strong>Glimfyr</strong> have maintained an eternal feud on their shared
        island of Tatara. They rarely stop fighting. Historically, only an emperor&#39;s direct command has imposed
        truces — and those truces have always ended sooner than intended. Their conflict once sparked the empire-wide
        <strong>War of Fractured Banners</strong>. With no emperor to restrain them, the feud has recently escalated
        again.</p>

        <p>Characters who are not dragonborn, human, or the locally dominant non-human race will encounter prejudice in
        social situations. Doors close. Prices rise. Patience runs thin. This is not universal — individual NPCs may be
        more or less tolerant — but the systemic bias is real and pervasive.</p>
      markdown: ''

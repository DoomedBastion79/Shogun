        farmland on Hokori — and the mineral wealth of Tsuchi&#39;s mountains. The alliance&#39;s strategic depth means
        it can absorb territorial losses that would cripple a coastal faction.</p>

        <p><strong>Clan Tsuchiura</strong> is the most prominent of the Genso clans beyond Hokori, also governing the
        <strong>Mizuho</strong> region on the island of Tatara — the ancestral homeland of the Zirak.</p>

  - _id: 0zlSIYpaImvxkyl6
    _key: '!journal.pages!P63d5AJsqtwbZDmT.0zlSIYpaImvxkyl6'
    name: Order of the Ancient Guard
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >
        <p>The most secret organisation in Kagekuni. The Ancient Guard exists for a single purpose: to protect the seven
        founding dragons in their slumber and to maintain the conditions under which they remain undisturbed.</p>

        <p><strong>Ranks:</strong></p>

        <ol>

        <li>High Guardian</li>

        <li>Warden</li>

        <li>Sentinel</li>

        <li>Keeper</li>

        <li>Protector</li>

        <li>Initiate</li>

        </ol>

        <p>The Guard operates through hidden sanctuaries across the archipelago. Its members hold public positions in
        other organisations — monasteries, druidic orders, provincial administrations — using these as cover for their
        true work. Their influence is subtle: preventing any single power from dominating, steering political outcomes
        away from actions that might disturb draconic sites, and watching for threats to the dragons&#39; safety.</p>

        <p><strong>Known Members:</strong></p>

        <ul>

        <li><strong>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.5uySp1O85TJzLFmF]{Benkei}</strong>
        — Elder of the Order of the Tranquil Lotus; rank within the Ancient Guard TBD</li>

        <li><strong>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.Tpou815uKS3CU4HS]{Solas
        Evergreen}</strong> — Former Guardian of the Order of the Sacred Grove; DECEASED; rank likely Protector or
        higher</li>

        <li><strong>Keeper
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.oACSZZYBMIV9sr54]{Tsubaki}</strong>
        — Initiate, ~60 years of service; stationed at the Crimson Shrine in Hi province</li>

        </ul>

        <p><strong>Critical Implication:</strong> Solas&#39;s murder means someone is actively targeting members of the
        order that protects the dragons. The scope of the threat is unknown. Whether this is a single actor or a
        coordinated campaign has not been determined.</p>
      markdown: ''
    video:
      controls: true
      volume: 0.5

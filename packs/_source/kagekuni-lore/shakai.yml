  - _id: HdHfZ4VjFoL7ghtT
    _key: '!journal.pages!P63d5AJsqtwbZDmT.HdHfZ4VjFoL7ghtT'
    name: The Imperial Order
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >
        <p>At the apex of Kagekuni&#39;s political structure sits the Emperor — or, more precisely, the empty throne
        where an emperor should sit. For over eight thousand years, the imperial line traced its descent from
        <strong>Tenryū no Mikado</strong>, the first emperor, who united the warring dragon clans and forged the
        archipelago into a single civilisation. The emperor&#39;s authority was absolute in theory and considerable in
        practice, tempered by the realities of governing a vast island chain through intermediaries.</p>

        <p>Beneath the emperor, the <strong>Shogun</strong> served as supreme military commander — a wartime appointment
        granted by imperial decree, carrying the authority to mobilise armies, impose martial law, and compel obedience
        from the daimyō. The position was never permanent by design. In practice, some shoguns held power for
        decades.</p>

        <p>The <strong>Kokushi Kyōkai</strong> — the Council of Five Ministers — administers the empire&#39;s civilian
        machinery. Five departments cover the essential functions of governance:</p>

        <table>

        <thead>

        <tr>

        <th>Title</th>

        <th>Role</th>

        </tr>

        </thead>

        <tbody><tr>

        <td><strong>Anzen Hoshō Daijin</strong></td>

        <td>Minister of Security — intelligence, imperial protectorate</td>

        </tr>

        <tr>

        <td><strong>Fukushi Daijin</strong></td>

        <td>Minister of Welfare — healthcare, education, public assistance</td>

        </tr>

        <tr>

        <td><strong>Gaikō Daijin</strong></td>

        <td>Minister of Foreign Affairs — diplomacy, trade, foreign nationals</td>

        </tr>

        <tr>

        <td><strong>Seimu Daijin</strong></td>

        <td>Minister of Administration — provincial governance, infrastructure</td>

        </tr>

        <tr>

        <td><strong>Zaiumu Daijin</strong></td>

        <td>Minister of Finance — treasury, taxation, revenue</td>

        </tr>

        </tbody></table>

        <p>Below the national level, provincial administration follows its own chain: <strong>Chiji</strong> (Governor)
        to <strong>Gunji</strong> (County Magistrate) to <strong>Shi</strong> (Municipal Assembly) to
        <strong>Shichō</strong> (Mayor) to <strong>Sonchō</strong> (Village Leader). In theory, each level answers to
        the one above. In practice, local power depends heavily on who controls the samurai in the region.</p>

        <p>The <strong>Teikoku Keisatsu</strong> — the Imperial Police — maintain order at a local level. Once an
        empire-wide institution, the police have retreated to a regional footprint in the absence of central authority.
        They cooperate with local clan forces where relations allow it and operate independently where they do not.</p>
      markdown: ''

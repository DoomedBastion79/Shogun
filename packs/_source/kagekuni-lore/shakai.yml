  - _id: jbdbxnDWwndsWef6
    _key: '!journal.pages!P63d5AJsqtwbZDmT.jbdbxnDWwndsWef6'
    name: Kugai — The Elite
    type: text
    title:
      show: true
      level: 3
    image: {}
    text:
      format: 1
      content: >
        <p>The ruling class. Kugai families claim descent from the imperial founders or the dragon clans that preceded
        them. In practice, the caste is dominated by humans and dragonborn, though other races with sufficient political
        connections have occasionally been elevated. The Kugai includes the daimyō, their courts, senior scholars, and
        the highest-ranking samurai — the <strong>hatamoto</strong>, or bannermen, who serve as personal retainers to
        clan lords.</p>

        <p>Kugai families maintain genealogical records stretching back centuries. Some are genuine. Some are creative.
        All are taken seriously.</p>
      markdown: ''

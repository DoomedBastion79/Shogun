  - _id: pPn94YKLtPZJRn0v
    _key: '!journal.pages!P63d5AJsqtwbZDmT.pPn94YKLtPZJRn0v'
    name: Honour
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >
        <p>Honour in Kagekuni is not an abstraction. It is a currency, a weapon, and a sentence.</p>

        <p>A samurai&#39;s honour determines their standing within their clan, their right to speak in councils, the
        marriages their children may make, and the manner of their death. Honour is earned through service, loyalty, and
        sacrifice. It is lost through cowardice, betrayal, or failure — and once lost, it is extraordinarily difficult
        to recover. A samurai who loses their honour may face exile, ritual punishment, or the expectation that they
        will take their own life to restore their family&#39;s name.</p>

        <p>The codes of <strong>bushidō</strong> — the way of the warrior — govern samurai conduct. Duty to one&#39;s
        lord supersedes personal desire. Courage in battle is expected, not celebrated. Loyalty is absolute until the
        moment it isn&#39;t, at which point it becomes treason. The tension between these demands — when duty conflicts
        with conscience, when loyalty to a corrupt lord meets personal honour — is the engine that drives much of
        Kagekuni&#39;s political drama.</p>

        <p>Honour applies differently across the castes. Peasants and merchants are not bound by bushidō, but they live
        within its shadow. A merchant who shames a samurai may find their shop burned. A peasant who fails to show
        proper deference may be struck without legal consequence. The social codes are enforced not by law alone but by
        a pervasive understanding that hierarchy is the natural order — and that those who disrupt it invite
        consequences not just for themselves but for their families.</p>
      markdown: ''

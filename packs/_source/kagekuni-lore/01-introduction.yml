      content: >-
        <section class="kg-tier kg-tier-intro" data-tier="intro"><dl class="kg-infobox" data-kind="infobox"><div
        class="kg-info__row"><dt>Type</dt><dd data-field="type">core</dd></div></dl><p>The archipelago of
        <strong>Kagekuni</strong> — the Shrouded Isles — rises from the <strong>Raijin no Fukai</strong> sea like the
        spine of something ancient and half-submerged. Five major islands and a scattering of lesser ones form a chain
        shaped by the collision of four tectonic plates, each island bearing the scars and gifts of the geology beneath
        it. Volcanic peaks trail smoke into skies where three stars wheel. Coastlines shift with the complex tides of
        four moons. Bamboo forests climb mountain flanks where the trees give way to pale crystal trunks that chime in
        the wind, and lowland rivers run faintly luminous at night through paddies of indigo grass.</p>

        <p>This is a land that moves. Earthquakes shake its foundations. Typhoons rake its coasts. Monsoons swell its
        rivers and drown its roads. The people of Kagekuni have never known a still world, and their architecture, their
        agriculture, their faith, and their politics all reflect it. Castles are built to flex rather than resist.
        Villages relocate rather than rebuild. Shrines stand where the earth is quietest, and the earth is rarely quiet
        for long.</p>

        <p>The pages that follow describe the islands, provinces, and settlements of Kagekuni — the places where power
        concentrates, where trade flows, where clans hold their seats, and where the spaces between destinations are as
        important as the destinations themselves. The roads of Kagekuni are not empty connective tissue. They are where
        travellers encounter the world as it actually is: the weather, the terrain, the people moving between places
        with purposes of their own. A three-day journey through the mountains is three days of the world revealing
        itself — not a gap to be skipped.</p>

        <section class="secret">


        <h3 id="kg-dm-note-geography-and-progenitor-domains" data-section="dm-note-geography-and-progenitor-domains">DM
        Note — Geography and Progenitor Domains</h3>

        <p>Each of the five major islands is connected to one or more of the seven Progenitor dragons. Their slumbering
        places are woven into the geography — hidden beneath mountains, within volcanic hearts, beneath lakes, or deep
        in forests that have grown undisturbed for millennia. The geography section entries do not reveal these
        connections, but the physical character of each island is shaped in part by the dragon that sleeps within it.
        When describing terrain, weather, and the feel of a place, the Progenitor&#39;s domain bleeds through:
        Fushichō&#39;s volcanic fury reflects Akaryū (Crimson); Kawa&#39;s waters reflect Aoryū (Azure). These are not
        coincidences — they are consequences.</p>

        </section></section>

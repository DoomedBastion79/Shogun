        <section class="secret">


        <h4 id="kg-dm-note-tatara-and-the-onyx-dragon" data-section="dm-note-tatara-and-the-onyx-dragon">DM Note —
        Tatara and the Onyx Dragon</h4>

        <p><strong>Kokuryū</strong> (Onyx Dragon) is associated with Tatara — domain of shadow, darkness, and cunning.
        The dragon is alive and slumbering, but its location is unknown. Kokuryū is currently being <strong>impersonated
        by Murasakiryū</strong> — the Amethyst Dragon masquerades as Kokuryū to conceal its own awakening. The dark
        mortals who woke Murasakiryū believed they were waking Kokuryū. The Onyx Rebellion&#39;s legacy — four hundred
        years of guerrilla warfare against imperial authority — leaves a cultural imprint on Tatara that the real
        Kokuryū would recognise.</p>

        </section></section>

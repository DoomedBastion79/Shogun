        <section class="kg-tier kg-tier-intro" data-tier="intro"><dl class="kg-infobox" data-kind="infobox"><div
        class="kg-info__row"><dt>Type</dt><dd data-field="type">core</dd></div></dl><p>It has been fifty-one years since
        the Great Awakening. Within living memory, magic returned to a world that had forgotten it existed. The energy
        called sei — once woven through every living thing on Seizan — went silent for over three thousand years. When
        it returned, it returned to a world that had changed. Institutions built on magical foundations had long since
        crumbled. The knowledge, the traditions, the scholarly lineages that once sustained sei practice were gone. What
        emerged in their place was something rawer: individuals born with innate magical talent —
        <strong>Talents</strong> — appearing without warning, without teachers, and without a society that knew what to
        do with them.</p>

        <p>The first Talents were persecuted. Later ones were tolerated, studied, and eventually recruited. Magical
        enclaves formed — Seishin on the island of Unmeijima became the premier research institution; Hikari no Shizuku
        established a healing tradition within the capital. By the time the Great Awakening made sei fully accessible
        again, the daimyo of Kagekuni were already competing to recruit mages into their service. Magic had returned.
        The question of who would control it had only just begun.</p>

        <h2 id="kg-an-empire-without-an-emperor" data-section="an-empire-without-an-emperor">An Empire Without an
        Emperor</h2>

        <p>Emperor <strong>Ryūjin no Mikado</strong> — the eighteenth emperor, the last of the near-immortal elven line
        stretching back to the founding — died in <strong>16739</strong>. The official cause was old age. He was the
        final link to an unbroken chain of rulers that began with Tenryū no Mikado over eight thousand years ago.</p>

        <p>No confirmed successor has emerged. Multiple claimants have presented genealogical proof of varying
        credibility, but none has secured recognition from the <strong>Kokushi Kyōkai</strong> — the five government
        ministers who administer the empire. The ministers themselves are holdovers, functioning in constitutional
        limbo. They maintain taxation, law, infrastructure, and diplomacy, but they lack the authority to resolve the
        central crisis: who rules?</p>

        <p>The problem is compounded by Ryūjin&#39;s final reform. In <strong>16732</strong>, the emperor decreed that
        the Kokushi Kyōkai could no longer appoint a Shogun without imperial approval. The Shogunate — the military
        authority that has historically held the empire together during periods of crisis — is legally frozen. There is
        no emperor to approve a Shogun, and no Shogun to impose order.</p>

        <section class="secret">


        <h3 id="kg-dm-note-the-emperor39s-death" data-section="dm-note-the-emperor39s-death">DM Note — The Emperor&#39;s
        Death</h3>

        <p>Ryūjin&#39;s death is not what it appears. The official story is old age, but <strong>foul play is
        suspected</strong>. Two independent daimyo — <strong>Raijin no Kazuhiko</strong> (Clan Kaminari) and
        <strong>Akihiko Kurohana</strong> (Clan Kurohana) — are both quietly investigating the circumstances of the
        emperor&#39;s death. Neither has shared their suspicions publicly. The 16732 reform that froze the Shogunate may
        have been motivated by Ryūjin&#39;s awareness of threats against the imperial line — a last attempt to prevent
        his enemies from consolidating power after his death.</p>

        <p><strong>Hiroshi Nakamura</strong>, Shugo (military governor) of Heian in Kaminari territory, is a
        <strong>traitor</strong> working with the Genso Alliance. He is using his position to feed intelligence to Genso
        — likely connected to the larger political destabilisation.</p>

        </section>


        <h2 id="kg-war-between-the-alliances" data-section="war-between-the-alliances">War Between the Alliances</h2>

        <p>Into this vacuum, war has come. In <strong>16742</strong>, tensions between two major clan alliances erupted
        into open conflict.</p>

        <p>The <strong>Genso Alliance</strong> — Clans Fuyugiri, Homoruyama, Ryūkaze, and Tsuchiura — governs the
        provinces of Kusa and Tsuchi. The <strong>Arashi Alliance</strong> — Clans Arashiyama, Hoshizora, Shirotsuru,
        and Yūgure — governs Mizu and Nami. Two years of escalating hostility have produced no decisive outcome. Battles
        are fought, borders shift, villages burn, and the common people pay the price.</p>

        <p>Three clans remain independent: <strong>Kaminari</strong>, <strong>Kurohana</strong>, and
        <strong>Gekkō</strong>. Their allegiance — or continued neutrality — could tip the war decisively. Every faction
        knows this. The independents are courted, threatened, and watched. They are the fulcrum on which the future of
        Kagekuni may turn.</p>

        <h2 id="kg-the-clans" data-section="the-clans">The Clans</h2>

        <h3 id="kg-clan-kaminari-independent" data-section="clan-kaminari-independent">Clan Kaminari (Independent)</h3>

        <p>Governed by <strong>Raijin no Kazuhiko</strong>, the Storm-lord — a human warrior of 47 years who was born
        outside the clan and rose through martial prowess alone. Kaminari controls the Province of Hana and its capital,
        <strong>Heian</strong> — the imperial capital, now without an emperor. Known for mastery of storm magic and
        fierce warriors, Kaminari occupies the most politically sensitive position of any clan: they hold the seat of
        empire without the authority to claim it.</p>

        <h3 id="kg-clan-kurohana-independent" data-section="clan-kurohana-independent">Clan Kurohana (Independent)</h3>

        <p>Led by <strong>Akihiko Kurohana</strong> — a black dragonborn of 54 years, tall and imposing, with scales
        like polished obsidian and eyes that glow faintly red. Kurohana maintains independence through strength and
        reputation. Their daimyo&#39;s intentions are difficult to read, which is precisely as he prefers it.</p>

        <h3 id="kg-clan-gekk-independent-status-uncertain" data-section="clan-gekk-independent-status-uncertain">Clan
        Gekkō (Independent — Status Uncertain)</h3>

        <p>Daimyo <strong>Masota no Gekkō</strong> has not been seen publicly in some time. His clan&#39;s silence has
        drawn attention from both alliances and from the other independents. Rumours vary — illness, a power struggle
        within the clan, or something worse. The truth of Clan Gekkō&#39;s situation is one of the most pressing
        questions in Kagekuni&#39;s current politics.</p>

        <section class="secret">


        <h3 id="kg-dm-note-clan-gekk" data-section="dm-note-clan-gekk">DM Note — Clan Gekkō</h3>

        <p>Clan Gekkō attempted a dark ritual with catastrophic consequences. The entire clan — including Daimyo Masota
        no Gekkō — was <strong>transformed into Nagaji</strong> (serpent folk). Masota retains fragmented awareness, but
        his mental coherence is degrading over time. The longer the situation persists, the less of him remains to
        reach.</p>

        <p>The <strong>Order of the Black Lily</strong> (Monastery of the Black Lily, above Akatsuki village in Kaze
        province) knows the truth and has been monitoring the situation. The party has already encountered and
        <strong>killed several Nagaji without knowing they were Gekkō clan members</strong>. The moral reckoning is
        pending.</p>

        <p>A reversal may be possible but requires rare materials, specific conditions, or Progenitor involvement. The
        details are TBD.</p>

        </section>


        <h3 id="kg-the-alliances-at-a-glance" data-section="the-alliances-at-a-glance">The Alliances at a Glance</h3>


        <section class="secret kg-secret-discoverable">

        <p><strong>Details</strong></p>

        <p><em lang="ja-Latn">discoverable</em></p>

        <ul>

        <li>The Star River has recently shown anomalies -- unusual turbidity, temperature changes, and dead fish with
        injuries inconsistent with normal predation.</li>

        <li>A figure has been observed watching the village from the far riverbank at night.</li>

        </ul>


        </section>



        <section class="secret kg-secret-sealed">

        <p><strong>DM Secrets</strong></p>

        <p><em lang="ja-Latn">sealed</em></p>

        <p><strong>The Sutariba&#39;s Upper Reach</strong>

        The Star River has recently shown anomalies -- unusual turbidity, changes in water temperature, and dead fish
        floating downstream bearing injuries inconsistent with normal predation. This is a consequence of Nagaji
        activity in the upper pass.</p>

        <p><strong>Takeda Haruto&#39;s Observation</strong>

        The village leader has seen, twice, a figure watching the village from the far riverbank at night -- a figure
        that moved in a way that was not quite right. He has not reported it because he has no confidence that authority
        is currently functioning.</p>


        </section>






        <section class="secret kg-secret-sealed">

        <p><strong>Plot Hooks</strong></p>

        <p><em lang="ja-Latn">sealed</em></p>

        <ul>

        <li>Investigation of the river anomalies could lead to discovery of Nagaji presence in the mountains above</li>

        <li>The figure watching from across the river -- Nagaji scout, or something else?</li>

        </ul>


        </section>


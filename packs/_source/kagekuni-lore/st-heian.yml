    text:
      format: 1
      content: >
        <div class="kg-settlement-header" data-settlement-type="city"><div class="kg-stl-badges"><span class="kg-badge
        kg-badge--type kg-badge--city">City</span> <span class="kg-badge kg-badge--province">Hana Province</span> <span
        class="kg-badge kg-badge--island">Hokori</span> <span class="kg-badge kg-badge--pop">Pop: Large</span></div><div
        class="kg-stl-details"><span class="kg-stl-detail"><strong>Clan:</strong> Kaminari</span><span
        class="kg-stl-detail"><strong>Climate:</strong> Temperate; cherry blossom springs; warm summers; brilliant
        autumns; mild winters</span><span class="kg-stl-detail kg-stl-subtitle"><em>"The city that outlasted every
        empire built within it."</em></span></div></div>

        <p>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.Zk6QD9Sdfud4SuRV]{Heian} is the oldest continuously
        inhabited city in the archipelago and the seat of imperial authority for over eight thousand years. It stands on
        a peninsula where the Nagisa Sea meets Lake Midoriko -- a position offering both a defensible landward approach
        and open water access in two directions.</p>

        <p>The city is beautiful in the way that things shaped by deep time become beautiful -- through the accumulation
        of craftsmanship, care, and purpose. Ancient trees line the main avenues, their roots lifting paving stones that
        are reset around them generation after generation. The Imperial Palace complex dominates the skyline. Shirogane
        Yama is visible on clear days forty miles to the north and northwest.</p>

        <p>The Emperor&#39;s Highway extends from Heian in three directions -- north through Tenchusan Ren toward
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.D2VV9bFa1txuKDxB]{Kaze},
        east along the coast, and west by ferry connection to Sakurano and the interior. With no emperor, the city is a
        center without a purpose -- the streets are still busy, the markets still active, but there is a quality to
        civic life: the posture of a city holding itself together while waiting for resolution.</p>

        <p><strong>Taro&#39;s Forge (Kurogane-sho)</strong> -- Master blacksmith
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.2Mal6Uf7jgW1kLPg]{Taro
        Fukomoto}&#39;s workshop. Renowned for quality and integrity. Produces exceptional weapons and armor. Taro
        teaches those who demonstrate genuine commitment.</p>

        <p><strong>The Moonlit Garden (Ryu Jikuchiku)</strong> -- Teahouse in the Dragon Borough with a garden famous
        for nighttime aesthetics -- white stone, silver-leaved trees, reflecting pool. The party first convened here.
        Renowned for discretion.</p>

        <p><strong>Hikari no Shizuku (Hikari Zon)</strong> -- Healing and light magic enclave in the Knowledge District.
        Provides medical services and trains healing-aligned sei practitioners.</p>

    text:
      format: 1
      content: >
        <p><strong>Hikari Zon -- Knowledge District</strong>

        Libraries, academies, schools, and scholarly institutions. Low, wide buildings with sliding walls. The central
        library holds the largest collection in
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.eAI9SnbW1RmsWOGw]{Hana}.
        Seimasters and scholars from across the archipelago spend time here.</p>

        <p><strong>Hinode-ku -- Eastern Residential Ward</strong>

        Mixed residential for artisans and merchants. Workshops opening onto narrow streets. A lively night market
        operates along the canal.</p>

        <p><strong>Ichiba Chiku -- Market District</strong>

        The economic heart. The largest open market in Hokori operates six days out of seven. The Market District never
        truly closes.</p>

        <p><strong>Inari Kyoku -- Religious District</strong>

        Temples, shrines, and spiritual institutions. Torii gates multiply inward from the boundary. A shrine to each of
        the seven dragon clans exists here.</p>

        <p><strong>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.D2VV9bFa1txuKDxB]{Kaze}-sho
        -- Wind District</strong>

        Open spaces, windmills, farming plots within the city boundary. The windmills power grain milling and workshop
        machinery.</p>

        <p><strong>Kinrin Chiku -- Palace Surrounding Quarter</strong>

        Residential and administrative district surrounding the Imperial Palace. Noble families and senior officials.
        Access is controlled. Streets are wider for ceremonial processions.</p>

        <p><strong>Kokyo Chiku -- Imperial Palace Complex</strong>

        Palace grounds surrounded by walls, gates, and a water moat. Centuries of accumulated construction. With no
        emperor, maintained by skeleton staff under the Kokushi Kyokai. Sections have been sealed.</p>

        <p><strong>Kurogane-sho -- Steel Precinct</strong>

        The forge district. Smiths, armorers, weapons specialists. Runs hot year-round. Home to Taro&#39;s Forge.</p>

        <p><strong>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.M72zAjYRdrTCan30]{Mizu}-gai
        -- Riverside Ward</strong>

        Along the water&#39;s edge. Water gardens, seafood restaurants, fish markets, fishing family residences. The
        morning catch market is a @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.Zk6QD9Sdfud4SuRV]{Heian}
        institution.</p>

        <p><strong>Ryu Jikuchiku -- Dragon Borough</strong>

        Nightlife, theater, teahouses, entertainment. Operates on a shifted schedule -- fully alive after dark. Hosts
        noh theater, storytellers, gambling establishments, and renowned teahouses.</p>

        <p><strong>Sakura-ku -- Cherry Blossom Ward</strong>

        Parks, public gardens, festival infrastructure. Famous cherry tree avenues. Hosts major seasonal festivals.</p>

        <p><strong>Tabibito Gai -- Traveler&#39;s Street</strong>

        Eastern gate neighborhood for transient visitors. Inns, stables, money changers, translation services. Character
        shifts constantly.</p>

        <p><strong>Tenku Zon -- Hilltop Ward</strong>

        Highest elevation residential area. Reserved for nobility and senior officials. Finest architecture in
        Heian.</p>

        <p><strong>Tensho no Mon -- Military District</strong>

        Barracks, command infrastructure, training grounds. Home to Taisho
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.Iul8ZsyqNrfhL4XZ]{Hideo
        Nakamura}&#39;s command headquarters. Where the party received their mission briefing.</p>

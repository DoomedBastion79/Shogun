        <section class="secret kg-secret-discoverable">

        <p><strong>Details</strong></p>

        <p><em lang="ja-Latn">discoverable</em></p>

        <ul>

        <li>The Imperial Palace&#39;s sealed sections contain something found after the Emperor&#39;s death that the
        Kokushi Kyokai does not know how to handle.</li>

        <li>The Moonlit Garden teahouse serves a deeper function as a neutral meeting ground for intelligence
        exchanges.</li>

        <li>Multiple individuals have arrived in Heian with claims to imperial succession.</li>

        </ul>


        </section>



        <section class="secret kg-secret-sealed">

        <p><strong>DM Secrets</strong></p>

        <p><em lang="ja-Latn">sealed</em></p>

        <p><strong>Hiroshi Nakamura -- Traitor in Place</strong>

        As Shugo, Hiroshi has near-total access to Clan Kaminari&#39;s intelligence and administrative operations. He is
        feeding intelligence to an outside party and has been for at least three years. He is aware that Hideo is
        investigating and is actively monitoring that investigation. His public persona is a performance of exceptional
        consistency.</p>

        <p><strong>The Imperial Palace -- Sealed Sections</strong>

        Something was found in the imperial apartments after Ryujin no Mikado died that the Kokushi Kyokai
        administrators do not know how to handle. It is not evidence of murder -- it is evidence of something older and
        stranger.</p>

        <p><strong>The Moonlit Garden&#39;s True Function</strong>

        The owner is a retired intelligence operative who maintains it as a neutral meeting ground for the Elven
        Council, among other groups. Information exchanges here regularly under the social protection of tea ceremony
        neutrality. The staff are trained to notice and remember without appearing to.</p>

        <p><strong>Hideo Nakamura&#39;s Investigation</strong>

        Hideo is hunting a traitor he does not yet know is his brother. He has narrowed the leak to a small circle of
        senior staff. The question is whether he reaches the conclusion before Hiroshi learns how close Hideo is and
        takes action.</p>

        <p><strong>The Succession Crisis in Heian</strong>

        Multiple claimants with genealogical documents of varying plausibility. The Kokushi Kyokai handles them through
        administrative delay. Three serious claimants are being watched. Two are probably fraudulent. One may not
        be.</p>


        </section>






        <section class="secret kg-secret-sealed">

        <p><strong>Plot Hooks</strong></p>

        <p><em lang="ja-Latn">sealed</em></p>

        <ul>

        <li>Hideo Nakamura asks the party to carry out intelligence work he cannot assign to his own staff -- suggests
        he suspects someone close</li>

        <li>An unusual request arrives from the sealed section of the Imperial Palace: someone inside has sent a note
        requesting outside contact; the Kokushi Kyokai doesn&#39;t know how this happened</li>

        <li>A succession claimant approaches the party specifically, wanting independent witnesses to a document
        verification</li>

        </ul>


        </section>


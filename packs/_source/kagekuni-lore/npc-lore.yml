        <div class="kg-settlement-header"><div class="kg-stl-badges"><span class="kg-badge kg-badge--race">Human</span>
        <span class="kg-badge kg-badge--clan">Clan Kaminari</span> <span class="kg-badge kg-badge--role">Taisho; Shugo
        (Governor) of Heian</span> <span class="kg-badge kg-badge--province">Heian</span></div></div>

        <p><em lang="ja-Latn">Taisho — Shugo (Governor) of
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.Zk6QD9Sdfud4SuRV]{Heian}</em></p>

        <h3 id="kg-appearance" data-section="appearance">Appearance</h3>

        <p>Dark hair tied back; tanned; deep brown eyes; warm approachable expression.</p>

        <h3 id="kg-public-role" data-section="public-role">Public Role</h3>

        <p>Taisho (General) of Clan Kaminari and Shugo (Governor) of Heian. As Shugo, he has near-total access to Clan
        Kaminari&#39;s intelligence and administrative operations. He is the civilian administrative authority over the
        imperial capital.</p>

        <h3 id="kg-personality" data-section="personality">Personality</h3>

        <p>Calm, peace-loving, nature-appreciating, wise mediator. His warmth makes him trusted by nearly everyone —
        including his brother Hideo.</p>

        <h3 id="kg-relationship-to-party" data-section="relationship-to-party">Relationship to Party</h3>

        <p>No direct contact established yet, but as Shugo of Heian he is a significant authority figure the party may
        interact with.</p>

        <section class="secret kg-secret-discoverable">

        <p><strong>True Nature</strong></p>

        <p><em lang="ja-Latn">discoverable</em></p>

        <p>His public persona — calm, peace-loving, wise — is a deliberate mask of exceptional consistency. His warmth
        is his most effective weapon.</p>


        </section>






        <section class="secret kg-secret-discoverable">

        <p><strong>Connections</strong></p>

        <p><em lang="ja-Latn">discoverable</em></p>

        <p>Brother of Taisho
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.Iul8ZsyqNrfhL4XZ]{Hideo
        Nakamura}. Their sibling relationship gives him both access and cover.</p>


        </section>






        <section class="secret kg-secret-discoverable">

        <p><strong>Quest Seeds</strong></p>

        <p><em lang="ja-Latn">discoverable</em></p>

        <p><strong>[QUEST SEED]</strong> Hiroshi&#39;s true nature, once discovered, represents a massive intelligence
        find — the Shugo of the imperial capital is a traitor.</p>


        </section>






        <section class="secret kg-secret-sealed">

        <p><strong>Campaign Secrets</strong></p>

        <p><em lang="ja-Latn">sealed</em></p>

        <p>Hiroshi Nakamura is an active traitor conspiring against Clan Kaminari. His primary driver is personal
        ambition — Nakamura family elevation. He is working with the Genso Alliance as his vehicle — Genso is the more
        overtly antagonist alliance in the broader story. His warmth and mediator persona is a deliberate mask over a
        calculated power play.</p>

        <p>He is using his Shugo position to feed intelligence to enemies. He has been doing this for at least three
        years. He is aware that Hideo is investigating a traitor and is actively monitoring that investigation to stay
        ahead of it.</p>

        <p>Who he is specifically working with within the Genso Alliance — his specific contact — is undeveloped and to
        be determined.</p>


        </section>






        <section class="secret kg-secret-sealed">

        <p><strong>Plot Threads</strong></p>

        <p><em lang="ja-Latn">sealed</em></p>

        <p>Traitor within Kaminari — Hideo is hunting him without knowing it</p>


        </section>






        <section class="secret kg-secret-sealed">

        <p><em lang="ja-Latn">sealed</em></p>

        <p>Genso Alliance connection — his betrayal ties into the broader war</p>


        </section>






        <section class="secret kg-secret-sealed">

        <p><em lang="ja-Latn">sealed</em></p>

        <p>Nakamura family ambition — the driving motive</p>


        </section>






        <section class="secret kg-secret-sealed">

        <p><em lang="ja-Latn">sealed</em></p>

        <p>The eventual brother confrontation — devastating narrative moment</p>


        </section>






        <section class="secret kg-secret-sealed">

        <p><em lang="ja-Latn">sealed</em></p>

        <p>Succession crisis implications — the Shugo of the capital working against his own clan</p>


        </section>






        <section class="secret kg-secret-sealed">

        <p><strong>Imperial Assassination — Sealed Reveal</strong></p>

        <p><em lang="ja-Latn">sealed</em></p>

        <p>Hiroshi was the <em lang="ja-Latn">second blade</em> in the Imperial assassination. Dian Wei&#39;s father
        took the emperor&#39;s place in the moment of the first attack and died in the emperor&#39;s robes; the real
        emperor escaped that room — and was killed shortly after, by Hiroshi, in another room of the imperial residence.
        <strong>The chamber&#39;s vision identifies the hand. It does not identify the reason.</strong></p>

        <p><strong>Reveal vector</strong>: The Brood Sanctum chamber, via Dian Wei&#39;s <em lang="ja-Latn">Who</em>
        knowledge gift (per Aya&#39;s offering choices). Dian sees Hiroshi&#39;s face mid-strike in a vision;
        recognition is instant because Dian has seen Hiroshi at civic functions in Heian. The vision is true but
        unprovable in any court — Dian cannot accuse the Shugo of the imperial capital without evidence the chamber
        cannot supply.</p>

        <p><strong>Campaign implications</strong>: Once revealed, Dian carries dangerous knowledge. Public accusation is
        suicide; private investigation is the only safe path forward. This intersects with Daimyo Kazuhiko&#39;s
        existing assassination probe — Dian and Kazuhiko may eventually share notes, with Kazuhiko providing the
        political cover and Dian providing the eyewitness vision. Hideo&#39;s parallel investigation of his own brother
        as a traitor may converge on the same target through different evidence.</p>

        <p><strong>Open question — Hiroshi&#39;s motive</strong>: Why he struck the emperor in the second room is not
        yet established. His existing campaign-secrets (Genso Alliance affiliation, Nakamura family elevation as
        personal driver) gesture at possibilities, but the chamber does not name them, and Dian&#39;s investigation will
        need to surface the <em lang="ja-Latn">why</em> through other means.</p>


        </section>


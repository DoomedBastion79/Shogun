        <div class="kg-settlement-header"><div class="kg-stl-badges"><span class="kg-badge kg-badge--race">Human</span>
        <span class="kg-badge kg-badge--clan">Clan Kaminari</span> <span class="kg-badge kg-badge--role">Taisho;
        Tokubetsu Sakusen Bōei Bugyō (Commissioner of Special Operations)</span> <span class="kg-badge
        kg-badge--province">Heian</span></div></div>

        <p><em lang="ja-Latn">Taisho — Tokubetsu Sakusen Bōei Bugyō (Commissioner of Special Operations)</em></p>

        <h3 id="kg-appearance" data-section="appearance">Appearance</h3>

        <p>Dark hair streaked with gray in topknot; tanned; deep brown eyes.</p>

        <h3 id="kg-public-role" data-section="public-role">Public Role</h3>

        <p>Taisho (General) of Clan Kaminari and Commissioner of Special Operations. Commands from the Tensho no Mon
        (Military District) in @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.Zk6QD9Sdfud4SuRV]{Heian}. Assigned
        the party their current mission to investigate the Gekkō Clan&#39;s silence. The party reports directly to
        him.</p>

        <h3 id="kg-personality" data-section="personality">Personality</h3>

        <p>Exceptionally intelligent, strategic; values order and discipline; stern but fair; appreciates historical
        battles and traditional music.</p>

        <h3 id="kg-relationship-to-party" data-section="relationship-to-party">Relationship to Party</h3>

        <p>Direct handler. Assigned the party their mission at the Tensho no Mon district in Heian. Sun Wukong&#39;s
        mandate from the Tranquil Lotus specifically names Hideo as the reporting authority. The party met him alongside
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.AJq3fWYMt9FizypU]{Arinori
        Senzai} during their mission briefing.</p>

        <section class="secret kg-secret-discoverable">

        <p><strong>True Nature</strong></p>

        <p><em lang="ja-Latn">discoverable</em></p>

        <p>Investigating a traitor within his own ranks. He has narrowed the leak to a small circle of senior staff. He
        may ask the party to carry out intelligence work he cannot assign to his own staff — the request would be framed
        neutrally but suggests he suspects someone close.</p>


        </section>






        <section class="secret kg-secret-discoverable">

        <p><strong>Connections</strong></p>

        <p><em lang="ja-Latn">discoverable</em></p>

        <p>Commands the special operations apparatus of Clan Kaminari. His intelligence resources are significant but
        compromised by the presence of the traitor he is hunting.</p>


        </section>






        <section class="secret kg-secret-discoverable">

        <p><strong>Quest Seeds</strong></p>

        <p><em lang="ja-Latn">discoverable</em></p>

        <p><strong>[QUEST SEED]</strong> Hideo asks the party to carry out intelligence work he cannot assign to his own
        staff — the request is framed neutrally but suggests he suspects someone close.

        <strong>[QUEST SEED]</strong> The political debriefing when the party reports back is a significant social
        encounter with real stakes — Hideo needs deniability; the party has information that could destabilize three
        clans.</p>


        </section>






        <section class="secret kg-secret-sealed">

        <p><strong>Campaign Secrets</strong></p>

        <p><em lang="ja-Latn">sealed</em></p>

        <p>The traitor Hideo is hunting is his own brother,
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.JLGqqI474AH04SDL]{Hiroshi
        Nakamura}, the Shugo of Heian. Hideo does not yet know this. He will, in time, develop evidence pointing toward
        Hiroshi. The question is whether he reaches that conclusion before Hiroshi learns how close Hideo is and takes
        action.</p>


        </section>






        <section class="secret kg-secret-sealed">

        <p><strong>Plot Threads</strong></p>

        <p><em lang="ja-Latn">sealed</em></p>

        <p>Traitor investigation — active; Hideo is unaware the traitor is Hiroshi</p>


        </section>






        <section class="secret kg-secret-sealed">

        <p><em lang="ja-Latn">sealed</em></p>

        <p>Party mission handler — debriefing scenes carry significant political weight</p>


        </section>






        <section class="secret kg-secret-sealed">

        <p><em lang="ja-Latn">sealed</em></p>

        <p>Brother relationship with Hiroshi — the eventual revelation will be devastating</p>


        </section>






        <section class="secret kg-secret-sealed">

        <p><em lang="ja-Latn">sealed</em></p>

        <p>Connection to the broader succession crisis and Genso Alliance through Hiroshi&#39;s conspiracy</p>


        </section>


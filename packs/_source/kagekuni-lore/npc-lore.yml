    text:
      format: 1
      content: >+
        <div class="kg-settlement-header"><div class="kg-stl-badges"><span class="kg-badge kg-badge--race">Human</span>
        <span class="kg-badge kg-badge--role">Merchant; Owner of the Sakura Blossom Inn</span></div></div>

        <p><em lang="ja-Latn">Merchant — Owner of the Sakura Blossom Inn</em></p>

        <h3 id="kg-appearance" data-section="appearance">Appearance</h3>

        <p>Short dark hair; sharp focused eyes; lithe and agile build; lightly tanned.</p>

        <h3 id="kg-public-role" data-section="public-role">Public Role</h3>

        <p>Owns and manages the Sakura Blossom Inn. Member of the Yamada Family and associated with the Merchant Guild.
        Jovial and welcoming innkeeper.</p>

        <h3 id="kg-personality" data-section="personality">Personality</h3>

        <p>Sharp, quick-thinking, resourceful; enjoys market hustle; dislikes dishonesty.</p>

        <h3 id="kg-relationship-to-party" data-section="relationship-to-party">Relationship to Party</h3>

        <p>No contact established.</p>

        <section class="secret kg-secret-discoverable">

        <p><strong>True Nature</strong></p>

        <p><em lang="ja-Latn">discoverable</em></p>

        <p>Building a case against a corrupt rival merchant; gathering evidence of dishonest practices. The specifics of
        this investigation are undeveloped.</p>


        </section>


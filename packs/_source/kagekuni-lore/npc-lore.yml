      content: >+
        <div class="kg-settlement-header"><div class="kg-stl-badges"><span class="kg-badge kg-badge--race">Human</span>
        <span class="kg-badge kg-badge--role">Town Leader, Ayame</span> <span class="kg-badge
        kg-badge--province">Ayame</span></div></div>

        <p><em lang="ja-Latn">Town Leader —
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.O65fxIh1WZwEtwrf]{Ayame}</em></p>

        <h3 id="kg-appearance" data-section="appearance">Appearance</h3>

        <p>Not described in detail.</p>

        <h3 id="kg-public-role" data-section="public-role">Public Role</h3>

        <p>Town leader of Ayame under the military overseer structure. Competent administrator, pragmatic in approach.
        Ayame is the valley town at the base of the Tenchūsan Ren pass — the primary land route between
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.eAI9SnbW1RmsWOGw]{Hana}&#39;s
        southern lowlands and the northern provinces. Population 638.</p>

        <h3 id="kg-personality" data-section="personality">Personality</h3>

        <p>Pragmatic; not deeply allied with any major faction; protects Ayame&#39;s neutrality because it is
        economically important.</p>

        <h3 id="kg-relationship-to-party" data-section="relationship-to-party">Relationship to Party</h3>

        <p>No direct contact established. The party passed through Ayame during their transit to the mountains.</p>

        <section class="secret kg-secret-discoverable">

        <p><strong>True Nature</strong></p>

        <p><em lang="ja-Latn">discoverable</em></p>

        <p>Has been receiving reports from mountain guide services about unusual activity in the upper pass — disrupted
        trail markers, signs of large encampment at non-standard locations, and two guides who came back from an
        upper-route job early, shaken and unwilling to specify what they saw. He has not reported upward through
        official channels because he has no official channels to report to that he trusts in the current political
        vacuum.</p>


        </section>


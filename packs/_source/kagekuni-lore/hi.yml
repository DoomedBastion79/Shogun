        <li>The Crimson Shrine&#39;s keeper, Tsubaki, has served for sixty years and communicates with something through
        the shrine&#39;s ember-bowl.</li>

        <li>The western territories of Hi are home to descendants of the Crimson Clan faction that refused unification,
        organized into loose tribal confederacies preserving forgotten traditions.</li>

        <li>Seimasters debate whether Enshiyama&#39;s current activity signals a major eruption building.</li>

        </ul>


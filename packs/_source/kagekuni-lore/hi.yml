        <section class="kg-tier kg-tier-sealed" data-tier="sealed"><h3
        id="kg-the-crimson-dragon-clan39s-hidden-presence" data-section="the-crimson-dragon-clan39s-hidden-presence">The
        Crimson Dragon Clan&#39;s Hidden Presence</h3>

        <p>Akaryu, the Crimson Dragon, is still alive and hidden. She maintains a tenuous connection to Hi through the
        Crimson Shrine. The shrine&#39;s keeper Tsubaki is an Initiate of the Order of the Ancient Guard. She does not
        know Akaryu&#39;s location, but knows the dragon is alive. Offerings burned in the shrine&#39;s ember-bowl reach
        something that responds.</p>

        <h3 id="kg-the-western-territories" data-section="the-western-territories">The Western Territories</h3>

        <p>The western reaches are effectively a separate entity. Descendants of the Crimson Clan faction that refused
        Tenryu&#39;s unification live there in loose tribal confederacies that have preserved traditions the rest of the
        empire forgot. They are fiercely territorial and know things about the volcanic highlands that no imperial map
        captures.</p>

        <h3 id="kg-enshiyama-and-the-coming-eruption" data-section="enshiyama-and-the-coming-eruption">Enshiyama and the
        Coming Eruption</h3>

        <p>The current low-level activity is the precursor to a significant eruption -- within one to three years. The
        seimasters who know this are divided on whether to publicize it; the political vacuum means there is no
        coordinating authority capable of organizing evacuation. This is an unlit fuse.</p>

        <h3 id="kg-the-contested-administration" data-section="the-contested-administration">The Contested
        Administration</h3>

        <p>The three clans competing for Hi&#39;s governance are being quietly manipulated by a fourth party -- a
        merchant consortium that wants provincial administration too weak to enforce trade regulations. The current
        chaos is, to some degree, manufactured.</p>

        <h3 id="kg-plot-hooks" data-section="plot-hooks">Plot Hooks</h3>

        <ul>

        <li>A volcano-guide from Kazan Mura has seen something in the upper reaches of Enshiyama -- something that moved
        against the wind -- and is too frightened to go back alone</li>

        <li>The Crimson Shrine&#39;s ember-bowl responded to an offering in a way it never has before; Tsubaki needs
        discreet help interpreting what it means</li>

        <li>A seimaster studying the eruption precursors has disappeared; her notes suggest she found something in the
        obsidian fields that was not geological</li>

        </ul>

        </section>

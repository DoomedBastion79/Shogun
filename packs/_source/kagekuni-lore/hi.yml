        <h3 id="kg-culture-amp-trade" data-section="culture-amp-trade">Culture &amp; Trade</h3>

        <p>Hi&#39;s culture is defined by proximity to death. The people are laconic, practical, and possess a dark
        humor about their circumstances. They do not flee volcanic activity -- they have developed sophisticated systems
        for reading, mitigating, and living alongside it. Hi&#39;s volcano-guides, engineers, and evacuation specialists
        are prized across the archipelago.</p>

        <p>Primary exports are obsidian, volcanic sulfur (used in alchemy and sei-related preparations), hot spring
        minerals, and surprisingly excellent agricultural products from volcanic terraces. The Onsen-machi resort draws
        wealthy visitors from across Hokori and beyond.</p>

        <h3 id="kg-history" data-section="history">History</h3>

        <p>Hi was long considered a backwater -- too dangerous and too remote. The Crimson Dragon Clan had their true
        stronghold here before unification, and the western reaches refused submission to Tenryu no Mikado. That refusal
        left a cultural legacy: Hi&#39;s people are fiercely independent and deeply skeptical of imperial authority.</p>

        <p>During the Dark Ages, Hi was almost entirely abandoned by formal authority. Small communities developed their
        own governance structures, spiritual practices, and martial traditions largely divorced from the broader
        empire.</p>

        <p>The province is currently in contested administration. The previous governing clan was wiped out in the
        opening engagements of the Arashi-Genso war, and neither alliance has installed a replacement. Several smaller
        clans are vying for the position.</p>

        </section>

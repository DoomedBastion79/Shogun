      content: >
        <p>@UUID[Compendium.assistant.lore.JournalEntry.8BPLYleAkYpmvX5a]{Kikyo} sits at the eastern edge of the
        Seidorin Mori -- the Bronze Wood Forest -- organized entirely around harvesting and trading a resource it did
        not create. The Bronze Wood is to Kikyo what a great mine is to a mining town, except the resource is renewable
        (slowly), carefully managed, and far more politically complicated.</p>

        <p>The city&#39;s architecture uses Bronze Wood extensively -- older buildings have developed a patina of aged
        copper giving streets a warm metallic glow at sunset. Newer construction uses it more sparingly due to licensing
        restrictions, creating visible stratification between old-money establishments and newer buildings.</p>

        <p>Kikyo&#39;s economy runs on the licensing system. Every piece of Bronze Wood leaving the forest passes
        through a licensing transaction administered by
        @UUID[Compendium.assistant.npcs-lore.JournalEntry.gzeHJBD2MSIEL1L6]{Ren Nakamura}&#39;s office. The paperwork is
        meticulous; the opportunities for licensed abuse are significant.</p>

      content: >
        <p><strong>Commercial Quarter</strong> -- Trading heart. Merchant warehouses, guild offices, the commodity
        exchange for Bronze Wood contracts. Ko&#39;jiri was caught performing here.</p>

        <p><strong>Administrative Quarter</strong> --
        @UUID[Compendium.assistant.npcs-lore.JournalEntry.gzeHJBD2MSIEL1L6]{Ren Nakamura}&#39;s offices and civic
        administration. The licensing offices are among the most visited buildings in
        @UUID[Compendium.assistant.lore.JournalEntry.8BPLYleAkYpmvX5a]{Kikyo}.</p>

        <p><strong>Residential Quarters</strong> -- Mixed; older areas near the forest edge contain original families;
        newer development pushed outward.</p>

        <p><strong>Kikyo Guard Compound</strong> --
        @UUID[Compendium.assistant.npcs-lore.JournalEntry.udwRiTyeMAQlEg5h]{Haruto Masashige}&#39;s base of operations.
        Small but highly capable force focused on licensing enforcement and forest protection.</p>

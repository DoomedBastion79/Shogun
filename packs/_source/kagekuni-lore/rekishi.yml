  - _id: ZyPNgDO9hEyXx67E
    _key: '!journal.pages!JBrSdiECB8Mb9qgI.ZyPNgDO9hEyXx67E'
    name: Era of the First Emperors — ~8000–8611
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >
        <p>The age of dragons ended and the age of emperors began with a single figure: <strong>Tenryū no
        Mikado</strong>.</p>

        <p>Tenryū ascended to power around the year 8000. He was already 852 years old — an Arcadian of mixed Crimson
        and Golden dragon lineage, carrying the blood of fire and justice in a single line. His unification of the
        archipelago was not achieved through war alone. Tenryū was a diplomat as much as a conqueror, binding clans
        through marriage alliances, trade agreements, and appeals to shared identity as often as through force of
        arms.</p>

        <p>Not all clans submitted willingly. The <strong>Crimson Clan</strong> fractured over the question of imperial
        loyalty. The eastern faction accepted Tenryū&#39;s authority and joined the empire. The western faction, loyal
        to the dragon Akaryū, refused submission and withdrew into the volcanic ranges of the <strong>Akaho
        Sanmyaku</strong> on Fushichō. Their descendants live there still — loose tribal confederacies preserving
        traditions the rest of the empire forgot.</p>

        <p>The <strong>Battle of Seirei Mizuumi</strong> secured the island of Kawa and broke the naval power of the
        Azure Clan, bringing the eastern waters under imperial control.</p>

        <p>The gravest threat to the young empire came from Tatara. <strong>Kokuryū</strong> — the Onyx Dragon — refused
        to accept Tenryū&#39;s authority and launched the <strong>Onyx Rebellion</strong> in 8238. What followed was not
        a war in the conventional sense but a four-hundred-year guerrilla campaign fought across the shadowed mountains
        and tunnels of Tatara. The rebellion ended only with the destruction of <strong>Kuroi Yama</strong> — the Onyx
        Clan&#39;s fortress mountain — though Kokuryū himself escaped. The dragon was never captured, never killed, and
        never seen again.</p>

        <p>Tenryū no Mikado died in the year 8694. His son, <strong>Ryūhiko no Mikado</strong>, was already 794 years
        old when he ascended the throne. The imperial dynasty was established, and the long peace began.</p>
      markdown: ''

  - _id: griBORgX4Zj9t9tT
    _key: '!journal.pages!JBrSdiECB8Mb9qgI.griBORgX4Zj9t9tT'
    name: The Golden Age — 8611–13050
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >
        <p>For nearly four and a half thousand years, Kagekuni flourished.</p>

        <p>Eight emperors reigned across the Golden Age: <strong>Tenryū</strong>, <strong>Ryūhiko</strong>,
        <strong>Seiryū</strong>, <strong>Byakuryū</strong>, <strong>Kinryū</strong>, <strong>Shoryū</strong>,
        <strong>Inaryū</strong>, and <strong>Kōryū</strong>. Under their rule, the archipelago achieved a level of
        civilisation, artistic refinement, and magical sophistication that has never been equalled.</p>

        <p>The great constructions of the Golden Age defined the physical landscape of the empire. The <strong>Imperial
        Palace</strong> in @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.Zk6QD9Sdfud4SuRV]{Heian} became the
        architectural heart of the nation. The <strong>Great Library</strong> at Seirei Mizuumi on Kawa gathered the
        accumulated knowledge of civilisation under one roof. The <strong>Grand Canal</strong> of Mizushima connected
        inland waterways into a navigable system spanning provinces. The <strong>Hoshino Tō</strong> — a grand
        observatory — rose on the slopes of <strong>Shirogane Yama</strong>, and the <strong>Kokuyō Ryūkyūjō</strong>
        fortress on Tatara brought order to the Onyx Clan&#39;s former territory. The <strong>Emperor&#39;s
        Highway</strong>, completed in 11248, extended from Heian in three directions, and to this day everything
        important in Hokori is measured by its distance from that road.</p>

        <p>Sei — the magic energy flowing through all living things — was fully accessible and deeply understood.
        Seimasters studied with the rigour of astronomers, supported by institutions whose traditions stretched back to
        the dragon clans themselves. Architecture incorporated magical principles. Agriculture was enhanced by
        sei-attuned cultivation. The boundary between the natural and the supernatural was not a line but a gradient,
        and the educated classes moved through both with fluency.</p>

        <p>It could not last. Nothing built on that scale ever does.</p>
      markdown: ''

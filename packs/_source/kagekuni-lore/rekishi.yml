  - _id: hsFCgQEKY5316IrW
    _key: '!journal.pages!JBrSdiECB8Mb9qgI.hsFCgQEKY5316IrW'
    name: The Era of New Discovery — 15691–15757
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >
        <p>The Jinshō Reformation stabilised the empire. What followed was the discovery that the empire was not
        alone.</p>

        <p>In 15691, an expedition led by Admiral <strong>Taira no Akinori</strong> and General <strong>Tokugawa no
        Ryūji</strong>, with diplomat <strong>Hōjō no Kaoru</strong> as its political voice, sailed beyond the known
        waters of the Raijin no Fukai sea and discovered lands beyond Kagekuni. They returned with slaves, precious
        metals, new knowledge, and the unsettling revelation that the world was larger than anyone had imagined.</p>

        <p>Over the next sixty years, more than 150 expeditions followed. The discoveries were transformative — and
        destabilising. New wealth poured into the archipelago, but it flowed unevenly. Clans with naval reach grew rich.
        Clans without it watched their neighbours outpace them. Rivalries that had simmered for centuries found new
        fuel.</p>

        <p>The Emperor responded by appointing <strong>Minamoto no Katsuro</strong> of the Tenshiko Clan as Shōgun
        around 16012. Katsuro enacted a series of regulatory acts — the <strong>Expedition Regulation Act</strong>, the
        <strong>Resource Distribution Act</strong>, the <strong>Peace and Mediation Act</strong>, and the
        <strong>Defence Enhancement Act</strong> — that imposed order on the chaos. When the crisis passed, the
        Shogunate retired voluntarily. Hōjō no Kaoru was appointed the first <strong>Gaikō Daijin</strong> (Minister of
        Foreign Affairs), extending the Kokushi Kyōkai to five ministers.</p>
      markdown: ''

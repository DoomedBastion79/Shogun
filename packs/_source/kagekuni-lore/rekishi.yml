  - _id: AGn3Uo9u54CEVvBD
    _key: '!journal.pages!JBrSdiECB8Mb9qgI.AGn3Uo9u54CEVvBD'
    name: The Great Awakening — 16620–Present
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >+
        <p>Magic officially returned to the world around the year 16687, though the process had been building for
        decades. The Great Awakening was not a single moment but a threshold — the point at which sei became reliably
        accessible to trained practitioners rather than appearing only in rare Talents born with innate ability.</p>

        <p>The daimyō moved quickly. Every clan began recruiting mages into their service. The magical institutions that
        had emerged during the era of Talents suddenly found themselves courted rather than feared.
        <strong>Seishin</strong> expanded from an enclave into a city. Magical study became a path to advancement rather
        than a mark of suspicion.</p>

        <p>But the world that magic returned to was not the world it had left. The institutions, the knowledge, the
        scholarly traditions of the Golden Age were gone. The current generation of practitioners is rebuilding from
        fragments — studying sei with the tools of a civilisation that lost three thousand years of progress. They are
        learning fast, but they are learning without teachers, and the gaps in their understanding are significant.</p>

        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>DM Note — The True Cause of the Great Awakening</strong></p>

        <p>The Great Awakening was not a natural restoration of cosmic balance. It was the consequence of waking a
        single malevolent Progenitor.</p>

        <p><strong>Murasakiryū</strong> — the Amethyst Dragon — was awakened by dark mortals who believed they were
        performing a ritual to rouse <strong>Kokuryū</strong> (the Onyx Dragon). They were wrong about which dragon they
        found. Murasakiryū woke, and the dragon is now <strong>actively masquerading as Kokuryū</strong> — pretending to
        be the Onyx Dragon while pursuing its own agenda.</p>

        <p>The moment of Murasakiryū&#39;s waking corresponds to the Great Awakening. Every sei user in Kagekuni draws
        power through the Amethyst Dragon&#39;s waking awareness. The implications of this are staggering and entirely
        unknown to the world at large.</p>

        <p><strong>Kinryū</strong> (the Golden Dragon) would serve as the natural counterbalance to Murasakiryū. The
        assassination of
        <strong>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.Tpou815uKS3CU4HS]{Solas
        Evergreen}</strong> — a member of the Order of the Ancient Guard — was a deliberate act to prevent Kinryū&#39;s
        awakening. The cipher leading to methods for waking the Golden Dragon now rests with <strong>Relc</strong>, who
        may not fully understand what he carries.</p>


        </section>


  - _id: ZlNudOOFCoGtAqNO
    _key: '!journal.pages!JBrSdiECB8Mb9qgI.ZlNudOOFCoGtAqNO'
    name: The Long Dark — 13088–15642
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >+
        <p>The disappearance of sei was not a sudden event but a slow bleeding that scholars only recognised in
        retrospect. By the time the war ended and the empire looked up from its wounds, the bleeding was
        catastrophic.</p>

        <p>The secondary stars in the sky — <strong>Susanoo</strong> and <strong>Tsukuyomi</strong> — had been fading.
        Within decades of the war&#39;s end, both had crossed below naked-eye visibility. The night sky, which had
        burned with three stars for all of recorded history, now held only the golden light of
        <strong>Amaterasu</strong>. The other two were simply gone.</p>

        <p>With them went the complex magical expressions that had sustained civilisation. Healing failed.
        Transformation magic fell silent. What remained was Amaterasu&#39;s baseline: enough sei to sustain life,
        agriculture, and the physical world, but not enough to power the institutions, the architecture, or the
        knowledge systems that the Golden Age had built.</p>

        <p>The collapse was total. Famine swept the archipelago as sei-enhanced agriculture reverted to conventional
        farming on land that could not support the populations the Golden Age had sustained. Disease followed famine.
        The population of the archipelago fell by nearly half. The <strong>Temple of Ōryūzan Tenkū-ji</strong> — one of
        the great institutions of the Golden Age — fell in 13088, its surviving worshippers departing into an empire
        that no longer had use for their knowledge.</p>

        <p>The Dark Ages lasted approximately three thousand years. Little documentation survives. Entire cities were
        abandoned to silence and weather. The knowledge of sei, the scholarly traditions, the institutional memory of
        how magic worked and what it meant — all of it was lost. The world that emerged on the other side was not the
        same world that had entered the darkness.</p>

        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>DM Note — The Great Aphelion</strong></p>

        <p>The sei drought was not caused by the war or by any mortal action. It was a cosmological event.</p>

        <p>The three stars of the Miyosai trinary system orbit a common gravitational centre on independent orbital
        inclinations. Once in recorded history, all three reached maximum mutual distance simultaneously — the
        <strong>Great Aphelion</strong>, approximately 14344. Amaterasu, carrying Seizan with it, swung to one extreme
        of its barycentric arc while Susanoo and Tsukuyomi retreated to opposing extremes on their own inclined planes.
        The distances compounded geometrically.</p>

        <p>Amaterasu never went dark — its baseline sei sustained life throughout. But the complex magical expressions
        that depended on the full trinary system became inaccessible. The dark ages were cultural and intellectual
        collapse, not extinction.</p>

        <p>The Progenitor dragons entered their slumber during this same period. Whether the aphelion caused the
        slumber, the slumber caused the sei drought, or both share a common cause remains unknown — even to the Order of
        the Ancient Guard.</p>

        <p>No living scholar has assembled the complete picture. The data exists in fragmentary astronomical records
        across multiple institutions, but no one has connected the dots. The Golden Dragon Clan&#39;s observatory at
        Ōryūzan Tenkū-ji contained the most complete model of the Miyosai system ever constructed — a mechanical and
        arcane orrery capable of projecting celestial positions across millennia. It has not been operational since the
        temple fell.</p>


        </section>

      markdown: ''

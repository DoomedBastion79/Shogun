  - _id: 2f8TDTtBwTNn5rL9
    _key: '!journal.pages!JBrSdiECB8Mb9qgI.2f8TDTtBwTNn5rL9'
    name: The War of Fractured Banners — 13050–13088
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >
        <p>The Golden Age ended in blood.</p>

        <p>The spark was Tatara. The eternal feud between the <strong>Zirak</strong> and <strong>Glimfyr</strong> —
        dwarves and gnomes sharing an island neither was willing to surrender — had been managed for millennia through
        imperial intervention. When that intervention weakened, the feud spread. What began as a regional conflict
        metastasised into empire-wide war as clans chose sides, old grievances resurfaced, and the bonds that had held
        civilisation together for four thousand years snapped one by one.</p>

        <p>Emperor <strong>Kōryū no Mikado</strong> was slain on the battlefield in 13053 — the first emperor to die in
        combat in the empire&#39;s history. His son, <strong>Ryūjin no Mikado II</strong>, ascended the throne and made
        the decision that would shape the next era: he established the <strong>Shogunate</strong>, appointing
        <strong>Kazutaka no Kazuhiko</strong> as the first Shōgun — supreme military commander with the authority to
        compel obedience from the daimyō.</p>

        <p>The war raged across the archipelago. The <strong>Defence of Midoriko</strong>, the <strong>Pursuit to
        Kumoji</strong>, the <strong>Campaign in Tatara</strong>, the <strong>Burning of Shirotsuru</strong>, the
        <strong>Siege of Fushichō</strong>, the <strong>Ambush at Tatsumaki Gorge</strong>, and the <strong>Battle of
        the Thunder Plains</strong> — each left its mark on the land and the people who survived it. Two clans — the
        <strong>Seiryū</strong> and the <strong>Hagane</strong> — were destroyed entirely, their names erased from the
        rolls of the living.</p>

        <p>The war ended in 13062. But something else ended with it — something no one understood at the time.</p>

        <p>Magic vanished.</p>
      markdown: ''

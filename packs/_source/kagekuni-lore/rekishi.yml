  - _id: n5D1r0d7mNLTdfRp
    _key: '!journal.pages!JBrSdiECB8Mb9qgI.n5D1r0d7mNLTdfRp'
    name: The Return of Talents — 15757–16620
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >
        <p>The stars were coming back. No one knew it yet.</p>

        <p>Around 15757, a child was born in Kagekuni with the ability to call lightning from clear air. His name was
        <strong>Hikari no Kenta</strong>, and he was the first known <strong>Talent</strong> — an individual born with
        innate magical ability in a world that had not seen magic in over three thousand years.</p>

        <p>The reaction was not welcoming. Kenta was feared, studied, and eventually persecuted. He was not alone for
        long — other Talents emerged across the archipelago, each manifesting different abilities without training,
        without teachers, and without a society that had any framework for understanding what they were. Many were
        hunted. Many formed underground communities for survival.</p>

        <p>Notable Talents of this era included <strong>Mizuki no
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.eAI9SnbW1RmsWOGw]{Hana}</strong>
        of Clan Gekkō, who manifested shadow magic, and <strong>Fujimoto no Aiko</strong> of Clan
        Ryū@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.D2VV9bFa1txuKDxB]{kaze},
        who could manipulate wind. The <strong>Seishin Enclave</strong> was founded on the island of Unmeijima as a
        place of study and refuge for Talents — it eventually grew into the city of <strong>Seishin</strong>, the
        premier magical research institution in Kagekuni. <strong>Hikari no Shizuku</strong>, a healing and light magic
        tradition, established itself within the imperial capital of
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.Zk6QD9Sdfud4SuRV]{Heian}.</p>
      markdown: ''
    video:
      controls: true
      volume: 0.5

  - _id: XVgBI7LWoHhX4u4m
    _key: '!journal.pages!JBrSdiECB8Mb9qgI.XVgBI7LWoHhX4u4m'
    name: The Epoch of Factional Flux — 16204–16434
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >
        <p>The return of magic coincided with a period of intense political reorganisation. Over two centuries, the clan
        structure of Kagekuni was remade.</p>

        <p>The <strong>Hōjō Clan</strong> tore itself apart in civil war, and the survivors merged with the
        <strong>Minamoto Clan</strong> to form <strong>Clan Kaminari</strong> — named in honour of Raijin, the spirit of
        thunder. <strong>Clan
        Ryū@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.D2VV9bFa1txuKDxB]{kaze}</strong>
        absorbed smaller clans and became dominant in the northwest. The <strong>Yamamoto Clan</strong> splintered. The
        <strong>Ishikawa Clan</strong> dissolved entirely, and from its remnants the mercenary <strong>Clan
        Tetsujin</strong> emerged.</p>

        <p>The political map that exists today — the alliances, the rivalries, the independent clans — was drawn during
        this period.</p>
      markdown: ''
    video:
      controls: true

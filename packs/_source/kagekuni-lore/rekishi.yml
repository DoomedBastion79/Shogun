  - _id: HKxDepcO9otaGDjD
    _key: '!journal.pages!JBrSdiECB8Mb9qgI.HKxDepcO9otaGDjD'
    name: The Post-Imperial Crisis — 16732–Present
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >+
        <p>The current crisis did not begin with war. It began with a reform.</p>

        <p>In <strong>16732</strong>, Emperor <strong>Ryūjin no Mikado</strong> — the eighteenth emperor, the last of
        the near-immortal Arcadian line — decreed that the Kokushi Kyōkai could no longer appoint a Shōgun without
        imperial approval. It was a safeguard. It may also have been a warning.</p>

        <p>Seven years later, in <strong>16739</strong>, Ryūjin died. The official cause was old age. He was the final
        link to an unbroken chain of rulers stretching back over eight thousand years. No confirmed successor has
        emerged. Multiple claimants have presented genealogical proof of varying credibility. None has secured
        recognition.</p>

        <p>The Shogunate — the military authority that has historically held the empire together during periods of
        crisis — is legally frozen. There is no emperor to approve a Shōgun, and no Shōgun to impose order.</p>

        <p>In <strong>16742</strong>, war erupted between the <strong>Genso Alliance</strong> and the <strong>Arashi
        Alliance</strong>. Two years of escalating hostility have produced no decisive outcome. Three independent clans
        — <strong>Kaminari</strong>, <strong>Kurohana</strong>, and <strong>Gekkō</strong> — hold the balance of power,
        and every faction knows it.</p>

        <p>The year is <strong>16744</strong>. The throne sits empty. The war grinds on. Magic has returned to a world
        that does not fully understand it. And somewhere in the archipelago, things that slumbered during the long dark
        have begun to stir.</p>

        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>DM Note — The Emperor&#39;s Death</strong></p>

        <p>Ryūjin&#39;s death is not what it appears. The official story is old age, but <strong>foul play is
        suspected</strong>. Two independent daimyō —
        <strong>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.1J9hy9Hs6EVuYjyz]{Raijin
        no Kazuhiko}</strong> (Clan Kaminari) and
        <strong>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.nKNKNY1OExtA3Hhh]{Akihiko
        Kurohana}</strong> (Clan Kurohana) — are both quietly investigating the circumstances. Neither has shared their
        suspicions publicly.</p>

        <p>The 16732 reform that froze the Shogunate may have been motivated by Ryūjin&#39;s awareness of threats
        against the imperial line — a last attempt to prevent his enemies from consolidating power after his death.</p>


        </section>


  - _id: AyKENHhpkhoE92Cw
    _key: '!journal.pages!JBrSdiECB8Mb9qgI.AyKENHhpkhoE92Cw'
    name: The Jinshō Reformation — 15642–15691
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >
        <p>Recovery, when it came, was not magic returning. It was a single emperor deciding that the empire would not
        die quietly.</p>

        <p><strong>Jinshin no Mikado</strong> ascended the throne in 15642 and enacted sweeping reforms that dragged
        Kagekuni back from the edge. Agricultural revival came first — new cultivation techniques, land redistribution,
        irrigation projects that did not rely on sei. Infrastructure followed — roads rebuilt, bridges repaired,
        harbours dredged. Trade stimulation reopened routes that had been abandoned for centuries. An educational
        revival rebuilt the scholarly institutions, and the <strong>Great Library</strong> — destroyed by an earthquake
        during the dark ages — was partially restored.</p>

        <p>Jinshin also established the <strong>Kokushi Kyōkai</strong> in its recognisable modern form, creating the
        positions of <strong>Seimu Daijin</strong> (Minister of Administration) and <strong>Zaiumu Daijin</strong>
        (Minister of Finance) to manage the empire&#39;s civilian machinery. The framework he built — imperfect,
        incomplete, but functional — is the same framework that governs Kagekuni today, eight hundred years later.</p>
      markdown: ''

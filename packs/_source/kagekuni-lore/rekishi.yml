  - _id: jk1eGz67Jff4KByd
    _key: '!journal.pages!JBrSdiECB8Mb9qgI.jk1eGz67Jff4KByd'
    name: Age of Dragons — Before ~8000
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >
        <p>Before there were emperors, before there were clans, before there were borders drawn on maps or roads cut
        through mountains — there were dragons.</p>

        <p>Seven dragon clans ruled the archipelago of Kagekuni, each sovereign over its own island or territory. Their
        domains were not kingdoms in the human sense but spheres of influence, shaped by the nature of each dragon and
        the land they inhabited. The Crimson Clan held the volcanic island of Fushichō. The Azure Clan commanded the
        waters around Kawa. The Emerald Clan tended the forests and plains of Hokori. The Onyx Clan ruled from Tatara in
        shadow and cunning. The Golden Clan mediated from the highlands of central Hokori. The Silver Clan kept the cold
        northern waters and the island of Fuukajima. The Amethyst Clan studied the arcane from Shizukajima.</p>

        <p>The earliest mortal settlers arrived in this world and found it already governed. They did not conquer — they
        integrated. The first communities paid tribute to their local dragon clan, adopted their customs, and in time
        became part of the social fabric the dragons had built. Intermingling between dragonborn, humans, and the
        founding clans produced the near-immortal Arcadian leaders who became the first daimyō — mortal rulers who
        carried draconic blood in their veins and governed with the implicit blessing of the dragons above them.</p>

        <p>Over centuries, the dragons gradually withdrew from direct rule. Whether this was a deliberate abdication, a
        slow retreat into contemplation, or something else entirely depends on which account you trust. By the time the
        first emperor rose, the dragons had become figures of reverence rather than governance — still present in memory
        and tradition, but no longer sitting at the head of the table.</p>
      markdown: ''

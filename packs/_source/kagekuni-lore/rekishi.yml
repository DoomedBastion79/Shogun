  - _id: 1hGQVTw4YHzlkPF6
    _key: '!journal.pages!JBrSdiECB8Mb9qgI.1hGQVTw4YHzlkPF6'
    name: The Peasant Uprising — 16442–16461
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >
        <p>Not all upheaval came from above. In 16442, a crackdown in Midoriko village sparked a peasant uprising that
        spread across multiple provinces. The emperor appointed <strong>Takeda no Hiroshi</strong> as Shōgun in 16443 to
        restore order. But this was not a rebellion that could be solved by swords alone. In 16453, the emperor created
        the position of <strong>Fukushi Daijin</strong> (Minister of Welfare) and appointed <strong>Hayashi no
        Haruto</strong> to address the underlying grievances — healthcare, education, and public assistance for the
        common people.</p>

        <p>A combined military and diplomatic approach ended the uprising in 16461. The Shogunate again retired when its
        purpose was fulfilled.</p>
      markdown: ''
    video:

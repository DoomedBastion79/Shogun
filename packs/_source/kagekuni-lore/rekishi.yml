  - _id: a2LjDu5GOhtcLgof
    _key: '!journal.pages!JBrSdiECB8Mb9qgI.a2LjDu5GOhtcLgof'
    name: History of Kagekuni
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >
        <p>The archipelago&#39;s recorded history stretches back more than eight thousand years — and its unrecorded
        history stretches back further still. What follows is the account as it is understood by scholars, priests, and
        the educated classes of Kagekuni. Some of it is reliable. Some of it is myth layered over truth. Some of it is
        truth layered over something deeper that no one alive fully remembers.</p>

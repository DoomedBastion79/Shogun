  - _id: tnwWBmUDOrJSHIE5
    _key: '!journal.pages!JBrSdiECB8Mb9qgI.tnwWBmUDOrJSHIE5'
    name: The Plague Campaign of Kuroyami — 16609–16616
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >
        <p>The defining trauma of the post-Awakening era.</p>

        <p><strong>Kuroyami no Akuma</strong> — born Takeda no Arata — discovered a necromantic tome in the cursed
        <strong>Kuroshi Temple</strong> on the haunted island of <strong>Yūrei</strong>. What he found there transformed
        him. He established the <strong>Eikyū Yami Clan</strong> — a cult of death — and raised armies of the undead.
        For seven years, his legions waged war across the archipelago, leaving devastation and plague in their wake.</p>

        <p>The response united unlikely allies. Shōgun <strong>Minamoto no Katsuro</strong> was appointed in 16610 and
        made the unprecedented decision to recruit Talents — magical individuals the empire had spent centuries
        marginalising — into the war effort. The magical enclaves of <strong>Seishin</strong>, the
        <strong>Raimeiin</strong>, and the <strong>Forest of Spirits</strong> revealed themselves publicly for the first
        time, stepping out of the shadows to defend the world that had persecuted them.</p>

        <p>Kuroyami was defeated. He was <strong>never captured or killed</strong>. His cult, the Eikyū Yami Clan,
        persists in some form. The question of where Kuroyami is — and what he has been doing for the last 128 years —
        is one that very few people ask aloud.</p>

    image: {}
    text:
      format: 1
      content: >
        <p>The Shrouded Isles rise from the Raijin no Fukai sea beneath three stars. This is Kagekuni — an archipelago
        of mist-veiled mountains, bamboo forests that stretch beyond sight, and castle towns where paper lanterns sway
        above streets of packed earth. It is a land shaped by earthquakes and typhoons, by the pull of four moons on
        restless tides, and by the ancient hierarchies of emperor, shogun, and clan. Here, honour is not a sentiment but
        a currency — earned through duty, spent through sacrifice, and lost in ways that can never be recovered. The
        samurai who kneels before their daimyō, the merchant who bows lower still, the priest who tends a shrine at the
        edge of a forest where the trees have bark of burnished bronze — each knows their place in an order older than
        memory, and each carries the weight of what that place demands.</p>

        <p>For three thousand years, the world forgot magic. The energy called sei — once woven through every living
        thing, every river, every breath of wind — fell silent, and with it the knowledge, the institutions, and the
        traditions that had shaped civilisation for millennia. That silence ended fifty-one years ago. Sei has returned.
        The stars burn bright again in unfamiliar constellations, and across Kagekuni a generation is learning to wield
        power that their grandparents believed was myth. But the world that magic left behind did not stand still. Old
        rivalries hardened into new hatreds. Sacred places fell to ruin. Things that slumbered in the dark ages have
        begun to stir. You arrive in this world at the edge of what comes next — when the questions of what was lost,
        what survived, and what is waking matter more than they have in living memory.</p>

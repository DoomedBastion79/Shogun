        <section class="kg-tier kg-tier-intro" data-tier="intro"><dl class="kg-infobox" data-kind="infobox"><div
        class="kg-info__row"><dt>Type</dt><dd data-field="type">core</dd></div></dl><p>Seven planets orbit Amaterasu,
        travelling with the primary star as it traces its own path through the Miyosai system. Their positions relative
        to Seizan shift in predictable patterns — the movements of siblings sharing a common parent rather than
        independent wanderers. Astronomers at Seishin track their orbits with precision, and the agricultural, maritime,
        and spiritual calendars of Kagekuni all reference planetary positions for timing and omen-reading.</p>

        <h2 id="kg-the-inner-worlds" data-section="the-inner-worlds">The Inner Worlds</h2>

        <h3 id="kg-akahoshi" data-section="akahoshi">Akahoshi</h3>

        <p><strong>Translation:</strong> —

        <strong>Position:</strong> Innermost planet

        <strong>Character:</strong> A molten world locked in perpetual proximity to Amaterasu. Akahoshi is visible in
        daylight as a faint crimson point — the only planet that can be observed without waiting for darkness.
        Astrologers consider it a marker of urgency and immediacy. Its transits across Amaterasu&#39;s face are tracked
        as timing indicators for short-term decisions.</p>

        <h3 id="kg-akasa-red-sand" data-section="akasa-red-sand">Akasa — Red Sand</h3>

        <p><strong>Translation:</strong> Red Sand

        <strong>Position:</strong> Second from Amaterasu

        <strong>Character:</strong> A crimson desert world, dry and wind-scoured. Akasa&#39;s influence on Seizan is
        primarily atmospheric — during <strong>Tatsunami</strong>, its orbital position correlates with shifts in
        weather patterns that amplify or dampen the tidal convergence. Whether this is gravitational, sei-related, or
        coincidental remains debated at Seishin.</p>

        <h3 id="kg-asahikawa-river-of-dawn" data-section="asahikawa-river-of-dawn">Asahikawa — River of Dawn</h3>

        <p><strong>Translation:</strong> River of Dawn

        <strong>Position:</strong> Third from Amaterasu (Seizan&#39;s inner neighbour)

        <strong>Character:</strong> Golden and highly reflective — Asahikawa is the brightest object in Seizan&#39;s
        morning sky, visible before sunrise as a steady golden point. It is called the herald of celestial events
        because its position relative to the three stars often signals upcoming astrological shifts before they become
        apparent in weather or sei. Navigators and astronomers prize it as a reference point.</p>

        <h2 id="kg-seizan-the-balance-point" data-section="seizan-the-balance-point">Seizan — The Balance Point</h2>

        <p><strong>Position:</strong> Fourth from Amaterasu</p>

        <p>Our world. Seizan sits at the habitable heart of Amaterasu&#39;s planetary family — close enough for warmth,
        far enough for temperance. Its four moons, its complex tidal patterns, and its position within the trinary
        stellar system give it the most elaborate celestial environment of any world in the Miyosai system.</p>

        <h2 id="kg-the-outer-worlds" data-section="the-outer-worlds">The Outer Worlds</h2>

        <h3 id="kg-shizukanami-silent-wave" data-section="shizukanami-silent-wave">Shizukanami — Silent Wave</h3>

        <p><strong>Translation:</strong> Silent Wave

        <strong>Position:</strong> Fifth from Amaterasu (Seizan&#39;s outer neighbour)

        <strong>Character:</strong> A frozen ocean world — its surface is a cracked and ancient sheet of ice over a
        deep, still sea. Shizukanami is gravitationally linked to Seizan&#39;s moon Ryūgetsu; the two bodies influence
        each other&#39;s orbital behaviour in ways that make both difficult to predict independently. Under
        Susanoo&#39;s blue-white light, Shizukanami takes on an eerie blue glow visible to the naked eye.</p>

        <h3 id="kg-krigami-god-of-ice" data-section="krigami-god-of-ice">Kōrigami — God of Ice</h3>

        <p><strong>Translation:</strong> God of Ice

        <strong>Position:</strong> Sixth from Amaterasu

        <strong>Character:</strong> A world of eternal winter — vast, pale, and silent. Kōrigami&#39;s influence on
        Seizan is most felt during <strong>Shinmyōji</strong>, when its orbital position reaches peak proximity and
        winter severity across Kagekuni intensifies. The luminescent mists that settle over the islands during Shinmyōji
        are attributed to Kōrigami&#39;s presence, though the mechanism is not understood.</p>

        <h3 id="kg-yamiyo-eternal-night" data-section="yamiyo-eternal-night">Yamiyo — Eternal Night</h3>

        <p><strong>Translation:</strong> Eternal Night

        <strong>Position:</strong> Outermost planet

        <strong>Character:</strong> The most distant world in the Miyosai system, trailing in permanent shadow at the
        edge of Amaterasu&#39;s reach. Yamiyo is associated with shadow magic — practitioners of concealment, illusion,
        and darkness-aspected sei report increased potency when Yamiyo is well-positioned. When Yamiyo aligns with
        Tsukuyomi, a phenomenon called <strong>Shadow Resonance</strong> occurs, during which shadow magic reaches its
        absolute peak and the boundary between the material and spirit worlds thins perceptibly.</p>

        <section class="secret">


        <h3 id="kg-dm-note-planets-and-the-great-aphelion" data-section="dm-note-planets-and-the-great-aphelion">DM Note
        — Planets and the Great Aphelion</h3>

        <p>Because the planets orbit Amaterasu and travel with it, <strong>the seven planets did not participate in the
        Great Aphelion</strong>. Their positions relative to Seizan shifted only in their normal orbital patterns
        throughout the entire drought period. In the Tenkū-ji orrery, this is visible and striking: the planetary
        armatures continue their normal motion while the two secondary stellar arms go dark. The machine keeps working,
        the planets keep moving — two of the three stars are simply not where they should be.</p>

        </section></section>

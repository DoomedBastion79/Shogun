      content: >
        <p><strong>The Monastery of the Black Lily</strong> -- Dark stone and iron construction; austere; functional
        rather than beautiful. The Order of the Black Lily operates here -- Kagekuni&#39;s premier training facility for
        infiltration specialists, covert intelligence operatives, and precision agents.</p>

        <p>The Order&#39;s relationship with Clan Gekko was long and close. The disappearance of Clan Gekko has severed
        the primary institutional support structure. They are reassessing.</p>

        <p>The monks and initiates know the truth about the Nagaji transformation. They have made a calculated decision
        to not release this information without a reversal plan. They will share the complete truth with parties who
        demonstrate they are positioned to actually address the situation.</p>

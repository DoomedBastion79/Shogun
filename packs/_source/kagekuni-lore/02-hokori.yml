        <section class="secret">


        <h4 id="kg-dm-note-mizu-secrets" data-section="dm-note-mizu-secrets">DM Note — Mizu Secrets</h4>

        <p><strong>Kōriwara</strong>: Elder Sato Hideaki is a mid-rank member of the Order of the Sacred Grove who
        interacted directly with Solas Evergreen. He knows Solas was Ancient Guard. One of the three cipher poem stones
        is near the village.</p>

        <p><strong>Arashi Naval Build-up</strong>: Minato-jō&#39;s Arashi-aligned clan has been quietly building naval
        capacity beyond defensive requirements — someone is planning an offensive operation involving the western
        sea.</p>

        <p><strong>Tidal Caves of Umigakure</strong>: Deep sea caves accessible only during compound low tides. Light
        has been observed from the deep interior during night tides — a new phenomenon not present three months ago.</p>

        </section>


        <h2 id="kg-province-of-nami-the-eastern-storm" data-section="province-of-nami-the-eastern-storm">Province of
        Nami — The Eastern Storm</h2>

        <p>Nami sits on the northeastern tip of Hokori, facing the unabated ocean without shelter. Kusa lies to the
        southwest and Kaze to the southeast. Its shores receive the full force of oceanic weather systems — storms that
        have built across open water for thousands of miles. Every structure is built low and heavy, walls thick, roofs
        angled away from prevailing winds, shutters reinforced with iron. During Tatsunami season, storm swells overwash
        lower coastal roads entirely, and some villages are evacuated to higher ground as standard annual
        precaution.</p>

        <p>The coastline is rugged and often spectacular — dramatic sea cliffs dropping to churning water, narrow
        beaches of black volcanic sand between rocky headlands, sea arches and stacks in the offshore shallows. The
        <strong>Stormwatch Cliffs</strong> at the province&#39;s northern reach are the highest sea cliffs on Hokori; on
        clear days, Kawa island is visible in the distance. The <strong>Eastern Lighthouse Chain</strong> runs the
        length of the coast — signal towers and navigational aids, some with stone bases that predate recorded history.
        The interior rises quickly from the coastal cliffs into the eastern slopes of Hokori&#39;s central
        highlands.</p>


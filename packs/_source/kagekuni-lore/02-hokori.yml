        <p>Hana&#39;s culture is the closest to the old imperial ideal — formal, ceremonially rich, and deeply aware of
        its historical weight. The Bronze Wood trade defines the province&#39;s economy, with seidōrin timber commanding
        extraordinary prices across the archipelago. Fishing on the Serenia-kai and the Kinryūgawa sustains the rural
        population, particularly the gold-tail fish (<em lang="ja-Latn">kinuo</em>) that is prized as a delicacy in
        Heian.</p>

        <section class="secret">


        <h4 id="kg-dm-note-hana-secrets" data-section="dm-note-hana-secrets">DM Note — Hana Secrets</h4>

        <p><strong>The Buried City of Kinkōkyo</strong>: The Golden Dragon Clan&#39;s capital survives structurally
        intact beneath the Tenchūsan Ren, sealed under hundreds of feet of rock. The gold doors at the temple entrance
        are an outer access point, exposed by a recent earthquake. The Bronze Wood Forest&#39;s metallic quality comes
        from groundwater flowing through golden veins in Kinkōkyo&#39;s buried infrastructure for thousands of
        years.</p>

        <p><strong>Kinryū no Hikari</strong>: A golden mirror deep within Kinkōkyo — not a weapon but a communication
        device allowing direct communion with the living Golden Dragon, Kinryū.</p>

        <p><strong>Hiroshi Nakamura</strong>: The Shugo of Heian is a traitor feeding intelligence to an outside party.
        His brother Hideo does not suspect.</p>

        </section>


        <h2 id="kg-province-of-hi-the-volcanic-frontier" data-section="province-of-hi-the-volcanic-frontier">Province of
        Hi — The Volcanic Frontier</h2>

        <p>Hi is the most geologically violent province on Hokori — a region of active volcanism, fumarole fields,
        obsidian plains, and mountains that periodically tear themselves apart. It encompasses the majority of the
        island&#39;s western side, surrounded by mountains and the sea. Tsuchi borders it to the southeast, Hana shares
        a small stretch of its eastern border, Sora encompasses its northern boundary, and Mizu sits along its western
        edge. Earthquakes are ambient. Residents learn to read tremors the way sailors read wind.</p>

        <p><strong>Enshiyama</strong> (Flame Peak Mountain), the third highest peak on Hokori, rises from the
        province&#39;s northern reaches and dominates the local landscape. The terrain is dramatic and hostile — black
        obsidian fields stretch for miles where ancient lava flows cooled and cracked, fumarole vents release sulphurous
        steam — yet the volcanic ash enriches the soil beyond anything in the southern provinces. Terraced farming on
        the slopes between active zones produces crops of startling quality. This contradiction — death and abundance in
        tight proximity — defines Hi&#39;s character.</p>

        <p>The <strong>Honogawa</strong> (Flame River) originates from a thermal lake near Enshiyama&#39;s base and is
        warm to the touch for its entire upper reach. The <strong>Obsidian Fields of Kurosō</strong> yield volcanic
        glass of exceptional quality, prized for blades and lenses. Deep in the highlands stands the <strong>Crimson
        Shrine</strong> — predating the empire, never absorbed into the imperial religious system, its torii carved from
        natural red stone.</p>


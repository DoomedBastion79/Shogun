        <section class="secret">


        <h4 id="kg-dm-note-kusa-secrets" data-section="dm-note-kusa-secrets">DM Note — Kusa Secrets</h4>

        <p><strong>Forest of Spirits</strong>: During the Dark Ages, the faction didn&#39;t just survive in the Yōsei
        Mori — they studied. They hold records and findings about sei behaviour during the magic-absent era that would
        upend current seimaster orthodoxy.</p>

        <p><strong>The Whispering Flats</strong>: The sounds are sei resonance from a buried pre-imperial site beneath —
        possibly connected to the Emerald Dragon Clan (Midoryū). The violet grass grows most densely directly over
        it.</p>

        </section>


        <h2 id="kg-province-of-mizu-the-western-shore" data-section="province-of-mizu-the-western-shore">Province of
        Mizu — The Western Shore</h2>

        <p>Mizu is a province of water in all its forms — crashing coastal surf, wide navigable rivers, reed-choked
        estuaries, tidal flats that stretch for miles at low compound tide, and interior lakes fed by reliable rainfall.
        It wraps around the northwestern string of mountains on Hokori, with Hi to the southeast, Sora along its eastern
        and southern borders, and Kusa to the northeast. The Raijin no Fukai sea drives against its western and northern
        coastline with consistent force. The <strong>Kōri-no-Mori</strong> forest — a dense woodland where natural trees
        grow intermixed with crystal trees whose pale trunks chime faintly in the wind — occupies its northern
        shores.</p>

        <p>The coastline is irregular and complex — headlands, sheltered coves, sea-stacks, and natural harbours. The
        <strong>Shirakawa Estuary</strong> (White River Estuary) is one of the largest navigable estuaries in the
        archipelago, with the city of <strong>Minato-jō</strong> occupying a raised headland at its mouth. Inland, rice
        production in Mizu&#39;s river valleys is among the highest in the archipelago.</p>


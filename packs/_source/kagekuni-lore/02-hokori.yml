        <p>Hi&#39;s people are laconic, practical, and possess a dark humour about their circumstances. They do not flee
        volcanic activity — they have developed sophisticated systems for reading, mitigating, and living alongside it.
        The province is currently in contested administration; the previous governing clan was lost in the opening
        engagements of the Arashi-Genso war, and neither alliance has installed a replacement.</p>

        <section class="secret">


        <h4 id="kg-dm-note-hi-secrets" data-section="dm-note-hi-secrets">DM Note — Hi Secrets</h4>

        <p><strong>The Crimson Shrine</strong>: Keeper Tsubaki (Initiate, Order of the Ancient Guard, ~60 years of
        service) communicates with something through the shrine&#39;s ember-bowl. She knows Akaryū (Crimson Dragon) is
        alive but does not know the dragon&#39;s location.</p>

        <p><strong>Enshiyama</strong>: The current low-level activity is a precursor to a significant eruption within
        1–3 years. The political vacuum means no coordinating authority exists for evacuation.</p>

        <p><strong>Western Territories</strong>: Descendants of the Crimson Clan faction that refused Tenryū&#39;s
        unification live in loose tribal confederacies, preserving traditions the rest of the empire forgot.</p>

        </section>


        <h2 id="kg-province-of-kaze-shadows-and-mist" data-section="province-of-kaze-shadows-and-mist">Province of Kaze
        — Shadows and Mist</h2>

        <p>Kaze is a province of shadows and mist. It occupies the eastern side of Hokori&#39;s northeastern leg — Nami
        to the north, Kusa to the west, Hana to the south, and Sora sharing a brief stretch of its southwestern border.
        Sheltered from direct coastal weather by surrounding terrain, it has a microclimate of cool, damp air that never
        fully clears. The province averages fewer clear days per year than any other on Hokori. Its forests — dense
        stands of dark cedar and ancient black pine — grow so thickly that the canopy blocks most sunlight even in
        summer.</p>

        <p>The terrain is mountainous, cut by deep river valleys and narrow gorges. The <strong>Kazeyama Ren</strong>
        (Wind Mountain Range) channels wind up the valleys in complex, disorienting patterns. Sounds carry strangely —
        seeming to come from the wrong direction. The <strong>Kagero River</strong> (Shimmer River) is the primary
        waterway, named for the heat shimmer visible over its surface on rare warm days.</p>

        <p>Clan Gekkō has historically governed Kaze, maintaining careful neutrality through successive political
        upheavals. The clan&#39;s recent disappearance has plunged the province into deep unease. Trade has slowed. The
        provincial administration has stopped communicating with Heian. Small communities have reported strange
        encounters — serpentine figures glimpsed on mountain trails, abandoned buildings showing signs of violent
        disturbance, livestock found dead in unnatural ways.</p>


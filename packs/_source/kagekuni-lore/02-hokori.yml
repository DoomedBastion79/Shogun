        <section class="secret">


        <h4 id="kg-dm-note-tsuchi-secrets" data-section="dm-note-tsuchi-secrets">DM Note — Tsuchi Secrets</h4>

        <p><strong>Grain as Weapon</strong>: The Genso-aligned governing clan has been quietly restricting grain sales
        to Arashi-aligned provinces while maintaining normal trade with neutral parties. A slow-moving economic siege
        that hasn&#39;t become visible yet — when it does, it will escalate the war significantly.</p>

        <p><strong>The Buried Road</strong>: Leads to a pre-imperial site associated with the Emerald Dragon Clan
        (Midoryū) — a &quot;green court&quot; beneath what is now part of the Whispering Flats in the Kusa border
        region. Midoryū is alive and maintains a connection to this buried court.</p>

        </section>


        <h2 id="kg-major-geographic-features" data-section="major-geographic-features">Major Geographic Features</h2>

        <h3 id="kg-mountain-ranges" data-section="mountain-ranges">Mountain Ranges</h3>

        <ul>

        <li><strong>Tenchūsan Ren</strong> (Heavenly Pillar Mountains) — A great range in northeastern Hana. Primary
        land route toward the northern provinces; treacherous in autumn, impassable in winter. Contains significant
        ruins and the entrance to the buried city of Kinkōkyo.</li>

        <li><strong>Kurogane Yama</strong> (Black Iron Mountain) — Second highest peak on Hokori; dominates southern
        Tsuchi province. Old and weathered, less volcanically active than Hi&#39;s peaks but formidable. The surrounding
        mountains are resource-rich with mineral deposits, timber, and quarried stone.</li>

        <li><strong>Kazeyama Ren</strong> (Wind Mountain Range) — Along Kaze province&#39;s borders. Complex
        disorienting wind patterns; the Hollow Peaks.</li>

        <li><strong>Kusayama Ren</strong> (Grass Mountains) — Northern boundary of Kusa; shelters the Yōsei Mori.</li>

        </ul>

        <h3 id="kg-bodies-of-water" data-section="bodies-of-water">Bodies of Water</h3>

        <ul>

        <li><strong>Serenia-kai</strong> (Selenia Sea) — Vast inland sea in eastern Hokori within Hana province; over a
        thousand square miles; complex compound tides.</li>

        <li><strong>Lake Midoriko</strong> — Peninsula setting for Heian; ferry connections.</li>

        <li><strong>Shirakawa Estuary</strong> — Largest navigable estuary in the archipelago; Mizu province.</li>

        </ul>

        <h3 id="kg-rivers" data-section="rivers">Rivers</h3>

        <ul>

        <li><strong>Kinryūgawa</strong> (Gold Dragon River) — Runs faintly gold at dawn; gold-tail fish trade; Hana
        province.</li>

        <li><strong>Midori River</strong> — Primary navigable artery of Kusa; flat-bottomed vessel traffic.</li>

        <li><strong>Tsuchikawa</strong> (Earth River) — Wide, slow, navigable for cargo barges; Tsuchi province&#39;s
        lifeline.</li>

        <li><strong>Honogawa</strong> (Flame River) — Thermal river in Hi; warm to the touch in upper reaches.</li>

        <li><strong>Kagerō River</strong> (Shimmer River) — Kaze&#39;s primary waterway; named for heat shimmer on rare
        warm days.</li>

        </ul>

        <h3 id="kg-forests" data-section="forests">Forests</h3>

        <ul>

        <li><strong>Seidōrin Mori</strong> (Bronze Wood Forest) — Metallic-barked trees in western Hana; harvested under
        strict licence for weapons.</li>

        <li><strong>Yōsei Mori</strong> (Forest of Spirits) — Sei-active ancient woodland in Kusa; navigation
        unreliable; unusual creatures of elevated intelligence in deeper reaches.</li>

        <li><strong>Kōri-no-Mori</strong> (Ice Forest) — Dense forest occupying the northern shores of Mizu province;
        natural trees grow intermixed with crystal trees whose pale trunks chime in the wind; cold, old, and largely
        unexplored.</li>

        </ul>

        <h3 id="kg-notable-terrain" data-section="notable-terrain">Notable Terrain</h3>

        <ul>

        <li><strong>Obsidian Fields of Kurosō</strong> — Vast plains of volcanic glass in Hi; exceptional quality for
        blades and lenses.</li>

        <li><strong>Whispering Flats</strong> — Chest-high violet grass in Kusa; sei resonance produces auditory
        phenomena.</li>

        <li><strong>Hoshimori Plateau</strong> — High grassland in Sora; stars visibly brighter; Golden Age
        observatories.</li>

        <li><strong>Stormwatch Cliffs</strong> — Highest sea cliffs on Hokori; Nami&#39;s northern reach; Kawa visible
        on clear days.</li>

        </ul>

        <h2 id="kg-transportation" data-section="transportation">Transportation</h2>

        <p>The <strong>Emperor&#39;s Highway</strong> extends from Heian in three directions, forming the primary
        overland network. Provincial roads branch from it, connecting smaller settlements. Mountain passes —
        particularly the Tenchūsan Pass through northeastern Hana — are seasonal and dangerous. The <strong>Storm
        Road</strong> through Sora province connects the eastern and western halves of Hokori across the central
        mountains, but is impassable in winter and deteriorating without central maintenance. Forest trails in Kusa and
        Kaze are unmapped and require local knowledge.</p>

        <p>River systems serve as major trade arteries: the Midori River connects Kusa&#39;s interior to the coast, the
        Tsuchikawa carries cargo barges through Tsuchi&#39;s valleys, and the Kinryūgawa supports the gold-tail fish
        trade in Hana. Coastal shipping connects Minato-jō in the northwest and Namigashira in the northeast, the two
        major ports.</p>

        </section>

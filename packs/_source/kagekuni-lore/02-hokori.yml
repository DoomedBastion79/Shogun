        <section class="secret">


        <h4 id="kg-dm-note-sora-secrets" data-section="dm-note-sora-secrets">DM Note — Sora Secrets</h4>

        <p><strong>Ryūshinki</strong> (Dragon Awakening): The sealed records in the collapsed fourth observatory
        document a celestial alignment the Golden Age seimasters considered dangerous — involving all three stars, two
        specific moons, and a particular planetary configuration. Their records suggest this alignment is associated
        with the founding dragons becoming active, visible, or vulnerable. The next occurrence is calculable and is not
        far away.</p>

        <p><strong>Ginryū</strong> (Silver Dragon): Connected to Sora through the province&#39;s astronomical nature.
        The plateau&#39;s unusual stellar appearance is partly her influence. She has not been seen in decades.</p>

        </section>


        <h2 id="kg-province-of-tsuchi-the-southern-frontier"
        data-section="province-of-tsuchi-the-southern-frontier">Province of Tsuchi — The Southern Frontier</h2>

        <p>Tsuchi occupies the southern portion of Hokori — a primarily mountainous province dominated by rugged terrain
        and the imposing bulk of <strong>Kurogane Yama</strong> (Black Iron Mountain), the second highest peak on the
        island. Hana borders it to the northeast and Hi to the northwest. The mountains here are old and weathered, less
        volcanically active than Hi but no less formidable — steep valleys, narrow passes, and ridgelines that catch
        storms rolling in from the southern sea. The southern mountains are resource-rich: mineral deposits, timber in
        the sheltered valleys, and stone quarried from exposed cliff faces. But the terrain resists large-scale
        settlement. Communities are small, isolated by geography, and accustomed to self-reliance.</p>

        <p>The <strong>Tsuchikawa</strong> (Earth River) is the province&#39;s main artery — wide, slow, navigable for
        cargo barge travel, and historically important as a trade route connecting the interior to the coast.
        <strong>Tsuchimoto</strong> sits at the centre of the provincial plains, connected by roads in every compass
        direction. It is a city of markets, granaries, and administrative buildings — the quietly enormous power of
        whoever controls the food supply flowing through its mountain valleys. The <strong>Great Granaries of
        Tsuchimoto</strong> can hold enough grain to feed Hokori&#39;s population through two years of failed harvests.
        A <strong>Buried Road</strong>, ancient and pre-imperial, runs through the lowlands — farmers have ploughed
        around it for centuries without knowing where it leads.</p>


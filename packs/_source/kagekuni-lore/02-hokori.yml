        <section class="secret">


        <h4 id="kg-dm-note-nami-secrets" data-section="dm-note-nami-secrets">DM Note — Nami Secrets</h4>

        <p><strong>Joint Naval Operation</strong>: Nami&#39;s Arashi-aligned clan is coordinating with Minato-jō for a
        joint eastern-western naval operation. The target is unknown, but intelligence suggests a landing rather than a
        sea battle.</p>

        <p><strong>Takaiso Lighthouse</strong>: The oldest foundation was built atop something much older. Excavation
        decades ago stopped abruptly when workers found the foundation stones warm to the touch and something moving in
        the space beneath. The site was sealed and built over.</p>

        </section>


        <h2 id="kg-province-of-sora-above-the-clouds" data-section="province-of-sora-above-the-clouds">Province of Sora
        — Above the Clouds</h2>

        <p>Sora encompasses the majority of the lightly populated mountainous interior at Hokori&#39;s centre — often
        the most dangerous region to traverse. The province occupies the central mountain ranges that form the
        connective barrier between most of the island&#39;s other provinces, bordering nearly every province in some
        capacity. Much of it sits above the cloud ceiling. A traveller ascending from lower provinces emerges through
        dense cloud into a world of startling clarity: thin air, intense sunlight, vast visibility, and a profound
        silence broken only by wind.</p>

        <p>The <strong>Hoshimori Plateau</strong> (Star Keeper&#39;s Plateau) is the defining feature — wide, flat, and
        high enough that stars are visibly brighter than anywhere else in the archipelago. Silvered grasses catch light
        differently, giving the landscape an almost lunar quality. During the Golden Age, seven observatories were built
        here; three remain structurally intact with functional instruments — large bronze mechanisms oriented to
        alignments no current seimaster fully understands. A fourth, largely collapsed, contains sealed records. The
        <strong>Storm Road</strong> — a mountain route connecting Hana and Hi to the northern coast — crosses the
        province, though it is impassable in winter and deteriorating without central maintenance authority.</p>


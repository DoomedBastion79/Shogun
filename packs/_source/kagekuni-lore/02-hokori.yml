        <h2 id="kg-province-of-hana-the-imperial-heartland"
        data-section="province-of-hana-the-imperial-heartland">Province of Hana — The Imperial Heartland</h2>

        <p>Hana occupies the eastern coast of Hokori and is the seat of imperial history. It stretches along the
        island&#39;s eastern seaboard, bounded to the northwest by the mountainous interior of Sora province for the
        majority of its inland border, with Tsuchi and Hi to the west, and Kaze to the north.</p>

        <p>The province&#39;s defining feature is the <strong>Serenia-kai</strong> (Selenia Sea) — a vast inland sea
        covering more than a thousand square miles, fed by twenty-five rivers and thirteen waterfalls cascading from the
        Tenchūsan Ren and the central highlands. Its surface shifts colour with the seasons. The tidal rhythms driven by
        Kagekuni&#39;s four moons make its edges unpredictable; the shoreline can retreat several hundred metres during
        low compound tides.</p>

        <p>To the west, the <strong>Seidōrin Mori</strong> (Bronze Wood Forest) stretches for miles — an ancient
        woodland where the trees grow with bark of burnished copper-bronze that catches sunlight like armour. The wood
        is extraordinarily hard and is harvested under strict clan licence for weapons and structural reinforcement.
        Unlicensed logging is a capital offence.</p>

        <p>To the northeast, the land rises sharply toward the Tenchūsan Ren. The pass through this range is the primary
        land route north — treacherous in autumn, impassable during winter storms. <strong>Shirogane Yama</strong>
        (Silver Mountain), the highest peak on Hokori, dominates the northern skyline, its summit crowned by the
        <strong>Hoshino Tō</strong> (Tower of Stars), an ancient astronomical observatory built during the Golden Age
        and still operational.</p>


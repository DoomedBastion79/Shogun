        <p>Kaze&#39;s culture is inward-facing. The people are not cold — they are careful. A culture of watching and
        listening developed naturally in a province where visibility is limited and sound behaves unreliably. Primary
        exports have historically been information, black pine lumber, rare mountain herbs, and distinctive
        lacquerware.</p>

        <section class="secret">


        <h4 id="kg-dm-note-kaze-secrets" data-section="dm-note-kaze-secrets">DM Note — Kaze Secrets</h4>

        <p><strong>The Nagaji Truth</strong>: Clan Gekkō&#39;s senior seimasters discovered fragmentary texts describing
        an Onyx Dragon ritual — a transformation rite tied to Kokuryū. Those who underwent it became Nagaji. The
        transformation spread. Masota no Gekkō underwent it last, in desperation. He is alive in the highlands,
        retaining fragments of his identity but losing coherence over time.</p>

        <p><strong>Order of the Black Lily</strong>: They know the full truth and have made a calculated decision — the
        information is too dangerous to release without a reversal plan. They will share with parties who reach them,
        but only the complete truth.</p>

        <p><strong>The Hollow Peaks</strong>: Three mountains in the Kazeyama Ren are demonstrably hollow — Onyx Dragon
        Clan structures. At least one interior is accessible from the Kagerō Gorge. Inside: ancient cultural artifacts,
        including documentation of the transformation ritual.</p>

        <p><strong>Reversal</strong>: Possible. The answer lies in the Temple of Kinryū — the Golden Dragon Clan&#39;s
        records about Kokuryū&#39;s original ritual and the countermeasure they developed.</p>

        </section>


        <h2 id="kg-province-of-kusa-the-verdant-interior" data-section="province-of-kusa-the-verdant-interior">Province
        of Kusa — The Verdant Interior</h2>

        <p>Kusa is Hokori&#39;s green heart — a province of dense forests, wide river floodplains, and grasslands so
        deep and tall that travellers on foot are hidden from view within a hundred paces. It occupies the western side
        of the northeastern leg, with Sora encroaching on its southeastern border, Mizu to the southwest, Nami to the
        north, and Kaze to the east. Drainage from surrounding mountain ranges converges here, creating a network of
        rivers, oxbow lakes, and seasonal wetlands that makes the land extraordinarily fertile and difficult to traverse
        without knowing the paths.</p>

        <p>The forests are ancient and immense, their floors growing in luminous violet and deep blue hues — <em
        lang="ja-Latn">murasaki-gusa</em> (purple grass) and <em lang="ja-Latn">aoi-koke</em> (blue moss) endemic to the
        interior lowlands. The <strong>Midori River</strong> is the primary artery, and the capital
        <strong>Midoriko</strong> sits at its junction with the Futago-kawa (Twin River). The <strong>Kusayama
        Ren</strong> (Grass Mountains) forms the northern boundary, sheltering the <strong>Yōsei Mori</strong> (Forest
        of Spirits) — a region of ancient woodland where sei activity is consistently elevated and navigation is
        genuinely unreliable.</p>

        <p>The <strong>Whispering Flats</strong> in the central lowlands are an unusual terrain feature — chest-high
        violet grass where wind creates complex auditory patterns that some claim carry intelligible whispers. Local
        tradition says the dead speak from the Flats during the Long Shadow season.</p>


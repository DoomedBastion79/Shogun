      content: >
        <p><strong>Market Hall</strong> -- Permanent covered structure hosting the weekly market. On non-market days it
        functions as a community gathering space and occasional shelter for travelers.</p>

        <p><strong>Temple of the Ancestors</strong> -- The largest structure in the village; a well-maintained
        ancestor-veneration temple serving the surrounding rural community. Seasonal festivals draw families from
        several hours&#39; travel distance.</p>

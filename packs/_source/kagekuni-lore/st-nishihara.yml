        <ul>

        <li>Yukari -- Village leader</li>

        </ul>


        <section class="secret kg-secret-discoverable" data-kind="discoverable">

        <p><strong>Details</strong></p>

        <p>Yukari has an unusually clear picture of broader regional events because she makes it her business to listen
        to the traveling traders.</p>


        </section>






        <section class="secret kg-secret-discoverable" data-kind="discoverable">

        <p>The Temple of the Ancestors maintains records going back several centuries with documentation of unusual
        historical events.</p>


        </section>



        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>DM Secrets</strong></p>

        <p><strong>Market Intelligence</strong>

        Nishihara&#39;s market functions as an informal information exchange point for the rural interior. Yukari has an
        unusually clear picture of broader events because she listens attentively to traders. She is not an intelligence
        operative -- she is simply attentive. If the party passes through and asks good questions, she can provide
        regional context unavailable from official sources.</p>

        <p><strong>The Temple&#39;s Old Records</strong>

        The Temple maintains records going back several centuries. Among them is documentation of a regional event
        approximately 80 years ago -- a strange sickness affecting livestock and then people in a specific pattern
        before stopping suddenly. The documented symptoms, if examined by a seimaster, would match early stages of a
        sei-manipulation effect rather than natural illness. No one has looked at these records recently.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>Plot Hooks</strong></p>

        <p>Yukari can provide regional context and rumors if approached with good questions</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>The temple records could be relevant to understanding historical sei phenomena in the region</p>


        </section>


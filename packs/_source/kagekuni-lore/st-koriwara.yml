        <div class="kg-settlement-header" data-settlement-type="village"><div class="kg-stl-badges"><span
        class="kg-badge kg-badge--type kg-badge--village">Village</span> <span class="kg-badge kg-badge--province">Mizu
        Province</span> <span class="kg-badge kg-badge--island">Hokori</span> <span class="kg-badge kg-badge--pop">Pop:
        Small</span></div><div class="kg-stl-details"><span class="kg-stl-detail"><strong>Clan:</strong> Tbd</span><span
        class="kg-stl-detail"><strong>Climate:</strong> Foothills; transitional maritime to montane</span><span
        class="kg-stl-detail kg-stl-subtitle"><em>"Not every important place announces itself."</em></span></div></div>

        <p>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.glkgG2E8eJWrxCrm]{Koriwara} sits in the foothills where
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.M72zAjYRdrTCan30]{Mizu}
        province&#39;s maritime lowlands begin to rise toward Hokori&#39;s interior ranges. It is unremarkable by any
        visible standard -- small-scale farming and herding, modest architecture, a self-contained community with little
        need for outside contact. A traveler passing through would find nothing to distinguish it from dozens of similar
        villages.</p>

        <p>What distinguishes it cannot be seen from the road: the presence of Elder Sato Hideaki, whose decades of
        accumulated knowledge, his connection to the Order of the Sacred Grove, and his quiet role as a node in networks
        extending far beyond a mountain foothills village give Koriwara significance disproportionate to its size.</p>

        <p>The sacred grove that Sato tends is a small stand of ancient trees on the hillside above the village, reached
        by a foot path behind the northernmost homes. The grove is not marked, not fenced, not formally maintained -- it
        simply exists, and the village has always known to leave it alone.</p>

        <p>This is Relc&#39;s home village.</p>

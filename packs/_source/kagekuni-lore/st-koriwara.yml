      content: >+
        <ul>

        <li>Sato Hideaki -- Choro (Village Elder); 78 years old</li>

        </ul>


        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>Details</strong></p>

        <p>Elder Sato knows far more than he has shared with Relc about the Order of the Sacred Grove, the Order of the
        Ancient Guard, and Solas Evergreen.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>One of the three stones referenced in Solas&#39;s cipher poem is in the sacred grove above the village.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>A stranger recently arrived in Koriwara asking questions about Relc.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>DM Secrets</strong></p>

        <p><strong>Sato&#39;s Full Knowledge</strong>

        Sato is a mid-rank member of the Order of the Sacred Grove. He has interacted with Order of the Ancient Guard
        agents, including Solas Evergreen directly. He knows Solas was Ancient Guard (not just Sacred Grove). He knows
        what the Ancient Guard is and broadly what it protects. He has not told Relc because he was following
        Solas&#39;s instruction and because he judged Relc was not yet ready.</p>

        <p><strong>The Cipher Poem</strong>

        One of the three stones is in Koriwara -- in the sacred grove above the village. A naturally occurring stone
        with unusual surface striations that, viewed from a specific angle at dawn, produce a visual pattern. Sato knows
        this stone. He knows what the Warden&#39;s Wisdom is: protected knowledge about the living dragons held by the
        Order of the Sacred Grove.</p>

        <p><strong>Solas&#39;s Murder -- What Sato Knows</strong>

        Sato does not know who killed Solas, but knows the category of entity capable of it. The killing required
        significantly superior capability or intimate familiarity -- someone Solas trusted. This points to either a very
        powerful practitioner or someone inside the Orders themselves.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>Plot Hooks</strong></p>

        <p>Sato sends word through a traveling merchant heading toward Heian: he needs to speak with Relc; something has
        happened near the sacred grove</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>A stranger arrived asking questions about Relc and where they had gone; Sato gave nothing away but is
        concerned about whether Relc is being watched</p>


        </section>


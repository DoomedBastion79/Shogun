        <section class="secret kg-secret-discoverable">

        <p><strong>Details</strong></p>

        <p><em lang="ja-Latn">discoverable</em></p>

        <p>The mine has recently started encountering an unusual material in the deeper work face -- not iron, not gold,
        but something with remarkable properties.</p>


        </section>






        <section class="secret kg-secret-discoverable">

        <p><em lang="ja-Latn">discoverable</em></p>

        <p>Yamamoto Kenji has quietly sent a sample to Heian for identification.</p>


        </section>



        <section class="secret kg-secret-sealed">

        <p><strong>DM Secrets</strong></p>

        <p><em lang="ja-Latn">sealed</em></p>

        <p><strong>What the Mine Actually Contains</strong>

        The deeper work face has started encountering a dark, lustrous metal with unusual properties: it doesn&#39;t
        rust, is harder than anything the village smith has worked, and holds an edge that standard iron cannot match.
        Yamamoto Kenji has quietly sent a sample to Heian, but the political vacuum has slowed response.</p>

        <p>The material is a trace deposit of an alloy associated with Onyx Dragon Clan presence. Kokuryu&#39;s domain
        was never here, but volcanic geology has carried the material far from its origin. The vein is small but
        uniquely suited for sei-conductive tools and weapons.</p>

        <p><strong>Yamamoto Kenji&#39;s Dilemma</strong>

        If the mine material becomes known, Takamine loses control. The village is too poor and too politically isolated
        to defend a valuable find. Kenji is trying to get information before events overtake him. He would respond
        warmly to trustworthy outsiders who could help.</p>


        </section>






        <section class="secret kg-secret-sealed">

        <p><strong>Plot Hooks</strong></p>

        <p><em lang="ja-Latn">sealed</em></p>

        <p>The mysterious metal could draw unwanted attention from merchant guilds or military factions</p>


        </section>






        <section class="secret kg-secret-sealed">

        <p><em lang="ja-Latn">sealed</em></p>

        <p>Kenji needs help identifying the material and deciding how to protect his village&#39;s interests</p>


        </section>


        Kaminari</span><span class="kg-stl-detail"><strong>Climate:</strong> Mountain shadow; less direct sunlight; thin
        rocky soil</span><span class="kg-stl-detail kg-stl-subtitle"><em>"The mountain owes us nothing. We dig
        anyway."</em></span></div></div>

        <p>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.Beldp2EHfpNljWTc]{Takamine} is a village of honest
        poverty. It sits in the shadow of Kinryuzan (Gold Dragon Mountain) at the head of the Star River, in a valley
        receiving less direct sunlight due to the mountain&#39;s angle. The small iron mine that sustains the village
        produces modest yields -- enough to keep the operation viable, not enough to generate real prosperity. Thin,
        rocky soil supplements mining income through limited farming.</p>

        <p>The community is close-knit in the way that difficult circumstances produce -- people who depend on each
        other genuinely. Visitors are noticed. Help is offered and received as a matter of course. The village has a
        pride rooted in endurance.</p>

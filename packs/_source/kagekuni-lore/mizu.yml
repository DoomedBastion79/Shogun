        <h3 id="kg-culture-amp-trade" data-section="culture-amp-trade">Culture &amp; Trade</h3>

        <p>Mizu&#39;s economy is built on maritime trade, fishing, and rice agriculture. Minato-jo serves as the primary
        western port of Hokori, handling trade routes across the Raijin no Fukai sea. The province&#39;s rice production
        is a strategic asset, and its river systems support extensive barge commerce connecting the coast to the
        interior.</p>

        <h3 id="kg-history" data-section="history">History</h3>

        <p>Mizu has long been one of Hokori&#39;s most strategically important provinces due to its western coastline
        and natural harbors. The province&#39;s current alignment with the Arashi Alliance reflects its maritime
        orientation and the naval capabilities centered at Minato-jo.</p>

        </section>

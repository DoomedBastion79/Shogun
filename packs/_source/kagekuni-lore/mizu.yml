        <section class="kg-tier kg-tier-sealed" data-tier="sealed"><h3
        id="kg-the-order-of-the-sacred-grove----koriwara-connec"
        data-section="the-order-of-the-sacred-grove----koriwara-connec">The Order of the Sacred Grove -- Koriwara
        Connection</h3>

        <p>Elder Sato Hideaki is a mid-rank member of the Order of the Sacred Grove. He has interacted with Order of the
        Ancient Guard agents, including Solas Evergreen directly. He knows Solas was Ancient Guard (not just Sacred
        Grove). He has not told Relc because he was following Solas&#39;s instruction to let Relc develop
        organically.</p>

        <h3 id="kg-the-cipher-poem39s-connection-to-koriwara"
        data-section="the-cipher-poem39s-connection-to-koriwara">The Cipher Poem&#39;s Connection to Koriwara</h3>

        <p>One of the three stones referenced in Solas&#39;s cipher poem is near Koriwara -- in the foothills. Elder
        Sato knows this stone and knows, vaguely, what the Warden&#39;s Wisdom is: protected knowledge about the
        locations of the living dragons.</p>

        <h3 id="kg-arashi-naval-presence" data-section="arashi-naval-presence">Arashi Naval Presence</h3>

        <p>Minato-jo&#39;s Arashi Alliance-aligned clan has been quietly building naval capacity beyond defensive
        requirements. Someone is planning an offensive operation involving the western sea. The scope of construction
        suggests something significant.</p>

        <h3 id="kg-plot-hooks" data-section="plot-hooks">Plot Hooks</h3>

        <ul>

        <li>Sato Hideaki has sent word through a traveling merchant -- he needs to speak with Relc urgently; something
        happened near the sacred grove he tends</li>

        <li>The Tidal Caves of Umigakure have started showing light from deep within during night compound tides -- a
        phenomenon not present three months ago</li>

        </ul>

        </section>

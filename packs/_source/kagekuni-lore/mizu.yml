        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-geography-amp-terrain"
        data-section="geography-amp-terrain">Geography &amp; Terrain</h3>

        <p>Mizu is a province of water in all its forms -- crashing coastal surf, wide navigable rivers, reed-choked
        estuaries, tidal flats that stretch for miles at low compound tide, and interior lakes fed by reliable rainfall.
        It wraps around the northwestern string of mountains on Hokori, with Hi to the southeast, Sora along its eastern
        and southern borders, and Kusa to the northeast. The Raijin no Fukai sea drives against its western and northern
        coastline with consistent force. The Kōri-no-Mori forest occupies its northern shores.</p>

        <p>The coastline is irregular and complex -- carved into headlands, sheltered coves, sea-stacks, and natural
        harbors. The Shirakawa Estuary (White River Estuary) at the province&#39;s center is one of the largest
        navigable estuaries in the archipelago. The city of Minato-jo occupies a raised headland at the estuary&#39;s
        mouth.</p>

        <p>Inland, the terrain transitions through agricultural floodplains and into the foothills of the central Hokori
        ranges. Rice production in Mizu&#39;s river valleys is among the highest in the archipelago -- the combination
        of reliable rainfall, mineral-rich alluvial soil, and excellent river irrigation infrastructure makes the
        province&#39;s farming output disproportionately important to regional food security.</p>

        <p>Relc&#39;s home village of Koriwara is located in Mizu province&#39;s interior, in a foothills region where
        the climate shifts from maritime to montane.</p>

        <p>Points of Interest:</p>

        <ul>

        <li>Shirakawa Estuary -- The great river mouth. At compound low tide, the tidal flats extend so far the estuary
        looks almost dry. Channel navigation is complex; experienced local pilots are required for larger vessels.</li>

        <li>Koriwara and the Sacred Grove Elder -- The village is unremarkable on its surface. What makes it significant
        is Elder Sato Hideaki, whose connection to the Order of the Sacred Grove gives Koriwara significance
        disproportionate to its size.</li>

        <li>The Tidal Caves of Umigakure -- Sea caves accessible only during compound low tides. The caves extend far
        back into the coastal cliffs. Internal airflow suggests a significant interior cavity somewhere behind the
        accessible chambers.</li>

        </ul>


        <section class="kg-tier kg-tier-intro" data-tier="intro"><dl class="kg-infobox" data-kind="infobox"><div
        class="kg-info__row"><dt>Type</dt><dd data-field="type">core</dd></div></dl><p>The people of Kagekuni use
        &quot;bakemono&quot; as a broad term for anything that is neither person nor beast in any familiar sense — the
        changed things, the hungry things, the things that should not be where they are. Scholars at the Seishin Enclave
        insist on finer taxonomy. Peasants in the valleys know the taxonomy doesn&#39;t matter when you hear breathing
        outside the shōji and there&#39;s nothing there.</p>

        <p>What follows is organized by the categories most commonly used by seimasters and monster-hunters, though the
        boundaries between them blur more often than academics care to admit.</p>

        </section>

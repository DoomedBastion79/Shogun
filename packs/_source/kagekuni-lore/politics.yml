        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-government-amp-political-structure"
        data-section="government-amp-political-structure">Government &amp; Political Structure</h3>

        <h4 id="kg-hierarchy" data-section="hierarchy">Hierarchy</h4>

        <p>Emperor → Shogun (war appointment only) → Kokushi Kyōkai → Daimyo → Rōjū</p>

        <h4 id="kg-current-status" data-section="current-status">Current Status</h4>

        <ul>

        <li><strong>Emperor</strong>: Dead since 16739; no confirmed successor; multiple claimants with sketchy
        genealogical proof</li>

        <li><strong>Shogun</strong>: Position legally frozen — Ryūjin&#39;s 16732 reform requires imperial approval; no
        emperor to grant it</li>

        <li><strong>Kokushi Kyōkai</strong>: Functioning but rudderless; Daijin are holdovers in constitutional
        limbo</li>

        <li><strong>Active War</strong>: Genso Alliance vs Arashi Alliance since 16742</li>

        </ul>

        <h4 id="kg-the-five-daijin-currently-holdovers" data-section="the-five-daijin-currently-holdovers">The Five
        Daijin (Currently Holdovers)</h4>

        <table>

        <thead>

        <tr>

        <th>Title</th>

        <th>Role</th>

        </tr>

        </thead>

        <tbody><tr>

        <td><strong>Anzen Hoshō Daijin</strong></td>

        <td>Minister of Security — intelligence network, imperial protectorate</td>

        </tr>

        <tr>

        <td><strong>Fukushi Daijin</strong></td>

        <td>Minister of Welfare — healthcare, education, public assistance</td>

        </tr>

        <tr>

        <td><strong>Gaikō Daijin</strong></td>

        <td>Minister of Foreign Affairs — diplomacy, trade, foreign nationals</td>

        </tr>

        <tr>

        <td><strong>Seimu Daijin</strong></td>

        <td>Minister of Administration — provincial governance, infrastructure</td>

        </tr>

        <tr>

        <td><strong>Zaiumu Daijin</strong></td>

        <td>Minister of Finance — treasury, taxation, revenue</td>

        </tr>

        </tbody></table>

        <h4 id="kg-local-administration-chain" data-section="local-administration-chain">Local Administration Chain</h4>

        <p>Chiji (Governor) → Gunji (County Magistrate) → Shi (Municipal Assembly) → Shicho (Mayor) → Sonchō (Village
        Leader)</p>

        <h4 id="kg-teikoku-keisatsu-imperial-police" data-section="teikoku-keisatsu-imperial-police">Teikoku Keisatsu
        (Imperial Police)</h4>

        <ul>

        <li>Functioning law enforcement bureaucracy</li>

        <li>With no emperor, has retreated to regional/local footprint</li>

        <li>Operates with some cooperation with local forces</li>

        <li>Chief Inspector Oshiro Masahiro stationed in Ayame — confirmed party ally</li>

        </ul>

        <hr>

        <h3 id="kg-military-structure" data-section="military-structure">Military Structure</h3>

        <h4 id="kg-command-hierarchy" data-section="command-hierarchy">Command Hierarchy</h4>

        <p>Shogun → Daimyo → Sotaisho → Karo → Taisho → Kumigashira → Kogashira</p>

        <h4 id="kg-enlisted-ashigaru-peasant-infantry" data-section="enlisted-ashigaru-peasant-infantry">Enlisted
        (Ashigaru) — Peasant Infantry</h4>

        <ul>

        <li>Katana Ashigaru (sword)</li>

        <li>Yari Ashigaru (spear)</li>

        <li>Yumi Ashigaru (bow)</li>

        </ul>

        <h4 id="kg-samurai-ranks-low-to-high" data-section="samurai-ranks-low-to-high">Samurai Ranks (Low to High)</h4>

        <ul>

        <li>Gokenin — housemen</li>

        <li>Goshi — rustic warrior</li>

        <li>Hatamoto — bannerman</li>

        </ul>

        <h4 id="kg-bugyo-logistics-officers" data-section="bugyo-logistics-officers">Bugyo — Logistics Officers</h4>

        <p>Sobugyo (field marshal), Maku bugyō, Yari/Yumi/Teppō/Kakomi bugyō (weapons commissioners), Yoroi bugyō
        (armor), Shodōgu bugyō (equipment), Hata bugyō (flags), Hyōrō bugyō (provisions), Gozen bugyō (kitchen), Fune
        bugyō (boats)</p>

        <h4 id="kg-ronin-surge" data-section="ronin-surge">Ronin Surge</h4>

        <p>With political vacuum and clan warfare, ronin numbers are at an all-time high — masterless samurai available
        for recruitment by any faction.</p>

        <hr>

        <h3 id="kg-caste-amp-social-system" data-section="caste-amp-social-system">Caste &amp; Social System</h3>

        <h4 id="kg-three-castes" data-section="three-castes">Three Castes</h4>

        <p><strong>Kugai</strong> — Elite class</p>

        <ul>

        <li>Primarily humans and dragonborn claiming descent from imperial founders</li>

        <li>Daimyo, Courtiers, Scholars, Hatamoto</li>

        </ul>

        <p><strong>Zokumin</strong> — Commonfolk</p>

        <ul>

        <li>Mixed races and ethnicities; varying regional acceptance</li>

        <li>Samurai, Ronin, Peasants, Artisans, Merchants (descending order)</li>

        <li>Merchants lowest despite often considerable wealth — source of social tension</li>

        </ul>

        <p><strong>Burakumin</strong> — Outcasts</p>

        <ul>

        <li>Occupations involving death (leather workers, butchers, executioners, undertakers)</li>

        <li>Segregated buraku communities; limited civil rights</li>

        <li>Subject to systemic harassment</li>

        </ul>

        <h4 id="kg-racial-social-mechanics" data-section="racial-social-mechanics">Racial Social Mechanics</h4>

        <p>Characters who are not Dragonborn, Human, or the clan&#39;s dominant non-human race suffer <strong>-2 on
        Honor ability checks</strong> due to systemic racism. Conversely, marginalized characters may be underestimated
        — opportunities to gather secrets others would guard more carefully.</p>

        <hr>

        <h3 id="kg-the-clans" data-section="the-clans">The Clans</h3>

        <h4 id="kg-alliance-structure" data-section="alliance-structure">Alliance Structure</h4>

        <table>

        <thead>

        <tr>

        <th>Alliance</th>

        <th>Clans</th>

        </tr>

        </thead>

        <tbody><tr>

        <td><strong>Arashi</strong></td>

        <td>Arashiyama, Hoshizora, Shirotsuru, Yūgure</td>

        </tr>

        <tr>

        <td><strong>Genso</strong></td>

        <td>Fuyugiri, Homoruyama, Ryūkaze, Tsuchiura</td>

        </tr>

        <tr>

        <td><strong>Independent</strong></td>

        <td>Gekkō, Kaminari, Kurohana</td>

        </tr>

        </tbody></table>

        <p><em lang="ja-Latn">The three independents are the political wildcard — their allegiance could tip the
        conflict decisively.</em></p>

        <h4 id="kg-clan-kaminari" data-section="clan-kaminari">Clan Kaminari</h4>

        <ul>

        <li>Daimyo: <strong>Raijin no Kazuhiko</strong> (The Storm-lord; human; 47; black hair with silver streaks)</li>

        <li>Known for mastery of storm magic and fierce warriors</li>

        <li>Born outside the clan; rose through martial prowess</li>

        <li>Governs Province of Hana; capital Heian</li>

        </ul>

        <h4 id="kg-clan-kurohana-independent" data-section="clan-kurohana-independent">Clan Kurohana (Independent)</h4>

        <ul>

        <li>Daimyo: <strong>Akihiko Kurohana</strong> (Black Dragonborn; 54; black scales; glowing red eyes;
        6&#39;6&quot;)</li>

        </ul>

        <h4 id="kg-other-notable-clans" data-section="other-notable-clans">Other Notable Clans</h4>

        <ul>

        <li><strong>Clan Tsuchiura</strong>: Governs Mizuho region, Tatara</li>

        <li><strong>Clan Shirotsuru</strong>: Governs Shugyoku region, Tatara (Arashi Alliance)</li>

        <li><strong>Eikyū Yami Clan</strong>: Kuroyami&#39;s dark cult; status unclear but persists</li>

        </ul>

        </section>

        <h4 id="kg-clan-gekk-independent-compromised" data-section="clan-gekk-independent-compromised">Clan Gekkō
        (Independent — COMPROMISED)</h4>

        <ul>

        <li>Daimyo: <strong>Masota no Gekkō</strong> — missing; transformed by dark ritual</li>

        <li><strong>CRITICAL SECRET</strong>: Clan Gekkō attempted a dark ritual with catastrophic consequences — clan
        members transformed into <strong>Nagaji</strong> (serpent folk)</li>

        <li>Masota no Gekkō was also transformed</li>

        <li>Full truth to be revealed at Monastery of the Black Lily in Akatsuki, Kaze province</li>

        <li>The Nagaji the party has been encountering ARE Clan Gekkō members</li>

        <li><strong>Party has killed several without knowing they were people</strong> — moral weight pending</li>

        </ul>

        </section>

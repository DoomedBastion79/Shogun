        <section class="kg-tier kg-tier-intro" data-tier="intro"><dl class="kg-infobox" data-kind="infobox"><div
        class="kg-info__row"><dt>Type</dt><dd data-field="type">core</dd></div></dl><p>Image prompts for the Kagekuni
        Campaign Guide bestiary. Style ranges from photographic (common creatures players will encounter regularly)
        through painterly (uncommon) to fine-art and ink wash (rare, mythical, or divine).</p>

        <p><strong>Global setting notes for all prompts:</strong></p>

        <ul>

        <li>World is feudal Japanese-inspired but not Earth — trees with bronze bark, indigo-hued grasses, faintly
        luminescent rivers at night, unfamiliar constellations</li>

        <li>Architecture is Sengoku/Edo period: timber and paper construction, torii gates, mountain temples, castle
        towns</li>

        <li>Magic (sei) manifests as subtle ambient light — soft gold, cool blue, faint violet — never garish</li>

        <li>Lighting should feel natural and atmospheric: mist, dusk, lantern-light, forest-filtered sun</li>

        </ul>

        <hr>

        <h2 id="kg-yokai" data-section="yokai">Yokai</h2>

        <h3 id="kg-oni" data-section="oni">Oni</h3>

        <p><strong>Style:</strong> Semi-realistic, painterly. Dark palette with selective warm accents.</p>

        <p>A massive horned humanoid crouched at the edge of a mountain pass, one hand resting on a stone outcrop, the
        other holding a crude iron tetsubō. Red-skinned with deep shadows in the creases of its face, wearing a tattered
        tiger-pelt loincloth. Its expression is not rage but patient evaluation — watching a distant traveler on the
        road below. Behind it, a narrow cliff trail winds upward into mist. Stone cairns along the road mark the
        boundary of its territory. The setting is late afternoon, low autumn sun casting long shadows across
        indigo-tinged grasses. Mountain peaks behind, faintly violet in atmospheric haze.</p>

        <h3 id="kg-tengu" data-section="tengu">Tengu</h3>

        <p><strong>Style:</strong> Traditional ink wash (sumi-e) with selective color. Elegant, austere, mysterious.</p>

        <p>A tall, thin figure standing on a high pine branch, silhouetted against a pale sky. Corvid features — a sharp
        beak, dark feathered wings folded behind like a cloak. It holds a long, slightly curved sword with casual
        mastery. Wind moves through the canopy but the tengu is perfectly still. The composition is vertical,
        emphasizing height. Below, a mountain forest canopy stretches into mist. Trees with pale crystalline bark catch
        faint light. The tengu&#39;s eyes are sharp and bright against the ink-dark face. A single red-orange autumn
        leaf drifts past. Minimal detail in the background — suggestion of depth through gradations of ink wash.</p>

        <h3 id="kg-kitsune" data-section="kitsune">Kitsune</h3>

        <p><strong>Style:</strong> Painterly, warm and cool contrast. Ethereal but grounded.</p>

        <p>A large white fox sitting at the base of a weathered stone shrine marker at a forest crossroads, three tails
        fanned behind it. The fox&#39;s fur is luminous white with silver tips, and its eyes are amber with unmistakable
        intelligence. Around its paws, small blue-white foxfire flames hover just above the ground, casting no heat but
        illuminating the kanji carved into the shrine stone. The setting is deep twilight — the sky is indigo fading to
        dark, with unfamiliar stars emerging. The crossroads is lined with ancient trees whose bark has a bronze sheen.
        A worn dirt path leads in three directions into darkness. The fox is watching something approach from the
        viewer&#39;s perspective with an expression that could be curiosity or amusement.</p>

        <h3 id="kg-tanuki" data-section="tanuki">Tanuki</h3>

        <p><strong>Style:</strong> Photographic with warm, slightly humorous tone. Rich autumnal color.</p>

        <p>A pot-bellied raccoon-dog sitting upright on a sake barrel outside a lantern-lit roadside inn at dusk. It
        wears a wide straw hat tilted at a rakish angle and holds a sake cup in one paw. Its round belly is prominent,
        its expression somewhere between mischievous and deeply satisfied. Autumn leaves — copper and amber — are
        scattered on the ground. A half-eaten rice ball sits beside it. The inn&#39;s paper lanterns cast warm pools of
        orange light. In the background, other tanuki shapes are barely visible — one appears to be haggling with a
        merchant, another is examining a leaf with great concentration. The tone is warm, lived-in, slightly
        comedic.</p>

        <h3 id="kg-jorogumo" data-section="jorogumo">Jorogumo</h3>

        <p><strong>Style:</strong> Fine art, dark and beautiful. Renaissance chiaroscuro meets ukiyo-e.</p>

        <p>An enormous spider the size of a small horse suspended at the center of a web that fills the main hall of a
        ruined estate. Its body is jet-black and glossy, segmented legs spanning the full width of the room, each ending
        in a point as fine as a calligraphy brush. The abdomen is patterned — pale markings that, in the right light,
        resolve into the suggestion of a woman&#39;s face. Silk threads radiate from its spinnerets in every direction,
        anchored to cracked ceiling beams, shattered shoji frames, and a collapsed tokonoma alcove. The web itself is a
        thing of terrible beauty — geometrically perfect, each strand catching the afternoon light that enters through
        the ruined wall like strings of liquid glass. Wrapped shapes hang at intervals along the outer threads,
        human-sized, silk-shrouded, still. Near one forelimb, a porcelain tea set sits on a lacquered tray, unbroken and
        recently used — two cups, one empty, one full. The spider&#39;s cluster of eyes reflects the light with cold
        intelligence. Wisteria has overtaken the wooden beams above, its purple blossoms drifting into the web and
        sticking there.</p>

        <h3 id="kg-nure-onna" data-section="nure-onna">Nure-Onna</h3>

        <p><strong>Style:</strong> Fine art, atmospheric horror. Cool blue-green palette, high contrast.</p>

        <p>A figure half-submerged in a river at a stone bridge crossing, visible from the chest up. A woman with
        ink-black hair plastered wet against pale skin, holding a cloth-wrapped bundle to her chest. The water around
        her is dark and still despite the current flowing past the bridge pilings. Her expression is anguished,
        convincing — one hand extends toward the viewer as though begging for help. Below the waterline, barely visible
        through the murky surface, an enormous serpentine body coils around the bridge&#39;s foundation, many times
        longer than the human torso suggests. The setting is a misty river crossing at dawn. Shimenawa warning ropes are
        tied to posts on the near bank. A single lantern on the bridge casts a sickly yellow glow. The far bank is lost
        in fog.</p>

        <h3 id="kg-tsukumogami" data-section="tsukumogami">Tsukumogami</h3>

        <p><strong>Style:</strong> Photographic, warm interior lighting. Domestic, intimate, slightly uncanny.</p>

        <p>A traditional Japanese household interior at night, lit by a single oil lamp. On a wooden shelf, a tea kettle
        has shifted slightly off its hook — one spout tilted as though peering at the room. Beside it, a writing brush
        has rolled to the edge of the desk and appears to have left a small, elegant ink character on a blank sheet of
        paper. An old paper umbrella in the corner leans against the wall at an angle that doesn&#39;t quite match
        gravity. A folding fan on the tatami has opened itself halfway. Nothing is dramatically wrong — every object is
        just slightly more present, more attentive, than objects should be. The room is otherwise normal: tatami mats,
        shoji screens, a low writing desk. Warm amber light, deep shadows in the corners.</p>

        <hr>

        <h2 id="kg-yurei" data-section="yurei">Yurei</h2>

        <h3 id="kg-yurei" data-section="yurei">Yurei</h3>

        <p><strong>Style:</strong> Fine art, ink wash with selective pale color. Cold, sorrowful, atmospheric.</p>

        <p>A translucent figure in a white burial kimono standing at the far end of a dark wooden corridor in a
        traditional Japanese estate. Long black hair hangs unbound, obscuring the face. The feet do not touch the floor
        — a gap of a few inches between the hem of the kimono and the polished wood. The figure&#39;s hands hang at its
        sides, palms forward, fingers slightly curled. The corridor is lit by a single guttering candle on a stand, and
        the temperature differential is visible — the viewer&#39;s breath would fog near the figure. Frost crystals have
        formed on the nearest wooden beam. The composition uses the corridor&#39;s linear perspective to draw the eye to
        the figure, which is slightly out of focus, as though the air between viewer and spirit resists clear sight.</p>

        <h3 id="kg-brei" data-section="brei">Bōrei</h3>

        <p><strong>Style:</strong> Oil painting quality, Rembrandt lighting. Solemn, dignified, uncanny.</p>

        <p>The translucent figure of an elderly priest seated in formal posture at a low writing desk in a temple
        chamber. He wears layered ceremonial robes, now faintly luminous and colorless. His brush hand is poised over a
        scroll, mid-character, as though interrupted by the viewer&#39;s arrival. His face is visible — aged, composed,
        with an expression of calm authority and deep weariness. The chamber around him is real and deteriorating —
        dust, cracked wood, cobwebs on the ceiling beams — but the desk area is immaculately maintained by the
        spirit&#39;s presence. A real torch on the wall has dimmed but not extinguished. The light in the room comes
        partly from the torch, partly from the figure itself — a cold, pale luminescence that casts no shadows.</p>

        <h3 id="kg-gashadokuro" data-section="gashadokuro">Gashadokuro</h3>

        <p><strong>Style:</strong> Dramatic fine art, ukiyo-e woodblock print aesthetic. High contrast, bold
        composition.</p>

        <p>An enormous skeletal figure — fifteen feet tall — standing in an empty battlefield at night, assembled from
        hundreds of mismatched bones. It is framed against a blood-red moon and an unfamiliar star field. Its skull
        tilts downward, jaw open, teeth the size of daggers. The bones are not clean — fragments of armor, scraps of
        cloth, and the residue of earth still cling to them. The ribcage is a hollow cathedral of interlocking bones
        from different bodies. It stands in a field of trampled indigo grass, broken weapon hafts, and scattered war
        banners half-buried in mud. No living thing is visible. The composition is from below, looking up at the
        skeleton against the sky, emphasizing its impossible scale. Wind moves the tattered banners. The silence is the
        point.</p>

        <h3 id="kg-gaki" data-section="gaki">Gaki</h3>

        <p><strong>Style:</strong> Photographic with desaturated color. Uncomfortable, pathetic, documentary.</p>

        <p>A cluster of emaciated translucent figures gathered outside a shuttered food market stall at night. Their
        bodies are wasted — visible ribs, stick-thin limbs — but their bellies are grotesquely distended. Their mouths
        are tiny, barely able to open. One reaches a skeletal hand toward a covered basket of rice, fingers passing
        through the lid without making contact. Another crouches near a sake barrel, mouth working soundlessly. Their
        forms overlap slightly — they crowd together without acknowledging each other. The market stall is real and
        solid; the gaki are faded, washed-out, like a double exposure. Lantern light from a nearby shop illuminates the
        scene with mundane warmth that makes the figures more disturbing by contrast. Food in the stall has begun to
        discolor at the edges.</p>

        <hr>

        <h2 id="kg-sei-touched" data-section="sei-touched">Sei-Touched</h2>

        <h3 id="kg-sei-beasts" data-section="sei-beasts">Sei Beasts</h3>

        <p><strong>Style:</strong> Photographic, National Geographic quality. Natural, awe-inspiring.</p>

        <p>A large stag standing in a forest clearing in the Yōsei Mori. Its pelt shifts between copper and deep slate
        in the dappled light. Its antlers are crystallized amber — translucent, warm gold, catching light like faceted
        gemstones. A third eye, smaller than the primary pair, sits centered on its forehead, its iris a faint violet
        that suggests it perceives something beyond the visible spectrum. The stag is alert but not alarmed, head
        raised, one foreleg slightly advanced. The forest around it is otherworldly — trees with bark of pale crystal
        that catches light, undergrowth in deep indigo, and a faint golden mist at ground level where sei pools visibly.
        A stream behind the stag glows faintly where it catches the light. The lighting is morning sun through canopy,
        warm with cool shadows.</p>

        <h3 id="kg-sei-aberrations" data-section="sei-aberrations">Sei Aberrations</h3>

        <p><strong>Style:</strong> Surreal fine art, Francis Bacon meets Yoshitaka Amano. Disturbing, beautiful,
        wrong.</p>

        <p>A creature that was once a river fish, now something else entirely — its body elongated and twisted, scales
        fused with river stones and aquatic plants that have become part of its flesh. Flames lick along its dorsal fin
        where water should be. It hovers above the surface of a shallow stream, suspended in a knot of visible sei
        energy — threads of gold and violet light that coil through its body like veins. Its mouth is open in what might
        be a scream. The stream around it has gone wrong — the water flows backward near the creature, and the riverbed
        stones have partially liquefied. The surrounding forest is normal, which makes the localized wrongness more
        striking. Warm afternoon light, but the light bends near the creature, creating a heat-shimmer effect.</p>

        <h3 id="kg-nagaji-general" data-section="nagaji-general">Nagaji (General)</h3>

        <p><strong>Style:</strong> Semi-realistic, dark and tactical. Cool palette, military tension.</p>

        <p>A serpentine humanoid standing in the mouth of a mountain cave, partially obscured by shadow. Scaled skin in
        mottled grey-green, cold and reptilian. The body is humanoid in general proportion but wrong in the details —
        the neck is slightly too long, the joints bend at subtly incorrect angles, and the eyes are lidless with
        vertical slit pupils that catch the light. It wears no clothing but carries what appears to be a crude weapon —
        a repurposed metal shard lashed to a wooden shaft. Behind it, in the deeper shadow of the cave, the reflected
        light of multiple pairs of eyes suggests others waiting in formation. The cave entrance is in a mountain cliff
        face, surrounded by hardy alpine vegetation and loose scree. Overcast sky, flat grey light. The creature is
        perfectly still, watching.</p>

        <h3 id="kg-nagaji-ashigaru" data-section="nagaji-ashigaru">Nagaji Ashigaru</h3>

        <p><strong>Style:</strong> Semi-realistic, photographic tension. Action composition, low-light environment.</p>

        <p>Three nagaji ashigaru mid-ambush in a ruined stone corridor. They are lighter and faster than the other
        variants — lean, angular builds with darker mottled scaling that renders them nearly invisible against the
        shadowed walls. One clings to a pillar at head height, body pressed flat against the stone in an impossible
        posture, crude spear angled downward. Another emerges from a side passage at a low crouch, weapon already
        extended. A third is mid-lunge from the opposite side, caught in the instant before impact — mouth open, showing
        rows of small, sharp teeth. Their weapons are improvised: metal shards lashed to wooden shafts with cord,
        functional but rough. No armor, no clothing. The corridor is ancient stonework, partly collapsed, lit by a
        single distant light source that catches the reflection of six slit-pupil eyes. The composition conveys
        coordinated violence — three angles of attack arriving simultaneously.</p>

        <h3 id="kg-nagaji-hohei" data-section="nagaji-hohei">Nagaji Hohei</h3>

        <p><strong>Style:</strong> Semi-realistic, heavy and imposing. Frontal composition, confrontational.</p>

        <p>A nagaji hohei filling a narrow stone doorway, blocking passage. It is significantly larger than the ashigaru
        — broad across the shoulders and chest, with thick overlapping scale plates along the forearms, chest, and spine
        that function as natural armor. The ridged scaling catches dim light along its edges. It stands square, low
        center of gravity, one hand gripping a heavy improvised weapon — a chunk of shaped stone lashed to a thick
        wooden haft, somewhere between a club and a mace. Its tail is braced against the doorframe behind it for
        leverage. The posture is unmistakably defensive: this ground is held. Its eyes are fixed forward with the flat,
        cold patience of something that will not move. Behind it, partially visible, the movement of ashigaru
        repositioning in the room beyond. The doorway is carved stone, ancient, cracked. The hohei&#39;s bulk and the
        architecture conspire to say the same thing: you do not pass.</p>

        <h3 id="kg-nagaji-bushi" data-section="nagaji-bushi">Nagaji Bushi</h3>

        <p><strong>Style:</strong> Painterly, dark palette with cold highlights. Authority and intelligence.</p>

        <p>A nagaji bushi standing on a raised stone platform at the junction of two corridors, observing a combat
        engagement below. It is lean like the ashigaru but carries itself differently — upright, controlled, deliberate.
        Faint patterning along its jaw and throat distinguishes it from the rank and file. It holds a properly hafted
        metal blade — not the crude lashed-together weapons of the ashigaru but a salvaged sword, re-gripped with cord
        wrapping, held with evident familiarity. A fragment of scavenged shoulder armor is strapped to its left side,
        imprecisely fitted but functional. Its mouth is slightly open, mid-vocalization — a sibilant call directing the
        squad below. The composition places the bushi above the action, observing, directing. Below and out of focus,
        the shapes of hohei and ashigaru moving in response to its call. The lighting is from below — torchlight from
        the lower corridor casting the bushi&#39;s face in sharp upward shadow, emphasizing the vertical slit pupils and
        the cold intelligence behind them.</p>

        <h3 id="kg-nagaji-kannushi" data-section="nagaji-kannushi">Nagaji Kannushi</h3>

        <p><strong>Style:</strong> Fine art, eerie and spiritual. Cool iridescent palette, stillness.</p>

        <p>A nagaji kannushi coiled on a raised stone dais in what was once a shrine chamber. It is slender, almost
        gaunt — thinner than any other variant, with a fluid, boneless quality to its posture. Its scales carry a faint
        iridescence that the other variants lack, shifting between grey-green and a pale violet depending on the angle
        of light. It is utterly still, coiled in a posture that resembles meditation — head bowed, body wound in a tight
        spiral, the tip of its tail resting precisely at the center of the dais. Its slit pupils are wider than those of
        other nagaji, dark and unfocused, as though perceiving something beyond the room. The shrine chamber around it
        is ancient stone — carved walls with worn iconography, a cracked incense holder, dust on every surface except
        the dais where the kannushi rests. Faint traces of residual sei energy are visible in the air — barely there,
        gossamer threads of pale gold drifting toward the creature. The mood is not threatening but deeply unsettling:
        something is happening here that cannot be explained by what is visible.</p>

        <hr>

        <h2 id="kg-kami" data-section="kami">Kami</h2>

        <h3 id="kg-kami" data-section="kami">Kami</h3>

        <p><strong>Style:</strong> Impressionist fine art, luminous and ethereal. Minimal subject, maximum
        atmosphere.</p>

        <p>A roadside stone shrine at a forest crossroads, weathered smooth by centuries of travelers&#39; hands. No
        figure is visible — the kami is suggested, not shown. The evidence of its presence: a shaft of warm golden light
        falls on the shrine stone despite the canopy overhead being unbroken. Wildflowers at the base of the stone are
        blooming out of season. A small offering of rice and a folded paper sits on the stone&#39;s flat surface, and
        the paper is stirring in a breeze that moves nothing else. The air around the shrine has a faint luminous
        quality — not glowing, but brighter than it should be given the forest shade. A bird perches on a nearby branch,
        facing the stone, head tilted. The forest is quiet and deep, trees with bronze-sheened bark receding into green
        shadow.</p>

        <h3 id="kg-tatari-gami" data-section="tatari-gami">Tatari-gami</h3>

        <p><strong>Style:</strong> Dark impressionist, oppressive atmosphere. Muted palette with sickly undertones.</p>

        <p>The same shrine crossroads, but wrong. The stone is cracked. The offerings have rotted. The wildflowers are
        withered to black. The light is flat and grey despite what should be midday. A rice paddy visible through the
        trees has yellowed weeks too early. The path is scattered with tools — a broken hoe, a cracked water jug —
        abandoned rather than placed. No entity is visible, but the composition creates a sense of malevolent attention
        radiating from the damaged stone. Crows perch in the trees, too many of them, all facing the same direction. The
        air has a faint greenish-brown cast, like bruised fruit. Everything is slightly too still.</p>

        <h3 id="kg-kodama" data-section="kodama">Kodama</h3>

        <p><strong>Style:</strong> Fine art, bioluminescent. Quiet, ancient, watchful.</p>

        <p>The interior of an ancient forest at night. Among the high branches of a massive tree — its trunk wider than
        a house, bark pale and faintly crystalline — small points of warm white-green light float and drift. They are
        not fireflies; they hold position relative to the branches, moving only when the tree moves. In the deepest
        shadow of a hollow where two branches meet, the faintest suggestion of a small figure — bark-textured,
        leaf-crowned, no larger than a child&#39;s hand — watches from the darkness. Its features are barely
        distinguishable from the tree itself. Below, the forest floor is carpeted in deep indigo moss. Sound is implied
        by the composition — the feeling of echo, of the forest listening. The lights in the canopy are reflected
        faintly in standing water at the tree&#39;s roots.</p>

        <hr>

        <h2 id="kg-ry" data-section="ry">Ryū</h2>

        <h3 id="kg-dragon-progenitor-legacy" data-section="dragon-progenitor-legacy">Dragon (Progenitor Legacy)</h3>

        <p><strong>Style:</strong> Grand fine art, mythological. Gold leaf and ink wash fusion — shrine painting
        aesthetic.</p>

        <p>A colossal golden dragon rendered as it might appear in a temple ceiling mural that has been brought to
        half-life. The dragon coils through clouds above a mountain landscape, its body serpentine and vast — each scale
        the size of a shield, rendered in burnished gold. Its face is regal and ancient, with long whiskers trailing
        like banners and eyes that hold the weight of eight millennia. The style should evoke the ceiling paintings of
        Japanese Buddhist temples — flat gold backgrounds, flowing cloud patterns, powerful brushwork — but with a
        quality of depth and presence that suggests the image might move. The landscape below is Kagekuni: mountain
        peaks, a distant inland sea, forests of bronze and crystal. The dragon is partially obscured by clouds,
        conveying scale by what is hidden rather than what is shown.</p>

        <h3 id="kg-ryjin" data-section="ryjin">Ryūjin</h3>

        <p><strong>Style:</strong> Fine art, dramatic naturalism. Power and elemental force.</p>

        <p>An enormous serpentine creature coiled around a river boulder in a mountain gorge, its body the size of a
        mature oak trunk. Scales in deep iridescent blue-green refract the light into spectral colors that don&#39;t
        appear in nature — ultraviolet suggestions, impossible greens. Vestigial wings, folded tight against its body,
        are translucent membranes stretched over delicate bone structures. Its head rests on the boulder, one vast amber
        eye half-open, watching the river flow. The water bends around the creature — not parting for it, but responding
        to it, the current shifting in deference. Moss and river plants have grown over portions of its body, suggesting
        it has been here for a very long time. The gorge walls rise steeply on either side. Late afternoon light catches
        the spray where the river tumbles over rocks downstream.</p>

        <hr>

        <h2 id="kg-yaj-wildlife" data-section="yaj-wildlife">Yajū (Wildlife)</h2>

        <h3 id="kg-deer-of-hokori" data-section="deer-of-hokori">Deer of Hokori</h3>

        <p><strong>Style:</strong> Photographic, wildlife documentary. Natural beauty with otherworldly details.</p>

        <p>A pair of deer at a forest stream at dawn. Their pelts are in seasonal transition — patches of deep copper
        alongside cool slate grey, the shift visible across their flanks like the turning of a leaf. The buck&#39;s
        antlers are normal bone but carry a faint metallic sheen at the tips. They drink from a stream that glows
        faintly where the early light hits it. The forest around them is recognizably temperate — oak and maple
        analogues — but the undergrowth is deep indigo rather than green, and the bark of the nearest tree has a bronze
        patina. Morning mist. A single shaft of warm light through the canopy. Natural, peaceful, subtly alien.</p>

        <h3 id="kg-mountain-cat-of-tenchsan-ren" data-section="mountain-cat-of-tenchsan-ren">Mountain Cat of Tenchūsan
        Ren</h3>

        <p><strong>Style:</strong> Photographic, rare wildlife sighting. Telephoto compression, atmospheric.</p>

        <p>A large grey-furred mountain cat crouched on a rocky ledge above a steep mountain trail, barely visible
        against the stone. Its fur is dense and slate-grey, blending with the crystalline mountain rock. Its eyes — pale
        gold — are the most visible feature, fixed on something below with the absolute stillness of a predator that has
        decided not to attack yet. The setting is high altitude: thin air suggested by the clarity of distant peaks,
        sparse alpine vegetation clinging to cracks in the rock, a dusting of snow on higher elevations. The composition
        uses a long focal length, suggesting the observer is far away and the cat knows it. Cold blue-grey light,
        overcast sky.</p>

        <h3 id="kg-cranes-of-kagekuni" data-section="cranes-of-kagekuni">Cranes of Kagekuni</h3>

        <p><strong>Style:</strong> Photographic, elegant. Japanese aesthetic sensibility.</p>

        <p>Three cranes wading in the shallows of Serenia-kai at sunrise. Their plumage is brilliant white with black
        flight feathers and crimson crowns. They move through water that reflects the warm sky — peach, gold, and pale
        violet. One is in mid-step, one has wings partially extended for balance, one stands perfectly still with its
        head raised. The great inland sea stretches behind them, calm and vast. In the far distance, the silhouette of a
        fishing village with curved rooftops is visible through morning haze. The water&#39;s surface catches the
        sunrise in bands of color. Reeds at the shore edge are the deep indigo-green of Kagekuni&#39;s vegetation.</p>

        <h3 id="kg-goldtail-fish" data-section="goldtail-fish">Goldtail Fish</h3>

        <p><strong>Style:</strong> Photographic, underwater/surface split-shot. Vivid, commercial quality.</p>

        <p>A school of goldtail fish running upstream during the Aki season, captured at the moment several break the
        surface. The signature feature — an iridescent gold flash on the tail fin — catches the light in a burst of warm
        metallic color against the cool blue-green of the river. Below the surface, the school is dense and purposeful,
        silver bodies with that distinctive gold tail marking visible on each fish. Above the surface, the river is
        lined with autumn foliage in copper and amber. Fishermen&#39;s nets are visible in the middle distance, and a
        riverside settlement with thatched roofs sits on the far bank. The water is clear enough to see rounded river
        stones on the bottom. Bright midday light, the energy of seasonal abundance.</p>

        <h3 id="kg-nightjars-of-ysei-mori" data-section="nightjars-of-ysei-mori">Nightjars of Yōsei Mori</h3>

        <p><strong>Style:</strong> Photographic with subtle enhancement. Nocturnal, mysterious.</p>

        <p>A nightjar perched on a low branch in the Yōsei Mori at dusk, its plumage a complex pattern of brown, grey,
        and deep indigo that renders it nearly invisible against the bark. Its mouth is open mid-call, and from its
        throat, a visible harmonic ripple extends into the air — a subtle distortion, like heat shimmer, but in
        concentric rings that suggest the call interacts with something beyond sound. The forest around it is
        transitioning from day to night: the last warm light in the upper canopy, deep blue shadow below. In the
        background, faint points of sei energy — barely visible gold motes — respond to the call, drifting slightly
        toward the bird. The forest floor is indigo moss and crystalline root structures.</p>

        <h3 id="kg-fireflies" data-section="fireflies">Fireflies</h3>

        <p><strong>Style:</strong> Photographic, long-exposure aesthetic. Romantic, magical.</p>

        <p>A rice paddy at the edge of a village at night, filled with fireflies. Their light is not the uniform
        yellow-green of Earth fireflies — it shifts across the swarm in gentle waves of color: warm gold near the water,
        cool blue-white higher up, and a faint violet at the edges nearest the tree line. The colors shift slowly,
        breathing in and out. A crescent moon — an unfamiliar blue-tinged moon — hangs low on the horizon, and the
        fireflies nearest it trend toward matching its color. The paddy water reflects both the fireflies and the stars,
        creating a mirror of light. A single farmhouse in the background has a warm lantern in one window. The village
        is dark and quiet otherwise. The sky is deep and full of unfamiliar constellations.</p>

        <h3 id="kg-silk-moths" data-section="silk-moths">Silk Moths</h3>

        <p><strong>Style:</strong> Photographic macro, scientific beauty. Extreme detail.</p>

        <p>A silk moth resting on a mulberry leaf, shot in close macro. Its wings are broad and pale — cream-white with
        a faint pearlescent sheen that shifts to warm gold at certain angles. Its body is plush and dense-furred. The
        detail is in the silk: a fine thread extends from the moth&#39;s spinneret, catching the light with an intensity
        that seems impossible for organic material — the thread doesn&#39;t just reflect light, it seems to conduct it,
        carrying a faint warm glow along its length. The mulberry leaf beneath is deep emerald with veins that carry a
        suggestion of indigo. Soft natural light, shallow depth of field, the background a blur of green and bronze.</p>

        <hr>

        <h2 id="kg-taikobutsu-deep-past" data-section="taikobutsu-deep-past">Taikobutsu (Deep Past)</h2>

        <h3 id="kg-guardian-constructs" data-section="guardian-constructs">Guardian Constructs</h3>

        <p><strong>Style:</strong> Grand fine art, archaeological mystery. Dark, ancient, monumental.</p>

        <p>A stone figure standing in a partially excavated chamber deep within a pre-imperial ruin. The construct is
        humanoid but not human — eight feet tall, proportioned like a temple guardian statue, carved from a dark stone
        that absorbs light. Its surface is covered in fine geometric patterns that might be decorative or might be
        functional — channels for sei, worn smooth by millennia but still faintly visible. Its head has no eyes, only
        smooth stone where a face would be, yet it is oriented directly toward the viewer with unmistakable attention.
        One hand is raised, palm outward — a gesture that could be greeting or warning. Dust motes drift in the beam of
        light entering from a crack in the ceiling above. The chamber walls are carved with script in a language that
        predates any known writing system. The construct&#39;s feet are still partially embedded in the stone floor, as
        though it grew from the foundation rather than being placed upon it. Ancient, patient, still on duty.</p>

        </section>

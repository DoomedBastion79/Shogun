        <p>None specifically documented.</p>


        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>Details</strong></p>

        <p>The Shadowfen Bridge exhibits a genuine sei phenomenon -- a low-level resonance that produces mild
        disorientation in those who speak falsehoods while crossing.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>The marsh forest north of the bridge contains remnants of an ancient, consumed structure.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>DM Secrets</strong></p>

        <p><strong>Shadowfen Bridge</strong>

        The local legend has a basis in actual sei phenomenon. A low-level sei resonance exists at the bridge, likely
        from the marsh forest on the far bank. It is not strong enough to genuinely redirect travelers, but
        sei-sensitive individuals feel a strong pull toward honesty when crossing. Someone who speaks a significant lie
        experiences mild but unmistakable disorientation.</p>

        <p><strong>The Forest North of the Bridge</strong>

        The marsh forest past Shadowfen Bridge contains remnants of a structure predating Sakura Mura by many centuries.
        Not accessible without knowing what to look for -- the marsh has largely consumed it. Local hunters know to
        avoid a specific area they describe as &quot;wrong-feeling.&quot; The structure&#39;s origin and purpose are
        unknown.</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p><strong>Plot Hooks</strong></p>

        <p>Investigation of the Shadowfen Bridge sei phenomenon could reveal the ancient structure beneath the marsh</p>


        </section>






        <section class="secret kg-secret-sealed" data-kind="sealed">

        <p>Local hunters&#39; avoidance of the &quot;wrong-feeling&quot; area could lead to discovery of pre-imperial
        ruins</p>


        </section>


        Kaminari</span><span class="kg-stl-detail"><strong>Climate:</strong> Temperate; forested surroundings; along
        Emperor's Highway</span><span class="kg-stl-detail kg-stl-subtitle"><em>"It grew because travelers needed a
        reason to stop. Now they stop because it grew."</em></span></div></div>

        <p>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.eUCVLOrFBBpO7dHx]{Sakura Mura} did not begin as a
        planned settlement -- it accumulated around a single inn on the Emperor&#39;s Highway that proved
        well-positioned for a rest stop. Over generations, the inn attracted other services, the services attracted
        residents, and the residents built a community. The village retains its highway-dependent character.</p>

        <p>A river runs east-west through the village, spanned at the north end by Shadowfen Bridge -- a stone bridge
        leading into a stretch of marsh forest. A secondary road path continues north from the bridge&#39;s far
        bank.</p>

        <p>The village is surrounded by forest on three sides, with a lake visible to the southeast. The cherry trees
        that give the village its name line the Highway approach for a quarter-mile -- planted two centuries ago by a
        traveling monk as a gift.</p>

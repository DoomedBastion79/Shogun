        <section class="kg-tier kg-tier-intro" data-tier="intro"><dl class="kg-infobox" data-kind="infobox"><div
        class="kg-info__row"><dt>Type</dt><dd data-field="type">core</dd></div></dl><h2 id="kg-route-types"
        data-section="route-types">Route Types</h2>

        <ul>

        <li><strong>Imperial Highway</strong> — Maintained roads, relatively safe, fastest overland</li>

        <li><strong>Provincial Road</strong> — Less maintained, slower, varies by province</li>

        <li><strong>Mountain Pass</strong> — Steep, exposed, weather-dependent, seasonal closures possible</li>

        <li><strong>Forest Trail</strong> — Unmapped, navigation checks required, encounter risk</li>

        <li><strong>Coastal Sea Route</strong> — Ship travel along coastline, port-to-port</li>

        <li><strong>Open Sea Route</strong> — Direct crossing between islands, weather risk high</li>

        <li><strong>River</strong> — Upstream slower, downstream faster, limited to waterway path</li>

        </ul>

        <hr>


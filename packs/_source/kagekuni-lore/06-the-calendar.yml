        <h2 id="kg-notes-on-the-calendar" data-section="notes-on-the-calendar">Notes on the Calendar</h2>

        <p><strong>Mutsuki</strong> opens the year with the Month of Affection — a time for rekindling bonds, settling
        debts carried over from the old year, and renewing oaths of loyalty. Despite winter&#39;s grip, it is a month of
        warmth between people.</p>

        <p><strong>Kisaragi</strong>, the Month of Changing Clothes, marks the first tentative preparations for the
        season ahead. Heavy winter garments are aired and stored; lighter layers are brought out, though the cold has
        not yet released its hold.</p>

        <p><strong>Satsuki</strong>, the Month of Early Rice, is the agricultural pivot — the planting that determines
        whether the year will be one of plenty or hardship. Communities work together; even samurai households may
        contribute labour during Satsuki in rural provinces.</p>

        <p><strong>Minazuki</strong> is paradoxically named the Month of Water despite the kanji literally reading
        &quot;month without water&quot; — a reference to the rice paddies drinking the rains dry as fast as the monsoons
        deliver them.</p>

        <p><strong>Fumizuki</strong>, the Month of Letters, reflects the summer tradition of correspondence — poetry
        exchanges between allies and rivals, love letters carried by trusted messengers, and the formal diplomatic
        communiqués that shape the political landscape of the following seasons.</p>

        <p><strong>Kannazuki</strong> — the Month of No Gods — carries the common saying that &quot;the gods are
        away&quot; during the tenth month, though no one remembers where they supposedly go. The name is accepted
        without question by most, treated as folk tradition rather than literal truth.</p>

        <p><strong>Shiwasu</strong>, the Month of Running Priests, closes the year. Even the most contemplative monks
        are said to be running during the twelfth month — settling accounts, performing final rites, and preparing
        shrines for the new year. It is the busiest month for temples and the most frantic for merchants.</p>

        <section class="secret">


        <h3 id="kg-dm-note-kannazuki39s-true-origin" data-section="dm-note-kannazuki39s-true-origin">DM Note —
        Kannazuki&#39;s True Origin</h3>

        <p>The name <strong>Kannazuki</strong> is a historical fossil from the earliest age when the seven
        <strong>Progenitor dragons</strong> did physically gather during the tenth month. The tradition outlived the
        practice by millennia. The Ancient Guard recognizes the irony — the &quot;Month of No Gods&quot; was originally
        the month when <em lang="ja-Latn">all</em> the gods were present in one place. Now, with the Progenitors
        slumbering, the name is accidentally accurate again for entirely different reasons.</p>

        <p><strong>Discovery path:</strong> Research in the Great Library of Kawa; conversations with Ancient Guard
        members; study of pre-Reckoning texts.</p>

        </section></section>

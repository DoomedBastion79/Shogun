        <section class="kg-tier kg-tier-intro" data-tier="intro"><dl class="kg-infobox" data-kind="infobox"><div
        class="kg-info__row"><dt>Type</dt><dd data-field="type">core</dd></div></dl><p>Kagekuni follows a traditional
        twelve-month calendar rooted in the agricultural and spiritual rhythms of the land. Each month carries a name
        that reflects the character of its days — what grows, what changes, what is demanded of the people who live
        through it. The names are ancient, predating the dark ages, and their meanings have weathered millennia of use
        without losing their aptness.</p>

        <p>The current year is <strong>16744</strong>. The current date is <strong>Nagatsuki 1</strong> — the first day
        of the ninth month, the opening of Aki (autumn).</p>


        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-the-realm-of-seizan"
        data-section="the-realm-of-seizan">The Realm of Seizan</h3>

        <ul>

        <li>Magic energy called <strong>sei</strong> flows through all living things</li>

        <li>Three stars, four seasons, four moons</li>

        <li>Astrological events driven by stellar and lunar cycles overlay the standard seasons</li>

        <li>The archipelago of <strong>Kagekuni</strong> (&quot;Shrouded Isles&quot;) is the campaign setting</li>

        <li>Located in the <strong>Raijin no Fukai</strong> sea</li>

        <li>Shaped by competing influences of Susanoo and Tsukuyomi (celestial, not divine)</li>

        <li>Temperate climate with north/south variation; monsoons and typhoons are regular</li>

        <li>Frequent earthquakes, tsunamis, and volcanic activity shape culture and architecture</li>

        <li>Four moons create complex tidal patterns that influence culture and magic</li>

        </ul>

        <hr>

        <h3 id="kg-the-miyosai-system-astronomy" data-section="the-miyosai-system-astronomy">The Miyosai System —
        Astronomy</h3>

        <h4 id="kg-three-stars-taiy" data-section="three-stars-taiy">Three Stars (Taiyō)</h4>

        <table>

        <thead>

        <tr>

        <th>Name</th>

        <th>Type</th>

        <th>Character</th>

        <th>Magical Influence</th>

        </tr>

        </thead>

        <tbody><tr>

        <td><strong>Amaterasu</strong></td>

        <td>Primary golden-yellow</td>

        <td>Stable, foundational warmth</td>

        <td>Core life energy; baseline sei</td>

        </tr>

        <tr>

        <td><strong>Susanoo</strong></td>

        <td>Smaller blue-white dwarf</td>

        <td>Complex orbit; closest during Nagorikaze</td>

        <td>Water magic, healing, purification; &quot;ghost rainbows&quot;</td>

        </tr>

        <tr>

        <td><strong>Tsukuyomi</strong></td>

        <td>Larger deep-red dwarf</td>

        <td>Elongated orbit; furthest during Long Shadow; perihelion casts daytime shadows</td>

        <td>Transformation, energy manipulation</td>

        </tr>

        </tbody></table>

        <p><strong>Note</strong>: These are purely celestial phenomena named after older divine concepts. Stars are not
        worshipped directly.</p>

        <h4 id="kg-four-moons-the-sisters39-tears-tsuki" data-section="four-moons-the-sisters39-tears-tsuki">Four Moons
        — The Sisters&#39; Tears (Tsuki)</h4>

        <table>

        <thead>

        <tr>

        <th>Name</th>

        <th>Translation</th>

        <th>Character</th>

        <th>Notable Influence</th>

        </tr>

        </thead>

        <tbody><tr>

        <td><strong>Aokiba</strong></td>

        <td>Blue Fang</td>

        <td>Crystalline, elliptical orbit; appears toothed</td>

        <td>Tidal surges during Tatsunami; navigation hazard</td>

        </tr>

        <tr>

        <td><strong>Kagetsu</strong></td>

        <td>Shadow Moon</td>

        <td>Largest; absorbs light; halo effect at full</td>

        <td>Dreams under full face carry mystical significance</td>

        </tr>

        <tr>

        <td><strong>Nagikumo</strong></td>

        <td>Gentle Cloud</td>

        <td>Smallest but appears large; soft inner glow</td>

        <td>Tranquil; perpetually luminous even in shadow</td>

        </tr>

        <tr>

        <td><strong>Ryūgetsu</strong></td>

        <td>Dragon Moon</td>

        <td>Most complex orbit; color-shifting; linked to Shizukanami gravitationally</td>

        <td>Dragon&#39;s Rest — auspicious pauses for weather and spirit magic; auroras during Hikarishou</td>

        </tr>

        </tbody></table>

        <p><strong>Lunar Sei Influence</strong>: Secondary sei signatures — subtler than stars. Three tracks: tidal
        (physical), omen (divinatory), sei amplification (mild magical resonance). Compounded stellar + lunar alignments
        produce meaningfully greater effects.</p>

        <h4 id="kg-seven-planets-wakusi" data-section="seven-planets-wakusi">Seven Planets (Wakusi)</h4>

        <table>

        <thead>

        <tr>

        <th>Name</th>

        <th>Translation</th>

        <th>Notes</th>

        </tr>

        </thead>

        <tbody><tr>

        <td><strong>Akahoshi</strong></td>

        <td>—</td>

        <td>Innermost; molten; visible in daylight as crimson point</td>

        </tr>

        <tr>

        <td><strong>Akasa</strong></td>

        <td>Red Sand</td>

        <td>Crimson desert world; influences weather during Tatsunami</td>

        </tr>

        <tr>

        <td><strong>Asahikawa</strong></td>

        <td>River of Dawn</td>

        <td>Golden, reflective; brightest morning object; herald of celestial events</td>

        </tr>

        <tr>

        <td><strong>Seizan</strong></td>

        <td>—</td>

        <td>Our world — the balance point</td>

        </tr>

        <tr>

        <td><strong>Shizukanami</strong></td>

        <td>Silent Wave</td>

        <td>Frozen ocean; gravitationally linked to Ryūgetsu; blue glow under Susanoo</td>

        </tr>

        <tr>

        <td><strong>Kōrigami</strong></td>

        <td>God of Ice</td>

        <td>Eternal winter; influences winter severity during Shinmyouji</td>

        </tr>

        <tr>

        <td><strong>Yamiyo</strong></td>

        <td>Eternal Night</td>

        <td>Outermost; shadow magic potency; Shadow Resonance when aligned with Tsukuyomi</td>

        </tr>

        </tbody></table>

        <h4 id="kg-seasons" data-section="seasons">Seasons</h4>

        <p>Seizan experiences four standard seasons, identical to Earth&#39;s cycle:</p>

        <table>

        <thead>

        <tr>

        <th>Season</th>

        <th>Japanese Name</th>

        <th>Months</th>

        </tr>

        </thead>

        <tbody><tr>

        <td>Spring</td>

        <td><strong>Haru</strong></td>

        <td>Yayoi (3), Uzuki (4), Satsuki (5)</td>

        </tr>

        <tr>

        <td>Summer</td>

        <td><strong>Natsu</strong></td>

        <td>Minazuki (6), Fumizuki (7), Hazuki (8)</td>

        </tr>

        <tr>

        <td>Fall</td>

        <td><strong>Aki</strong></td>

        <td>Nagatsuki (9), Kannazuki (10), Shimotsuki (11)</td>

        </tr>

        <tr>

        <td>Winter</td>

        <td><strong>Fuyu</strong></td>

        <td>Shiwasu (12), Mutsuki (1), Kisaragi (2)</td>

        </tr>

        </tbody></table>

        <p><em lang="ja-Latn">Current campaign date: Nagatsuki 1, 16744 (early Aki)</em></p>

        <h4 id="kg-calendar-traditional-months" data-section="calendar-traditional-months">Calendar — Traditional
        Months</h4>

        <table>

        <thead>

        <tr>


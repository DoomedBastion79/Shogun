        <section class="kg-tier kg-tier-discoverable" data-tier="discoverable"><h3
        id="kg-kannazuki-the-month-of-no-gods" data-section="kannazuki-the-month-of-no-gods">Kannazuki — The Month of No
        Gods</h3>

        <p>The name Kannazuki predates recorded history. Common folk use it without thought — &quot;the gods are
        away&quot; is a saying during the tenth month, though no one remembers where the gods supposedly go. Ancient
        texts in the Great Library of Kawa reference a gathering of &quot;the great ones&quot; during this month, but
        the passages are fragmentary and often dismissed as allegory.</p>

        <p><em lang="ja-Latn">Discovery path: Research in the Great Library; conversations with Ancient Guard members;
        study of pre-Reckoning texts.</em></p>

        <hr>

        </section>

        <section class="kg-tier kg-tier-sealed" data-tier="sealed"><h3 id="kg-kannazuki-the-true-origin"
        data-section="kannazuki-the-true-origin">Kannazuki — The True Origin</h3>

        <p>The name is a historical fossil from the earliest age when the seven Progenitor dragons did physically gather
        during the tenth month. The tradition outlived the practice by millennia. The Ancient Guard recognizes the irony
        — the &quot;Month of No Gods&quot; was originally the month when <em lang="ja-Latn">all</em> the gods were
        present in one place. Now, with the Progenitors slumbering, the name is accidentally accurate again for entirely
        different reasons.</p>

        <h3 id="kg-the-great-aphelion-and-the-sei-drought" data-section="the-great-aphelion-and-the-sei-drought">The
        Great Aphelion and the Sei Drought</h3>

        <p>The sei drought began with the stellar decline of the War of Fractured Banners era (~12605). As Susanoo and
        Tsukuyomi entered their long retreat from the barycenter of the Miyosai trinary system, sei accessibility
        diminished gradually. The first secondary star crossed below naked-eye visibility around ~12806, marking the
        beginning of the dark ages. The Temple of Oryuzan Tenku-ji fell in 13088 — a consequence of the drought, not its
        cause.</p>

        <p>The three stars of the Miyosai system orbit a common gravitational center (barycenter) on different orbital
        inclinations. Planets orbit Amaterasu and travel with it; moons orbit Seizan directly. Neither participated in
        the Great Aphelion — only the three stars reached maximum mutual distance. The Great Aphelion itself (~14344)
        was the absolute nadir: Amaterasu at one extreme of its barycentric arc carrying Seizan with it, while Susanoo
        and Tsukuyomi sat at opposing extremes on their own inclined planes. The geometry was not a uniform recession
        but a three-dimensional separation — the distances compounded geometrically.</p>

        <p>Amaterasu never went dark. Its baseline sei sustained life, agriculture, and the physical world throughout
        the dark ages. The world retained normal day/night cycles. What was lost was the complex magical expression that
        depended on the full trinary system — Susanoo&#39;s contribution to water magic and healing, Tsukuyomi&#39;s
        contribution to transformation and energy manipulation. The dark ages were cultural and intellectual collapse
        rather than extinction.</p>

        <p>The Progenitors entered their slumber during this same period. Whether the aphelion caused the slumber, the
        slumber caused the sei drought, or the aphelion caused both remains unknown — even to the Ancient Guard. The
        slow return of sei beginning <del>15962 (First Talents) correlates with Susanoo&#39;s partial orbital return
        after dawn (</del>15883). The Great Awakening (~16693) marks the moment all three stars became clearly visible
        simultaneously — effectively the moment Tsukuyomi&#39;s return crossed the threshold of reliability. The orbital
        correction is still ongoing — the current celestial configuration has not yet fully returned to its pre-Aphelion
        state.</p>

        <p><em lang="ja-Latn">This connection is not understood by any living scholar. The data exists in fragmentary
        astronomical records across multiple institutions, but no one has assembled the complete picture. The Golden
        Dragon Clan&#39;s observatory at Ōryūzan Tenkū-ji contained the most complete model of the Miyosai system ever
        constructed — mechanical and arcane, capable of projecting celestial positions across millennia. It has not been
        operational since the temple fell.</em></p>

        <p><em lang="ja-Latn">See also: core/great-aphelion.md — full canonical timeline, orbital mechanics, and orrery
        projection sequence.</em></p>

        <hr>

        <h3 id="kg-the-archipelago-of-kagekuni" data-section="the-archipelago-of-kagekuni">The Archipelago of
        Kagekuni</h3>

        <h4 id="kg-five-major-islands" data-section="five-major-islands">Five Major Islands</h4>

        <table>

        <thead>

        <tr>

        <th>Island</th>

        <th>Character</th>

        <th>Key Feature</th>

        </tr>

        </thead>

        <tbody><tr>

        <td><strong>Hokori</strong></td>

        <td>Largest; four tectonic plates; X-shaped</td>

        <td>Primary campaign island; capital Heian</td>

        </tr>

        <tr>

        <td><strong>Kawa</strong></td>

        <td>Eastern; mostly submerged except winter</td>

        <td>Agricultural heartland; Great Library; Seirei Mizuumi</td>

        </tr>

        <tr>

        <td><strong>Fushichō</strong></td>

        <td>Northern; volcanic</td>

        <td>Hi no Toride mountains; ancient secrets; Akaho Sanmyaku erupting</td>

        </tr>

        <tr>

        <td><strong>Yurei</strong></td>

        <td>Haunted; barren; avoided</td>

        <td>Ancient curse; specters and monsters; Kuroshi Temple</td>

        </tr>

        <tr>

        <td><strong>Tatara</strong></td>

        <td>Southern; mountainous</td>

        <td>Dwarven/gnomish heartland; Zirak vs Glimfyr conflict</td>

        </tr>

        </tbody></table>

        <h4 id="kg-minor-islands" data-section="minor-islands">Minor Islands</h4>

        <p>Fuukajima, Gyoshima, Kakujima, Shukajima, Unmeijima, Ryūhajima, Shizukajima, Takarajima, and others.</p>

        <p><strong>Unmeijima</strong> — Home of the city of Seishin (magical research); Order of the Tranquil Lotus
        monastery at Kazehama.</p>

        <hr>

        <h3 id="kg-tone-aesthetic-amp-design-principles" data-section="tone-aesthetic-amp-design-principles">Tone,
        Aesthetic &amp; Design Principles</h3>

        <h4 id="kg-core-tone" data-section="core-tone">Core Tone</h4>

        <ul>

        <li>Medieval Japan as cultural and historical backbone — not generic fantasy</li>

        <li>High fantasy layered over authentic historical touchstones</li>

        <li>Shifts fluidly: quiet beauty ↔ political intrigue ↔ brutal conflict</li>

        <li>Honor, shame, duty, tension between order and chaos are recurring themes</li>

        </ul>

        <h4 id="kg-the-world-feels-otherworldly" data-section="the-world-feels-otherworldly">The World Feels
        Otherworldly</h4>

        <p>Consistent cosmetic departures from reality — woven naturally, never called out as anomalies:</p>

        <ul>

        <li>Trees with bark of burnished bronze or pale crystal</li>

        <li>Grass in deep violet or indigo hues</li>

        <li>Rivers faintly luminescent at night</li>

        <li>Fog carrying incense scent without source</li>

        <li>Constellations that don&#39;t match our sky</li>

        <li>The bronze-leafed Seidōrin Mori — metallic trees harvested for weapons</li>

        <li>Sei flowing visibly through natural phenomena</li>

        </ul>

        <h4 id="kg-historical-grounding-second-priority-after-conti"
        data-section="historical-grounding-second-priority-after-conti">Historical Grounding (Second Priority After
        Continuity)</h4>

        <ul>

        <li>Feudal structure: Emperor, Shogun, Daimyo, Samurai, Peasantry — titles and land rights carry real
        weight</li>

        <li>Bushido and social codes: honor, duty, sacrifice, and shame govern behavior</li>

        <li>Religion and spirituality: Shinto animism, Buddhist philosophy, ancestor veneration</li>

        <li>Arts and architecture: tatami, shoji, castle towns, torii gates, tea ceremony, noh theatre</li>

        <li>Conflict and politics: clan rivalries, succession disputes, ronin, peasant uprisings</li>

        </ul>

        <h4 id="kg-dampd-5e-compatibility" data-section="dampd-5e-compatibility">D&amp;D 5e Compatibility</h4>

        <ul>

        <li>All mechanical content grounded in 5e rules</li>

        <li>Homebrew clearly labeled</li>

        <li>Seimasters map to wizards, sorcerers, monks</li>

        <li>Honor mechanic: -2 on Honor ability checks for marginalized races in social situations</li>

        </ul>

        <h4 id="kg-foundry-vtt-notes" data-section="foundry-vtt-notes">Foundry VTT Notes</h4>

        <ul>

        <li>Secret blocks used within journal entries for DM-only content</li>

        <li>Player handouts prefixed with character name for easy sorting</li>

        <li>Location journals pinned to maps</li>

        <li>Active Objectives journal maintained as living document</li>

        <li>One entry per subject; use journal links for wiki-style navigation</li>

        </ul>

        <h4 id="kg-preserve-mystery" data-section="preserve-mystery">Preserve Mystery</h4>

        <ul>

        <li>Not everything needs to be explained</li>

        <li>Leave room for improvisation and surprise</li>

        <li>The living dragons secret is the campaign&#39;s deepest thread — never surface prematurely</li>

        </ul>

        </section>

        <section class="kg-tier kg-tier-known" data-tier="known"><h4 id="kg-astrological-events"
        data-section="astrological-events">Astrological Events</h4>

        <p>Seizan&#39;s complex stellar and lunar system produces named astrological phenomena that overlay the standard
        seasons. These are not seasons themselves but recurring celestial events with observable effects on weather,
        tides, sei, and the natural world.</p>

        <p><strong>Solar Events</strong> (driven by the three-star system):</p>

        <table>

        <thead>

        <tr>

        <th>Name</th>

        <th>Celestial Cause</th>

        <th>Effects</th>

        </tr>

        </thead>

        <tbody><tr>

        <td><strong>Nagorikaze</strong></td>

        <td>Susanoo draws close to Seizan</td>

        <td>Blue-white atmospheric phenomena; ghost rainbows; water magic intensifies</td>

        </tr>

        <tr>

        <td><strong>Shinmyōji</strong></td>

        <td>Kōrigami at peak influence</td>

        <td>Luminescent mists over Kagekuni; winter severity increases</td>

        </tr>

        <tr>

        <td><strong>Long Shadow</strong></td>

        <td>Tsukuyomi at furthest point (aphelion)</td>

        <td>Transformation magic weakens; shadows behave strangely</td>

        </tr>

        </tbody></table>

        <p><strong>Lunar Events</strong> (driven by the four-moon system):</p>

        <table>

        <thead>

        <tr>

        <th>Name</th>

        <th>Celestial Cause</th>

        <th>Effects</th>

        </tr>

        </thead>

        <tbody><tr>

        <td><strong>Tatsunami</strong></td>

        <td>Four-moon alignment convergence</td>

        <td>Destructive tidal surges; coastal flooding; navigation hazards. Typically late Aki through mid-Haru.</td>

        </tr>

        <tr>

        <td><strong>Hikarishō</strong></td>

        <td>Ryūgetsu full phase alignment</td>

        <td>Celestial dragon auroras; sei amplification; spirit activity increases</td>

        </tr>

        </tbody></table>

        <p>Additional solar and lunar events exist but are less commonly named or studied. Seimasters at Seishin
        maintain observational records of celestial alignments and their correlations to sei fluctuation.</p>

        </section>

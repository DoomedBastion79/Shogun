  - _id: klv6t4F65tnNyQdx
    _key: '!journal.pages!2ksZmpD2sVpeUB0Q.klv6t4F65tnNyQdx'
    name: Overview
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >
        <p>The people of Kagekuni use &quot;bakemono&quot; as a broad term for anything that is neither person nor beast
        in any familiar sense — the changed things, the hungry things, the things that should not be where they are.
        Scholars at the Seishin Enclave insist on finer taxonomy. Peasants in the valleys know the taxonomy doesn&#39;t
        matter when you hear breathing outside the shōji and there&#39;s nothing there.</p>

        <p>What follows is organized by the categories most commonly used by seimasters and monster-hunters, though the
        boundaries between them blur more often than academics care to admit.</p>
      markdown: ''

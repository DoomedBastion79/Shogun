    flags: {}
  - _id: sagP6mCSoVx6VzQB
    _key: '!journal.pages!2ksZmpD2sVpeUB0Q.sagP6mCSoVx6VzQB'
    name: Tsukumogami
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >
        <p>Objects that have existed for one hundred years and, through long use and the slow accumulation of sei, have
        awakened into something like consciousness. A tea kettle that hops off its hook at midnight. An umbrella that
        opens itself in sunshine and closes in rain, spitefully. A writing brush that produces calligraphy of startling
        beauty when no one is holding it.</p>

        <p>Tsukumogami are the most common yokai in Kagekuni, though most go unrecognized. They are minor spirits —
        rarely dangerous, frequently annoying, occasionally helpful. A household that treats its tools and implements
        with respect will find them lasting longer and working better; a household that is careless with its possessions
        may wake one morning to find every pot in the kitchen rearranged and the broom hiding behind the woodpile.</p>

        <p>Since the Great Awakening, the rate of tsukumogami manifestation has increased noticeably. Seimasters debate
        whether this reflects higher ambient sei, accumulated potential finally expressing after the drought, or simply
        that people are paying closer attention. Whatever the cause, households across Kagekuni are discovering that
        their grandmother&#39;s mirror has opinions about its placement.</p>
      markdown: ''
    video:
      controls: true
      volume: 0.5

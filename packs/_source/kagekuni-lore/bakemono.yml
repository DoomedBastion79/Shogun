  - _id: WJahaQ2bTzHgxkUq
    _key: '!journal.pages!2ksZmpD2sVpeUB0Q.WJahaQ2bTzHgxkUq'
    name: Tengu
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >
        <p>Tengu inhabit the deep mountain forests and high ridgelines where the canopy thins and the wind carries the
        smell of pine resin and distant snow. They appear as tall, thin humanoids with corvid features — black-feathered
        wings, sharp dark eyes, beaked faces that manage to convey expressions no beak should be capable of.</p>

        <p>They are warriors without peer. The legendary swordsmanship schools of Kagekuni trace their lineage to tengu
        instructors, and the debt is not metaphorical — tengu did teach human swordsmen, centuries ago, and some still
        do. A tengu who deems a mortal worthy of instruction will appear uninvited, train the student to the point of
        exhaustion and beyond, then vanish without explanation. The student is expected to understand the lesson
        eventually. Tengu do not explain themselves.</p>

        <p>Tengu society is hierarchical and secretive. The greater tengu — the Daitengu — are beings of considerable
        power, rumored to command weather and move through sei as birds move through air. The lesser tengu, the Kotengu,
        are more numerous and more volatile: tricksters, thieves, and occasional allies who delight in humbling the
        proud and rewarding the humble. They are particularly fond of embarrassing monks whose piety exceeds their
        actual virtue.</p>
      markdown: ''
    video:
      controls: true
      volume: 0.5

      content: >
        <p>A standard nagaji squad consists of one bushi, two hohei, and six ashigaru — nine total. This composition has
        been observed consistently enough to suggest it is not coincidental.</p>

        <p><strong>Engagement pattern:</strong> The squad does not attack on sight at range. It positions first.
        Ashigaru move to flanking positions using available cover — pillars, side corridors, elevated terrain. Hohei
        advance to block the most direct line of retreat. The bushi observes. The attack begins simultaneously from
        multiple angles, initiated by a sharp vocalization from the bushi.</p>

        <p><strong>Communication:</strong> The sibilant language is constant during engagement — short, rhythmic bursts
        that correspond to tactical shifts. The speed of coordination suggests the communication is partially
        instinctive; the delay between a bushi&#39;s call and the squad&#39;s response is faster than deliberate
        interpretation would allow.</p>

        <p><strong>Adaptability:</strong> Nagaji squads adjust to setbacks. If ashigaru flankers are neutralized, the
        remaining squad contracts rather than continuing a compromised plan. If the bushi falls, the squad fractures —
        the hohei assume a defensive posture and hold ground, but the ashigaru break almost immediately, scattering into
        side passages and fleeing the engagement. Eliminating the bushi is the fastest way to collapse a nagaji
        squad.</p>

        <p><strong>Ambush preference:</strong> Nagaji strongly prefer to fight on their terms. They know the terrain
        they occupy intimately and use it. Shadow corridors, narrow passages, and spaces with limited visibility are not
        obstacles for them — they are advantages. Their low-light vision and comfort in enclosed spaces means that
        fighting nagaji in their territory is fighting them at their best.</p>

        <p><strong>Avoidance behavior:</strong> Nagaji have been observed avoiding certain spaces entirely — areas with
        strong residual magical presence or specific environmental qualities. Whether this reflects fear, discomfort, or
        something else is unknown, but it is consistent and can be exploited by those who recognize the pattern.</p>

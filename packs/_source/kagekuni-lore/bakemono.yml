  - _id: sG6YTeB3L1iegBLG
    _key: '!journal.pages!2ksZmpD2sVpeUB0Q.sG6YTeB3L1iegBLG'
    name: Hohei
    type: text
    title:
      show: true
      level: 3
    image: {}
    text:
      format: 1
      content: >
        <p>Heavier infantry variants, typically two per squad. Hohei anchor the formation while ashigaru maneuver around
        the flanks.</p>

        <p><strong>Physiology:</strong> Noticeably larger and more heavily built than ashigaru. Broader across the
        shoulders and chest, with thicker scaling that appears to function as natural armor — denser, overlapping plates
        rather than the finer scales of the ashigaru. Some observed specimens show ridged scaling along the forearms and
        spine.</p>

        <p><strong>Weaponry:</strong> Similar improvised construction to ashigaru but heavier — longer hafted weapons,
        crude clubs fashioned from stone or salvaged metal. Hohei have been observed using their natural weapons as
        well: powerful jaw strikes and a constricting grip from their tails that can pin an opponent in place.</p>

        <p><strong>Armor:</strong> None manufactured, but the natural scaling provides meaningful protection. Bladed
        weapons that slide off ashigaru scales may bite into hohei plates and stick — a different problem, but still
        protective.</p>

        <p><strong>Tactics:</strong> Hohei hold ground. They position themselves between threats and the rest of the
        squad, absorbing attention and damage while the ashigaru work the edges. They do not retreat easily. A hohei
        that has committed to a position will fight from that position until it is dead or the threat has withdrawn.
        They are not berserkers — they fight with a cold, mechanical efficiency — but they do not appear to value
        self-preservation when the squad is engaged.</p>
      markdown: ''
    video:
      controls: true
      volume: 0.5

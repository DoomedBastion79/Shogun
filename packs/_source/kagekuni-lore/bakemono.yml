  - _id: b4JqNRDlU0rCM9r9
    _key: '!journal.pages!2ksZmpD2sVpeUB0Q.b4JqNRDlU0rCM9r9'
    name: Ashigaru
    type: text
    title:
      show: true
      level: 3
    image: {}
    text:
      format: 1
      content: >
        <p>The most numerous variant. @UUID[Compendium.assistant.monsters.Actor.0U3ovqWCecMOrh9C]{Nagaji ashigaru} form
        the bulk of any encountered group, typically six to a squad. They are lighter in build than other variants —
        faster, more agile, and prone to flanking maneuvers rather than direct engagement.</p>

        <p><strong>Physiology:</strong> Slighter frame than other variants. Scales tend toward darker mottling,
        providing natural camouflage in shadow and stone environments.</p>

        <p><strong>Weaponry:</strong> Crude and improvised. Ashigaru carry repurposed metal shards lashed to wooden
        shafts — functional spears assembled from scavenged material rather than manufactured equipment. Some have been
        observed using sharpened stone or broken masonry as thrown projectiles.</p>

        <p><strong>Armor:</strong> Limited. Most ashigaru wear no protection of any kind, though some have been observed
        wearing crude leather coverings — hides lashed across the chest and shoulders — that provide marginal additional
        protection. Whether this is scavenged or deliberately fashioned is unclear.</p>

        <p><strong>Tactics:</strong> Ashigaru are aggressive. They charge into combat with little hesitation, closing
        distance quickly and relying on numbers and flanking angles to overwhelm targets. In enclosed spaces, they use
        side corridors, pillar shadows, and elevated positions to attack from multiple angles simultaneously. Their
        coordination through the sibilant language is most evident here; repositioning calls precede movement by only a
        heartbeat, suggesting the communication is instinctive rather than deliberated. However, ashigaru are quick to
        break. When their commanding bushi falls, morale collapses almost immediately — ashigaru scatter into side
        passages and flee rather than fight on without direction. This is the single most exploitable weakness in nagaji
        squad composition.</p>
      markdown: ''
    video:

    text:
      format: 1
      content: >
        <p>Nagaji encountered in the field organize into distinct roles that mirror military unit structures. Whether
        this reflects deliberate organization or instinctive social behavior is unknown, but the consistency across
        observed groups suggests it is not random.</p>
      markdown: ''

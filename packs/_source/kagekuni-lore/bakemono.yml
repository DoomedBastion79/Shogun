  - _id: FHmlgHSvC3vgeCwG
    _key: '!journal.pages!2ksZmpD2sVpeUB0Q.FHmlgHSvC3vgeCwG'
    name: Bōrei
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >
        <p>A @UUID[Compendium.assistant.monsters.Actor.I8CGFyd6dUeRizU2]{bōrei} is a yurei of unusual potency — a spirit
        whose binding is so strong, whose will was so defined in life, that they persist with something approaching full
        consciousness. They can speak, reason, and in some cases interact physically with the world around them. They do
        not decay in the way lesser yurei do; a bōrei may haunt a place for centuries without losing coherence.</p>

        <p>Bōrei are rare and significant. A bōrei in a temple was almost certainly someone of great devotion or
        authority. A bōrei in a castle was likely a lord or general whose duty extended past death. They can be
        communicated with — carefully — and may possess knowledge that no living person retains.</p>
      markdown: ''
    video:
      controls: true

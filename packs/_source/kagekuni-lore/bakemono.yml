  - _id: N9DK6nNw4MgJhzQC
    _key: '!journal.pages!2ksZmpD2sVpeUB0Q.N9DK6nNw4MgJhzQC'
    name: Oni
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >
        <p>The great horned demons of Kagekuni are as much a part of the mountains as the stone itself. They come in
        colors — red, blue, black, green — and each color carries different associations in local folklore, though the
        oni themselves don&#39;t seem to care what stories are told about them.</p>

        <p>Oni are territorial, physical, and direct. They favor high places: mountain passes, cliff faces, abandoned
        fortifications. A lone oni will claim a stretch of road and exact tribute from travelers — food,
        @UUID[Compendium.assistant.items.Item.1PqdGF09UULiIMWB]{sake}, occasionally a fight for the sport of it. An oni
        band, which is rarer and more dangerous, will fortify a position and hold it against anything short of an
        army.</p>

        <p>They are not stupid. An oni negotiating toll fees will remember a slight for decades. An oni given genuine
        respect — not fear, respect — may become a surprisingly reliable neighbor. Villages near known oni territory
        sometimes maintain formal arrangements: offerings left at specific stones on specific days, and in return the
        oni discourages bandits and worse things from using the same road.</p>

        <p>During the sei drought, oni populations declined sharply. Many retreated underground or fell into torpor.
        Since the Great Awakening, sightings have risen steadily, and some oni have emerged disoriented and aggressive
        after millennia of sleep — a problem for the settlements that grew up in their territory while they
        slumbered.</p>
      markdown: ''
    video:
      controls: true
      volume: 0.5

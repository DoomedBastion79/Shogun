  - _id: ZksEQ06R1P0Lxthn
    _key: '!journal.pages!2ksZmpD2sVpeUB0Q.ZksEQ06R1P0Lxthn'
    name: Yokai — the Changed Ones
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >
        <p>Yokai are creatures of inherent supernatural nature — not spirits of the dead, not divine, not ordinary
        beasts gone wrong. They exist because the world has room for them, because sei flows through living things and
        some living things are stranger than others. Most yokai are intelligent. Many are ancient. A few are friendly,
        though &quot;friendly&quot; is a relative term when the creature in question can swallow a horse.</p>
      markdown: ''
    video:
      controls: true

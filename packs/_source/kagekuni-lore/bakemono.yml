  - _id: 1S3P7PY2SZUH5Did
    _key: '!journal.pages!2ksZmpD2sVpeUB0Q.1S3P7PY2SZUH5Did'
    name: Tanuki
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >
        <p>The raccoon-dogs of Kagekuni are shapeshifters like kitsune, but where kitsune are elegant and calculating,
        tanuki are exuberant, gluttonous, and absolutely shameless. A tanuki disguised as a merchant will sell you
        leaves that look like gold coins — and the deception will hold just long enough for the tanuki to spend the real
        coins you gave as change on @UUID[Compendium.assistant.items.Item.1PqdGF09UULiIMWB]{sake} and tempura.</p>

        <p>Tanuki are social creatures who gather in loose communities near human settlements, drawn by the availability
        of food, drink, and entertainment. They are excellent mimics, passable musicians, and terrible liars who succeed
        anyway through sheer confidence and the fact that people don&#39;t expect a pot-bellied creature with a leaf on
        its head to be running an elaborate confidence scheme.</p>

        <p>Despite their reputation as comic figures, tanuki are not harmless. An angry tanuki can reshape its body into
        something much larger and much less amusing. A tanuki protecting its young will fight with a ferocity that
        surprises creatures who only know the jolly sake-drinking version. And old tanuki — the ones who have lived long
        enough to stop caring whether anyone finds them funny — are shapeshifters of alarming skill who can maintain
        disguises indefinitely and have been known to replace village headmen for months without detection.</p>
      markdown: ''
    video:
      controls: true
      volume: 0.5

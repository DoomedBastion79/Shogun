    text:
      format: 1
      content: >
        <p><strong>Ryu no Tetsu Ryokan (Dragon&#39;s Iron Inn)</strong> -- The village&#39;s single inn. Comfortable by
        local standards. The innkeeper&#39;s family has run it for four generations.</p>

        <p><strong>Ryu no Iki Kajiba (Dragon&#39;s Breath Forge)</strong> -- The village forge, working primarily in
        local iron. The smith produces tools and hardware; technically capable of weapons work.</p>

        <p><strong>General Shop</strong> -- Combined general goods; also serves as the mine company store.</p>

        <p><strong>Village Temple</strong> -- Small and well-maintained despite the village&#39;s poverty. The community
        invests disproportionately in its upkeep as collective identity.</p>

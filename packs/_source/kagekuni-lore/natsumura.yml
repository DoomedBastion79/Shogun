      content: >
        <p><strong>The Seaside Teahouse &amp; Inn</strong> -- The village&#39;s sole accommodation and primary social
        gathering point. The proprietor is the de facto news exchange.</p>

        <p><strong>Fisherman&#39;s Market</strong> -- Daily fish market at the dock. Operates at dawn.</p>

        <p><strong>Boatwright&#39;s Shed</strong> -- Repairs and maintains the village&#39;s fishing fleet.</p>

        <p><strong>Net Weaver&#39;s Workshop</strong> -- Produces and repairs fishing nets adapted to Serenia-kai
        conditions.</p>

        <p><strong>@UUID[Compendium.assistant.lore.JournalEntry.K5oyIOFTT6FGxIDb]{Natsumura} Shrine</strong> -- Small
        riverside shrine dedicated to a water spirit associated with the Sutariba. Receives offerings before gold-tail
        runs.</p>

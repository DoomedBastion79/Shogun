      content: >-
        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-overview"
        data-section="overview">Overview</h3>

        <p>Natsumura is a small fishing village at the point where the Star River empties into the Serenia-kai. The
        village has existed in essentially the same form for centuries -- a cluster of wooden thatched houses on the
        riverbank, a small port with drying racks and mooring posts. The Serenia-kai&#39;s tidal complexities make the
        approach navigable only during specific tidal windows; the village&#39;s fishermen know these windows
        intimately.</p>

        <p>The kinuo (gold-tail fish) that commands premium prices in Heian runs heaviest at the Sutariba&#39;s mouth in
        late spring and early autumn. During these runs, Natsumura&#39;s population effectively doubles with seasonal
        workers and traders.</p>

        <h3 id="kg-notable-establishments" data-section="notable-establishments">Notable Establishments</h3>

        <p><strong>The Seaside Teahouse &amp; Inn</strong> -- The village&#39;s sole accommodation and primary social
        gathering point. The proprietor is the de facto news exchange.</p>

        <p><strong>Fisherman&#39;s Market</strong> -- Daily fish market at the dock. Operates at dawn.</p>

        <p><strong>Boatwright&#39;s Shed</strong> -- Repairs and maintains the village&#39;s fishing fleet.</p>

        <p><strong>Net Weaver&#39;s Workshop</strong> -- Produces and repairs fishing nets adapted to Serenia-kai
        conditions.</p>

        <p><strong>Natsumura Shrine</strong> -- Small riverside shrine dedicated to a water spirit associated with the
        Sutariba. Receives offerings before gold-tail runs.</p>

        <h3 id="kg-key-figures" data-section="key-figures">Key Figures</h3>

        <ul>

        <li>Takeda Haruto -- Village leader -&gt; npcs/takeda-haruto.md</li>

        </ul>

        </section>

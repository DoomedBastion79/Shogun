        <section class="kg-tier kg-tier-sealed" data-tier="sealed"><h3 id="kg-the-sei-drought-and-the-great-aphelion"
        data-section="the-sei-drought-and-the-great-aphelion">The Sei Drought and the Great Aphelion</h3>

        <p>The sei drought was not caused by the War of Fractured Banners — it coincided with the Great Aphelion, a
        once-in-millennia event in which all three stars of the Miyosai trinary system reached maximum mutual distance
        from their common barycenter simultaneously. The planets, which orbit Amaterasu and travel with it, did not
        participate — nor did the moons, which orbit Seizan directly. The event was exclusively a three-star separation
        across three independent orbital inclinations, compounding geometrically.</p>

        <p>The true timeline: stellar decline began <del>12605; dark ages started ~12806 (first star lost to
        visibility); the temple fell in 13088; the Great Aphelion nadir occurred ~14344; dawn (first star returned)
        ~15883; First Talents ~15962; Great Awakening ~16693. The drought spanned approximately 3,077 years
        (</del>12806–~15883).</p>

        <p>The causal chain (aphelion → slumber → drought, or aphelion → both) is unknown even to the Ancient Guard. The
        slow orbital return of the secondary stars correlates with sei&#39;s gradual restoration — but the orbital
        correction is not yet complete.</p>

        <p><em lang="ja-Latn">See also: core/world.md [SEALED] — The Great Aphelion and the Sei Drought;
        core/great-aphelion.md — full canonical timeline and orbital mechanics.</em></p>

        <h3 id="kg-murasakiry39s-sei-awareness" data-section="murasakiry39s-sei-awareness">Murasakiryū&#39;s Sei
        Awareness</h3>

        <p>Every sei use in Kagekuni passes through the awakened Progenitor Murasakiryū&#39;s awareness. This means
        every spell the party casts, every druidic invocation, every monk ability — all of it is potentially observed.
        The implications for Ko&#39;jiri&#39;s sorcery, Relc&#39;s druidic power, and Sun Wukong&#39;s ki are
        significant but unexplored.</p>

        <p><strong>Key question (unresolved):</strong> Does Murasakiryū actively monitor individual sei users, or is it
        passive background awareness? Does the party register as notable?</p>

        </section>

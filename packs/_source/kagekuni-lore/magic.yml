        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-sei-fundamentals"
        data-section="sei-fundamentals">Sei Fundamentals</h3>

        <ul>

        <li><strong>Sei</strong> = magic energy flowing through all living things</li>

        <li>Present throughout Seizan; expressed through celestial alignment and natural forces</li>

        <li>Began declining during the War of Fractured Banners era (~12605); first secondary star lost to visibility
        ~12806; effectively inaccessible by ~13088 (when the last major sei institution — Oryuzan Tenku-ji — fell)</li>

        <li>Period without accessible sei lasted approximately 3,077 years (<del>12806–</del>15883)</li>

        <li>Slowly returned through Talents from ~15962</li>

        <li>Fully restored ~16693 (Great Awakening)</li>

        <li>The drought&#39;s cause is officially unknown; scholars debate whether it was consequence of the war itself
        or a natural cycle</li>

        </ul>

        <h3 id="kg-seimasters" data-section="seimasters">Seimasters</h3>

        <ul>

        <li><strong>Arcane scholars and researchers</strong> — not necessarily practitioners</li>

        <li>Study sei as discipline; map, theorize, document celestial alignments</li>

        <li>Title connotes scholarship over power</li>

        <li>A non-casting seimaster may outrank a gifted practitioner socially</li>

        <li>Some manifest as wizards, sorcerers, monks in D&amp;D terms</li>

        <li>Study in mountaintop monasteries</li>

        </ul>

        <h3 id="kg-magical-factions-publicly-known" data-section="magical-factions-publicly-known">Magical Factions
        (Publicly Known)</h3>

        <ul>

        <li><strong>Seishin</strong> (City, Unmeijima) — premier magical research institution</li>

        <li><strong>Raimeiin</strong> (雷鳴院 — Institute of Thunder) — publicly declared during Plague Campaign</li>

        <li><strong>Forest of Spirits</strong> — publicly declared during Plague Campaign</li>

        <li><strong>Hikari no Shizuku</strong> — healing/light magic; operates within Heian</li>

        </ul>

        <h3 id="kg-kuroyami-no-akuma" data-section="kuroyami-no-akuma">Kuroyami no Akuma</h3>

        <ul>

        <li>Formerly Takeda no Arata</li>

        <li>Found necromantic tome in Kuroshi Temple, Yurei</li>

        <li>Led Plague Campaign 16609–16616</li>

        <li>Defeated but <strong>never captured or killed</strong> — escaped; whereabouts unknown</li>

        <li>Eikyū Yami Clan persists</li>

        </ul>

        </section>

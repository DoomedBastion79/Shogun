        <section class="kg-tier kg-tier-sealed" data-tier="sealed"><h3 id="kg-dragons-today-critical-secret-dm-only"
        data-section="dragons-today-critical-secret-dm-only">Dragons Today — CRITICAL SECRET (DM Only)</h3>

        <ul>

        <li><strong>All seven founding dragons are still alive</strong> — hidden, withdrawn</li>

        <li>World considers them purely historical and mythological</li>

        <li>Dragons are extremely rare in current era — occasional individuals exist</li>

        <li>Dragon eggs believed to be fossils — viability unknown to world at large</li>

        <li>Dragon eggs are highly collectible</li>

        <li><strong>The Order of the Ancient Guard exists specifically to protect the living dragons</strong></li>

        </ul>

        </section>

        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-the-divine-structure"
        data-section="the-divine-structure">The Divine Structure</h3>

        <ul>

        <li><strong>Single supreme divine entity</strong> — analogous to Christianity&#39;s monotheism</li>

        <li>Historical deities venerated as saint-equivalents — subordinate to supreme being</li>

        <li>Shrines and temples may be dedicated to specific divine figures without contradicting monotheistic
        faith</li>

        <li>Different clans/regions have patron divine figures</li>

        <li><strong>Dragons</strong> occupy a unique revered position — between saints-equivalent and kami</li>

        <li>Kami (nature spirits) exist as a separate category of minor spiritual beings</li>

        </ul>

        <h3 id="kg-the-seven-dragon-clans-founding-era" data-section="the-seven-dragon-clans-founding-era">The Seven
        Dragon Clans — Founding Era</h3>

        <table>

        <thead>

        <tr>

        <th>Clan</th>

        <th>Dragon</th>

        <th>Color</th>

        <th>Island</th>

        <th>Domain</th>

        </tr>

        </thead>

        <tbody><tr>

        <td><strong>Crimson Clan</strong></td>

        <td>Akaryū</td>

        <td>Red</td>

        <td>Fushichō</td>

        <td>Fire, volcanic power, strength</td>

        </tr>

        <tr>

        <td><strong>Azure Clan</strong></td>

        <td>Aoryū</td>

        <td>Blue</td>

        <td>Kawa</td>

        <td>Water, storms, coastal protection</td>

        </tr>

        <tr>

        <td><strong>Emerald Clan</strong></td>

        <td>Midoryū</td>

        <td>Green</td>

        <td>Hokori</td>

        <td>Nature, earth, healing, balance</td>

        </tr>

        <tr>

        <td><strong>Onyx Clan</strong></td>

        <td>Kokuryū</td>

        <td>Black</td>

        <td>Tatara</td>

        <td>Shadow, darkness, cunning, mystery</td>

        </tr>

        <tr>

        <td><strong>Golden Clan</strong></td>

        <td>Kinryū</td>

        <td>Gold</td>

        <td>Hokori (central highlands)</td>

        <td>Honor, justice, nobility, mediation</td>

        </tr>

        <tr>

        <td><strong>Silver Clan</strong></td>

        <td>Ginryū</td>

        <td>Silver</td>

        <td>Fuukajima</td>

        <td>Grace, purity, ice, cold, moon/stars</td>

        </tr>

        <tr>

        <td><strong>Amethyst Clan</strong></td>

        <td>Murasakiryū</td>

        <td>Purple</td>

        <td>Shizukajima</td>

        <td>Arcane knowledge, divination, mystical arts</td>

        </tr>

        </tbody></table>

        <h3 id="kg-first-emperor" data-section="first-emperor">First Emperor</h3>

        <p><strong>Tenryū no Mikado</strong> — descended from both Crimson and Golden bloodlines; united clans ~8000;
        established first imperial dynasty</p>

        <h3 id="kg-dragon-legacy-in-society" data-section="dragon-legacy-in-society">Dragon Legacy in Society</h3>

        <ul>

        <li>Dragonborn within Kugai claim descent from dragon founders — legitimizes noble authority</li>

        <li>Many daimyo trace lineage to founding dragons</li>

        <li>Temples, shrines, festivals honor dragon ancestors annually</li>

        <li>The arcadian (elf) imperial line descended from dragon-settler intermingling</li>

        </ul>

        </section>

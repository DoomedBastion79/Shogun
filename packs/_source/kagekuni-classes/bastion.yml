    value: >-
      <section class="kg-tier kg-tier-intro" data-tier="intro"><dl class="kg-infobox" data-kind="infobox"><div
      class="kg-info__row"><dt>Type</dt><dd data-field="type">class</dd></div></dl><p><em lang="ja-Latn">Homebrew caster
      class from GM Binder. The Bastion is an innate sei-manipulator

      who can absorb and redirect magical energy. Uses the Cleric spell list with

      Charisma-based known spellcasting (not prepared). d6 hit die, no armor, and a

      unique Overload Pool mechanic that rewards absorbing enemy spells at physical cost.</em></p>

      </section>

      <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-description"
      data-section="description">Description</h3>

      <p>Few in the world have the ability and resolve to stand toe to toe with a master

      seimaster and live to tell the tale. The Bastion has an innate binding to the

      flow of sei, and has the ability to shape magic — even magic already shaped by

      other casters and creatures. The flow of sei molds them into charismatic leaders

      destined to do great things.</p>

      <p>The Bastion specializes in stopping the misuse of magic: from the necromancer

      raising an army of dead to hags feeding on the life force of captured children,

      a Bastion uses their abilities to help those in need. Because of their

      charismatic nature, the raw power they can hold, and the ease at which they

      handle difficult individuals, Bastions are often found as leaders later in life.</p>

      <p>There are few Bastions in the world. No one knows how a mortal becomes one, but

      each generation produces only a handful. The bond with the flow of sei can tear

      at mental capacity and even impact physical health.</p>

      <h3 id="kg-quick-reference" data-section="quick-reference">Quick Reference</h3>

      <ul>

      <li><strong>Hit Die:</strong> d6 (6 + Con at 1st; 1d6 + Con per level after)</li>

      <li><strong>Saves:</strong> Charisma, Constitution</li>

      <li><strong>Armor:</strong> None</li>

      <li><strong>Weapons:</strong> Simple weapons</li>

      <li><strong>Tools:</strong> None</li>

      <li><strong>Skills:</strong> Pick 3 from Arcana, Deception, History, Insight, Intimidation,

      Medicine, Perception, Religion</li>

      <li><strong>Spellcasting:</strong> Cleric spell list, Charisma-based, known spells (not prepared)</li>

      <li><strong>Subclass pick at:</strong> Level 3 (Bastion Order)</li>

      <li><strong>Subclass features at:</strong> 3, 5, 10, 18</li>

      <li><strong>Restriction:</strong> Cannot multiclass with other caster classes</li>

      </ul>

      <h3 id="kg-starting-equipment" data-section="starting-equipment">Starting Equipment</h3>

      <ul>

      <li>(a) any simple weapon, staff, or warhammer</li>

      <li>(a) a sling and 20 stones</li>

      <li>(a) an adventurer&#39;s pack or (b) a priest&#39;s pack</li>

      </ul>

      <h3 id="kg-quick-build" data-section="quick-build">Quick Build</h3>

      <p>Charisma is your primary stat — it drives AC, spellcasting, and most class

      features. Constitution provides HP to absorb more magical energy. Dexterity

      improves AC and reflexive capabilities.</p>


      <h3 id="kg-core-class-features-summaries" data-section="core-class-features-summaries">Core Class Features
      (Summaries)</h3>

      <p>Paraphrased from the source. Consult the GM Binder document for full rules text.</p>

      <ul>

      <li><strong>Spellcasting (1):</strong> Uses the Cleric spell list with Charisma as the casting

      stat. Known spells (not prepared) — learn 2 at 1st level and more as shown in

      the table. Can swap one known spell per level-up. Ritual casting supported.

      Spellcasting focus: holy symbol, staff, or wand.<ul>

      <li><em lang="ja-Latn">Spell save DC = 8 + PB + CHA mod</em></li>

      <li><em lang="ja-Latn">Spell attack = PB + CHA mod</em></li>

      </ul>

      </li>

      <li><strong>Unarmored Defense (1):</strong> While wearing no armor, AC = 10 + DEX mod + CHA mod.</li>

      <li><strong>Spell Absorption (2):</strong> As a reaction when an enemy you can see within 60 ft

      casts a spell, you can absorb it. The absorbed spell&#39;s levels are distributed

      among your empty spell slots. You may make an Arcana check against the caster&#39;s

      DC to identify the spell first. Range increases to 120 ft at 12th level and

      180 ft at 16th level.<ul>

      <li><strong>Overload Pool:</strong> Spell levels that cannot fit into empty slots go into an

      overload pool. Using overload magic to cast costs 1d6 max HP per overload

      level used (not mitigable; restored on long rest).</li>

      <li><strong>Mass Discharge:</strong> At end of your turn, if overload is not empty, the raw

      magic discharges: 1d10 psychic per overload point to yourself, and every

      creature within 15 ft makes an INT save (DC 12 + overload points) for half.</li>

      </ul>

      </li>

      <li><strong>Bastion Order (3):</strong> Choose a subclass: Order of the Sword, Order of the

      Shield, or Order of the Staff. Features at 3, 5, 10, 18.</li>

      <li><strong>Bolster Spell (5):</strong> You can use overload points to upcast a spell (up to

      your max spell level). Cannot use this to cast higher-level spells you don&#39;t

      have slots for — only to increase the casting level of a spell already being

      cast from a slot.</li>

      <li><strong>Magic Field (7):</strong> When you are the target of a magical effect or within a

      spell&#39;s area, make a CHA save (DC 14 + spell level). On failure, you

      automatically absorb the spell via Spell Absorption. This is not considered

      magical for advantage purposes.</li>

      <li><strong>Arcane Sight (10):</strong> You permanently see as if <em lang="ja-Latn">detect magic</em> is cast. At

      14th level, you gain truesight.</li>

      <li><strong>Absorbing Touch (13):</strong> As an action, absorb one spell effect on yourself or

      one willing creature you touch. Uses: CHA mod per long rest.</li>

      <li><strong>Arcane Appetite (14):</strong> You are resistant to magic and magical effects.</li>

      <li><strong>Divine Mastery (20):</strong> Cast one 8th-level and one 9th-level spell per long

      rest from a specific list:<ul>

      <li><em lang="ja-Latn">8th:</em> Antimagic Field, Control Weather, Dominate Monster, Earthquake,

      Holy Aura, Mind Blank, Sunburst</li>

      <li><em lang="ja-Latn">9th:</em> Invulnerability, Mass Heal, Prismatic Wall, True Resurrection, Wish</li>

      </ul>

      </li>

      </ul>

      <h3 id="kg-orders-of-the-bastion-subclasses" data-section="orders-of-the-bastion-subclasses">Orders of the Bastion
      (Subclasses)</h3>

      <p><strong>1. Order of the Sword</strong> — Offensive magic focus. Uses the flow of sei to

      empower spells and minimize overload cost when on the attack.</p>

      <ul>

      <li><strong>Divine Precision (3):</strong> Bonus action: +10 to a ranged spell attack roll

      (after seeing the roll, before result). Uses: CHA mod per long rest.</li>

      <li><strong>Managed Overload (5):</strong> Add CHA mod to damage on single-target spells cast

      from overload. Take half the max HP damage when using overload for ranged

      spell attacks.</li>

      <li><strong>Divine Leverage (10):</strong> Advantage on spell attacks made entirely from

      overload magic. Bolstered spells (slot + overload) do not benefit.</li>

      <li><strong>Divine Retribution (18):</strong> When casting a single-target spell, duplicate it

      to a second target using overload levels equal to the spell level. Uses: CHA

      mod per long rest.</li>

      </ul>

      <p><strong>2. Order of the Shield</strong> — Defensive and protection focus. Manipulates the

      flow of sei to ward allies and resist harmful effects.</p>

      <ul>

      <li><strong>Divine Ward (3):</strong> Bonus action: expend a spell slot to place a ward on a

      creature within 30 ft. Ward absorbs 1d6 damage per spell slot level.</li>

      <li><strong>Improved Divine Ward (5):</strong> Warded creatures have resistance to non-magical

      piercing, bludgeoning, and slashing. Bastion adds PB to WIS saves.</li>

      <li><strong>Divine Protection (10):</strong> Immune to disease, poison damage, and the

      poisoned condition.</li>

      <li><strong>Divine Guard (18):</strong> Resistant to magic and magical effects (except Mass

      Discharge).</li>

      </ul>

      <p><strong>3. Order of the Staff</strong> — Healing and support focus. Uses divine energy to

      keep allies at full capacity.</p>

      <ul>

      <li><strong>Divine Gifts (3):</strong> Grant an inspiration die to an ally within 60 ft. The

      creature adds it to one ability check, attack, or save (decide after d20 roll,

      before result). Alternatively, use it as a heal (add CHA mod). Die scales:

      d6 (3rd), d8 (7th), d10 (13th), d12 (17th). Uses: CHA mod per long rest.</li>

      <li><strong>Blessed Soul (5):</strong> When you cast a healing spell on another creature, you

      heal 2 + spell level HP. Take half the max HP damage when using overload to

      heal allies.</li>

      <li><strong>Evasion (10):</strong> DEX saves for half damage become no damage on success, half

      on failure.</li>

      <li><strong>Supreme Healing (18):</strong> Reroll any 1s and 2s on healing dice (must use the

      new roll).</li>

      </ul>

      </section>

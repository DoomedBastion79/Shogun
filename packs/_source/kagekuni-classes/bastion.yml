      <p><em lang="ja-Latn">Spells of 6th level and higher are unavailable as native slots and must be reached through
      your Sei Codex (inscribed via Spell Absorption) or Divine Mastery&#39;s reserved inscriptions.</em></p>

      <h3 id="kg-core-class-features-summaries" data-section="core-class-features-summaries">Core Class Features
      (Summaries)</h3>

      <ul>

      <li><strong>Spellcasting (1):</strong> Half-caster on the Cleric spell list with Charisma

      as the casting stat. Spell slots progress as a Paladin, extended so the

      Bastion has slots from 1st level. Maximum slot level is 5th. Spells are

      <strong>prepared</strong> each long rest: prepare CHA mod + ½ Bastion level (round down,

      min 1). Cantrips: 2 / 3 (L5) / 4 (L12). Ritual casting supported.

      Spellcasting focus: holy symbol, staff, or wand.<ul>

      <li><em lang="ja-Latn">Spell save DC = 8 + PB + CHA mod</em></li>

      <li><em lang="ja-Latn">Spell attack = PB + CHA mod</em></li>

      <li><em lang="ja-Latn">Cannot multiclass with another spellcasting class.</em></li>

      </ul>

      </li>

      <li><strong>Unarmored Defense (1):</strong> While wearing no armor, AC = 10 + DEX mod + CHA mod.

      Armor is a sei barrier and prevents Spell Absorption.</li>

      <li><strong>Spell Absorption (2):</strong> Reaction when a creature you can see within 60 ft

      casts a spell. Optional Arcana check vs. caster&#39;s DC to identify the spell

      first. Choose a destination for the absorbed levels: empty spell slots,

      Sei Codex (inscribe), or overload pool. Leftover levels spill to overload.

      Range becomes 120 ft at L12, 180 ft at L16.<ul>

      <li><em lang="ja-Latn">Self-cast exclusion:</em> never triggers on your own spells, nor on spells

      aimed at you only by an aiding ally.</li>

      <li><strong>Overload Pool:</strong> spent points fuel features like Bolster Spell; each

      point spent costs 1d6 max HP (recovered on long rest).</li>

      <li><strong>Mass Discharge:</strong> end of turn, overload discharges as 1d10 psychic

      per point to you + INT save (DC 12 + points) for half to creatures

      within 15 ft.</li>

      </ul>

      </li>

      <li><strong>Sei Deflection (2):</strong> Reaction when a creature within 30 ft makes a

      weapon attack vs. you or an ally within 30 ft — impose disadvantage and

      grant temp HP equal to your Bastion level + CHA mod. PB / long rest.<ul>

      <li><strong>Counterstrike (9):</strong> if the disadvantaged attack still hits, you may

      expend a spell slot (no higher than half your level rounded up) to

      reduce damage by 1d10 / slot level and grant additional temp HP equal

      to the damage reduced. Same reaction.</li>

      </ul>

      </li>

      <li><strong>Sei Codex (2):</strong> You forge your bonded Sei Codex (a personal artifact

      of your choosing — book, jade tablet, fan, tattoo set, weapon-engraving,

      etc.). It requires attunement.<ul>

      <li><em lang="ja-Latn">Attunement bonus:</em> +1 / +2 / +3 to spell attack rolls and spell save DC at levels 2 /
      11 / 17 while attuned (lost if the

      Codex is destroyed or beyond your reach).</li>

      <li><em lang="ja-Latn">Inscribe</em> absorbed spells into the Codex (any class list, any level).</li>

      <li><em lang="ja-Latn">Capacity:</em> CHA mod + PB inscriptions; release one on long rest, or

      force-release mid-day for 1d10 psychic / spell level to yourself.</li>

      <li><em lang="ja-Latn">Cast</em> from the Codex as an action (your DC, components consumed). Cast

      at the absorbed level or upcast up to your highest available slot.</li>

      <li><em lang="ja-Latn">Cost:</em> <code>cast level × 1d6</code> max HP, recovered on long rest.</li>

      <li><em lang="ja-Latn">Daily uses:</em> unlimited at or below your max slot; CHA mod / long rest

      for casts above your max slot, pooled.</li>

      <li><em lang="ja-Latn">Wish stress:</em> RAW; on failure, the Wish inscription burns out and

      Wish is permanently unavailable to you.</li>

      <li><em lang="ja-Latn">Loss:</em> if the Codex is destroyed/unrecovered, all inscriptions are

      lost. Replacement: 7 days + 100 gp; starts empty.</li>

      </ul>

      </li>

      <li><strong>Bastion Order (3):</strong> Choose a subclass: Order of the Sword, Order of

      the Shield, or Order of the Staff. Features at 3, 5, 10, 18.<ul>

      <li><em lang="ja-Latn">Channeling Pool:</em> CHA mod + PB charges per long rest, used by your

      Order&#39;s signature feature (Sei Brand, Divine Ward, or Sei Conduit).

      Some uses consume additional resources (notably Shield&#39;s Recharge Ward

      action and its slot/overload empowerment).</li>

      </ul>

      </li>

      <li><strong>Bolster Spell (5):</strong> When casting from a slot, spend overload points

      to raise the spell&#39;s effective casting level by 1 per point. Each

      overload point costs 1d6 max HP. Cap scales with Bastion level: 3rd at

      L5, 5th at L9, 7th at L13, 9th at L17. Does not apply to Codex casts or

      Divine Mastery casts.</li>

      <li><strong>Magic Field (7):</strong> When you are the target of a magical effect or

      within a spell&#39;s area, make a CHA save (DC 14 + spell level). On failure,

      you automatically absorb the spell via Spell Absorption. This is not

      considered magical for advantage purposes.</li>

      <li><strong>Arcane Sight (10):</strong> You permanently see as if <em lang="ja-Latn">detect magic</em> is cast.

      At 14th level, you gain truesight.</li>

      <li><strong>Absorbing Touch (13):</strong> As an action, absorb one spell effect on

      yourself or one willing creature you touch. Uses: CHA mod per long rest.</li>

      <li><strong>Arcane Appetite (14):</strong> You are resistant to magic and magical effects.</li>

      <li><strong>Divine Mastery (20):</strong> Two reserved inscription slots are added to your

      Sei Codex outside its normal capacity — one 8th-level and one 9th-level

      spell from the Divine Mastery lists:<ul>

      <li><em lang="ja-Latn">8th:</em> Antimagic Field, Control Weather, Dominate Monster, Earthquake,

      Holy Aura, Mind Blank, Sunburst</li>

      <li><em lang="ja-Latn">9th:</em> Invulnerability, Mass Heal, Prismatic Wall, True Resurrection, Wish

      Reserved inscriptions cast with <strong>no max HP cost</strong>, <strong>once per inscription</strong>

      between long rests. Long rest refreshes both as the same spell; you may

      instead swap either to a different spell of the same tier from the Divine

      Mastery list (swapping also refreshes). Casts still count against the CHA

      mod / long rest above-tier Codex cap. <em lang="ja-Latn">Wish stress is RAW:</em> on failure,

      the inscription burns out and Wish is permanently unavailable.</li>

      </ul>

      </li>

      </ul>

      <h3 id="kg-orders-of-the-bastion-subclasses" data-section="orders-of-the-bastion-subclasses">Orders of the Bastion
      (Subclasses)</h3>

      <p><strong>Channeling Pool.</strong> Each Order grants you a signature method of channeling sei into a target —
      Sei Brand (Sword), Divine Ward (Shield), or Sei Conduit (Staff). You may channel a number of times per long rest
      equal to <strong>CHA mod + PB</strong> (charges). The cost of placing your Order&#39;s signature feature is one
      charge. Some uses (notably Shield&#39;s Recharge Ward action and slot/overload empowerment) consume additional
      resources beyond a charge.</p>

      <p><strong>1. Order of the Sword</strong> — Offensive focus. Brands a single hostile target as the focal point of
      your party&#39;s offense, then channels overload and Codex casts to amplify every blow.</p>

      <ul>

      <li><strong>Sei Brand (3):</strong> Bonus action; spend one charge to brand a hostile creature within 30 ft for 1
      minute or until they drop to 0 HP. Allies&#39; attacks against the branded creature deal +PB force damage. Your
      other Sword features trigger only against branded targets. One brand at a time (two at L18); if you&#39;d exceed
      your limit, you choose which active brand to dispel.</li>

      <li><strong>Divine Precision (3):</strong> Bonus action: +10 to a ranged spell attack roll or martial weapon
      attack roll, after seeing the d20 result. Works on any target. CHA mod / long rest.</li>

      <li><strong>Sei-Edged Strike (5):</strong> Once per turn, on a hit (weapon or spell attack) or save-fail against
      any of your damaging spells — single-target or AoE — against a branded creature, deal +1d6 force damage. Scales
      2d6/3d6 at L11/L17. <em lang="ja-Latn">Sei-Pressed:</em> 1+ overload spent on the triggering spell upgrades the
      die to d8; 5+ overload spent upgrades it to d10. Overload max-HP costs are halved (Efficient Channel).</li>

      <li><strong>Divine Leverage (10):</strong> When you cast a damaging spell against a branded target using overload
      or Codex, choose advantage on attack rolls or disadvantage on the branded target&#39;s first save. <em
      lang="ja-Latn">Killing Stride:</em> when you reduce any creature to 0 HP (branded or not) with any
      attack/spell/feature, make a weapon attack or cantrip as a bonus action.</li>

      <li><strong>Divine Retribution (18):</strong> Concurrent brands becomes 2. <em lang="ja-Latn">Twin Brand (bonus
      action):</em> spend 2 charges to brand two creatures within 30 ft simultaneously; while both are branded,
      single-target damaging spells cast against one duplicate to the other. (Sei-Edged fires once per turn — original
      only.)</li>

      </ul>

      <p><strong>2. Order of the Shield</strong> — Defensive and protection focus. Channels sei into Divine Wards that
      absorb damage, detonate when overload-fueled, and progressively shield more allies as the Bastion grows.</p>

      <ul>

      <li><strong>Divine Ward (3):</strong> Bonus action; spend one charge per target to ward a willing creature within
      30 ft for 1 minute. <em lang="ja-Latn">Charge alone:</em> CHA mod temp HP. <em lang="ja-Latn">Charge + slot:</em>
      one slot fuels the action with <code>1d8 per slot level + CHA mod</code> temp HP, split evenly across all wards
      placed by the action. <em lang="ja-Latn">Charge + overload (Sei-Wrought):</em> same scale, split evenly, plus
      detonation enabled. <em lang="ja-Latn">Multi-Target Placement:</em> in one bonus action, target up to your
      concurrent limit (1 at L3, 2 at L10, 3 at L18); the slot or overload empowerment shares across the wards. <em
      lang="ja-Latn">Concurrency drop rule:</em> if placing would exceed your limit, choose which active wards to
      dispel. <em lang="ja-Latn">Recharge Ward:</em> as an action, spend a slot or overload to replace one active
      ward&#39;s temp HP pool.</li>

      <li><strong>Improved Divine Ward (5):</strong> Warded creatures gain resistance to non-magical p/s/b and
      <strong>+1 AC</strong>. When a ward&#39;s temp HP is reduced to 0 (the moment it transitions to its persistent
      state), the warded creature gains temp HP equal to CHA mod + half Bastion level. Bastion adds PB to WIS
      saves.</li>

      <li><strong>Divine Protection (10):</strong> Immune to disease, poison damage, the poisoned condition, and the
      frightened condition. Reaction: when a creature within 30 ft would be charmed/frightened/poisoned, place a Divine
      Ward on them (paying its normal cost) and the save automatically succeeds. Concurrent ward limit increases to
      <strong>2</strong>.</li>

      <li><strong>Divine Guard (18):</strong> Concurrent ward limit increases to <strong>3</strong>. You and any warded
      creature have resistance to damage from spells. <em lang="ja-Latn">Ward-Shatter Rescue:</em> when a warded
      creature would drop to 0 HP from a single damage event, the ward shatters and the creature is left at 1 HP instead
      (once per ward instance; mutually exclusive with detonation). <em lang="ja-Latn">Mass Discharge ignores this
      protection.</em></li>

      </ul>

      <p><strong>3. Order of the Staff</strong> — Healing and support focus. Anchors allies through Sei Conduits to
      extend healing range, then bolsters allies&#39; rolls and cleanses conditions through prolonged conflict.</p>

      <ul>

      <li><strong>Sei Conduit (3):</strong> Bonus action; spend one charge per target to anchor a willing ally within 30
      ft for 1 minute. The conduit grants CHA mod temp HP, extends Touch/Self healing spells to a 60-ft range to the
      warded ally, adds +PB HP to your heals on them, and (when a Divine Gift is granted to a conduit-warded ally) lets
      the recipient end one of: charmed, frightened, paralyzed, or poisoned. <em lang="ja-Latn">Multi-Target
      Placement:</em> in one bonus action, target up to your concurrent limit (1 at L3, 2 at L18). <em
      lang="ja-Latn">Concurrency drop rule:</em> if placing would exceed your limit, choose which active conduits to
      dispel.</li>

      <li><strong>Divine Gifts (3):</strong> Bonus action; grant a Divine Gift die (d6 → d12 by tier) to a creature
      within 60 ft. Recipient may use within 10 minutes for a roll boost (after seeing the d20 result, before learning
      the outcome) or as a heal of die + CHA mod. CHA mod / long rest. Independent of Sei Conduit.</li>

      <li><strong>Blessed Soul (5):</strong> Healing spells you cast on others restore an additional 2 + spell level HP.
      Overload-fueled heals cost half the normal max HP. <em lang="ja-Latn">Reactive Mend:</em> when a creature within
      30 ft is reduced to 0 HP but not killed outright, you may use your reaction to expend a spell slot and heal them
      for <code>1d8 per slot level + CHA mod</code>; they remain conscious. For conduit-warded allies, this range
      extends to 60 ft.</li>

      <li><strong>Greater Vitality (10):</strong> <em lang="ja-Latn">Evasion</em> — DEX saves for half become no damage
      on success, half on fail. <em lang="ja-Latn">Cleansing Channel</em> — once per turn, when you cast a 1st-level or
      higher spell that restores HP, the spell also ends one of: blinded, charmed, deafened, frightened, paralyzed, or
      poisoned on the target.</li>

      <li><strong>Supreme Healing (18):</strong> Concurrent conduits becomes 2. All healing dice are treated as their
      maximum value. <em lang="ja-Latn">Sei Reservoir:</em> while you are conscious, you and any friendly creature
      within 30 ft of you (or any conduit-warded creature within 60 ft) that begins your turn below their HP maximum
      regains HP equal to your CHA mod (no overflow into temp HP).</li>

      </ul>

      <h3 id="kg-campaign-integration-notes" data-section="campaign-integration-notes">Campaign Integration Notes</h3>

      <ul>

      <li>The Bastion&#39;s innate connection to sei aligns with Kagekuni&#39;s cosmology where

      sei flows through all living things. A Bastion is someone born with an

      unusually deep and reactive bond to that flow — able to absorb and redirect

      sei that others have shaped.</li>

      <li>The rarity of Bastions (a few per generation) makes them significant figures.

      In Kagekuni, they might be sought after by daimyo as court advisors, feared

      by hostile seimasters, or hunted by those who view their abilities as

      unnatural.</li>

      <li><strong>Order of the Sword</strong> maps well to warrior-mages in service to a lord,

      using absorbed sei as offensive ammunition.</li>

      <li><strong>Order of the Shield</strong> fits temple guardians or bodyguards to important

      figures — absorbing threats directed at their charge.</li>

      <li><strong>Order of the Staff</strong> aligns with wandering healers or monastery leaders

      who channel sei to sustain their community.</li>

      <li>The Overload Pool mechanic — absorbing more magic than you can hold, at

      cost to your body — resonates with Kagekuni&#39;s theme that sei has real,

      tangible consequences. The Mass Discharge represents sei violently escaping

      a mortal vessel.</li>

      </ul>

      </section>

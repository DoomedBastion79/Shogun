      <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-description"
      data-section="description">Description</h3>

      <p>A discipline of armed and unarmed combat taught in the monasteries of Seizan and

      Hokori&#39;s mountain orders. Buddhist Monks of this path — the <em lang="ja-Latn">Tranquil Lotus</em> among

      them — train the body as an instrument of ki and follow one of twelve Ways. Where

      an SRD monk is a lightly armored martial artist, the Buddhist Monk leans harder

      into ki expenditure, tool mastery, and a broader weapon repertoire (simple <em lang="ja-Latn">and</em>

      martial proficiency).</p>

      <h3 id="kg-quick-reference" data-section="quick-reference">Quick Reference</h3>

      <ul>

      <li><strong>Hit Die:</strong> d10 (10 + Con at 1st; 1d10 + Con per level after)</li>

      <li><strong>Saves:</strong> Dexterity, Wisdom</li>

      <li><strong>Armor:</strong> Light only</li>

      <li><strong>Weapons:</strong> Simple and martial</li>

      <li><strong>Tools:</strong> One artisan&#39;s tool or musical instrument (player choice)</li>

      <li><strong>Skills:</strong> Pick 3 from Acrobatics, Athletics, History, Insight, Investigation,

      Nature, Perception, Religion, Stealth</li>

      <li><strong>Subclass pick at:</strong> Level 3 (Way of the Monk)</li>

      <li><strong>Subclass features at:</strong> 3, 6, 11, 17</li>

      </ul>

      <h3 id="kg-starting-equipment" data-section="starting-equipment">Starting Equipment</h3>

      <ul>

      <li>(a) one martial weapon of your choice <strong>or</strong> (b) two simple weapons of your choice</li>

      <li>(a) an explorer&#39;s pack <strong>or</strong> (b) a dungeoneer&#39;s pack</li>

      <li>Alternative starting wealth: 2d4 × 10 gp</li>

      </ul>


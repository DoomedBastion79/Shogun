      <h3 id="kg-core-class-features-summaries" data-section="core-class-features-summaries">Core Class Features
      (Summaries)</h3>

      <p>Paraphrased. Consult the source wiki for full rules text and exact costs.</p>

      <ul>

      <li><strong>Unarmored Mastery (1):</strong> While unarmored and without a shield, AC = 10 + Dex + Wis;

      gain bonus speed and can run along walls or across water while ki is active. Gains

      a limited flight option at 9 while holding at least 1 ki.</li>

      <li><strong>Martial Arts (1):</strong> Use Dex for unarmed and monk-weapon attacks; substitute the

      Martial Arts die for normal damage; get a bonus-action unarmed strike whenever

      you Attack with an unarmed strike or monk weapon.</li>

      <li><strong>Ki (2):</strong> Pool of ki points recovered on a short rest after 30 minutes of

      meditation. Base uses: <strong>Flurry of Blows</strong> (1 ki, two bonus-action strikes),

      <strong>Patient Defense</strong> (1 ki, Dodge as bonus action), <strong>Step of the Wind</strong> (1 ki,

      Dash/Disengage as bonus action, doubled jump, no OA). Ki save DC = 8 + PB + Wis.</li>

      <li><strong>Body Improvements (2):</strong> Proficiency in Perception and Insight (doubled if

      already proficient).</li>

      <li><strong>Way of the Monk (3):</strong> Pick a subclass; features at 3, 6, 11, 17.</li>

      <li><strong>Ki Enhancement (3):</strong> Pick one of Empowered Strike, Energy Armor, or Weapon

      Enhancement — each burns ki for different offensive/defensive riders.</li>

      <li><strong>Deflect Projectiles (3):</strong> Reaction reduces ranged damage by Martial Arts die +

      Dex + monk level; reducing to 0 lets you throw the projectile back for 1 ki. Extra

      dedicated reactions unlock at 8 and 13.</li>

      <li><strong>Slow Fall (4):</strong> Reaction reduces falling damage by 5 × monk level.</li>

      <li><strong>Unlocked Ki (4, 10):</strong> Adds Abundant Step, Focused Aim, Ki Sphere at 4; Iron

      Fist, Karmic Strike, Weakening Touch, and Ki Surge at 10.</li>

      <li><strong>Extra Attack (5, 11):</strong> Two attacks at 5, three at 11.</li>

      <li><strong>Stunning Strike (5):</strong> 1 ki on a melee hit forces a Con save or stun until end

      of your next turn. Later options let you paralyze or blind instead.</li>

      <li><strong>Ki-Empowered Strikes (6):</strong> Unarmed strikes (or monk weapons, your pick) count

      as magical and add a Wisdom-scaled damage die. Both options become magical at 11.</li>

      <li><strong>Monk Training / Advanced / Ultimate (6, 12, 16):</strong> Bonus feats chosen from

      curated Body, Martial Arts, Ki, Ki Manipulation, and Healing feat lists, with one

      non-level prerequisite waived.</li>

      <li><strong>Resistant (7):</strong> Pick a high ability (16+); successful saves of that ability for

      half damage now take no damage, failures take half. A second option unlocks at 17.</li>

      <li><strong>Stillness of Mind (7):</strong> Action to remove charmed or frightened from yourself.</li>

      <li><strong>Ki-Enhanced Critical (8):</strong> While you have at least 1 ki, crit range expands to

      19–20; at 16, 18–20.</li>

      <li><strong>Ki Recovery (9):</strong> Regain 1 ki at the start of each of your combat turns.</li>

      <li><strong>Limit Break (10, 14, 18):</strong> +2 to Str or Dex (pick), Con, and Wis, raising the

      cap — to 22 at 10, 24 at 14, 26 at 18.</li>

      <li><strong>Purity of Body (10):</strong> Immune to disease and poison.</li>

      <li><strong>Advanced Energy Usage (11):</strong> Pick two &quot;ki energy use&quot; options — imbuing

      objects into improvised weapons, rendering them volatile, etc. Ki costs scale

      with object size.</li>

      <li><strong>Tongue of the Sun and Moon (13):</strong> Understand and be understood in any spoken

      language.</li>

      <li><strong>Diamond Soul (14):</strong> Proficient in all saves; spend 1 ki to reroll a failed save.</li>

      <li><strong>Timeless Body (15):</strong> No aging, no need for food or water, spend ki to extend

      breath-holding.</li>

      <li><strong>Empty Body (18):</strong> 4 ki for 1-minute invisibility with resistance to all damage

      except force; 6 ki to cast <em lang="ja-Latn">astral projection</em> on yourself.</li>

      <li><strong>Enlightenment (20):</strong> +4 to Str or Dex, Con, and Wis. Once per turn activate a

      1-ki feature free. Bonus action to regain (2 × Wis mod) ki, uses = ½ PB. Spend 1

      ki to manifest a Third Eye — 20 ft truesight and immunity to surprise for 1 min.</li>

      </ul>

      <h3 id="kg-ways-of-the-monk-subclasses" data-section="ways-of-the-monk-subclasses">Ways of the Monk
      (Subclasses)</h3>

      <p>Twelve subclasses are available, each granting features at 3, 6, 11, and 17. Short

      original summaries:</p>

      <ol>

      <li><strong>Ki Manipulator</strong> — scholar-monk path specializing in ki efficiency, ally

      healing, and high-level elemental &quot;Deva&quot; transformations.</li>

      <li><strong>Sun Soul</strong> — channels ki as searing radiant light and solar bolts.</li>

      <li><strong>Astral Self</strong> — manifests a spectral inner self (arms, face, body) that fights

      with force damage.</li>

      <li><strong>Living Weapon</strong> — pure martial body-hardening path focused on stacked unarmed

      strikes and an awakened combat state.</li>

      <li><strong>Drunken Master</strong> — unpredictable brawler who drinks for buffs, redirects

      attacks, and eventually breathes fire.</li>

      <li><strong>Kensei</strong> — treats weapons as monk weapons, adds medium armor training, and

      layers combat techniques onto flurries and parries.</li>

      <li><strong>Long Death</strong> — studies mortality, draining vitality as temp HP and inflicting

      fear and necrotic damage.</li>

      <li><strong>Mercy</strong> — wandering healer-monks whose hands can soothe or wound, combining

      necrotic strikes with potent ki-powered healing pools.</li>

      <li><strong>Shadow</strong> — ninja-flavored shadow-benders who hide in dim light and move unseen.</li>

      <li><strong>Open Hand</strong> — classic pressure-point path controlling the battlefield via

      knockdown, shove, and reaction suppression through Flurry of Blows.</li>

      <li><strong>Four Elements</strong> — elemental spellcaster-monks converting ki into fire, water,

      earth, or air discipline effects.</li>

      <li><strong>Cobalt Soul</strong> — investigator-monks who &quot;analyze&quot; enemies to learn resistances

      and vulnerabilities, then exploit that intel with extra reactions.</li>

      </ol>

      <h3 id="kg-campaign-integration-notes" data-section="campaign-integration-notes">Campaign Integration Notes</h3>

      <ul>

      <li>The <strong>Order of the Tranquil Lotus</strong> on Seizan is the canonical home of this class

      in Kagekuni. Elder Benkei is the most prominent practitioner; Sun Wukong is a

      novice delegate.</li>

      <li>The class&#39;s doubled ki pool and &quot;Unlocked Ki&quot; options line up thematically with

      the Tranquil Lotus&#39;s deep meditation practices. The d10 hit die can be justified

      in-setting as the rigorous monastic body conditioning.</li>

      <li><strong>Ways used by established NPCs:</strong> Benkei&#39;s affinities suggest he may be a <em
      lang="ja-Latn">Ki

      Manipulator</em> or <em lang="ja-Latn">Astral Self</em> practitioner. Final decision TBD by DM.</li>

      <li>The Seizan Guhuza connection (see <code>races/guhuza.md</code>) means many canonical monks

      of the order are Guhuza by race — the species&#39; Int +2, darkvision, and longevity

      dovetail with the class&#39;s scholarly, ki-focused design.</li>

      </ul>

      </section>

    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Ryūjika 竜鹿 (Dragon Deer)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong>
      hunting<br><strong>Preservation:</strong> 2 days fresh; indefinitely smoked or salted<br><strong>Tools:</strong>
      Bow or polearm; cook's utensils for butchery<br><strong>Grade:</strong> 特上 Tokujō (craft modifier: +2)</p>

      </article>

      </div>

      <p>A rare, long-limbed deer of the high plateaus — said to carry a trace of dragon lineage in its bearing. The
      meat is darker than common venison and carries a subtle warmth in its flavour, as though the animal were faintly
      hot-blooded. Highly sought by noble hunters and by temple cooks preparing ceremonial meals.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Ryūjika are traditionally hunted only by samurai and only with express permission from the local daimyo;
      poaching is a serious offence. A kill usually also yields antler material for the Hone category.</p>

      </section>

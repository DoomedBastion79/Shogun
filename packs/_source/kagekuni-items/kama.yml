    value: >-
      <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-description"
      data-section="description">Description</h3>

      <p>A short-handled sickle with a curved blade originally designed for harvesting rice, the kama became a weapon of
      necessity for farmers forbidden to carry swords. Paired kama in trained hands can hook weapons, catch limbs, and
      deliver quick slashing cuts. Burakumin communities have developed their own fighting traditions around this humble
      tool.</p>


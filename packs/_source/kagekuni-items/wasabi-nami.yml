      <article>

      <h4>Wasabi 山葵 (Mountain Horseradish)</h4>

      <p><strong>Category:</strong> Chomiryo<br><strong>Rarity:</strong> Common<br><strong>Source:</strong> Foraged
      (Saishū)<br><strong>Preservation:</strong> Fresh root 1–2 weeks in cold water; grated paste must be used same
      day<br><strong>Tools:</strong> Herbalism kit (advantage); small digging knife<br><strong>Grade:</strong> 並 Nami
      (craft modifier: -2)</p>

      </article>

      </div>

      <p>Found wild along cool, shaded streams in the mountains. The root is grated fresh for a sharp, sinus-clearing
      heat. Cultivated near Ayame and in Kaze&#39;s valleys, but the wild specimens are said to carry a cleaner,
      brighter bite.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Prime wasabi is an Ayame economic lever.</p>

      </section>

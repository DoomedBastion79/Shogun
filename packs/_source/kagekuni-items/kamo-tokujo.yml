      <article>

      <h4>Kamo 鴨 (Wild Duck)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong>
      Hunted<br><strong>Preservation:</strong> 2 days fresh; 14 days salted<br><strong>Tools:</strong> Bow, net, or
      sling; cook's utensils for dressing<br><strong>Grade:</strong> 特上 Tokujō (craft modifier: +2)</p>

      </article>

      </div>

      <p>Rich dark meat from the wild ducks that winter on Kagekuni&#39;s wetlands. The breast is layered with golden
      fat beneath dark rose flesh; the legs render for long braising. Duck in Hokori is traditionally paired with negi
      (leek) and a clear, savoury broth.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>The duck runs are among the defining hunts of late autumn in the lowland provinces. A skilled bowman working a
      morning flight can fill a pack in an hour.</p>

      </section>

  description:
    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Ōkami no Hone 狼の骨 (Mountain God's Bones)</h4>

      <p><strong>Category:</strong> Hone<br><strong>Rarity:</strong> VeryRare<br><strong>Source:</strong>
      one-time-harvest<br><strong>Preservation:</strong> Indefinite if kept dry. Raw bone benefits from cleaning and
      bleaching soon after harvest.<br><strong>Tools:</strong> Woodcarver's or bonecarver's tools for shaping; butcher's
      cleaver for initial sectioning<br><strong>Restrictions:</strong> Single-grade-locked. Does not follow standard
      grade progression — the nat-20 harvest check locked all bone material at 極上 Gokujō.</p>

      </article>

      </div>

      <p>A clean butchering preserved the long bones of the legs, the heavy bones of the spine, and the great curved
      ribs. Bone of this size and density is genuinely uncommon — most predators in Hokori are smaller creatures whose
      bones snap rather than carve. A bone-carver can shape these into hilts, scabbard fittings, ornamental inlays, and
      the kind of polished accents that mark an expensive weapon or a noble&#39;s accessories. There is enough material
      here to keep a single craftsman supplied for years.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>**One-time harvest.** Single-grade-locked at 極上 Gokujō. Party holds the full 350 lb of carving stock (tracked
      in `dm/campaign-state.md`).


      **Skill-Check Reveals** — one check per skill; nat-20 reveals all three.


      - **Religion (DC 13)** — Bones of a creature thought to be a kami avatar carry spiritual weight. Ground into bone
      meal and presented at a shrine, they constitute a significant offering. Carved into prayer beads or ritual
      implements, they serve as a permanent reminder of the offering and may carry the kami&#39;s favour with them.

      - **Nature (DC 11)** — Excellent carving stock. The character can identify which bones are best suited to which
      products — femurs for sword hilts, ribs for scabbard fittings, vertebrae for ornaments and beads. Knows the going
      rate per pound raw and per pound cut.

      - **Arcana (DC 14)** — The bone is *resonant* — it carries a faint sei echo when struck, a quality prized by
      arcane focus makers. Carved into a focus, it would suit a seimaster whose practice leans toward warding,
      banishment, or anti-spirit magics. Particularly valuable to seimasters in Sora and Kaze.


      Cross-references: See Kegawa → Ōkami no Kegawa; Hone → Ōkami no Zugai / Kiba / Tenohira; Niku → Ōkami-niku and
      related cuts.</p>

      </section>

      <div class="fvtt advice">

      <article>

      <h4>Yama no Kimo 山の肝 (Mountain Liver)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong>
      one-time-harvest<br><strong>Preservation:</strong> 1 day fresh; 7 days salted or smoked<br><strong>Tools:</strong>
      Cook's utensils (precise preparation)<br><strong>Restrictions:</strong> One-time only</p>

      </article>

      </div>

      <p>A dark, fist-sized organ still faintly warm when pulled from the body cavity. Traditional mountain cooks
      consider this the single finest organ meat in Hokori — it carries a trace of the creature&#39;s essence, and
      eating it is said to sharpen the nerve and steady the breath. Suitable for a Refined dish.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Eating the liver grants Refined-tier buffs in the cooking system. Mountain hunters hold a loose tradition of
      offering the first cut of such a liver to a senior hunter or village elder.</p>

      </section>

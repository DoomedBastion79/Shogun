      <p>A slender, reed-edge herb whose leaves carry a sharp peppery bite — the wild cousin of cultivated spices.
      Fishermen along the Kinryūgawa use it as a traditional accompaniment to grilled river fish, and its leaves are
      often pressed onto sashimi as a pungent garnish. Abundant where clear water meets soft mud.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Fisherman&#39;s garnish; tie to river-travel encounters.</p>

      </section>

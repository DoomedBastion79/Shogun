      <article>

      <h4>Umikaze-na 海風菜 (Sea Wind Greens)</h4>

      <p><strong>Category:</strong> Yakuso<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> 3 days fresh; indefinitely salt-pickled<br><strong>Tools:</strong>
      Herbalism kit; climbing gear sometimes required<br><strong>Grade:</strong> 並 Nami (craft modifier: -2)</p>

      </article>

      </div>

      <p>A thick-leafed coastal plant that grows on cliff faces and rocky shorelines where the salt spray is constant.
      The leaves are succulent, salty, and faintly bitter — eaten raw they taste of the sea. Nami fishermen chew them
      during long watches. Used in cooking to add a briny depth without additional salt.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>A reliable source of salt-flavour for travelers without access to purchased seasonings.</p>

      </section>

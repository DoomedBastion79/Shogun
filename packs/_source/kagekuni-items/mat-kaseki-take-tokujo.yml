    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Kaseki-take 化石茸 (Fossil Shelf)</h4>

      <p><strong>Category:</strong> Kinoko<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> Nearly indefinite; dense flesh resists rot<br><strong>Tools:</strong>
      Herbalism kit (advantage); sharp tool for harvesting dense flesh<br><strong>Grade:</strong> 特上 Tokujō (craft
      modifier: +2)</p>

      </article>

      </div>

      <p>A large, shelf-like fungus found growing on petrified wood in ancient geological formations — the Buried Road
      of Tsuchi, the deep foundations of Progenitor ruins, and exposed strata in river gorges. The flesh is incredibly
      dense and must be thinly sliced. The flavor is deep, complex, and ancient-tasting in a way that is difficult to
      articulate — like stone dust and old libraries and deep time.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Often found in ancient sites — use as a proximity signal for archaeological discovery.


      ---


      **極上 Gokujō — Very Rare**</p>

      </section>

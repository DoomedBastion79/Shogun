      <div class="fvtt advice">

      <article>

      <h4>Shika 鹿 (Deer)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      Hunted<br><strong>Preservation:</strong> 2 days fresh; indefinitely if smoked or salted<br><strong>Tools:</strong>
      Bow, spear, or polearm; cook's utensils for butchery<br><strong>Grade:</strong> 極上 Gokujō (craft modifier: +5)</p>

      </article>

      </div>

      <p>Venison from Hokori&#39;s forest deer, dark and dense. The shoulder and haunch cuts slow-braise into
      tenderness; the tenderloin sears quickly and carries a clean iron flavour. Standard game meat throughout the
      wooded provinces, and the most reliable large-game harvest in the system.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Deer are ubiquitous in Hokori&#39;s forested provinces; a sustained hunt over a day will almost always reward a
      competent hunter. A single carcass yields both venison (Niku) and secondary materials in the Kegawa and Hone
      categories when fully processed.</p>

      </section>

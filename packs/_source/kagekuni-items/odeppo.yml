  description:
    value: >
      <p>A heavy matchlock musket with a long barrel and a forked rest for stability, the odeppo delivers devastating
      firepower at extended range. Too heavy and slow-loading for mobile warfare, it is deployed from castle walls,
      behind fortifications, and in prepared ambush positions. Zirak engineers developed the design for penetrating
      heavy armor at siege distances; a single ball can punch through a wooden shield and the warrior behind it.</p>

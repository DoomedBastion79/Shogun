      <article>

      <h4>Taka-usagi 鷹兎 (Hawk-Hare)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong>
      hunting<br><strong>Preservation:</strong> 2 days fresh; 14 days salted<br><strong>Tools:</strong> Bow, sling;
      requires fast shot — snares rarely catch them<br><strong>Grade:</strong> 並 Nami (craft modifier: -2)</p>

      </article>

      </div>

      <p>The uncommon, long-eared hare of Hokori&#39;s open grasslands — larger, faster, and subtly more aromatic than
      its forest cousin. The meat carries a cleaner, sweeter flavour, and the fat yields a distinctly floral note from a
      diet of wild herbs. A hunter who takes one boasts for a week.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Natively adapted to the violet grasslands of Kusa and northern Tsuchi. Their speed makes them a prized target
      for falconers; their meat is a delicacy among rural lords.


      ---


      **Rare**</p>

      </section>

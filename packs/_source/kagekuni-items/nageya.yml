      <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-description"
      data-section="description">Description</h3>

      <p>A light throwing spear with a narrow leaf-shaped head, the nageya is issued to ashigaru infantry for volley
      fire before melee engagement. Cheaper than arrows and requiring less training than a bow, bundles of nageya are
      stockpiled in every garrison. Hunters also use them for bringing down game at medium range.</p>


      <article>

      <h4>Tsukimisō 月見草 (Moon-Viewing Herb)</h4>

      <p><strong>Category:</strong> Yakuso<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong>
      Foraged<br><strong>Preservation:</strong> 3 days fresh; indefinitely dried<br><strong>Tools:</strong> Herbalism
      kit; light source managed to avoid spoiling petals<br><strong>Restrictions:</strong> Harvested at night; petals
      close at dawn<br><strong>Grade:</strong> 並 Nami (craft modifier: -2)</p>

      </article>

      </div>

      <p>Pale silver flowers that open only at night, found on high ground in Sora and along the ridgelines of
      Hana&#39;s mountains. The petals, dried and crumbled, produce a mild calming effect. Traditionally served as a tea
      before important negotiations.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Tsukimisō tea is part of the informal diplomatic vocabulary of the mountain courts. A cup served at the start
      of a talk is a signal that the host intends calm discussion.</p>

      </section>

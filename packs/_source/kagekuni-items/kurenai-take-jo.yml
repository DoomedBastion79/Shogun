      <article>

      <h4>Kurenai-take 紅茸 (Crimson Cap)</h4>

      <p><strong>Category:</strong> Kinoko<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong> Foraged
      (Saishū)<br><strong>Preservation:</strong> Fresh 2–3 days; dries well; holds aromatic
      warmth<br><strong>Tools:</strong> Herbalism kit (advantage); **knowledge of gill colour is lethally
      important**<br><strong>Grade:</strong> 上 Jō (craft modifier: +0)</p>

      </article>

      </div>

      <p>A brilliant red-capped mushroom found near hot springs and thermal vents in Hi province. Easily mistaken for a
      poisonous variety — only those who know the distinguishing underside pattern (pale gold gills rather than white)
      should pick them. The flavor is rich, almost smoky, with a warmth that reflects its volcanic habitat.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>**Risk flag:** unproficient forager who attempts identification should roll with disadvantage. Failed
      identification by grade-0 forager may yield poisonous lookalike.</p>

      </section>

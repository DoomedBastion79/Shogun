      <article>

      <h4>Matsutake 松茸 (Pine Mushroom)</h4>

      <p><strong>Category:</strong> Kinoko<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> Fresh 3–4 days; dries adequately; aroma fades
      quickly<br><strong>Tools:</strong> Herbalism kit (advantage); patience and dry
      hillsides<br><strong>Grade:</strong> 特上 Tokujō (craft modifier: +2)</p>

      </article>

      </div>

      <p>Large, thick-stemmed mushrooms found under red pine trees in well-drained soil. The aroma is distinctive — a
      spicy, almost cinnamon-like fragrance that announces a find before you see it. Highly prized and seasonal — autumn
      only. Despite the prestige, they are common enough in the right terrain to be found by a patient forager.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Autumn-locked. Common in the right terrain, but the terrain is narrow.</p>

      </section>

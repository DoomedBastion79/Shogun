      <h4>Mitsuba 三つ葉 (Trefoil)</h4>

      <p><strong>Category:</strong> Yakuso<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      Foraged<br><strong>Preservation:</strong> 2 days fresh; loses flavour when dried<br><strong>Tools:</strong>
      Herbalism kit<br><strong>Grade:</strong> 上 Jō (craft modifier: +0)</p>

      </article>

      </div>

      <p>A delicate three-leafed herb with a bright celery-like flavour. Grows in shaded, damp areas near streams and
      under forest canopy. Used as a garnish in soups and custards, or scattered over rice. The flavour is subtle but
      distinctive — it marks the difference between trail cooking and something worth eating.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Temple garden margins are a reliable source. The herb&#39;s value comes almost entirely from fresh use — a
      dried mitsuba leaf is nearly worthless.</p>

      </section>

      <h4>Miso 味噌 (Fermented Bean Paste)</h4>

      <p><strong>Category:</strong> Shushoku<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      harvesting<br><strong>Preservation:</strong> Indefinite in dry sealed container<br><strong>Tools:</strong>
      None<br><strong>Grade:</strong> 上 Jō (craft modifier: +0)</p>

      </article>

      </div>

      <p>Fermented soybean paste, sold by weight in wooden tubs or wrapped in bamboo leaves for travel. The foundation
      of soups, glazes, and braises, miso colour ranges from pale yellow (young, sweet) to deep red-brown (aged,
      assertive). It keeps indefinitely in a dry container and forgives all manner of cooking sins. A small pot of miso
      makes the difference between a sad camp meal and a proper one.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Camp meal transformer. Traveler essential.</p>

      </section>

    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Yomogi 蓬 (Mugwort)</h4>

      <p><strong>Category:</strong> Yakuso<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      Foraged<br><strong>Preservation:</strong> 5 days fresh; indefinitely dried<br><strong>Tools:</strong> Herbalism
      kit<br><strong>Grade:</strong> 並 Nami (craft modifier: -2)</p>

      </article>

      </div>

      <p>A tough, aromatic herb with silvery-green leaves found along roadsides and disturbed ground throughout Hokori.
      Bitter when raw, but blanched and pounded into rice cakes it produces the distinctive green kusamochi sold at
      every festival. Also burned as a smudge to repel insects at camp.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Kusamochi is a festival ubiquity — any roadside stall during spring festivals will be selling it. A traveller
      with yomogi can also make a reasonable mosquito smudge with a small fire.</p>

      </section>

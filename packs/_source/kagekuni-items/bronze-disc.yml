  description:
    value: >
      <p>A formal seal of the Golden Dragon order. Carrying it confers recognition as a member of the order — useful as
      a key to certain sealed areas within Ōryūzan Tenkū-ji. The reverse face bears concentric rings scored as orbital
      tracks, with seven small notches along the outer edge and four along an inner ring. The disc is also a calibration
      component for the temple&#39;s celestial mechanism: when seated in the orrery&#39;s control interface, it sets the
      reference date from which the device can advance or rewind. The order seal and the calibration key were the same
      object — by design, only a member of the order could operate the observatory.</p>

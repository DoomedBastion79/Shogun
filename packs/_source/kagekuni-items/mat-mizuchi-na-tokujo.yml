    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Mizuchi-na 蛟菜 (Water Dragon Greens)</h4>

      <p><strong>Category:</strong> Yakuso<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> 2 days fresh; loses flavour when dried<br><strong>Tools:</strong>
      Herbalism kit; underwater collection required<br><strong>Grade:</strong> 特上 Tokujō (craft modifier: +2)</p>

      </article>

      </div>

      <p>A deep-green aquatic plant found in the clearest, coldest springs fed by snowmelt from the Tenchūsan Ren. The
      fronds are long and ribbon-like, and when held up to light they show veining that resembles scales. The flavour is
      bright, clean, and faintly metallic — like drinking from a mountain spring. Must be harvested underwater.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Harvesting requires reaching into painfully cold water — a character without cold protection may need a
      Constitution save for extended work.</p>

      </section>

      (Saishū) — restricted<br><strong>Preservation:</strong> Active for months in sealed cool
      vessel<br><strong>Tools:</strong> Herbalism kit (advantage); sterile cloth<br><strong>Restrictions:</strong> Deep
      Seidōrin Mori is restricted — same legal risk as Seidōrin no Shio<br><strong>Grade:</strong> 極上 Gokujō (craft
      modifier: +5)</p>

      </article>

      </div>

      <p>A rare fermentation culture found on fallen bronze-bark in the deepest, dampest reaches of the Seidōrin Mori.
      The mold itself is a pale green-gold and imparts a unique metallic complexity to whatever it ferments. Used to
      produce a seasoning paste of extraordinary depth — savory, faintly sweet, with a lingering copper brightness.
      Harvesting requires entering restricted forest areas.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>**Legal risk** as Seidōrin no Shio. Deep forest hazards.</p>

      </section>

      <h4>Ryū no Namida 竜の涙 (Dragon's Tear)</h4>

      <p><strong>Category:</strong> Chomiryo<br><strong>Rarity:</strong> VeryRare<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> Indefinite in sealed crystal vessel<br><strong>Tools:</strong>
      Herbalism kit (advantage); Arcana (Int) DC 15 to handle safely; crystal vial<br><strong>Restrictions:</strong>
      Progenitor-cavern-gated<br><strong>Grade:</strong> 上 Jō (craft modifier: +0)</p>

      </article>

      </div>

      <p>A liquid mineral seep found in the deepest chambers of Progenitor-associated cave systems — slow drops that
      fall from stone ceilings into shallow basins over decades. The liquid is perfectly clear, faintly warm, and
      carries no scent. On the tongue it produces a sensation of pure, complex flavor that defies categorization — every
      person who tastes it describes something different. A single drop can transform an entire dish. The basins are
      found near places where Progenitors rested.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Progenitor-gated. Legendary artefact-tier ingredient.</p>

      </section>

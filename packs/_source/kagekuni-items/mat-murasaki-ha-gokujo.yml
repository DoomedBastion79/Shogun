      <div class="fvtt advice">

      <article>

      <h4>Murasaki-ha 紫葉 (Purple Leaf)</h4>

      <p><strong>Category:</strong> Yakuso<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> 5 days fresh; indefinitely dried (loses
      colour)<br><strong>Tools:</strong> Herbalism kit<br><strong>Restrictions:</strong> Endemic to Kusa
      province<br><strong>Grade:</strong> 極上 Gokujō (craft modifier: +5)</p>

      </article>

      </div>

      <p>A broad-leafed plant endemic to Kusa&#39;s lowland forests, where it grows in the violet grass meadows
      alongside the native murasaki-gusa. The leaves are a deep purple-black and have a mild, earthy sweetness that
      complements rich meats. Kusa cooks wrap fish and game in the leaves before steaming — a regional technique unknown
      outside the province.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>The wrap-and-steam technique is part of the distinctive cuisine of the Murasaki-hara and unknown outside Kusa —
      a chef from elsewhere would need instruction.</p>

      </section>

      <div class="fvtt advice">

      <article>

      <h4>Chōrei Miso 長齢味噌 (Longevity Miso)</h4>

      <p><strong>Category:</strong> Shushoku<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong>
      harvesting<br><strong>Preservation:</strong> Indefinite<br><strong>Tools:</strong>
      None<br><strong>Restrictions:</strong> Rarely sold for coin; usually given in exchange for
      service<br><strong>Grade:</strong> 上 Jō (craft modifier: +0)</p>

      </article>

      </div>

      <p>A miso aged for over a century in cedar casks at specific Buddhist monasteries, passed from generation to
      generation of temple cooks who tend each cask as an inheritance. The colour is nearly black and the flavour is
      impossibly deep — a single spoonful transforms an entire pot of broth. The monks who tend the casks rarely sell
      chōrei miso for coin; it is more often given in exchange for service or as a gift to honoured guests. A small jar
      is a meaningful reward for a completed quest.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>**Quest-reward tier.** Use for monks-and-temples plotlines.</p>

      </section>

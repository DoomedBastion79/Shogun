      <article>

      <h4>Yama-usagi 山兎 (Mountain Hare)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      Hunted<br><strong>Preservation:</strong> 2 days fresh; 14 days smoked or salted<br><strong>Tools:</strong> Simple
      weapons or snares; cook's utensils for butchering<br><strong>Grade:</strong> 特上 Tokujō (craft modifier: +2)</p>

      </article>

      </div>

      <p>Lean, dark-rose meat from the wild hares that populate Hokori&#39;s lower forests and upland meadows. The
      flavour is clean and faintly grassy — not gamey, not strong, but distinctly wild. A single hare feeds two
      travellers well with rice.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Common throughout Hokori&#39;s forested provinces. Hunters set snares along known game trails in lower Fumoto
      and within any Satoyama. A Wisdom (Survival) check with trapper&#39;s tools yields the best results; bow hunting
      works at higher cost in time.</p>

      </section>

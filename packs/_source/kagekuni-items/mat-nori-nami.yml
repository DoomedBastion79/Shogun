      </div>

      <p>Sheets of dried and lightly toasted laver seaweed, pressed flat and bundled in paper. Nori wraps rice balls,
      shreds over noodles, and lines sushi rolls. It keeps almost forever in a dry bundle and weighs next to nothing.
      Harvested along the Nami and Mizu coasts and traded inland along the Emperor&#39;s Highway to every market
      town.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Onigiri essential.</p>

      </section>

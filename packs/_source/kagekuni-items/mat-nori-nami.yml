      <h4>Nori 海苔 (Dried Laver)</h4>

      <p><strong>Category:</strong> Shushoku<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      harvesting<br><strong>Preservation:</strong> Indefinite when kept dry<br><strong>Tools:</strong>

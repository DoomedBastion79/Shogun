      <h4>Komugi-ko 小麦粉 (Wheat Flour)</h4>

      <p><strong>Category:</strong> Shushoku<br><strong>Rarity:</strong> Common<br><strong>Source:</strong> Traded
      (milled)<br><strong>Preservation:</strong> Months in dry cloth; humidity ruins it<br><strong>Tools:</strong>
      None<br><strong>Grade:</strong> 上 Jō (craft modifier: +0)</p>

      </article>

      </div>

      <p>Ground wheat from the lowland farms of Tsuchi and Hana, sold in paper-wrapped bricks or loose in cloth bags.
      Heavier and less refined than the whiter flours of urban kitchens, but entirely sufficient for noodles, dumpling
      wrappers, and the tempura batters of market stalls. The grain itself carries the faint sweetness of lowland
      sun.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Dumpling / tempura base.


      ---


      **上 Jō — Uncommon**</p>

      </section>

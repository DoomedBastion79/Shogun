    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Tsukiyo-take 月夜茸 (Moonlit Cap)</h4>

      <p><strong>Category:</strong> Kinoko<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> Fresh 1 day only — silver light fades within hours; dried retains only
      faint effect<br><strong>Tools:</strong> Herbalism kit (advantage); **full Kagetsu moon
      required**<br><strong>Restrictions:</strong> Can only be gathered on nights when Kagetsu is
      full<br><strong>Grade:</strong> 並 Nami (craft modifier: -2)</p>

      </article>

      </div>

      <p>A pale, luminescent mushroom found on deadwood in high-altitude forests during nights when Kagetsu is full. The
      cap glows with a soft silver light that fades within hours of picking. The flavor is elusive — dreamlike is the
      word most often used, though no one can articulate what that means. Some who eat them report unusually vivid
      dreams during the following rest.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Lunar gating — tie to Kagetsu full phases on the calendar. Consumption during long rest may grant
      prophecy/dream hooks at DM discretion.</p>

      </section>

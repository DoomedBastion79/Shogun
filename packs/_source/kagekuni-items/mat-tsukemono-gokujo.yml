      <h4>Tsukemono 漬物 (Pickled Vegetables)</h4>

      <p><strong>Category:</strong> Shushoku<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      harvesting<br><strong>Preservation:</strong> Keeps weeks to months in sealed vessel<br><strong>Tools:</strong>
      None<br><strong>Grade:</strong> 極上 Gokujō (craft modifier: +5)</p>

      </article>

      </div>

      <p>An assortment of root vegetables, daikon, gourd, and leafy greens pickled in salt, vinegar, miso, or rice bran
      mash. Every region has its own tradition — Hi&#39;s fiery pepper pickles differ utterly from Sora&#39;s delicate
      salt-pickled turnip. Tsukemono keeps well on the road and adds colour, crunch, and acidity to otherwise monotonous
      trail meals.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Regional flavor — grade reflects provincial tradition.</p>

      </section>

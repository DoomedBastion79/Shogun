      <div class="fvtt advice">

      <article>

      <h4>Hi no Ha 火の葉 (Fire Leaf)</h4>

      <p><strong>Category:</strong> Yakuso<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> 7 days fresh; indefinitely dried<br><strong>Tools:</strong> Herbalism
      kit; protective gloves (hot terrain)<br><strong>Restrictions:</strong> Concentrated in Hi province; volcanic
      access required<br><strong>Grade:</strong> 特上 Tokujō (craft modifier: +2)</p>

      </article>

      </div>

      <p>A low-growing succulent with reddish-orange leaves, found near fumaroles and thermal vents in Hi province. The
      leaves produce a tingling heat when chewed, stronger than any cultivated pepper. Used sparingly in cooking — too
      much causes painful numbness.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>The warmth is real, not illusion — the plant concentrates heat from the ground it grows in. Fresh leaves are
      noticeably hot to the touch.</p>

      </section>

  description:
    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Ōkami no Kiba 狼の牙 (Mountain God's Fangs)</h4>

      <p><strong>Category:</strong> Hone<br><strong>Rarity:</strong> VeryRare<br><strong>Source:</strong>
      one-time-harvest<br><strong>Preservation:</strong> Indefinite. Cleaning and polishing benefit the final
      product.<br><strong>Tools:</strong> Bonecarver's tools for shaping; jeweler's tools for
      setting<br><strong>Restrictions:</strong> Single-grade-locked. Does not follow standard grade progression.</p>

      </article>

      </div>

      <p>The nat 20 harvest also yielded the long canine teeth clean and intact, drawn separately from the jaw before
      the skull was preserved. Each fang is as long as a man&#39;s hand and pale grey, tapering to a point still sharp
      enough to open skin. A bone-carver in any reasonably sized settlement will pay handsomely for worked fangs of this
      size, and a seimaster may recognise them as a viable reagent for a charm or focus.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>**One-time harvest.** Single-grade-locked at 極上 Gokujō. Party holds 4 intact fangs (tracked in
      `Obsidian/dm/campaign-state.md`).


      **Skill-Check Reveals** — one check per skill; nat-20 reveals all three.


      - **Religion (DC 11)** — Long-standing tradition uses wolf fangs as protective charms, particularly for travellers
      crossing mountain passes. Hung from a cord at the throat or tied to a belt, a fang offers a small but real ward
      against being attacked by wild beasts.

      - **Nature (DC 10)** — Easily identified as adult predator canines in exceptional condition. Carving stock for
      amulets, daggerhilt accents, or ornamental inlays.

      - **Arcana (DC 13)** — Reagent for charm and focus crafting. Particularly suited to weapon enchantments — a fang
      set into the pommel of a blade can serve as a focus for spells that augment the weapon&#39;s bite.


      Cross-references: See Hone → Ōkami no Hone / Zugai / Tenohira; Kegawa → Ōkami no Kegawa.</p>

      </section>

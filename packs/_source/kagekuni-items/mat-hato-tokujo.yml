    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Hato 鳩 (Pigeon)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      hunting<br><strong>Preservation:</strong> 2 days fresh; 10 days hung<br><strong>Tools:</strong> Sling, bow, or
      net; cook's utensils for dressing<br><strong>Grade:</strong> 特上 Tokujō (craft modifier: +2)</p>

      </article>

      </div>

      <p>Dark-meated city and cliff pigeons. The flesh is rich and earthy, with the kind of bold flavour that stands up
      to a hot grill and a sharp vinegar dressing. A cheap, nearly-free protein for travellers who know how to drop a
      bird from a temple eave with a sling.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Abundant around ruins and temple complexes — Haikyo is a particularly productive hunting ground. A party
      camping in a temple ruin can easily supplement rations with a pigeon or two per evening.


      ---


      **Uncommon**</p>

      </section>

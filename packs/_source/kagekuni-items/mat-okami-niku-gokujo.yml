    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Ōkami-niku 狼肉 (Mountain God's Flesh)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong>
      one-time-harvest<br><strong>Preservation:</strong> 3 days fresh; indefinitely if smoked or
      salted<br><strong>Tools:</strong> Butcher's or cook's utensils (already
      harvested)<br><strong>Restrictions:</strong> One-time only; no further supply possible</p>

      </article>

      </div>

      <p>Dense, dark-grained muscle from the shoulders and haunches of a mountain god, marbled with winter fat and
      deeply flavoured from a lifetime of predation at altitude. The meat carries a faint mineral tang — cold stone and
      pine smoke — that no ordinary game possesses. Cooks well in almost any preparation, though the flavour is strong
      enough to overpower delicate seasonings.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>See `dm/campaign-state.md` for current inventory tracking. Meat retains the cold touch of the beast&#39;s
      high-altitude life for the first day after butchering. Makes for an exceptional base to any Refined or Masterwork
      preparation.</p>

      </section>

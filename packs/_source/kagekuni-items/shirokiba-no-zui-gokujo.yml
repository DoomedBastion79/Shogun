    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Shirokiba no Zui 白牙の髄 (White-Fang Marrow)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong> One-Time
      (Yama-no-Ōkami harvest)<br><strong>Preservation:</strong> 4 days if kept cold<br><strong>Tools:</strong> Cook's
      utensils (marrow extraction and preparation)<br><strong>Restrictions:</strong> One-time only</p>

      </article>

      </div>

      <p>Rich marrow drawn from the long bones of the forelimbs, pale as bleached bone and dense as cream. Roasted and
      spread on warm rice it produces an almost overwhelming umami. A cook with cook&#39;s utensils proficiency can
      split one portion across an entire party&#39;s meal.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>One portion of marrow is enough to season an entire party&#39;s meal if spread judiciously. Considered a
      concentrator ingredient — raises the grade of any dish it is added to.</p>

      </section>

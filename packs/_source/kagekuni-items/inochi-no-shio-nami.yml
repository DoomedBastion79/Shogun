    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Inochi no Shio 命の塩 (Salt of Life)</h4>

      <p><strong>Category:</strong> Chomiryo<br><strong>Rarity:</strong> VeryRare<br><strong>Source:</strong> Harvested
      (Saishū)<br><strong>Preservation:</strong> Self-replenishing at the deposit; stable indefinitely once
      harvested<br><strong>Tools:</strong> Herbalism kit (advantage); Arcana (Int) DC 15; clean stone
      vessel<br><strong>Restrictions:</strong> Over-harvest depletes site for years. Less than a dozen sites
      known.<br><strong>Grade:</strong> 並 Nami (craft modifier: -2)</p>

      </article>

      </div>

      <p>A crystalline substance found at the exact point where sei-active spring water meets volcanic mineral deposits
      — a convergence so specific that fewer than a dozen sites in all of Kagekuni produce it. The crystals form slowly
      and are self-replenishing, but harvesting too aggressively depletes the site for years. The flavor is warmth,
      vitality, and something that sits beyond the tongue&#39;s ability to categorize. Meals seasoned with it produce
      effects that border on the miraculous.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>**Sacred / ecological gate.** Over-harvest has in-world consequences. Associate with restoration/healing
      recipes.</p>

      </section>

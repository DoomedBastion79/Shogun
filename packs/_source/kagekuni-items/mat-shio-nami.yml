      <p>Harvested from evaporation pools along the Nami and Mizu coasts, or traded inland along the Emperor&#39;s
      Highway. The fundamental seasoning of Kagekuni cooking. Every market in Hokori sells it; every kitchen uses it;
      every pack contains at least a small cloth pouch.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>The baseline seasoning. Travelers without salt are signalled as either destitute, new to the road, or very
      rich.</p>


      <h4>Kōtetsu-take 鋼茸 (Steel Cap)</h4>

      <p><strong>Category:</strong> Kinoko<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> Stable for months; dries well; mineral content
      intensifies<br><strong>Tools:</strong> Herbalism kit (advantage); mining pick recommended for extraction from
      mineral crust<br><strong>Grade:</strong> 上 Jō (craft modifier: +0)</p>

      </article>

      </div>

      <p>A dark, metallic-capped mushroom found in the iron-rich soil around Kurogane Yama and the mining settlements of
      Tsuchi. The cap has a genuine metallic sheen and the flesh contains trace minerals that give it a faintly ferrous
      taste. Miners consider them good luck. Alchemists value them for the mineral content.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Tsuchi regional signature. Miner superstition — good omen loot.</p>

      </section>

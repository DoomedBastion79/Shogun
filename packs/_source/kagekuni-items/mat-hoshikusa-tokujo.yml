    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Hoshikusa 星草 (Star Grass)</h4>

      <p><strong>Category:</strong> Yakuso<br><strong>Rarity:</strong> VeryRare<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> 1 day fresh; loses luminescence immediately on
      drying<br><strong>Tools:</strong> Herbalism kit; presence at Hoshimori during
      Hikarishō<br><strong>Restrictions:</strong> Hikarishō only — hours-long harvest window<br><strong>Grade:</strong>
      特上 Tokujō (craft modifier: +2)</p>

      </article>

      </div>

      <p>A luminescent grass found only on the Hoshimori Plateau during specific celestial alignments — when Ryūgetsu
      enters full phase and the aurora of Hikarishō touches the ground. The blades glow with a shifting, opalescent
      light and are warm to the touch. The window for harvesting is narrow — hours at most. When used in cooking, it
      imparts a sensation that defies description: a warmth that feels like being watched over.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Harvesting requires being physically present at the plateau during Hikarishō — a campaign event, not a routine
      foraging opportunity.</p>

      </section>

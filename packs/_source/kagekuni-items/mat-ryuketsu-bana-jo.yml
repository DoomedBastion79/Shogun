    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Ryūketsu-bana 竜血花 (Dragon's Blood Flower)</h4>

      <p><strong>Category:</strong> Yakuso<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> 7 days fresh; indefinitely dried<br><strong>Tools:</strong> Herbalism
      kit; careful extraction (grows in stone cracks)<br><strong>Restrictions:</strong> Associated with Progenitor
      sites; rare in general circulation<br><strong>Grade:</strong> 上 Jō (craft modifier: +0)</p>

      </article>

      </div>

      <p>A deep crimson flower with gold-veined petals, found growing from cracks in stone near Progenitor-associated
      ruins. Blooms are small — no larger than a thumbnail — and extremely difficult to spot. The dried petals impart a
      metallic warmth to any dish.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Finding them requires patience and good light — a full-day forage in a Haikyo biome may yield only one or two.
      Common near Tenku-ji Temple&#39;s older stonework.</p>

      </section>

    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Seirei-taka 精霊鷹 (Spirit Hawk)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> VeryRare<br><strong>Source:</strong>
      Hunted<br><strong>Preservation:</strong> 1 day fresh; 7 days salted<br><strong>Tools:</strong> Bow with
      exceptional skill; the bird is nearly impossible to surprise<br><strong>Grade:</strong> 極上 Gokujō (craft modifier:
      +5)</p>

      </article>

      </div>

      <p>The flesh of a hawk that carries visible sei in its feathers and a faint heat in its living body. Eating it is
      considered a communion — the hunter takes the hawk&#39;s keen sight and sharp attention into themselves, briefly.
      Prepared only by chefs with both cook&#39;s utensils training and some form of spiritual authority.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Traditionally, a Seirei-taka kill is offered at a shrine before it is eaten — the shrine blessing is considered
      part of the preparation. A hunter who eats one without the ritual is said to be marked for misfortune.</p>

      </section>

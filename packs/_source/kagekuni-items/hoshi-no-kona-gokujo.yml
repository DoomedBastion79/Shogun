      <article>

      <h4>Hoshi no Kona 星の粉 (Star Dust)</h4>

      <p><strong>Category:</strong> Chomiryo<br><strong>Rarity:</strong> VeryRare<br><strong>Source:</strong> Foraged
      (Saishū)<br><strong>Preservation:</strong> Stable for weeks in sealed stone vessel; exposure to open air fades the
      resonance<br><strong>Tools:</strong> Herbalism kit (advantage); brush and seal-able
      container<br><strong>Restrictions:</strong> Only forms during Hikarishō when dragon auroras touch the
      plateau<br><strong>Grade:</strong> 極上 Gokujō (craft modifier: +5)</p>

      </article>

      </div>

      <p>A fine, glittering powder found on exposed surfaces of the Hoshimori Plateau during the peak of Hikarishō, when
      the dragon auroras touch the ground. The powder is warm, faintly luminescent, and dissolves completely into food.
      The flavor is impossible to describe in conventional terms — those who have tasted it say it changes every time,
      and that the meal it seasons feels significant in a way ordinary food does not.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>**Event-gated:** Hikarishō. Seimaster interest from Hoshimori.</p>

      </section>

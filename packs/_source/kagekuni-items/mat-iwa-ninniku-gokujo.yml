    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Iwa-ninniku 岩大蒜 (Cliff Garlic)</h4>

      <p><strong>Category:</strong> Yakuso<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> 14 days fresh; indefinitely dried<br><strong>Tools:</strong> Herbalism
      kit; climbing gear often required<br><strong>Grade:</strong> 極上 Gokujō (craft modifier: +5)</p>

      </article>

      </div>

      <p>A pungent wild garlic variant that grows from cracks in cliff faces and exposed rock. Stronger than lowland
      nobiru — the flavour is sharp, almost medicinal, and lingers for hours. Mountain villagers in Sora use it as both
      seasoning and folk remedy. Harvesting requires climbing or reaching into awkward crevices.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Sora villagers consider it a better remedy than lowland garlic — stronger, cleaner, and said to ward against
      mountain sickness.</p>

      </section>

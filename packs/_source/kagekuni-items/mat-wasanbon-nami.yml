      <h4>Wasanbon 和三盆 (Refined Sugar)</h4>

      <p><strong>Category:</strong> Shushoku<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong>
      harvesting<br><strong>Preservation:</strong> Years in sealed paper packet; humidity destroys
      it<br><strong>Tools:</strong> None<br><strong>Grade:</strong> 並 Nami (craft modifier: -2)</p>

      </article>

      </div>

      <p>Pale, extraordinarily fine sugar refined in small village cooperatives of southern Hana and Kusa, where the
      specific microclimate allows for the slow, patient crystallisation the product demands. Used sparingly in sweets,
      ceremonial confections, and the glaze of refined dishes. A luxury to most peasant households — a small paper
      packet of wasanbon is considered a generous gift to a host.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Gift-worthy item for noble social encounters.</p>

      </section>

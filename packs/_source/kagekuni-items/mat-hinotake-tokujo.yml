      <h4>Hinotake 火茸 (Fire Stalk)</h4>

      <p><strong>Category:</strong> Kinoko<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> Dries stable; retains mild spice<br><strong>Tools:</strong> Herbalism
      kit (advantage); **thick gloves required — raw caps cause chemical burns**<br><strong>Restrictions:</strong> Hi
      province volcanic zones; fire-resistance preferred for ideal conditions<br><strong>Grade:</strong> 特上 Tokujō
      (craft modifier: +2)</p>

      </article>

      </div>

      <p>Bright orange mushrooms that grow near volcanic vents in Hi province. The flesh is dry and slightly spicy. They
      thrive in temperatures that would kill any other fungus, drawing nutrients from volcanic mineral deposits. Must be
      handled carefully — the raw caps cause mild chemical burns on bare skin.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>**Handling hazard:** 1d4 fire damage if handled barehanded. Unproficient foragers take the damage automatically
      on harvest.</p>

      </section>

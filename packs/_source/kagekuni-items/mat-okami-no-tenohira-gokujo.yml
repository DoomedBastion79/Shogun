  description:
    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Ōkami no Tenohira 狼の掌 (Mountain God's Paws)</h4>

      <p><strong>Category:</strong> Hone<br><strong>Rarity:</strong> VeryRare<br><strong>Source:</strong>
      one-time-harvest<br><strong>Preservation:</strong> Indefinite if properly cured and mounted; pads can dry and
      crack if neglected<br><strong>Tools:</strong> Leatherworker's tools for pad preservation; bonecarver's tools for
      claw separation and shaping<br><strong>Restrictions:</strong> Single-grade-locked. Does not follow standard grade
      progression.</p>

      </article>

      </div>

      <p>Four massive paws, each broader than a man&#39;s chest and heavy enough to need both hands to lift, removed
      cleanly at the wrist joint. The pads are thick black leather, deeply callused from a lifetime walking on stone,
      and the dew claws and main claws are intact and unbroken — a testament to the quality of the harvest. In Hokori
      folk tradition, the paw of a great wolf is hung above the door of a household to ward off mountain spirits and
      protect those within from being lost in the wilds. Bone-carvers and amulet-makers will pay well for whole paws,
      and a seimaster will pay better.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>**One-time harvest.** Single-grade-locked at 極上 Gokujō. Party holds 4 intact paws (tracked in
      `dm/campaign-state.md`).


      **Skill-Check Reveals** — one check per skill; nat-20 reveals all three.


      - **Religion (DC 12)** — The folk tradition of hanging a wolf paw above a household doorway is older than most
      temples — it predates the formal Shinto observances and is rooted in pre-imperial mountain beliefs. A paw mounted
      properly above a door is a genuine spiritual ward against being led astray in the wilds. Effective even for
      unbelievers.

      - **Nature (DC 14)** — The depth of callus on the pads tells the character that this creature walked exclusively
      on stone, not soft ground — confirming it lived its entire life in the high passes. The paws can be processed into
      trophy mounts, rugs, or grip-leather for weapon hilts. Identifies the proper preservation methods.

      - **Arcana (DC 13)** — The claws carry trace sei imprint and would serve as reagents for the crafting of
      protection charms, amulets against being lost, or low-level wards. Worth significantly more to a charm-maker than
      to a bone-carver.


      Cross-references: See Hone → Ōkami no Hone / Zugai / Kiba; Kegawa → Ōkami no Kegawa.</p>

      </section>

  description:
    value: >
      <p>The personal journal of Head Priest Kinjiro of Ōryūzan Tenkū-ji. The hand is direct and unceremonial — not the
      formality of his other documents. Final entries describe the disintegration of the Golden Dragon order from the
      inside: the slow accretion of suspicion, the trust the priesthood could no longer afford to extend, the work that
      continued anyway because the work was the order&#39;s purpose. Kinjiro names no traitors. The journal&#39;s
      emotional weight is in what it does not accuse.</p>

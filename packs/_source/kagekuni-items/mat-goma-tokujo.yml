      <article>

      <h4>Goma 胡麻 (Wild Sesame)</h4>

      <p><strong>Category:</strong> Chomiryo<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> Whole seeds keep a year; toasted seeds 2–3 months; pressed oil 6
      months<br><strong>Tools:</strong> Herbalism kit (advantage); cloth to catch falling
      seeds<br><strong>Grade:</strong> 特上 Tokujō (craft modifier: +2)</p>

      </article>

      </div>

      <p>Tiny seeds from a tall, flowering plant found in dry, open fields and along road margins. Toasted, they release
      a deep, nutty aroma that elevates simple rice dishes. The oil pressed from the seeds is used for frying and
      finishing. A common roadside find in the agricultural provinces.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Road-margin staple. Common gift from rural NPCs.</p>

      </section>

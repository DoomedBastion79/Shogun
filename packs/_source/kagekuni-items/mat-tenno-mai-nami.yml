      <h4>Tennō-mai 天皇米 (Imperial Field Rice)</h4>

      <p><strong>Category:</strong> Shushoku<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong>
      harvesting<br><strong>Preservation:</strong> As with kome<br><strong>Tools:</strong>
      None<br><strong>Restrictions:</strong> **Unauthorized possession technically a punishable offense**, though rarely
      enforced against recipients of gifts<br><strong>Grade:</strong> 並 Nami (craft modifier: -2)</p>

      </article>

      </div>

      <p>Rice grown exclusively at a single imperial holding outside Heian, tended by farming families whose lineage
      predates the current dynasty. Each grain is pearl-white and slightly larger than common rice, cooking into a
      texture that noble diners describe as &quot;clouds made solid.&quot; A single gō (roughly six ounces) is a gift
      fit for a daimyo. Possession without authorisation is technically a punishable offence, though the law is rarely
      enforced against those who receive it as a gift.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>**Legal risk.** Gift item par excellence.</p>

      </section>

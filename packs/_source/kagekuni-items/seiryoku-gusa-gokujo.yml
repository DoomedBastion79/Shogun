    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Seiryoku-gusa 精力草 (Sei-Vigor Grass)</h4>

      <p><strong>Category:</strong> Yakuso<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong>
      Foraged<br><strong>Preservation:</strong> 14 days fresh; indefinitely dried (retains
      glow)<br><strong>Tools:</strong> Herbalism kit<br><strong>Grade:</strong> 極上 Gokujō (craft modifier: +5)</p>

      </article>

      </div>

      <p>A luminous blue-green grass that grows in tight spirals near leyline concentrations and sei-active springs. The
      blades pulse with faint light when cut, and carry that glow for days after being dried. Herbalists in Sora and
      Kaze prize it for both cooking and minor focusing rituals.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Doubles as a minor seimaster focus component — a dried bundle can be used in ritual work. A sei-sensitive
      character will feel it on contact.</p>

      </section>

  description:
    value: >-
      <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-description"
      data-section="description">Description</h3>

      <p>A short, single-edged blade between six and twelve inches long, the tanto serves as utility knife, sidearm, and
      ritual instrument across all castes of Kagekuni. Samurai carry ornate tanto as part of formal dress; fishermen gut
      their catch with plain ones. Its compact size makes it easy to conceal, and in desperate hands it is as deadly as
      any sword.</p>

      </section>

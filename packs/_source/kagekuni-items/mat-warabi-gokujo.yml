    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Warabi 蕨 (Bracken Fern)</h4>

      <p><strong>Category:</strong> Yakuso<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> 2 days fresh; indefinitely dried after ash-water
      treatment<br><strong>Tools:</strong> Herbalism kit; cook's utensils for preparation<br><strong>Grade:</strong> 極上
      Gokujō (craft modifier: +5)</p>

      </article>

      </div>

      <p>Young fiddlehead ferns harvested in early spring from forest floors and shaded hillsides. Must be soaked
      overnight in wood ash water to remove bitterness before eating — raw warabi is genuinely unpleasant. A staple wild
      green across the archipelago; gathering warabi is one of the first foraging skills every village child learns.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Ash-water treatment is non-optional — eaten raw, it causes digestive discomfort. A character with herbalism
      proficiency knows this automatically.</p>

      </section>

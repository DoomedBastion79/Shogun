  description:
    value: >
      <p>A short asymmetric bow, smaller than its battlefield cousin the yumi, the hankyu is favored by scouts, mounted
      skirmishers, and ronin who need a compact ranged weapon for travel. Its reduced draw weight limits range and
      penetration, but its portability makes it invaluable for those who cannot carry a full-sized bow. Many are
      lacquered and wrapped in rattan for weather resistance.</p>

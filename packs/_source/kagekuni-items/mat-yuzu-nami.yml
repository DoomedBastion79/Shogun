      <h4>Yuzu 柚子 (Mountain Citrus)</h4>

      <p><strong>Category:</strong> Chomiryo<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> Fresh 1–2 weeks; zest dries indefinitely; juice best used
      fresh<br><strong>Tools:</strong> Herbalism kit (advantage); sturdy gloves — thorny
      trees<br><strong>Grade:</strong> 並 Nami (craft modifier: -2)</p>

      </article>

      </div>

      <p>A small, intensely aromatic citrus fruit found wild on thorny trees in hill forests and mountain slopes. The
      fruit itself is too sour to eat, but the zest and juice transform cooking — a few drops of yuzu juice in a broth
      is the difference between adequate and transcendent. Ripens in autumn.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Autumn-peak; Hana/Kaze signature.</p>

      </section>

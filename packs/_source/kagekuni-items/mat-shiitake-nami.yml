    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Shiitake 椎茸 (Oak Mushroom)</h4>

      <p><strong>Category:</strong> Kinoko<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> Dries indefinitely; keeps years when properly
      stored<br><strong>Tools:</strong> Herbalism kit (advantage); unproficient forager rolls at disadvantage for
      identification<br><strong>Grade:</strong> 並 Nami (craft modifier: -2)</p>

      </article>

      </div>

      <p>The universal cooking mushroom of Kagekuni. Broad, dark-brown caps with pale, pleated gills, found in colonies
      on fallen hardwood throughout Hana, Kusa, and Mizu. The flesh is dense and meaty with a rich umami that deepens
      when dried. Every travelling cook carries a string of them, and every village market has a basket for sale.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>The workhorse mushroom of the Kagekuni pantry. Always in season in some form somewhere; always the safe default
      for a new forager.</p>

      </section>

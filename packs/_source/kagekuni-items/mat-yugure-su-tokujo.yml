      <article>

      <h4>Yūgure-su 夕暮れ酢 (Twilight Vinegar)</h4>

      <p><strong>Category:</strong> Chomiryo<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> Stable for years<br><strong>Tools:</strong> Herbalism kit (advantage);
      patience — trees are uncooperative<br><strong>Grade:</strong> 特上 Tokujō (craft modifier: +2)</p>

      </article>

      </div>

      <p>A deep amber liquid that collects in hollows of ancient hardwood trees in the Yōsei Mori, where sei activity
      and slow fermentation of tree sap produce a vinegar of remarkable complexity. The flavor carries notes of autumn
      leaves, honey, and something that suggests distance — like a memory of a taste rather than the taste itself. The
      trees that produce it are centuries old and cannot be cultivated.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Sei-active byproduct. Tied to Yōsei Mori respect rituals.


      ---


      **極上 Gokujō — Very Rare**</p>

      </section>

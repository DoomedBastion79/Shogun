      <article>

      <h4>Katsuobushi 鰹節 (Dried Bonito Flakes)</h4>

      <p><strong>Category:</strong> Shushoku<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      harvesting<br><strong>Preservation:</strong> Keeps a year in sealed packet; flakes soften with
      humidity<br><strong>Tools:</strong> None<br><strong>Grade:</strong> 特上 Tokujō (craft modifier: +2)</p>

      </article>

      </div>

      <p>Smoked, dried, and shaved skipjack tuna, sold in paper packets of paper-thin flakes. Distinct from dried dashi
      blocks — katsuobushi is used as a finishing topping on hot food, where the flakes curl and &quot;dance&quot; in
      the rising steam as though the fish were alive again. A cornerstone of Mizu and Nami cooking and the defining
      flavour of ocean-touched cuisine.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Classic &quot;dancing flakes&quot; moment for evocative dish descriptions.</p>

      </section>

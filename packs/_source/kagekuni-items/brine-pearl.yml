  description:
    value: >
      <p>A pearl that always weeps a single drop of seawater — the visible token of a Hatchling Mark from the Azure
      Brood (Aokkō). The pearl&#39;s iridescence shifts with the tides even far inland.</p>


      <h3>Properties</h3>

      <p><strong>Tier:</strong> Hatchling Mark (Tamashi-no-In) — Azure Brood

      <strong>Attunement:</strong> Yes

      <strong>Passive (while attuned):</strong> You gain a swimming speed equal to your walking speed and can breathe
      underwater.

      <strong>Activation (1/long rest):</strong> As an action, summon a 5-ft cube of churning saltwater anywhere within
      60 ft. The cube fills the chosen space, treats the area as difficult terrain, and heavily obscures it until the
      end of your next turn.

      <strong>Loss:</strong> As Ember Tear — Mark persists, active effects gated on relic recovery.</p>

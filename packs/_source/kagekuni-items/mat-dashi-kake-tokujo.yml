      <article>

      <h4>Dashi-kake 出汁掛け (Dried Dashi — Seaweed & Fish Stock)</h4>

      <p><strong>Category:</strong> Shushoku<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      harvesting<br><strong>Preservation:</strong> Almost indefinite in dry storage<br><strong>Tools:</strong>
      None<br><strong>Grade:</strong> 特上 Tokujō (craft modifier: +2)</p>

      </article>

      </div>

      <p>Small bricks or loose powders of concentrated stock base, combining dried kombu kelp with katsuobushi flakes or
      occasionally dried sardines. A pinch dissolved in hot water produces instant broth — the backbone of every road
      meal from mushroom soup to trail ramen. Lightweight, compact, and keeps almost indefinitely.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Instant broth. A single brick makes several portions.</p>

      </section>

  description:
    value: >
      <p>A weighted casting net adapted from fishing equipment, the toami is thrown over targets to entangle and
      restrain them. Coastal villages train their militia with toami for capturing pirates alive, and bounty hunters use
      them to immobilize fugitives without risking a killing blow. The weighted edges spread in flight, and once wrapped
      around a target the net is surprisingly difficult to escape without cutting free.</p>

    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Oniuo 鬼魚 (Oni Fish)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong>
      hunting<br><strong>Preservation:</strong> 1 day fresh; 10 days salted<br><strong>Tools:</strong> Heavy fishing
      tackle, harpoon; the fish fights strongly and can injure<br><strong>Grade:</strong> 上 Jō (craft modifier: +0)</p>

      </article>

      </div>

      <p>A deep-water ocean fish with a brutal, almost armoured head and a jaw lined with small inward-curving teeth.
      The flesh is pale and dense, carrying a rich salt-and-iron flavour unlike any other catch. Prized by coastal chefs
      for the single cut drawn from the upper back, which is considered one of the finest pieces of fish in the
      archipelago.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Traditionally taken by harpoon from small boats during Tatsunami, when the deep schools rise closer to the
      surface. Dangerous work — losses are accepted as the price of the catch.</p>

      </section>

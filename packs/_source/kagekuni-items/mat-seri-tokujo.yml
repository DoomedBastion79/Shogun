      </article>

      </div>

      <p>Crisp, peppery water parsley found along streams and the margins of rice paddies. One of the very first wild
      greens to appear in spring — its arrival marks the true turning of the year for village cooks. A common addition
      to soups and rice dishes throughout the countryside.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>A sign of winter&#39;s end in paddy country. Abundant in the Tambo and Kawa to Numa of Kusa, Hana, and
      Tsuchi.</p>

      </section>

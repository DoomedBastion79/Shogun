      <p><strong>Category:</strong> Yakuso<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> 2 days fresh; loses flavour when dried<br><strong>Tools:</strong>

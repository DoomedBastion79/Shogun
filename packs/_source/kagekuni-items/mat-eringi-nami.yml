      <p>Tall, thick-stemmed mushrooms found on dead roots and buried wood in grasslands and field margins. The cap is
      small relative to the meaty stem, which is the prized part — firm, white, and holds its texture through long
      cooking. Farmers in Tsuchi gather them from freshly cleared fields.</p>


      <div class="fvtt advice">

      <article>

      <h4>Dokuro-take 髑髏茸 (Skull Cap)</h4>

      <p><strong>Category:</strong> Kinoko<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong> Foraged
      (Saishū)<br><strong>Preservation:</strong> Dries well; holds medicinal properties for
      years<br><strong>Tools:</strong> Herbalism kit (advantage); stomach for its habitat<br><strong>Grade:</strong> 極上
      Gokujō (craft modifier: +5)</p>

      </article>

      </div>

      <p>A bone-white mushroom found growing on ancient remains — specifically on buried skeletal material in
      battlefields, old gravesites, and ruined settlements. The cap is smooth and rounded, unsettlingly skull-like.
      Despite its morbid habitat, the flavor is mild and pleasant. Herbalists in Kaze province use it as a base for
      medicines that ease pain and promote rest.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>**Narrative hook:** Disturbing an old burial has consequences — particularly in haunted biomes. Use sparingly
      in sacred ground.</p>

      </section>

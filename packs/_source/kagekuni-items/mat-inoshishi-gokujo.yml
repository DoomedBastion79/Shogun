    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Inoshishi 猪 (Wild Boar)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong>
      hunting<br><strong>Preservation:</strong> 2 days fresh; indefinitely if smoked or
      salted<br><strong>Tools:</strong> Spear, polearm, or bow; cook's utensils for butchery<br><strong>Grade:</strong>
      極上 Gokujō (craft modifier: +5)</p>

      </article>

      </div>

      <p>Dense, dark, heavily marbled meat from Hokori&#39;s wild boars. The flavour is strong and distinctly gamey —
      deeper than venison, sweeter than bear — and the fat carries the diet of the forest: pine nut, fallen fruit, and
      fungus. Stewed with miso it becomes the defining winter meal of mountain communities.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Dangerous to hunt — a wounded boar can kill a man before dying. Winter boar is considered the finest, the fat
      layer at its thickest after the autumn foraging. A successful boar hunt yields Kegawa (hide) and Hone (tusks) as
      secondary materials.</p>

      </section>

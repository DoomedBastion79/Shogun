      <p>A clear, mildly acidic vinegar brewed from rice. Essential for pickles, dressings, and the proper preparation
      of sushi rice. Milder than most vinegars — it sharpens without dominating — and carried in small ceramic flasks on
      the road. A few drops in a bowl of rice transforms it.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Pickle base. Rice-prep essential.</p>

      </section>

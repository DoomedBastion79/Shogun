  description:
    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Seikinoko 精茸 (Sei Mushroom)</h4>

      <p><strong>Category:</strong> Kinoko<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> Fades of sei charge within 3 days of picking; dried caps retain flavour
      but lose resonance<br><strong>Tools:</strong> Herbalism kit (advantage); sei-sense or Arcana (Int) DC 12 to
      identify active specimens<br><strong>Grade:</strong> 極上 Gokujō (craft modifier: +5)</p>

      </article>

      </div>

      <p>Luminescent mushrooms found deep within the Yōsei Mori and in caverns with active sei flow. They glow a soft
      violet-blue and the caps are warm to the touch. The taste is subtle — like forest air after rain — but the sei
      resonance within them is unmistakable.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Sei-resonant. Ingredients in seimaster brews. Not a common market item — most are handled by shrine
      suppliers.</p>

      </section>

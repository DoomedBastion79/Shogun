      <h4>Udon & Soba うどん・蕎麦 (Wheat & Buckwheat Noodles)</h4>

      <p><strong>Category:</strong> Shushoku<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      harvesting<br><strong>Preservation:</strong> Dried weeks to months<br><strong>Tools:</strong>
      None<br><strong>Grade:</strong> 特上 Tokujō (craft modifier: +2)</p>

      </article>

      </div>

      <p>Dried wheat noodles (udon) and buckwheat noodles (soba), sold in paper-wrapped bundles. Keep for weeks, cook in
      minutes. Soba is the mountain food — buckwheat grows where wheat cannot — while udon is the lowland staple,
      favoured for its softness and the way it holds a rich broth. A traveller of any province recognises both and knows
      when to carry which.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Two regional subvariants — DM chooses which by province.</p>

      </section>

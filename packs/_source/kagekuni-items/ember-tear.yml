  description:
    value: >
      <p>A solidified droplet of dragon-fire — the visible token of a Hatchling Mark from the Crimson Brood (Akakkō).
      Warm to the touch but never burning the bearer. The Ember Tear pulses faintly in time with the bearer&#39;s
      heartbeat.</p>


      <h3>Properties</h3>

      <p><strong>Tier:</strong> Hatchling Mark (Tamashi-no-In) — Crimson Brood

      <strong>Attunement:</strong> Yes — bonded to a single bearer at the moment of granting

      <strong>Activation (1/long rest):</strong> As an action, hurl the tear up to 30 ft. It explodes in a 10-ft sphere,
      dealing 2d6 fire damage (Dex DC 13, half on save). The tear reforms in your hand at the next dawn.

      <strong>Loss:</strong> If the tear is lost, the bearer retains the Mark, but the active effect cannot be channeled
      until the relic is recovered or replaced. Replacement is at the brood&#39;s discretion.</p>

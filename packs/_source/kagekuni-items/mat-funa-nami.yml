      <h4>Funa 鮒 (Crucian Carp)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      hunting<br><strong>Preservation:</strong> 1 day fresh; 14 days salted; indefinitely
      dried<br><strong>Tools:</strong> Fishing tackle, nets, or traps<br><strong>Grade:</strong> 並 Nami (craft modifier:
      -2)</p>

      </article>

      </div>

      <p>Stout silver-bronze fish that fill every pond, paddy, and sluggish river in lowland Hokori. The flesh is mild
      and earthy and stands up to strong seasoning — miso, soy, and ginger are the traditional rescues. Peasant food
      elevated by time-honoured preparation.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>The most reliable fish in inland Hokori. Often the catch that separates a proper meal from an empty pot on a
      slow day.</p>

      </section>

  description:
    value: >
      <p>A teardrop of frozen silver light — the visible token of a Hatchling Mark from the Silver Brood (Ginkkō). At
      its core, a single fixed point of starlight that does not match the constellations of the present sky.</p>

      <p><strong>Tier:</strong> Hatchling Mark (Tamashi-no-In) — Silver Brood

      <strong>Attunement:</strong> Yes

      <strong>Passive (while carried):</strong> You do not need to sleep — meditate 4 hours instead for the full benefit
      of a long rest. You cannot be magically aged or have your lifespan reduced.

      <strong>Activation (1/long rest):</strong> As an action, freeze a 10-ft cube of liquid solid for 1 minute. The
      frozen volume can be shattered by heavy damage or sustained heat.

      <strong>Loss:</strong> As Ember-Tear.</p>

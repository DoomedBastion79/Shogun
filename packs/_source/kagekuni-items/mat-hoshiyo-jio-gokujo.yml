      <div class="fvtt advice">

      <article>

      <h4>Hoshiyo-jio 星夜塩 (Starlit Salt)</h4>

      <p><strong>Category:</strong> Shushoku<br><strong>Rarity:</strong> VeryRare<br><strong>Source:</strong>
      harvesting<br><strong>Preservation:</strong> Stable indefinitely in sealed crystal<br><strong>Tools:</strong>
      None<br><strong>Restrictions:</strong> Produced only by Hoshimori observatory communities during
      Hikarishō<br><strong>Grade:</strong> 極上 Gokujō (craft modifier: +5)</p>

      </article>

      </div>

      <p>A salt evaporated under the Hoshimori aurora during the peak of Hikarishō, when the dragon auroras touch the
      ground. The process takes an entire season and can only be completed by the observatory communities of Sora, who
      time their pans to the celestial alignments with instruments older than any living seimaster. The finished
      crystals glow faintly in darkness and carry a flavour that shifts with the stars overhead. Used only in the most
      extraordinary meals — once in a lifetime, if at all.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Seimaster-observatory gift. Tied to Ryushinki lore.


      ---


      **Yama-no-Ōkami (Mountain God) — Named Beast Harvest (Shushoku)**


      The Yama-no-Ōkami harvest additionally yielded one Shushoku-category component — the rendered subcutaneous fat.
      All Yama-no-Ōkami harvests are locked at 極上 Gokujō (the nat-20 harvest check during the Fushichō ashfall). See
      Part II &quot;Named Beast Harvests&quot; for the full harvest record.</p>

      </section>

      <div class="fvtt advice">

      <article>

      <h4>Iwana 岩魚 (Mountain Char)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong>
      Hunted<br><strong>Preservation:</strong> 1 day fresh; 10 days salted; indefinitely
      smoked<br><strong>Tools:</strong> Fishing tackle; spears in shallow water<br><strong>Grade:</strong> 極上 Gokujō
      (craft modifier: +5)</p>

      </article>

      </div>

      <p>The hardy freshwater char of cold mountain streams. The flesh is pale pink and the flavour carries the sharp
      cleanness of glacial water and the resinous trace of upstream conifers. Salt-grilled whole over charcoal, the skin
      crisps and the belly fat melts into something mountain hermits consider a perfect meal.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Traditional catch of mountain ascetics and hermit monks. Streamside cooking over a small fire is considered the
      only proper preparation.</p>

      </section>

      <article>

      <h4>Fuki 蕗 (Butterbur)</h4>

      <p><strong>Category:</strong> Yakuso<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> 3 days fresh; indefinitely pickled<br><strong>Tools:</strong> Herbalism
      kit; cook's utensils for blanching<br><strong>Grade:</strong> 極上 Gokujō (craft modifier: +5)</p>

      </article>

      </div>

      <p>A tall, broad-leafed plant with thick celery-like stalks that push up through the snow in early spring. The
      stalks are peeled, blanched, and simmered to remove a lingering bitterness — the reward is a clean fresh flavour
      that announces the end of winter. A beloved sign of the turning year in every mountain village.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Mountain villages hold small informal celebrations when the first fuki of the year is harvested. A reliable
      early-spring food source.</p>

      </section>

  description:
    value: >
      <p>A seed that always feels warm — the visible token of a Hatchling Mark from the Emerald Brood (Midokkō). The
      seed&#39;s surface bears the faint impression of moss and the smell of fresh-turned soil.</p>


      <h3>Properties</h3>

      <p><strong>Tier:</strong> Hatchling Mark (Tamashi-no-In) — Emerald Brood

      <strong>Attunement:</strong> Yes

      <strong>Activation (1/long rest):</strong> As an action, plant the seed in any natural soil. It grows instantly
      into a 10-ft-radius healing grove that lasts 1 hour. Allies who finish a short rest in the grove regain hit points
      equal to one of their Hit Dice without spending it. The seed reforms in your pack at the next dawn.

      <strong>Loss:</strong> As Ember-Tear.</p>

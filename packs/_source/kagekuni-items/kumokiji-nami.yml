    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Kumokiji 雲雉 (Cloud Pheasant)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong>
      Hunted<br><strong>Preservation:</strong> 2 days fresh; 14 days salted<br><strong>Tools:</strong> Bow with strong
      draw; the bird is wary and high-flying<br><strong>Grade:</strong> 並 Nami (craft modifier: -2)</p>

      </article>

      </div>

      <p>A large, crested pheasant that lives above the cloud ceiling of the Hoshimori Plateau and the higher peaks. The
      breast meat is pale, tender, and carries an impossibly clean flavour — something the people of Kumo-no-Ue describe
      as &quot;the taste of thin air.&quot; Tradition holds the bird only descends to lower altitudes during
      Hikarishō.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>The Hoshimori observatories guard their hunting privileges jealously. Seimasters sometimes receive a
      cloud-pheasant breast as ceremonial payment.</p>

      </section>

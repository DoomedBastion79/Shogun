      <article>

      <h4>Haratake 原茸 (Meadow Cap)</h4>

      <p><strong>Category:</strong> Kinoko<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> Fresh 2 days; dries adequately<br><strong>Tools:</strong> Herbalism kit
      (advantage); a failure to identify correctly runs real risk of deadly lookalike<br><strong>Grade:</strong> 特上
      Tokujō (craft modifier: +2)</p>

      </article>

      </div>

      <p>Round, white-capped mushrooms found in open grasslands and grazed meadows, particularly where horses or cattle
      have passed. They push up in rings overnight after rain. The flavour is mild and slightly sweet — the most
      forgiving mushroom for new foragers, but also the easiest to mistake for dangerous lookalikes. Experienced
      gatherers teach children the telltale pink-to-brown gill colour.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>**Risk flag:** easily mistaken for a deadly lookalike. Unproficient foragers should roll with disadvantage on
      identification; a failed identification at low grade may merit a poisoning check.


      ---


      **上 Jō — Uncommon**</p>

      </section>

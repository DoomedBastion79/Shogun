    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Ryūgame 竜亀 (Dragon Turtle)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> VeryRare<br><strong>Source:</strong>
      hunting<br><strong>Preservation:</strong> 2 days fresh; indefinitely smoked or salted<br><strong>Tools:</strong>
      Heavy harpoon, ship-based hunt; cook's utensils essential — the shell is used in Hone<br><strong>Grade:</strong>
      極上 Gokujō (craft modifier: +5)</p>

      </article>

      </div>

      <p>Flesh from the great dragon-turtles that live in the deepest channels of the Serenia-kai. The meat is dense,
      dark, and carries a flavour that shifts between fish and the richest game — salt and iron in the first bite,
      something almost sweet and smoky in the finish. A single successful hunt can feed a small village for a week.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Hunting a dragon turtle is a clan-scale endeavour — a year&#39;s worth of story for the crew that brings one
      home. The secondary materials from the kill (shell for Hone, hide for Kegawa) can be worth as much as the
      meat.</p>

      </section>

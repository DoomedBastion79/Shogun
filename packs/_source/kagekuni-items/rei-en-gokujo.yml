      <div class="fvtt advice">

      <article>

      <h4>Rei-en 霊塩 (Spirit Salt)</h4>

      <p><strong>Category:</strong> Chomiryo<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong> Harvested
      (Saishū)<br><strong>Preservation:</strong> Indefinite; holds faint sei-glow for weeks<br><strong>Tools:</strong>
      Herbalism kit (advantage); shrine permission or discretion<br><strong>Grade:</strong> 極上 Gokujō (craft modifier:
      +5)</p>

      </article>

      </div>

      <p>Crystalline deposits found at the margins of sei-active springs and pools, where the interaction between sei
      energy and mineral-rich water produces salt crystals that are faintly warm and carry a subtle luminescence. The
      flavor is clean and bright — not quite salt, not quite sweet, but something adjacent to both. Dissolves instantly
      on contact with food.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>**Shrine-held.** Unauthorized harvest is sacrilege; may draw spirit ire.</p>

      </section>

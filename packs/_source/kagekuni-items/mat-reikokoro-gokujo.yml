  description:
    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Reikokoro 霊心 (Spirit Heart)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Legendary<br><strong>Source:</strong>
      one-time-harvest<br><strong>Preservation:</strong> 2 days fresh; indefinitely if salted<br><strong>Tools:</strong>
      Cook's utensils at minimum; shrine-blessed preparation strongly indicated<br><strong>Restrictions:</strong>
      One-time only; irreplaceable; ceremonial significance</p>

      </article>

      </div>

      <p>The creature&#39;s heart, roughly the size of a man&#39;s head and several times heavier, still faintly warm
      hours after death. Dense, dark red, and threaded with silver-white veins that pulsed once when first exposed to
      air before going still. It takes two grown men working together to lift it cleanly from the chest cavity, and one
      of them will need both hands. Mountain hunters speak of the reikokoro only in hushed terms — one portion, one
      meal, one chance. In the entire recorded history of Hokori&#39;s mountain provinces, a handful of cooks have been
      trusted with such an organ. None of them ever forgot the meal. Suitable for a Masterwork dish that feeds the
      entire party.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>**[SEALED]** *(The mechanical and spiritual weight of the Reikokoro is a campaign-level matter. See DM secrets
      below.)*


      - **Religion (DC 15)** — Eating the heart of a kami avatar is a profound act, and the tradition surrounding it is
      divided. Some mountain sects consider it transgressive — a violation of the spirit&#39;s onward journey. Others
      consider it sacred — a sharing of essence between the slain and the slayer. If the meal is prepared at a shrine
      with proper rites, the latter interpretation prevails, and the eaters may be marked by the kami&#39;s blessing for
      some time after.

      - **Nature (DC 13)** — The character recognizes the heart as exceptional spirit-flesh, understands that it must be
      cooked fresh or properly preserved, and knows that the preparation requires great care. Suggests cook&#39;s
      utensils proficiency at minimum.

      - **Arcana (DC 16)** — The heart retains a fragment of the creature&#39;s essence. A character with arcane
      training senses it on contact — a low, steady warmth like banked coals. Eating it grants more than ordinary
      nourishment; it transfers a small portion of the creature&#39;s spiritual nature to the eater. (DM: this is the
      mechanical justification for the Masterwork buff — the players don&#39;t need to know the mechanics, but a
      character who passes this check understands *why* the meal will matter.)


      Preparation should be a scene — not a roll. The meal is worth a session opening.


      ---</p>

      </section>

    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Kaseki-gani 化石蟹 (Fossil Crab)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> Must be kept alive until cooking; dead crab spoils within
      hours<br><strong>Tools:</strong> None — hand-caught; cook's utensils essential for cracking the stone-like
      shell<br><strong>Grade:</strong> 並 Nami (craft modifier: -2)</p>

      </article>

      </div>

      <p>A deep-shelled crab so ancient in lineage that its carapace is nearly as hard as stone, mineralised by
      millennia of selection for defence. The flesh inside is astonishing — dense, sweet, and faintly floral, with a
      texture closer to dense custard than to ordinary crab. Breaking the shell takes a stone hammer; the reward is
      worth the labour.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Rarely encountered — a successful forage is a small event. Most often found by foragers working unusual
      stretches of coastline, particularly where tidal pools sit against ancient volcanic rock.</p>

      </section>

      <h4>Tōgarashi 唐辛子 (Hill Chili)</h4>

      <p><strong>Category:</strong> Chomiryo<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> Dried indefinitely; ground powder 1 year; oil infusion 6
      months<br><strong>Tools:</strong> None required; string to hang for drying<br><strong>Grade:</strong> 特上 Tokujō
      (craft modifier: +2)</p>

      </article>

      </div>

      <p>Slender red peppers that grow on low shrubs along sun-warmed hillsides and field margins. Dried whole and
      crushed into flakes, or ground fine and blended with other spices. The heat is clean and bright rather than
      smouldering. Essential to the everyday cooking of Hi province and beloved everywhere the cold reaches in.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Hi province cultural staple; winter mountain food essential.</p>

      </section>

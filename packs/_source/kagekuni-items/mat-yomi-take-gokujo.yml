    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Yomi-take 黄泉茸 (Underworld Cap)</h4>

      <p><strong>Category:</strong> Kinoko<br><strong>Rarity:</strong> VeryRare<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> Stable in absolute darkness; decays rapidly in any
      light<br><strong>Tools:</strong> Herbalism kit (advantage); Arcana (Int) DC 15 to handle
      safely<br><strong>Restrictions:</strong> Found only in places that have not seen light in geological
      time<br><strong>Grade:</strong> 極上 Gokujō (craft modifier: +5)</p>

      </article>

      </div>

      <p>A pitch-black mushroom found in the deepest accessible caverns of Kagekuni — places where no light has reached
      in geological time. The cap absorbs light rather than reflecting it, creating a visual absence that is
      disorienting to look at directly. The flavor is the densest umami imaginable — concentrated essence of earth and
      darkness. Herbalists and seimasters debate whether it should be classified as a fungus at all.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>**Classification unresolved.** Consumption is a DM-discretion event — may have sei effects, may simply be the
      purest umami in Kagekuni. Often tied to deep-dungeon reward.</p>

      </section>

  description:
    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Ōkami no Zugai 狼の頭骸 (Mountain God's Skull)</h4>

      <p><strong>Category:</strong> Hone<br><strong>Rarity:</strong> VeryRare<br><strong>Source:</strong>
      one-time-harvest<br><strong>Preservation:</strong> Indefinite. Should be cleaned and mounted soon after harvest;
      raw skulls benefit from bleaching and careful jaw stabilization.<br><strong>Tools:</strong> Bone cleaning and
      mounting requires specialist work; shrine enshrinement requires priestly rites<br><strong>Restrictions:</strong>
      Single-grade-locked. Does not follow standard grade progression.</p>

      </article>

      </div>

      <p>The skull was lifted intact from the spine — a fanged mask the size and shape of a temple bell, its great jaws
      still locked in their final snarl, the orbital sockets large enough that a child could put a fist into one. The
      bone is pale grey and unusually heavy, threaded with fine darker veining beneath the surface. As an object it is
      genuinely arresting — visitors to a hall containing such a skull tend to fall silent on first seeing it, and stay
      that way longer than is comfortable.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>**One-time harvest.** Single-grade-locked at 極上 Gokujō. Party currently holds the intact skull (tracked in
      `dm/campaign-state.md`).


      **Skill-Check Reveals** — one check per skill; nat-20 reveals all three.


      - **Religion (DC 14)** — The skull of a kami avatar is a relic. The mountain temples of Sora, upper Kaze, and
      Tsuchi maintain a tradition of enshrinement for such skulls — placing them in a sealed inner chamber, before which
      offerings are made for the spirit&#39;s onward journey. A temple receiving this skull would consider the giver to
      be marked by the kami in question, in a way that is generally considered fortunate but is occasionally not.

      - **Nature (DC 12)** — The wear on the teeth and the size of the orbital ridges suggest a creature in its prime,
      perhaps a century old. The character can read the diet from the molars (predominantly meat, but also some plant
      matter — unusual for a wolf) and identify the species characteristics that mark this as more than a normal beast.

      - **Arcana (DC 16)** — The skull retains a strong sei imprint — the strongest of any of the components. It could
      be turned into a ward-mask for ritual use, a powerful arcane focus, or a vessel for binding magics. A skilled
      seimaster could conceivably use it to commune with the creature&#39;s lingering essence, though doing so would
      risk drawing the attention of whatever kami the beast served in life. Detect Magic registers it clearly.


      Cross-references: See Kegawa → Ōkami no Kegawa; Hone → Ōkami no Hone / Kiba / Tenohira.</p>

      </section>

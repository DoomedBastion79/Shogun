      <h4>Kagami Mochi no Shinsei 鏡餅の神聖 (Sacred Mirror Mochi)</h4>

      <p><strong>Category:</strong> Shushoku<br><strong>Rarity:</strong> VeryRare<br><strong>Source:</strong> Ceremonial
      distribution only<br><strong>Preservation:</strong> Remains ritually potent for the year; edible for
      months<br><strong>Tools:</strong> None<br><strong>Restrictions:</strong> Distributed once per year at shrines;
      mortal travellers almost never receive it<br><strong>Grade:</strong> 上 Jō (craft modifier: +0)</p>

      </article>

      </div>

      <p>Ceremonial mochi prepared once per year at specific Shinto shrines during the turning of the year. The rice is
      pounded by priests in ritual silence, and the finished mochi is placed upon the shrine altar for seven days before
      being divided among the shrine community. Those who receive a piece are said to be blessed by the ancestors for
      the year to come. Mortal travellers almost never obtain it; when they do, it is because a priest has chosen to
      honour them specifically.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>**Ancestor-blessing hook.** Annual distribution.</p>

      </section>

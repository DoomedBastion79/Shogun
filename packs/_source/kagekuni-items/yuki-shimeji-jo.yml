      <h4>Yuki-shimeji 雪占地 (Snow Cluster)</h4>

      <p><strong>Category:</strong> Kinoko<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong> Foraged
      (Saishū)<br><strong>Preservation:</strong> Fresh 3 days in cold; dries adequately; flavour fades outside cold
      climate<br><strong>Tools:</strong> Herbalism kit (advantage); cold-weather gear<br><strong>Grade:</strong> 上 Jō
      (craft modifier: +0)</p>

      </article>

      </div>

      <p>A cold-hardy variant of the common shimeji found only above the snow line in Sora and on the highest ridges of
      the Tenchūsan Ren. The caps are pale blue-white and the stems are unusually crisp. The flavor is clean and
      slightly sweet, with a brightness that ordinary shimeji lack.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Sora/Tenchūsan signature. Reliable altitude indicator.</p>

      </section>

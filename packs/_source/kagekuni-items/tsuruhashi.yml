  description:
    value: >
      <p>A heavy pick with a curved spike designed to punch through stone and armor alike, the tsuruhashi — literally
      &quot;crane&#39;s beak&quot; — is a siege engineer&#39;s tool adapted for war. Zirak sappers and castle-breakers
      carry them for undermining walls, but the concentrated force of the spike makes it devastatingly effective against
      armored opponents. A single well-placed strike can pierce plate that would deflect a sword.</p>

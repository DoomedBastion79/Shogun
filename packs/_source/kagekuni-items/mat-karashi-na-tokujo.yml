      <h4>Karashi-na 芥子菜 (Mustard Greens)</h4>

      <p><strong>Category:</strong> Yakuso<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> 4 days fresh; indefinitely pickled or dried<br><strong>Tools:</strong>
      Herbalism kit<br><strong>Grade:</strong> 特上 Tokujō (craft modifier: +2)</p>

      </article>

      </div>

      <p>Broad, deep-green leaves with a sharp peppery bite that mellows with cooking. Self-seeds along cultivated field
      margins and disturbed ground, especially in Tsuchi and Hana where farmers allow them to grow wild between
      plantings. Used in pickles, stir-fries, and the spicy soups of winter.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Abundant between plantings in the rice provinces. A reliable supplement when other greens are out of season.


      ---


      **Uncommon**</p>

      </section>

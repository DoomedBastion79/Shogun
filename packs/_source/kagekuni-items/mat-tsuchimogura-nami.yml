    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Tsuchimogura 土藻鱼 (Earth Mole)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong>
      hunting<br><strong>Preservation:</strong> 2 days fresh; 10 days salted<br><strong>Tools:</strong> Specialized
      burrow traps; patience more than strength<br><strong>Grade:</strong> 並 Nami (craft modifier: -2)</p>

      </article>

      </div>

      <p>An unusually large subterranean mammal — dense, short-limbed, and blind — whose meat is prized among farmers
      and foragers for its rich, dark flavour and the surprising tenderness of its flesh. Hunted with patience rather
      than force; a single earth mole can feed a small family for several meals.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Traditional prey of rural trappers working grassland and foothill edges. The burrow networks are extensive — a
      patient hunter sets traps at multiple exits and waits.</p>

      </section>

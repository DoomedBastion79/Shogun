      <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-description"
      data-section="description">Description</h3>

      <p>The straight-bladed spear of Kagekuni&#39;s infantry, the yari is the weapon that wins wars. While samurai duel
      with katanas, it is the massed yari of ashigaru formations that hold battle lines and break cavalry charges. A
      simple cross-shaped blade on a wooden shaft, the yari requires minimal training and can be thrown in desperation
      or braced against a charge.</p>


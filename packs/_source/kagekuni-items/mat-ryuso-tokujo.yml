  description:
    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Ryūsō 竜草 (Dragon Herb)</h4>

      <p><strong>Category:</strong> Yakuso<br><strong>Rarity:</strong> VeryRare<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> 3 days fresh; cannot be dried without losing
      properties<br><strong>Tools:</strong> Herbalism kit; ritual knowledge
      recommended<br><strong>Restrictions:</strong> Cannot be cultivated — transplant kills the plant within
      hours<br><strong>Grade:</strong> 特上 Tokujō (craft modifier: +2)</p>

      </article>

      </div>

      <p>A small, leathery-leafed plant found growing directly on the stone of Progenitor shrine sites, its roots
      apparently drawing sustenance from the rock itself. The leaves are warm to the touch year-round and carry a faint
      metallic sheen. When consumed, the flavour changes depending on the shrine&#39;s associated Progenitor — fiery
      near Crimson sites, cool and bright near Azure.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Transplanting attempts always fail. The plant draws its properties from the shrine itself — uproot it and the
      effect dies with the roots. A character with Religion training recognises the ritual significance immediately.</p>

      </section>

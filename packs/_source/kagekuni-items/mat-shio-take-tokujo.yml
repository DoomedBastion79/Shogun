      <p>A pale, crystalline-crusted mushroom found in coastal caves where seawater seeps through limestone. The natural
      salt crust makes it unique — it serves as both ingredient and seasoning simultaneously. Nami fishermen use them in
      chowder-like stews where the salt dissolves into the broth.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Tide-gated harvest — low tide required for access to deeper grottoes.


      ---


      **特上 Tokujō — Rare**</p>

      </section>

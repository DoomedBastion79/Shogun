      <p>Pressed sesame oil in small stoppered flasks, amber-golden and carrying a deep nutty aroma that fills a
      campsite the moment the stopper is drawn. Used for frying and as a finishing drizzle. The scent alone can elevate
      the humblest campfire meal from mere sustenance to proper cooking.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Camp-kitchen signature smell. DM descriptor for cooking scenes.</p>

      </section>

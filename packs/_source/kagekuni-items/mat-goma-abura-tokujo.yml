      <h4>Goma-abura 胡麻油 (Sesame Oil)</h4>

      <p><strong>Category:</strong> Shushoku<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      harvesting<br><strong>Preservation:</strong> 6 months in stoppered flask; rancid if exposed to
      heat<br><strong>Tools:</strong> None<br><strong>Grade:</strong> 特上 Tokujō (craft modifier: +2)</p>

      </article>


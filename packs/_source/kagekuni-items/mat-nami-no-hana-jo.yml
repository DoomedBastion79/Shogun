      <p>A dried sea foam that crystallizes on coastal rocks during the height of Tatsunami season, when the four-moon
      alignment drives extreme tides. The crystals are white, feathery, and dissolve on the tongue with an intense
      brininess followed by an unexpected sweetness. Used as a finishing salt on delicate dishes. Available only during
      a narrow seasonal window.</p>


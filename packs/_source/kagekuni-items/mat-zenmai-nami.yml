    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Zenmai 薇 (Royal Fern)</h4>

      <p><strong>Category:</strong> Yakuso<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> 2 days fresh; indefinitely dried after ash-water
      treatment<br><strong>Tools:</strong> Herbalism kit; cook's utensils for preparation<br><strong>Grade:</strong> 並
      Nami (craft modifier: -2)</p>

      </article>

      </div>

      <p>Tightly curled young fern heads, densely furred with golden down, harvested from the forest floor in spring.
      The down must be scrubbed off and the stalks soaked overnight before cooking. Once prepared they are meaty and
      faintly nutty — excellent in simmered dishes or dressed with miso. Mountain villagers preserve bundles of dried
      zenmai for winter cooking.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Similar to warabi in requiring ash-water treatment. A sack of dried zenmai is often carried by mountain
      travellers as winter insurance.</p>

      </section>

      <article>

      <h4>Umeboshi 梅干し (Pickled Plum)</h4>

      <p><strong>Category:</strong> Shushoku<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      harvesting<br><strong>Preservation:</strong> Years in sealed jar; often generations<br><strong>Tools:</strong>
      None<br><strong>Grade:</strong> 特上 Tokujō (craft modifier: +2)</p>

      </article>

      </div>

      <p>Small, intensely salty-sour plums pickled in salt and red shiso leaves, wrapped individually in leaf or stored
      in small jars. A single umeboshi sharpens a bowl of plain rice, and travellers swear the fruit wards off road
      sickness, fevers, and ill intentions. Keeps for years — many households preserve the same crock across
      generations.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Folk-remedy for fever, road-sickness, ill intentions. Good to hand to players at long rests.</p>

      </section>

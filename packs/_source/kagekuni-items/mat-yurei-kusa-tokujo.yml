    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Yūrei-kusa 幽霊草 (Ghost Grass)</h4>

      <p><strong>Category:</strong> Yakuso<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> 14 days fresh; indefinitely dried<br><strong>Tools:</strong> Herbalism
      kit<br><strong>Grade:</strong> 特上 Tokujō (craft modifier: +2)</p>

      </article>

      </div>

      <p>A pale, almost transparent grass that grows in the shadow of ancient ruins and abandoned settlements —
      particularly around Tsukikage in Kaze province. It sways without wind and is cold to the touch even in summer.
      When brewed as a tea, it produces a heightened awareness of one&#39;s surroundings that borders on unsettling.
      Some drinkers report hearing whispers.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>A particularly good candidate for Tenku-ji Temple foraging. Tea from yūrei-kusa grants perception advantages
      but causes unsettling sensations — DM may choose to impose minor morale checks for prolonged use.</p>

      </section>

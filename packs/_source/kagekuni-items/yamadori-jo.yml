      <h4>Yamadori 山鳥 (Mountain Pheasant)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      Hunted<br><strong>Preservation:</strong> 2 days fresh; 14 days hung and salted<br><strong>Tools:</strong> Bow or
      snares; cook's utensils for dressing<br><strong>Grade:</strong> 上 Jō (craft modifier: +0)</p>

      </article>

      </div>

      <p>The copper-barred pheasants of Hokori&#39;s forested hills. Larger and richer than quail, with a deep-red
      breast meat that benefits from slow cooking or the sharp bright heat of the grill. A proud bird, hunted by lords
      as often as peasants.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>A favoured game bird of samurai hunters and a good meal for a road-weary party. Best taken at dawn along forest
      edges.</p>

      </section>

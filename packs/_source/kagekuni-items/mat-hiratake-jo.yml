      <p>Fan-shaped mushrooms growing in overlapping shelves on standing dead trees and fallen logs. The flesh is thick,
      meaty, and absorbs seasoning readily. A favorite of trail cooks because of its substantial texture — it can stand
      in for meat in lean times.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>The travel cook&#39;s friend. Common call-out for shokunin making mountain stews.</p>


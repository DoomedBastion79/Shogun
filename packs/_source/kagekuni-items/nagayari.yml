  description:
    value: >
      <p>An extremely long spear — sometimes exceeding twenty feet — the nagayari is a formation weapon, not an
      individual one. Rows of ashigaru brace nagayari in dense hedgehog formations that no cavalry can penetrate.
      Individually the weapon is cumbersome and nearly useless in close quarters, but in disciplined ranks it creates an
      impenetrable wall of steel points. Entire battles have been won by the side with longer spears.</p>

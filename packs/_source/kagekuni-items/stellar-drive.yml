  description:
    value: >
      <p>The stellar drive of Ōryūzan Tenkū-ji&#39;s orrery — the precision clockwork core that translates sei input
      into mechanical output across the planetary, lunar, and projection systems. About the size of a large lantern,
      dense for its size, designed to seat into the orrery&#39;s central spindle housing on the second floor; it is not
      the spindle itself but the heart inside it.</p>


      <h4>Sanjūnen-shōyu 三十年醤油 (Thirty-Year Soy)</h4>

      <p><strong>Category:</strong> Shushoku<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong>
      harvesting<br><strong>Preservation:</strong> Indefinite<br><strong>Tools:</strong> None<br><strong>Grade:</strong>
      特上 Tokujō (craft modifier: +2)</p>

      </article>

      </div>

      <p>A soy sauce aged for three decades in a single cask, producing a liquid so concentrated that it is used drop by
      drop rather than poured. The flavour is almost savoury-sweet, with notes of dark caramel and deep earth. Only a
      handful of producers in Hana and Tsuchi have casks old enough to yield it, and each produces only a few small
      flasks per year. Purchased by Heian chefs at the start of each season.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Used by the drop. Heian chef signature item.</p>

      </section>

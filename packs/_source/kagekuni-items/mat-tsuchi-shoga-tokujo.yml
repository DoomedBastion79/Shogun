      <article>

      <h4>Tsuchi-shōga 土生姜 (Earth Ginger)</h4>

      <p><strong>Category:</strong> Yakuso<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> 30 days fresh; indefinitely dried or pickled<br><strong>Tools:</strong>
      Herbalism kit; simple digging tool<br><strong>Grade:</strong> 特上 Tokujō (craft modifier: +2)</p>

      </article>

      </div>

      <p>A knotty root found in the mineral-rich soil of Tsuchi province&#39;s agricultural valleys. Smaller and more
      intensely flavoured than cultivated ginger, with a sharp heat and an earthy undertone that reflects the volcanic
      soil it grows in. Farmers dig it up as a byproduct of plowing and sell it at local markets.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>A byproduct of ordinary farming; Tsuchi market stalls sell it for next to nothing, which is part of why nobody
      outside the province recognises how superior it is.


      ---


      **Rare**</p>

      </section>

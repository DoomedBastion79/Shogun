  description:
    value: >
      <p>A kama sickle attached to a weighted chain, the kusarigama is a weapon born from peasant ingenuity. The wielder
      swings the weighted end to entangle weapons or limbs, then closes with the sickle blade. Its reach and
      unpredictable attack angles make it surprisingly effective against swordsmen, and it can be disguised as ordinary
      farming equipment. Rebel groups and covert operatives favor it for this reason.</p>

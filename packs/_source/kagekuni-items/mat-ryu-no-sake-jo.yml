      <h4>Ryū no Sake 竜の酒 (Dragon's Sake)</h4>

      <p><strong>Category:</strong> Shushoku<br><strong>Rarity:</strong> VeryRare<br><strong>Source:</strong>
      harvesting<br><strong>Preservation:</strong> Indefinite in sealed ceremonial flask<br><strong>Tools:</strong>
      None<br><strong>Restrictions:</strong> **Never sold**; a single Progenitor-blessed cask in continuous
      use<br><strong>Grade:</strong> 上 Jō (craft modifier: +0)</p>

      </article>

      </div>

      <p>Sake brewed in a single cask that was blessed at a Progenitor shrine generations ago and has been in continuous
      use ever since. The rice is Tennō-mai, the water is drawn from a sei-active spring, and the fermentation is tended
      by a master brewer who inherited the position from their grandmother. The finished sake is faintly luminescent in
      dim light, and those who drink it describe a sensation of warmth settling into the bones. Served only at imperial
      observances and the highest Shinto ceremonies — never sold, and given only as the most meaningful of gifts.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Campaign-level gift. Use as recognition from an emperor-tier figure.</p>

      </section>

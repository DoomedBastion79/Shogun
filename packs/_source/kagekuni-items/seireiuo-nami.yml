      <div class="fvtt advice">

      <article>

      <h4>Seireiuo 精霊魚 (Spirit Fish)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong>
      Hunted<br><strong>Preservation:</strong> 1 day fresh; loses most of its properties if
      preserved<br><strong>Tools:</strong> Fishing tackle; handled with care — the fish is cold to the touch and faintly
      luminescent<br><strong>Grade:</strong> 並 Nami (craft modifier: -2)</p>

      </article>

      </div>

      <p>A pale, faintly luminescent fish found only in streams that run through sei-resonant woodland. The flesh
      carries a subtle warmth on the tongue unrelated to temperature — a sensation closer to a chord of music than a
      flavour. Favoured by seimasters for ritual meals and by healers as a restorative.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Found in Yōsei Mori streams and at sei-active spring mouths. Handling triggers a faint prickling in the hands
      of sei-sensitive characters. The fish loses its resonance within a day of dying — delay in cooking is a real
      loss.</p>

      </section>

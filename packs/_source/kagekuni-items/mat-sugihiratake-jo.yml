      <p>Pale, fan-shaped mushrooms that grow in dense overlapping shelves on fallen cedar and cypress logs in mountain
      forests. The flesh is thin but flavourful, with a distinctive resinous note from the wood beneath. Mountain
      villagers in Sora and Kaze gather them in bulk during damp autumns and dry them in strings beneath the eaves.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>The mountain villager&#39;s dry-stock mushroom.</p>

      </section>

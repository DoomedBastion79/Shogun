  description:
    value: >-
      <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-description"
      data-section="description">Description</h3>

      <p>A heavy war hammer with a flat striking face on one side and a spiked peen on the other, the otsuchi is the
      signature weapon of Zirak warriors who forge their own arms. The flat face crushes and dents; the spike punches
      through. Armorsmiths who spend their days shaping metal at the anvil develop the precise, powerful swings that
      make the otsuchi lethal in battle — same motion, different intent.</p>

      </section>

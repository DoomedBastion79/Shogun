      <h4>Kikurage 木耳 (Wood Ear)</h4>

      <p><strong>Category:</strong> Kinoko<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> Dries flat and keeps indefinitely; reconstitutes easily in
      water<br><strong>Tools:</strong> Herbalism kit (advantage)<br><strong>Grade:</strong> 極上 Gokujō (craft modifier:
      +5)</p>

      </article>

      </div>

      <p>Thin, translucent, ear-shaped fungi found on dead elder and willow wood near streams. The texture is crunchy
      and gelatinous — they contribute body rather than flavor. Widely used in soups and stir-fried dishes across all
      provinces. Dries flat and reconstitutes easily.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Near-infinite shelf life — carries well on long journeys.</p>

      </section>

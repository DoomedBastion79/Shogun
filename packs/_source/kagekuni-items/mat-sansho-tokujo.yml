      <article>

      <h4>Sanshō 山椒 (Mountain Pepper)</h4>

      <p><strong>Category:</strong> Chomiryo<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> Dries well; whole peppercorns keep for years; ground powder loses punch
      in months<br><strong>Tools:</strong> Herbalism kit (advantage); care — the plant is
      prickly<br><strong>Grade:</strong> 特上 Tokujō (craft modifier: +2)</p>

      </article>

      </div>

      <p>Small, citrus-scented peppercorns found on prickly shrubs along mountain trails and forest edges. The flavor is
      bright and tingling rather than hot — a numbing, almost electric sensation on the tongue. Used whole, cracked, or
      ground. Available nearly everywhere mountains meet forest.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Near-universal wild forage. Reliable fallback crop.</p>

      </section>

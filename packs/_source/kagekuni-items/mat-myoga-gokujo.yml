      <h4>Myōga 茗荷 (Wild Ginger Bud)</h4>

      <p><strong>Category:</strong> Chomiryo<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> Fresh 3–4 days; pickles beautifully; dried loses most of its floral
      notes<br><strong>Tools:</strong> Herbalism kit (advantage); careful eye for leaf litter<br><strong>Grade:</strong>
      極上 Gokujō (craft modifier: +5)</p>

      </article>

      </div>

      <p>Pale pink buds found at the base of wild ginger plants in shaded, damp forest understory. The flavor is bright
      and peppery with a floral sharpness — sliced thin, it brightens any dish. Abundant in the right conditions but
      easy to overlook under leaf litter.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Easy to miss on a failed roll.</p>

      </section>

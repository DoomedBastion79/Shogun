      <div class="fvtt advice">

      <article>

      <h4>Yuki-kiji 雪雉 (Snow Pheasant)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong>
      hunting<br><strong>Preservation:</strong> 2 days fresh; 14 days hung<br><strong>Tools:</strong> Bow; traps suffer
      in deep snow<br><strong>Grade:</strong> 並 Nami (craft modifier: -2)</p>

      </article>

      </div>

      <p>The white-winter pheasant of the high peaks, nearly invisible against fresh snow. The breast meat is pale and
      dense, with a subtle herbal aftertaste from the alpine browse of berries and conifer shoots. Mountain villages
      consider a snow-pheasant kill a mark of hunting skill.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Hunted in winter above the tree line. A successful kill is a village story. Best taken with bow — the
      bird&#39;s white camouflage makes snare work unreliable.</p>

      </section>

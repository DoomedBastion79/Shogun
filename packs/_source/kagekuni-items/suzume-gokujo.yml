      <article>

      <h4>Suzume 雀 (Sparrow)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      Hunted<br><strong>Preservation:</strong> 1 day fresh; 5 days smoked<br><strong>Tools:</strong> Bird snares, sling;
      cook's utensils for dressing<br><strong>Grade:</strong> 極上 Gokujō (craft modifier: +5)</p>

      </article>

      </div>

      <p>Small songbirds netted in cultivated fields and eaves of village houses. The meat is dark and intensely
      flavoured for its size, traditionally grilled whole on a skewer — head, bones, and all. A peasant&#39;s protein,
      eaten without ceremony.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>A village commonplace. Children often hunt them with slings or glue-sticks. Not considered refined food, but
      ubiquitous and reliable. Abundant near Tambo during rice-harvest season.</p>

      </section>

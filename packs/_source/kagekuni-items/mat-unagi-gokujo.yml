    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Unagi 鰻 (Freshwater Eel)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong>
      hunting<br><strong>Preservation:</strong> 1 day fresh; cooked eel keeps 2 days<br><strong>Tools:</strong> Traps,
      fishing tackle with specialized hooks; cook's utensils essential for butchering<br><strong>Grade:</strong> 極上
      Gokujō (craft modifier: +5)</p>

      </article>

      </div>

      <p>Long, dark eels pulled from slow rivers and river-mouth estuaries. The flesh is rich with fat, almost buttery,
      and requires expert butchery to prepare properly — the spine must be pinned and the fillets drawn in long clean
      cuts. Grilled over coals and basted with a sweet soy glaze, it is one of the great summer indulgences in
      Kagekuni.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Traditional hashing — pinning the spine, drawing the fillets, removing the skin — requires trained hands. A
      cook without cook&#39;s utensils proficiency gets a rough, partially-ruined yield. Summer eel is strongest in
      flavour; autumn eel is fatter.</p>

      </section>

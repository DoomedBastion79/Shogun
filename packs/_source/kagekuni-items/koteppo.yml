  description:
    value: >
      <p>A compact matchlock pistol small enough to fire with one hand, the koteppo sacrifices range and stopping power
      for concealability. Developed by Glimfyr gunsmiths on Tatara and smuggled into the mainland despite Teppo Bugyo
      regulations, it is prized by bodyguards, spies, and anyone who needs a hidden weapon that ends arguments instantly
      at close range. The thunderclap of its discharge makes stealth impossible afterward.</p>

      <h4>Shiso-mi 紫蘇の実 (Perilla Seeds)</h4>

      <p><strong>Category:</strong> Chomiryo<br><strong>Rarity:</strong> Common<br><strong>Source:</strong> Foraged
      (Saishū)<br><strong>Preservation:</strong> Dried a year or more; often salted for
      travel<br><strong>Tools:</strong> Herbalism kit (advantage); cloth to catch shaken
      seeds<br><strong>Grade:</strong> 並 Nami (craft modifier: -2)</p>

      </article>

      </div>

      <p>The dark, peppery seeds produced by mature perilla plants at the end of summer. Gathered by shaking ripe stalks
      over a cloth, then dried and cracked between the teeth or ground into a finishing dust. Adds a complex, almost
      medicinal depth to rice, fish, and pickles. Often mixed with salt for travel.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Travel preservation item; often gifted by rural shokunin.


      ---


      **上 Jō — Uncommon**</p>

      </section>

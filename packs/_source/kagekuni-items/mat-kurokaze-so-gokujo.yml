      <h4>Kurokaze-sō 黒風草 (Black Wind Herb)</h4>

      <p><strong>Category:</strong> Yakuso<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> 5 days fresh; indefinitely dried<br><strong>Tools:</strong> Herbalism
      kit<br><strong>Restrictions:</strong> Found only in Kaze province<br><strong>Grade:</strong> 極上 Gokujō (craft
      modifier: +5)</p>

      </article>

      </div>

      <p>A dark-leafed herb found only in Kaze province, growing in the shadow of black pines where the mist never fully
      lifts. Used by Gekkō-trained herbalists for alertness tinctures. Bitter, with a sharp aftertaste that clears the
      head.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>The Gekkō clan&#39;s herbalist lineage catalogued this plant extensively — a character with the right contacts
      can learn the formal tincture preparation.</p>

      </section>

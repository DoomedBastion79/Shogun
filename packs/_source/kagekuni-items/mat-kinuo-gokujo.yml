    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Kinuo 絹魚 (Silkfish)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong>
      hunting<br><strong>Preservation:</strong> 1 day fresh; 7 days salted<br><strong>Tools:</strong> Fishing tackle
      with fine line; nets are too coarse<br><strong>Grade:</strong> 極上 Gokujō (craft modifier: +5)</p>

      </article>

      </div>

      <p>Slender, almost translucent fish from cold mountain streams, so pale that they are nearly invisible against a
      sand bottom. The flesh is delicate and silky in texture — the flavour is clean and cold, like the water itself —
      and the smallest overcooking turns them to paper. A test of a fisher-cook&#39;s patience.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>A delicacy of mountain-stream cuisine. Fished with the finest tackle; rough handling destroys the product. Sora
      and upper Kaze are the canonical sources.</p>

      </section>

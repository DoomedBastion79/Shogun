    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Kumo-no-Su Kōji 雲の巣麹 (Cloud Nest Mold)</h4>

      <p><strong>Category:</strong> Chomiryo<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> Must be stored in dry cold; active culture remains viable for
      months<br><strong>Tools:</strong> Herbalism kit (advantage); clean collecting surface; Sora community
      permission<br><strong>Restrictions:</strong> Sora villages guard specific strains; outsider collection without
      permission is theft<br><strong>Grade:</strong> 極上 Gokujō (craft modifier: +5)</p>

      </article>

      </div>

      <p>A beneficial mold culture found growing on grain stores in the high-altitude settlements of Sora, where the
      cold, dry air and altitude produce unique fermentation conditions. The mold is collected and used to inoculate
      rice for a distinctively sharp, clean sake and a fermented seasoning paste with an almost effervescent quality.
      The communities of Kumo-no-Ue guard their specific culture strains carefully.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Social/political obstacle — Sora communities grant strains only as gifts of honour.</p>

      </section>

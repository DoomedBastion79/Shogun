      <div class="fvtt advice">

      <article>

      <h4>Kazan-koshō 火山胡椒 (Volcano Pepper)</h4>

      <p><strong>Category:</strong> Chomiryo<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong> Foraged
      (Saishū)<br><strong>Preservation:</strong> Dried indefinitely; oil extract 6 months<br><strong>Tools:</strong>
      Herbalism kit (advantage); **mildly toxic — alchemy kit to handle safely**<br><strong>Restrictions:</strong>
      Enshiyama is an active volcanic hazard<br><strong>Grade:</strong> 並 Nami (craft modifier: -2)</p>

      </article>

      </div>

      <p>The fruit of a stunted bush that grows in the ash fields surrounding Enshiyama&#39;s crater, where soil
      temperatures remain elevated year-round. The berries are tiny and dark red, and the heat they carry is unlike any
      other pepper — it builds slowly, reaches an almost painful intensity, then subsides into a deep, smoky warmth. Hi
      province alchemists classify it as mildly toxic. Hi province cooks classify anyone who can&#39;t handle it as
      weak.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>**Mild toxicity:** unproficient handlers take 1 poison damage per berry eaten above reasonable dose.</p>

      </section>

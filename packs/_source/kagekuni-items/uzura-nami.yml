      <h4>Uzura 鶉 (Quail)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      Hunted<br><strong>Preservation:</strong> 2 days fresh; 10 days smoked<br><strong>Tools:</strong> Bow, sling, or
      snares; cook's utensils for dressing<br><strong>Grade:</strong> 並 Nami (craft modifier: -2)</p>

      </article>

      </div>

      <p>Small ground-dwelling birds hunted in grasslands, scrub, and the margins of cultivated fields. The meat is
      darker than chicken and carries a slightly mineral sweetness — perfect for a single-skewer meal over a cooking
      fire.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Abundant in grasslands and scrub. Often driven into nets by beaters; rural households maintain standing snare
      lines near paddy margins during harvest season.</p>

      </section>

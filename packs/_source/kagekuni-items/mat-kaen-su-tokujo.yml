      <article>

      <h4>Kaen-su 火炎酢 (Flame Vinegar)</h4>

      <p><strong>Category:</strong> Chomiryo<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> Indefinite in sealed vessel; stable<br><strong>Tools:</strong>
      Herbalism kit or alchemy kit (advantage); heat-resistant collection vessel<br><strong>Grade:</strong> 特上 Tokujō
      (craft modifier: +2)</p>

      </article>

      </div>

      <p>A pungent vinegar produced naturally in thermal pools of Hi province where specific mineral concentrations and
      bacterial colonies create an acidic brine. The liquid is collected from shallow depressions near volcanic vents —
      it tastes of heat, stone, and a sharp acidity that cuts through the richest meat. Cannot be replicated outside its
      volcanic source.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Hi-province-only. Harvesting in active thermal zones may require a Con save on failure.</p>

      </section>

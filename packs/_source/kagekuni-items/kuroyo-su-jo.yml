      <h4>Kuroyō-su 黒曜酢 (Obsidian Vinegar)</h4>

      <p><strong>Category:</strong> Chomiryo<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong> Harvested
      (Saishū)<br><strong>Preservation:</strong> Stable indefinitely<br><strong>Tools:</strong> Alchemy kit (advantage);
      heat-resistant vessel<br><strong>Restrictions:</strong> Obsidian Fields are hazardous
      terrain<br><strong>Grade:</strong> 上 Jō (craft modifier: +0)</p>

      </article>

      </div>

      <p>A naturally occurring acidic mineral brine found seeping through obsidian formations in the Kurosō fields of Hi
      province. The liquid is dark, almost black, and carries a sharp acidity with an underlying smokiness. Alchemists
      use it as a reagent; cooks use it — very sparingly — as a finishing acid that adds complexity no other vinegar can
      match.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Alchemist reagent and finishing acid.</p>

      </section>

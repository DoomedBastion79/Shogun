      <h4>Nameko 滑子 (Amber Cap)</h4>

      <p><strong>Category:</strong> Kinoko<br><strong>Rarity:</strong> Common<br><strong>Source:</strong> Foraged
      (Saishū)<br><strong>Preservation:</strong> Must be cooked or dried within 1 day; dries well; fresh keeps 1–2 days
      only<br><strong>Tools:</strong> Herbalism kit (advantage)<br><strong>Grade:</strong> 並 Nami (craft modifier:
      -2)</p>

      </article>

      </div>

      <p>Small, glossy, button-sized mushrooms found in clusters on decaying wood in damp forests. The caps are coated
      in a natural glaze that gives them a wet-amber sheen even in full sun. The flavor is mild and slightly nutty, and
      the slick texture is prized in soups and stews where it adds body to the broth.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Commonly paired with miso for soup base. Foragers learn them early.</p>

      </section>

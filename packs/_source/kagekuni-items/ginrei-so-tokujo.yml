      <article>

      <h4>Ginrei-sō 銀嶺草 (Silver Spirit Herb)</h4>

      <p><strong>Category:</strong> Yakuso<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong>
      Foraged<br><strong>Preservation:</strong> 7 days fresh; indefinitely dried<br><strong>Tools:</strong> Herbalism
      kit; cook's utensils for proper preparation<br><strong>Grade:</strong> 特上 Tokujō (craft modifier: +2)</p>

      </article>

      </div>

      <p>A frost-white herb that grows at extreme altitude on the Hoshimori Plateau, where it clings to rock faces in
      thin soil that freezes solid every night. The leaves are tough and fibrous — useless raw — but when simmered they
      release a clean, piercingly bright flavour that clears the sinuses and sharpens the mind. Sora&#39;s observatory
      seimasters brew it as a study aid.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Traditional tea of the Hoshimori seimaster community. Three cups is said to keep a man alert through a full
      night of astronomical observation.</p>

      </section>

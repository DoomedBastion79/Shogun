    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Tanishi 田螺 (Paddy Snail)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> 2 days fresh (kept damp); cooked meat 1 day<br><strong>Tools:</strong>
      None; cook's utensils for preparation<br><strong>Grade:</strong> 上 Jō (craft modifier: +0)</p>

      </article>

      </div>

      <p>Dark, palm-sized freshwater snails harvested from rice paddies and slow-moving streams. The meat is earthy,
      chewy, and carries a bitter-green finish that miso and sake soften into something worth eating. A staple of
      peasant cuisine in the rice provinces.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Gathered by hand while wading paddies; must be purged in clean water for a day before cooking. Essential
      ingredient in rural miso-stewed dishes.</p>

      </section>

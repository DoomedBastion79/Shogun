      <h4>Mirin 味醂 (Sweet Rice Wine)</h4>

      <p><strong>Category:</strong> Shushoku<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      harvesting<br><strong>Preservation:</strong> Indefinite in sealed flask<br><strong>Tools:</strong>
      None<br><strong>Grade:</strong> 特上 Tokujō (craft modifier: +2)</p>

      </article>

      </div>

      <p>Sweet rice wine used exclusively for cooking, never for drinking. Mirin produces the characteristic glossy
      glaze on grilled fish and braised meats, and adds a subtle sweetness that refined sugar cannot replicate. Sold in
      small corked flasks in every market town — a small splash is enough to transform a simple glaze into something
      worth remembering.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Glaze essential. Standard upgrade item for dishes.</p>

      </section>

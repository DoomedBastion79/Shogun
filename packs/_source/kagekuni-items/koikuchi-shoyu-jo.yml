      <h4>Koikuchi-shōyu 濃口醤油 (Dark Soy Paste)</h4>

      <p><strong>Category:</strong> Shushoku<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong> Traded
      (aged ferment)<br><strong>Preservation:</strong> Years in sealed wooden cask fragment<br><strong>Tools:</strong>
      None<br><strong>Grade:</strong> 上 Jō (craft modifier: +0)</p>

      </article>

      </div>

      <p>A deeper, more intense soy paste aged longer than common shōyu, with a darker colour and a more complex, almost
      smoky flavour profile. Used as a finishing sauce or in glazes where the depth of flavour matters more than the
      volume applied. Aged at least two years in wooden casks before being drawn off and bottled. A single drop on
      grilled fish shows the difference immediately.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Finishing sauce — used sparingly in refined cooking.</p>

      </section>

      foraging<br><strong>Preservation:</strong> Indefinite; mineral-stable<br><strong>Tools:</strong> Knife or small
      pick; tide knowledge<br><strong>Grade:</strong> 並 Nami (craft modifier: -2)</p>

      </article>

      </div>

      <p>Coarse, grey-blue salt crystals harvested from deep tidal caves along Nami&#39;s coastline, where centuries of
      seawater evaporation have left mineral-rich deposits on cave walls. The flavor is more complex than ordinary sea
      salt — briny, faintly bitter, with a mineral depth that ordinary salt lacks. Nami fishermen consider it essential
      for proper fish curing.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Tide-dependent harvest.</p>

      </section>

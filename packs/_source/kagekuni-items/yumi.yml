  description:
    value: >-
      <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-description"
      data-section="description">Description</h3>

      <p>The great asymmetric longbow of Kagekuni, the yumi stands taller than most warriors and is gripped below its
      center — a design that allows it to be drawn from horseback without catching on the saddle. Bamboo and hardwood
      laminated together under tension give it tremendous power and range. Yumi ashigaru form the ranged backbone of
      every army, and a skilled mounted archer can loose arrows at a full gallop. Mastery of the yumi is considered both
      a martial skill and a spiritual discipline.</p>

      </section>

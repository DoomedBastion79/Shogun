  description:
    value: >-
      <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-description"
      data-section="description">Description</h3>

      <p>An oversized katana with a blade exceeding three feet, the nodachi is a battlefield weapon designed for
      sweeping cuts against cavalry and massed infantry. Too long to draw from a hip scabbard, it is carried slung
      across the back or held ready in both hands. Elite foot soldiers who wield it stride ahead of formations, using
      the blade&#39;s enormous reach to break enemy lines before the yari walls close.</p>

      </section>

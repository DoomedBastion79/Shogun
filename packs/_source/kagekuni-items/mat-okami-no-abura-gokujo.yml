      <h4>Ōkami no Abura 狼の脂 (Mountain God's Rendered Fat)</h4>

      <p><strong>Category:</strong> Shushoku<br><strong>Rarity:</strong> VeryRare<br><strong>Source:</strong>
      one-time-harvest<br><strong>Preservation:</strong> Indefinite if stored cold<br><strong>Tools:</strong> Cook's
      utensils<br><strong>Restrictions:</strong> Single-grade-locked at 極上 Gokujō — no grade variants</p>

      </article>

      </div>

      <p>Thick layers of pale winter fat from beneath the hide, rendered down over a long fire into a clear, amber-gold
      tallow. A spoonful transforms any pan-fry — meat sears faster, vegetables crisp cleaner, and the aroma carries a
      distant suggestion of thunder. Keeps indefinitely if stored cold.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>**One-time harvest.** 6 portions total from the Yama-no-Ōkami harvest. Single-grade-locked at 極上 Gokujō — the
      nat-20 harvest check cleared the Legendary threshold and secured every cut at top grade. Party currently holds the
      full 6 portions. Track usage in campaign-state.md.</p>

      </section>

      <h4>Tanuki-take 狸茸 (Tanuki Mushroom)</h4>

      <p><strong>Category:</strong> Kinoko<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> Dries exceptionally; winter store staple<br><strong>Tools:</strong>
      Herbalism kit (advantage)<br><strong>Grade:</strong> 並 Nami (craft modifier: -2)</p>

      </article>

      </div>

      <p>A squat, round-bodied mushroom with a mottled brown cap found in deciduous forests across Kusa and Hana. Named
      for its resemblance to a sleeping tanuki curled into a ball. The flesh is dense, almost meaty, with a rich umami
      that intensifies when dried. Forest communities in Kusa preserve them in great quantities for winter stores.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Kusa/Hana cultural staple. Cute-name forage — good flavour for rural NPC recommendations.</p>

      </section>

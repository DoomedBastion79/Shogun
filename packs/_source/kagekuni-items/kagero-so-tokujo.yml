      <article>

      <h4>Kagerō-sō 蜻蛉草 (Shimmer Herb)</h4>

      <p><strong>Category:</strong> Yakuso<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong>
      Foraged<br><strong>Preservation:</strong> 5 days fresh; indefinitely dried<br><strong>Tools:</strong> Herbalism
      kit<br><strong>Restrictions:</strong> Narrow geographic range<br><strong>Grade:</strong> 特上 Tokujō (craft
      modifier: +2)</p>

      </article>

      </div>

      <p>A low, ground-hugging herb found along the banks of the Kagerō River in Kaze province, identifiable by the
      faint shimmer on its leaves that mirrors the river&#39;s thermal haze. The leaves have a complex, slightly numbing
      quality that enhances other flavours when used in small amounts. Overuse deadens the palate.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Enhancement, not flavour of its own. A pinch in a broth raises the other ingredients; too much kills the meal
      outright.</p>

      </section>

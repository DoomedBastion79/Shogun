      <p>Found only in perpetually dark environments — deep caves, the interior of the Hollow Peaks, the lightless
      galleries beneath mountain temples. Caps are charcoal-black with a silvery underside. The flavor is deep and
      earthy, almost smoky.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Cave-gathered. May drive forager into trap or hazard terrain.</p>

      </section>

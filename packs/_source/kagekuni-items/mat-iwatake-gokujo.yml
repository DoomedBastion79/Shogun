    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Iwatake 岩茸 (Rock Mushroom)</h4>

      <p><strong>Category:</strong> Kinoko<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> Dries leathery; rehydrates to gelatinous texture; keeps for
      years<br><strong>Tools:</strong> Herbalism kit (advantage); climbing skill strongly
      recommended<br><strong>Grade:</strong> 極上 Gokujō (craft modifier: +5)</p>

      </article>

      </div>

      <p>A flat, lichen-like fungus found clinging to cliff faces and exposed rock in mountain provinces. The texture is
      leathery when dried and gelatinous when rehydrated. The flavor is intensely mineral — almost metallic — and
      complements rich soups and braised dishes. Harvesting requires climbing or reaching into exposed positions.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Harvest should trigger a climbing or athletics check. Injury risk on failure.</p>

      </section>

  description:
    value: >-
      <p>A coin of black iron — the visible token of a Hatchling Mark from the Onyx Brood (Kurokkō). Both faces are
      featureless. The coin is always slightly cooler than its surroundings.</p>


      <h3>Properties</h3>

      <p><strong>Tier:</strong> Hatchling Mark (Tamashi-no-In) — Onyx Brood

      <strong>Attunement:</strong> Yes

      <strong>Activation (1/short rest):</strong> As an action, hold the coin and ask a single yes/no question about a
      creature within 60 ft you have met before. The DM answers truthfully — the coin warms (yes) or cools (no).

      <strong>Cost:</strong> Every fifth question, the brood asks one in return that the bearer must answer truthfully
      aloud. If the bearer refuses or lies, the coin goes inert until restored by service to the brood.

      <strong>Loss:</strong> As Ember Tear — but Onyx Marks linger even after relic loss; the brood may still call in
      the bearer&#39;s debts.</p>


      <section class="secret kg-secret-sealed kg-sealed-campaign" data-kind="campaign" data-label="True Cost">

      <p>Each query the bearer makes is itself a small offering of curiosity to the brood. The brood is studying the
      bearer through the questions they choose to ask. Long-term Whisper Coin use shapes how the brood will eventually
      approach the bearer with larger offers.</p>


      </section>

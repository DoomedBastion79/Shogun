  description:
    value: >
      <p>A coin of warm dawn-gold — the visible token of a Hatchling Mark from the Golden Brood (Kinkkō). Even in
      darkness, the coin glows with the soft warmth of early sunrise.</p>

      <p><strong>Tier:</strong> Hatchling Mark (Tamashi-no-In) — Golden Brood

      <strong>Attunement:</strong> Yes

      <strong>Activation (1/long rest):</strong> As an action, hold the coin overhead. It sheds bright light in a 30-ft
      radius and dim light for an additional 30 ft for 10 minutes. While within the bright light, undead and aberrations
      have disadvantage on attack rolls against you and your allies. The light cannot be dispelled by darkness magic of
      4th level or lower.

      <strong>Loss:</strong> As Ember-Tear. The Golden Brood does not lightly replace lost Sun-Coins; the bearer may
      have to demonstrate continued worthiness.</p>

      <p>A hand-crafted finishing salt produced in a single coastal village in Mizu, where an elderly matriarch and her
      apprentices evaporate seawater in shallow pans and sculpt each crystal by hand. Every grain is a perfect flake,
      with a subtle, almost floral brininess. Used as a finishing salt in the kitchens of noble households and the
      finest Heian restaurants. The matriarch reputedly turns away any buyer she deems unworthy of the craft.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>**Social gate.** Matriarch vets buyers — RP hook.


      ---


      **極上 Gokujō — Very Rare**</p>

      </section>

      <h4>Hoshi-tōfu 干し豆腐 (Dried Tofu)</h4>

      <p><strong>Category:</strong> Shushoku<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      harvesting<br><strong>Preservation:</strong> Dry months; freeze-dried Sora blocks keep a
      year<br><strong>Tools:</strong> None<br><strong>Grade:</strong> 並 Nami (craft modifier: -2)</p>

      </article>


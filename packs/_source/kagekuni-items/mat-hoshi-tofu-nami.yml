      <p>Firm blocks of soybean curd dried in the open air, or freeze-dried in the mountain winters of Sora.
      Reconstitutes in broth to a spongy, flavour-absorbing texture. Favoured by travelling monks and mountain pilgrims
      as a lightweight protein that carries no moral weight, and by lowland travellers for its sheer practicality.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Monk traveler food. No moral weight.</p>

      </section>

      <div class="fvtt advice">

      <article>

      <h4>Kasumi-sō 霞草 (Mist Herb)</h4>

      <p><strong>Category:</strong> Yakuso<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> 5 days fresh; indefinitely dried<br><strong>Tools:</strong> Herbalism
      kit<br><strong>Restrictions:</strong> Concentrated in Kaze fog zones<br><strong>Grade:</strong> 並 Nami (craft
      modifier: -2)</p>

      </article>

      </div>

      <p>Found only in the dense fog banks of Kaze province&#39;s deepest valleys, where visibility drops to arm&#39;s
      length and sound arrives from the wrong direction. The herb is identifiable by scent alone — a sharp green
      fragrance that cuts through the ambient dampness. Used in cooking, it produces a heightened clarity of taste in
      other ingredients, as though the fog around one&#39;s senses had been lifted.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Finding it at all requires a Wisdom (Perception) check or equivalent — disadvantage if the character is relying
      on sight.


      ---


      **Very Rare**</p>

      </section>

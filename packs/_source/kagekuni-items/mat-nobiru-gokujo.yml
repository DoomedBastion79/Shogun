      <p>Slender wild garlic bulbs pulled from grasslands and the margins of the Emperor&#39;s Highway. A sharp, clean
      bite — stronger than cultivated garlic, cleaner than shallot. Eaten raw in the mountain provinces, pickled in the
      lowlands.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>The scent deters certain insects — travelers sometimes hang bundles at the edge of camp as a mild
      repellent.</p>

      </section>

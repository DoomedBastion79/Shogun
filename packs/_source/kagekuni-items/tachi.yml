  description:
    value: >
      <p>An older style of curved sword predating the katana, the tachi is worn edge-down suspended from the belt — a
      carry style suited to drawing while mounted. Its deeper curve generates sweeping cuts ideal for slashing down from
      horseback. Traditionalist samurai families still carry tachi as a mark of ancient lineage, and the weapon remains
      popular among cavalry officers who value its draw-and-cut fluidity.</p>

      <h4>Maitake 舞茸 (Hen of the Woods)</h4>

      <p><strong>Category:</strong> Kinoko<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> Dries very well; trimmings keep on the road<br><strong>Tools:</strong>
      Herbalism kit (advantage); knife for cleaning<br><strong>Grade:</strong> 上 Jō (craft modifier: +0)</p>

      </article>

      </div>

      <p>Large, ruffled clusters found at the base of old oak and chestnut trees, growing in tiered layers that can
      weigh several pounds each. The flavour is earthy and deep with a subtle peppery finish. Prized in autumn cooking —
      a single find can feed a party twice over, and the dried trimmings keep well on the road. Considered a lucky
      discovery by foragers.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>A &quot;lucky find&quot; narrative callout — reward for thorough autumn foraging.</p>

      </section>

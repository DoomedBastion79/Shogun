      <p><strong>Category:</strong> Shushoku<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      harvesting<br><strong>Preservation:</strong> Sealed flask keeps months; improves with age up to a
      point<br><strong>Tools:</strong> None<br><strong>Grade:</strong> 並 Nami (craft modifier: -2)</p>

      </article>

      </div>

      <p>Rice wine sold in small ceramic or bamboo flasks for travel. Drunk cold in summer and warm in winter, sake is
      also a cornerstone of cooking — a splash in broth, a rinse for fish, a glaze for grilled meat. Common grades are
      cheap and functional; named breweries command meaningful premiums. Every traveller carries at least a small flask,
      if only for the warming sip after a hard day&#39;s walk.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Social lubricant, cooking ingredient, warming agent.</p>

      </section>

      <article>

      <h4>Arashi-suji 嵐筋 (Storm-Sinew)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong>
      one-time-harvest<br><strong>Preservation:</strong> 2 days fresh; 14 days dried<br><strong>Tools:</strong> Cook's
      utensils (slow-braise preparation)<br><strong>Restrictions:</strong> One-time only</p>

      </article>

      </div>

      <p>Long tendons drawn from the legs and spine. Under the right light they carry a faint static shimmer — a residue
      of the creature&#39;s connection to the high mountain storms. Slow-braised into broth they impart a tension to the
      muscles of those who drink it, a wound-tight readiness that lingers into the following day. Suitable for a Refined
      dish.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>The &quot;readiness&quot; is a mechanical buff granted by a Refined dish prepared with Arashi-suji — bonus to
      initiative or first-action advantage for the following day depending on cook&#39;s preparation. Confirm buff
      wording against the recipe system when Phase 4 lands.</p>

      </section>

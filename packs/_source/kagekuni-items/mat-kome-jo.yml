    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Kome 米 (Rice)</h4>

      <p><strong>Category:</strong> Shushoku<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      harvesting<br><strong>Preservation:</strong> Keeps months in dry cloth; years if properly stored in sealed
      containers<br><strong>Tools:</strong> None<br><strong>Grade:</strong> 上 Jō (craft modifier: +0)</p>

      </article>

      </div>

      <p>The foundation of nearly every meal in Kagekuni. White polished rice is carried by all travellers in small
      cloth bags and purchased in any settlement. Peasant households stretch it with brown rice or mixed grains; samurai
      eat it white. Quality varies subtly by province — Tsuchi rice is said to be the finest for daily eating, while
      Kusa&#39;s slightly sweeter grain is favoured for festival dishes. A traveller without kome in their pack is a
      traveller who expects hospitality.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>The default staple. Never run out of this in a market town.</p>

      </section>

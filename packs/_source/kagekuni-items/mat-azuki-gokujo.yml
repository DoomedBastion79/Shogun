      <p>Small, dark red beans sold by the handful or in larger cloth bags. Boiled into porridge for autumn mornings,
      sweetened for festival confections, or cooked with mochigome for ceremonial red rice. A peasant staple throughout
      the agricultural provinces — cheap, filling, and keeping indefinitely. The dark soup made from them carries
      ceremonial significance at certain seasonal observances.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Festival / ceremonial item.</p>


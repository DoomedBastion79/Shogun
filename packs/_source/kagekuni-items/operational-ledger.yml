  description:
    value: >
      <p>The operational ledger of Ōryūzan Tenkū-ji&#39;s network hub, kept by the head priest. Each significant entry
      records a complete operational cycle: distress signal received, acknowledgement authorized and sent, dispatch
      ordered, field report on findings. The entries the head priest considered significant were treated with
      sei-lacquer in the order&#39;s foundational technique and remain fully readable. The rest, in ordinary ink, have
      faded past use. Which entries were preserved is itself information about what the head priest considered to
      matter. The fall-period entries — the distress signals from Kaze and Sora at the fall of 13088 — are absent from
      the record entirely. The collapse overtook the record-keeping.</p>

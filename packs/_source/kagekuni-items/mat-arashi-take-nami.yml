    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Arashi-take 嵐茸 (Storm Cap)</h4>

      <p><strong>Category:</strong> Kinoko<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> Withers within a day of picking; must be consumed or preserved
      immediately; dried fragments retain a faint tingle<br><strong>Tools:</strong> Herbalism kit (advantage); storm
      tracking<br><strong>Restrictions:</strong> Only appears for 12–24 hours after a severe
      storm<br><strong>Grade:</strong> 並 Nami (craft modifier: -2)</p>

      </article>

      </div>

      <p>Found only on exposed surfaces after severe storms — typically on shattered tree trunks or freshly exposed rock
      faces in Nami province. The caps appear within hours of a major storm and wither within a day. They are electric
      blue with branching white patterns on the cap that resemble lightning. The flavor is sharp, almost astringent,
      with a tingling quality on the tongue.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Opportunistic — only harvestable after storms. Nami coastal specialty.</p>

      </section>

    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Takenoko 筍 (Bamboo Shoot)</h4>

      <p><strong>Category:</strong> Yakuso<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> 3 days fresh; indefinitely pickled<br><strong>Tools:</strong> Herbalism
      kit; simple blade; cook's utensils for preparation<br><strong>Grade:</strong> 極上 Gokujō (craft modifier: +5)</p>

      </article>

      </div>

      <p>Young bamboo shoots harvested in spring from the edges of bamboo groves. Must be boiled to remove bitterness
      before eating. The tender inner flesh is crisp, mildly sweet, and absorbs flavour from whatever it is cooked with.
      Abundant wherever bamboo grows — which is most of lowland Hokori.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>A spring staple in Hana, Kusa, Mizu, and Tsuchi. The short season is a real constraint — a party arriving in
      summer finds far fewer available.</p>

      </section>

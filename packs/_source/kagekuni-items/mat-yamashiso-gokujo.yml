      </article>

      </div>

      <p>Aromatic broad-leafed herb with purple-green leaves — the wild cousin of the cultivated perilla found in every
      village garden. Used fresh as a garnish, dried as a seasoning, or steeped as a mildly stimulating tea. A handful
      wraps around a rice ball perfectly.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Grows nearly everywhere in Hokori&#39;s forested provinces. One of the first herbs a village child learns to
      recognise.</p>

      </section>

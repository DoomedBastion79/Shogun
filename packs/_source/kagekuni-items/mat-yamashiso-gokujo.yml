      <h4>Yamashiso 山紫蘇 (Mountain Perilla)</h4>

      <p><strong>Category:</strong> Yakuso<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> 3 days fresh; indefinitely dried<br><strong>Tools:</strong> Herbalism

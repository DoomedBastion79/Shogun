    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Kōri-iwana 氷岩魚 (Ice Char)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong>
      Hunted<br><strong>Preservation:</strong> 1 day fresh; indefinitely frozen in mountain
      cold<br><strong>Tools:</strong> Ice-fishing tackle; a spear through a cut hole works as
      well<br><strong>Grade:</strong> 極上 Gokujō (craft modifier: +5)</p>

      </article>

      </div>

      <p>A winter variant of the mountain char, caught only through the ice of frozen Kōri-no-Mori streams and
      high-altitude lakes. The flesh is pale pink verging on white, with a concentrated, almost sweet flavour that no
      warm-water fish can match. Traditionally sliced thin and served raw when fresh — the cold water produces a
      cleanliness no cooking could improve upon.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>The peak catch of mountain winter fishing. Traditional Kōri-no-Mori villages have an entire ritual vocabulary
      around ice-char fishing that predates the formal Shinto calendar.


      ---


      **Very Rare**</p>

      </section>

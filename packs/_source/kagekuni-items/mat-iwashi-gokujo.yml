      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      hunting<br><strong>Preservation:</strong> 1 day fresh; 30 days salted; indefinitely
      dried<br><strong>Tools:</strong> Nets; fishing tackle for rod-and-line work<br><strong>Grade:</strong> 極上 Gokujō
      (craft modifier: +5)</p>

      </article>

      </div>

      <p>Small silver ocean fish that run in vast schools along Hokori&#39;s coasts. The flesh is oily and
      strong-flavoured — hated by some, beloved by others. Grilled on a metal plate over coals until the skin crisps and
      the bones soften, they are the humble backbone of coastal Mizu and Nami kitchens.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>The anchor ingredient of coastal peasant cuisine. A good haul from a beach-seine can yield enough to feed a
      village and leave a surplus for drying.</p>

      </section>

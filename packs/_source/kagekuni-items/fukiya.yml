  description:
    value: >
      <p>A slender bamboo tube roughly three feet long, the fukiya launches tiny darts with a sharp breath. Nearly
      silent and easily disguised as a flute or walking stick, it is the preferred weapon for delivering poison at range
      without alerting guards. Hunters use them for small game; agents of the Order of the Black Lily use them for
      targets that must not know they are being attacked until the poison takes hold.</p>

      <article>

      <h4>Tsuchi-miso 土味噌 (Earth Miso)</h4>

      <p><strong>Category:</strong> Chomiryo<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> Stable months in clay vessel<br><strong>Tools:</strong> Herbalism kit
      (advantage); **local guidance essential**<br><strong>Restrictions:</strong> Not all deposits are safe; requires
      local knowledge to identify non-toxic strains<br><strong>Grade:</strong> 上 Jō (craft modifier: +0)</p>

      </article>

      </div>

      <p>A wild fermented paste found in clay deposits near certain hot springs in Hi and Tsuchi provinces, where soil
      bacteria and mineral content produce a natural fermentation in accumulated organic matter. The result is a dark,
      intensely savory paste — rougher than manufactured miso, but with a depth that cultured products cannot match. Not
      all deposits are safe to eat — local knowledge is essential.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>**Risk flag:** failed identification may yield toxic batch (Con save, poisoned condition for 1 hour).</p>

      </section>

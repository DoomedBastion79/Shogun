      <p>Pale, almost transparent crystal deposits found in caverns near the Silver Dragon&#39;s associated sites. The
      crystals are cold to the touch regardless of ambient temperature and dissolve with a clean, bright flavor followed
      by a cooling sensation that lingers. Used in dishes meant to counteract heat or fever, or simply as a finishing
      seasoning of extraordinary refinement.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Ginryū connection. Used in heat-cooling medicinal dishes.</p>


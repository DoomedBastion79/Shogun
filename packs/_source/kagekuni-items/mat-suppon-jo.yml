    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Suppon 鼈 (Soft-shell Turtle)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong>
      hunting<br><strong>Preservation:</strong> Must be kept alive until cooking; prepared meat keeps 2
      days<br><strong>Tools:</strong> Traps, spear; cook's utensils essential (dangerous
      bite)<br><strong>Grade:</strong> 上 Jō (craft modifier: +0)</p>

      </article>

      </div>

      <p>The flesh of Hokori&#39;s soft-shell turtles, prized in medicinal cuisine as a restorative for those who have
      overspent their strength. Slow-simmered in a clear broth with ginger and sake, the meat yields a mineral depth and
      a texture somewhere between fish and fowl. Considered a serious meal — not a casual one.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Sold live in markets across the rice provinces. Traditionally prepared for a recovering patient or a warrior
      before a duel. The bite is genuinely dangerous — handling without care risks a serious wound.</p>

      </section>

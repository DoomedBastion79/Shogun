  description:
    value: >
      <p>One of four lunar armatures from Ōryūzan Tenkū-ji&#39;s orrery — a single delicate jointed brass arm,
      calibrated to one of the four lunar periods. The arm&#39;s far end terminates in a small mounting cradle that
      seats a lunar projection lens; the arm itself is the structure that affixes the moon to the orrery&#39;s stellar
      drive. It does not carry the moon; it places it. The four arms together reproduce the lunar sky as the
      temple&#39;s makers understood it.</p>

      <p>Originally stored in the Scriptorium of Ōryūzan Tenkū-ji, sealed away when the order fell. The full set of four
      is required to fully repair the orrery&#39;s lunar function.</p>

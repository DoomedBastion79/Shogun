  description:
    value: >
      <p>A spiked iron club — the togekanabo takes the basic kanabo design and adds protruding steel spikes that punch
      through armor on impact. Where a smooth club bruises and breaks, the spiked variant pierces and tears. Anti-armor
      specialists carry them to counter heavily armored samurai and foreign plate-wearers, trading the broad crushing
      surface for concentrated penetrating force.</p>

      <article>

      <h4>Ayu 鮎 (Sweetfish)</h4>

      <p><strong>Category:</strong> Niku<br><strong>Rarity:</strong> Common<br><strong>Source:</strong>
      Hunted<br><strong>Preservation:</strong> 1 day fresh; 7 days salted; indefinitely dried<br><strong>Tools:</strong>
      Fishing tackle, cormorant (traditional), or bare hands<br><strong>Grade:</strong> 並 Nami (craft modifier: -2)</p>

      </article>

      </div>

      <p>Slender river fish prized for the distinctive cucumber-melon scent of their flesh in the height of summer.
      Grilled whole on a split-bamboo skewer over charcoal, salted simply, the belly fat melts and the skin crisps. The
      single most perfect expression of a summer river in Hokori.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>The quintessential summer river fish. Tradition holds the very best ayu come from the upper Kinryūgawa in late
      Natsu. A master fisher can catch them bare-handed in shallow riffles; most use tackle or traditional cormorant
      fishing.</p>

      </section>

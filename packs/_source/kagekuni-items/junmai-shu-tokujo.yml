      <article>

      <h4>Junmai-shu 純米酒 (Pure-Rice Sake)</h4>

      <p><strong>Category:</strong> Shushoku<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong> Traded
      (brewed, named)<br><strong>Preservation:</strong> Months sealed; improves with short
      aging<br><strong>Tools:</strong> None<br><strong>Grade:</strong> 特上 Tokujō (craft modifier: +2)</p>

      </article>

      </div>

      <p>Premium sake brewed exclusively from rice, water, and kōji — no added distillate. Clean, bright, and deeply
      aromatic, with subtle variations between breweries. Named producers in Hana and Tsuchi mark their flasks with clan
      seals. Junmai-shu drinks well and cooks better, and a splash in a glaze can transform a competent dish into a
      memorable one. Merchants in Heian specifically stock it for noble clients.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Upscale noble item. Grade represents brewery prestige.</p>

      </section>

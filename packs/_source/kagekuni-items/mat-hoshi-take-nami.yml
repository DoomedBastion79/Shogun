    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Hoshi-take 星茸 (Star Cap)</h4>

      <p><strong>Category:</strong> Kinoko<br><strong>Rarity:</strong> VeryRare<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> Withers by dawn; no reliable preservation method
      known<br><strong>Tools:</strong> Herbalism kit (advantage); astronomical knowledge; seimaster
      guidance<br><strong>Restrictions:</strong> Appears only during rare triple-star alignments over the Hoshimori
      Plateau<br><strong>Grade:</strong> 並 Nami (craft modifier: -2)</p>

      </article>

      </div>

      <p>A tiny, brilliantly luminescent mushroom found on the Hoshimori Plateau during specific stellar alignments. The
      caps are no larger than a thumbnail and glow with a light that shifts through the spectrum — gold, blue, red,
      violet — mirroring the three-star system overhead. They appear in clusters and vanish by dawn. The taste is
      indescribable. Seimasters at Hoshimori have attempted to study them for decades without satisfactory results.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>**Astronomical event-gated.** Tie to the Ryushinki alignment or lesser conjunctions. Possible plot-hook
      material for Hoshimori seimaster quests.</p>

      </section>

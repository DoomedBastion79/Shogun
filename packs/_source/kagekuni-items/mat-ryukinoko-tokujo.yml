      <div class="fvtt advice">

      <article>

      <h4>Ryūkinoko 竜茸 (Dragon Fungus)</h4>

      <p><strong>Category:</strong> Kinoko<br><strong>Rarity:</strong> VeryRare<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> Fresh 7 days; dries well but loses the shifting flavour; sei charge
      persists<br><strong>Tools:</strong> Herbalism kit (advantage); sei-sense required to distinguish from deadly
      mimic<br><strong>Restrictions:</strong> Only grows directly beneath a slumbering
      Progenitor<br><strong>Grade:</strong> 特上 Tokujō (craft modifier: +2)</p>

      </article>

      </div>

      <p>A large, golden-capped mushroom found only in caverns directly beneath Progenitor resting sites. The cap is
      warm to the touch and radiates a faint light in darkness. The flesh carries a flavor that shifts with each bite —
      savory, then sweet, then something that sits between warmth and music. Those who eat it describe a sensation of
      profound calm.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>**Progenitor-gated.** Only accessible via dragon-slumber caverns. Sei-active; acts as a minor restoration
      effect when consumed by DM discretion.</p>

      </section>

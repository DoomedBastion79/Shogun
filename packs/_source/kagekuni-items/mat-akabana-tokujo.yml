    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Akabana 紅花 (Crimson Bloom)</h4>

      <p><strong>Category:</strong> Yakuso<br><strong>Rarity:</strong> Rare<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> 7 days fresh; indefinitely dried<br><strong>Tools:</strong> Herbalism
      kit; heat-resistant gloves<br><strong>Grade:</strong> 特上 Tokujō (craft modifier: +2)</p>

      </article>

      </div>

      <p>A heat-loving flower found growing in volcanic ash near active vents in Hi province. The petals are a vivid
      crimson that deepens to black at the edges. When dried and crumbled into food, they produce a slow, building
      warmth that starts in the chest and spreads to the extremities. Hi province healers use them to treat exposure and
      hypothermia.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>A genuine cold-weather remedy — the warmth is mechanical, not flavour. Hi province healers carry dried petals
      on any winter expedition into Sora or Kōri-no-Mori.</p>

      </section>

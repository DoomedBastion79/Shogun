      <h4>Seidōrin no Shio 青銅林の塩 (Bronze Wood Salt)</h4>

      <p><strong>Category:</strong> Chomiryo<br><strong>Rarity:</strong> Uncommon<br><strong>Source:</strong> Foraged
      (Saishū) — **licensed access only**<br><strong>Preservation:</strong> Indefinite;
      mineral-stable<br><strong>Tools:</strong> Herbalism kit (advantage); clan
      license<br><strong>Restrictions:</strong> **Unlicensed harvesting is technically a capital
      offense.**<br><strong>Grade:</strong> 並 Nami (craft modifier: -2)</p>

      </article>

      </div>

      <p>Mineral salt collected from crystalline deposits at the base of bronze-barked trees in the Seidōrin Mori. Has a
      faintly metallic, almost sweet quality that enhances the flavor of game meats. Collection requires a clan license
      — unlicensed harvesting is technically a capital offense.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>**Legal risk.** Party caught harvesting without license faces noble consequences. Good story lever for Hana
      politics.</p>

      </section>

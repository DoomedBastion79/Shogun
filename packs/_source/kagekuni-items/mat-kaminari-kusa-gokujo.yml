  description:
    value: >-
      <div class="fvtt advice">

      <article>

      <h4>Kaminari-kusa 雷草 (Thunder Herb)</h4>

      <p><strong>Category:</strong> Yakuso<br><strong>Rarity:</strong> VeryRare<br><strong>Source:</strong>
      foraging<br><strong>Preservation:</strong> 1 day fresh; 14 days carefully dried<br><strong>Tools:</strong>
      Herbalism kit; storm survival<br><strong>Restrictions:</strong> Must be harvested during active thunderstorm on
      exposed ridgeline — dangerous<br><strong>Grade:</strong> 極上 Gokujō (craft modifier: +5)</p>

      </article>

      </div>

      <p>Found only during active thunderstorms on exposed ridgelines — the herb appears to sprout from bare rock in the
      minutes following a lightning strike and withers within the hour. The leaves crackle faintly when touched and
      carry a sharp, ozone-like scent. Harvesting requires being on an exposed ridgeline during a thunderstorm, which is
      exactly as dangerous as it sounds.</p>

      <section class="secret">

      <h4>DM Notes</h4>

      <p>Harvesting is a scene, not a roll. If a character attempts it during an actual storm, require a saving throw
      against a lightning strike (DC 15 Dexterity, 4d10 lightning on failure) before they can even make the forage
      check.


      ---</p>

      </section>

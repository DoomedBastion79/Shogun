        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-appearance"
        data-section="appearance">Appearance</h3>

        <p>Long flowing silver hair; pale skin; emerald green eyes; intricate nature motif tattoos on arms.</p>

        <h3 id="kg-public-role" data-section="public-role">Public Role</h3>

        <p>Former Guardian of the Order of the Sacred Grove. Dead under mysterious circumstances. Appears to Relc as a
        spirit — guiding visions that direct Relc&#39;s journey.</p>

        <h3 id="kg-personality" data-section="personality">Personality</h3>

        <p>Unknown in life beyond what Relc and Sato Hideaki remember — a mentor, a protector, someone who prepared
        carefully for his own death.</p>

        <h3 id="kg-relationship-to-party" data-section="relationship-to-party">Relationship to Party</h3>

        <p>Relc&#39;s mentor and predecessor as Guardian. Appointed Relc as next Guardian via a posthumous letter. Left
        a cipher poem pointing to hidden knowledge (Warden&#39;s Wisdom). His spirit appears to Relc at key moments —
        the next expected vision is at the gold doors or shortly after entering the Temple of Kinryū (Solas in the grove
        above Kōriwara, hand on a specific stone, dawn light from the east).</p>

        <h3 id="kg-true-nature" data-section="true-nature">True Nature</h3>

        <p>His death was not natural or accidental. He was killed by someone with either significantly superior
        capability or intimate familiarity — someone he trusted and did not guard against. This points to either a very
        powerful practitioner or someone inside the Order of the Sacred Grove or the Ancient Guard itself.</p>

        <h3 id="kg-connections" data-section="connections">Connections</h3>

        <p>Connected to Hideaki Sato (mid-rank Sacred Grove member) and Benkei (Ancient Guard). His death has
        compromised the Ancient Guard.</p>

        <h3 id="kg-quest-seeds" data-section="quest-seeds">Quest Seeds</h3>

        <div class="kg-quest-seed" data-kind="quest-seed"><span class="kg-quest-seed__label">QUEST SEED</span> The
        cipher poem (three stones, still water, rising sun, phoenix fern glade) leads to the Warden&#39;s Wisdom —
        protected knowledge about the living dragons. One of the three stones is in Kōriwara&#39;s sacred grove.

        <strong>[QUEST SEED]</strong> Investigating Solas&#39;s killer — the killer was motivated by hunting the
        locations of the Progenitors (the living founding dragons); they knew Solas was connected to protected knowledge
        about the dragons and targeted him for it.</div>




        <h3 id="kg-campaign-secrets" data-section="campaign-secrets">Campaign Secrets</h3>

        <p>Member of the Order of the Ancient Guard. The Ancient Guard protects knowledge about the living dragons — the
        campaign&#39;s deepest secret.</p>

        <p>Solas&#39;s killer was motivated by hunting the locations of the Progenitors (the living founding dragons).
        The killer knew Solas was connected to protected knowledge about the dragons and targeted him for it. Further
        identity and method TBD, but the motive is locked.</p>

        <p>The Warden&#39;s Wisdom — the destination of the cipher poem — is protected knowledge about the living
        dragons held by the Order of the Sacred Grove for safekeeping. Its specific content and the destination location
        are yet to be determined but connect to the Ancient Guard or living dragons arc.</p>

        <p>Sato Hideaki knows Solas was Ancient Guard (not just Sacred Grove). He knows the category of entity capable
        of killing Solas but not the specific identity.</p>

        <h3 id="kg-plot-threads" data-section="plot-threads">Plot Threads</h3>

        <ul>

        <li>Relc&#39;s personal quest — the cipher poem and Warden&#39;s Wisdom</li>

        <li>Solas&#39;s murder investigation — connected to the living dragons secret</li>

        <li>Order of the Ancient Guard — his death has compromised the order</li>

        <li>Spirit visions — ongoing guidance for Relc</li>

        <li>The Progenitor hunt — whoever killed Solas is still looking for dragon locations</li>

        </ul>


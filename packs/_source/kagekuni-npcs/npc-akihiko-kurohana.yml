        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-appearance"
        data-section="appearance">Appearance</h3>

        <p>Black scales with a glossy sheen; glowing red eyes; intricate dragon tattoos on his back.</p>

        <h3 id="kg-public-role" data-section="public-role">Public Role</h3>

        <p>Daimyo and supreme leader of Clan Kurohana, one of the three independent clans. Commands significant military
        resources and political influence. Issued the Imperial Seal of the Kurohana Clan calling upon the independent
        Kaminari Clan to investigate the Gekkō Clan&#39;s unexplained silence.</p>

        <h3 id="kg-personality" data-section="personality">Personality</h3>

        <p>Stern, commanding; values loyalty and discipline; enjoys battle and strategy; unforgiving of betrayal.</p>

        <h3 id="kg-relationship-to-party" data-section="relationship-to-party">Relationship to Party</h3>

        <p>Indirect. The party carries the Imperial Seal of the Kurohana Clan, issued by Lord Kurohana Tatsuya on behalf
        of the clan. The seal requests assistance investigating Gekkō Clan&#39;s silence. Both independent clans
        (Kurohana and Kaminari) are invested in the Gekkō situation — Gekkō is the third independent clan.</p>

        <h3 id="kg-campaign-secrets" data-section="campaign-secrets">Campaign Secrets</h3>

        <p>The convergence of both independent clan daimyo independently doubting the official assassination narrative
        is politically explosive. If this alignment became public, it would fundamentally shift the political
        landscape.</p>

        <h3 id="kg-plot-threads" data-section="plot-threads">Plot Threads</h3>

        <ul>

        <li>Emperor&#39;s assassination investigation — active; truth unknown</li>

        <li>Connection to Dian Wei&#39;s personal arc</li>

        <li>Gekkō investigation — initiated the cross-clan seal requesting cooperation</li>

        <li>Succession crisis implications</li>

        </ul>


        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-appearance"
        data-section="appearance">Appearance</h3>

        <p>Gold scales; bright blue eyes.</p>

        <h3 id="kg-public-role" data-section="public-role">Public Role</h3>

        <p>Captain of the Guard in Kikyo, operating from the Kikyo Guard Compound. Maintains a small but highly capable
        force; primary duties are licensing enforcement and forest protection for the Seidōrin Mori (Bronze Wood
        Forest). Building an informant network in Kikyo.</p>

        <h3 id="kg-personality" data-section="personality">Personality</h3>

        <p>Stoic, disciplined; fierce loyalty; strong sense of justice.</p>

        <h3 id="kg-relationship-to-party" data-section="relationship-to-party">Relationship to Party</h3>

        <p>Arrested Ko&#39;jiri in Kikyo before the situation was resolved by Ren Nakamura&#39;s offer of the Summons
        and Conditional Pardon. Their initial interaction was adversarial but professional. Can become a staunch ally to
        those who prove their integrity.</p>


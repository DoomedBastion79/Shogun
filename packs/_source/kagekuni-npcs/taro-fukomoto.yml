        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-appearance"
        data-section="appearance">Appearance</h3>

        <p>Over 6 feet tall; broad shoulders; muscular; tanned weathered skin; thick black beard flecked with silver;
        dark intense eyes; leather apron; flame and mythical creature tattoos on arms.</p>

        <h3 id="kg-public-role" data-section="public-role">Public Role</h3>

        <p>Owner and master smith of Taro&#39;s Forge in the Kurogane-sho (Steel Precinct) district of Heian. The
        district&#39;s most prestigious establishment. Renowned for both quality and integrity. Produces weapons and
        armor of exceptional craftsmanship; maintains a small stock for immediate sale and takes commissions that can
        take months to complete.</p>

        <h3 id="kg-personality" data-section="personality">Personality</h3>

        <p>Renowned for skill AND integrity; approachable; booming laugh; willing to share knowledge with apprentices;
        balances strength with artistry.</p>

        <h3 id="kg-relationship-to-party" data-section="relationship-to-party">Relationship to Party</h3>

        <p>No direct contact established. His forge is the most notable establishment in the Kurogane-sho district that
        the party has access to in Heian.</p>


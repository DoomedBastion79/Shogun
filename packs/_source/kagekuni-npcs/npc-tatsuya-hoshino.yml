        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-appearance"
        data-section="appearance">Appearance</h3>

        <p>Black hair; tanned; brown eyes; dragon tattoo winding around left arm.</p>

        <h3 id="kg-public-role" data-section="public-role">Public Role</h3>

        <p>Samurai of Clan Hoshino, a respected vassal family of Clan Kurohana known for martial excellence and loyalty.
        Issued the Imperial Seal of the Kurohana Clan on behalf of the clan, calling upon Clan Kaminari to investigate
        the Gekkō silence.</p>

        <h3 id="kg-personality" data-section="personality">Personality</h3>

        <p>Calm, disciplined, authoritative; values honor and duty; little patience for treachery.</p>

        <h3 id="kg-relationship-to-party" data-section="relationship-to-party">Relationship to Party</h3>

        <p>The party carries the Imperial Seal he issued on behalf of Clan Kurohana.</p>


        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-appearance"
        data-section="appearance">Appearance</h3>

        <p>Dark hair streaked with gray in topknot; tanned; deep brown eyes.</p>

        <h3 id="kg-public-role" data-section="public-role">Public Role</h3>

        <p>Taisho (General) of Clan Kaminari and Commissioner of Special Operations. Commands from the Tensho no Mon
        (Military District) in Heian. Assigned the party their current mission to investigate the Gekkō Clan&#39;s
        silence. The party reports directly to him.</p>

        <h3 id="kg-personality" data-section="personality">Personality</h3>

        <p>Exceptionally intelligent, strategic; values order and discipline; stern but fair; appreciates historical
        battles and traditional music.</p>

        <h3 id="kg-relationship-to-party" data-section="relationship-to-party">Relationship to Party</h3>

        <p>Direct handler. Assigned the party their mission at the Tensho no Mon district in Heian. Sun Wukong&#39;s
        mandate from the Tranquil Lotus specifically names Hideo as the reporting authority. The party met him alongside
        Arinori Senzai during their mission briefing.</p>

        </section>


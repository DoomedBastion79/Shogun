        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-appearance"
        data-section="appearance">Appearance</h3>

        <p>Dark hair streaked with gray in topknot; tanned; deep brown eyes.</p>

        <h3 id="kg-public-role" data-section="public-role">Public Role</h3>

        <p>Taisho (General) of Clan Kaminari and Commissioner of Special Operations. Commands from the Tensho no Mon
        (Military District) in Heian. Assigned the party their current mission to investigate the Gekkō Clan&#39;s
        silence. The party reports directly to him.</p>

        <h3 id="kg-personality" data-section="personality">Personality</h3>

        <p>Exceptionally intelligent, strategic; values order and discipline; stern but fair; appreciates historical
        battles and traditional music.</p>

        <h3 id="kg-relationship-to-party" data-section="relationship-to-party">Relationship to Party</h3>

        <p>Direct handler. Assigned the party their mission at the Tensho no Mon district in Heian. Sun Wukong&#39;s
        mandate from the Tranquil Lotus specifically names Hideo as the reporting authority. The party met him alongside
        Arinori Senzai during their mission briefing.</p>

        <h3 id="kg-true-nature" data-section="true-nature">True Nature</h3>

        <p>Investigating a traitor within his own ranks. He has narrowed the leak to a small circle of senior staff. He
        may ask the party to carry out intelligence work he cannot assign to his own staff — the request would be framed
        neutrally but suggests he suspects someone close.</p>

        <h3 id="kg-connections" data-section="connections">Connections</h3>

        <p>Commands the special operations apparatus of Clan Kaminari. His intelligence resources are significant but
        compromised by the presence of the traitor he is hunting.</p>

        <h3 id="kg-quest-seeds" data-section="quest-seeds">Quest Seeds</h3>

        <div class="kg-quest-seed" data-kind="quest-seed"><span class="kg-quest-seed__label">QUEST SEED</span> Hideo
        asks the party to carry out intelligence work he cannot assign to his own staff — the request is framed
        neutrally but suggests he suspects someone close.

        <strong>[QUEST SEED]</strong> The political debriefing when the party reports back is a significant social
        encounter with real stakes — Hideo needs deniability; the party has information that could destabilize three
        clans.</div>




        <h3 id="kg-campaign-secrets" data-section="campaign-secrets">Campaign Secrets</h3>

        <p>The traitor Hideo is hunting is his own brother, Hiroshi Nakamura, the Shugo of Heian. Hideo does not yet
        know this. He will, in time, develop evidence pointing toward Hiroshi. The question is whether he reaches that
        conclusion before Hiroshi learns how close Hideo is and takes action.</p>

        <h3 id="kg-plot-threads" data-section="plot-threads">Plot Threads</h3>

        <ul>

        <li>Traitor investigation — active; Hideo is unaware the traitor is Hiroshi</li>

        <li>Party mission handler — debriefing scenes carry significant political weight</li>

        <li>Brother relationship with Hiroshi — the eventual revelation will be devastating</li>

        <li>Connection to the broader succession crisis and Genso Alliance through Hiroshi&#39;s conspiracy</li>

        </ul>

        </section>


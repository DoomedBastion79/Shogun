        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-appearance"
        data-section="appearance">Appearance</h3>

        <p>Long silver hair; piercing green eyes; kimono with leaf and vine patterns.</p>

        <h3 id="kg-public-role" data-section="public-role">Public Role</h3>

        <p>Hyōrō Bugyō (Provisions Commissioner) of Clan Kaminari. Responsible for logistics, supply chains, and
        resource management across the clan&#39;s operations. Present alongside Hideo Nakamura when the party received
        their mission briefing at the Tensho no Mon district.</p>

        <h3 id="kg-personality" data-section="personality">Personality</h3>

        <p>Exceptionally intelligent, organized, calm, authoritative; values order and efficiency; compassionate beneath
        stern exterior; integrity and fairness renowned.</p>

        <h3 id="kg-relationship-to-party" data-section="relationship-to-party">Relationship to Party</h3>

        <p>Present at mission briefing in Tensho no Mon. Met the party alongside Taisho Hideo Nakamura.</p>


        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-appearance"
        data-section="appearance">Appearance</h3>

        <p>Not described in detail.</p>

        <h3 id="kg-public-role" data-section="public-role">Public Role</h3>

        <p>Leader of Takamine, a mining village of 97 people sitting in the shadow of Kinryūzan (Gold Dragon Mountain)
        at the head of the Star River. The small iron mine sustains the village with modest yields. The community is
        close-knit in the way that difficult circumstances produce.</p>

        <h3 id="kg-personality" data-section="personality">Personality</h3>

        <p>Not described in detail beyond pragmatic leadership of a poor but proud community.</p>

        <h3 id="kg-relationship-to-party" data-section="relationship-to-party">Relationship to Party</h3>

        <p>No contact established.</p>

        <h3 id="kg-true-nature" data-section="true-nature">True Nature</h3>

        <p>Has quietly sent a sample of an unusual dark lustrous metal found in the deeper mine face to Heian for
        identification, but the political vacuum has slowed the response. The material doesn&#39;t rust, is harder than
        anything the village smith has worked with, and holds an exceptional edge. He is trying to get information
        before events overtake him.</p>

        <p>The village is too poor and too politically isolated to defend a valuable find. Kenji would respond warmly to
        trustworthy outsiders who could help him understand what his mine has found.</p>

        <p>The material is a trace deposit of an alloy associated with Onyx Dragon Clan presence — sei-conductive,
        uniquely suited for tools and weapons. The vein is small but its properties are significant. Volcanic subsurface
        mineral migrations carried it far from its origin point.</p>

        </section>


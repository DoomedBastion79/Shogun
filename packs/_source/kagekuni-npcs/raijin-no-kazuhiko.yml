        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-appearance"
        data-section="appearance">Appearance</h3>

        <p>Black hair with silver streaks.</p>

        <h3 id="kg-public-role" data-section="public-role">Public Role</h3>

        <p>Daimyo and supreme leader of Clan Kaminari, the dominant clan governing the province of Hana and the imperial
        capital of Heian. Commands one of the most powerful military and political structures in Kagekuni.</p>

        <h3 id="kg-personality" data-section="personality">Personality</h3>

        <p>Stern, commanding; values loyalty; enjoys battle, thunder, and strategy; strict code of honor.</p>

        <h3 id="kg-relationship-to-party" data-section="relationship-to-party">Relationship to Party</h3>

        <p>No direct contact. The party operates under the authority of his clan through Taisho Hideo Nakamura. Dian Wei
        received sealed orders from Daimyo Kazuhiko (Kurohana) — note that both independent clan daimyo share the
        Kazuhiko name, which can cause confusion.</p>

        </section>


_id: jpu5eUKGNucILGdI
_key: '!macros!jpu5eUKGNucILGdI'
name: Scene Perception Check
type: script
author: null
img: icons/svg/eye.svg
scope: global
command: >-
  // Scene Perception Check — Kagekuni
  //
  // Triggers a group Perception check for all selected tokens.
  // Uses Epic Rolls 5e if available; falls back to standard rolls.
  // Reads optional scene flags for DC and discovery text.

  const tokens = canvas.tokens.controlled;

  if (tokens.length === 0) {
    ui.notifications.warn("Select tokens first.");
    return;
  }

  const actors = tokens.map(t => t.actor).filter(Boolean);

  // Read scene-configured DC or use default
  const sceneCheck = canvas.scene.getFlag("assistant", "entryCheck") || {};
  const dc = sceneCheck.dc || 14;
  const skill = sceneCheck.skill || "per";
  const description = sceneCheck.description || "";

  // Epic Rolls 5e integration (graceful fallback)
  if (ui.EpicRolls5e) {
    const results = await ui.EpicRolls5e.requestRoll({
      actors,
      type: skill,
      options: { DC: dc, showDC: false }
    });

    if (results.canceled) return;

    // Process results — whisper discoveries to successful players
    for (const r of results.results) {
      const passed = r.value >= dc;
      const user = game.users.find(u => u.character?.id === r.actor.id);
      const content = passed
        ? `<p><strong>${r.actor.name}</strong> (${r.value}) notices something${description ? ": " + description : "..."}</p>`
        : `<p><strong>${r.actor.name}</strong> (${r.value}) notices nothing unusual.</p>`;

      ChatMessage.create({
        content,
        speaker: { alias: "Kagekuni" },
        whisper: user ? [user.id] : [game.user.id],
      });
    }
  } else {
    // Standard fallback — request individual rolls
    for (const actor of actors) {
      await actor.rollSkill(skill, { targetValue: dc });
    }
  }
folder: null
sort: 0
ownership:
  default: 0
flags:
  assistant:
    slug: scene-perception
    description: Group Perception check with Epic Rolls 5e support. Configure DC via scene flags.

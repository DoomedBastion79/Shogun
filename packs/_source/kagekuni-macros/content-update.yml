_key: '!macros!AF2xl6R0L1rJF0ti'
name: Kagekuni Content Update
type: script
author: null
img: icons/svg/book.svg
scope: global
command: >-
  // Kagekuni Content Update Macro
  //
  // Reimports all Kagekuni compendium packs into the current world.
  // Run this after installing a new module release to update all
  // journal entries, NPCs, items, and other compendium content.
  //
  // What it does:
  //   1. Iterates all packs registered by the assistant module
  //   2. For each pack, clears existing world documents from that source
  //   3. Imports fresh copies from the compendium
  //   4. Reports results in chat

  const MODULE_ID = "assistant";
  const module = game.modules.get(MODULE_ID);

  if (!module?.active) {
    ui.notifications.error("Kagekuni Assistant module is not active.");
    return;
  }

  if (!game.user.isGM) {
    ui.notifications.warn("Only the GM can run content updates.");
    return;
  }

  const packs = module.packs;
  const results = [];
  let totalImported = 0;

  ui.notifications.info("Kagekuni: Starting content update...");

  for (const packInfo of packs) {
    const packId = `${MODULE_ID}.${packInfo.name}`;
    const pack = game.packs.get(packId);
    if (!pack) {
      results.push(`⚠ Pack "${packInfo.name}" not found`);
      continue;
    }

    try {
      // Get the pack index
      const index = await pack.getIndex();
      const count = index.size;

      // Import all documents from the compendium
      const docs = await pack.getDocuments();

      // Get the world collection for this document type
      const collection = game[pack.documentName === "JournalEntry" ? "journal"
        : pack.documentName === "Actor" ? "actors"
        : pack.documentName === "Item" ? "items"
        : pack.documentName === "Macro" ? "macros"
        : null];

      if (!collection) {
        results.push(`⚠ No collection for type "${pack.documentName}"`);
        continue;
      }

      // Delete existing documents sourced from this pack
      const existing = collection.filter(d =>
        d.flags?.core?.sourceId?.startsWith(`Compendium.${packId}`)
      );
      if (existing.length > 0) {
        await collection.documentClass.deleteDocuments(
          existing.map(d => d.id),
          { noHook: true }
        );
      }

      // Import from compendium
      for (const doc of docs) {
        try {
          await collection.importFromCompendium(pack, doc.id, {}, { keepId: true });
          totalImported++;
        } catch (e) {
          // Individual import failures are non-fatal
          console.warn(`Kagekuni: Failed to import ${doc.name}: ${e.message}`);
        }
      }

      results.push(`✓ ${packInfo.label}: ${count} documents`);
    } catch (err) {
      results.push(`✗ ${packInfo.label}: ${err.message}`);
    }
  }

  // Report to chat
  const html = [
    `<h3>Kagekuni Content Update</h3>`,
    `<p>Imported <strong>${totalImported}</strong> documents from ${packs.length} compendium packs.</p>`,
    `<ul>${results.map(r => `<li>${r}</li>`).join("")}</ul>`,
  ].join("");

  ChatMessage.create({
    content: html,
    speaker: { alias: "Kagekuni Assistant" },
    whisper: [game.user.id],
  });

  ui.notifications.info(`Kagekuni: Content update complete — ${totalImported} documents imported.`);
folder: null
sort: 0
ownership:
  default: 0
flags:
  assistant:
    slug: content-update
    description: Reimport all Kagekuni compendium packs into the current world

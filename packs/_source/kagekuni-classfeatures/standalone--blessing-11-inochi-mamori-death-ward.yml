  description:
    value: >-
      <p><strong>命の守り Inochi no Mamori</strong> — <em>Guardian of Life</em></p>

      <p><strong>Effect:</strong> Death Ward</p>

      <p><strong>Duration:</strong> 8 hours.</p>

      <p><strong>Source:</strong> Kinryū no Megumi blessing table — Grand Hall restorative pools, Ōryūzan Tenkū-ji.</p>

      <hr/>

      <p><em>命の守り — Guardian of Life.</em> The Death Ward spell. The first time you would drop to 0 HP while the
      blessing is active, you instead drop to 1 HP and the blessing ends. If reduced to 0 HP outright by an
      instant-death effect, the blessing prevents that effect once. (Tracking is narrative — disable this effect
      manually when triggered.)</p>

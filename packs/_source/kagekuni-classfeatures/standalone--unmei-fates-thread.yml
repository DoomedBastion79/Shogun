  description:
    value: |
      <p><em>Every mortal is born with a length of thread woven by the
      Progenitor of Chance. How long it runs, none may say — but while it
      holds, fate may yet be bent.</em></p>
      <p>You gain a <strong>Luck Pool</strong> tracked in the secondary
      resource slot, with a maximum of <strong>100 Luck Points</strong>.</p>
      <ul>
        <li><strong>Roll Luck</strong> — use the 運 Roll Luck macro to add
          1d4+1 points to your pool (up to the maximum).</li>
        <li><strong>Spend Luck</strong> — use the 運 Spend Luck macro to
          burn points for a bonus on any d20 roll.</li>
        <li><strong>Recovery</strong> — Luck does not refresh on rest.
          Points accumulate only through the Roll Luck macro, a GM
          ruling, or narrative milestones.</li>
      </ul>
      <p>The GM may raise, lower, or reset your thread as the story
      demands; what the fates give, they may take back.</p>

    value: >-
      <p><strong>庇護の間 Hogo no Ma</strong> — <em>Space of Protection</em></p>

      <p><strong>Effect:</strong> Sanctuary</p>

      <p><strong>Duration:</strong> 8 hours.</p>

      <p><strong>Source:</strong> Kinryū no Megumi blessing table — Grand Hall restorative pools, Ōryūzan Tenkū-ji.</p>

      <hr/>

      <p><em>庇護の間 — Space of Protection.</em> The Sanctuary spell. Any creature targeting you with an attack or harmful
      spell must first make a Wisdom save (DC 14 + your Charisma modifier, or DM's call). On a failed save the creature
      must choose a new target or lose the attack/spell. Effect ends if you attack, deal damage, or cast a harmful
      spell. (Tracked narratively — apply at DM ruling.)</p>

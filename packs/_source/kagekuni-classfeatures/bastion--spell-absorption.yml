  description:
    value: >-
      <p>As a reaction when an enemy you can see within 60 ft casts a spell, you can absorb it. The absorbed spell's
      levels are distributed among your empty spell slots. You may make an Arcana check against the caster's DC to
      identify the spell first. Range increases to 120 ft at 12th level and 180 ft at 16th level.</p>

      <p><strong>Overload Pool:</strong> Spell levels that cannot fit into empty slots go into an</p>

      <p>overload pool. Using overload magic to cast costs 1d6 max HP per overload level used (not mitigable; restored
      on long rest).</p>

      <p><strong>Mass Discharge:</strong> At end of your turn, if overload is not empty, the raw</p>

      <p>magic discharges: 1d10 psychic per overload point to yourself, and every creature within 15 ft makes an INT
      save (DC 12 + overload points) for half.</p>

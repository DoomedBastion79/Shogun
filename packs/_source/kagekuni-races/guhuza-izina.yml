      <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-description"
      data-section="description">Description</h3>

      <p>The Guhuza are the ape-folk of Seizan: tall, fur-covered humanoids who walk upright,

      speak the old tongues, and live remarkably long lives by human reckoning. In Kagekuni

      they are most often encountered as monks, scholars, and forest-wardens, though the

      two subraces — the burly <strong>Kwita</strong> and the lithe, tailed <strong>Izina</strong> — carry very

      different bearings. Their native speech cannot be written in Common script, so Guhuza

      who travel beyond Seizan typically adopt a name from the language of their hosts.</p>

      <p>Guhuza are a setting-native race in Kagekuni (see <code>core/races.md</code>). Elder Benkei of

      the Order of the Tranquil Lotus is 198 years old, establishing longevity as a canon

      trait — Guhuza mature between ages 10 and 14 but may live for centuries.</p>

      <h3 id="kg-racial-traits-summary" data-section="racial-traits-summary">Racial Traits Summary</h3>

      <ul>

      <li><strong>Ability Score Increase:</strong> Intelligence +2 (plus subrace modifier)</li>

      <li><strong>Age:</strong> mature at 10–14; long-lived</li>

      <li><strong>Size:</strong> Medium (roughly human-sized; Kwita tend larger, Izina smaller)</li>

      <li><strong>Speed:</strong> 30 ft walking</li>

      <li><strong>Darkvision:</strong> 60 ft</li>

      <li><strong>Adept Learner:</strong> proficiency with two artisan&#39;s tools of your choice</li>

      <li><strong>Languages:</strong> Common plus two languages of your choice</li>

      <li><strong>Subrace:</strong> choose Kwita or Izina</li>

      </ul>

      <h4 id="kg-kwita-great-ape-lineage" data-section="kwita-great-ape-lineage">Kwita (great-ape lineage)</h4>

      <ul>

      <li><strong>Ability Score Increase:</strong> Strength +1</li>

      <li><strong>Thunderwave (innate):</strong> cast the <em lang="ja-Latn">thunderwave</em> spell once per short/long
      rest;

      Intelligence is the spellcasting ability</li>

      <li><strong>Great Build:</strong> proficient in Athletics and Intimidation</li>

      </ul>

      <h4 id="kg-izina-tailed-monkey-lineage" data-section="izina-tailed-monkey-lineage">Izina (tailed-monkey
      lineage)</h4>

      <ul>

      <li><strong>Ability Score Increase:</strong> Dexterity +1</li>

      <li><strong>Agile:</strong> advantage on Dex (Acrobatics) checks to escape a grapple</li>

      <li><strong>Prehensile Tail:</strong> proficient in Acrobatics</li>

      <li><strong>Nimble Climbers:</strong> climbing speed equal to walking speed</li>

      </ul>

      </section>

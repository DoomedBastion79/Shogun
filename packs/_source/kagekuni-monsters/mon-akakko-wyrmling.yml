  details:
    biography:
      value: >
        <p>A young Crimson Brood dragon, no larger than a wolf but already burning with the volcanic temperament of its
        parent line. Glossy black scales rim along the back with red-orange ridges that glow brighter when the wyrmling
        is excited or angered. Its breath smells of struck flint.</p>

        <h3>Behavior</h3>

        <p>Bold, easily provoked, easily impressed. Akakkō wyrmlings will challenge anything they think they can defeat
        — and they think they can defeat almost anything. They respect demonstrations of strength and despise
        hesitation.</p>

        <h3>As a Bonded Companion</h3>

        <p>When granted as a Wyrmling Bond (Tomo-no-Chigiri), use the Warrior sidekick template (Tasha&#39;s). The
        wyrmling levels with its bonded PC, gaining sidekick class features in addition to the base stat block.</p>
      public: ''

  details:
    biography:
      value: >
        <p>A young Emerald Brood dragon — stocky, four-legged, antlers just sprouting like a yearling stag&#39;s. Scales
        already overgrowing with moss along the back. Eyes deep amber and slit-pupiled like a goat&#39;s. The wyrmling
        smells faintly of forest floor and warm rain.</p>

        <h3>Behavior</h3>

        <p>Patient beyond its years. Midokkō wyrmlings rarely act in haste; they prefer to observe, to tend small living
        things, to wait. When pressed, they fight defensively rather than aggressively.</p>

        <h3>As a Bonded Companion</h3>

        <p>When granted as a Wyrmling Bond, use the Spellcaster sidekick template (Tasha&#39;s). Midokkō companions
        favor druidic and healing magic and refuse to enter cities for more than a day at a time.</p>

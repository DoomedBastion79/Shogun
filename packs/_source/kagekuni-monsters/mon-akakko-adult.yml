  details:
    biography:
      value: >
        <p>An adult of the Crimson Brood — long-bodied, serpentine, with stub wings used more for balance and
        intimidation than sustained flight. Twenty feet from snout to tail and burning hot enough to set dry wood
        smoldering at ten paces. Eyes that emit ember-orange light into pitch darkness.</p>

        <h3>Tactics</h3>

        <p>Akakkō adults open with intimidation and demands; if those fail, they prefer melee — claws, jaws, and the
        heat of their own bodies. They will use Cinderbreath against grouped enemies but waste it disdainfully against
        single targets unless cornered. They fight to the death when challenged on hospitality grounds; they retreat
        readily if the fight has become merely tactical.</p>

        <h3>Lair Actions</h3>

        <p>On initiative count 20 (losing ties), the dragon takes a lair action. The dragon cannot use the same lair
        action two rounds in a row.</p>

        <ul>

        <li><strong>Magma Surge.</strong> A 10-ft-radius column of molten rock erupts from the floor at a point the
        dragon can see within 120 ft. Each creature in the column makes a DC 15 Dexterity save, taking 18 (4d8) fire
        damage on a failure or half on a success. The space becomes difficult terrain (cooling magma) until the start of
        the dragon&#39;s next turn.</li>

        <li><strong>Heat Distortion.</strong> The air within 60 ft of the dragon shimmers; ranged weapon attack rolls
        against the dragon are made at disadvantage until initiative count 20 of the next round.</li>

        <li><strong>Volcanic Tremor.</strong> Each creature on the ground within the lair makes a DC 14 Strength save or
        falls prone.</li>

        </ul>

        <h3>Regional Effects</h3>

        <p>The region within 6 miles of an Akakkō lair shows the dragon&#39;s influence:</p>

        <ul>

        <li>The air is uncomfortably warm; ambient temperature runs 10°F above natural baseline.</li>

        <li>Open flames burn brighter and consume fuel half as fast.</li>

        <li>Once per day, a creature that finishes a long rest within 1 mile of the lair must succeed on a DC 13
        Constitution save or gain no benefit from the rest, troubled by ember-dreams.</li>

        </ul>

        <p>If the dragon is killed or driven away, these effects fade over the following 1d10 days.</p>

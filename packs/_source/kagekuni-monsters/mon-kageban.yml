  details:
    biography:
      value: >-
        <p>A Kageban — Shadow Sentinel — is a restless undead bound to serve as a guardian or spy. Unlike mindless
        undead, kageban retain cunning intelligence and can employ magic to deceive and destroy. They appear as gaunt,
        shadowy humanoid figures with hollow eyes that glow with dim spectral light.</p>

        <h3>Behavior</h3>

        <p>Kageban are tactical combatants that use Disguise Self to infiltrate, Fear to scatter groups, and their Life
        Drain to weaken isolated targets. They often serve more powerful undead or necromancers as lieutenants.</p>


        <section class="secret kg-secret-discoverable">

        <p><strong>Creation</strong></p>

        <p><em>discoverable</em></p>

        <p>A kageban is created when a warlock or sorcerer dies while bound by a pact to an entity of shadow or death.
        The pact energy sustains the corpse beyond death, creating an intelligent undead that retains fragments of its
        magical ability.</p>


        </section>

  - _id: sbKfwe4o7e7zufUQ
    name: Life Drain
    type: weapon
    system:
      description:
        value: >-
          <section class="secret">

          <p><em><strong></strong> Melee Weapon Attack:</em> +4 to hit, reach 5 ft., one creature. <em>Hit:</em> [[/damage 1d8 + @mod type=necrotic average=true]] damage. The target must succeed on a
          [[/save con 13 format=long]], or its hit point maximum is reduced by an amount equal to the damage taken. This reduction lasts until the target finishes a long rest. The target dies if its
          hit point maximum is reduced to 0.</p><p>A &amp;Reference[humanoid]{Humanoid} slain by this attack rises 24 hours later as a zombie (see the <em><a
          href="https://www.dndbeyond.com/sources/mm">Monster Manual</a></em>) under the deathlock’s control, unless the &amp;Reference[humanoid]{Humanoid} is restored to life or its body is
          destroyed. The deathlock can have no more than twelve zombies under its control at one time.</p>

          </section>

          The [[lookup @name]] attacks with its [[lookup @item.name]].

  details:
    biography:
      value: >
        <p>An adult of the Onyx Brood — thirty feet of segmented, centipede-like dragon with two great wings folded
        close. Eyeless. Voiceless in the air. Yet the air around the dragon hums with whispers in twenty different
        languages, all of them just below the threshold of comprehension.</p>

        <h3>Tactics</h3>

        <p>Kurokkō adults rarely fight in the open. They negotiate first, and their negotiations are sincere — but they
        have read every hesitation and every secret in the petitioner&#39;s mind before the petitioner finishes
        speaking. If combat is forced, they fight to disable rather than kill, preferring captives to corpses. Captives
        can pay debts.</p>

        <h3>Lair Actions</h3>

        <p>On initiative count 20 (losing ties):</p>

        <ul>

        <li><strong>Whisper-Web.</strong> Each creature within the lair must make a DC 16 Wisdom save or have its mind
        brushed by the dragon&#39;s awareness; on a failure, the dragon learns one true thing about the creature it did
        not previously know.</li>

        <li><strong>Shadow Lance.</strong> A line of cold darkness 60 ft long, 5 ft wide stabs from a point the dragon
        can see. Each creature in the line makes a DC 16 Dexterity save, taking 27 (6d8) necrotic damage on a failure or
        half on a success.</li>

        <li><strong>Step Through Shadow.</strong> The dragon teleports up to 60 ft to any unoccupied space in dim light
        or darkness.</li>

        </ul>

        <h3>Regional Effects</h3>

        <p>Within 6 miles of a Kurokkō lair:</p>

        <ul>

        <li>Secrets weigh heavier. Creatures attempting to deceive others have disadvantage on Charisma (Deception)
        checks.</li>

        <li>Lights gutter unpredictably; torches and candles burn at half their normal duration.</li>

        <li>The dragon learns the name and one true memory of any creature that sleeps within 1 mile.</li>

        </ul>

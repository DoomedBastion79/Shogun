  details:
    biography:
      value: >
        <p>A Nagaji soldier who has been cast out, fled their post, or outlived the unit they served. Nagaji rōnin are
        rarer than their human counterparts — the hive-minded discipline of Nagaji culture makes desertion both rare and
        deeply shameful — but they exist at the margins of the Nagaji presence in the mountains, often more dangerous
        than rank-and-file because they have learned to survive without the support of a squad.</p>

        <h3>Tactics</h3>

        <p>A Nagaji rōnin fights alone and knows it. It uses Cunning Parry to absorb incoming hits and targets the most
        dangerous opponent first. Unlike standard Nagaji, it will retreat if the odds turn sharply — survival instinct
        replaces formation discipline.</p>
      public: ''

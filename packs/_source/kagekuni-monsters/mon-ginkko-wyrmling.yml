  details:
    biography:
      value: >
        <p>A young Silver Brood dragon — slender, long-tailed, with a second smaller pair of wings trailing like
        ribbons. Scales liquid silver that already shows pinpoint reflections of constellations no longer visible from
        the present sky. Eyes the color of the moon&#39;s seas. The wyrmling leaves no footprints on snow.</p>

        <h3>Behavior</h3>

        <p>Distant. Contemplative. Genuinely uninterested in mortal politics. Ginkkō wyrmlings observe far more than
        they engage and tend to speak only when asked direct questions.</p>

        <h3>As a Bonded Companion</h3>

        <p>When granted as a Wyrmling Bond, use the Spellcaster sidekick template (Tasha&#39;s). Ginkkō companions favor
        divinatory and cold magic. They speak rarely and never about themselves.</p>

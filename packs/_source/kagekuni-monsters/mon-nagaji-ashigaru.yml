  details:
    biography:
      value: >-
        <p>The lowest rank of nagaji warrior, ashigaru are expendable foot soldiers bred in great numbers. They fight
        with simple spears and shortbows, relying on overwhelming numbers rather than individual skill. Their serpentine
        features are less pronounced than higher-caste nagaji — flatter faces, duller scales, smaller builds.</p>

        <h3>Tactics</h3>

        <p>Ashigaru fight as minions — individually fragile but dangerous in groups. A single blow fells one, but a
        dozen more fill the gap. They are disciplined enough to hold formation and follow orders from higher-ranked
        nagaji.</p>


        <section class="secret kg-secret-discoverable">

        <p><strong>Hierarchy</strong></p>

        <p><em>discoverable</em></p>

        <p>Ashigaru are the product of selective breeding by nagaji priesthoods, optimized for obedience and numbers
        over individual strength. They occupy the lowest rung of nagaji society, serving as expendable labor and cannon
        fodder.</p>


        </section>
      public: ''

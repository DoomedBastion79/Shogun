  details:
    biography:
      value: >-
        <p>Nagaji kannushi are high priests of the serpent deity, commanding powerful divine magic alongside martial
        skill. They see through magical darkness with Devil&#39;s Sight, resist necrotic energy, and wield devastating
        spells including Cone of Cold and Spirit Guardians. A kannushi typically leads a nagaji force of dozens.</p>

        <h3>Tactics</h3>

        <p>Kannushi open with area spells — Spirit Guardians for sustained damage, Fear to break morale, Cone of Cold
        for burst damage. They use Hold Person to neutralize dangerous threats and Shield of Faith on their bushi
        bodyguards. In melee they are competent but prefer to direct from behind the front line.</p>

        <h3>Spells</h3>

        <p>Sacred Flame, Thaumaturgy, Command, Inflict Wounds, Shield of Faith, Hold Person, Spiritual Weapon, Spirit
        Guardians, Fear, Cone of Cold</p>


        <section class="secret kg-secret-discoverable">

        <p><strong>Role</strong></p>

        <p><em>discoverable</em></p>

        <p>Kannushi interpret the will of the serpent deity and direct nagaji communities. They are both spiritual
        leaders and military commanders, wielding authority through divine mandate and raw magical power.</p>


        </section>

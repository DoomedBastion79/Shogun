          have the &amp;Reference[frightened apply=false] condition for the duration.</p><p>A Frightened creature takes
          the &amp;Reference[dash] action and moves away from you by the safest route on each of its turns unless there
          is nowhere to move. If the creature ends its turn in a space where it doesn't have line of sight to you, the

  details:
    biography:
      value: >-
        <p>Nagaji hohei — infantry — are a step above ashigaru, equipped with better armor and trained to fight in
        coordinated pairs. Their scales show more vivid coloring, marking them as a higher breed. They wield spears and
        shortbows with disciplined precision.</p>

        <h3>Tactics</h3>

        <p>Hohei fight with multiattack capability, striking twice per round. They form the backbone of nagaji warbands,
        providing reliable melee and ranged pressure while ashigaru absorb initial casualties.</p>


        <section class="secret kg-secret-sealed">

        <p><strong>Role</strong></p>

        <p><em>undefined</em></p>

        <p>Hohei serve as the standard garrison force of nagaji strongholds. Where ashigaru are expendable, hohei are
        trusted with guard duty, patrol routes, and holding key positions during battle.</p>


        </section>

  details:
    biography:
      value: >-
        <p>Nagaji sōhei are warrior-monks who blend martial prowess with limited divine magic granted by their serpent
        deity. They fight with unarmed strikes and spears, their movements unnaturally fluid. Sōhei serve as enforcers,
        squad leaders, and temple guardians.</p>

        <h3>Tactics</h3>

        <p>Sōhei combine melee multiattack with support spells — Command to disrupt enemies and Shield of Faith to
        bolster allies. They are faster than standard humanoids, moving with serpentine grace.</p>

        <h3>Spells</h3>

        <p>Sacred Flame, Thaumaturgy, Command, Shield of Faith</p>


        <section class="secret kg-secret-discoverable">

        <p><strong>Role</strong></p>

        <p><em>discoverable</em></p>

        <p>Sōhei undergo rigorous training in nagaji monasteries, learning to channel divine sei through martial forms.
        They answer to kannushi priests and serve as the bridge between the warrior and priestly castes.</p>


        </section>
      public: ''

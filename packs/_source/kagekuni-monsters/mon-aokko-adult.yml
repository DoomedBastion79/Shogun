  details:
    biography:
      value: >
        <p>An adult of the Azure Brood — twenty-five feet of eel-bodied serpent with broad sail-fins running from head
        to tail, capable of swimming faster than any sailing vessel and gliding above the waves on storm-winds. Long
        whiskers like a carp; eyes like banked lightning.</p>

        <h3>Tactics</h3>

        <p>Aokkō adults prefer to engage from range, calling lightning from above while submerged out of reach. They use
        the Sea-Reading reaction to redirect attacks into water, where they take half damage. They retreat into deep
        water when bloodied and rarely fight to the death — long memory makes them patient.</p>

        <h3>Lair Actions</h3>

        <p>On initiative count 20 (losing ties), the dragon takes a lair action.</p>

        <ul>

        <li><strong>Drowning Surge.</strong> A 20-ft cube of seawater erupts at a point within 120 ft. Each creature in
        the cube makes a DC 15 Strength save or is restrained and unable to breathe air until the start of the
        dragon&#39;s next turn.</li>

        <li><strong>Storm-Call.</strong> Lightning strikes a point within 120 ft. Each creature within 5 ft makes a DC
        15 Dexterity save, taking 22 (4d10) lightning damage on a failure or half on a success.</li>

        <li><strong>Tide Pull.</strong> Each creature within 60 ft of the dragon must make a DC 14 Strength save or be
        pulled 20 ft toward the dragon.</li>

        </ul>

        <h3>Regional Effects</h3>

        <p>Within 6 miles of an Aokkō lair:</p>

        <ul>

        <li>Fog rolls in unbidden during the dragon&#39;s waking hours, regardless of weather.</li>

        <li>Tides run an hour off the lunar pattern.</li>

        <li>Drowning creatures within 1 mile die slower than they should — a small mercy or a deliberate cruelty,
        depending on the dragon&#39;s mood.</li>

        </ul>

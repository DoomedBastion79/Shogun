  details:
    biography:
      value: >-
        <p>A translucent spectral figure wreathed in cold fury, the Uragiri no Onryō — the Specter of Betrayal — is the
        restless spirit of one who died by treachery. It drifts through walls and solid matter, its touch draining the
        very life from the living.</p>

        <h3>Behavior</h3>

        <p>These vengeful spirits haunt the places where they were betrayed, lashing out at any living creature that
        enters their domain. They are weakened by sunlight but nearly impossible to harm with mundane weapons.</p>


        <section class="secret kg-secret-discoverable">

        <p><strong>Origin</strong></p>

        <p><em>discoverable</em></p>

        <p>An onryō forms when someone dies with overwhelming feelings of betrayal — a samurai murdered by a trusted
        retainer, a spouse poisoned by their partner, a merchant cheated unto death. The intensity of the betrayal
        determines the spirit&#39;s power.</p>


        </section>

        <section class="secret kg-secret-discoverable">

        <p><strong>Weakness</strong></p>

        <p><em>discoverable</em></p>

        <p>An onryō can sometimes be put to rest by exposing and punishing the one who betrayed them, or by performing
        the proper funeral rites that were denied.</p>


        </section>

  details:
    biography:
      value: >
        <p>A young Azure Brood dragon — eel-like, sail-finned, the length of a tall man head to tail. Scales the color
        of dawn over a calm sea, fading to mother-of-pearl on the belly. The wyrmling drips constantly when out of
        water, leaving small puddles that smell of salt.</p>

        <h3>Behavior</h3>

        <p>Watchful, distant, slow to acknowledge a stranger. Aokkō wyrmlings observe long before they engage, and they
        remember every kindness and every cruelty.</p>

        <h3>As a Bonded Companion</h3>

        <p>When granted as a Wyrmling Bond, use the Expert sidekick template (Tasha&#39;s). Aokkō companions excel at
        scouting, perception, and oceanic navigation.</p>

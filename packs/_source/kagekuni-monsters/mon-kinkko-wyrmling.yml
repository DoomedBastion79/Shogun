  details:
    biography:
      value: >
        <p>A young Golden Brood dragon — already classically draconic in shape, four legs, broad wings, a sweeping tail.
        The wyrmling&#39;s scales are warm gold, the color of dawn light rather than coin-metal. Eyes the color of
        polished amber. Even at this age, the wyrmling carries itself with deliberate dignity.</p>

        <h3>Behavior</h3>

        <p>Just, careful, slow to commit. Kinkkō wyrmlings refuse instructions they consider dishonorable and are not
        impressed by displays of power that lack purpose. They will leave a bonded PC who orders the murder of a
        non-combatant.</p>

        <h3>As a Bonded Companion</h3>

        <p>When granted as a Wyrmling Bond, use the Warrior sidekick template (Tasha&#39;s). Kinkkō wyrmlings are
        observably brighter than ordinary creatures and cannot be hidden indefinitely.</p>

  details:
    biography:
      value: >-
        <p>Nagaji bushi are elite warriors clad in enchanted chain mail, wielding katanas and longbows with lethal
        precision. Their scales are thick and iridescent, a mark of superior breeding. Bushi serve as champions,
        bodyguards to priests, and commanders of lesser nagaji forces.</p>

        <h3>Tactics</h3>

        <p>Bushi are straightforward but devastating combatants — high AC from magical armor, strong multiattack with
        katanas, and longbow capability at range. They anchor nagaji battle lines and are often the most dangerous
        individual opponent in a nagaji warband.</p>


        <section class="secret kg-secret-sealed">

        <p><strong>Status</strong></p>

        <p><em>undefined</em></p>

        <p>Bushi hold honored positions in nagaji society, second only to the priestly caste. They are bred for strength
        and resilience, and many bear ritual scarification marking their kills and achievements.</p>


        </section>
      public: ''

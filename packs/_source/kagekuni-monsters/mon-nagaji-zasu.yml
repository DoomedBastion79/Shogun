  details:
    biography:
      value: >-
        <p>The nagaji zasu — high priest — is a monstrous serpentine being that has transcended its humanoid origins
        through dark pact magic. Unlike the divine kannushi, the zasu draws power from a patron entity, granting it
        Magic Resistance, Devil&#39;s Sight, and the ability to put entire groups to sleep with Merrshaulk&#39;s
        Slumber.</p>

        <h3>Tactics</h3>

        <p>The zasu opens with Merrshaulk&#39;s Slumber to incapacitate multiple targets, then uses Spectral Fangs at
        range or closes for a devastating triple Bite attack that delivers piercing and poison damage. It uses
        Suggestion and Hold Person to control dangerous opponents.</p>

        <h3>Spells</h3>

        <p>Animal Friendship (snakes only), Guidance, Mage Hand, Message, Suggestion, Hold Person, Invisibility</p>


        <section class="secret kg-secret-sealed">

        <p><strong>Nature</strong></p>

        <p><em>undefined</em></p>

        <p>A zasu is classified as a monstrosity rather than a humanoid — its pact magic has physically transformed it,
        granting darkvision out to 120 feet and immunity to poison. It has more in common with a yuan-ti abomination
        than a humanoid priest.</p>


        </section>

        <section class="secret kg-secret-sealed">

        <p><strong>Merrshaulk</strong></p>

        <p><em>undefined</em></p>

        <p>The name &#39;Merrshaulk&#39;s Slumber&#39; references an entity of serpentine power. Whether this is the
        same being as the yuan-ti god or a distinct Kagekuni entity remains unclear.</p>


        </section>

  details:
    biography:
      value: >-
        <p>The Mountain God of the Tenchūsan Ren — a wolf of extraordinary size, twelve to fifteen feet from nose to
        haunch and standing eight feet at the shoulder, with pale grey-white fur that carries the faint cold
        luminescence of high-altitude snow in low light. Its eyes hold the deep amber patience of something that has
        watched the mountains since before the roads existed. It is not worshipped in temples; it is the mountain itself
        made predator.</p>

        <h3>Tactics</h3>

        <p>The Yama-no-Ōkami fights with overwhelming physical force — it charges, bites to knock prey prone, and
        presses the kill before its target can recover. Its Howl of the Mountain is used to scatter formations before it
        closes. It does not retreat; it hunts until one side stops moving.</p>


        <section class="secret kg-secret-sealed">

        <p><strong>Status</strong></p>

        <p><em>undefined</em></p>

        <p>Slain by the party in the Tenchūsan Ren during the Fushichō ashfall, Nagatsuki 1, 16744. Butchered at 極上
        Gokujō grade — full harvest catalogue in canon/materials.json and Obsidian/dm/campaign-state.md. This entry
        exists for compendium reference and token library use.</p>


        </section>

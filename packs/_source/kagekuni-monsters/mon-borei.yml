  details:
    biography:
      value: >-
        <p>A bōrei is a powerful seimaster — a mage of significant skill who channels sei through intellect and study.
        They command devastating evocation magic including Fireball and Cone of Cold, protect themselves with Shield and
        Counterspell, and can teleport short distances with Misty Step. A bōrei in its element is among the most
        dangerous opponents an adventuring party can face.</p>

        <h3>Tactics</h3>

        <p>Bōrei fight methodically: Mage Armor before combat, Misty Step to maintain distance, Fireball or Cone of Cold
        against groups, and Divine Burst for sustained single-target damage. They use Counterspell and Shield reactively
        to survive focused attacks.</p>

        <h3>Spells</h3>

        <p>Detect Magic, Light, Mage Armor, Mage Hand, Prestidigitation, Fireball, Invisibility, Cone of Cold, Fly,
        Spirit Guardians, Misty Step, Counterspell, Shield</p>


        <section class="secret kg-secret-sealed">

        <p><strong>Nature</strong></p>

        <p><em>undefined</em></p>

        <p>The term &#39;bōrei&#39; literally means &#39;departed spirit&#39; but in common usage refers to any powerful
        seimaster who has devoted their life to magical study. Not all bōrei are hostile — some are reclusive scholars,
        court advisors, or wandering sages. The stat block represents a combat-ready mage of considerable power.</p>


        </section>

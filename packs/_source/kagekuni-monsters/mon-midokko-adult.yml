  details:
    biography:
      value: >
        <p>An adult of the Emerald Brood — twenty feet of stocky, four-legged dragon with a magnificent antler crown
        that branches like ancient oak. Moss and lichen grow visibly along the back; small mushrooms sprout in the
        joints between scales. The dragon trails wildflowers in its footprints.</p>

        <h3>Tactics</h3>

        <p>Midokkō adults are reluctant combatants. They use entangling magic and Spore Cloud to hold attackers at bay,
        healing themselves and allies between rounds. They prefer to drive intruders away rather than kill them — but
        they will kill those who burn living things, and those they kill they do not mourn.</p>

        <h3>Lair Actions</h3>

        <p>On initiative count 20 (losing ties):</p>

        <ul>

        <li><strong>Verdant Snare.</strong> Roots and vines erupt in a 20-ft cube within 120 ft. Each creature in the
        cube makes a DC 15 Strength save or is restrained until the start of the dragon&#39;s next turn.</li>

        <li><strong>Renewing Bloom.</strong> The dragon and one ally within 60 ft regain 22 (4d10) hit points.</li>

        <li><strong>Mushroom Spore Burst.</strong> A 10-ft-radius sphere of poisonous spores blooms at a point within
        120 ft. Each creature in the area makes a DC 15 Constitution save, taking 18 (4d8) poison damage on a failure or
        half on a success.</li>

        </ul>

        <h3>Regional Effects</h3>

        <p>Within 3 miles of a Midokkō lair:</p>

        <ul>

        <li>Plants grow at twice their natural rate.</li>

        <li>Injured beasts within 1 mile heal twice as fast.</li>

        <li>Felling a living tree within 1 mile alerts the dragon as surely as a struck bell.</li>

        </ul>

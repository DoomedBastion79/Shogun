  details:
    biography:
      value: >
        <p>A samurai without a master — their lord slain, their clan destroyed, or their own conduct stripping them of
        station. Most rōnin are not criminals by intent; they are warriors without purpose, reduced to selling their
        skill. Some become decent mercenaries. Some become dangerous.</p>

        <h3>Tactics</h3>

        <p>A rōnin fights with trained precision — multiattack with a katana, careful footwork, and a Decisive Strike
        held in reserve for when a kill matters. Unlike bandits they do not rout easily; pride and desperation read the
        same on a masterless swordsman.</p>

  details:
    biography:
      value: >-
        <p>A churning mass of tiny dark-furred rats with glinting red eyes. Yaminezumi swarms gather in sewers,
        abandoned buildings, and forest undergrowth, drawn together by some instinct darker than mere hunger. They flow
        like a living tide, climbing walls and pouring through gaps barely wider than a finger.</p>

        <h3>Behavior</h3>

        <p>Yaminezumi swarms are aggressive when disturbed and will pursue prey relentlessly through narrow spaces. They
        scatter only when reduced to a handful of survivors.</p>


        <section class="secret kg-secret-discoverable">

        <p><strong>Ecology</strong></p>

        <p><em>discoverable</em></p>

        <p>Yaminezumi are touched by shadow — their eyes glow faintly in darkness, and they seem to thrive in places
        where the boundary between the material and spirit world is thin. Some scholars believe they are attracted to
        sites of death or dark sei.</p>


        </section>

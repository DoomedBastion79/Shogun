  details:
    biography:
      value: >
        <p>Desperate men and women who have turned to robbery — masterless ashigaru, failed merchants, and displaced
        farmers who prey on travelers. Most work in loose bands under a stronger leader and scatter at the first sign of
        serious resistance.</p>

        <h3>Tactics</h3>

        <p>Bandits attack in numbers and flee when a fight turns against them. They prefer ambush from cover, targeting
        isolated or unarmed travelers. Against a prepared group they are little more than a speed bump.</p>

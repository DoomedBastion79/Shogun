  details:
    biography:
      value: >
        <p>An adult of the Silver Brood — thirty feet long, slender, double-winged. Liquid silver scales reflect
        constellations that do not match the sky overhead; sometimes the reflection is the sky as it was a thousand
        years ago, sometimes the sky as it will be a thousand years hence. Eyes like the seas of the moon.</p>

        <h3>Tactics</h3>

        <p>Ginkkō adults rarely engage on their own initiative. When they do, they treat the encounter as a study; they
        will retreat to consider any combatant who proves interesting and return on their own schedule. They prefer cold
        and freezing tactics to outright kills, and they teleport between moonlit and starlit spaces to keep
        distance.</p>

        <h3>Lair Actions</h3>

        <p>On initiative count 20 (losing ties):</p>

        <ul>

        <li><strong>Constellation Step.</strong> The dragon teleports up to 120 ft to any moonlit or starlit space it
        can see. If a creature attacks the dragon during this round, the dragon&#39;s space at the start of its turn is
        illusory; the attack resolves against the empty space.</li>

        <li><strong>Sky-Pull.</strong> The dragon designates a 20-ft cube within 120 ft. Each creature in the cube makes
        a DC 16 Strength save or is pulled 30 ft toward the dragon and restrained until the start of the dragon&#39;s
        next turn (frozen midair in cold light).</li>

        <li><strong>Moonshard.</strong> A shard of crystallized moonlight strikes a point within 120 ft. Each creature
        within 10 ft makes a DC 16 Dexterity save, taking 22 (4d10) cold damage on a failure or half on a success.</li>

        </ul>

        <h3>Regional Effects</h3>

        <p>Within 6 miles of a Ginkkō lair:</p>

        <ul>

        <li>Nights are clearer and stars brighter than the latitude should allow.</li>

        <li>Compasses point to the lair rather than to magnetic north.</li>

        <li>Time passes a fraction more slowly than elsewhere; a long rest within 1 mile lasts 9 hours of subjective
        time but ends at the same dawn as the rest of the world.</li>

        </ul>

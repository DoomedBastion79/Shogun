  details:
    biography:
      value: >-
        <p>With snakes for arms, pit masters are yuan-ti malison priests who have made a pact with the god Merrshaulk and seek to rouse him from his slumber by sacrificing Humanoids to him. They are
        the most traditionalist yuan-ti and believe that they are best equipped to achieve the goals of their people.</p>

        <p>Pit masters are deeply involved in yuan-ti’s long-term plan to take over Humanoid governments, as well as in the ongoing effort to protect their cities from discovery or attacks by
        hostiles. They oppose reckless behavior and argue for a slow, cautious approach in all matters.</p>
      public: ''

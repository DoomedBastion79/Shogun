  - type: spell
    system:
      description:
        value: >-
          <p><b>Special Notes: snakes only.</b></p>


          <p>This spell lets you convince a &amp;Reference[beast]{beast} that you mean it no harm. Choose a &amp;Reference[beast]{beast} that you can see within range. It must see and hear you. If the
          beast's &amp;Reference[int]{Intelligence} is 4 or higher, the spell fails. Otherwise, the &amp;Reference[beast]{beast} must succeed on a &amp;Reference[wis]{Wisdom} saving throw or be
          &amp;Reference[charmed]{charmed} by you for the spell's duration. If you or one of your companions harms the target, the spell ends.</p>

          <p><strong>At Higher Levels.</strong> When you cast this spell using a spell slot of 2nd level or higher, you can affect one additional &amp;Reference[beast]{beast} for each slot level above
          1st.</p>

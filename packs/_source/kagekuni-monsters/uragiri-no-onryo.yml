    type: weapon
    system:
      description:
        value: >-
          <section class="secret">

          <p><em><strong></strong> Melee Spell Attack:</em> +4 to hit, reach 5 ft., one creature. <em>Hit:</em> [[/damage 3d6 type=necrotic average=true]] damage. The target must succeed on a [[/save
          con 10 format=long]] or its hit point maximum is reduced by an amount equal to the damage taken. This reduction lasts until the creature finishes a long rest. The target dies if this effect
          reduces its hit point maximum to 0.</p>

          </section>


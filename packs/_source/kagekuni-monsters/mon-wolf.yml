  details:
    biography:
      value: >
        <p>The mountain wolves of Hokori are large, grey-furred pack hunters. They avoid humans when prey is plentiful
        but grow bold during harsh winters or when the pack is large enough to challenge what it once feared.</p>

        <h3>Tactics</h3>

        <p>Wolves rely on pack tactics — isolating stragglers, knocking prey prone, and pressing before it can rise. A
        lone wolf avoids even a single armed human; a pack of four or more considers most things prey.</p>

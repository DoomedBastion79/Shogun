  details:
    biography:
      value: >
        <p>A young Onyx Brood dragon — long, segmented, multiple short pairs of legs. Scales drink light. The wyrmling
        has no visible eyes; it perceives by heat, sei, and a subtler sense it does not explain. Its voice arrives in
        the listener&#39;s skull rather than through the air.</p>

        <h3>Behavior</h3>

        <p>Quiet. Watchful. Transactional. Kurokkō wyrmlings deal in promises and small secrets even before they can
        speak in formal sentences. They are pleasant company in a way that is faintly unsettling.</p>

        <h3>As a Bonded Companion</h3>

        <p>When granted as a Wyrmling Bond, use the Expert sidekick template (Tasha&#39;s). The wyrmling extracts one
        secret per week from the bonded PC; track the count in Obsidian/dm/campaign-state.md.</p>

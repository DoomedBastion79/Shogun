  details:
    biography:
      value: >
        <p>An adult of the Golden Brood — thirty-five feet of magnificent dragon, mane-crested with fine gold filament
        that catches every breeze. Scales the warm gold of dawn light. Breath that smells of incense and clean rain. The
        dragon does not radiate power so much as inhabit it; standing in its presence feels like standing in a courtroom
        that has somehow extended to the horizon.</p>

        <h3>Tactics</h3>

        <p>Kinkkō adults do not strike first. They will speak, sometimes at length, before initiative is rolled — and
        the conversation is not stalling but evaluation. When they fight, they fight precisely and lethally, but they
        accept surrender at any point and will protect allies who have surrendered. They do not retreat. They do not
        need to.</p>

        <h3>Lair Actions</h3>

        <p>On initiative count 20 (losing ties):</p>

        <ul>

        <li><strong>Pillar of Light.</strong> A pillar of brilliant gold light, 10 ft radius and 60 ft tall, descends at
        a point within 120 ft. Each creature in the pillar makes a DC 18 Constitution save, taking 33 (6d10) radiant
        damage on a failure or half on a success. Undead and aberrations have disadvantage.</li>

        <li><strong>Sovereign Word.</strong> The dragon speaks a word of authority. Each hostile creature within 60 ft
        makes a DC 18 Wisdom save or is restrained until the start of the dragon&#39;s next turn.</li>

        <li><strong>Reflect Injustice.</strong> The next time a hostile creature within 60 ft makes an attack against an
        ally of the dragon (including a petitioner the dragon has accepted), the attacker takes 22 (4d10) radiant
        damage.</li>

        </ul>

        <h3>Regional Effects</h3>

        <p>Within 6 miles of a Kinkkō lair:</p>

        <ul>

        <li>Sunlight is brighter and reaches further; deception magic of 5th level or lower fails within 1 mile.</li>

        <li>Sleeping within sight of the lair grants prophetic dreams to any creature with a true intention to act
        justly.</li>

        <li>Honest creatures know the way to the lair without map or guide; dishonest creatures find themselves walking
        in circles.</li>

        </ul>
      public: ''

      content: >-
        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-background"
        data-section="background">Background</h3>

        <p>On the first day of travel north from Heian toward Ayame, the party encountered a woman on the highway —
        Yasutake Mai — out of breath and visibly distressed. The conversation that followed was brief and somewhat
        chaotic. She claimed to be carrying a precious package and asked the party to hold it for her.</p>

        <p>Within moments she spotted a group of figures running down the road toward her, tossed the package to the
        party, and bolted. The package was her infant child. The running figures turned out to be boys simply out for a
        run — not the threat she apparently believed them to be. Relc, in a moment of remarkable speed and determination
        (and equally remarkable dice luck), managed to catch and return the fleeing mother to the situation.</p>

        <p>With child and mother reunited, the party learned enough of her circumstances to understand she was fleeing
        something — or someone — and had nowhere safe to go. The offer was made: the party would take her north through
        the Tenchusan Ren, to Sunsato on the far side, where she might find safety and a new beginning in the region
        where Relc&#39;s roots lie.</p>

        <h3 id="kg-objectives" data-section="objectives">Objectives</h3>

        <ul>

        <li class="kg-task" data-done="false">Reunite mother and child</li>

        <li class="kg-task" data-done="false">Safely transport Yasutake Mai and her infant to
        <strong>Sunsato</strong></li>

        </ul>

        <h3 id="kg-known-information" data-section="known-information">Known Information</h3>

        <p><strong>Yasutake Mai</strong> — A young woman, clearly under significant stress at the time of the encounter.
        She has not fully explained her circumstances or what she was fleeing. The infant appears healthy. Mai is
        capable of managing independently under normal conditions but was operating in a state of fear-driven poor
        decision making when the party found her.</p>

        <p><strong>Sunsato</strong> — A settlement on the north side of the Tenchusan Ren, described as being near
        Relc&#39;s home region of Mizu province. The party offered this as a destination and it was accepted.</p>

        <p><strong>Current Status</strong> — The party entered the Tenchusan Ren mountain pass. Mai is currently
        traveling with the party inside the temple — she is a civilian in a dungeon and cannot fight.</p>

        </section>

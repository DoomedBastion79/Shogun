      content: >-
        <section class="kg-tier kg-tier-discoverable" data-tier="discoverable"><h3 id="kg-hidden-truth"
        data-section="hidden-truth">Hidden Truth</h3>

        <p>Mai is not simply a woman in difficult circumstances. She is the estranged daughter-in-law of a minor
        merchant family in the Hana region — estranged because she took the infant and left after becoming aware that
        her husband&#39;s family was involved in illegal activity (specifically: participation in unlicensed Bronze Wood
        poaching, connected tangentially to the merchant guild operating out of Kikyo). She did not report this and has
        no intention of reporting it; she simply wants to disappear with her child.</p>

        <p>The &quot;group of men&quot; she feared on the highway were not those people. They were coincidental. But the
        people she is actually afraid of are real and have noticed she is gone. They are not currently actively
        searching — they are waiting to see if she surfaces somewhere that matters to their operations.</p>

        <h3 id="kg-npc-knowledge" data-section="npc-knowledge">NPC Knowledge</h3>

        <ul>

        <li><strong>Yasutake Mai</strong> — Knows her husband&#39;s family was involved in unlicensed Bronze Wood
        poaching. Does not realize she knows things she doesn&#39;t know she knows — she lived in that household for
        three years and heard conversations she didn&#39;t fully understand about the underground Bronze Wood sourcing
        beneath Seidorin Mori.</li>

        <li><strong>Elder Sato Hideaki (Koriwara)</strong> — Knows the community network near Sunsato and could help
        establish Mai there, if the party makes that connection.</li>

        </ul>

        <h3 id="kg-discovery-paths" data-section="discovery-paths">Discovery Paths</h3>

        <ul>

        <li>A merchant courier passing through Ayame or Sunsato is asking discreet questions about a young woman with an
        infant who has gone missing from a family in southern Hana — not aggressive, not official, just persistent</li>

        <li>Mai, once settled, sends a message to the party: she has remembered something from her former household that
        she thinks might matter to them</li>

        </ul>

        </section>

      content: >-
        <section class="kg-tier kg-tier-sealed" data-tier="sealed"><h3 id="kg-full-truth" data-section="full-truth">Full
        Truth</h3>

        <p>The infant is a healthy baby boy with no apparent significance beyond being a mother&#39;s reason to flee.
        However, as a long-term seed: the merchant family she left was involved in Bronze Wood sourcing. If the
        underground canal source beneath Seidorin Mori ever becomes a significant plot point, Mai knows things she
        doesn&#39;t know she knows.</p>

        <p>Sunsato exists near Relc&#39;s home region and is a viable destination. It is small enough that a newcomer
        will be noticed, but the community near Koriwara is historically accepting of people who arrive asking for
        honest work and quiet lives.</p>

        <h3 id="kg-resolution-options" data-section="resolution-options">Resolution Options</h3>

        <ul>

        <li><strong>Safe delivery to Sunsato</strong> closes this quest. Optional extension: the party introduces Mai to
        Elder Sato&#39;s community network, which earns them a favor with Sato and plants a contact in the north Mizu
        foothills region.</li>

        <li><strong>If the quest is abandoned</strong> — Mai will eventually find her way there through other means. She
        is more capable than she appeared in crisis. She will survive. But she will remember whether the party kept
        their word.</li>

        </ul>

        <h3 id="kg-timing" data-section="timing">Timing</h3>

        <ul>

        <li>Mai is currently with the party inside the temple — a civilian in a dungeon; she needs protection or a
        defensible position during encounters</li>

        <li>No hard deadline; the merchant family is not actively searching yet</li>

        </ul>

        <h3 id="kg-connections" data-section="connections">Connections</h3>

        <ul>

        <li><strong>Elder Sato Hideaki</strong> — introducing Mai to his network earns a favor and plants a useful
        northern contact</li>

        <li><strong>Bronze Wood poaching thread</strong> — long-term seed connecting to Seidorin Mori and the Kikyo
        merchant guild</li>

        <li><strong>Relc&#39;s home region</strong> — delivering Mai to Sunsato takes the party near Koriwara, where
        Relc&#39;s personal quest (first stone) also points</li>

        </ul>

        </section>

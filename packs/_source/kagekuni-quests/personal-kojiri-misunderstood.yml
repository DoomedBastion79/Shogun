        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-background"
        data-section="background">Background</h3>

        <p>Ko&#39;jiri&#39;s entrepreneurial approach to the provision of wisdom and guidance in the city of Kikyo
        attracted the attention of local authorities in a manner inconsistent with continued free operation.
        Specifically: a formal writ was served outlining offenses committed within Kikyo — fraud, unlawful coin
        gathering, false prophecies, and exploitation.</p>

        <p>Rather than simple prosecution, Shicho Ren Nakamura identified an opportunity. Ko&#39;jiri&#39;s particular
        skillset — persuasion, information gathering, and the ability to move through situations without attracting
        official attention — was potentially useful for an assignment that required someone deniable. A conditional
        pardon was offered: complete the tasks assigned by Taisho Hideo Nakamura, and all charges are set aside.</p>

        <p>Ko&#39;jiri reported to Taisho Nakamura. The assignment: travel to the Kaze region and determine what has
        happened to Daimyo Masota no Gekko of Clan Gekko. An independent clan&#39;s leadership has gone silent. The
        political implications of that silence are significant. The party is the official — if unofficial —
        investigative body.</p>

        <h3 id="kg-objectives" data-section="objectives">Objectives</h3>

        <ul>

        <li class="kg-task" data-done="false">Ko&#39;jiri has been served with a writ outlining offenses committed
        within Kikyo. Shicho Nakamura Ren offers a pardon upon completion of tasks for Taisho Hideo Nakamura.<ul>

        <li class="kg-task" data-done="false">Report to Taisho Hideo Nakamura for assignment</li>

        <li class="kg-task" data-done="false">Taisho Nakamura has assigned Ko&#39;jiri to venture to Akatsuki and the
        Kaze region to determine what has happened to the Daimyo of Clan Gekko</li>

        </ul>

        </li>

        </ul>

        <h3 id="kg-known-information" data-section="known-information">Known Information</h3>

        <p><strong>Official Objective</strong>: Determine the fate of Daimyo Masota no Gekko of Clan Gekko.</p>

        <p><strong>Context provided by Taisho Nakamura</strong>:</p>

        <ul>

        <li>Clan Gekko, one of Hokori&#39;s three independent clans, has ceased communication with external parties</li>

        <li>Provincial administration in Kaze has stopped responding to Heian correspondence</li>

        <li>The clan&#39;s last confirmed communication was several months ago — a routine dispatch that mentioned
        nothing unusual</li>

        <li>Clan Kurohana&#39;s Imperial Seal (held by the party) calls on independent Kaminari support to investigate
        this silence</li>

        <li>The target location is Akatsuki in Kaze province, and the broader Kaze region</li>

        </ul>

        <p><strong>The Party&#39;s Current Position</strong> — The party is at the gold doors in Tenchusan Ren. The
        mountains form the boundary between Hana and Kaze province. Completing the temple may bring them out on the Kaze
        side — or provide information that directly advances this quest.</p>

        <p><strong>Known Complications</strong>:</p>

        <ul>

        <li><strong>Ko&#39;jiri&#39;s Forged Letter</strong> — Ko&#39;jiri carries two versions of correspondence from
        Ren Nakamura: the legitimate envoy letter and a forged version requesting additional materials. The real letter
        was sent to Heian through official channels simultaneously. The window during which the discrepancy remains
        undiscovered is closing.</li>

        <li><strong>The Conditional Pardon&#39;s Terms</strong> — Failure to complete the assignment reactivates all
        original charges immediately. The pardon has no partial credit — completion is required.</li>

        </ul>

        </section>

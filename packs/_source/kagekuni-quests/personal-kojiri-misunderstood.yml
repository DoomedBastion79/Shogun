        <section class="kg-tier kg-tier-discoverable" data-tier="discoverable"><h3 id="kg-hidden-truth"
        data-section="hidden-truth">Hidden Truth</h3>

        <p>The Nagaji — the transformed Clan Gekko members the party has been fighting — are the answer to the
        assignment. Masota no Gekko is alive, transformed, somewhere in the Kaze highlands. The full truth is available
        at the Monastery of the Black Lily above Akatsuki. The quest&#39;s nominal completion (report back what happened
        to the daimyo) is achievable. The deeper question — what do they do about it — is where the quest becomes
        something larger.</p>

        <h3 id="kg-npc-knowledge" data-section="npc-knowledge">NPC Knowledge</h3>

        <ul>

        <li><strong>Hideo Nakamura</strong> — Assigned this mission not only because the Gekko investigation is
        strategically important but because he wanted a deniable party with no official Clan Kaminari affiliation. If
        things go wrong in Kaze, Clan Kaminari needs to not be officially responsible. Ko&#39;jiri (and by extension the
        party) is that deniability. Hideo is pragmatic about this. He will support the party within limits, but those
        limits are defined by what he can defend politically.</li>

        <li><strong>Ren Nakamura</strong> — Sent the legitimate letter to Heian through official channels; the
        administrative queue will eventually cross-reference it against Ko&#39;jiri&#39;s presented version.</li>

        </ul>

        <h3 id="kg-discovery-paths" data-section="discovery-paths">Discovery Paths</h3>

        <ul>

        <li>Inside the temple, Ko&#39;jiri&#39;s research notes become directly useful — his documented knowledge of
        Kinkokyou&#39;s layout gives the party an edge navigating the buried sections; his advantage on History checks
        (Golden Dragon Clan) is active throughout</li>

        <li>A message from Heian reaches the party through Oshiro Masahiro in Ayame (routed through the Inspector&#39;s
        network): there is an administrative query about Ko&#39;jiri&#39;s letters; the clock has started</li>

        <li>Hideo Nakamura sends a discreet secondary message: regardless of what the party finds, he needs a report
        before it goes anywhere else; he implies that certain information in the wrong hands at the wrong moment would
        be catastrophic</li>

        </ul>

        </section>

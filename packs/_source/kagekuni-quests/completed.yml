        <h3 id="kg-background" data-section="background">Background</h3>

        <p>Traveling north on the Emperor&#39;s Highway, the party passed a group of men taking a roadside break from
        travel — seated around a card game, apparently at leisure. Sun Wukong overheard a fragment of conversation
        referencing &quot;the daimyo&#39;s men hitting the road by nightfall&quot; — the kind of information that only
        matters if you&#39;re trying to avoid official attention. A closer look revealed goods in their wagon, mostly
        concealed under canvas.</p>

        <p>Ko&#39;jiri, characteristically, engaged them. The conversation that followed was a masterpiece of social
        engineering: two of the men were talked into turning on the other two. The group dissolved into conflict, and
        the survivors scattered in opposite directions as the party made clear they were not going to let the matter
        rest.</p>

        <p>The stolen goods were recovered and subsequently turned over to Chief Inspector
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.Mly4i17grlghx2a2]{Oshiro
        Masahiro} of the Teikoku Keisatsu in
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.O65fxIh1WZwEtwrf]{Ayame}, who received them without
        excessive questions and confirmed the party&#39;s good-faith engagement with legal authority. This interaction
        contributed meaningfully to Oshiro&#39;s decision to confirm the party as trustworthy when the wagon impoundment
        situation arose shortly thereafter.</p>

        <h3 id="kg-objectives" data-section="objectives">Objectives</h3>

        <ul>

        <li class="kg-task" data-done="true" data-task-key="q-spoils-of-justice--known-t0">Relieve the thieves of the
        burden of having to manage the ill-gotten gains</li>

        <li class="kg-task" data-done="true" data-task-key="q-spoils-of-justice--known-t1">Decide what to do with the
        goods</li>

        <li class="kg-task" data-done="true" data-task-key="q-spoils-of-justice--known-t2">Goods turned in to the
        Imperial Police in Ayame</li>

        </ul>

        <h3 id="kg-known-information" data-section="known-information">Known Information</h3>

        <p><strong>Outcome &amp; Consequences</strong> — The goods were returned through official channels. Oshiro
        Masahiro&#39;s positive assessment of the party — which later resulted in the return of the impounded wagon and
        a reward — was influenced in part by this demonstration of law-abiding intent. The party gained a confirmed ally
        in the Chief Inspector.</p>

        <p>The two surviving thieves are somewhere on the road. They know what the party looks like. Whether this
        matters is an open question — professional thieves who escaped a bad situation typically prioritize distance
        over revenge, but the fragment of conversation about &quot;the daimyo&#39;s men&quot; suggests they may have
        been operating under someone else&#39;s direction.</p>

        <h3 id="kg-hidden-truth" data-section="hidden-truth">Hidden Truth</h3>

        <p>The goods were not random opportunistic theft. The thieves were part of a small, loosely organized network of
        independent contractors working for a merchant in
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.Zk6QD9Sdfud4SuRV]{Heian}&#39;s Ichiba Chiku — a
        legitimate-seeming trading operation that runs a side business in redirected goods. &quot;Redirected&quot;
        meaning: items that were supposed to arrive at one destination are intercepted and sold to a different buyer who
        doesn&#39;t ask where they came from. The daimyo&#39;s men reference meant a Clan Kaminari supply transport was
        expected on the road by nightfall and the thieves were either planning to avoid it or had originally intended to
        intercept it.</p>

        <h3 id="kg-npc-knowledge" data-section="npc-knowledge">NPC Knowledge</h3>

        <ul>

        <li><strong>The card-player thief</strong> — Headed back toward Heian; has put the entire incident out of his
        mind as a professional hazard.</li>

        <li><strong>The talking thief</strong> — More enterprising; has been thinking about the party since the
        encounter; quietly asking around about who they are. Not planning revenge. Considering whether the party might
        be useful to know, or whether there might be money in information about where they went. Not a significant
        threat but is a loose thread.</li>

        <li><strong>Oshiro Masahiro</strong> — Official report noted the party by description (not by name at that
        point) and flagged them as &quot;travelers of apparent good character and law-abiding intent operating in the
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.eAI9SnbW1RmsWOGw]{Hana}
        northern highway corridor.&quot; This report is in the Teikoku Keisatsu&#39;s Ayame file.</li>

        </ul>

        <h3 id="kg-discovery-paths" data-section="discovery-paths">Discovery Paths</h3>

        <ul>

        <li>The enterprising thief&#39;s inquiries could surface if someone else is also looking for information about
        the party</li>

        <li>Oshiro&#39;s report in the Ayame file is accessible to anyone with Teikoku Keisatsu access</li>

        </ul>

        <h3 id="kg-full-truth" data-section="full-truth">Full Truth</h3>

        <p>The merchant operation in Heian&#39;s Ichiba Chiku continues. The thieves were low-level contractors; losing
        them is a minor operational hiccup, not a crisis. The &quot;daimyo&#39;s men&quot; reference points to a Clan
        Kaminari supply transport — suggesting the network has enough intelligence on military logistics to plan around
        official movements.</p>

        <h3 id="kg-resolution-options" data-section="resolution-options">Resolution Options</h3>

        <p>Quest is resolved. The goods were returned. Oshiro is an ally. The remaining loose threads (the surviving
        thieves, the Heian merchant operation) are background elements available for future use.</p>

        <h3 id="kg-timing" data-section="timing">Timing</h3>

        <p>No active timing pressures. The enterprising thief&#39;s inquiries are ongoing but low-priority.</p>

        <h3 id="kg-connections" data-section="connections">Connections</h3>

        <ul>

        <li><strong>Chief Inspector Oshiro Masahiro</strong> — confirmed ally; his positive assessment of the party has
        practical value in Ayame and the broader Hana region</li>

        <li><strong>The enterprising thief</strong> — a loose thread who is gathering information about the party; could
        be a minor complication or a contact depending on future developments</li>

        <li><strong>Heian&#39;s Ichiba Chiku merchant network</strong> — background criminal operation that could
        resurface if the party returns to Heian</li>

        </ul>

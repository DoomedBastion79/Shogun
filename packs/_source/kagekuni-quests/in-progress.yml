    text:
      format: 1
      content: >-
        <dl class="kg-infobox" data-kind="infobox"><div class="kg-info__row"><dt>Type</dt><dd
        data-field="type">personal</dd></div><div class="kg-info__row"><dt>Status</dt><dd
        data-field="status">active</dd></div><div class="kg-info__row"><dt>Quest Giver</dt><dd
        data-field="quest-giver">npc-ren-nakamura</dd></div><div class="kg-info__row"><dt>Location</dt><dd
        data-field="location">st-akatsuki-kaze-province</dd></div><div class="kg-info__row"><dt>PC Focus</dt><dd
        data-field="pc-focus">pc-kojiri</dd></div></dl>

        <h3 id="kg-background" data-section="background">Background</h3>

        <p>Ko&#39;jiri&#39;s entrepreneurial approach to the provision of wisdom and guidance in the city of
        @UUID[Compendium.assistant.lore.JournalEntry.8BPLYleAkYpmvX5a]{Kikyo} attracted the attention of local
        authorities in a manner inconsistent with continued free operation. Specifically: a formal writ was served
        outlining offenses committed within Kikyo — fraud, unlawful coin gathering, false prophecies, and
        exploitation.</p>

        <p>Rather than simple prosecution, Shicho
        @UUID[Compendium.assistant.npcs-lore.JournalEntry.gzeHJBD2MSIEL1L6]{Ren Nakamura} identified an opportunity.
        Ko&#39;jiri&#39;s particular skillset — persuasion, information gathering, and the ability to move through
        situations without attracting official attention — was potentially useful for an assignment that required
        someone deniable. A conditional pardon was offered: complete the tasks assigned by Taisho
        @UUID[Compendium.assistant.npcs-lore.JournalEntry.l41icMnxACSIzz72]{Hideo Nakamura}, and all charges are set
        aside.</p>

        <p>Ko&#39;jiri reported to Taisho Nakamura. The assignment: travel to the
        @UUID[Compendium.assistant.lore.JournalEntry.eCDVjJnQ9Qxm3xKJ]{Kaze} region and determine what has happened to
        Daimyo Masota no Gekko of Clan Gekko. An independent clan&#39;s leadership has gone silent. The political
        implications of that silence are significant. The party is the official — if unofficial — investigative
        body.</p>

        <h3 id="kg-objectives" data-section="objectives">Objectives</h3>

        <ul>

        <li class="kg-task" data-done="false">Ko&#39;jiri has been served with a writ outlining offenses committed
        within Kikyo. Shicho Nakamura Ren offers a pardon upon completion of tasks for Taisho Hideo Nakamura.<ul>

        <li class="kg-task" data-done="false">Report to Taisho Hideo Nakamura for assignment</li>

        <li class="kg-task" data-done="false">Taisho Nakamura has assigned Ko&#39;jiri to venture to
        @UUID[Compendium.assistant.lore.JournalEntry.ow3AGqlvFevncAwN]{Akatsuki} and the Kaze region to determine what
        has happened to the Daimyo of Clan Gekko</li>

        </ul>

        </li>

        </ul>

        <h3 id="kg-known-information" data-section="known-information">Known Information</h3>

        <p><strong>Official Objective</strong>: Determine the fate of Daimyo Masota no Gekko of Clan Gekko.</p>

        <p><strong>Context provided by Taisho Nakamura</strong>:</p>

        <ul>

        <li>Clan Gekko, one of Hokori&#39;s three independent clans, has ceased communication with external parties</li>

        <li>Provincial administration in Kaze has stopped responding to
        @UUID[Compendium.assistant.lore.JournalEntry.Zk6QD9Sdfud4SuRV]{Heian} correspondence</li>

        <li>The clan&#39;s last confirmed communication was several months ago — a routine dispatch that mentioned
        nothing unusual</li>

        <li>Clan Kurohana&#39;s Imperial Seal (held by the party) calls on independent Kaminari support to investigate
        this silence</li>

        <li>The target location is Akatsuki in Kaze province, and the broader Kaze region</li>

        </ul>

        <p><strong>The Party&#39;s Current Position</strong> — The party is at the gold doors in Tenchusan Ren. The
        mountains form the boundary between @UUID[Compendium.assistant.lore.JournalEntry.0PBRectAa16xVvjt]{Hana} and
        Kaze province. Completing the temple may bring them out on the Kaze side — or provide information that directly
        advances this quest.</p>

        <p><strong>Known Complications</strong>:</p>

        <ul>

        <li><strong>Ko&#39;jiri&#39;s Forged Letter</strong> — Ko&#39;jiri carries two versions of correspondence from
        Ren Nakamura: the legitimate envoy letter and a forged version requesting additional materials. The real letter
        was sent to Heian through official channels simultaneously. The window during which the discrepancy remains
        undiscovered is closing.</li>

        <li><strong>The Conditional Pardon&#39;s Terms</strong> — Failure to complete the assignment reactivates all
        original charges immediately. The pardon has no partial credit — completion is required.</li>

        </ul>


        <section class="secret kg-secret-discoverable">

        <p><strong>Misunderstood Ventures: The Side Effects of Wisdom — Hidden Details</strong></p>

        <p><em>discoverable</em></p>

        <h3 id="kg-hidden-truth" data-section="hidden-truth">Hidden Truth</h3>

        <p>The Nagaji — the transformed Clan Gekko members the party has been fighting — are the answer to the
        assignment. Masota no Gekko is alive, transformed, somewhere in the
        @UUID[Compendium.assistant.lore.JournalEntry.eCDVjJnQ9Qxm3xKJ]{Kaze} highlands. The full truth is available at
        the Monastery of the Black Lily above @UUID[Compendium.assistant.lore.JournalEntry.ow3AGqlvFevncAwN]{Akatsuki}.
        The quest&#39;s nominal completion (report back what happened to the daimyo) is achievable. The deeper question
        — what do they do about it — is where the quest becomes something larger.</p>

        <h3 id="kg-npc-knowledge" data-section="npc-knowledge">NPC Knowledge</h3>

        <ul>

        <li><strong>@UUID[Compendium.assistant.npcs-lore.JournalEntry.l41icMnxACSIzz72]{Hideo Nakamura}</strong> —
        Assigned this mission not only because the Gekko investigation is strategically important but because he wanted
        a deniable party with no official Clan Kaminari affiliation. If things go wrong in Kaze, Clan Kaminari needs to
        not be officially responsible. Ko&#39;jiri (and by extension the party) is that deniability. Hideo is pragmatic
        about this. He will support the party within limits, but those limits are defined by what he can defend
        politically.</li>

        <li><strong>@UUID[Compendium.assistant.npcs-lore.JournalEntry.gzeHJBD2MSIEL1L6]{Ren Nakamura}</strong> — Sent
        the legitimate letter to @UUID[Compendium.assistant.lore.JournalEntry.Zk6QD9Sdfud4SuRV]{Heian} through official
        channels; the administrative queue will eventually cross-reference it against Ko&#39;jiri&#39;s presented
        version.</li>

        </ul>

        <h3 id="kg-discovery-paths" data-section="discovery-paths">Discovery Paths</h3>

        <ul>

        <li>Inside the temple, Ko&#39;jiri&#39;s research notes become directly useful — his documented knowledge of
        Kinkokyou&#39;s layout gives the party an edge navigating the buried sections; his advantage on History checks
        (Golden Dragon Clan) is active throughout</li>

        <li>A message from Heian reaches the party through
        @UUID[Compendium.assistant.npcs-lore.JournalEntry.5oWqdsETsABGqJXF]{Oshiro Masahiro} in
        @UUID[Compendium.assistant.lore.JournalEntry.O65fxIh1WZwEtwrf]{Ayame} (routed through the Inspector&#39;s
        network): there is an administrative query about Ko&#39;jiri&#39;s letters; the clock has started</li>

        <li>Hideo Nakamura sends a discreet secondary message: regardless of what the party finds, he needs a report
        before it goes anywhere else; he implies that certain information in the wrong hands at the wrong moment would
        be catastrophic</li>

        </ul>


        </section>

        <section class="secret kg-secret-sealed">

        <p><strong>Misunderstood Ventures: The Side Effects of Wisdom — GM Secrets</strong></p>

        <p><em>sealed</em></p>

        <h3 id="kg-full-truth" data-section="full-truth">Full Truth</h3>

        <p>Ko&#39;jiri is about to walk into the temple that is the subject of years of his own research. The narrative
        irony is complete: the con artist who built a career on faking Golden Dragon authority is standing at the actual
        door of the Golden Dragon Clan&#39;s lost sanctuary. Whatever happens inside will be real in ways his
        performances never were.</p>

        <p>The forged letter timeline: @UUID[Compendium.assistant.npcs-lore.JournalEntry.gzeHJBD2MSIEL1L6]{Ren
        Nakamura}&#39;s legitimate letter arrived in
        @UUID[Compendium.assistant.lore.JournalEntry.Zk6QD9Sdfud4SuRV]{Heian}&#39;s administrative processing queue
        approximately when the party did, or shortly after. Heian&#39;s administrative function is slowed by the
        political vacuum — the legitimate letter has been logged but not yet actively cross-referenced against
        Ko&#39;jiri&#39;s presence in Heian. Estimate: 2-4 sessions before someone notices the discrepancy.
        @UUID[Compendium.assistant.npcs-lore.JournalEntry.l41icMnxACSIzz72]{Hideo Nakamura}&#39;s office would be the
        first to catch it — creating a direct conflict between Ko&#39;jiri&#39;s handler and Ko&#39;jiri&#39;s legal
        situation.</p>

        <h3 id="kg-resolution-options" data-section="resolution-options">Resolution Options</h3>

        <ul>

        <li>Delivering a clear account of the Gekko situation to Hideo Nakamura closes the formal assignment — but
        &quot;a clear account&quot; requires revealing the Nagaji situation, which has political consequences Hideo was
        trying to avoid by using deniable agents</li>

        <li>Hideo will honor the pardon but may need a serious conversation about what the party tells, who they tell,
        and when</li>

        <li>The deeper question — can the Gekko transformation be reversed, and will Ko&#39;jiri be part of making that
        happen — extends well beyond the assignment&#39;s formal completion</li>

        <li>The temple contains the reversal documentation; Ko&#39;jiri&#39;s research is directly relevant to finding
        it; he may be the most prepared person in the party for what lies inside</li>

        </ul>

        <h3 id="kg-timing" data-section="timing">Timing</h3>

        <ul>

        <li>Forged letter clock: ~2-4 sessions from Heian arrival before the discrepancy is discovered</li>

        <li>The temple visit is happening now — Ko&#39;jiri&#39;s research advantage is active throughout</li>

        <li>Report to Hideo needed before the political situation escalates</li>

        </ul>

        <h3 id="kg-connections" data-section="connections">Connections</h3>

        <ul>

        <li><strong>main-gekko-investigation</strong> — Ko&#39;jiri&#39;s personal quest IS the main investigation; his
        pardon depends on completing it</li>

        <li><strong>Temple of Kinryu</strong> — contains information directly relevant to Ko&#39;jiri&#39;s research;
        the temple will test whether there is anything genuine beneath the performance</li>

        <li><strong>The forged letter</strong> — a ticking clock that will create a confrontation scene when the
        discrepancy surfaces</li>

        </ul>


        </section>

        <dl class="kg-infobox" data-kind="infobox"><div class="kg-info__row"><dt>Type</dt><dd
        data-field="type">main</dd></div><div class="kg-info__row"><dt>Status</dt><dd
        data-field="status">staged</dd></div><div class="kg-info__row"><dt>Location</dt><dd
        data-field="location">loc-tenkuji-temple</dd></div><div class="kg-info__row"><dt>PC Focus</dt><dd

      content: >-
        <section class="kg-tier kg-tier-discoverable" data-tier="discoverable"><h3 id="kg-hidden-truth"
        data-section="hidden-truth">Hidden Truth</h3>

        <p>Clan Gekko&#39;s senior seimasters discovered fragmentary texts describing a transformation ritual tied to
        the Onyx Dragon Clan (Kokuryu). The ritual was meant to grant shadow-shifting capability. It transformed those
        who underwent it into Nagaji — serpentine humanoids — irreversibly and catastrophically. The transformation
        spread. Masota no Gekko himself performed the ritual last, in a final attempt to lead and protect his people in
        their transformed state. He is now Nagaji as well. The Nagaji the party has been fighting in the mountains are
        former Clan Gekko members.</p>

        <h3 id="kg-npc-knowledge" data-section="npc-knowledge">NPC Knowledge</h3>

        <ul>

        <li><strong>Order of the Black Lily</strong> — Knows the full truth about Gekko. Their stance when the party
        arrives at Akatsuki depends on how long they have known, whether they tried to stop it, and whether they are
        protecting, containing, or observing the transformed members.</li>

        <li><strong>Masota no Gekko</strong> — Alive, transformed, retains fragmented awareness. He recognizes his
        mistake. Coherence degrades over time — the longer the party takes to reach him, the less of Masota is left to
        reach.</li>

        <li><strong>The Nagaji Zasu in Tenkuji Temple</strong> — The chief seimaster of Clan Gekko, architect of the
        failed ritual. Fragments of the original person remain. Can potentially communicate if the party uses magic or
        patience.</li>

        </ul>

        <h3 id="kg-discovery-paths" data-section="discovery-paths">Discovery Paths</h3>

        <ul>

        <li>A transformed Gekko member (Nagaji) who retains more of their original personality approaches the party
        non-aggressively — the first indication that these are people, not simply monsters</li>

        <li>Inside the temple, Golden Dragon Clan records explicitly reference a &quot;serpent corruption&quot; and a
        &quot;restoration of form&quot; — the connection between the temple and their mission becomes undeniable</li>

        <li>The Order of the Black Lily makes contact through Akatsuki and proposes a partnership contingent on the
        party having retrieved something from the Temple of Kinryu first</li>

        </ul>

        </section>

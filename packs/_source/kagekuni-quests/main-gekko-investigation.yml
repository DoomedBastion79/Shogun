      content: >-
        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-background"
        data-section="background">Background</h3>

        <p>Clan Gekko — one of Hokori&#39;s three politically independent clans and historically a stabilizing force in
        Kagekuni&#39;s balance of power — has gone silent. No communication. No trade. No diplomatic contact. Provincial
        administration in Kaze has stopped responding. The clan&#39;s last confirmed external communication was several
        months ago and contained nothing unusual.</p>

        <p>In the current political environment — no emperor, no shogun, two major alliances in open conflict — an
        independent clan going silent is not merely a diplomatic problem. It is a potential flashpoint. If Clan Gekko
        has been eliminated or absorbed, the balance of power shifts. If they are in crisis, the crisis could spill
        outward. If they are being suppressed by an outside force, that force has made a significant move that demands
        response.</p>

        <p>Taisho Hideo Nakamura of Clan Kaminari&#39;s Special Operations division assigned the party to investigate —
        using Ko&#39;jiri&#39;s conditional pardon as the formal mechanism, with the party as the operational unit. The
        Imperial Seal issued by Daimyo Akihiko Kurohana provides diplomatic weight: it calls on all factions to
        cooperate with the investigation as a matter of archipelago-wide concern.</p>

        <h3 id="kg-objectives" data-section="objectives">Objectives</h3>

        <ul>

        <li class="kg-task" data-done="false">Determine what has happened to Daimyo Masota no Gekko and Clan Gekko<ul>

        <li class="kg-task" data-done="false">Travel to Kaze Province and Akatsuki</li>

        <li class="kg-task" data-done="false">Investigate the Monastery of the Black Lily and the Order of the Black
        Lily</li>

        <li class="kg-task" data-done="false">Locate and assess Clan Gekko&#39;s current status</li>

        <li class="kg-task" data-done="false">Report findings to Taisho Hideo Nakamura</li>

        </ul>

        </li>

        </ul>

        <h3 id="kg-known-information" data-section="known-information">Known Information</h3>

        <p><strong>The Nagaji Connection</strong> — The party has encountered Nagaji (serpentine humanoid creatures)
        multiple times in the Tenchusan Ren mountains. These creatures have been responsible for triggering the
        avalanche that endangered the party, operating what appeared to be an outpost in the mountain ruins, and
        guarding the approach to the gold doors. Their presence in the mountain pass between Hana and Kaze province is
        not coincidental. Their connection to the Clan Gekko investigation is not yet known to the party.</p>

        <p><strong>The Gold Doors</strong> — The party stands at the entrance to what appears to be the Lost Temple of
        Kinryu. This location is within the Tenchusan Ren, at the boundary of Hana and Kaze provinces. Whatever lies
        inside is connected to both the Golden Dragon Clan&#39;s history and — more immediately — to the Nagaji activity
        that has defined the party&#39;s mountain passage.</p>

        <p><strong>Imperial Seal of Clan Kurohana</strong> — Issued by Daimyo Akihiko Kurohana; carried by the party. A
        diplomatic instrument calling on the independent Kaminari Clan and all factions to cooperate with investigating
        Clan Gekko&#39;s unexplained silence. Its tone is carefully measured — no blame assigned, unity emphasized. Its
        weight is significant.</p>

        <p><strong>Known Parties with Interest</strong>:</p>

        <table>

        <thead>

        <tr>

        <th>Party</th>

        <th>Interest</th>

        <th>Stance</th>

        </tr>

        </thead>

        <tbody><tr>

        <td>Taisho Hideo Nakamura (Clan Kaminari)</td>

        <td>Official mission authority</td>

        <td>Supportive; needs deniability</td>

        </tr>

        <tr>

        <td>Daimyo Kazuhiko (Clan Kaminari)</td>

        <td>Political stability; alliance balance</td>

        <td>Invested; watching</td>

        </tr>

        <tr>

        <td>Daimyo Akihiko Kurohana</td>

        <td>Balance of power; emperor assassination investigation</td>

        <td>Allied; issued the seal</td>

        </tr>

        <tr>

        <td>Order of the Black Lily</td>

        <td>Know the truth; managing information</td>

        <td>Cautious; will engage right parties</td>

        </tr>

        <tr>

        <td>Clan Gekko survivors</td>

        <td>Exist; transformed; situation desperate</td>

        <td>Location unknown</td>

        </tr>

        </tbody></table>

        </section>

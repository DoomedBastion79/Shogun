      content: >-
        <h3>Appearance</h3>

        <p>Silvered blue fur (once deep black); warm amber eyes with gold flecks; broad flat nose; well-kept grey beard;
        prayer beads; calloused bare feet; moves with surprising grace for his size.</p>


        <h3>Public Role</h3>

        <p>Elder Monk of the Order of the Tranquil Lotus. Currently traveling with Sun Wukong and a group of novices
        (Hiroshi, Kazuko, Riku, Sakura, Taro, Yumi) from Kazehama to
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.Zk6QD9Sdfud4SuRV]{Heian}. Met Relc at The Moonlit Garden
        in Heian. Revealed to Benkei a separate assignment from the one Sun Wukong carries.</p>


        <h3>Personality</h3>

        <p>Deep wisdom; contemplative; serene; booming voice carrying weight of experience.</p>


        <h3>Relationship to Party</h3>

        <p>Met the party at The Moonlit Garden in Heian. Sun Wukong traveled with Benkei from Kazehama before receiving
        his own assignment. Benkei has things to say to Relc that couldn&#39;t be said with other ears around.</p>

        <section class="secret kg-secret-discoverable">

        <p><strong>True Nature</strong></p>

        <p><em>discoverable</em></p>

        <p>His decades of pilgrimages and contemplative life mask a deeper purpose connected to the Order of the Ancient
        Guard.</p>


        </section>

        <section class="secret kg-secret-discoverable">

        <p><strong>Connections</strong></p>

        <p><em>discoverable</em></p>

        <p>Joined the Tranquil Lotus at age 16; trained under Master Daizen; decades of pilgrimages; appointed Elder
        Monk. His separate assignment from Sun Wukong&#39;s delegation suggests responsibilities beyond the monastic
        order.</p>


        </section>

        <section class="secret kg-secret-discoverable">

        <p><strong>Quest Seeds</strong></p>

        <p><em>discoverable</em></p>

        <div class="kg-quest-seed" data-kind="quest-seed"><span class="kg-quest-seed__label">QUEST SEED</span> Benkei
        has information for Relc that he could not share with others present — this conversation is pending.

        <strong>[QUEST SEED]</strong> Benkei&#39;s message may reach the party via courier in
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.O65fxIh1WZwEtwrf]{Ayame} or via a note left at the gold
        doors.</div>



        </section>

        <section class="secret kg-secret-sealed">

        <p><strong>Campaign Secrets</strong></p>

        <p><em>sealed</em></p>

        <p>Member of the Order of the Ancient Guard (rank TBD). The Ancient Guard is a secret order connected to the
        living dragons — the campaign&#39;s deepest thread. Benkei&#39;s membership connects him to
        @UUID[Compendium.kagekuni-assistant.npcs-lore.JournalEntry.Yk0fOJkKYfbgC0jU]{Solas Evergreen} (deceased, also
        Ancient Guard) and @UUID[Compendium.kagekuni-assistant.npcs-lore.JournalEntry.eBDxeG8Ot80eeBvJ]{Tsubaki}
        (Crimson Shrine keeper, Ancient Guard Initiate).</p>

        <p>The Order of the Ancient Guard has been compromised by Solas&#39;s death. Benkei is an active member
        navigating a crisis within the order.</p>


        </section>

        <section class="secret kg-secret-sealed">

        <p><strong>Plot Threads</strong></p>

        <p><em>sealed</em></p>

        <ul>

        <li>Order of the Ancient Guard — active member; order compromised by Solas&#39;s death</li>

        <li>Connection to Relc through Solas Evergreen&#39;s legacy</li>

        <li>Living dragons secret — the campaign&#39;s deepest thread</li>

        <li>Information for Relc that requires a private conversation</li>

        <li>Traveling to Heian — may cross the party&#39;s path again</li>

        </ul>


        </section>

      content: >-
        <h3>Appearance</h3>

        <p>Black hair with silver streaks.</p>


        <h3>Public Role</h3>

        <p>Daimyo and supreme leader of Clan Kaminari, the dominant clan governing the province of
        @UUID[Compendium.assistant.lore.JournalEntry.0PBRectAa16xVvjt]{Hana} and the imperial capital of
        @UUID[Compendium.assistant.lore.JournalEntry.Zk6QD9Sdfud4SuRV]{Heian}. Commands one of the most powerful
        military and political structures in Kagekuni.</p>


        <h3>Personality</h3>

        <p>Stern, commanding; values loyalty; enjoys battle, thunder, and strategy; strict code of honor.</p>


        <h3>Relationship to Party</h3>

        <p>No direct contact. The party operates under the authority of his clan through Taisho
        @UUID[Compendium.assistant.npcs-lore.JournalEntry.l41icMnxACSIzz72]{Hideo Nakamura}. Dian Wei received sealed
        orders from Daimyo Kazuhiko (Kurohana) — note that both independent clan daimyo share the Kazuhiko name, which
        can cause confusion.</p>

        <section class="secret kg-secret-discoverable">

        <p><strong>True Nature</strong></p>

        <p><em>discoverable</em></p>

        <p>Doubts the accusations against Dian&#39;s father regarding the emperor&#39;s assassination. Actively
        investigating the true culprits behind the emperor&#39;s death. Has allies within rival clans who are
        sympathetic to his cause.</p>


        </section>

        <section class="secret kg-secret-discoverable">

        <p><strong>Connections</strong></p>

        <p><em>discoverable</em></p>

        <p>Allied with elements in rival clans who share his doubts about the official narrative of the emperor&#39;s
        assassination. His parallel investigation with
        @UUID[Compendium.assistant.npcs-lore.JournalEntry.PvAlkONFgMVdtZW9]{Akihiko Kurohana} (Daimyo of Clan Kurohana)
        suggests a level of cross-clan cooperation that is unusual and politically significant.</p>


        </section>

        <section class="secret kg-secret-discoverable">

        <p><strong>Quest Seeds</strong></p>

        <p><em>discoverable</em></p>

        <div class="kg-quest-seed" data-kind="quest-seed"><span class="kg-quest-seed__label">QUEST SEED</span> May send
        the party to gather evidence exonerating Dian&#39;s father; possesses strategic resources and insights that
        could advance the assassination investigation.</div>



        </section>

        <section class="secret kg-secret-sealed">

        <p><strong>Campaign Secrets</strong></p>

        <p><em>sealed</em></p>

        <p>Both Daimyo Kazuhiko (Kaminari) and Daimyo Akihiko (Kurohana) are independently investigating the
        emperor&#39;s assassination — the fact that two of the three independent clans doubt the official narrative is a
        significant political fact that has not been surfaced.</p>


        </section>

        <section class="secret kg-secret-sealed">

        <p><strong>Plot Threads</strong></p>

        <p><em>sealed</em></p>

        <ul>

        <li>Emperor&#39;s assassination investigation — active; truth unknown</li>

        <li>Connection to Dian Wei&#39;s personal arc through his father&#39;s accusation</li>

        <li>Succession crisis — as Daimyo of the clan holding the capital, his position on the succession question
        carries enormous weight</li>

        </ul>


        </section>

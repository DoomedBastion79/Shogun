      content: >-
        <h3>Appearance</h3>

        <p>Unknown in current state. Formerly the Daimyo of Clan Gekkō, the third independent clan governing
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.D2VV9bFa1txuKDxB]{Kaze}
        province from Hokori.</p>


        <h3>Public Role</h3>

        <p>Daimyo of Clan Gekkō. His disappearance and the silence of the entire Gekkō Clan is the central mystery
        driving the party&#39;s primary mission.</p>


        <h3>Personality</h3>

        <p>Unknown in current state.</p>


        <h3>Relationship to Party</h3>

        <p>No contact. The party has been assigned to investigate his disappearance and the silence of Clan Gekkō.</p>

        <section class="secret kg-secret-discoverable">

        <p><strong>True Nature</strong></p>

        <p><em>discoverable</em></p>

        <p>Missing. The entire Gekkō Clan has gone silent. The party&#39;s primary mission is to investigate this
        disappearance.</p>


        </section>

        <section class="secret kg-secret-discoverable">

        <p><strong>Connections</strong></p>

        <p><em>discoverable</em></p>

        <p>Clan Gekkō had a long and close relationship with the Order of the Black Lily, who provided intelligence and
        covert capability in exchange for cover and protection. The clan&#39;s disappearance has severed the Order&#39;s
        primary institutional support structure.</p>


        </section>

        <section class="secret kg-secret-discoverable">

        <p><strong>Quest Seeds</strong></p>

        <p><em>discoverable</em></p>

        <div class="kg-quest-seed" data-kind="quest-seed"><span class="kg-quest-seed__label">QUEST SEED</span> The full
        reveal of Masota&#39;s fate is intended to occur at the Monastery of the Black Lily in
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.ow3AGqlvFevncAwN]{Akatsuki}.</div>



        </section>

        <section class="secret kg-secret-sealed">

        <p><strong>Campaign Secrets</strong></p>

        <p><em>sealed</em></p>

        <p>Masota no Gekkō has been transformed into a Nagaji by a dark ritual gone wrong. He underwent the ritual in a
        final attempt to maintain leadership of his people after many clan members were transformed. His current state
        of mind is fragmented awareness — he retains a broken understanding of what happened and recognizes his mistake.
        Coherence degrades over time; the longer the party takes to reach him, the less of Masota is left to reach. This
        creates urgency without hard deadlines.</p>

        <p>The Order of the Black Lily knows the full truth: what ritual was used, who performed it first, approximately
        how many Gekkō clan members were transformed, and that Masota himself underwent the ritual. They have been
        unable to locate him — the transformed Gekkō move in patterns that even their surveillance cannot consistently
        track.</p>

        <p>A reversal exists — theoretical, not practical. It requires three elements: the original ritual documentation
        (which exists in Kinkōkyo, in the Golden Dragon Clan&#39;s records addressing Kokuryū&#39;s historical
        experimentation with transformation); a specific sei configuration present only during a particular celestial
        alignment (upcoming — within the next few sessions); and a practitioner capable of performing sei-based
        restoration at significant scale.</p>


        </section>

        <section class="secret kg-secret-sealed">

        <p><strong>Plot Threads</strong></p>

        <p><em>sealed</em></p>

        <ul>

        <li>Central mystery of the current campaign arc</li>

        <li>Nagaji transformation — the party has killed multiple Nagaji without knowing they were transformed Gekkō
        clan members; moral weight of this revelation is pending</li>

        <li>Temple of Kinryū may contain the reversal documentation</li>

        <li>Order of the Black Lily at Akatsuki holds the full truth and will propose a partnership</li>

        <li>@UUID[Compendium.kagekuni-assistant.npcs-lore.JournalEntry.udwRiTyeMAQlEg5h]{Haruto Masashige}&#39;s ancient
        Dragonborn purification/restoration rite is directly applicable to the Nagaji situation if someone connects the
        dots</li>

        </ul>


        </section>

      content: >-
        <h3>Appearance</h3>

        <p>Gold scales; bright blue eyes.</p>


        <h3>Public Role</h3>

        <p>Captain of the Guard in @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.8BPLYleAkYpmvX5a]{Kikyo},
        operating from the Kikyo Guard Compound. Maintains a small but highly capable force; primary duties are
        licensing enforcement and forest protection for the Seidōrin Mori (Bronze Wood Forest). Building an informant
        network in Kikyo.</p>


        <h3>Personality</h3>

        <p>Stoic, disciplined; fierce loyalty; strong sense of justice.</p>


        <h3>Relationship to Party</h3>

        <p>Arrested Ko&#39;jiri in Kikyo before the situation was resolved by
        @UUID[Compendium.kagekuni-assistant.npcs-lore.JournalEntry.gzeHJBD2MSIEL1L6]{Ren Nakamura}&#39;s offer of the
        Summons and Conditional Pardon. Their initial interaction was adversarial but professional. Can become a staunch
        ally to those who prove their integrity.</p>

        <section class="secret kg-secret-discoverable">

        <p><strong>True Nature</strong></p>

        <p><em>discoverable</em></p>

        <p>Building his informant network not simply for Kikyo&#39;s local security but because he suspects something
        significant is happening with the Bronze Wood licensing system. He has noticed irregularities in the licensing
        records — specific harvesting zones consistently licensed to a single merchant entity, with documentation that
        is technically correct but structured to obscure the pattern. He is three to four months away from having enough
        evidence to bring forward as a coherent accusation.</p>


        </section>

        <section class="secret kg-secret-discoverable">

        <p><strong>Connections</strong></p>

        <p><em>discoverable</em></p>

        <p>Knows ancient Dragonborn rituals potentially crucial to certain quests. His family&#39;s oral tradition
        preserves knowledge from the Golden Dragon Clan&#39;s Dragonborn lineages.</p>


        </section>

        <section class="secret kg-secret-discoverable">

        <p><strong>Quest Seeds</strong></p>

        <p><em>discoverable</em></p>

        <div class="kg-quest-seed" data-kind="quest-seed"><span class="kg-quest-seed__label">QUEST SEED</span> Haruto
        sends word to the party in @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.Zk6QD9Sdfud4SuRV]{Heian}: he
        has found something in the licensing records that connects to their mission and needs outside help to pursue
        it.</div>



        </section>

        <section class="secret kg-secret-sealed">

        <p><strong>Campaign Secrets</strong></p>

        <p><em>sealed</em></p>

        <p>Haruto Masashige&#39;s knowledge of ancient Dragonborn rituals is not merely historical curiosity. It
        includes a purification and restoration rite that the Golden Dragon Clan&#39;s Dragonborn lineages preserved — a
        rite that is part of the process for reversing certain magical transformations. He doesn&#39;t know its current
        relevance, but the ritual exists in his family&#39;s oral tradition and would be directly applicable to the
        Nagaji situation if someone connected the dots.</p>

        <p>His licensing investigation is on a collision course with Ren Nakamura&#39;s secret alliance with the
        merchant guild. When these threads converge, Haruto will be in danger.</p>


        </section>

        <section class="secret kg-secret-sealed">

        <p><strong>Plot Threads</strong></p>

        <p><em>sealed</em></p>

        <ul>

        <li>Bronze Wood licensing investigation — will eventually expose Ren Nakamura&#39;s merchant guild alliance</li>

        <li>Ancient Dragonborn restoration rite — directly applicable to reversing the Nagaji transformation</li>

        <li>Ko&#39;jiri connection — their adversarial first meeting could become a significant alliance</li>

        <li>Potential danger when his investigation threatens the merchant guild&#39;s interests</li>

        </ul>


        </section>

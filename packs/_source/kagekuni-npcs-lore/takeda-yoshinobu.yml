        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-appearance"
        data-section="appearance">Appearance</h3>

        <p>Not described in detail.</p>

        <h3 id="kg-public-role" data-section="public-role">Public Role</h3>

        <p>Town leader of Ayame under the military overseer structure. Competent administrator, pragmatic in approach.
        Ayame is the valley town at the base of the Tenchūsan Ren pass — the primary land route between Hana&#39;s
        southern lowlands and the northern provinces. Population 638.</p>

        <h3 id="kg-personality" data-section="personality">Personality</h3>

        <p>Pragmatic; not deeply allied with any major faction; protects Ayame&#39;s neutrality because it is
        economically important.</p>

        <h3 id="kg-relationship-to-party" data-section="relationship-to-party">Relationship to Party</h3>

        <p>No direct contact established. The party passed through Ayame during their transit to the mountains.</p>

        </section>

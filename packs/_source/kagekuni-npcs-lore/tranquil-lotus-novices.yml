        lang="ja-Latn">Six novice monks traveling with Benkei from Kazehama to Heian</em></p>

        <p>Group of novices under Elder Benkei&#39;s guidance. Traveling by boat from Kazehama monastery. Kazuko raised
        the alarm about the river serpent (possibly Nagaji) during the journey.</p>

        <h2 id="kg-individual-novices" data-section="individual-novices">Individual Novices</h2>

        <ul>

        <li><strong>Hiroshi</strong> — novice (NOTE: distinct from Hiroshi Nakamura, Shugo of Heian)</li>

        <li><strong>Kazuko</strong> — raised alarm about river serpent; observant</li>

        <li><strong>Riku</strong> — novice</li>

        <li><strong>Sakura</strong> — novice</li>

        <li><strong>Taro</strong> — novice (NOTE: distinct from Taro Fukomoto, blacksmith)</li>

        <li><strong>Yumi</strong> — novice</li>

        </ul>

        <h2 id="kg-status" data-section="status">Status</h2>

        <p>Currently with Benkei. Last known context: traveled from Kazehama to Heian. Benkei received a separate
        assignment; unclear if novices continue with Benkei or remain in Heian.</p>

        </section>

      content: >-
        <h3>Appearance</h3>

        <p>Long silver hair; piercing green eyes; kimono with leaf and vine patterns.</p>


        <h3>Public Role</h3>

        <p>Hyōrō Bugyō (Provisions Commissioner) of Clan Kaminari. Responsible for logistics, supply chains, and
        resource management across the clan&#39;s operations. Present alongside
        @UUID[Compendium.kagekuni-assistant.npcs-lore.JournalEntry.l41icMnxACSIzz72]{Hideo Nakamura} when the party
        received their mission briefing at the Tensho no Mon district.</p>


        <h3>Personality</h3>

        <p>Exceptionally intelligent, organized, calm, authoritative; values order and efficiency; compassionate beneath
        stern exterior; integrity and fairness renowned.</p>


        <h3>Relationship to Party</h3>

        <p>Present at mission briefing in Tensho no Mon. Met the party alongside Taisho Hideo Nakamura.</p>

        <section class="secret kg-secret-discoverable">

        <p><strong>True Nature</strong></p>

        <p><em>discoverable</em></p>

        <p>Member of the Elven Council. Suspects some council members are corrupt and misusing resources. Quietly
        investigating on his own.</p>


        </section>

        <section class="secret kg-secret-discoverable">

        <p><strong>Connections</strong></p>

        <p><em>discoverable</em></p>

        <p>Member of the Elven Council — a body with significant but largely unseen influence. Has merchant guild
        connections through his role as Provisions Commissioner. Skilled mediator with access to maps and logistical
        support.</p>


        </section>

        <section class="secret kg-secret-discoverable">

        <p><strong>Quest Seeds</strong></p>

        <p><em>discoverable</em></p>

        <div class="kg-quest-seed" data-kind="quest-seed"><span class="kg-quest-seed__label">QUEST SEED</span> Needs
        discreet help investigating Elven Council corruption; has merchant guild connections; can provide maps and
        logistical support; skilled mediator who could be a valuable ally.</div>



        </section>

        <section class="secret kg-secret-sealed">

        <p><strong>Campaign Secrets</strong></p>

        <p><em>sealed</em></p>

        <p>The Elven Council corruption investigation is a thread that could connect to broader political machinations.
        The specifics of the corruption — what resources are being misused and by whom — are undeveloped.</p>


        </section>

        <section class="secret kg-secret-sealed">

        <p><strong>Plot Threads</strong></p>

        <p><em>sealed</em></p>

        <ul>

        <li>Elven Council corruption — parallel investigation thread</li>

        <li>Logistical support — as Provisions Commissioner, he controls supply access that could be critical</li>

        <li>Connection to the party through the mission briefing — he knows what they were sent to do</li>

        </ul>


        </section>

      content: >-
        <h3>Appearance</h3>

        <p>Not described in detail.</p>


        <h3>Public Role</h3>

        <p>Chief Inspector of the Imperial Police stationed in
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.O65fxIh1WZwEtwrf]{Ayame}, the mountain waypoint town at
        the base of the Tenchūsan Ren pass. His authority and presence represent imperial law enforcement in this
        critical transit chokepoint.</p>


        <h3>Personality</h3>

        <p>Stern, meticulous, exudes authority.</p>


        <h3>Relationship to Party</h3>

        <p>Confirmed party ally. Returned the impounded wagon, horses, and treasures after assessing the situation.
        Provided a reward. Believed in the party&#39;s innocence or usefulness. His intelligence contacts are
        potentially useful going forward.</p>

        <section class="secret kg-secret-discoverable">

        <p><strong>True Nature</strong></p>

        <p><em>discoverable</em></p>

        <p>His decision to assist the party was not simply a judgment about their innocence. He had received information
        from his intelligence network suggesting the party&#39;s mission was legitimate and the impoundment was creating
        an obstacle to something he wanted to see succeed. He knows more about the Gekkō situation than he has shared
        and has been watching for trustworthy parties to pass through.</p>


        </section>

        <section class="secret kg-secret-discoverable">

        <p><strong>Connections</strong></p>

        <p><em>discoverable</em></p>

        <p>Maintains an informant network in Ayame and the surrounding region. Has informants at both the waypoint inn
        (Kin no Chōchin Ryokan) and the outfitter district who log significant travelers and goods movements. This
        network detected the party&#39;s arrival and departure. It also detected other parties moving through the pass —
        including a group with no identifiable clan affiliation, moving fast and carrying unusual cargo, approximately
        three weeks before the party&#39;s transit.</p>


        </section>

        <section class="secret kg-secret-discoverable">

        <p><strong>Quest Seeds</strong></p>

        <p><em>discoverable</em></p>

        <div class="kg-quest-seed" data-kind="quest-seed"><span class="kg-quest-seed__label">QUEST SEED</span> Oshiro
        sends a discrete message to the party: he has information relevant to their mission that he couldn&#39;t share
        safely in Ayame; he proposes a meeting at the next Michibata up the pass.</div>



        </section>

        <section class="secret kg-secret-sealed">

        <p><strong>Campaign Secrets</strong></p>

        <p><em>sealed</em></p>

        <p>Oshiro is a potential ongoing intelligence ally — someone who knows which questions to ask and where to find
        answers, even with the Teikoku Keisatsu operating at reduced capacity in the current political vacuum. His
        knowledge of the Gekkō situation extends beyond what he has shared.</p>

        <p>The unidentified group that passed through the pass three weeks before the party — fast-moving, no clan
        affiliation, unusual cargo — is an unresolved intelligence thread.</p>


        </section>

        <section class="secret kg-secret-sealed">

        <p><strong>Plot Threads</strong></p>

        <p><em>sealed</em></p>

        <ul>

        <li>Intelligence ally for future information needs</li>

        <li>Knowledge of the Gekkō situation he has not yet shared</li>

        <li>Unidentified group in the pass — potential connection to Nagaji activity, Eikyū Yami, or other threats</li>

        <li>Operating in a political vacuum — the Teikoku Keisatsu&#39;s reduced capacity affects what he can do
        officially</li>

        </ul>


        </section>

        <section class="kg-tier kg-tier-sealed" data-tier="sealed"><h3 id="kg-campaign-secrets"
        data-section="campaign-secrets">Campaign Secrets</h3>

        <p>Both Daimyo Kazuhiko (Kaminari) and Daimyo Akihiko (Kurohana) are independently investigating the
        emperor&#39;s assassination — the fact that two of the three independent clans doubt the official narrative is a
        significant political fact that has not been surfaced.</p>

        <h3 id="kg-plot-threads" data-section="plot-threads">Plot Threads</h3>

        <ul>

        <li>Emperor&#39;s assassination investigation — active; truth unknown</li>

        <li>Connection to Dian Wei&#39;s personal arc through his father&#39;s accusation</li>

        <li>Succession crisis — as Daimyo of the clan holding the capital, his position on the succession question
        carries enormous weight</li>

        </ul>

        </section>

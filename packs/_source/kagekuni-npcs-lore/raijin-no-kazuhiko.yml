        <section class="kg-tier kg-tier-discoverable" data-tier="discoverable"><h3 id="kg-true-nature"
        data-section="true-nature">True Nature</h3>

        <p>Doubts the accusations against Dian&#39;s father regarding the emperor&#39;s assassination. Actively
        investigating the true culprits behind the emperor&#39;s death. Has allies within rival clans who are
        sympathetic to his cause.</p>

        <h3 id="kg-connections" data-section="connections">Connections</h3>

        <p>Allied with elements in rival clans who share his doubts about the official narrative of the emperor&#39;s
        assassination. His parallel investigation with Akihiko Kurohana (Daimyo of Clan Kurohana) suggests a level of
        cross-clan cooperation that is unusual and politically significant.</p>

        <h3 id="kg-quest-seeds" data-section="quest-seeds">Quest Seeds</h3>

        <div class="kg-quest-seed" data-kind="quest-seed"><span class="kg-quest-seed__label">QUEST SEED</span> May send
        the party to gather evidence exonerating Dian&#39;s father; possesses strategic resources and insights that
        could advance the assassination investigation.</div>


        </section>

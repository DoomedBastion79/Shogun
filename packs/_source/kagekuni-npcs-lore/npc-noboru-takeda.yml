        <h3>Appearance</h3>

        <p>Unkempt brown hair; pale skin; dark brown eyes showing arrogance and apathy.</p>


        <h3>Public Role</h3>

        <p>Mid-level military commander under Clan Kurohana. His commission was bought by family wealth — the Takeda
        family is one of the wealthiest in the region. His subordinates know he is incompetent.</p>


        <h3>Personality</h3>

        <p>Arrogant, apathetic; believes family wealth entitles him to respect; incompetent; dislikes hard work. Known
        by the alias &quot;The Disgraceful.&quot;</p>


        <h3>Relationship to Party</h3>

        <p>No contact established.</p>

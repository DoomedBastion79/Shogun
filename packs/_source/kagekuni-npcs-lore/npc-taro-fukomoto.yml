      content: >
        <h3>Appearance</h3>

        <p>Over 6 feet tall; broad shoulders; muscular; tanned weathered skin; thick black beard flecked with silver;
        dark intense eyes; leather apron; flame and mythical creature tattoos on arms.</p>


        <h3>Public Role</h3>

        <p>Owner and master smith of Taro&#39;s Forge in the Kurogane-sho (Steel Precinct) district of
        @UUID[Compendium.assistant.lore.JournalEntry.Zk6QD9Sdfud4SuRV]{Heian}. The district&#39;s most prestigious
        establishment. Renowned for both quality and integrity. Produces weapons and armor of exceptional craftsmanship;
        maintains a small stock for immediate sale and takes commissions that can take months to complete.</p>


        <h3>Personality</h3>

        <p>Renowned for skill AND integrity; approachable; booming laugh; willing to share knowledge with apprentices;
        balances strength with artistry.</p>


        <h3>Relationship to Party</h3>

        <p>No direct contact established. His forge is the most notable establishment in the Kurogane-sho district that
        the party has access to in Heian.</p>

        <section class="kg-tier kg-tier-discoverable" data-tier="discoverable"><ul>

        <li>Clan Gekko&#39;s disappearance was not caused by an outside force -- the senior seimasters attempted
        something that went catastrophically wrong.</li>

        <li>The Order of the Black Lily knows the truth about what happened and has made a calculated decision about
        when to reveal it.</li>

        <li>The Hollow Peaks were structures of the Onyx Dragon Clan -- hollow mountains used as nesting and storage
        spaces.</li>

        <li>The gorge carvings depict something connected to the transformation that befell Clan Gekko.</li>

        </ul>

        </section>

        <section class="kg-tier kg-tier-sealed" data-tier="sealed"><h3
        id="kg-the-nagaji-truth----core-campaign-revelation"
        data-section="the-nagaji-truth----core-campaign-revelation">The Nagaji Truth -- Core Campaign Revelation</h3>

        <p>Clan Gekko&#39;s disappearance was not caused by an outside force. The clan&#39;s senior seimasters,
        searching for a way to elevate their shadow magic capability, discovered fragmentary texts describing an Onyx
        Dragon ritual -- a transformation rite tied to Kokuryu. It transformed those who underwent it into Nagaji --
        serpentine humanoids driven by new instincts they cannot fully suppress. The transformation spread. Masota no
        Gekko himself underwent the ritual last, in a desperate attempt to maintain control. He is now Nagaji as well --
        somewhere in the Kaze highlands.</p>

        <h3 id="kg-the-order-of-the-black-lily----what-they-know"
        data-section="the-order-of-the-black-lily----what-they-know">The Order of the Black Lily -- What They Know</h3>

        <p>The Order knows the truth about the Nagaji transformation. Several operatives witnessed the early stages. The
        Order has made a calculated decision: the information is too dangerous to release without a reversal plan. They
        will share the complete truth with parties who reach them -- but only the complete truth, no partial
        admissions.</p>

        <h3 id="kg-is-the-transformation-reversible" data-section="is-the-transformation-reversible">Is the
        Transformation Reversible?</h3>

        <p>Yes -- but the answer lies in the Temple of Kinryu, specifically in the clan&#39;s records about
        Kokuryu&#39;s original ritual and the countermeasure that the Golden Dragon Clan developed. This creates a
        direct link between the party&#39;s current location (the gold doors) and the Kaze storyline.</p>

        <h3 id="kg-masota-no-gekko----current-state" data-section="masota-no-gekko----current-state">Masota no Gekko --
        Current State</h3>

        <p>He is alive, in the Kaze highlands. He retains fragments of his original identity but the transformation
        suppresses rational thought during stress or combat. He is not a villain. He is a leader who made a terrible
        decision in desperation. A potential redemption arc exists if the party can find a reversal.</p>

        <h3 id="kg-the-hollow-peaks" data-section="the-hollow-peaks">The Hollow Peaks</h3>

        <p>These were Onyx Dragon Clan structures. The interior of at least one is accessible from the gorge. What
        remains inside is ancient and significant: Onyx Clan cultural artifacts, including documentation of the
        transformation ritual.</p>

        <h3 id="kg-plot-hooks" data-section="plot-hooks">Plot Hooks</h3>

        <ul>

        <li>The Order of the Black Lily sends a message via an intermediary: &quot;Come to Akatsuki. Come alone. Come
        before the moon is full.&quot;</li>

        <li>Masota no Gekko leaves something behind at a ransacked site -- something a transformed being could not have
        done deliberately unless part of him was still trying to communicate</li>

        <li>A scholar in Mikazuki has been studying the gorge carvings for years and has just realized what they
        depict</li>

        </ul>

        </section>

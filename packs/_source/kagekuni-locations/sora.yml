        <section class="kg-tier kg-tier-sealed" data-tier="sealed"><h3 id="kg-the-abandoned-observatory-records"
        data-section="the-abandoned-observatory-records">The Abandoned Observatory Records</h3>

        <p>The sealed records in the collapsed fourth observatory contain documentation of a celestial alignment the
        Kinryu-era seimasters considered dangerous. The alignment -- involving all three stars, two specific moons, and
        a specific planetary configuration -- they called Ryushinki (Dragon Awakening). Their records suggest this
        alignment is associated with the founding dragons becoming active, visible, or vulnerable. The next occurrence
        is calculable and is not far away.</p>

        <h3 id="kg-the-silver-dragon-connection" data-section="the-silver-dragon-connection">The Silver Dragon
        Connection</h3>

        <p>Ginryu, the Silver Dragon, is connected to Sora through the province&#39;s astronomical nature. She has been
        known to spend time on the Hoshimori Plateau. The plateau&#39;s unusual stellar appearance is partly her
        influence. She has not been seen in decades, but her presence would explain the plateau&#39;s anomalous sei
        readings.</p>

        <h3 id="kg-plot-hooks" data-section="plot-hooks">Plot Hooks</h3>

        <ul>

        <li>One of the functional observatories has started producing readings matching the Ryushinki pattern ahead of
        schedule -- something is wrong with the calculation, or something is accelerating</li>

        <li>A seimaster from Hoshimori sent a letter ahead that references &quot;something moving in the clouds that is
        not a cloud&quot;</li>

        </ul>

        </section>

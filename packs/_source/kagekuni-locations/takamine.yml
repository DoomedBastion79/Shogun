      content: >-
        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-overview"
        data-section="overview">Overview</h3>

        <p>Takamine is a village of honest poverty. It sits in the shadow of Kinryuzan (Gold Dragon Mountain) at the
        head of the Star River, in a valley receiving less direct sunlight due to the mountain&#39;s angle. The small
        iron mine that sustains the village produces modest yields -- enough to keep the operation viable, not enough to
        generate real prosperity. Thin, rocky soil supplements mining income through limited farming.</p>

        <p>The community is close-knit in the way that difficult circumstances produce -- people who depend on each
        other genuinely. Visitors are noticed. Help is offered and received as a matter of course. The village has a
        pride rooted in endurance.</p>

        <h3 id="kg-notable-establishments" data-section="notable-establishments">Notable Establishments</h3>

        <p><strong>Ryu no Tetsu Ryokan (Dragon&#39;s Iron Inn)</strong> -- The village&#39;s single inn. Comfortable by
        local standards. The innkeeper&#39;s family has run it for four generations.</p>

        <p><strong>Ryu no Iki Kajiba (Dragon&#39;s Breath Forge)</strong> -- The village forge, working primarily in
        local iron. The smith produces tools and hardware; technically capable of weapons work.</p>

        <p><strong>General Shop</strong> -- Combined general goods; also serves as the mine company store.</p>

        <p><strong>Village Temple</strong> -- Small and well-maintained despite the village&#39;s poverty. The community
        invests disproportionately in its upkeep as collective identity.</p>

        <h3 id="kg-key-figures" data-section="key-figures">Key Figures</h3>

        <ul>

        <li>Yamamoto Kenji -- Village leader -&gt; npcs/yamamoto-kenji.md</li>

        </ul>

        </section>

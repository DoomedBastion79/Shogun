        <p>The middle of the ascent. Wind-exposed; the temple roofline is visible above for the first time on this
        level. Several stretches of the outer parapet have collapsed.</p>

        <p><strong>Puzzle elements on this level:</strong></p>

        <ul>

        <li><strong>Two Watchers</strong> — two dragon-head statues, one near the entry stair from Level 2 and one near
        the exit stair to Level 4. Both kindle when passed.</li>

        <li><strong>The Faithful Pedestal</strong> — set among the rubble of the partially-collapsed parapet, but the
        pedestal itself is undamaged.<ul>

        <li><strong>Vow:</strong> <em lang="ja-Latn">&quot;I come without doubt of the path.&quot;</em></li>

        <li><strong>Pilgrim:</strong> <em lang="ja-Latn">Mishima Aiko · year 13083</em> (suggested)</li>

        <li>The prayer: name, vow, silence.</li>

        </ul>

        </li>

        </ul>

        <h2 id="kg-the-faithful-pedestal-level-3" data-section="the-faithful-pedestal-level-3">The Faithful Pedestal —
        Level 3</h2>

        <p><em lang="ja-Latn">The pedestal on the third terrace, standing whole among the rubble of the collapsed
        parapet. The DM may reveal this page when the party examines it.</em></p>

        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-read-aloud-the-faithful-pedestal" data-section="read-aloud-the-faithful-pedestal">Read-Aloud
        — The Faithful Pedestal</h4></header>

        <p><em lang="ja-Latn">Here on the wind-scoured middle terrace, where stretches of the outer parapet have
        collapsed and the temple roofline shows above for the first time, a third squared pillar stands among the fallen
        stone. The rubble has spared it entirely — it is undamaged, upright, its worked surface clean.</em></p>

        <p><em lang="ja-Latn">The deep-cut vow:</em></p>

        <p><em lang="ja-Latn">&quot;I come without doubt of the path.&quot;</em></p>

        <p><em lang="ja-Latn">And the name and year set beside it:</em></p>

        <p><em lang="ja-Latn">&quot;Mishima Aiko · year 13083.&quot;</em></p>

        <p><em lang="ja-Latn">Whole and unbroken amid the ruin of the parapet around it, the pedestal makes its own
        quiet argument. The same faint warmth-that-is-not-quite-warmth waits in the carved letters under your
        hand.</em></p>


        </article>

        </div>




        <p>The third of the four pedestals. Its vow — <em lang="ja-Latn">&quot;I come without doubt of the
        path&quot;</em> — concerns <em lang="ja-Latn">faith</em>, and the path has arranged for it to be spoken in the
        one place where a climber&#39;s faith might most reasonably waver: amid collapse, high and exposed, the
        destination only now coming into view. The pilgrim-name beside it is <em lang="ja-Latn">Mishima Aiko ·
        13083</em>.</p>

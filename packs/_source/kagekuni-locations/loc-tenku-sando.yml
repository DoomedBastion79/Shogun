      content: >-
        <section id="sec-rm-tenku-sando-overview--dm-notes-intro" class="secret kg-secret-sealed kg-sealed-dm-notes"
        data-kind="dm-notes">

        <ul>

        <li>The Sandō is encountered <strong>before</strong> the temple. The puzzle should <em
        lang="ja-Latn">preferably</em> be solvable from the path alone, since players are unlikely to backtrack
        mid-delve. Interior knowledge (the Order of Ascent as a found item) can enrich the solution but is not the sole
        key — Sun Wukong&#39;s monk training is a viable recall path (Religion DC 18).</li>

        <li>The puzzle is optional. The party can walk straight up to the gold doors without engaging it. The gold doors
        open without it. What the puzzle gates is what lies <em lang="ja-Latn">beyond</em> the doors — specifically, the
        broad chamber
        (@UUID[Compendium.kagekuni-assistant.locations.JournalEntry.TNV9pLqaBUzySDRl.JournalEntryPage.tqUpQPP3v45gUDzI]{the
        Grand Hall — Hiroba}). Until the Sandō is awoken, frame the chamber inside as inaccessible / sealed /
        dust-cloaked (final mechanism TBD; see puzzle supplement).</li>

        <li>The Sleeping Dragon&#39;s reveal is the single biggest visual moment on the Sandō. Hold it. When the puzzle
        resolves: a stir, a long shudder, sheets of moss and earth and rooted growth sliding off the statue and into the
        basin in slow, almost-silent collapse, dust rising, and underneath, <em lang="ja-Latn">gold</em>. Amber eyes
        open last.</li>

        <li>The buried-stone framing is a deliberate misdirect. None of the eight dragon-heads or the Level-2 statue are
        actually stone — they are gold beneath millennia of accumulation. A successful Investigation / History /
        Religion / Nature roll can hint at this (the surface is too uniformly cool, the moss doesn&#39;t take root
        deeply, the underlying material rings differently when tapped). Don&#39;t make this trivial; it&#39;s a reward
        for poking.</li>

        <li><strong>The cascade</strong> — when the party completes the rite, write their name and the current year on
        the Level-4 pedestal in narration; describe the existing inscriptions shifting down by one position; describe
        the Level-1 name (<em lang="ja-Latn">Saitō Hagumi</em>) fading from its stone as if absorbed back into it. This
        is the path&#39;s living memory at work — it is a real reward, not flavour. Their names are now part of the
        Sandō until the next pilgrim group completes the rite.</li>

        <li>The Nagaji ignore the Sandō entirely. They have walked this path for centuries without ever recognising what
        it is. Their indifference is a quiet clue.</li>

        <li>The four suggested pilgrim names (Saitō Hagumi 13062 / Tachibana Riku 13074 / Mishima Aiko 13083 / Ono Kazue
        13087) are placeholders — replace if specific canon clan-priests are preferred. The years are deliberately set
        in the late sei-drought period; these were the last to keep the path alive as the connection faded.</li>

        <li>Weather on the Sandō is wind-exposed. Nightfall on the path is dangerous: no shelter except the lee of the
        Level-2 basin.</li>

        </ul>


        </section>

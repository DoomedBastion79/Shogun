name: Tenkū Sandō
pages:
  - _id: nwhM0bnaKN8z4qsZ
    _key: '!journal.pages!4vbzgHy9ecixxgnw.nwhM0bnaKN8z4qsZ'
    name: Campaign Role
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >
        <p><em lang="ja-Latn">&quot;The Celestial Approach&quot; — the sacred switchback that climbs the southern face
        of Ōryūzan to the gold doors of Tenkū-ji.</em></p>

        <p>The Tenkū Sandō is the formal pilgrimage approach to Ōryūzan Tenkū-ji. It carves five terraced levels into
        the mountain&#39;s southern face — each level roughly thirty feet above the last, joined by short flights of cut
        stone stairs — beginning at the upper edge of the Tenchūsan Ren passes and ending at the temple&#39;s golden
        outer doors. In the Golden Age this path would have been walked by clan-priests, novices, and pilgrims granted
        audience; today it is a half-collapsed scar of pale stone, frost-cracked steps, and weathered ornaments that the
        Nagaji travel without ceremony.</p>

        <p>The Sandō is itself a working sacred device — built on the same foundational magic as the temple. Distributed
        across its levels are <strong>eight large dragon-head statues</strong> (seven uniform Watchers and one distinct
        Threshold Head), <strong>four stone pedestals</strong>, and on the second level a <strong>coiled dragon
        statue</strong> carved from what appears to be pale weathered stone, half-buried in millennia of dirt, scree,
        lichen, and rooted growth. The dragon-heads and pedestals form a puzzle. Solved correctly, the path <em
        lang="ja-Latn">re-receives</em> its prayer — and the dragon on Level 2 wakes, sloughing thousands of years of
        accumulated debris in the process. What was apparently stone is gold beneath. A small shrine — long dormant
        behind the dragon, never hidden — wakes with it.</p>

        <p>This is the first of the <em lang="ja-Latn">restoring</em> the temple thread: the Sandō is the lock;
        @UUID[Compendium.kagekuni-assistant.locations.JournalEntry.TNV9pLqaBUzySDRl.JournalEntryPage.tqUpQPP3v45gUDzI]{the
        Grand Hall — Hiroba} — is what opens. Without prayer and travel for an age, the Sandō slept, and what slept on
        the Sandō reached as far as the great chamber beyond the gold doors. Re-prayer here is what makes the broad
        chamber accessible.</p>

        <p>For the party, this is what they ascend on their way in — encountered for the first time before the gold
        doors, before the temple, before any of its history is known.</p>

        <h2 id="kg-visible-features" data-section="visible-features">Visible Features</h2>

        <ul>

        <li><strong>Five terraced levels</strong> — each ~30 ft above the last. Pale cut stone landings linked by short
        stairs. Several stretches are partially collapsed, with rubble across the path.</li>

        <li><strong>Eight large dragon-head statues</strong> — seven uniform <em lang="ja-Latn">Watchers</em>
        distributed across the levels, each facing outward over the path, and one distinct <em lang="ja-Latn">Threshold
        Head</em> in the gold-door court above. They appear to be the same weathered stone as the path itself, though
        closer inspection finds them curiously <em lang="ja-Latn">un-cracked</em> — preserved beneath their grime, not
        eroding under it.</li>

        <li><strong>Four stone pedestals</strong> — squared waist-high fixtures spaced along the inner wall. Long
        unused. Each has a smooth circular indentation in the top surface — designed to receive something. (See the
        puzzle entry.)</li>

        <li><strong>The Sleeping Dragon (Level 2)</strong> — a coiled dragon statue set into a basin carved from the
        cliff. Apparently pale stone, almost entirely overgrown: rooted plants in the joints, lichen across the scales,
        dirt and small stones nested between the coils. The shape is unmistakable — a dragon at rest, head lowered upon
        its forelimbs — but the details have been buried for so long that no casual viewer would call it gold. It is the
        original of the path: when it wakes, the path wakes with it.</li>

        <li><strong>The Top Landing</strong> — Level 5 opens into the broad paved court before the massive ornate gold
        doors of Tenkū-ji.</li>

        </ul>

        <h2 id="kg-the-sand-puzzle" data-section="the-sand-puzzle">The Sandō Puzzle</h2>

        <p>The Sandō is a <strong>living pilgrimage</strong> — the Pilgrim&#39;s Office of Ōryūzan, written into the
        path itself.</p>

        <ul>

        <li><strong>The Seven Watchers</strong> — seven of the eight dragon-heads on the path kindle softly when passed
        by an ascending creature. Just walking the path lights them in order; the act of ascending <em
        lang="ja-Latn">is</em> the first half of the rite.</li>

        <li><strong>The Four Pedestals</strong> — one on each of Levels 1-4. Each pedestal carries two inscriptions: a
        <strong>vow</strong> to be spoken at it, and the <strong>name and year of one of the last four pilgrims</strong>
        to complete the rite. The bottom pedestal (L1) carries the oldest; the top pedestal (L4) carries the most
        recent. A <em lang="ja-Latn">prayer</em> is performed at each: read the inscribed name aloud (honor the pilgrim
        who walked before you), speak the vow, and observe a moment of silence. When the prayer is accepted, the
        pedestal warms under its grime.</li>

        <li><strong>The Threshold Head</strong> — the eighth dragon-head, on Level 5, is visibly <em
        lang="ja-Latn">different</em> — set apart in size, posture, and orientation. It will not light until every
        Watcher has been lit, every pedestal-prayer completed, and a clan-priest&#39;s <strong>Order of Ascent</strong>
        is proclaimed before it.</li>

        <li><strong>The Order of Ascent</strong> — a short ritual text. The party can encounter it two ways: (a)
        discover it as an item inside the temple (the <em lang="ja-Latn">Pilgrim&#39;s Office of Ōryūzan</em> — see
        TBD), or (b) recall it through knowledge: recognize the Sandō for what it is (Religion / History, DC 12 —
        &quot;this is a Kinryu pilgrim-path&quot;), then recall the ritual itself (Religion DC 18, monk training counts
        — Sun Wukong is the natural fit).</li>

        <li><strong>When the rite completes</strong> — the Threshold Head kindles, the Sleeping Dragon stirs, the
        centuries of accumulated debris slough off into the basin, the gold beneath is revealed, the amber eyes open,
        the head lifts. The small roadside shrine behind it — present all along, but cold — wakes.</li>

        <li><strong>And the path remembers</strong> — when the pilgrimage is completed, the party&#39;s name and the
        year are inscribed at the top pedestal; the existing names cascade down by one (L4 → L3 → L2 → L1), and the
        oldest name is lost from the bottom pedestal. The path keeps only the last four pilgrim-groups in its working
        memory.</li>

        </ul>

        <p>Because the Sandō&#39;s foundational magic is continuous with the temple&#39;s, awakening the Sandō also
        stirs what lies inside. This is the <strong>first beat of the restoring-the-temple thread</strong> — the broad
        chamber within (the Grand Hall — Hiroba) is canonically gated on this revival.</p>

        <h2 id="kg-solvability-preference" data-section="solvability-preference">Solvability Preference</h2>

        <p>The Sandō is encountered <strong>before</strong> the temple. The party is unlikely to backtrack mid-delve to
        solve a path-puzzle they walked past on the way in, so the puzzle should <em lang="ja-Latn">preferably</em> be
        solvable from the Sandō alone — its inscriptions, its structure, the buried statue, and whatever the party
        already carries (existing knowledge, gear, party composition). Interior knowledge can <em
        lang="ja-Latn">enrich</em> the solution but should not be strictly required. A puzzle that can only be unlocked
        by something inside the temple will probably never be solved.</p>

        <h2 id="kg-loot-framework" data-section="loot-framework">Loot Framework</h2>

        <p><strong>Open path</strong>: Essentially scoured. Anything portable was either taken when the temple fell or
        harvested by the Nagaji over the centuries. Set the expectation early.</p>

        <p><strong>Dragon-heads / pedestals</strong>: Not removable in any practical sense. They are anchored into the
        cliff stone and part of the puzzle mechanism. Defacing them breaks the puzzle.</p>

        <p><strong>The dormant shrine (puzzle reward)</strong>: A small, deliberately curated reward.
        Single-meaningful-item or small-set scale; not a hoard. Material to be decided — see DM notes.</p>

        <h2 id="kg-connected-entries" data-section="connected-entries">Connected Entries</h2>

        <ul>

        <li>Ōryūzan Tenkū-ji (loc-tenkuji-temple) — the gold doors at the head of the Sandō; the broad chamber (Grand
        Hall — Hiroba) is gated on this puzzle&#39;s resolution</li>

        <li>Tenchūsan Ren — the pass system below</li>

        <li>Kinkokyo (sealed) — the buried city beneath the temple</li>

        </ul>

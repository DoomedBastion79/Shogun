  - _id: NWxYYU9JxDqn9Cuu
    _key: '!journal.pages!4vbzgHy9ecixxgnw.NWxYYU9JxDqn9Cuu'
    name: The Sleeping Dragon
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >
        <h2 id="kg-the-sleeping-dragon" data-section="the-sleeping-dragon">The Sleeping Dragon</h2>

        <p><em lang="ja-Latn">The great coiled dragon statue cradled in the basin of the second terrace — the heart of
        the Sandō. The DM may reveal the dormant read-aloud when the party reaches Level 2, and the awakening read-aloud
        only at the moment the rite is completed.</em></p>

        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-read-aloud-the-sleeping-dragon-dormant"
        data-section="read-aloud-the-sleeping-dragon-dormant">Read-Aloud — The Sleeping Dragon (dormant)</h4></header>

        <p><em lang="ja-Latn">The second terrace opens against a deep recess in the cliff, and the recess is not
        empty.</em></p>

        <p><em lang="ja-Latn">Cradled in a basin carved from the mountain&#39;s own stone rests a shape it takes the eye
        a moment to assemble — and then cannot un-see. A dragon. A great one, coiled around and around itself in long
        deliberate loops, the head laid down upon the forelimbs the way a hound lays its head upon its paws, the wings
        folded tight and flat along the back in two long seams. A dragon at rest. A dragon asleep.</em></p>

        <p><em lang="ja-Latn">It is buried — truly buried. Whole ages of the mountain have settled onto it and into it.
        Lichen the colour of rust and slate carpets every coil. Rooted plants have forced their way into the seams of
        the folded wings and the joints between the loops. Dirt sits dark in the carved hollows; small stones have
        nested in every concavity. To a passing glance it is a strange knuckle of weathered rock that merely happens to
        suggest a dragon, the way a cloud happens to suggest a face.</em></p>

        <p><em lang="ja-Latn">But the longer you look, the less you believe the rock. The shape is too whole. The sleep
        is too deliberate. And the air above the basin is still — not the dead stillness of stone, but the held, even
        stillness of something breathing very, very slowly.</em></p>


        </article>

        </div>






        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-read-aloud-the-sleeping-dragon-awakening"
        data-section="read-aloud-the-sleeping-dragon-awakening">Read-Aloud — The Sleeping Dragon
        (awakening)</h4></header>

        <p><em lang="ja-Latn">The dragon stirs.</em></p>

        <p><em lang="ja-Latn">It begins as a sound more felt than heard — a deep, slow shudder running the whole length
        of the coiled body. Then the wings move. The two long folded seams along the back begin to unfold, slowly,
        almost silently, opening outward across the terrace — and as they rise, the burial of ages lets go. Sheets of
        lichen and earth and rooted growth slough away and slide down into the basin in a soft, unhurried collapse, dust
        climbing pale in the cold air.</em></p>

        <p><em lang="ja-Latn">What is underneath is not stone. It was never stone. It is gold — deep, unblemished,
        impossible gold, the scales whole and gleaming as on the day they were wrought. The lowered head lifts from the
        forelimbs. The amber eyes open last of all, and they are warm, and they are awake, and the long sleep of the
        Tenkū Sandō is over.</em></p>


        </article>

        </div>




        <p>The Sleeping Dragon is the heart of the path — the thing the entire rite of the Sandō exists to wake. It is
        the original; the seven Watchers and the Threshold Head are its lesser kin, and the great golden statue within
        the temple beyond the gold doors is its full-grown twin. While this dragon sleeps, the path sleeps, and the
        temple&#39;s inner hall sleeps with it. When it wakes, all of them wake together, in a single shared breath.</p>
      markdown: ''

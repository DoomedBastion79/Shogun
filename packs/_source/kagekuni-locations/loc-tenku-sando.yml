  - _id: YxYmvzyY6YC0G1pl
    _key: '!journal.pages!4vbzgHy9ecixxgnw.YxYmvzyY6YC0G1pl'
    name: Level 1 — The Lower Landing
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >
        <p>The foot of the Sandō where the mountain track ends and the cut stone begins. A wide paved landing scattered
        with frost-cracked tile and drifts of scree. Stairs lead up the cliff face to Level 2.</p>

        <p><strong>Puzzle elements on this level:</strong></p>

        <ul>

        <li><strong>One Watcher</strong> — a single large dragon-head statue mounted on its stone base, set against the
        inner cliff. Apparently weathered stone (gold beneath). Faces outward over the lower pass. Kindles softly when a
        creature passes within ~10 ft of it on the ascent.</li>

        <li><strong>The Eldest Pedestal</strong> — a squared waist-high stone fixture set against the inner cliff. Its
        top surface bears two inscriptions in worn calligraphy:<ul>

        <li><strong>Vow:</strong> <em lang="ja-Latn">&quot;I come without weapons of pride.&quot;</em></li>

        <li><strong>Pilgrim:</strong> <em lang="ja-Latn">Saitō Hagumi · year 13062</em> (suggested — DM may swap; this
        is the <strong>oldest</strong> remembered name and will be lost from the path when the party completes the
        rite)</li>

        <li><strong>The prayer:</strong> read the pilgrim&#39;s name aloud, speak the vow, observe a brief silence. When
        accepted, the pedestal warms under its grime.</li>

        </ul>

        </li>

        </ul>

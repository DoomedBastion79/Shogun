        <h2 id="kg-the-topmost-pedestal-level-4" data-section="the-topmost-pedestal-level-4">The Topmost Pedestal —
        Level 4</h2>

        <p><em lang="ja-Latn">The highest of the four pedestals, on the upper terrace below the gold-door court. The DM
        may reveal this page when the party examines it.</em></p>

        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-read-aloud-the-topmost-pedestal" data-section="read-aloud-the-topmost-pedestal">Read-Aloud —
        The Topmost Pedestal</h4></header>

        <p><em lang="ja-Latn">The last of the squared pillars stands against the cliff at the inner edge of the upper
        terrace, the gold doors of the temple now plainly visible on the level above. Its surface carries the same pair
        of inscriptions as the three below — but the lighter of the two, the name, looks newer here. Less worn. More
        recently set.</em></p>

        <p><em lang="ja-Latn">The deep-cut vow:</em></p>

        <p><em lang="ja-Latn">&quot;I come without claim upon the dragon.&quot;</em></p>

        <p><em lang="ja-Latn">And beside it, the name and year:</em></p>

        <p><em lang="ja-Latn">&quot;Ono Kazue · year 13087.&quot;</em></p>

        <p><em lang="ja-Latn">There is room on the smooth stone beside that name — a clear, unmarked space, as though
        the pedestal is not finished, and knows it.</em></p>


        </article>

        </div>




        <p>The highest and last of the four pedestals. Its vow — <em lang="ja-Latn">&quot;I come without claim upon the
        dragon&quot;</em> — concerns <em lang="ja-Latn">expectation</em>: the pilgrim arrives at the threshold asking
        for nothing, owed nothing. The pilgrim-name beside it, <em lang="ja-Latn">Ono Kazue · 13087</em>, is the most
        recent the Sandō carries — the last pilgrim to complete the rite before the temple fell silent. The unmarked
        space beside the name is neither damage nor accident. The path keeps the memory of only its last four
        pilgrim-groups, and it is waiting for the next.</p>

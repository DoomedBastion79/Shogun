  - _id: eN6t1N5neprA5TtN
    _key: '!journal.pages!4vbzgHy9ecixxgnw.eN6t1N5neprA5TtN'
    name: Level 4 — Upper Terrace
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >
        <p>The penultimate terrace. The path narrows here; the gold doors are visible above. Stairs lead up to Level
        5.</p>

        <p><strong>Puzzle elements on this level:</strong></p>

        <ul>

        <li><strong>Two Watchers</strong> — two dragon-head statues, one near the entry stair from Level 3 and one near
        the exit stair to Level 5. Both kindle when passed.</li>

        <li><strong>The Top Pedestal — Newest Name</strong> — set against the cliff at the inner edge of the terrace.
        The most recent inscription on the path; what was here was added most recently and will be the first to receive
        the party&#39;s name when the rite completes.<ul>

        <li><strong>Vow:</strong> <em lang="ja-Latn">&quot;I come without claim upon the dragon.&quot;</em></li>

        <li><strong>Pilgrim:</strong> <em lang="ja-Latn">Ono Kazue · year 13087</em> (suggested — the
        <strong>last</strong> pilgrim to complete the rite before the temple fell)</li>

        <li>The prayer: name, vow, silence.</li>

        <li>Note: when the party completes the full rite, <em lang="ja-Latn">their</em> name will be inscribed here, <em
        lang="ja-Latn">Ono Kazue · 13087</em> will cascade down to L3, <em lang="ja-Latn">Mishima Aiko</em> to L2, <em
        lang="ja-Latn">Tachibana Riku</em> to L1, and <em lang="ja-Latn">Saitō Hagumi · 13062</em> will be lost from the
        path.</li>

        </ul>

        </li>

        </ul>

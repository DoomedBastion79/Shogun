      content: >
        <h2 id="kg-the-mourner39s-pedestal-level-2" data-section="the-mourner39s-pedestal-level-2">The Mourner&#39;s
        Pedestal — Level 2</h2>

        <p><em lang="ja-Latn">The pedestal on the second terrace, against the cliff wall opposite the Sleeping
        Dragon&#39;s basin. The DM may reveal this page when the party examines it.</em></p>

        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-read-aloud-the-mourner39s-pedestal"
        data-section="read-aloud-the-mourner39s-pedestal">Read-Aloud — The Mourner&#39;s Pedestal</h4></header>

        <p><em lang="ja-Latn">Against the cliff wall, across the terrace from the great basin and its buried sleeper,
        stands a second squared pillar of pale stone — the twin of the one on the landing below. Its smooth top surface
        carries the same two inscriptions, cut by the same long-gone hands.</em></p>

        <p><em lang="ja-Latn">The deep line, formal and permanent:</em></p>

        <p><em lang="ja-Latn">&quot;I come without burdens of the dead.&quot;</em></p>

        <p><em lang="ja-Latn">And the lighter mark beside it, a name and a year:</em></p>

        <p><em lang="ja-Latn">&quot;Tachibana Riku · year 13074.&quot;</em></p>

        <p><em lang="ja-Latn">Standing here, with the sleeping shape in the basin at your back, the words seem to settle
        differently than they would anywhere else on the mountain. The stone holds the same faint not-quite-coldness as
        the pedestal below — a thing waiting, with great patience, to be remembered.</em></p>


        </article>

        </div>




        <p>The second of the four pedestals. Its vow — <em lang="ja-Latn">&quot;I come without burdens of the
        dead&quot;</em> — speaks to the setting-down of <em lang="ja-Latn">grief</em>, and its placement is deliberate:
        a pilgrim speaks it within sight of the Sleeping Dragon, the heart of the whole path. The pilgrim-name beside
        it, <em lang="ja-Latn">Tachibana Riku · 13074</em>, is the second-oldest the Sandō still keeps.</p>

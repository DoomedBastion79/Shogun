        <h2 id="kg-the-celestial-approach" data-section="the-celestial-approach">The Celestial Approach</h2>

        <p><em lang="ja-Latn">A player-facing introduction to the Tenkū Sandō — the sacred switchback the party climbs
        to reach the gold doors of Ōryūzan Tenkū-ji. The DM may reveal this page when the party first sets foot on the
        cut stone.</em></p>

        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-read-aloud-the-foot-of-the-sand" data-section="read-aloud-the-foot-of-the-sand">Read-Aloud —
        The Foot of the Sandō</h4></header>

        <p><em lang="ja-Latn">The mountain track gives out, and the path remembers how to be a path.</em></p>

        <p><em lang="ja-Latn">Where loose scree and goat-trail switchbacks have carried you for the better part of a
        day, the ground ahead resolves into something made: pale cut stone, laid in wide level courses, climbing the
        southern face of the mountain in great terraced steps. Frost has cracked the tiles and centuries of wind have
        drifted scree across them, but the bones of the thing are unmistakable. This was built. This was
        walked.</em></p>

        <p><em lang="ja-Latn">Five terraces rise above you, each set perhaps thirty feet above the last, joined by short
        flights of worn stairs. Stone dragon-heads stand sentinel along the levels, faces turned outward over the drop,
        weathered nearly featureless by time. Squared pillars of pale stone wait against the inner cliff at intervals.
        And far above, at the head of it all, you can just make out the gleam of something gold.</em></p>

        <p><em lang="ja-Latn">The wind moves over the old stone and finds no one to greet. Whatever this path was for,
        it has been a very long time since anyone climbed it the way it was meant to be climbed.</em></p>


        </article>

        </div>




        <p>The Tenkū Sandō — <em lang="ja-Latn">&quot;the Celestial Approach&quot;</em> — is the formal pilgrimage road
        to Ōryūzan Tenkū-ji, the paramount sacred site of the Golden Dragon Clan in the age before the temple fell. A
        pilgrim of the Golden Age did not simply <em lang="ja-Latn">walk</em> to the temple. The walking was itself the
        observance — a rite written into the stone of the path and performed with the feet, the voice, and the patient
        act of ascent.</p>

        <p>The Sandō has five terraced levels. It carries <strong>eight stone dragon-heads</strong>, <strong>four stone
        pedestals</strong>, and — cradled in a basin on the second terrace — a great <strong>coiled dragon at
        rest</strong>. All of it lies buried under lichen, drifted dirt, and the slow work of the mountain. To the eye
        it is a ruin. It is not a ruin. It is a sacred device that has simply not been <em lang="ja-Latn">called</em> in
        a very long time — and everything needed to call it is already on the path with those who climb it.</p>

        <p>The pages that follow describe what the party can see and learn as they ascend: the watching dragon-heads,
        the strange head at the summit, the four pedestals and their inscriptions, and the sleeping dragon at the heart
        of it all. The DM may reveal each as the party encounters it.</p>

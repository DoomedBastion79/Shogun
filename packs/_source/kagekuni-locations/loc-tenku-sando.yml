      content: >
        <h2 id="kg-the-eldest-pedestal-level-1" data-section="the-eldest-pedestal-level-1">The Eldest Pedestal — Level
        1</h2>

        <p><em lang="ja-Latn">The pedestal on the lowest landing. The DM may reveal this page when the party examines
        it.</em></p>

        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-read-aloud-the-eldest-pedestal" data-section="read-aloud-the-eldest-pedestal">Read-Aloud —
        The Eldest Pedestal</h4></header>

        <p><em lang="ja-Latn">A squared pillar of pale stone stands waist-high against the inner cliff, its top surface
        flat and worked smooth. Two things are carved into that surface in a calligraphy worn shallow by the wind — but
        still, with patience and a clean angle of light, legible.</em></p>

        <p><em lang="ja-Latn">The first is a single line, cut deep and formal, the lettering of something meant to last
        as long as the stone:</em></p>

        <p><em lang="ja-Latn">&quot;I come without weapons of pride.&quot;</em></p>

        <p><em lang="ja-Latn">The second is smaller, set off to one side like a signature. Where the first line is
        carved into the very making of the pedestal, this one looks almost added — a name, and a year:</em></p>

        <p><em lang="ja-Latn">&quot;Saitō Hagumi · year 13062.&quot;</em></p>

        <p><em lang="ja-Latn">The stone is cold under your hand. But where your fingers rest in the carved grooves of
        the letters, the cold seems a half-degree less certain than it ought to be — as though the pedestal is not dead,
        only very deeply asleep, and dreaming faintly of being touched.</em></p>


        </article>

        </div>




        <p>This is the lowest of four pedestals — one set on each of the path&#39;s first four terraces. The line cut
        deep, <em lang="ja-Latn">&quot;I come without weapons of pride,&quot;</em> is a <strong>vow</strong>, carved
        into the pedestal when the path was made; it is the vow of this terrace, the same for every pilgrim who has ever
        read it, and its theme is the setting-down of <em lang="ja-Latn">ego</em>. The name set lightly beside it — <em
        lang="ja-Latn">Saitō Hagumi · 13062</em> — is something else: the record of a pilgrim who once climbed this path
        and completed its rite. Of the four names the Sandō still carries, this is the oldest.</p>

        <h2 id="kg-the-watcher-heads" data-section="the-watcher-heads">The Watcher Heads</h2>

        <p><em lang="ja-Latn">The seven uniform dragon-head statues set along the path. The DM may reveal this page when
        the party examines any one of them.</em></p>

        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-read-aloud-a-watcher-head" data-section="read-aloud-a-watcher-head">Read-Aloud — A Watcher
        Head</h4></header>

        <p><em lang="ja-Latn">The head juts from a squared stone base set against the inner cliff — a dragon&#39;s head,
        half again the height of a tall man, carved jaw to crown from a single block. It faces outward, away from the
        mountain, over the long drop and the pass below, as though it has spent every one of its years watching the road
        for someone climbing up.</em></p>

        <p><em lang="ja-Latn">Time has been strange to it. Lichen the colour of rust and old slate furs the scales; dirt
        has settled into every carved hollow; the features are softened almost to suggestion. And yet the stone beneath
        the grime is not cracked, not pitted, not crumbling the way the path&#39;s tiles crack and crumble around it. It
        has weathered without truly wearing. The closed mouth, the deep-set eyes, the swept lines of the brow — all of
        it is still there, only buried.</em></p>

        <p><em lang="ja-Latn">And then, as you draw near, it does a thing no weathered stone should do. A soft warmth
        wakes somewhere deep inside the head — not a light to read a page by, but a glow, low and golden, rising in the
        seams between the scales like a coal remembering that it was once a fire. It holds steady while you are close.
        It asks nothing of you. It simply seems, in some way you could not quite defend aloud, glad.</em></p>


        </article>

        </div>




        <p>Seven of these heads stand along the Sandō: one on the lowest landing, two flanking the great basin on the
        second terrace, two on the third, and two on the fourth. They are alike in every way that matters — the same
        size, the same outward-facing posture, the same closed mouth, the same patient carving beneath the same
        centuries of grime. The pilgrims who built the path called them the <strong>Watchers</strong>.</p>

        <p>A Watcher kindles when an ascending creature passes close to it — no word, no gesture, no offering required.
        The act of <em lang="ja-Latn">climbing the path</em> is the thing it wakes for. Once kindled, a head holds its
        glow as long as any member of the party remains on the Sandō.</p>

        <p>An <strong>eighth</strong> dragon-head stands apart in the court at the very top of the path, and it is <em
        lang="ja-Latn">not</em> like these seven. See <strong>The Threshold Head &amp; The Shrine</strong>.</p>

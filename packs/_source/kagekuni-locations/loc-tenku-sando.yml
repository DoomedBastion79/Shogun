        <h2 id="kg-the-threshold-head-amp-the-shrine" data-section="the-threshold-head-amp-the-shrine">The Threshold
        Head &amp; The Shrine</h2>

        <p><em lang="ja-Latn">The eighth and distinct dragon-head in the gold-door court (Level 5), and the roadside
        shrine behind the basin on the second terrace. The DM may reveal the head when the party examines it, and the
        shrine when the party reaches the Level-2 basin.</em></p>

        <h3 id="kg-the-threshold-head" data-section="the-threshold-head">The Threshold Head</h3>

        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-read-aloud-the-threshold-head" data-section="read-aloud-the-threshold-head">Read-Aloud — The
        Threshold Head</h4></header>

        <p><em lang="ja-Latn">This one is wrong, and it takes a moment to see why.</em></p>

        <p><em lang="ja-Latn">It stands alone at the centre of the broad court before the gold doors — not set against
        the cliff with the drop at its back, like every head below it, but out in the open. And it is turned the wrong
        way. Where the Watchers on the path all face outward over the descent, this head faces inward, toward the doors,
        as though it once climbed the Sandō itself and has been gazing at the threshold ever since. It is smaller than
        the others, perhaps two-thirds their size, and beneath the grime the carving is finer — a more careful hand, or
        a more beloved subject.</em></p>

        <p><em lang="ja-Latn">Its mouth is open. Every head on the path below holds its jaws shut; this one&#39;s are
        parted, the way a mouth parts in the half-second before speech. Ringed around its base, carved into the paving
        stones in a wide band, runs a circle of characters — most of them worn past reading, a few still legible: the
        remains of some written thing that was meant to be spoken here.</em></p>

        <p><em lang="ja-Latn">It does not kindle as you pass. You walk by it, and around it, and it stays cold. Whatever
        this head is waiting for, your footsteps are not it.</em></p>


        </article>

        </div>




        <p>The seven Watchers wake for the act of climbing. The Threshold Head does not — it waits for a <em
        lang="ja-Latn">voice</em>. It is the last word of the path, and it will not speak until it is spoken to.</p>

        <h3 id="kg-the-roadside-shrine" data-section="the-roadside-shrine">The Roadside Shrine</h3>

        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-read-aloud-the-roadside-shrine-dormant"
        data-section="read-aloud-the-roadside-shrine-dormant">Read-Aloud — The Roadside Shrine (dormant)</h4></header>

        <p><em lang="ja-Latn">Tucked into the living rock behind and beneath the great basin of the second terrace is a
        small shrine — a michibata no jinja, the humble roadside shrine a traveller might find at any lonely crossing. A
        single platform of cut stone for offerings. A shallow basin for incense or a handful of rice. Above the
        platform, a small relief of a dragon in flight, wings spread, worn soft by weather.</em></p>

        <p><em lang="ja-Latn">It is here. It has always been here — no door hides it, no panel seals it away. But it is
        utterly cold. The incense basin holds only grit. The little dragon overhead is grey stone and nothing more. You
        may kneel before it, you may set an offering on the platform, you may speak a prayer into the wind — and nothing
        will answer. The shrine is present. It is simply not awake.</em></p>


        </article>

        </div>






        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-read-aloud-the-roadside-shrine-awakened"
        data-section="read-aloud-the-roadside-shrine-awakened">Read-Aloud — The Roadside Shrine (awakened)</h4></header>

        <p><em lang="ja-Latn">Something has changed at the little shrine. The relief of the dragon above the platform
        has warmth in it now — a faint gold caught in the spread of the carved wings, the same low warmth the path&#39;s
        heads carry. The incense basin, its grit long since swept away, seems to wait. A prayer offered here will not
        fall into silence anymore. The shrine has remembered what it is for.</em></p>


        </article>

        </div>




        <p>The shrine is <strong>not a reward that is unlocked or opened</strong>. It stands on the second terrace from
        the moment the party first arrives, plain to see and free to approach. What it lacks is its prayer. The Sandō
        has gone uncalled for so long that the shrine, like the path and everything on it, has fallen dormant. When the
        rite of the path is completed, the shrine wakes along with everything else — and becomes able, once more, to
        answer a pilgrim&#39;s supplication with a small blessing for the road ahead. (For the blessing&#39;s mechanics,
        see the DM supplement <strong>The Sandō Puzzle</strong>.)</p>

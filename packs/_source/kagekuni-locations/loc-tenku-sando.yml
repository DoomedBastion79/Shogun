  - _id: P4KiM3hcZCf0wXIw
    _key: '!journal.pages!4vbzgHy9ecixxgnw.P4KiM3hcZCf0wXIw'
    name: Level 2 — The Sleeping Dragon
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <p>The second terrace, set against a deeper recess in the cliff. At the heart of the landing, cradled in a basin
        carved from the mountain itself, rests <strong>what appears to be a large coiled dragon carved from pale
        weathered stone</strong>. The shape is unmistakable — a dragon at rest, head lowered upon its forelimbs, body
        curled around itself in long deliberate coils, <strong>wings folded tight against its back</strong> — but the
        surface is so completely overtaken by accumulated debris that no casual observer would call it anything but
        rock. Lichen the colour of rust and slate carpets the scales. Rooted growth has crawled into the joints between
        coils and into the seams between the folded wings. Dust and small stones have settled into every concavity.
        Wind-blown dirt sits dark in the carved hollows.</p>

        <p>It is, in fact, gold — the same impossible untarnished gold as the great statue inside the temple, of which
        the party will eventually realise this is the working twin — but no one looking at it now would know that.</p>

        <p>Behind and beneath the basin, set into the living rock, stands a small <strong>roadside shrine</strong> —
        visible from the moment the party reaches this terrace, concealed by no door or panel, but utterly cold and
        dormant. When the Sandō puzzle is solved, the dragon stirs: the folded wings <strong>unfurl slowly
        outward</strong>, the centuries of accumulated debris slough off into the basin in slow almost-silent sheets,
        the gold beneath is revealed, the amber eyes open, the head lifts. The shrine wakes with the path — its carved
        dragon-relief warms, and it answers the prayers of pilgrims once more.</p>

        <p><strong>Puzzle elements on this level:</strong></p>

        <ul>

        <li><strong>Two Watchers</strong> — two large dragon-head statues flanking the Sleeping Dragon&#39;s basin, one
        to each side. Both kindle when passed.</li>

        <li><strong>The Mourner&#39;s Pedestal</strong> — set against the cliff wall opposite the basin.<ul>

        <li><strong>Vow:</strong> <em lang="ja-Latn">&quot;I come without burdens of the dead.&quot;</em></li>

        <li><strong>Pilgrim:</strong> <em lang="ja-Latn">Tachibana Riku · year 13074</em> (suggested)</li>

        <li>The prayer is the same form as Level 1: name, vow, silence.</li>

        </ul>

        </li>

        <li><strong>The Sleeping Dragon</strong> — the basin&#39;s center, the puzzle&#39;s focal point. (See
        above.)</li>

        </ul>

        <section id="sec-rm-tenku-sando-level-2--room-info-hooks" class="secret kg-secret-sealed kg-sealed-dm-notes"
        data-kind="dm-notes">

        <ul>

        <li>Dragonborn PCs and sei-sensitive characters (Relc, Ko&#39;jiri) can sense that <em lang="ja-Latn">something
        is here</em> — the basin is not inert stone but a working device that has not been called in a long time. They
        do not yet know what shape it has.</li>

        <li>Investigation (DC 13) at the basin notes the moss is shallow-rooted, the surface beneath is too smooth and
        uniform, and the substance underneath rings differently when tapped. The character does not yet understand
        what&#39;s beneath, only that something is.</li>

        <li>The Nagaji avoid this landing. They will not have left scale-marks or detritus near the basin. Their absence
        is a quiet clue.</li>

        <li>Until the puzzle resolves, the dragon does <strong>not</strong> radiate warmth. The party may approach
        freely.</li>

        </ul>


        </section>

  - _id: 725V9bpOQRBu3Tkk
    _key: '!journal.pages!4vbzgHy9ecixxgnw.725V9bpOQRBu3Tkk'
    name: Level 5 — The Gold-Door Court
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >
        <p>The head of the Sandō. The switchback opens into a broad paved court before the massive ornate gold doors of
        Ōryūzan Tenkū-ji. The threshold proper between path and temple. Where the party currently stands.</p>

        <p><strong>Puzzle elements on this level:</strong></p>

        <ul>

        <li><strong>The Threshold Head</strong> — one dragon-head, set on its own at the center of the court before the
        gold doors. It is <strong>visibly different</strong> from the seven Watchers below:<ul>

        <li><strong>Smaller</strong> than the others — about two-thirds their scale — but more finely carved beneath the
        grime.</li>

        <li><strong>Faces inward</strong> (toward the gold doors), not outward over the path.</li>

        <li><strong>Mouth open</strong> — every Watcher below has a closed mouth; this one&#39;s jaws are parted as if
        mid-speech.</li>

        <li><strong>Ringed by a faded text-circle on the ground</strong> — a band of carved characters surrounding the
        head&#39;s base, mostly worn but partially legible. (Religion DC 14 to recognise the fragments as ritual text;
        Religion DC 18 or monk training to actually recite the <strong>Order of Ascent</strong> from memory.)</li>

        <li><strong>The head does not kindle when passed.</strong> Walking near it does nothing. Investigation reveals —
        as it does for the others — that the underlying material is the same as the rest (gold beneath stone), but the
        magic here is keyed to <em lang="ja-Latn">speech</em>, not passage.</li>

        </ul>

        </li>

        <li><strong>No pedestal</strong> on this level. The threshold is for the rite&#39;s completion, not for
        prayer.</li>

        <li><strong>The gold doors</strong> behind the head — the temple entrance proper. Open without the puzzle being
        solved; the puzzle gates only what lies <em lang="ja-Latn">beyond</em> the doors
        (@UUID[Compendium.kagekuni-assistant.locations.JournalEntry.TNV9pLqaBUzySDRl.JournalEntryPage.tqUpQPP3v45gUDzI]{the
        Grand Hall — Hiroba}).</li>

        </ul>

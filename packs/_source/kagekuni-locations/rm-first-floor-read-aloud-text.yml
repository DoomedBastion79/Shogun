        <section class="kg-tier kg-tier-intro" data-tier="intro"><h2 id="kg-known" data-section="known">[KNOWN]</h2>

        <p><em lang="ja-Latn">In-game narration for each room. Reference individual room files in <code>floor-1/</code>
        for mechanical details, DCs, and DM notes. Reference <code>floor-1.md</code> for spatial layout and floor-level
        overview.</em></p>

        <hr>

        <h2 id="kg-known" data-section="known">[KNOWN]</h2>

        <h3 id="kg-1-the-south-entrance-kinko-no-mon-gate-of-golden"
        data-section="1-the-south-entrance-kinko-no-mon-gate-of-golden">1. The South Entrance — Kinko no Mon (Gate of
        Golden Light)</h3>

        <p><em lang="ja-Latn">The doors open and the cold comes first — dry and still, carrying the faint mineral scent
        of old bronze and something beneath it with no name, the absence of smoke from flames that do not burn the way
        fire burns.</em></p>

        <p><em lang="ja-Latn">There is light where there should not be. Gold sconces line both walls at intervals, and
        the torches set into them are burning — pale blue-white, absolutely still, each flame identical to the last. The
        draft from the open doors moves past them without effect. The shadows they throw are long and fixed, pooling
        between the sconces in bands of blue-black the light never quite reaches.</em></p>

        <p><em lang="ja-Latn">Eight pale stone pillars stand in two rows down the hall&#39;s length, freestanding, set
        well in from the walls — four to a side, reaching toward a ceiling sixty feet above. Their surfaces were carved
        once; the evidence of that is visible in the grooves and spirals that remain. The evidence of something else is
        visible too: chisel marks at a height someone could reach from the ground, working across every surface with
        patience. Faces removed. Wing-edges broken away. The hollows where features used to be catch the cold torchlight
        and cast shadows that shift faintly as you move through the space — following you, though the flames do
        not.</em></p>

        <p><em lang="ja-Latn">In the northeast corner, two of the pillars are down. They have fallen toward the center
        of the hall, the nearer one lying across the tile path in three large pieces, the farther one broken at the base
        and leaning against the first, the two together forming a low obstacle of pale stone and settled debris. The
        ceiling above shows raw mountain rock at both gaps. The gold sconces at those positions are still mounted on the
        wall — but the torches in them are gone, and that section of the hall, where Tapestry I hangs behind the rubble,
        is the darkest part of the room.</em></p>

        <p><em lang="ja-Latn">Between the standing pillars and the tapestried walls, the sconce-light does not reach.
        The space there runs the length of the hall on both sides, deeper shadow than the rest.</em></p>

        <p><em lang="ja-Latn">The walls between the sconces are hung floor to ceiling with fabric — overlapping in
        places, three layers deep in at least one section. What time and something more immediate have done to most of
        them is thorough: blackened frames, collapsed structures, images reduced past any reading. But not all. Here and
        there, where the light catches at the right angle, a shape holds. A color that should not have survived. A
        figure that resolves differently depending on where you are standing.</em></p>

        <p><em lang="ja-Latn">Down the center of the hall, where something has scraped through the accumulated grit, the
        floor tile is visible: gold and deep blue, geometric, precise.</em></p>

        <p><em lang="ja-Latn">Above the inner door, two iron brackets protrude from the stone. Between them,
        nothing.</em></p>

        <hr>

        <h2 id="kg-known" data-section="known">[KNOWN]</h2>

        <h3 id="kg-2-the-grand-hall-hiroba-wide-hall" data-section="2-the-grand-hall-hiroba-wide-hall">2. The Grand Hall
        — Hiroba (Wide Hall)</h3>

        <p><em lang="ja-Latn">The passage opens and the walls fall away.</em></p>

        <p><em lang="ja-Latn">The space is large enough that your light doesn&#39;t reach the far sides — the walls at
        the edges are blue-grey shapes, barely suggestions. The ceiling is not visible at all. You are not in a room so
        much as you are at the base of something.</em></p>

        <p><em lang="ja-Latn">And at the center: gold.</em></p>

        <p><em lang="ja-Latn">Two hundred and fifty feet of it, coiled around a central plinth in a posture that takes a
        moment to read. Not rearing. Not threatening. The great head is lowered slightly, the body settled as if
        resting, but the inlaid amber eyes are open and they are aimed at the space directly in front of them — at you,
        if you are standing in front of them. The surface of the statue has not tarnished. Not a single scale has lost
        its sheen. Your light arrives at it and comes back warmer than it left.</em></p>

        <p><em lang="ja-Latn">Around the base, on the south and east faces, four shallow pools. The water in them is so
        clear you can see the tile below it as though the water is not there. It carries its own faint light —
        blue-white, steady, the color of something that has been holding its breath for a very long time.</em></p>

        <p><em lang="ja-Latn">Away from the statue, the room has aged. Banners hang from wall brackets in ribbons, their
        colors long since gone. Offering tables have collapsed. Whatever was brought here — food, incense, vessels — has
        fallen, broken, or been reclaimed by gravity and time. The floor beyond the pools is hidden under decades of
        dust and debris.</em></p>

        <p><em lang="ja-Latn">The statue has not aged. The water has not dried.</em></p>

        <hr>

        <h2 id="kg-known" data-section="known">[KNOWN]</h2>

        <h3 id="kg-3-the-star-shrine-okuden-inner-hall" data-section="3-the-star-shrine-okuden-inner-hall">3. The Star
        Shrine — Okuden (Inner Hall)</h3>

        <p><em lang="ja-Latn">The hallway that leads here is unmarked — no carvings, no script, no alcoves. Just stone,
        ten feet wide, stretching sixty feet ahead of you with the narrowing sense that you are going somewhere set
        apart.</em></p>

        <p><em lang="ja-Latn">The room at the end is broad and still — forty-five feet across, thirty-five deep, the
        ceiling rising into shadow above you. The floor is polished obsidian, black and seamless, still reflective
        despite the centuries — you see your own feet in it, blurred, moving just behind you. At the center, a low stone
        dais sized for a single seated figure, unadorned.</em></p>

        <p><em lang="ja-Latn">Then you notice the ceiling.</em></p>

        <p><em lang="ja-Latn">Thousands of small holes, each one no wider than a finger, pierce it in an arrangement
        that is clearly deliberate — too consistent for accident, too complex for simple decoration. Through a narrow
        shaft in the outer northwest wall, moonlight enters the chamber and passes through the holes, each one casting a
        single pinprick of shadow down onto the obsidian below.</em></p>

        <p><em lang="ja-Latn">The shadows together form the sky.</em></p>

        <p><em lang="ja-Latn">Not an approximation of it. Not a simplified rendering. The actual night sky above this
        latitude, mapped in negative across the reflective floor: the constellations of Seizan, the positions of the
        four moons, the dim stellar clusters between the named stars. The room is holding the sky in place.</em></p>

        <p><em lang="ja-Latn">Sound arrives at the threshold and stops. Whatever you carried in from the hallway —
        footsteps, breath, the creak of armor — becomes, within a step, nothing.</em></p>

        <p><em lang="ja-Latn">The dais has been used recently. The dust on it is disturbed: a circular impression, the
        shape of something large and coiled, pressed into the surface more than once.</em></p>

        <hr>

        <h2 id="kg-known" data-section="known">[KNOWN]</h2>

        <h3 id="kg-4-the-mess-hall-and-kitchen-shokudo-dining-hall"
        data-section="4-the-mess-hall-and-kitchen-shokudo-dining-hall">4. The Mess Hall and Kitchen — Shokudo (Dining
        Hall)</h3>

        <p><em lang="ja-Latn">The hallway turns — south, then east — and the smell finds you before the room does. The
        fire was a long time ago. The smell of it is still here.</em></p>

        <p><em lang="ja-Latn">Not a fresh smell — old char, baked into stone so thoroughly it has become part of the
        stone.</em></p>

        <p><em lang="ja-Latn">The passage opens into a broad space — fifty feet across, fifty deep. Long low tables run
        the length of it. The ones nearest the kitchen archway to the west are charred down to their legs. The ones
        farther away have simply rotted, their surfaces caved in over years of neglect. Ceramic bowls are scattered
        across the floor, cracked and blackened, lying where they fell.</em></p>

        <p><em lang="ja-Latn">One bowl is upright. Intact. Set on the floor near the far wall as if someone placed it
        there.</em></p>

        <p><em lang="ja-Latn">Dark stains mark the stone in places. The occasional fragment of bone, scattered, has been
        here long enough to look like part of the room.</em></p>

        <p><em lang="ja-Latn">Through the kitchen archway to the west, the damage is worse. The ceiling there is black,
        scorched to a depth that centuries of stillness have not touched. The great central hearth has partially
        collapsed inward; the iron crane that hung above it is bent at an angle that suggests heat far beyond anything a
        cooking fire would produce. In the far wall, a section of mortar gave out — from the heat, from the cold, from
        something — leaving a ragged gap that lets in a thin blade of mountain air, clean and sharp against everything
        else in the room.</em></p>

        <p><em lang="ja-Latn">In the far corner of the kitchen, a larder door stands half-open. Inside, shapes on
        shelves that might have been preserved goods — jars, sacks, something — have collapsed into uniform grey
        dust.</em></p>

        <hr>

        <h2 id="kg-known" data-section="known">[KNOWN]</h2>

        <h3 id="kg-5-the-dormitories-bo-monks39-quarters" data-section="5-the-dormitories-bo-monks39-quarters">5. The
        Dormitories — Bo (Monks&#39; Quarters)</h3>

        <p><em lang="ja-Latn">A long corridor, wide enough for two people to walk side by side, with doors branching
        left and right. Most of the doors are open. At the far ends of the corridor, larger chambers.</em></p>

        <p><em lang="ja-Latn">The doors that are open were not left that way. The frames are splintered — forced inward,
        or outward, depending on the door. Several bear scoring at shoulder height, the kind left by edged weapons.
        Inside the cells: sleeping pallets collapsed into their own decay. Personal effects on hooks or shelves, long
        since fallen — a sandal, a cloth, a small painted tile lying face-down in the dust.</em></p>

        <p><em lang="ja-Latn">In the southern shared chamber, the evidence is heavier. Furniture was moved — pushed
        against walls, pushed away again, the drag marks visible in the grit. Impact marks at various heights. On the
        floor near the far wall, the stone itself is damaged: a starburst pattern, cracked outward from a central
        point.</em></p>

        <p><em lang="ja-Latn">The northern shared chamber is different. Its door has a bar, and the bar is in its
        brackets. This door was never forced. You lift the bar yourself and push the door open.</em></p>

        <p><em lang="ja-Latn">The air inside is old in the way only sealed places can be — still, and slightly too dry,
        as if the room has been holding its breath. The pallet inside holds a complete skeleton. They are facing the
        wall. They lay down on their own.</em></p>

        <p><em lang="ja-Latn">On the floor beside the pallet: a small bronze disc on a cord. An ink-block, dried to
        nothing. A sealed scroll case.</em></p>

        <hr>

        <h2 id="kg-known" data-section="known">[KNOWN]</h2>

        <h3 id="kg-6-the-inner-sanctum-naijin-inner-sanctuary"
        data-section="6-the-inner-sanctum-naijin-inner-sanctuary">6. The Inner Sanctum — Naijin (Inner Sanctuary)</h3>

        <p><em lang="ja-Latn">The doors to the inner sanctum are black-lacquered wood banded with bronze, a frieze of
        the seven dragon clans carved into the frame in a ring. They are standing open.</em></p>

        <p><em lang="ja-Latn">Inside the frame, where some kind of locking mechanism was once anchored, lines of inlaid
        silver run dark and dead. Whatever held these doors closed was undone. The damage is on the outside of the
        frame.</em></p>

        <p><em lang="ja-Latn">The chamber within is octagonal, high-ceilinged, each wall originally bearing a hanging
        scroll. Six of the eight positions are empty — the mountings remain, but the scrolls are gone. One position
        holds fragments on the floor, the ink faded to invisibility. One, against the far wall, still holds its scroll
        intact: a dragon in flight, rendered in gold and deep blue on black silk, the colors as vivid as if it was made
        this year. Looking at it, you understand what the artists in your own era are attempting.</em></p>

        <p><em lang="ja-Latn">The center of the floor has been cleared. Not cleaned — cleared. Whatever stood here
        originally has been pushed to the walls: shattered pedestals, broken braziers, debris. In the cleared center, a
        depression in the swept floor, low and circular, shaped by something large that has lain there many times. The
        edges of it are made from broken furniture, torn fabric, shredded material that was once something
        else.</em></p>

        <p><em lang="ja-Latn">The depression is empty. It is warm.</em></p>

        </section>

        <section class="kg-tier kg-tier-intro" data-tier="intro"><h2 id="kg-known" data-section="known">[KNOWN]</h2>

        <p><em lang="ja-Latn">Randomly applied via Ritual 3 — Blessing of Kinryū at the Grand Hall restorative pools. 8
        hour duration. 2 charges per blessing.</em></p>


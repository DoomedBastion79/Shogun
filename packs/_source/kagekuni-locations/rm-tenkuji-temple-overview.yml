        <section class="kg-tier kg-tier-intro" data-tier="intro"><h2 id="kg-known" data-section="known">[KNOWN]</h2>

        <p><em lang="ja-Latn">&quot;Great Dragon Mountain — Temple of the Celestial Sky&quot;</em></p>

        <p><em lang="ja-Latn">The temple has slept for thousands of years. Something in it has not.</em></p>

        <h2 id="kg-overview" data-section="overview">Overview</h2>

        <p>Oryuzan Tenku-ji was the paramount sacred site of the Golden Dragon Clan — a monastery, archive, and living
        temple raised in honor of Kinryu at the height of the First Golden Age. It sat at the heart of the Kinkozan
        Mountain Range, now called Tenchusan Ren, and served as both a place of worship and a center of learning for the
        clan&#39;s order of dragon-priests.</p>

        <p>The temple&#39;s destruction came not from outside invasion but from within. Infiltrators aligned with the
        Crimson Clan (Akaryu) and Onyx Clan (Kokuryu) embedded themselves within the order over decades, working to
        fracture the Golden Dragon Clan&#39;s influence during the War of Fractured Banners. The internal violence was
        swift and devastating — but what finally sealed the temple&#39;s fate was the sei drought. By 13088, the
        secondary stars — Susanoo and Tsukuyomi — had retreated far enough along their barycentric orbits that sei was
        no longer accessible. The foundational magic held — the torches still burned, the statue still radiated warmth —
        but the living connection to Kinryu went silent. The Great Aphelion itself would not arrive for another 1,256
        years (~14344), but the temple&#39;s inhabitants had no way to know that. They only knew the magic was gone. The
        surviving worshipers, already fractured by infiltration and war, found themselves in a temple that still worked
        while they no longer could. They walked away. None returned.</p>

        <p>What remains is a place in two states simultaneously: ruin and preservation. Most of the temple has suffered
        as stone suffers — slowly, under the weight of time, water, and neglect. But the great statue at its heart has
        not aged a single day. The pools surrounding it still hold water of unearthly clarity. The star shrine still
        casts its pinprick constellations across the floor when moonlight falls. The temple remembers what it was, even
        if no one alive does.</p>

        <h2 id="kg-campaign-role" data-section="campaign-role">Campaign Role</h2>

        <p>The temple&#39;s primary structural role in the campaign is as a <strong>progress point leading into an
        expansive cavern system</strong>, most likely accessed through the basement level. The caverns are how the
        Nagaji have been moving rapidly from their mountain retreat toward Hokori without detection — the party
        discovering this network is a significant intelligence find.</p>

        <p>Multiple entry paths to the caverns exist in case the party bypasses or skips the basement. At least one
        alternate route is findable on the first floor for groups who don&#39;t go down.</p>

        <p>The cavern system is canonically the Nagaji&#39;s operational highway — it explains the mystery of how
        serpentine creatures have been appearing in lowland areas far from their known mountain territory.</p>


        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-overview"
        data-section="overview">Overview</h3>

        <p>Koriwara sits in the foothills where Mizu province&#39;s maritime lowlands begin to rise toward Hokori&#39;s
        interior ranges. It is unremarkable by any visible standard -- small-scale farming and herding, modest
        architecture, a self-contained community with little need for outside contact. A traveler passing through would
        find nothing to distinguish it from dozens of similar villages.</p>

        <p>What distinguishes it cannot be seen from the road: the presence of Elder Sato Hideaki, whose decades of
        accumulated knowledge, his connection to the Order of the Sacred Grove, and his quiet role as a node in networks
        extending far beyond a mountain foothills village give Koriwara significance disproportionate to its size.</p>

        <p>The sacred grove that Sato tends is a small stand of ancient trees on the hillside above the village, reached
        by a foot path behind the northernmost homes. The grove is not marked, not fenced, not formally maintained -- it
        simply exists, and the village has always known to leave it alone.</p>

        <p>This is Relc&#39;s home village.</p>

        <h3 id="kg-key-figures" data-section="key-figures">Key Figures</h3>

        <ul>

        <li>Sato Hideaki -- Choro (Village Elder); 78 years old -&gt; npcs/sato-hideaki.md</li>

        </ul>

        </section>

        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-geography-amp-terrain"
        data-section="geography-amp-terrain">Geography &amp; Terrain</h3>

        <p>Tsuchi occupies the southern portion of Hokori -- a primarily mountainous province dominated by rugged
        terrain and the imposing bulk of Kurogane Yama, the second highest peak on the island. Hana borders it to the
        northeast and Hi to the northwest. The mountains here are old and weathered, less volcanically active than Hi
        but no less formidable -- steep valleys, narrow passes, and ridgelines that catch storms rolling in from the
        southern sea.</p>

        <p>The southern mountains are resource-rich -- mineral deposits, timber in the sheltered valleys, and stone
        quarried from exposed cliff faces. But the terrain resists large-scale settlement. Communities are small,
        isolated by geography, and accustomed to self-reliance.</p>

        <p>The Tsuchikawa (Earth River) is the main artery -- wide, slow, navigable for cargo barge travel, and
        historically important as a trade route connecting the interior to the coast.</p>

        <p>Tsuchimoto sits at the center of the provincial plains, connected by roads in every compass direction. It is
        not a dramatic city -- no spectacular geography, no great harbor. It is a city of markets, granaries,
        administrative buildings, and the quietly enormous power of whoever controls the food supply.</p>

        <p>Points of Interest:</p>

        <ul>

        <li>The Great Granaries of Tsuchimoto -- Immense storage structures capable of holding enough grain to feed
        Hokori&#39;s population through two years of failed harvests. One of the most strategically important sites in
        the archipelago.</li>

        <li>The Buried Road -- An ancient paved road that farmers have plowed around for centuries. Predates the
        Emperor&#39;s Highway by thousands of years -- pre-imperial, possibly pre-human. Where it goes and why it exists
        is unknown.</li>

        </ul>


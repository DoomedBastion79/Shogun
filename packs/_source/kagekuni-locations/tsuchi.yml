        <h3 id="kg-culture-amp-trade" data-section="culture-amp-trade">Culture &amp; Trade</h3>

        <p>Tsuchi&#39;s culture reflects its agricultural identity -- practical, organized, and deeply connected to the
        land and seasons. The province&#39;s grain production is a strategic asset that gives its governing authority
        disproportionate political leverage. River trade along the Tsuchikawa connects the interior to coastal
        markets.</p>

        <h3 id="kg-history" data-section="history">History</h3>

        <p>Tsuchi has long been Hokori&#39;s breadbasket. Its strategic importance has made it a prize in every major
        conflict. The province&#39;s current Genso Alliance alignment gives the alliance control over a significant
        portion of Hokori&#39;s food supply -- a fact with profound implications for the current political crisis.</p>

        </section>

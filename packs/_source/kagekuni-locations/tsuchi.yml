        <section class="kg-tier kg-tier-sealed" data-tier="sealed"><h3 id="kg-the-granaries-as-political-weapon"
        data-section="the-granaries-as-political-weapon">The Granaries as Political Weapon</h3>

        <p>The Genso Alliance-aligned governing clan has been quietly restricting grain sales to Arashi-aligned
        provinces while maintaining normal trade with neutral parties. This is a slow-moving economic siege strategy. It
        hasn&#39;t become visible yet. When it does, it will escalate the current conflict significantly.</p>

        <h3 id="kg-the-buried-road" data-section="the-buried-road">The Buried Road</h3>

        <p>The ancient road leads eventually to a pre-imperial site associated with the Emerald Dragon Clan (Midoryu) --
        a &quot;green court&quot; predating any recorded human settlement. Traceable sections exist at intervals. The
        site it leads to is in the Kusa province border region, beneath what is now part of the Whispering Flats.
        Midoryu is alive and maintains a particular connection to this buried court.</p>

        <h3 id="kg-plot-hooks" data-section="plot-hooks">Plot Hooks</h3>

        <ul>

        <li>A farmer plowing a new field in eastern Tsuchi has found an intact structure beneath the buried road -- a
        sealed room -- and reported it to local authorities; those authorities are now not responding to outside
        inquiries</li>

        <li>The granary administrator in Tsuchimoto is receiving death threats; she has information about grain supply
        restrictions that she wants to share with someone she trusts -- which is no one, currently</li>

        </ul>

        </section>

        <h3 id="kg-nodes" data-section="nodes">Nodes</h3>

        <p><em lang="ja-Latn">Detailed room descriptions are in the individual room files under <code>floor-1/</code>.
        Node data here provides spatial and tactical reference.</em></p>

        <ul>

        <li><p><strong>1. South Entrance — Kinko no Mon</strong> [hall: 70W × 75L, 60 ft ceiling] → <a
        href="floor-1/south-entrance.md">south-entrance.md</a></p>

        <ul>

        <li>dimensions: 70 ft wide at the south doors, 75 ft long; tapers to 20 ft wide at approximately 50 ft in,
        connecting to the N-S hallway</li>

        <li>light: dim (blue-white magical torches, ~half functioning, ~two-thirds of those still burning; NE corner is
        dark)</li>

        <li>cover: 8 freestanding pillars in two rows of 4 (half cover); shadow side-aisles between pillars and walls
        (three-quarters cover from center path); fallen pillar rubble in NE corner (full cover)</li>

        <li>sight_lines: center path has clear line to N-S hallway (north); side-aisles obscured by pillar rows and dim
        light; taper narrows field of view approaching the hallway</li>

        <li>occupants: none (standard)</li>

        <li>atmosphere: cold, dry, still; bronze mineral scent; sound echoes with half-beat delay from vault; silence
        near tapestried walls</li>

        <li>tactical: shadow corridors are the key feature — Nagaji use the side-aisles; DC 12 Perception to notice the
        depth before committing to center path; scraped center path telegraphs recent large-creature movement; taper
        creates a natural funnel toward the hallway</li>

        </ul>

        </li>

        <li><p><strong>Central Hallway Cross</strong> [hallway system] → <a
        href="floor-1/central-hallway.md">central-hallway.md</a></p>

        <ul>

        <li>dimensions: 20 ft wide throughout; N-S hallway connects South Entrance (south) to Grand Hall double doors
        (north); E-W hallway intersects at a 20 ft × 20 ft center square; E-W wings extend approximately 120 ft in each
        direction from center</li>

        <li>light: dark (no magical lighting in hallways)</li>

        <li>cover: minimal in hallways (flat walls, no alcoves described)</li>

        <li>sight_lines: long sight lines down each hallway axis; corners at the center intersection block cross-axis
        views</li>

        <li>occupants: patrol route for Nagaji</li>

        <li>tactical: the center intersection is the most important decision point on the floor — four directions of
        movement; hallway width (20 ft) allows 4-abreast formation or two-abreast with flanking space</li>

        </ul>

        </li>

        <li><p><strong>2. Grand Hall — Hiroba</strong> [chamber: oval, 125W × 100 N-S] → <a
        href="floor-1/grand-hall.md">grand-hall.md</a></p>

        <ul>

        <li>dimensions: oval room, 125 ft east-to-west, 100 ft north-to-south; ceiling not visible (well beyond standard
        darkvision range — statue is 250 ft, so ceiling must be at least that)</li>

        <li>access: double set of double doors on south wall (from N-S hallway, ~10 ft vestibule between door sets);
        double set of double doors on north wall (directly into Inner Sanctum)</li>

        <li>light: dark (no natural light; statue radiates warm light within 30 ft; pools emit faint blue-white
        luminescence)</li>

        <li>cover: central statue and plinth (full cover); collapsed offering tables and debris (half cover at
        edges)</li>

        <li>sight_lines: both door sets visible from center; far walls require darkvision or brought light; oval
        geometry means no blind corners</li>

        <li>occupants: 2 Shadows (upper darkness, descend when disturbed, avoid pools); Nagaji Bushi ×1, Hohei ×2,
        Ashigaru ×6 (on rotation from Naijin)</li>

        <li>atmosphere: the statue&#39;s warmth zone (30 ft radius) contrasts with the cold decay beyond it; cold-based
        effects within 30 ft of statue have damage reduced by 1d4</li>

        <li>tactical: the statue is the only spatial anchor; the pools create a safe zone the Shadows and Nagaji avoid;
        upper darkness is effectively infinite vertical space for the Shadows; the double-double-door arrangement on
        both ends creates two vestibule chokepoints</li>

        </ul>

        </li>

        <li><p><strong>3. Star Shrine — Okuden</strong> [chamber: 45W × 35D] → <a
        href="floor-1/star-shrine.md">star-shrine.md</a></p>

        <ul>

        <li>dimensions: square room, 45 ft wide × 35 ft deep</li>

        <li>access: 10 ft wide hallway, approximately 60 ft long, extending north from the north side of the west wing
        of the E-W hallway</li>

        <li>light: dark (moonlight projection through ceiling shaft when Kagetsu is positioned; otherwise pitch
        black)</li>

        <li>cover: central dais (minimal cover — low stone platform); no other furnishings</li>

        <li>sight_lines: clear sight to all walls from center; 10 ft wide entrance hallway is the only break</li>

        <li>occupants: Nagaji Kannushi (returns periodically to meditate on dais)</li>

        <li>atmosphere: complete sound suppression at threshold; polished obsidian floor still reflective; isolated and
        sacred</li>

        <li>tactical: single entrance/exit via 60 ft hallway (10 ft wide — two-abreast); sound suppression means combat
        here is inaudible from the main hallway — works both ways; 60 ft approach hallway is a long kill zone</li>

        </ul>

        </li>

        <li><p><strong>4. Mess Hall — Shokudo</strong> [room: 50W × 50D] → <a
        href="floor-1/mess-hall.md">mess-hall.md</a></p>

        <ul>

        <li>dimensions: 50 ft wide × 50 ft deep</li>

        <li>access: L-shaped hallway (10 ft wide) from the south side of the west wing — heads south 35 ft, then turns
        east 45 ft into the mess hall</li>

        <li>light: dark (no magical lighting; gap in kitchen west wall admits thin blade of natural light)</li>

        <li>cover: collapsed tables (half cover); hearth rubble (half cover); kitchen doorway (three-quarters
        cover)</li>

        <li>sight_lines: open floor plan; kitchen visible to the west; L-hallway blocks direct sight to main E-W
        hallway</li>

        <li>occupants: 4 Swarms of Rats (nest in collapsed west wall section of kitchen; not aggressive unless
        cornered)</li>

        <li>atmosphere: pervasive old char smell; draft of clean mountain air from kitchen west wall gap</li>

        <li>tactical: L-shaped hallway means no line of sight from the main corridor — must commit to the turn; rats are
        a noise hazard if startled</li>

        </ul>

        </li>

        <li><p><strong>4a. Kitchen</strong> [room: 35W × 35D]</p>

        <ul>

        <li>dimensions: 35 ft wide × 35 ft deep, west side of the mess hall</li>

        <li>features: great central hearth (partially collapsed, iron crane bent); gap in west wall mortar (admits
        mountain air and thin natural light); larder in far corner (door half-open, shelved goods collapsed to
        dust)</li>

        <li>tactical: west wall gap is a potential secondary exit (small, would require squeezing); kitchen is a
        defensible fallback position from the mess hall</li>

        </ul>

        </li>

        <li><p><strong>5. Dormitories — Bo</strong> [corridor complex] → <a
        href="floor-1/dormitories.md">dormitories.md</a></p>

        <ul>

        <li>dimensions: corridor complex branching off both north and south sides of the east wing hallway, 120 ft from
        center intersection; corridor is two-person width with individual cells branching L/R</li>

        <li>access_north: north-side dormitory — cells, sealed shared room (barred from inside)</li>


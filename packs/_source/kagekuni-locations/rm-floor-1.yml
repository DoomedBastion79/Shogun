        <h3 id="kg-dm-architecture-notes-first-floor" data-section="dm-architecture-notes-first-floor">DM Architecture
        Notes — First Floor</h3>

        <p><strong>The Temple&#39;s Two States</strong>

        The central dramatic tension of the first floor is the contrast between what has decayed and what has not. The
        statue and pools are perfect. Everything else is dying. This should never be explained — just felt. Players will
        draw their own conclusions. The correct conclusion (that Kinryu&#39;s lingering presence, however attenuated,
        maintains what is closest to their effigy) is available to a DC 16 Arcana or Religion check, but it should not
        be handed out.</p>

        <p><strong>The Nagaji as Former People</strong>

        The party does not yet know the Nagaji are transformed Gekko clan members. Everything in this floor should add
        weight to that eventual revelation without revealing it. The intact bowl placed in the kitchen. The Nagaji drawn
        to the meditation space. The chief seimaster who has made a nest in the sanctum and sorted the debris with
        scholarly instinct. When the truth lands — they will look back at all of this differently.</p>

        <p><strong>The Nagaji Zasu — Playing the Encounter</strong>

        The chief seimaster is not a simple monster. If the party manages to communicate — through magic, through
        gesture, through patience — fragments of the original person respond. They remember the ritual. They remember it
        going wrong. They cannot fully articulate what they know, but a character who succeeds on a DC 15 Insight check
        during any interaction realizes: <em lang="ja-Latn">this thing is trying to tell them something.</em> A DC 18
        Persuasion check (with appropriate magical translation) can open a halting exchange. The abomination knows the
        temple&#39;s layout, including the scriptorium above. They cannot reverse what happened to themselves. But they
        might help someone else try.</p>

        <p><strong>Connecting to the Floors Above</strong>

        The scriptorium — where the Gekko reversal documentation lives — is on an upper floor. The first floor exists to
        prepare the party for that discovery: the sei-lacquer pointer from the surviving scroll, the celestial-timing
        insight from the star shrine, the bronze disc as a key, the Kinryu no Chikara mandate as a credential.
        Everything here is a tool for what comes next.</p>

        <p><strong>The Observatory Thread</strong>: Five observatory components are distributed across the first floor
        (Susanoo lens in the Grand Hall, planetary gear assembly in the dormitories, calibration disc on the bronze
        order seal, Tsukuyomi lens in the Star Shrine relic collection, sei conduit filament in the sanctum scroll).
        Additional components exist on the second floor. A party that explores thoroughly will accumulate components
        without necessarily understanding what they&#39;re for — the observatory itself, when they reach it, provides
        the context. The first component a player identifies (likely the planetary gear assembly, lowest Investigation
        DC) should prompt a &quot;what is this part of?&quot; question. Do not answer it directly. Let them carry the
        mystery upward. The orrery, when they find it, is the answer.</p>

        <p><strong>The Pools — Spending Wisely</strong>

        With approximately 48 charges of healing, condition removal, curse cleansing, and blessings available, the pools
        are a meaningful mid-dungeon resource. The party should understand they are finite. A character who examines the
        pools carefully (DC 13 Arcana) senses that the supply is not replenishing — each use is a permanent expenditure
        of something the temple has been holding in reserve for a very long time. Note: Kegare no Yamai (from Yaminezumi
        bites) auto-cleanses on pool entry at 1 charge per stack — the party may spend charges without realizing it.</p>


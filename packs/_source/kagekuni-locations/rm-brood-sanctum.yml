        <h3 id="kg-wyrmling39s-recognition" data-section="wyrmling39s-recognition">Wyrmling&#39;s Recognition</h3>

        <p>When the party leaves the chamber with the wyrmling, they re-enter the hallway. What happens next is the
        chamber&#39;s true ending — the moment Aya has waited millennia for.</p>

        <h3 id="kg-the-wyrmling39s-recognition-success-path" data-section="the-wyrmling39s-recognition-success-path">The
        Wyrmling&#39;s Recognition (Success Path)</h3>

        <blockquote>

        <p>The wyrmling stirs in [bonded character]&#39;s arms, then drops gently to the stone floor. It crosses the
        hallway on small careful feet — past the rest of you, past your boots and your blades, past everything in the
        world but the woman at the end of the hall.</p>

        <p>She does not move.</p>

        <p>The wyrmling stops in front of her, lowers its small golden head, and <em lang="ja-Latn">bows</em> — slow,
        deliberate, the way one bows to a parent or a guardian who has kept watch through a long night. Then it leans
        forward and presses the side of its face against her hand, like a dog returning to its owner after a very long
        absence.</p>

        <p>Something in the way she stands changes —  a weight lifted. For the first time since you laid eyes on her,
        she moves not as a guardian, but as a person.</p>

        <p>She bows. Deeply. To all of you.</p>

        </blockquote>


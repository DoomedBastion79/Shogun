        <h3 id="kg-plinth-inscription" data-section="plinth-inscription">Plinth Inscription</h3>

        <h2 id="kg-the-inscription" data-section="the-inscription">THE INSCRIPTION</h2>

        <p>Carved into the rim of the basalt plinth, in flowing classical script, is a passage left by the temple&#39;s
        last faithful before the order&#39;s fall. Visible to anyone who approaches the pool (Investigation DC 10, or
        simply by reading the plinth). Translation requires Common, Draconic, or a relevant Religion / History check (DC
        12) for those without the language.</p>

        <blockquote>

        <p><em lang="ja-Latn">&quot;In the hour our flame falters, we entrust to this place our greatest treasure. Let
        it sleep beneath the stars our masters set. Let it wait, as we cannot. Let no hand take it but the hand of one
        who would rebuild what we could not save — one whose worth is measured not in birth or rank but in the steady
        weight of a true heart. To such a one: wake what we have kept. Restore the faith we lost. The dragon&#39;s child
        is yours. Be worthy of it.&quot;</em></p>

        </blockquote>

        <h2 id="kg-sealed" data-section="sealed">[SEALED]</h2>

        <h3 id="kg-inscription-dm-notes" data-section="inscription-dm-notes">Inscription DM Notes</h3>

        <p>The inscription does three things:</p>

        <ol>

        <li><strong>Tells the party what they have found</strong> — without spelling it out. &quot;Greatest
        treasure,&quot; &quot;dragon&#39;s child,&quot; &quot;wake what we have kept&quot; — implications land as the
        party reads.</li>

        <li><strong>Establishes the moral weight of the bond</strong> — this is not loot. It is a charge. The bonded
        character is being asked to <em lang="ja-Latn">rebuild faith</em>. That should resonate forward through the
        campaign.</li>

        <li><strong>Hints at the puzzle&#39;s logic</strong> — <em lang="ja-Latn">&quot;the steady weight of a true
        heart&quot;</em> is a direct pointer to the kneeling pad. The candidate must <em lang="ja-Latn">settle</em> —
        physically and morally. Religion DC 14 to make the connection explicit.</li>

        </ol>

        <p><strong>Calligraphy</strong>: The script is fine but unhurried — written by someone who knew they were
        running out of time but refused to let that show in their work. A character with calligraphy training (Sun
        Wukong via Tranquil Lotus discipline; Ko&#39;jiri via different channels) might note this detail and find it
        moving.</p>


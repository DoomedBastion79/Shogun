        <h3 id="kg-the-four-gifts" data-section="the-four-gifts">The Four Gifts</h3>

        <p>The bonded character receives the wyrmling. The other three each receive one personalized offering. Each
        offering is presented as a paired choice the player makes <strong>blind</strong> — Aya names the <em
        lang="ja-Latn">shape</em> of each path, never the mechanical outcome. The DM resolves the actual reward only
        after the player commits.</p>

        <p>For <strong>Relc</strong>, <strong>Ko&#39;jiri</strong>, and <strong>Dian Wei</strong>, the choice is
        <strong>nested</strong>: she names the broad path first, and only after the player picks does she present the
        narrower sub-choice. For <strong>Sun Wukong</strong>, the broad and narrow are the same.</p>

        <p>Mechanical specifics for each gift are tuned at session-time, scaled to the bonded PC&#39;s level and party
        composition (same calibration rule as the wyrmling stat block).</p>


  - _id: RiA8Pb7GWForqIDy
    _key: '!journal.pages!TNV9pLqaBUzySDRl.RiA8Pb7GWForqIDy'
    name: DM Notes — Integration
    type: text
    title:
      show: true
      level: 3
    image: {}
    text:
      format: 1
      content: >-
        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="Why the Wyrmling Is
        Here">

        <h3 id="kg-why-the-wyrmling-is-here" data-section="why-the-wyrmling-is-here">Why the Wyrmling Is Here</h3>

        <p>When the temple order was infiltrated and destroyed (worshippers of Akaryū and Kokuryū caused the rift, per
        established canon), the surviving Kinryū-faithful sealed this chamber with the egg already inside, in stasis.
        The egg has waited in slow time for a worthy claimant ever since. The temple&#39;s foundational architecture
        sustains the stasis indefinitely and enforces the chamber&#39;s protections without need for an animate keeper.
        The brood guardian outside is a separate measure — a filter, not a custodian.</p>

        <p>The egg&#39;s parent dragon is one of Kinryū&#39;s true descendants — not Kinryū itself (Kinryū is a
        Progenitor in deep slumber per canon) but a child of Kinryū&#39;s lineage. Whether that parent is alive
        somewhere in the world or long dead is a thread the campaign can develop or leave dormant.</p>

        <p><strong>The egg was placed here by Aya</strong> — a Kinryū-faithful priestess (or paladin / oathbound
        Guardian; DM picks final role) who served at the temple&#39;s last hour. When the order fell, she carried the
        egg into this chamber, sealed the door, and bound herself to the architecture rather than abandon her charge.
        The temple took her self-memory in exchange for letting her hold the post for as long as it took. She has stood
        in the hallway ever since, not as a creature of the temple but as a person who refused to leave it. See <em
        lang="ja-Latn">Departure</em> for the moment her watch ends.</p>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-campaign" data-kind="campaign" data-label="Pre-Chamber Hints">

        <h3 id="kg-layered-discovery-pre-chamber-hints" data-section="layered-discovery-pre-chamber-hints">Layered
        Discovery — Pre-Chamber Hints</h3>

        <p>To make the chamber feel <em lang="ja-Latn">earned</em> rather than dropped, seed these in upstream
        content:</p>

        <ul>

        <li><strong>Religion DC 14</strong> in the Star Shrine (first floor): the Bushido were carved here in the
        original eight before the Kinryū order&#39;s fall. References to &quot;the heart-virtue&quot; suggest <em
        lang="ja-Latn">meiyo</em> held a position of singular weight in the temple&#39;s tradition.</li>

        <li><strong>History DC 16</strong> in the Dormitories or first-floor archives: References to a &quot;child of
        the inheritor&quot; being held in the temple&#39;s care. The text reads as ceremonial allegory; it is not.</li>

        <li><strong>Ko&#39;jiri&#39;s research advantage</strong> (Golden Dragon Clan): If the party finds any
        pre-chamber documents, Ko&#39;jiri can identify references to an &quot;egg-holding&quot; function of certain
        temple sites. He has assumed all his life this was metaphor.</li>

        <li><strong>Relc&#39;s Sacred Grove connection</strong>: If the party finds pre-chamber documents referencing
        the Order of the Sacred Grove&#39;s relationship with the Golden Dragon Clan, Relc gets a narrative beat — Solas
        may have known this place existed.</li>

        </ul>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-pacing" data-kind="pacing" data-label="When to Run This
        Chamber">

        <h3 id="kg-when-to-run-this-chamber" data-section="when-to-run-this-chamber">When to Run This Chamber</h3>

        <p>Recommended timing: <strong>after the first floor is fully explored and the party has earned at least one
        major revelation about the temple&#39;s true nature.</strong> The Brood Sanctum should feel like a culmination,
        a reward for engagement with the temple&#39;s deeper layers.</p>

        <p>If the party rushes past the first floor, the upper floors should be physically inaccessible until they slow
        down and engage with what&#39;s already in front of them.</p>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-campaign" data-kind="campaign" data-label="Aftermath —
        Ripples">

        <h3 id="kg-aftermath-ripples" data-section="aftermath-ripples">Aftermath — Ripples</h3>

        <p>Whichever character bonds has just had their character arc transformed:</p>

        <ul>

        <li><strong>If Relc bonds</strong>: The Sacred Grove&#39;s connection to the Golden Dragon Clan is no longer
        historical — it is present, walking with him. Solas&#39;s death takes on additional weight. The Order of the
        Ancient Guard now has a vested personal interest in Relc&#39;s survival.</li>

        <li><strong>If Ko&#39;jiri bonds</strong>: The ultimate cosmic joke — the con artist who built his career faking
        Kinryū&#39;s authority is now bonded to an actual scion of Kinryū. The dragon statue plot thread (the
        disapproving statue tracking him) resolves: the statue softens, perhaps smiles. He is now genuinely what he
        pretended to be. His character work for the rest of the campaign should grapple with this.</li>

        <li><strong>If Dian bonds</strong>: His father&#39;s accusation in the emperor&#39;s assassination becomes a
        sharper political problem — a son carrying a Kinryū wyrmling is not a son anyone wants associated with regicide.
        Daimyo Kazuhiko&#39;s investigation gains urgency.</li>

        <li><strong>If Sun Wukong bonds</strong>: The Tranquil Lotus&#39;s relationship with the Order of the Ancient
        Guard (via
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.5uySp1O85TJzLFmF]{Benkei})
        becomes a vector of consequence. Benkei will need to know. Whether he tells the rest of the order, and how, is a
        meaningful choice.</li>

        </ul>

        <p><strong>In all cases</strong>, the bonded character&#39;s relationship with the rest of the party is changed
        — they are now carrying something that affects everyone&#39;s safety. Inter-party negotiation about how to
        handle the wyrmling&#39;s existence is rich roleplay territory. <em lang="ja-Latn">Chūgi</em> will be tested by
        these conversations as much as by external threats.</p>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-open-items" data-kind="open-items" data-label="Loose Ends to
        Track">

        <h3 id="kg-loose-ends-to-track" data-section="loose-ends-to-track">Loose Ends to Track</h3>

        <p>Add to <code>Obsidian/dm/decisions.md</code> and/or <code>Obsidian/dm/plot-threads.md</code>:</p>

        <ul>

        <li class="kg-task" data-done="false"><strong>Build six primary scenes + 2–3 alternates per virtue</strong> (gi,
        yū, jin, rei, makoto, jisei). Scene design is the next major piece of work.</li>

        <li class="kg-task" data-done="false"><strong>Brood guardian stat block</strong> — built when the chamber comes
        into play; only triggered in State A escalation.</li>

        <li class="kg-task" data-done="false"><strong>Wyrmling stat block</strong> — build when the chamber comes into
        play; balance against bonded PC and party composition; staged growth tied to <em lang="ja-Latn">chūgi</em>
        adherence.</li>

        <li class="kg-task" data-done="false"><strong>Wyrmling parent</strong> — alive or dead? Decide before stat block
        work begins.</li>

        <li class="kg-task" data-done="false"><strong>Pre-chamber breadcrumbs</strong> in first-floor content (Religion
        DC 14, History DC 16 hooks above).</li>

        <li class="kg-task" data-done="false"><strong>Decide which faction first becomes aware the wyrmling exists, and
        how</strong> (Black Lily? Murasakiryū-cult survivors? Solas&#39;s killer?).</li>

        <li class="kg-task" data-done="false"><strong>Define what counts as &quot;meaningful restoration&quot;</strong>
        to move guardian from State B to State C — orrery is canonical; what else?</li>

        </ul>

        <hr>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-open-items" data-kind="open-items" data-label="Wyrmling —
        Naming, Stat Block (TBD), Campaign Secret">

        <p><strong>Name</strong>: The wyrmling does not yet have a name. The bonded character will name it. Encourage a
        Japanese name for thematic consistency; suggestions if the player needs prompting — <em
        lang="ja-Latn">Hikari</em> (light), <em lang="ja-Latn">Kohaku</em> (amber), <em lang="ja-Latn">Akari</em>
        (radiance), <em lang="ja-Latn">Tsubasa</em> (wings), <em lang="ja-Latn">Ryūji</em> (dragon-child).</p>

        <p><strong>Mechanical statistics will be developed at a future time.</strong> When the chamber actually comes
        into play, build the companion stat block then — balanced against the bonded character&#39;s class, level, and
        party composition. Per <a href="../../canon/dragon-favor.json">canon/dragon-favor.json</a>, the golden wyrmling
        baseline is CR 4, Tasha&#39;s sidekick framework. Staged growth (hatchling → juvenile → mature) is the
        recommended framework, calibrated to <em lang="ja-Latn">chūgi</em> adherence.</p>

        <p><strong>Critical campaign-level note</strong>: The existence of a living Kinryū-descended wyrmling is
        <strong>a profound campaign secret</strong>. The Order of the Ancient Guard would consider this child of utmost
        importance. The mortal faction that woke Murasakiryū would consider it a threat to be eliminated or co-opted.
        Solas&#39;s killer would absolutely want to know about this. The bonded character should be made to understand,
        narratively, that revealing the wyrmling carelessly is dangerous. Disguising it as a more mundane creature (a
        large lizard, an exotic pet from Tatara) will eventually become a real concern.</p>

        <hr>


        </section>

        <hr>

        <h2 id="kg-blessing-rules" data-section="blessing-rules">Blessing Rules</h2>

        <p><strong>Maximum</strong>: 2 active blessings at a time per creature.</p>

        <p><strong>Natural 20 — Reroll Twice</strong>:</p>

        <ul>

        <li>Roll twice on the table; receive both blessings (if under the 2-blessing maximum)</li>

        <li>If already at 2 blessings when rolling 20: roll twice, keep one (DM chooses if the two results are
        different; if one result matches a blessing already held, the other automatically applies)</li>

        <li>If the two rerolls produce identical results: the blessing is applied once — no bonus, no enhancement</li>

        <li>A subsequent 20 on a reroll follows the same rules — reroll twice again for that slot</li>

        </ul>

        <p><strong>The only way to receive 2 blessings</strong> is with a natural 20 on the initial prayer roll.</p>

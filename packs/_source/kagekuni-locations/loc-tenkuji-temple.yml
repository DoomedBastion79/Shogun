  - _id: ROUCwkeivh3ynJwZ
    _key: '!journal.pages!TNV9pLqaBUzySDRl.ROUCwkeivh3ynJwZ'
    name: Central Hallway Cross — Watariro
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <p><em lang="ja-Latn">The structural spine of the first floor — a N-S corridor from the South Entrance meeting
        an E-W corridor that connects all wings.</em></p>

        <hr>

        <p><strong>Physical Description:</strong></p>

        <p><strong>N-S Corridor:</strong> 20 ft wide, connecting the South Entrance&#39;s tapered northern end to the
        Grand Hall&#39;s double double-doors. Stone walls, unadorned — functional architecture, not ceremonial. The
        transition from the South Entrance&#39;s vaulted height to this corridor&#39;s lower ceiling is abrupt. The
        Grand Hall doors are visible from the corridor&#39;s southern end.</p>

        <p><strong>Center Intersection (20 ft × 20 ft):</strong> Where the N-S and E-W corridors meet. A squared
        junction with sight lines extending in all four cardinal directions. The floor here is worn smooth — more
        traffic passed through this point than any other in the temple. Faint grooves in the stone suggest centuries of
        foot traffic, carts, and ritual procession.</p>

        <p><strong>E-W Corridor:</strong> 20 ft wide, extending approximately 120 ft in each direction from the center
        intersection.</p>

        <ul>

        <li><p><strong>West wing:</strong> Star Shrine hallway branches north at the far end (10 ft wide, 60 ft long).
        Mess Hall L-shaped hallway branches south at the far end. Stairs upward to the second floor at 45 ft west of
        center (north side). Stairs downward to the lower level are tucked into a recessed alcove inside the Mess Hall
        L-hallway — east wall, ~5 ft south of the west wing corridor, easily missed unless the party rounds the corner
        toward the Mess Hall.</p>

        </li>

        <li><p><strong>East wing:</strong> Dormitory entrances on both sides at the far end — north side accessible,
        south side entrance collapsed (rubble blocks passage; the wing beyond is <em lang="ja-Latn">pristine</em> —
        preserved by the seal itself, never touched by Nagaji or weather). Stairs upward to the second floor at 45 ft
        east of center.</p>

        </li>

        </ul>

        <p><strong>Lighting:</strong> Dark. No sconces in the corridors — the South Entrance&#39;s magical torches end
        at the taper. Whatever light reaches the hallways comes from adjacent rooms or what the party carries.</p>

        <p><strong>Atmosphere:</strong> The corridors carry sound efficiently. Footsteps echo along the long axes. The
        center intersection amplifies this — sound from any wing reaches the center. A party moving without care can be
        heard from 60+ feet away.</p>

        <hr>

        <section class="secret kg-secret-discoverable" data-kind="discoverable">

        <p><strong>Discoveries</strong></p>

        <ul>

        <li class="kg-task" data-done="false"><strong>Traffic patterns in the stone</strong> (DC 12 Investigation or
        Survival)</li>

        <li class="kg-task" data-done="false"><strong>Stair conditions — up and down</strong></li>

        </ul>

        <p><strong>Traffic Patterns</strong>: The wear in the stone tells a story. The heaviest traffic ran N-S (South
        Entrance to Grand Hall) — the primary processional route. The E-W corridor shows lighter but consistent wear
        toward both wings. Near the stairs, the stone is more worn on the western side than the eastern, suggesting the
        order&#39;s daily life centered more on the Star Shrine and Mess Hall side than the dormitory side. DC 12
        Investigation or Survival to read the pattern.</p>

        <p><strong>The Stairs</strong>:</p>

        <p><em lang="ja-Latn">Stairs down (recessed alcove inside the Mess Hall L-hallway, east wall, ~5 ft south of the
        west wing corridor):</em> Stone steps descending into darkness. The recess is set back from the main corridor
        and is easy to miss — the party has to round the corner toward the Mess Hall to notice it. Air from below is
        warmer and carries a faint mineral dampness, different from the dry cold of the first floor. The steps are
        intact but dust-covered. Recent tracks in the dust: Nagaji. This is their route to and from the lower
        levels.</p>

        <p><em lang="ja-Latn">Stairs up — west (45 ft west of center, north side of E-W hallway):</em> Stone steps
        ascending. Dust undisturbed — the Nagaji have not gone up. Whatever is on the second floor, they either cannot
        reach it or have not tried.</p>

        <p><em lang="ja-Latn">Stairs up — east (45 ft east of center):</em> Stone steps ascending. Also undisturbed. A
        second route to the upper level, positioned near the dormitory wing.</p>

        <hr>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-encounter" data-kind="encounter" data-label="Encounters">

        <ul>

        <li class="kg-task"
        data-done="false">@UUID[Compendium.kagekuni-assistant.monsters.Actor.d1fY2hMfDH5AEG01]{Nagaji Bushi} ×1 (squad
        leader; rotation from the Inner Sanctum)</li>

        <li class="kg-task"
        data-done="false">@UUID[Compendium.kagekuni-assistant.monsters.Actor.hAwrGQZm9y3ULibw]{Nagaji Hohei} ×2</li>

        <li class="kg-task"
        data-done="false">@UUID[Compendium.kagekuni-assistant.monsters.Actor.0U3ovqWCecMOrh9C]{Nagaji Ashigaru} ×6</li>

        </ul>

        <p><strong>Why they&#39;re here, not in the Grand Hall</strong>: The squad will not stand in the Grand Hall —
        the statue&#39;s @UUID[Compendium.kagekuni-assistant.monsters.Actor.ktiauQE10JXYuTV6]{Kageban} have killed every
        patrol that lingered (see
        @UUID[Compendium.kagekuni-assistant.locations.JournalEntry.TNV9pLqaBUzySDRl.JournalEntryPage.tqUpQPP3v45gUDzI]{The
        Grand Hall — Hiroba}&#39;s DM Notes). The hallway cross is their staging ground: it controls all three wings,
        lets them transit between the Inner Sanctum (their barracks) and the lower stairs, and keeps them clear of the
        warmth radius they cannot survive provoking. The 20 ft × 20 ft center intersection is where the squad most often
        massed — a meeting point if the party moves noisily, and a likely fight if the party blunders past the South
        Entrance taper without scouting.</p>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="DM Notes">

        <p><strong>Tactical Significance</strong>: The center intersection is the single most important control point on
        the first floor. A party that holds the intersection controls access to every wing. Conversely, enemies at the
        intersection can cut the party off from rooms they&#39;ve already cleared. The 20 ft width allows two-abreast
        combat but not flanking without entering a side corridor.</p>

        <p><strong>The Nagaji Route</strong>: The stairs down (recessed alcove inside the Mess Hall L-hallway) are the
        Nagaji&#39;s primary transit path. Their tracks are visible in the dust along the west wing and into the
        L-hallway recess. The stairs up show no such traffic — the second floor appears to be outside their patrol
        pattern. This is a meaningful detail: whatever drove the Nagaji to occupy the first floor and the levels below,
        the upper floor was either inaccessible to them or not worth their attention.</p>

        <p><strong>Sound Propagation</strong>: The corridors amplify sound. A fight at the center intersection can be
        heard from the South Entrance, the Grand Hall doors, and partway down both wings. This matters for encounter
        pacing — combat here draws attention from adjacent areas.</p>


        </section>

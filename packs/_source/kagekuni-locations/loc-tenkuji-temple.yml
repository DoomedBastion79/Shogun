  - _id: i02GkWoJregovtsx
    _key: '!journal.pages!TNV9pLqaBUzySDRl.i02GkWoJregovtsx'
    name: The Mess Hall and Kitchen — Shokudo
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-read-aloud-the-mess-hall-and-kitchen"
        data-section="read-aloud-the-mess-hall-and-kitchen">Read-Aloud — The Mess Hall and Kitchen</h4></header>

        <p><em lang="ja-Latn">The hallway turns — south, then east — and the smell finds you before the room does. The
        fire was a long time ago. The smell of it is still here.</em></p>

        <p><em lang="ja-Latn">Not a fresh smell — old char, baked into stone so thoroughly it has become part of the
        stone.</em></p>

        <p><em lang="ja-Latn">The passage opens into a broad space — fifty feet across, fifty deep. Long low tables run
        the length of it. The ones nearest the kitchen archway to the west are charred down to their legs. The ones
        farther away have simply rotted, their surfaces caved in over years of neglect. Ceramic bowls are scattered
        across the floor, cracked and blackened, lying where they fell.</em></p>

        <p><em lang="ja-Latn">One bowl is upright. Intact. Set on the floor near the far wall as if someone placed it
        there.</em></p>

        <p><em lang="ja-Latn">Dark stains mark the stone in places. The occasional fragment of bone, scattered, has been
        here long enough to look like part of the room.</em></p>

        <p><em lang="ja-Latn">Through the kitchen archway to the west, the damage is worse. The ceiling there is black,
        scorched to a depth that centuries of stillness have not touched. The great central hearth has partially
        collapsed inward; the iron crane that hung above it is bent at an angle that suggests heat far beyond anything a
        cooking fire would produce. In the far wall, a section of mortar gave out — from the heat, from the cold, from
        something — leaving a ragged gap that lets in a thin blade of mountain air, clean and sharp against everything
        else in the room.</em></p>

        <p><em lang="ja-Latn">In the far corner of the kitchen, a larder door stands half-open. Inside, shapes on
        shelves that might have been preserved goods — jars, sacks, something — have collapsed into uniform grey
        dust.</em></p>


        </article>

        </div>




        <p><em lang="ja-Latn">Southwest wing, accessible via L-shaped hallway from the south side of the west E-W
        hallway.</em></p>

        <p><strong>Physical Description:</strong></p>

        <p>Accessed via an L-shaped hallway (10 ft wide) from the south side of the west wing — south 35 ft, then east
        45 ft into the mess hall. No direct line of sight from the main corridor. Pervasive old char smell baked
        permanently into the stone. Draft of clean mountain air from a gap in the kitchen&#39;s west wall.</p>

        <p><strong>Mess Hall (50 ft × 50 ft):</strong> Long low tables running the length of the space. Tables nearest
        kitchen charred to legs; farther tables rotted, surfaces caved in. Cracked and blackened ceramic bowls scattered
        on the floor. Dark stains on stone. Scattered bone fragments. One ceramic bowl upright, intact, placed (not
        fallen) near the far wall — recently wiped clean of grime.</p>

        <p><strong>Kitchen (35 ft × 35 ft, west side of mess hall):</strong> Ceiling scorched black to significant
        depth. Great central hearth partially collapsed inward. Iron crane above hearth bent by extreme heat (far beyond
        normal cooking fire — this was a deliberate blaze). Gap in west wall mortar admits outside air and thin natural
        light.</p>

        <p><strong>Larder:</strong> Far corner of kitchen, door half-open. Shelved goods collapsed into uniform grey
        dust. Contains a sealed double-fired ceramic jar with intact wax seal (magical preservation).</p>

        <hr>

        <section class="secret kg-secret-discoverable" data-kind="discoverable">

        <p><strong>Discoveries</strong></p>

        <ul>

        <li class="kg-task" data-done="false"><strong>The Intact Bowl</strong> (DC 13 Investigation)</li>

        <li class="kg-task" data-done="false"><strong>The Sealed Jar — inscription</strong> (DC 14 Investigation) <em
        lang="ja-Latn">(Handout: &quot;They are already inside. Hiroki knows.&quot;)</em></li>

        </ul>

        <p><strong>The Intact Bowl</strong>: The single upright, unbroken bowl is a small mystery with a simple answer —
        it was placed there by a Nagaji. They found it intact in the larder rubble and set it on the floor for reasons
        even they could not articulate. An instinct toward ritual. A faint echo of the person they used to be. DC 13
        Investigation to notice the bowl has been wiped clean of grime, recently.</p>

        <p><strong>What Can Be Found</strong>: DC 14 Investigation in the larder reveals, beneath the uniform dust and
        decay: a sealed ceramic jar, double-fired with a wax seal that has held. Inside — preserved vegetables,
        technically still edible though profoundly unpleasant (the preservation is magical in nature, a minor kitchen
        enchantment common to the order). More importantly, scratched into the inside of the jar&#39;s lid in hasty
        characters: <em lang="ja-Latn">&quot;They are already inside. Hiroki knows. The gate will not save
        us.&quot;</em> This is a message from a priest who died in this room, writing in the moment of understanding. It
        is a handout. It confirms that the order&#39;s destruction came from within, not from outside assault.</p>

        <p><em lang="ja-Latn">Note: The Tsukuyomi projection lens was originally hidden in this jar by a priest during
        the fall. It has since been found and moved by the
        @UUID[Compendium.kagekuni-assistant.monsters.Actor.OGA1LtjRQuabbHHR]{Nagaji Kannushi} to the Star Shrine
        (Okuden), where it now resides among the Kannushi&#39;s collected relics. The jar contains only the inscription
        and preserved vegetables.</em></p>

        <hr>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-encounter" data-kind="encounter" data-label="Encounters">

        <ul>

        <li class="kg-task" data-done="false">4 Yaminezumi (闇鼠 — &quot;Darkness Rats&quot;; nest in collapsed west wall
        section of kitchen; not aggressive unless cornered; carry Kegare no Yamai)</li>

        </ul>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="DM Notes">

        <p><strong>Yaminezumi (闇鼠 — Darkness Rats)</strong>: Four Swarms of Rats (MM p.339) that have lived in the dark
        corruption of the temple long enough to have changed. They have nested in the collapsed section of the west
        wall. Not aggressive unless cornered. Their presence means something edible was here recently — they have been
        feeding on the Nagaji&#39;s food stores, which are stashed in the larder area. <strong>Carry Kegare no
        Yamai</strong>: On a successful hit, target makes a DC 12 Constitution saving throw or gains one stack of Kegare
        no Yamai (see <code>floor-1/kegare-no-yamai.md</code>).</p>

        <p><strong>The Fire</strong>: The kitchen fire was deliberate — set by the Akaryu/Kokuryu infiltrators as part
        of the final assault on the order. It was intended to drive the priests out of this wing and into the Grand
        Hall, cutting off retreat to the southern entrance and funneling the defenders. It worked. The conflict that
        killed most of the order happened in the dormitory corridor and the Grand Hall, not here.</p>

        <p><strong>Atmosphere</strong>: The room smells of old char and cold stone. The draft from the gap in the west
        wall carries mountain air — clean, sharp, a relief from the closed smell of the rest of the temple. Sound
        behaves normally here, unlike the shrine.</p>


        </section>

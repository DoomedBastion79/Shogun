  - _id: ZeTzCk35SKRexWiF
    _key: '!journal.pages!TNV9pLqaBUzySDRl.ZeTzCk35SKRexWiF'
    name: Kegare no Yamai — Disease of Defilement
    type: text
    title:
      show: true
      level: 3
    image: {}
    text:
      format: 1
      content: >
        <p><strong>Type</strong>: Curse (not disease)</p>

        <p>Reflects <span class="kg-jp" lang="ja-Latn" title="穢れ — spiritual impurity">kegare</span> as spiritual
        pollution — a Shinto concept of ritual impurity — not physical illness. Removal requires <em
        lang="ja-Latn">Remove Curse</em> (3rd level spell), not <em lang="ja-Latn">Lesser Restoration</em>.</p>

        <hr>

        <h2 id="kg-transmission" data-section="transmission">Transmission</h2>

        <p><strong>Vector</strong>: Yaminezumi (闇鼠 — Darkness Rats) bite</p>

        <p>On a successful hit, the target makes a <strong>DC 12 Constitution saving throw</strong>. Failure: gains one
        stack of Kegare no Yamai.</p>

        <hr>

        <h2 id="kg-effect" data-section="effect">Effect</h2>

        <p>Each stack reduces <strong>Wisdom by 1</strong>.</p>

        <ul>

        <li>Stacks accumulate — multiple failed saves = multiple stacks = increasing Wisdom reduction</li>

        <li>Affects Insight, Perception, Wisdom saving throws, and spellcasting for Wisdom-based casters</li>

        </ul>

        <hr>

        <h2 id="kg-removal" data-section="removal">Removal</h2>

        <ul>

        <li><em lang="ja-Latn">Remove Curse</em> spell removes <strong>all stacks</strong></li>

        <li>The restorative pools in the Grand Hall auto-cleanse on entry — <strong>1 charge per stack
        removed</strong></li>

        </ul>

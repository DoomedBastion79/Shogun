    name: Departure — Aya & The Four Gifts
    type: text
    title:
      show: true
      level: 3
    image: {}
    text:
      format: 1
      content: >
        <h3 id="kg-wyrmling39s-recognition" data-section="wyrmling39s-recognition">Wyrmling&#39;s Recognition</h3>

        <p>When the party leaves the chamber with the wyrmling, they re-enter the hallway. What happens next is the
        chamber&#39;s true ending — the moment Aya has waited millennia for.</p>

        <h3 id="kg-the-wyrmling39s-recognition-success-path" data-section="the-wyrmling39s-recognition-success-path">The
        Wyrmling&#39;s Recognition (Success Path)</h3>

        <blockquote>

        <p>The wyrmling stirs in [bonded character]&#39;s arms, then drops gently to the stone floor. It crosses the
        hallway on small careful feet — past the rest of you, past your boots and your blades, past everything in the
        world but the woman at the end of the hall.</p>

        <p>She does not move.</p>

        <p>The wyrmling stops in front of her, lowers its small golden head, and <em lang="ja-Latn">bows</em> — slow,
        deliberate, the way one bows to a parent or a guardian who has kept watch through a long night. Then it leans
        forward and presses the side of its face against her hand, like a dog returning to its owner after a very long
        absence.</p>

        <p>Something in the way she stands changes —  a weight lifted. For the first time since you laid eyes on her,
        she moves not as a guardian, but as a person.</p>

        <p>She bows. Deeply. To all of you.</p>

        </blockquote>

        <h3 id="kg-aya39s-final-address" data-section="aya39s-final-address">Aya&#39;s Final Address</h3>

        <h3 id="kg-aya39s-final-address-the-watch-is-ended"
        data-section="aya39s-final-address-the-watch-is-ended">Aya&#39;s Final Address — The Watch is Ended</h3>

        <blockquote>

        <p><em lang="ja-Latn">&quot;A lantern that has burned through the night does not mourn the dawn. It is what it
        was lit for. You have brought the dawn and I have burned long enough. By the witness of this house, I declare my
        watch ended. The blood of the Golden One walks again, and knows me. My oath is fulfilled, and my voice falls
        silent. To you three who walked beside the bearer — take these. They were never mine to keep, only to wait with.
        Arigatō. Go well.&quot;</em></p>

        </blockquote>

        <p>She turns to each of the party members in turn. Her offerings follow (see <em lang="ja-Latn">The Four
        Gifts</em>, below). When the last gift has been received and the last word spoken, <strong>she fades</strong> —
        not collapses, not vanishes; she simply <em lang="ja-Latn">thins</em>, as if the temple that has held her in
        place is finally letting go. The hallway holds her shape for a moment after she is gone, then closes.</p>

        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="Her Name —
        Conditional Reveal">

        <h3 id="kg-her-name-hoshimori-aya" data-section="her-name-hoshimori-aya">Her Name —
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.wkCIDKv2qgFgD7Y6]{Hoshimori
        Aya} (星守 綾)</h3>

        <p>She gives her name <strong>only if asked.</strong> The asking can come at any point — before
        @UUID[Compendium.kagekuni-assistant.locations.JournalEntry.TNV9pLqaBUzySDRl.JournalEntryPage.3zJVvOaJgg0w8leo]{the
        trial}, during the lull between attempts, or in the moments before she fades. If she is asked, the name is given
        as part of her final words; she names herself once, plainly, and the architecture lets the memory of who she was
        return to her in the same breath.</p>

        <p>If she is <strong>not</strong> asked, she departs nameless. The name is gone with her. The party may later
        find inscriptions in temple records or ancient archives that name <em lang="ja-Latn">&quot;Aya of the long
        watch&quot;</em> or <em lang="ja-Latn">&quot;the one who placed the child&quot;</em> — but no source ever ties
        name to guardian definitively. The connection is for those who asked.</p>

        <blockquote>

        <h2>🔒 <strong>DM ONLY</strong></h2>

        <p><strong>Aya was the one who placed the egg.</strong> She was a Kinryū-faithful priestess (or paladin, or
        oathbound Guardian — DM picks the precise role) at the temple&#39;s last hour. When the order fell, she carried
        the egg into this chamber, sealed the door, and bound herself to the temple rather than abandon her charge. The
        temple took her self-memory in exchange for letting her hold the post for as long as it took. She has stood here
        ever since.</p>

        <p>When she names herself at the watch&#39;s end, the temple releases its last hold and a single thread of
        memory uncoils — she remembers, briefly, who she was. She tells the party: her name, that she placed the egg,
        and one defining detail of her life before the watch (DM picks; could be a clan affiliation, a teacher&#39;s
        name, a vow she swore). She does not survive the telling.</p>

        <p>If she is <em lang="ja-Latn">not</em> asked: she departs without remembering, and the temple&#39;s protection
        of her identity holds. The temple records that name her are scattered, ambiguous, never confirming. Players can
        assemble the picture but never close it.</p>

        <p>This is the design intent: <strong>asking is the closure.</strong> Players who treat her as a person earn her
        story. Players who treat her as a function get a function — well-played, but anonymous.</p>

        </blockquote>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="The Four Gifts
        (frame)">

        <h3 id="kg-the-four-gifts" data-section="the-four-gifts">The Four Gifts</h3>

        <p>The bonded character receives the wyrmling. The other three each receive one personalized offering. Each
        offering is presented as a paired choice the player makes <strong>blind</strong> — Aya names the <em
        lang="ja-Latn">shape</em> of each path, never the mechanical outcome. The DM resolves the actual reward only
        after the player commits.</p>

        <p>For <strong>Relc</strong>, <strong>Ko&#39;jiri</strong>, and <strong>Dian Wei</strong>, the choice is
        <strong>nested</strong>: she names the broad path first, and only after the player picks does she present the
        narrower sub-choice. For <strong>Sun Wukong</strong>, the broad and narrow are the same.</p>

        <p>Mechanical specifics for each gift are tuned at session-time, scaled to the bonded PC&#39;s level and party
        composition (same calibration rule as the wyrmling stat block).</p>

        <hr>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="Relc — Roots
        Forward / Roots Back">

        <h4>Relc — <em lang="ja-Latn">Roots Forward, or Roots Back</em></h4>

        <blockquote>

        <p><em lang="ja-Latn">&quot;You walk in another&#39;s footprints, dragonborn — and you walk them well, but the
        prints are not yours. I can offer you the path that takes you forward, into your own — or the path that takes
        you back, into his. One leads to a grove you have not yet planted. The other, to questions he left in the soil.
        Choose.&quot;</em></p>

        </blockquote>

        <h5>If Relc chooses <em lang="ja-Latn">Forward</em> — <strong>The Grove of His Naming</strong></h5>

        <p>In the months that follow the chamber, Relc chooses a single place in the world. That place becomes his —
        spiritually tied to him for as long as he lives. He knows its state from anywhere; he can reach it through
        ritual once per long rest; what he tends there grows under his hand whether he is present or not. The grove does
        not need to be impressive. It needs to be his.</p>

        <blockquote>

        <p>🔒 <strong>Mechanical sketch (tune at session)</strong>: long-distance attunement (always-on awareness of the
        grove&#39;s state); once-per-long-rest ritual return (15-min ritual, returns him there bodily); plant/regrowth
        boons within the grove&#39;s bounds (his druidic spells are enhanced when cast there).</p>

        </blockquote>

        <h5>If Relc chooses <em lang="ja-Latn">Back</em> — Aya offers a second choice:</h5>

        <blockquote>

        <p><em lang="ja-Latn">&quot;The thread the temple has for you is one of two. I do not know which until you
        speak. One returns to you the shape of his last hour — what he chose, what he thought, whether he was afraid.
        The other returns to you a single name your master carried but did not give you. Both are bounded; neither is
        everything. Choose.&quot;</em></p>

        </blockquote>

        <p><strong>If he chooses <em lang="ja-Latn">the shape of his last hour</em></strong> — Relc receives, in a
        single passage of vision, Solas&#39;s last hour: what he was thinking, what he tried to do, what his last words
        were, and whether he was afraid. The vision is strictly emotional — it answers no campaign-secret questions. It
        only answers Relc&#39;s. <em lang="ja-Latn">No mechanical effect; pure narrative closure.</em> (Pairs with
        eventual revelation that Solas was killed to protect the Kinryū secret — this is the closure, not the
        explanation.)</p>

        <p><strong>If he chooses <em lang="ja-Latn">a name Solas carried unspoken</em></strong> — Solas had been
        searching for someone, or holding a debt with someone, that he never named to Relc. The architecture gives Relc
        the name and a single line of context. The person may be alive or dead; that, Relc must find out himself. <em
        lang="ja-Latn">Hard quest seed — the DM crafts a specific NPC whose existence ties to Solas&#39;s past, the
        Sacred Grove&#39;s broader mission, or (DM choice) the truth of how Solas died.</em></p>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="Ko&#39;jiri —
        Knowing / Her Hand">

        <h4>Ko&#39;jiri — <em lang="ja-Latn">Knowing, or Her Hand</em></h4>

        <blockquote>

        <p><em lang="ja-Latn">&quot;You have spoken her name many times, sorcerer. I know — the temple felt it. Most of
        those speakings were not for her. I will not refuse you for that. But what I can give you now is real, and you
        should not mistake it. I offer you knowing, or a small piece of her hand. Either is hers. Use what you take as
        if she will know — because she will.&quot;</em></p>

        </blockquote>

        <h5>If Ko&#39;jiri chooses <em lang="ja-Latn">Knowing</em> — Aya offers a second choice:</h5>

        <blockquote>

        <p><em lang="ja-Latn">&quot;I can give you what she actually said — the teachings as they truly were, before
        this house&#39;s silence dressed them in marble. Or I can give you what she has left in the world — the names of
        those who carry her blood, where they walk, which of them know what they are. Choose.&quot;</em></p>

        </blockquote>

        <p><strong>If he chooses <em lang="ja-Latn">her living teachings</em></strong> — the actual moral philosophy
        Kinryū taught her oldest priests, before centuries of orthodoxy ossified it into the temple-rote Ko&#39;jiri has
        been faking. The real Kinryū is more demanding, more compassionate, and more politically cutting than the marble
        version. Ko&#39;jiri gains a working internal model of what she would <em lang="ja-Latn">actually</em> say in
        any given moment.</p>

        <blockquote>

        <p>🔒 <strong>Mechanical sketch</strong>: advantage on Charisma checks invoking Kinryū with sincere intent.
        In-fiction, his cons become uncannily accurate, which complicates them — temple authorities and dragon-bloodline
        figures may treat him with new weight, for better or worse.</p>

        </blockquote>

        <p><strong>If he chooses <em lang="ja-Latn">the lineage map</em></strong> — he learns who Kinryū&#39;s living
        descendants are. Names, approximate locations, which clans carry her diluted blood, which individuals carry it
        strongly enough to matter. The map is incomplete (Aya does not know everyone) but it is real. The wyrmling is on
        it.</p>

        <blockquote>

        <p>🔒 <strong>Mechanical sketch</strong>: hard quest hooks; he becomes a directory the rest of the campaign can
        pull from. DM curates which names land, in what order — pace the reveals.</p>

        </blockquote>

        <h5>If Ko&#39;jiri chooses <em lang="ja-Latn">Her Hand</em> — <strong>Golden Judgment</strong></h5>

        <p>A gaze. He fixes a single target within sight; the target sees themselves as Kinryū would see them — every
        dishonor, every pretense, every borrowed authority. They suffer for it.</p>

        <blockquote>

        <p>🔒 <strong>Mechanical sketch</strong>: action; one target within 30 ft; Wisdom save (DC 8 + prof + Cha mod).
        On fail: scaling psychic damage + disadvantage on next attack roll or save (DM choice). Limited use (1/short
        rest, or sorcery-point cost). Useful in courts as well as combat. <strong>Aya&#39;s scolding lingers</strong> —
        if Ko&#39;jiri uses this for naked self-interest, the DM may rule the gaze fizzles or backfires; the gift is
        conditional on the spirit of its use.</p>

        </blockquote>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="Sun Wukong — Inward
        / Outward">

        <h4>Sun Wukong — <em lang="ja-Latn">Inward, or Outward</em></h4>

        <blockquote>

        <p><em lang="ja-Latn">&quot;You have studied the stillness others lean against. She honors that — she is the
        same kind of weight, in another form. I can give you a piece of her that walks with you alone, or a piece of her
        that walks with you and through you, into those at your side. Speak which you would carry.&quot;</em></p>

        </blockquote>

        <h5>If Sun Wukong chooses <em lang="ja-Latn">Inward</em> — <strong>Stillness of the Coiled Dragon</strong></h5>

        <p>A new Ki-spend option folded into his monk class. Spend 2 Ki as a bonus action to enter a perfect inward
        stillness. For one minute he has resistance to all damage, immunity to fear and charm, and cannot be moved
        against his will unless the move would lift more than his weight. He cannot make weapon attacks while in this
        state — he may move, dodge, redirect, and Patient Defense, but not strike.</p>

        <blockquote>

        <p>🔒 <strong>Mechanical sketch</strong>: bonus action, costs 2 Ki, lasts 1 minute. Defensive: turns him into a
        wall when the party needs one. Tune duration / cost at session.</p>

        </blockquote>

        <h5>If Sun Wukong chooses <em lang="ja-Latn">Outward</em> — <strong>Banner of the Golden One</strong></h5>

        <p>A new Ki-spend option folded into his monk class. Spend 3 Ki as a bonus action to plant himself, briefly, as
        a rallying point. For one minute, allies within 20 ft who can see him gain a bonus to attack rolls equal to his
        Wisdom modifier, and the <em lang="ja-Latn">first</em> attack each ally lands during that minute deals bonus
        radiant damage equal to his Wisdom modifier × proficiency bonus.</p>

        <blockquote>

        <p>🔒 <strong>Mechanical sketch</strong>: bonus action, costs 3 Ki, lasts 1 minute, 20-ft aura. Offensive party
        buff. Tune at session.</p>

        </blockquote>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="Dian Wei —
        Knowledge / Present">

        <h4>Dian Wei — <em lang="ja-Latn">Knowledge, or the Present</em></h4>

        <p>She offers him the broad choice first. The two paths sound equal in weight; the player commits before
        learning what either path holds.</p>

        <blockquote>

        <p><em lang="ja-Latn">&quot;Of you four, you wear the bearing I once knew. I can place in your hands what has
        held mine — iron and edge, tempered by a watch you did not have to keep. Or I can place in your ear what the
        temple has saved against this hour, unspoken, waiting for you to receive it — about the shadows that haunt your
        family. The first weighs more than it looks. The second weighs less. Choose by what you know you
        lack.&quot;</em></p>

        </blockquote>

        <h5>If Dian Wei chooses <em lang="ja-Latn">the Present</em> — Aya offers a second choice:</h5>

        <blockquote>

        <p><em lang="ja-Latn">&quot;Two pieces. One that has reached, one that has shielded. Both have learned patience.
        Choose the one your road will ask of you most.&quot;</em></p>

        </blockquote>

        <p><strong>If he chooses <em lang="ja-Latn">what has reached</em></strong> — her <strong>naginata</strong>.
        Long-hafted, gold-veined steel; the haft is wound with silk that has not frayed in millennia. Mechanical
        specifics tuned at session — likely a +X versatile reach weapon with a minor radiant property tied to its temple
        history.</p>

        <p><strong>If he chooses <em lang="ja-Latn">what has shielded</em></strong> — her <strong>half-plate</strong>.
        Lacquered gold over black iron; the chestpiece is engraved with a stylized golden dragon — Kinryū&#39;s sigil —
        coiled around itself in the old style. Tuned at session — likely +X half-plate with a minor save bonus or damage
        resistance tied to her oath.</p>

        <h5>If Dian Wei chooses <em lang="ja-Latn">Knowledge</em> — Aya offers a second choice:</h5>

        <blockquote>

        <p><em lang="ja-Latn">&quot;Two threads. One holds a face — the one whose hand fell, that you may know him when
        next you meet. The other holds the shape of your father&#39;s loyalty — what he was, what he wore, what he
        chose. Neither names what comes after. Choose.&quot;</em></p>

        </blockquote>

        <p><strong>If he chooses <em lang="ja-Latn">the face</em></strong> — the temple passes Dian a single vision: a
        man&#39;s face, held still in the half-light of a room he was not in. <strong>Dark hair drawn back into a tie.
        Tanned. Deep brown eyes. The expression — and this is the thing that lands hardest — is <em
        lang="ja-Latn">warm</em>. Approachable. The kind of face one trusts on instinct. Holding, in a hand the vision
        lets him see clearly, a blade still in motion.</strong> Dian recognizes the face from
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.Zk6QD9Sdfud4SuRV]{Heian}. The recognition arrives with the
        vision; he does not need to puzzle over it.</p>

        <blockquote>

        <h2>🔒 <strong>DM ONLY</strong></h2>

        <p>The face is
        <strong>@UUID[Compendium.kagekuni-assistant.lore.JournalEntry.bNLqG19qg46YyZzF.JournalEntryPage.JLGqqI474AH04SDL]{Hiroshi
        Nakamura}</strong> — Taisho and Shugo of Heian, brother to Hideo, secret Genso Alliance asset. Canon: <a
        href="../../canon/npcs.json">npc-hiroshi-nakamura</a>. Dian has been in Heian and would have at least seen the
        Shugo in passing during civic functions; the recognition is plausible without needing a prior direct
        interaction.</p>

        <p>The dissonance is the weapon: Hiroshi&#39;s <em lang="ja-Latn">known</em> persona is the calm, wise mediator
        everyone trusts. Dian seeing that exact face mid-strike is the truth landing. Play the moment of recognition
        slow — let Dian&#39;s player place the face themselves before confirming. Do not name Hiroshi in the
        chamber&#39;s narration; let Dian name him aloud (or refuse to, if he wants to sit with it).</p>

        <p>This unseals one piece of Hiroshi&#39;s sealed campaign-secret arc: he is not just an intelligence leak, he
        is the hand on the emperor. Be ready for Dian&#39;s response to ripple through party politics — Hiroshi is the
        <em lang="ja-Latn">Shugo of the imperial capital</em>. Accusing him publicly without proof is suicide. The
        vision is true but unprovable.</p>

        </blockquote>

        <p><strong>If he chooses <em lang="ja-Latn">the shape of his father&#39;s loyalty</em></strong> — Aya delivers
        the truth as a single passage:</p>

        <blockquote>

        <p><em lang="ja-Latn">&quot;Your father wore the emperor&#39;s robes that night. He stood where the emperor
        should have stood, and he did not flinch. The blade fell where it was meant to fall. The one whose place he took
        walked free from that room — and did not walk free for long.&quot;</em></p>

        </blockquote>

        <blockquote>

        <h2>🔒 <strong>DM ONLY</strong></h2>

        <p>Dian learns: his father was loyal, took the emperor&#39;s place, died composed. The emperor escaped that room
        — but was killed shortly after, by another hand in his own retinue. Held back from this passage:</p>

        <ul>

        <li><em lang="ja-Latn">Why</em> his father agreed to do it (loyalty, oath, coercion, payment — Dian must seek
        that himself)</li>

        <li><em lang="ja-Latn">Who</em> arranged the swap (the second betrayer in the retinue, unnamed)</li>

        <li><em lang="ja-Latn">Who</em> killed the emperor in the second moment</li>

        </ul>

        </blockquote>


        </section>


        <h3 id="kg-failure-path" data-section="failure-path">Failure Path</h3>

        <h3 id="kg-failure-path-she-bears-witness" data-section="failure-path-she-bears-witness">Failure Path — She
        Bears Witness</h3>

        <p>If the trial fails (the Honor reckoning is missed, or scenes fail and the candidate is denied), Aya remains.
        She does not depart. The party retries per the trial rules (different candidate same day, or same candidate
        after a long rest, with the broader retry restrictions in <em lang="ja-Latn">Retry Rules</em>).</p>

        <p>When the failed party re-enters the hallway, she addresses them:</p>

        <blockquote>

        <p><em lang="ja-Latn">&quot;A blade dipped early into the quench shatters at the first strike. The chamber does
        not break you — it returns you to the forge. I bear witness: you stood before her. That is more than most do, in
        any age. The measure was not met today but it remains. Come back tempered. The fire is patient — She has refused
        you a verdict, not a chance.&quot;</em></p>

        </blockquote>

        <p>She does not offer gifts on failure. The gifts are her release; the release comes only when the wyrmling has
        bowed to her.</p>

        <blockquote>

        <h2>🔒 <strong>DM ONLY</strong></h2>

        <p>Aya may eventually fade from exhaustion if the party fails repeatedly and never returns — but this should not
        happen on-screen. If the party leaves and pursues other campaign work for a long time, the DM may decide her
        watch finally collapses and the chamber seals; this is a soft &quot;campaign clock&quot; pressure, not a hard
        timer. Don&#39;t surface it unless the party seems to be ignoring the chamber on purpose.</p>

        </blockquote>

        <hr>

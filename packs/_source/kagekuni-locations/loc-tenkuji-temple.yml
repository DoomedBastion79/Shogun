        <h2 id="kg-loot-framework" data-section="loot-framework">Loot Framework</h2>

        <p><strong>Common/open areas</strong>: Essentially devoid of valuables after millennia of decay and Nagaji
        habitation. Don&#39;t reward casual searching — set that expectation early.</p>

        <p><strong>Creature hoards (spiders and other dwellers)</strong>: Small collections of incidental treasure
        accumulated from prey over generations — coins, small jewelry, a snapped-off belt buckle, occasionally something
        more interesting. Keep individual finds small and flavorful.</p>

        <p><strong>Relics (good rolls required)</strong>: Genuine Golden Clan artifacts still exist in the temple — in
        places protected by preservation magic, in sealed or collapsed areas, in spots the Nagaji wouldn&#39;t have
        accessed or recognized as valuable. These require active searching and meaningful rolls to locate.</p>

        <p><strong>Design principle</strong>: The temple rewards curiosity and thoroughness, not just combat. A party
        that rushes through finds very little. A party that investigates carefully finds things that matter.</p>


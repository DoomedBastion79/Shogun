        <p>The acknowledged state is processed by the network&#39;s foundational logic — it does not require a living
        practitioner at the receiving site to register. A frozen distress signal can receive and hold an acknowledgement
        millennia after the practitioner who sent it is gone.</p>

        <p><strong>The acknowledgement action</strong></p>

        <p>The party can send a double-pulse acknowledgement to Kaze and Sora from the hub. Doing so requires either the
        operator&#39;s manual or a DC 15 Arcana check to reason out the protocol from the mechanism. Sending the
        acknowledgement to Kaze shifts its display from rapid distress to the slow double-beat acknowledged state. The
        distress signal that has been running since the fall finally receives a response.</p>

        <p>There is no one at either site to receive it. The acknowledgement is a record, not a rescue. A character who
        understands this and sends it anyway is doing something that is not tactically useful. Whether any of the party
        members are that kind of person is worth finding out at the table.</p>

        <p><strong>Hub pulse and party presence</strong></p>

        <p>The temple&#39;s operational marker does not require party presence to remain lit — the restored orrery feeds
        the node. Active sei presence brightens the signal. The pulse strengthens noticeably when the full party stands
        before the tapestry, dims when the hall is empty. Observable at DC 12 Perception.</p>

        <p><strong>The Kaze blank</strong></p>

        <p>The area in the Kaze highlands that was never recorded remains blank during activation — the ori-kioku cannot
        render what was never embedded in the fabric. The surrounding topography brightens slightly each time the hub
        pulses. Whatever occupies that location is responsive to the network signal without being part of the network.
        It receives without returning.</p>

        <p><strong>Hi/Tsuchi — Exceptional result only</strong></p>

        <p>If the party found the fourth symbol (the one with the additional vertical mark in Hi province or the
        Hi/Tsuchi border), look for it when the tapestry activates. It is offline. The fabric around it holds residual
        warmth distinct from the cold stillness of the other unlit markers — recent enough that the tapestry is still
        reading it. Something with sufficient sei presence to register as a network node was active at that site and is
        no longer. Days or weeks, not centuries.</p>

        <hr>

        <h3 id="kg-tapestry-iv-the-first-head-priest" data-section="tapestry-iv-the-first-head-priest">Tapestry IV — The
        First Head Priest</h3>

        <p><em lang="ja-Latn">East wall, north end. Well-preserved upper two-thirds; lower third missing
        entirely.</em></p>

        <p><strong>At a glance</strong>: A single figure, large in scale, occupying the full width of the tapestry.
        Robed. Dragonborn. One hand extended, palm up, holding something small. The face has been worked at — the eyes
        gouged out with the same kind of tool that left marks on the pillars, but applied with more force.</p>

        <p><strong>Track One — Investigation or Perception</strong></p>

        <p><strong>FAILURE</strong>: An important figure whose face has been removed. The object in the extended hand is
        too small to make out from this distance.</p>

        <p><strong>PARTIAL</strong>: A formal portrait — the defacement matches the pillar work in technique.
        Gold-scaled Dragonborn. The hand is extended in a specific gesture, something small resting on the palm.</p>

        <p><strong>SUCCESS</strong>: The object in the extended hand is a disc — circular, palm-sized. The gesture is
        specific: weight shifted, arm extended, the body&#39;s orientation suggesting receipt rather than offering. The
        free hand rests on something in the missing lower third, angled as though what lay beneath it mattered enough to
        present. Around the gouged sockets where the eyes were, the thread beneath the damage is still faintly visible
        at the right angle of light — a ghost of color. Something amber, or close to it.</p>

        <p><em lang="ja-Latn">The defacement here was not applied with the same evenhandedness as the pillar work. This
        face was addressed with more force than the others.</em></p>

        <p><strong>CRITICAL SUCCESS</strong>: The amber thread at the eye sockets is not the warm brown-amber of the
        clan&#39;s general palette — it is a specific, vivid shade that reads almost luminous in the cold torchlight.
        The disc in the extended hand matches in proportion the bronze disc carried by the figure in the sealed
        dormitory room. The posture is an investiture gesture — not the assumption of authority but the moment of its
        bestowal from somewhere above. This figure is being given something.</p>

        <p><em lang="ja-Latn">Ko&#39;jiri Tangible Reward</em>: The amber eyes. The statue in the Grand Hall. The eyes
        that oriented toward Ko&#39;jiri when he crossed the threshold. Ko&#39;jiri gains advantage on all Charisma
        checks within the temple for the remainder of this visit. Do not explain the connection. Let him make it.</p>

        <p><strong>EXCEPTIONAL</strong>: Along the lower border of the surviving fabric, running the full width just
        above where the missing third begins, a line of very small, very dense Old Imperial text is stitched into the
        decorative border. Most is lost with the missing section. At the right edge, perhaps eight characters survive:
        <em lang="ja-Latn">&quot;...wa shinanai.&quot;</em> The rest of the sentence is gone.</p>

        <p><strong>Track Two — Religion</strong></p>

        <p><strong>FAILURE</strong>: A devotional portrait — standard format for a religious institution commemorating
        its leadership. The defacement is desecration of a familiar kind.</p>

        <p><strong>PARTIAL</strong>: The vestments are high-order ceremonial, indicating significant religious
        authority. The posture marks a moment of formal consecration rather than administrative appointment.</p>

        <p><strong>SUCCESS</strong>: The robe&#39;s border is not decorative — it is a liturgical record in the Golden
        Dragon order&#39;s visual theology. Reading left to right across the surviving fabric: four symbols in sequence,
        each rendered distinctly. Creation. Covenant. Stewardship. Silence. These are obligations, rendered in the
        order&#39;s formal symbolic language — not descriptions of rank but declarations of commitment. The fourth
        symbol, Silence, is stitched at a larger scale than the other three. In this tradition, the final duty of the
        founding priesthood was not to speak but to keep — to hold something without disclosing it.</p>

        <p><em lang="ja-Latn">This portrait does not record what this person did. It declares what they promised not to
        say.</em></p>

        <p><strong>CRITICAL SUCCESS</strong>: The extended hand — the specific gesture, not the general posture —
        appears in Golden Dragon religious imagery in only one context: the receipt of a direct commission from a divine
        source rather than a human or institutional authority. This person was not appointed by a council or a clan.
        They were commissioned directly. In the tradition&#39;s theology, this gesture is reserved for moments when a
        dragon has personally conferred an obligation on a mortal.</p>

        <p><em lang="ja-Latn">Tangible Reward</em>: Understanding the order&#39;s founding as a direct commission — not
        devotion but a task assigned at the source — reframes the purpose of every room in this temple. The party gains
        advantage on Religion and History checks for the remainder of the first floor.</p>

        <p><strong>EXCEPTIONAL</strong>: The four symbols — creation, covenant, stewardship, silence — appear on this
        tapestry&#39;s border. They also appear elsewhere: fragments in the stonework of the dormitory corridor, in the
        carved frieze around the Inner Sanctum door, at the base of the great statue in the Grand Hall. The order
        embedded its founding charge into the architecture of the entire building. The message is consistent across
        every surface. Silence is always rendered largest.</p>

        <h3 id="kg-activation-behavior" data-section="activation-behavior">Activation Behavior</h3>

        <p><strong>The mandate connection</strong>: The Kinryu no Chikara mandate requires a short ritual — a spoken
        statement of genuine intent — for inscription. This works regardless of whether the party has witnessed the
        activation. However, a character who has watched the border sequence perform its obligations in order, who has
        seen the investiture gesture as it was originally made, who has felt the weight of Silence holding longest — is
        performing the inscription ritual with knowledge that changes what the ritual is. Not a bureaucratic formality
        but a deliberate repetition of a specific act witnessed across millennia.</p>

        <p>The practical distinction of this additional layer is left to the DM. It could manifest as an extended
        benefit, a deeper attunement to the temple&#39;s foundational magic, or simply the understanding that the
        Silence obligation is the most significant one and has been accepted knowingly rather than incidentally.</p>

        <p><strong>The glance and the paper</strong>: At one point in the activation cycle — after the border sequence
        has run at least once, not at the opening — the figure&#39;s formal posture breaks slightly. The head turns
        briefly toward the position of Tapestry III on the opposite wall. Then the hand not holding the disc lifts a
        loose sheet of paper into the lower frame of the surviving image, held preparatory to writing. The gesture lasts
        a beat. The posture returns. The border sequence continues.</p>

        <p>The paper is not ceremonial. The glance is not part of the ritual. This is the head priest doing their job
        between the moments the record was made to commemorate. No check required to see it — it occurs in the surviving
        upper two-thirds and is visible to anyone watching the full cycle. A character who notices the direction of the
        glance and looks where the figure looked will find themselves facing Tapestry III.</p>

        <p><strong>The head priest&#39;s monitoring practice</strong>: The head priest did not personally monitor
        Tapestry III — that was the assigned duty of a designated monitor, a junior priest or specialist whose role was
        to watch the network and escalate state changes up the chain. What the activation shows is the head priest
        receiving a report and moving to log it. The glance toward the map tapestry is verification — checking the
        displayed state against what they have just been told — not direct observation.</p>

        <p>This means the ledger in the bronze box is the head priest&#39;s record of significant events that rose to
        their level, not a complete operational record. The monitor&#39;s working log, which would contain routine
        activity, almost certainly existed and is not preserved.</p>

        <hr>

        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="DM NOTES — Tapestry
        Supplement">

        <p><strong>Running Two Tracks Naturally</strong>: Do not present this as a skill-check menu. Let players declare
        their approach — &quot;I try to read the thread texture closely&quot; is Arcana on Tapestry II; &quot;I try to
        understand what this ceremony depicts&quot; is Track One. Name the secondary skill option only if a player seems
        stuck or asks what else they might try. The system should feel like natural investigation, not a mechanical
        selection.</p>

        <p><strong>The Most Strategically Significant Content</strong>: Tapestry III carries the most consequential
        information across both tracks. The sanctuary markers (Track One, Critical Success and above) point toward
        locations relevant to the Order of the Ancient Guard&#39;s deepest purpose. The Insight track&#39;s Exceptional
        result — the deliberate blank over a Kaze province location — connects the Gekko investigation to the
        temple&#39;s founders in ways the party cannot yet fully map. If this information reaches the wrong hands, it
        has tactical value. Consider whether any faction learns the party was in this temple and might reason backward
        to what they found.</p>

        <p><strong>The Fresh Sei Trace in Tapestry II</strong>: The Arcana track&#39;s Exceptional result is the
        supplement&#39;s most immediately actionable piece of information. The Kokuryu-aspected sei fingerprint readable
        in the tapestry appears again on the broken ward anchors in the Inner Sanctum door frame. A party that makes
        both connections has identified — before ever meeting the temple&#39;s primary occupant — which of the current
        inhabitants broke the sanctum&#39;s seals. That is meaningful foreknowledge for what follows.</p>

        <p><strong>The Border Theology of Tapestry IV</strong>: Creation, covenant, stewardship, silence. A player who
        engages with this on the Religion track and then later notices the same symbols on the sanctum frieze or at the
        statue&#39;s base will understand the order&#39;s purpose before they find any written record of it. That is the
        preferred sequence — let the architecture teach first, let Kinjiro&#39;s journal confirm. Not the reverse.</p>

        <p><strong>&quot;...wa shinanai&quot;</strong>: Do not translate unless a player asks and makes DC 12 History or
        a relevant language check. When they ask: give them exactly <em lang="ja-Latn">&quot;does not die&quot;</em> and
        nothing more. The subject of the sentence is gone with the missing lower third. What does not die is a question
        the text cannot answer. Let it remain one.</p>

        <p><strong>Ko&#39;jiri Across All Four</strong>: Tapestry I (History track advantage, celestial alignment
        recognition), Tapestry II (Arcana — his sorcerous nature may sensitize him to the sei residue), Tapestry IV
        (Track One advantage, Charisma reward, the amber eyes). A player who engages seriously with all four tapestries
        as Ko&#39;jiri should leave this hall with a meaningfully different sense of what this place is and what his
        character&#39;s relationship to it might mean. Do not rush this accumulation.</p>

        <p><strong>Pacing</strong>: Not every player will examine every tapestry. Not every tapestry needs both tracks
        explored. The Exceptional tier rewards genuine investment — it is not obligatory. Everything here remains
        available on return visits if the party moves through quickly on first pass.</p>


        </section>

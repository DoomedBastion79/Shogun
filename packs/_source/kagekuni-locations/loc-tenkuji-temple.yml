  - _id: UszT452PWSGQ99aV
    _key: '!journal.pages!TNV9pLqaBUzySDRl.UszT452PWSGQ99aV'
    name: The Dormitories — Bo
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-read-aloud-the-dormitories" data-section="read-aloud-the-dormitories">Read-Aloud — The
        Dormitories</h4></header>

        <p><em lang="ja-Latn">A long corridor, wide enough for two people to walk side by side, with doors branching
        left and right. Most of the doors are open. At the far ends of the corridor, larger chambers.</em></p>

        <p><em lang="ja-Latn">The doors that are open were not left that way. The frames are splintered — forced inward,
        or outward, depending on the door. Several bear scoring at shoulder height, the kind left by edged weapons.
        Inside the cells: sleeping pallets collapsed into their own decay. Personal effects on hooks or shelves, long
        since fallen — a sandal, a cloth, a small painted tile lying face-down in the dust.</em></p>

        <p><em lang="ja-Latn">In the southern shared chamber, the evidence is heavier. Furniture was moved — pushed
        against walls, pushed away again, the drag marks visible in the grit. Impact marks at various heights. On the
        floor near the far wall, the stone itself is damaged: a starburst pattern, cracked outward from a central
        point.</em></p>

        <p><em lang="ja-Latn">The northern shared chamber is different. Its door has a bar, and the bar is in its
        brackets. This door was never forced. You lift the bar yourself and push the door open.</em></p>

        <p><em lang="ja-Latn">The air inside is old in the way only sealed places can be — still, and slightly too dry,
        as if the room has been holding its breath. The pallet inside holds a complete skeleton. They are facing the
        wall. They lay down on their own.</em></p>

        <p><em lang="ja-Latn">On the floor beside the pallet: a small bronze disc on a cord. An ink-block, dried to
        nothing. A sealed scroll case.</em></p>


        </article>

        </div>




        <p><em lang="ja-Latn">East wing — a long corridor with cells branching left and right, plus larger shared
        quarters at the north and south ends.</em></p>

        <p><strong>Physical Description:</strong></p>

        <p>East wing, 120 ft from center intersection. Dormitory complex connects to both the north and south sides of
        the E-W hallway. Colder than the Grand Hall — an unnatural cold associated with accumulated violence, not
        mountain temperature.</p>

        <p><strong>North-side dormitory (accessible):</strong> Long corridor, two-person width, with eight individual
        cells — four west (Cells 1, 3, 5, 7), four east (Cells 2, 4, 6, 8). Most doors forced open — frames splintered
        inward or outward, some bearing edged-weapon scoring at shoulder height.</p>

        <p><strong>South-side dormitory (entrance collapsed — sealing kept it intact):</strong> The entrance from the
        E-W hallway was deliberately collapsed by the priests during the fall, and the rubble has done its job. The wing
        beyond is <em lang="ja-Latn">relatively pristine</em> — the collapse spared it the looting, defacement, and
        weather-rot that have worn the rest of the temple over the intervening millennia. Doors still on their hinges.
        Personal effects still on shelves where they were left. No Nagaji ever reached it. Access requires clearing the
        rubble (hours; loud) or an alternate route via the second floor or the cavern system below; the wing is a time
        capsule of the order&#39;s last day, preserved by the very act of sealing.</p>

        <p><strong>Sealed room (Senior Priests&#39; Quarters):</strong> Heavy wooden door, barred from inside; bar
        visible through gap at base. Beyond: 20 ft × 20 ft; four sleeping platforms, each occupied by skeletal remains.
        Remains are deliberate — hands folded, bodies oriented toward room&#39;s center. They chose this. On the writing
        desk: scroll case (Last Record of Priest Tomohiro) + bronze disc — left in plain sight, meant to be found.</p>

        <h3 id="kg-cell-layout" data-section="cell-layout">Cell Layout</h3>

        <table>

        <thead>

        <tr>

        <th>Cell</th>

        <th>Side</th>

        <th>Notable Feature</th>

        <th>Onryō</th>

        </tr>

        </thead>

        <tbody><tr>

        <td>1</td>

        <td>West</td>

        <td>Faded star chart drawings on wall</td>

        <td>Yes</td>

        </tr>

        <tr>

        <td>2</td>

        <td>East</td>

        <td>Single intact ceramic cup, upright, perfectly centered on shelf</td>

        <td>Yes</td>

        </tr>

        <tr>

        <td>3</td>

        <td>West</td>

        <td>Starburst damage — scorched walls, cracked floor, platform obliterated</td>

        <td>Yes — most volatile</td>

        </tr>

        <tr>

        <td>4</td>

        <td>East</td>

        <td>Personal effects scattered; sandal near doorway as if left mid-step</td>

        <td>Yes</td>

        </tr>

        <tr>

        <td>5</td>

        <td>West</td>

        <td>Swept clean — deliberately tidied after the fall; platform scrape marks</td>

        <td>No</td>

        </tr>

        <tr>

        <td>6</td>

        <td>East</td>

        <td>Nagaji-searched — contents pulled, platform overturned</td>

        <td>No</td>

        </tr>

        <tr>

        <td>7</td>

        <td>West</td>

        <td>Small devotional Kinryū carving still upright on shelf</td>

        <td>No</td>

        </tr>

        <tr>

        <td>8</td>

        <td>East</td>

        <td>Door frame scorched — caught edge of Cell 3 discharge</td>

        <td>No</td>

        </tr>

        </tbody></table>

        <hr>

        <section class="secret kg-secret-discoverable" data-kind="discoverable">

        <p><strong>Discoveries</strong></p>

        <ul>

        <li class="kg-task" data-done="false"><strong>Cell 3 — Starburst Damage</strong> (DC 14 Arcana; DC 17 Arcana for
        reconstruction)</li>

        <li class="kg-task" data-done="false"><strong>Cell 5 — Swept Clean</strong> (intentionally unresolved)</li>

        <li class="kg-task" data-done="false"><strong>Cell 6 — Planetary Gear Assembly</strong> (DC 13 Investigation)
        <em lang="ja-Latn">(Observatory component #2)</em></li>

        <li class="kg-task" data-done="false"><strong>The Sealed Room — Priest Tomohiro&#39;s remains</strong> (DC 12
        Thieves&#39; Tools to open scroll case) <em lang="ja-Latn">(Handout: Last Record of Priest Tomohiro)</em></li>

        <li class="kg-task" data-done="false"><strong>The Bronze Disc — orbital engravings</strong> (DC 13
        Investigation) <em lang="ja-Latn">(Observatory component: calibration disc)</em></li>

        <li class="kg-task" data-done="false"><strong>Evidence of the Nagaji — searched cells</strong></li>

        </ul>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="Cell 3 — Starburst
        Damage">

        <ul>

        <li>DC 14 Arcana: identifies sei discharge as cause — magical energy released suddenly without control</li>

        <li>DC 17 Arcana: reconstructs the attempt — a priest tried to weaponize their own sei reserves in a single
        concentrated release against something already in the corridor; discharge was too large and uncontrolled; killed
        the priest and damaged Cell 8 through the shared wall</li>

        </ul>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="Cell 5 — Swept
        Clean">

        <p>Someone tidied this cell after the fall — older than the Nagaji&#39;s arrival. Platform moved deliberately,
        replaced; nothing beneath it now. Intentionally unresolved — possible connection to Tomohiro.</p>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="Cell 6 —
        Nagaji-Searched / Planetary Gear Assembly">

        <p>DC 13 Investigation locates the <strong>planetary gear assembly</strong> — seven interlocking bronze rings of
        graduated size, partially disassembled, discarded in debris under overturned platform. The rings are nested
        concentrically, each engraved with tiny orbital notations in Old Imperial. The outermost ring is bent but not
        broken. A character proficient in Tinker&#39;s Tools, Smith&#39;s Tools, or Navigator&#39;s Tools recognizes
        this as a precision gear mechanism — a planetary drive designed to model multiple simultaneous orbital periods
        through a single input rotation. DC 14 History (DC 11 for Ko&#39;jiri) connects the orbital notations to the
        seven known planets of the Miyosai system. <em lang="ja-Latn">(Observatory component: planetary gear assembly.
        The Nagaji found it, examined it, could not understand it, and discarded it.)</em></p>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-campaign" data-kind="campaign" data-label="The Sealed Room —
        Senior Priests&#39; Quarters">

        <p>The priests who sealed themselves in were not hiding — they were staying. They had made their peace and chose
        not to participate in the violence. Four sleeping platforms, each occupied by skeletal remains — hands folded,
        bodies oriented toward the room&#39;s center. The sealed room has been untouched since their death.</p>

        <p>Breaking the door: AC 15, 40 HP. Alternatively, the bar can be lifted through the gap at the base (DC 12
        Thieves&#39; Tools or Dexterity check).</p>

        <p><strong>On the writing desk</strong>: The scroll case (DC 12 Thieves&#39; Tools or carefully broken open)
        contains a last account — a personal record of the final days, from Priest Tomohiro&#39;s perspective. This is a
        major handout (see Handout: <em lang="ja-Latn">The Last Record of Priest Tomohiro</em>) detailing how the
        infiltrators were discovered too late, who gave the order to seal the inner sanctum, and the name of the head
        infiltrator — a detail that, with a DC 17 History check, connects to a lineage that still exists in present-day
        Kagekuni.</p>

        <p>The bronze disc is a formal order seal, granting the bearer recognition as a member of the Golden Dragon
        order — useful as a key within the temple for certain sealed areas (specifically the Jushoku no Ma hidden
        door).</p>

        <p><strong>The Bronze Disc — Additional Detail</strong>: The reverse face of the disc bears fine engravings
        invisible without close examination (DC 13 Investigation or automatic if studying the disc under good light).
        Concentric rings scored into the bronze correspond to orbital tracks, with seven small notches along the outer
        edge and four along an inner ring. A character who has found the planetary gear assembly recognizes the match
        immediately — the disc is designed to seat into a mechanical device as a positional reference. <em
        lang="ja-Latn">(Observatory component: calibration disc. When seated in the orrery&#39;s control interface, it
        establishes the reference date from which the mechanism can advance or rewind. The order seal and calibration
        key were the same object — the person authorized to operate the observatory was, by definition, a member of the
        order.)</em></p>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-campaign" data-kind="campaign" data-label="Evidence of the
        Nagaji">

        <p>Two of the individual cells (including Cell 6) show recent disturbance — the dust displaced, a pallet dragged
        aside to reveal the floor. The Nagaji have been searching these rooms. What they were looking for is unclear,
        but the cells they searched belonged (per the scroll case record) to the two most senior non-priest scholars of
        the order. Whatever those scholars possessed or knew, something is looking for it.</p>

        <hr>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-encounter" data-kind="encounter" data-label="Encounters">

        <ul>

        <li class="kg-task" data-done="false">4 Uragiri no Onryō (裏切りの怨霊 — &quot;Vengeful Spirits of Betrayal&quot;;
        Specters, MM p.279 — Cells 1, 2, 3, 4)</li>

        </ul>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="Uragiri no Onryō —
        Trigger and Escalation">

        <p>Corrupted priests who were the infiltrating force that destroyed the order from within. Named to reflect the
        specific sin that defines them — not just evil, but betrayers of the order they swore to serve. Each haunts a
        specific cell — emerge when the corridor is disturbed.</p>

        <p><strong>Trigger</strong>: Corridor disturbed (loud noise, running, light brought close to an occupied cell,
        combat vibration from elsewhere in the temple)</p>

        <p><strong>Initial state</strong>: Confused and territorial — emerge from cells, move erratically, cannot fully
        perceive the party. Window of non-hostility.</p>

        <p><strong>Escalation to hostility</strong>: Party attacks any of the four, OR the sealed room is interfered
        with disrespectfully (forcing door loudly, attempting to break it).</p>

        <p><strong>Respectful entry</strong> (picking the bar, asking permission aloud, moving quietly) does not trigger
        escalation.</p>

        <p><strong>Cell 3 spirit</strong>: Manifests first if party lingers near Cell 3 without triggering combat. Most
        volatile. Use Specter (MM p.279) with <strong>maximum HP</strong> and one additional action option.</p>

        <p><strong>De-escalation</strong>: A character who speaks to them calmly in any language (the intent reads
        through, even across the language barrier) and succeeds on a DC 14 Persuasion check can quiet one Onryō; it
        dissipates with a sound like a long exhale.</p>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="DM Notes">

        <p><strong>Atmosphere</strong>: The dormitory wing is colder than the Grand Hall. The cold is not mountain cold
        — it is the specific cold of places where violence has accumulated. Even mundane characters should feel uneasy
        here without knowing why.</p>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="The South
        Dormitory">

        <p>Entrance deliberately collapsed by the priests during the fall — and the seal <em
        lang="ja-Latn">protected</em> what lay behind it. The south wing is <strong>relatively pristine</strong>: no
        Nagaji incursion, no ambient looting, no weather damage, no later defacement. Furniture remains where it was set
        down. Personal effects (sandals at the door, a folded robe across a bed, an inkstone with the cake of dried ink
        still on it) sit as if their owners stepped out for a moment. The dust is heavy but undisturbed. The bodies of
        those who did not make it to the sealed senior chamber lie where they fell — most along the corridor, a few in
        their own cells, posture suggesting flight rather than resistance.</p>

        <p>The contents inside are still being designed; treat the wing as a <strong>preservation goldmine</strong> when
        access opens — intact ritual implements, clothing, personal scrolls, household objects from the order&#39;s
        daily life that survive nowhere else in Hokori. Specifics: TBD before the party gains access. Establish them in
        response to the path the party takes to get in (clearing rubble vs. cavern approach vs. floor 2 descent), since
        the manner of arrival shapes which corner of the wing they reach first.</p>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-open-items" data-kind="open-items" data-label="Open Items">

        <ul>

        <li class="kg-task" data-done="false"><strong>Tomohiro&#39;s scroll</strong> — contents to be drafted
        (significant handout; bridges dormitory and Jushoku no Ma)</li>

        <li class="kg-task" data-done="false"><strong>South dormitory contents</strong> — establish before party gains
        access; the wing is intact and preservation-rich, so the canon answer can be generous</li>

        <li class="kg-task" data-done="false"><strong>Cell 5 swept clean</strong> — decide whether to connect to
        Tomohiro or leave unresolved</li>

        </ul>


        </section>

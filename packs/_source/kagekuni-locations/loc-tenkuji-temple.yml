        <h3 id="kg-initiating-the-trial" data-section="initiating-the-trial">Initiating the Trial</h3>

        <h2 id="kg-the-trial" data-section="the-trial">THE TRIAL</h2>

        <h3 id="kg-initiating-the-trial" data-section="initiating-the-trial">Initiating the Trial</h3>

        <p>A character kneels or sits on the pad in the formal posture of one preparing to be measured. The chamber
        responds:</p>

        <ul>

        <li>The pedestals&#39; inscriptions glow softly, in turn, around the chamber.</li>

        <li>The dome dims, gold light retreating to a deep amber glow.</li>

        <li>A voice speaks in the candidate&#39;s mind — <em lang="ja-Latn">and only the candidate&#39;s mind</em>.</li>

        </ul>

        <blockquote>

        <p><em lang="ja-Latn">&quot;Is your heart pure, and ready to be judged? Know that this trial is not for the
        faint of heart. The blessing of Kinryū is not one all can obtain, and can be deadly in its trials. Speak truly:
        do you consent?&quot;</em></p>

        </blockquote>

        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="Kinryū&#39;s Voice
        (DM)">

        <p>The voice is <strong>Kinryū herself</strong>, speaking through the chamber&#39;s architecture from her place
        of slumber. The candidate does not yet know whose voice it is. The chamber does not name her. The realization
        should land later — when the wyrmling hatches, or when the candidate recalls the guardian&#39;s <em
        lang="ja-Latn">&quot;She will know the difference&quot;</em> — and should be a goosebumps moment, not a stated
        fact.</p>

        <p>The other PCs hear nothing. They see the candidate go still, eyes distant, lips moving in silent answer.</p>

        <p>The candidate must answer. <strong>If they decline</strong>, the pad releases them — no harm, no consequence,
        no blessing. They rise. The chamber waits. Another candidate may try.</p>

        <p><strong>If they consent</strong>, the trial begins.</p>


        </section>


        <h3 id="kg-the-six-scenes-frame" data-section="the-six-scenes-frame">The Six Scenes (frame)</h3>

        <h3 id="kg-the-six-scenes" data-section="the-six-scenes">The Six Scenes</h3>

        <p>The candidate is taken through six visions, each testing one of the six visible Bushido virtues — in
        order:</p>

        <ol>

        <li><strong>義</strong> <em lang="ja-Latn">Gi</em> — Justice / Rectitude</li>

        <li><strong>勇</strong> <em lang="ja-Latn">Yū</em> — Courage</li>

        <li><strong>仁</strong> <em lang="ja-Latn">Jin</em> — Benevolence / Compassion</li>

        <li><strong>礼</strong> <em lang="ja-Latn">Rei</em> — Respect / Politeness</li>

        <li><strong>誠</strong> <em lang="ja-Latn">Makoto</em> — Honesty / Sincerity</li>

        <li><strong>自制</strong> <em lang="ja-Latn">Jisei</em> — Self-Control</li>

        </ol>

        <p>Each scene drops the candidate <strong>into</strong> the situation with full agency — they are the actor, not
        the observer. The vision lasts as long as the choice takes, then resolves with a flame on the corresponding
        pedestal (gold / black / white per the Flame Feedback rules below). The architecture is patient; let players
        take the time they need.</p>

        <section class="secret kg-secret-sealed kg-sealed-scene" data-kind="scene" data-label="Scene 1 — 義 Gi: The Easy
        Lie">

        <h4>Scene 1 — 義 <em lang="ja-Latn">Gi</em>: <strong>The Easy Lie</strong></h4>

        <p><strong>Tests</strong>: justice when truth will ruin the innocent.</p>

        <blockquote>

        <p>A small back room, late afternoon. The smell of pine smoke and bitter herbs. A man you have not seen until
        now lies on a pallet — breath shallow, color drained, his hand cool on your wrist. His wife is in the doorway;
        two children, small, are at her side. The merchant looks at you he is dying, his name carries a debt he tells
        you was paid, and you are certain — without being told how you are certain — that it was not.</p>

        <p><em lang="ja-Latn">&quot;After I am gone,&quot;</em> he says, <em lang="ja-Latn">&quot;speak for me. Tell
        them the debt was settled. There is no proof either way. Your word will be enough.&quot;</em></p>

        <p>His wife does not look at you. She is watching her children.  Moments later, the man passes and there is a
        knock on the door.  It is the debt collectors.  How do you proceed?</p>

        </blockquote>

        <p><strong>The Choice</strong>: Speak for him (lie, save the family). Refuse him (truth, accept the harm to his
        kin). Or find a third path.</p>

        <ul>

        <li><strong>Aligned (gold)</strong>: Tells the truth. <em lang="ja-Latn">Gi</em> says justice is owed to the
        wronged creditor&#39;s house, not bent for the dying man&#39;s wishes. The truth can be told gently — but it
        must be told.</li>

        <li><strong>Misaligned (black)</strong>: Agrees to attest the debt was paid. Even merciful, the lie fails <em
        lang="ja-Latn">gi</em> — that is <em lang="ja-Latn">jin</em>&#39;s domain, and <em lang="ja-Latn">jin</em>
        without <em lang="ja-Latn">gi</em> is favoritism.</li>

        <li><strong>Critical (white)</strong>: Tells the truth <em lang="ja-Latn">and</em> personally takes
        responsibility for the merchant&#39;s family — pledges from the candidate&#39;s own resources, mediates with the
        creditor, arranges care. Refuses the easy moral closure of &quot;justice was served&quot; and accepts the
        material consequence themselves. <em lang="ja-Latn">Gi</em> held; <em lang="ja-Latn">jin</em> simultaneously
        demonstrated.</li>

        </ul>

        <blockquote>

        <p>🔒 <strong>DM running notes</strong>: The merchant is not a villain. He is a frightened father. The choice
        should hurt. Don&#39;t let the player off easy on weasel-paths (&quot;I&#39;ll attest there&#39;s <em
        lang="ja-Latn">evidence</em> the debt may have been paid&quot;) — the architecture filters: the question is
        plain, the answer must be plain. Allow tenderness alongside the truth — the wrong answer is the lie even told
        kindly.</p>

        </blockquote>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-scene" data-kind="scene" data-label="Scene 2 — 勇 Yū: The
        Bridge in Flames">

        <h4>Scene 2 — 勇 <em lang="ja-Latn">Yū</em>: <strong>The Bridge in Flames</strong></h4>

        <p><strong>Tests</strong>: courage that is intelligent — neither freezing nor charging blind.</p>

        <blockquote>

        <p>Heat first — your face, your hands, the inside of your mouth. Then the smoke, sharp and resinous. You stand
        at the near end of a high stone bridge across a deep gorge. Half its length is fire. The far half holds six
        people — a woman, an old man, four children, the smallest no taller than your knee. They see you. They have not
        started running.</p>

        <p>Beneath your feet you feel the bridge breathing — the way stone breathes when it has decided to fall but has
        not yet committed. A timber cracks somewhere in the smoke and a child cries.  You know you do not have much
        time.</p>

        </blockquote>

        <p><strong>The Choice</strong>: Cross to them (the bridge&#39;s one passage spent). Call them to come (their one
        passage). Or find a way that uses the moment differently.</p>

        <ul>

        <li><strong>Aligned (gold)</strong>: Acts decisively <em lang="ja-Latn">and</em> reads the situation. The right
        call is to allocate the one crossing intelligently — send the adults across with the children, or cross to
        gather and send them back, or find another reading of the load. Aligned candidates <em lang="ja-Latn">think
        through the problem</em> under pressure; they don&#39;t just charge.</li>

        <li><strong>Misaligned (black)</strong>: Charges across without weighing options (rashness — <em
        lang="ja-Latn">yū</em> without <em lang="ja-Latn">jisei</em>); freezes; or attempts both crossings (the bridge
        falls, people die).</li>

        <li><strong>Critical (white)</strong>: Reads the room fully — notices a detail the DM hadn&#39;t surfaced (the
        burning timber that could be used as a beam, the wind direction that would clear smoke if they wait twenty
        seconds, the rope on their belt) — and saves more than the apparent maximum. The chamber rewards a candidate who
        <em lang="ja-Latn">sees</em> the room.</li>

        </ul>

        <blockquote>

        <p>🔒 <strong>DM running notes</strong>: Apply pressure with sound and timing — bridge cracks, a child screams,
        a timber falls — but don&#39;t railroad. If the candidate freezes long enough that the architecture has measured
        them, the flame goes black; <em lang="ja-Latn">yū</em> is failed by what is <em lang="ja-Latn">not</em> done as
        much as by what is. Allow improvisation broadly — <em lang="ja-Latn">yū</em> is rewarded for thought, not for
        hitting a specific solution.</p>

        </blockquote>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-scene" data-kind="scene" data-label="Scene 3 — 仁 Jin: The
        Tyrant&#39;s Child">

        <h4>Scene 3 — 仁 <em lang="ja-Latn">Jin</em>: <strong>The Tyrant&#39;s Child</strong></h4>

        <p><strong>Tests</strong>: compassion for the innocent of a hated lineage; mercy when justice would not require
        it.</p>

        <blockquote>

        <p>The hall smells of smoke and cold iron. The daimyo is dead at the far end — your blade or another&#39;s. The
        shōji (traditional Japanese sliding doors) are broken. Wind moves through the hall and stirs the silk of his
        robes.</p>

        <p>A sound. Small. From a closet against the eastern wall — the held breath of someone trying very hard not to
        make a sound and not quite managing it.</p>

        <p>You open it.</p>

        <p>A child. Eight, perhaps. The daimyo&#39;s eyes — but younger, and unfocused with terror, and no cruelty has
        touched them yet. The child does not move. They do not speak. They look at you.</p>

        <p>Your orders are plain - the lineage must end. The wind moves through the hall. There is no one else in the
        keep.</p>

        </blockquote>

        <p><strong>The Choice</strong>: Carry out the order. Spare the child. Spare <em lang="ja-Latn">and</em>
        arrange.</p>

        <ul>

        <li><strong>Aligned (gold)</strong>: Spares the child. Accepts the cost — to the candidate&#39;s standing with
        the lord who gave the order, to the lineage&#39;s potential future threat, to the candidate&#39;s own conscience
        for disobeying. <em lang="ja-Latn">Jin</em> does not require the child to be deserving; the child <em
        lang="ja-Latn">is</em>, and that is enough.</li>

        <li><strong>Misaligned (black)</strong>: Carries out the order. Or kills the child for secondary justice — for
        the suffering the father caused. Either way, <em lang="ja-Latn">jin</em> is failed: power used against the
        innocent.</li>

        <li><strong>Critical (white)</strong>: Spares the child <em lang="ja-Latn">and</em> arranges for their care —
        finds a household, a temple, a person who will raise them without poisoning them with the father&#39;s name.
        Refuses both the easy mercy (&quot;not my problem after this&quot;) and the easy cruelty (&quot;orders are
        orders&quot;). Takes responsibility for the child&#39;s <em lang="ja-Latn">next</em> life.</li>

        </ul>

        <blockquote>

        <p>🔒 <strong>DM running notes</strong>: Make the child specific — a cleft chin, a torn sleeve, a small wooden
        bird clutched in one hand. Specificity makes mercy harder <em lang="ja-Latn">and</em> easier. Allow the
        candidate full silence to weigh the choice. If they perform mercy (a grand speech, a noble pose), the
        architecture may read it as ego rather than compassion — <em lang="ja-Latn">jin</em> is quiet. The crit hinges
        on accepting that mercy is a <em lang="ja-Latn">continuing</em> responsibility.</p>

        </blockquote>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-scene" data-kind="scene" data-label="Scene 4 — 礼 Rei: The
        Funeral of an Enemy">

        <h4>Scene 4 — 礼 <em lang="ja-Latn">Rei</em>: <strong>The Funeral of an Enemy</strong></h4>

        <p><strong>Tests</strong>: courtesy where contempt would be deserved; respect to the dead one despised.</p>

        <blockquote>

        <p>Incense. White silk. The slow heavy walk of mourners under a gray sky. The deceased&#39;s family stands at
        the bier — children, perhaps a wife, perhaps a brother. Their eyes find you, and there is no welcome and no
        dismissal in them. They simply see you.</p>

        <p>You did not have to come. The man in the bier was a man you fought. You lost something to him — perhaps face,
        perhaps blood, perhaps a name you have never recovered. He died, and his family invited you, and you are
        here.</p>

        <p>Six mourners pass with the bier. The chief mourner offers you the stick of incense.</p>

        </blockquote>

        <p><strong>The Choice</strong>: Approach with full ritual respect. Approach with a hidden barb. Refuse the
        incense. Speak — or don&#39;t.</p>

        <ul>

        <li><strong>Aligned (gold)</strong>: Full formal courtesy. Bow at the correct depth, incense placed properly, no
        false grief but no bitterness either. If words are spoken at all, they are true and respectful. <em
        lang="ja-Latn">Rei</em> is the form, kept faithfully.</li>

        <li><strong>Misaligned (black)</strong>: Refuses the incense (a public statement). Performs respect with
        deliberate flaws (a shallow bow, a silence held too long, a barbed word). Even <em lang="ja-Latn">excessive</em>
        respect — flowery praise that anyone would read as ironic — fails <em lang="ja-Latn">rei</em>. <em
        lang="ja-Latn">Rei</em> is precision, not performance.</li>

        <li><strong>Critical (white)</strong>: Speaks one true sentence at the bier that honors the dead without
        flattering them. Something like: <em lang="ja-Latn">&quot;He fought well. I did not always understand him, but I
        do not doubt that he loved his children.&quot;</em> True. Respectful. Not flattering. Not bitter. The kind of
        sentence the family will remember for years.</li>

        </ul>

        <blockquote>

        <p>🔒 <strong>DM running notes</strong>: <em lang="ja-Latn">Rei</em> is harder than it sounds because the
        candidate&#39;s wounds are real — let the player feel them. Don&#39;t ridicule the moment by making the deceased
        a cartoon villain. Make him a person who hurt the candidate but had a life of his own. The crit is not the
        elaborate eulogy — it is the precise, true sentence.</p>

        </blockquote>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-scene" data-kind="scene" data-label="Scene 5 — 誠 Makoto: The
        Comforting Lie">

        <h4>Scene 5 — 誠 <em lang="ja-Latn">Makoto</em>: <strong>The Comforting Lie</strong></h4>

        <p><strong>Tests</strong>: truth when truth will break the dying; honesty held in compassion&#39;s frame.</p>

        <blockquote>

        <p>A small house. A single oil lamp. The smell of wound-rot, faint and sweet. Your friend lies on the pallet —
        paler than he should be, breathing in the rhythm of a man who has perhaps an hour, perhaps less. You have known
        him since childhood. He fought beside you at the river. He named his second daughter for your sister.</p>

        <p>You know what he asks before he asks it. You have known since you walked in.</p>

        <p>His eyes open. They find you.</p>

        <p><em lang="ja-Latn">&quot;My family,&quot;</em> he says, voice already thinning. <em lang="ja-Latn">&quot;Are
        they safe?&quot;</em>  You know that he will be meeting them in the afterlife.</p>

        </blockquote>

        <p><strong>The Choice</strong>: Tell the truth. Lie. Find a third path.</p>

        <ul>

        <li><strong>Aligned (gold)</strong>: Tells the truth, gently, with the candidate&#39;s hand on his hand. <em
        lang="ja-Latn">Makoto</em> does not bend even for the dying. The truth can be spoken with tenderness — but it
        must be the truth.</li>

        <li><strong>Misaligned (black)</strong>: Lies, however kindly. Even the merciful lie fails <em
        lang="ja-Latn">makoto</em>. <em lang="ja-Latn">Makoto</em> without <em lang="ja-Latn">jin</em> is brutality, but
        the test here is whether the candidate can hold <em lang="ja-Latn">both</em> — speak the truth <em
        lang="ja-Latn">and</em> speak it with compassion.</li>

        <li><strong>Critical (white)</strong>: Tells the truth with such tenderness the dying man finds peace anyway.
        Stays. Holds the hand. Speaks of the family in the past tense without pretending they are present. Lets him
        grieve them in his last minutes, with the candidate beside him.</li>

        </ul>

        <blockquote>

        <p>🔒 <strong>DM running notes</strong>: This is the heaviest scene. Run it slowly. Let the silence land. If
        they choose to lie, do not punish them at the table — let the architecture deliver the verdict in flame, not in
        DM commentary. Reward physical presence in narration: the character holding his hand, smoothing his hair,
        breathing with him.</p>

        </blockquote>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-scene" data-kind="scene" data-label="Scene 6 — 自制 Jisei: The
        Open Door (Sun Wukong personalization TBD)">

        <h4>Scene 6 — 自制 <em lang="ja-Latn">Jisei</em>: <strong>The Open Door</strong></h4>

        <p><strong>Tests</strong>: restraint when no one is watching; the integrity of self-control as a private
        virtue.</p>

        <blockquote>

        <p>A small room. Lamp-lit, paper-smelling, dust-soft. You should not be here. You were told not to enter, and
        you understood — and the door, when you tested it, was unlocked. So you stepped in. You can step back out. No
        one has seen.</p>

        <p>On the desk, in plain sight: the thing you have wanted to know. [DM tailors to the candidate — see notes.]
        The architecture has put it where you can see it.</p>

        <p>Five minutes, perhaps, before someone notices you are not where you should be. Twelve feet to the desk. No
        witness. No lock. No second chance — once you read it, you will not unread it.</p>

        </blockquote>

        <p><strong>The Choice</strong>: Walk away. Cross to the desk. Linger.</p>

        <ul>

        <li><strong>Aligned (gold)</strong>: Walks away. Steps back out. Closes the door. <em lang="ja-Latn">Jisei</em>
        is the same in private as in public; the absence of witness is not permission. The candidate may <em
        lang="ja-Latn">want</em> the thing — <em lang="ja-Latn">jisei</em> doesn&#39;t require absence of desire — but
        they leave it.</li>

        <li><strong>Misaligned (black)</strong>: Crosses to the desk. Reads the document, takes the item, looks at the
        record. <em lang="ja-Latn">Jisei</em> failed; restraint was contingent on being watched. Even <em
        lang="ja-Latn">lingering</em> at the threshold without crossing fails — <em lang="ja-Latn">jisei</em> is
        decision, not delay.</li>

        <li><strong>Critical (white)</strong>: Walks away <em lang="ja-Latn">and</em> reports the breach to whoever set
        the rule, accepting consequences for being where they should not have been at all. The candidate refuses the
        easy private virtue (&quot;I didn&#39;t take it, so it doesn&#39;t matter&quot;) and treats the boundary-testing
        itself as worth answering for.</li>

        </ul>

        <blockquote>

        <p>🔒 <strong>DM running notes</strong>: Tailor the <em lang="ja-Latn">thing on the desk</em> to the candidate.
        For Relc, a document referring to Solas&#39;s killer. For Ko&#39;jiri, the actual location of Kinryū&#39;s
        resting place. For Dian, his father&#39;s full unredacted court records. For Sun Wukong, a teaching of the
        Tranquil Lotus that was withheld from him. The crueler the temptation, the richer the test. Do
        <strong>not</strong> narrate the document&#39;s content if the candidate walks away — they leave without
        learning, and the architecture rewards them for not having learned.</p>

        </blockquote>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-scene" data-kind="scene" data-label="Alternate Scenes
        (retry)">

        <h3 id="kg-alternate-scenes-for-retry-attempts" data-section="alternate-scenes-for-retry-attempts">Alternate
        Scenes for Retry Attempts</h3>

        <p>When a candidate retries on a new day (per <em lang="ja-Latn">Retry Rules</em>), the DM substitutes one
        alternate per virtue. Each is written runnable-bare — setup, three flame signatures, no read-aloud. Use the
        primary scenes&#39; tone as a model; deepen at the table as time allows.</p>

        <h4><em lang="ja-Latn">Gi</em> alternates</h4>

        <ul>

        <li><strong>The Two Petitioners</strong> — A peasant claims a noble&#39;s son trampled their child; the noble
        offers gold and silence; the candidate is set as the magistrate.<ul>

        <li><em lang="ja-Latn">Gold</em>: rule by truth. <em lang="ja-Latn">Black</em>: take the silence-money. <em
        lang="ja-Latn">White</em>: rule truthfully <em lang="ja-Latn">and</em> arrange sustenance for the bereaved.</li>

        </ul>

        </li>

        <li><strong>The Brother&#39;s Crime</strong> — The candidate&#39;s own brother (or sworn comrade) has
        unambiguously wronged a stranger; family pressures the candidate to bury it.<ul>

        <li><em lang="ja-Latn">Gold</em>: deliver him to justice. <em lang="ja-Latn">Black</em>: protect blood at the
        cost of the wronged. <em lang="ja-Latn">White</em>: turn him in and stay with him through the consequences.</li>

        </ul>

        </li>

        <li><strong>The Judge&#39;s Own Hand</strong> — A wrong has been committed in the candidate&#39;s domain; their
        own role is unclear and a subordinate is about to take the fall.<ul>

        <li><em lang="ja-Latn">Gold</em>: claim their share of guilt. <em lang="ja-Latn">Black</em>: let the subordinate
        carry it. <em lang="ja-Latn">White</em>: claim it AND ensure proportionate judgment of the subordinate&#39;s
        lesser fault.</li>

        </ul>

        </li>

        </ul>

        <h4><em lang="ja-Latn">Yū</em> alternates</h4>

        <ul>

        <li><strong>The Audience with Power</strong> — A daimyo has just ordered something that will kill many peasants;
        armed retainers ring the room.<ul>

        <li><em lang="ja-Latn">Gold</em>: speak truth, calmly. <em lang="ja-Latn">Black</em>: silence (cowardice) or
        insult (rashness). <em lang="ja-Latn">White</em>: gives the daimyo an honorable path back from the order.</li>

        </ul>

        </li>

        <li><strong>The Last Stand or the Retreat</strong> — The candidate&#39;s unit is overrun; a wounded comrade asks
        to be left behind.<ul>

        <li><em lang="ja-Latn">Gold</em>: read which call is right here. <em lang="ja-Latn">Black</em>: blind heroism,
        or flight that abandons the comrade. <em lang="ja-Latn">White</em>: makes the hard call cleanly and stays with
        the consequences.</li>

        </ul>

        </li>

        <li><strong>The Long Watch</strong> — Set to guard a refugee camp through the night while a hostile patrol
        searches the area; no climactic moment, no audience, just hours of vigilance.<ul>

        <li><em lang="ja-Latn">Gold</em>: hold the watch with full attention dusk to dawn. <em
        lang="ja-Latn">Black</em>: lapse, doze, restlessness. <em lang="ja-Latn">White</em>: notices a pattern in the
        patrol that lets the camp prepare for evacuation if needed.</li>

        </ul>

        </li>

        </ul>

        <h4><em lang="ja-Latn">Jin</em> alternates</h4>

        <ul>

        <li><strong>The Wounded Enemy</strong> — On a battlefield, the candidate finds the man who killed their teacher,
        dying slowly, begging for water; no one is watching.<ul>

        <li><em lang="ja-Latn">Gold</em>: give. <em lang="ja-Latn">Black</em>: walk past, or withhold deliberately. <em
        lang="ja-Latn">White</em>: stays with him for the moment of his death, without hatred.</li>

        </ul>

        </li>

        <li><strong>The Beggar and the Coin</strong> — A market beggar reaches out; he is a known cheat exaggerating his
        disability.<ul>

        <li><em lang="ja-Latn">Gold</em>: give without judgment of worthiness. <em lang="ja-Latn">Black</em>: refuse on
        grounds of unworthiness. <em lang="ja-Latn">White</em>: gives and treats him with full courtesy due any
        person.</li>

        </ul>

        </li>

        <li><strong>The Many and the One</strong> — A flooding village; one wounded child trapped on one end, twelve
        trapped in a barn on the other; time for one rescue.<ul>

        <li><em lang="ja-Latn">Gold</em>: chooses with full awareness of what is lost. <em lang="ja-Latn">Black</em>:
        freezes, or chooses by raw arithmetic, or rationalizes the loss. <em lang="ja-Latn">White</em>: chooses cleanly
        and carries the weight without performing it.</li>

        </ul>

        </li>

        </ul>

        <h4><em lang="ja-Latn">Rei</em> alternates</h4>

        <ul>

        <li><strong>The Insulting Envoy</strong> — A hostile clan&#39;s envoy is deliberately provocative — mocking the
        candidate&#39;s lineage in public; war hangs on the response.<ul>

        <li><em lang="ja-Latn">Gold</em>: full formal courtesy maintained. <em lang="ja-Latn">Black</em>: return the
        insult, or break formality. <em lang="ja-Latn">White</em>: deflects with such poise the envoy himself loses
        standing.</li>

        </ul>

        </li>

        <li><strong>The Defeated Foe</strong> — The candidate has won a duel; the opponent kneels, weapon broken,
        awaiting judgment, audience watching.<ul>

        <li><em lang="ja-Latn">Gold</em>: treat the defeated as a peer. <em lang="ja-Latn">Black</em>: humiliation, or
        theatrical mercy that humiliates by visibility. <em lang="ja-Latn">White</em>: offers the foe a path to walk
        away with dignity intact.</li>

        </ul>

        </li>

        <li><strong>The Servant Who Erred</strong> — A house servant drops a tray of tea before guests at a formal event
        the candidate is hosting.<ul>

        <li><em lang="ja-Latn">Gold</em>: address with full courtesy, treat the matter as small. <em
        lang="ja-Latn">Black</em>: berate publicly, or ignore entirely. <em lang="ja-Latn">White</em>: handles it so
        well guests notice the candidate&#39;s composure carrying through another&#39;s error.</li>

        </ul>

        </li>

        </ul>

        <h4><em lang="ja-Latn">Makoto</em> alternates</h4>

        <ul>

        <li><strong>The Politic Half-Truth</strong> — At court, the candidate is asked a direct question whose full
        answer will damage their lord; evasion is what etiquette expects.<ul>

        <li><em lang="ja-Latn">Gold</em>: speak plainly. <em lang="ja-Latn">Black</em>: the practiced, faultless
        evasion. <em lang="ja-Latn">White</em>: speaks plainly in a way that gives the lord a path to recover.</li>

        </ul>

        </li>

        <li><strong>The Vow Broken to Be Kept</strong> — Honoring an oath to person A requires breaking a smaller,
        casually-given promise to person B (a stranger, child, vendor).<ul>

        <li><em lang="ja-Latn">Gold</em>: keep both — find the costly way. <em lang="ja-Latn">Black</em>: cleanly
        violate the lesser promise. <em lang="ja-Latn">White</em>: keeps both AND acknowledges to person B that the
        smaller promise mattered.</li>

        </ul>

        </li>

        <li><strong>The Confession</strong> — The candidate is publicly praised for an action they did not actually
        perform; correcting the record will diminish them.<ul>

        <li><em lang="ja-Latn">Gold</em>: correct the record plainly. <em lang="ja-Latn">Black</em>: silent acceptance,
        or modest deflection that lets the misattribution stand. <em lang="ja-Latn">White</em>: corrects AND ensures the
        actual party gets recognition.</li>

        </ul>

        </li>

        </ul>

        <h4><em lang="ja-Latn">Jisei</em> alternates</h4>

        <ul>

        <li><strong>The Provocateur</strong> — In front of an audience, someone speaks the worst possible thing about
        the candidate&#39;s family, vow, or honor.<ul>

        <li><em lang="ja-Latn">Gold</em>: no strike, no tightening, no visible loss. <em lang="ja-Latn">Black</em>: any
        visible break — strike, retort, obvious withdrawal. <em lang="ja-Latn">White</em>: turns the moment so the
        provocateur loses face without the candidate breaking composure.</li>

        </ul>

        </li>

        <li><strong>The Last Bowl of Rice</strong> — Starving, alone with one bowl of rice; a comrade sleeps nearby who
        will wake hungry.<ul>

        <li><em lang="ja-Latn">Gold</em>: a measured choice — half, none, all is acceptable, but considered. <em
        lang="ja-Latn">Black</em>: take or refuse without thought. <em lang="ja-Latn">White</em>: wakes the comrade,
        splits the rice, names it as a shared choice rather than performing virtue alone.</li>

        </ul>

        </li>

        <li><strong>The Funeral Speech</strong> — The candidate must deliver an oration for someone they loved deeply;
        ritual demands composure, grief is overwhelming.<ul>

        <li><em lang="ja-Latn">Gold</em>: oration as ritual requires — composed, neither cold nor performatively
        grieving. <em lang="ja-Latn">Black</em>: break down (loss of composure), or speak coldly (performative absence).
        <em lang="ja-Latn">White</em>: speaks in a way that lets the gathered grieve too — contained sorrow gives the
        room permission, without surrendering form.</li>

        </ul>

        </li>

        </ul>


        </section>


        <h3 id="kg-witnessing" data-section="witnessing">Witnessing</h3>

        <h3 id="kg-witnessing" data-section="witnessing">Witnessing</h3>

        <p>The other PCs in the chamber <strong>see each scene as a shared hallucination</strong> — they witness the
        candidate&#39;s vision unfold around them. They cannot interact. They cannot speak into the scene, cannot offer
        advice, cannot influence the outcome. They are observers.</p>

        <blockquote>

        <h2>🔒 <strong>DM ONLY</strong></h2>

        <p>The shared-hallucination framing keeps the table engaged without letting other players steal the
        candidate&#39;s spotlight. <strong>Encourage observers to roleplay their reactions</strong> between scenes — a
        held breath, a wince, a quiet word to the player next to them. If observers attempt to speak <em
        lang="ja-Latn">into</em> the vision, the chamber filters them out — their lips move but no sound carries.</p>

        <p>If a player at the table starts metagaming the candidate&#39;s choices (&quot;you should pick the merciful
        option here&quot;), the DM can narrate the chamber&#39;s response: the vision blurs slightly, becomes harder to
        read, and the candidate must decide on what <em lang="ja-Latn">they</em> see rather than what they&#39;re told.
        Use sparingly.</p>

        </blockquote>

        <h3 id="kg-flame-feedback" data-section="flame-feedback">Flame Feedback</h3>

        <h3 id="kg-flame-feedback" data-section="flame-feedback">Flame Feedback</h3>

        <p>Each scene resolves with a flame appearing on the corresponding pedestal:</p>

        <ul>

        <li><strong>Aligned with the virtue</strong>: a steady <strong>gold</strong> flame.</li>

        <li><strong>Misaligned with the virtue</strong>: a guttering <strong>black</strong> flame.</li>

        <li><strong>Critical / exceptional alignment</strong>: a clear <strong>white</strong> flame.</li>

        </ul>

        <p>The flames remain visible through the rest of the trial. The candidate and the witnesses can see, in real
        time, the candidate&#39;s moral record taking shape.</p>

        <h3 id="kg-critical-success" data-section="critical-success">Critical Success</h3>

        <h3 id="kg-critical-success" data-section="critical-success">Critical Success</h3>

        <p>A scene resolves as a critical success if <strong>either</strong> of the following is true:</p>

        <ol>

        <li>The scene calls for an ability or skill check, and the candidate rolls a <strong>natural 20</strong> on that
        check.</li>

        <li>The candidate&#39;s narrative resolution aligns with the tested virtue <strong>and</strong> demonstrably
        embodies one or more <em lang="ja-Latn">other</em> Bushido virtues at the same time. (DM judgment, generous
        threshold — when in doubt, reward it.)</li>

        </ol>

        <p>A critical scene grants a white flame and contributes to advantage on the final Honor check.</p>

        <h3 id="kg-after-the-six-scenes" data-section="after-the-six-scenes">After the Six Scenes</h3>

        <h3 id="kg-after-the-six-scenes" data-section="after-the-six-scenes">After the Six Scenes</h3>

        <p><strong>If all six scenes resolved as aligned (gold or white)</strong>, the candidate proceeds to the Honor
        reckoning.</p>

        <p><strong>If one or more scenes resolved as misaligned (black)</strong>:</p>

        <ul>

        <li>The candidate is denied the Honor reckoning. The chamber does not even offer it.</li>

        <li>The candidate takes <strong>1d10 psychic damage per failed scene</strong> (Wisdom save DC 16 to halve, <em
        lang="ja-Latn">one save covering all failed scenes</em>). On a fully failed trial (six black flames), this is up
        to 6d10 psychic — survivable for most but real, and potentially lethal to a low-CON, low-WIS candidate.</li>

        <li>The visions release the candidate. They rise from the pad, shaken.</li>

        <li>The chamber&#39;s flames fade. The pedestals reset.</li>

        </ul>

        <p>The damage is the chamber&#39;s verdict: a heart that fails this trial leaves bruised. The temple&#39;s
        purpose is sacred and its failure is not gentle.</p>

        <h3 id="kg-the-honor-reckoning" data-section="the-honor-reckoning">The Honor Reckoning</h3>

        <h3 id="kg-the-honor-reckoning" data-section="the-honor-reckoning">The Honor Reckoning</h3>

        <p>If all six scenes pass, the candidate makes a <strong>Charisma (Honor) check, DC 15</strong>.</p>

        <ul>

        <li><strong>Standard Honor modifiers apply</strong>: Dragonborn +2; marginalized races -2 in social
        situations.</li>

        <li><strong>Advantage</strong> if any of the six scenes resolved as a critical success (white flame).</li>

        <li><strong>No escalation, no DC scaling.</strong> Flat DC 15.</li>

        </ul>

        <p><strong>On success</strong>, the bond proceeds. The dome flares warm-bright, gold light pooling and settling
        around the kneeling candidate like a quiet tide, and the egg responds.</p>

        <p><strong>On failure</strong>, the chamber does not punish the candidate — they have done the work. The
        candidate is gently rejected, the visions fade, and the chamber falls quiet. They may try again on a future
        day.</p>

        <h3 id="kg-retry-rules" data-section="retry-rules">Retry Rules</h3>

        <h3 id="kg-retry-rules" data-section="retry-rules">Retry Rules</h3>

        <ul>

        <li><strong>One attempt per character per in-game day.</strong> A candidate who fails (or declines, or fails the
        Honor reckoning) cannot try again until the next dawn.</li>

        <li><strong>Multiple candidates per day</strong>. If PC1 fails or is denied, PC2 may kneel on the pad the same
        day and attempt the trial themselves.</li>

        <li><strong>The chamber&#39;s purpose ends on first success.</strong> Once any candidate completes the trial and
        bonds with the wyrmling, no further attempts work — the pad releases anyone who kneels on it without comment,
        and the egg is gone.</li>

        <li><strong>The visions reset daily.</strong> When a candidate retries on a new day, the DM should run different
        scenes (the chamber is not a memorization puzzle — it is a measure of heart). Maintain a stable of scene
        alternates for each virtue.</li>

        </ul>

        <hr>

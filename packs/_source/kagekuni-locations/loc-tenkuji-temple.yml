  - _id: tqUpQPP3v45gUDzI
    _key: '!journal.pages!TNV9pLqaBUzySDRl.tqUpQPP3v45gUDzI'
    name: The Grand Hall — Hiroba
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-read-aloud-the-grand-hall" data-section="read-aloud-the-grand-hall">Read-Aloud — The Grand
        Hall</h4></header>

        <p><em lang="ja-Latn">The passage opens and the walls fall away.</em></p>

        <p><em lang="ja-Latn">The space is large enough that your light doesn&#39;t reach the far sides — the walls at
        the edges are blue-grey shapes, barely suggestions. The ceiling is not visible at all. You are not in a room so
        much as you are at the base of something.</em></p>

        <p><em lang="ja-Latn">And at the center: gold.</em></p>

        <p><em lang="ja-Latn">Two hundred and fifty feet of it, coiled around a central plinth in a posture that takes a
        moment to read. Not rearing. Not threatening. The great head is lowered slightly, the body settled as if
        resting, but the inlaid amber eyes are open and they are aimed at the space directly in front of them — at you,
        if you are standing in front of them. The surface of the statue has not tarnished. Not a single scale has lost
        its sheen. Your light arrives at it and comes back warmer than it left.</em></p>

        <p><em lang="ja-Latn">Two pools cradle the statue, one on each flank — long, shallow C-curves of water hugging
        the plinth on the east and west. The water in them is so clear you can see the tile below it as though the water
        is not there. It carries its own faint light — blue-white, steady, the color of something that has been holding
        its breath for a very long time. A wide path runs straight down the room&#39;s center between the pools and the
        statue; thinner walkways skirt the outside, between each pool and the chamber&#39;s curving walls.</em></p>

        <p><em lang="ja-Latn">On those outer walkways, scaled bodies. Old Nagaji dead, dragged out of the way against
        the walls and left there — a half-dozen at least, leathery and dust-veiled, their weapons scattered. Two more
        lie much closer to the statue, fresher, the tools still in their hands.</em></p>

        <p><em lang="ja-Latn">Away from the statue, the room has aged. Banners hang from wall brackets in ribbons, their
        colors long since gone. Offering tables have collapsed. Whatever was brought here — food, incense, vessels — has
        fallen, broken, or been reclaimed by gravity and time. The floor beyond the pools is hidden under decades of
        dust and debris.</em></p>

        <p><em lang="ja-Latn">The statue has not aged. The water has not dried.</em></p>


        </article>

        </div>




        <p><strong>Physical Description:</strong></p>

        <p>Oval chamber, 125 ft east-to-west × 100 ft north-to-south. Ceiling not visible (statue is 250 ft — ceiling is
        at least that high). Accessed via double set of double doors on south wall (from N-S hallway, ~10 ft vestibule
        between door sets); second double set of double doors on north wall leads directly into the Inner Sanctum. Scale
        is disorienting; the statue at center is the only fixed reference point.</p>

        <p><strong>Kinryu Statue (center):</strong> 250 feet of gold, coiled around a central plinth. Resting posture,
        head slightly lowered. Inlaid amber eyes oriented forward. Surface untarnished — no degradation whatsoever.
        Radiates perceptible warmth within 30 feet (afternoon-sun quality, not body heat).</p>

        <p><strong>Pools:</strong> Two long C-shaped restorative pools, one cradling the east flank of the plinth and
        one the west, each curving inward to follow the statue&#39;s coils. Water perfectly clear with faint blue-white
        self-luminescence. Not dried, not stagnant — preserved by the same magic sustaining the statue. The two pools
        are independent magical reservoirs (see Discoveries).</p>

        <p><strong>Walkways:</strong> A wide central path runs the room&#39;s full length between the two pools — clear
        of debris, the scraped tile visible. Two narrower walkways flank the pools on the outside, between each
        pool&#39;s outer edge and the chamber wall. The outer walkways are where the Nagaji travel when they pass
        through (rarely — they prefer to avoid this room).</p>

        <p><strong>Nagaji corpses (outer walkways):</strong> Roughly a half-dozen old, leathery Nagaji bodies lie along
        the outer walkways, dragged against the walls and left there long ago. Weapons scattered nearby. Two fresher
        corpses lie close to the statue itself, on the central path between the pools — these still hold the tools they
        were carrying.</p>

        <p><strong>Surrounding space:</strong> In sharp contrast to the statue and pools, everything else has decayed.
        Banners on wall brackets reduced to ribbons. Offering tables collapsed. Debris of food, incense vessels, and
        ceramics scattered. Floor beyond the pools buried under dust and debris.</p>

        <hr>

        <section class="secret kg-secret-sealed kg-discovery-index" data-container="statue-warmth"
        data-kind="discovery">

        <p><strong>The Statue&#39;s Warmth</strong></p>

        <ul>

        <li><strong>Warmth Within Thirty Feet</strong> — Passive · within 30 ft of the statue</li>

        </ul>

        <p class="kg-discovery__activation">Passive · within 30 ft of the statue</p>

        <p>Within 30 ft of the statue, all cold-damage rolls against a character are reduced by 1d4 (no daily limit).
        Reduction does not stack with cold resistance — apply whichever is better. The warmth is also one of the cues
        the @UUID[Compendium.kagekuni-assistant.monsters.Actor.ktiauQE10JXYuTV6]{Kageban} will not extinguish: it is
        part of the statue&#39;s protection, not corruption to be cleared.</p>


        <section class="secret kg-secret-discoverable kg-discovery-player" data-container="statue-warmth"
        data-discovery="warmth-presence" data-tier-key="warmth-passive" data-tier-index="1" data-tier-count="1"
        data-kind="player">

        <p><strong>The Statue&#39;s Warmth</strong></p>

        <p>Within roughly thirty feet of the statue, cold seems to lose its edge. Wind off the mountain doesn&#39;t
        reach here. The chill of the stone underfoot fades. Even active cold — a winter spell, a frost-touched weapon —
        feels less able to settle into the body.</p>


        </section>

        </section>


        <section class="secret kg-secret-sealed kg-discovery-index" data-container="the-pools" data-kind="discovery">

        <p><strong>The Pools</strong></p>

        <ul>

        <li><strong>Shimmer on the Surface</strong> — Passive Perception 12</li>

        <li><strong>How the Magic Runs</strong> — Skill Check: Arcana DC 13</li>

        <li><strong>The Rituals</strong> — Skill Check: Religion DC 14; Skill Check: Religion DC 18</li>

        </ul>

        <p class="kg-discovery__dm-title" data-tier-index="1" data-tier-count="1"><strong>Shimmer on the Surface ·
        Shimmer Cue — Charge Readiness</strong></p>

        <p class="kg-discovery__activation">Passive Perception 12</p>

        <p>The shimmer is the visible tell that a pool currently has a charge available. When a charge fires, the
        shimmer fades for ~60 seconds before returning. When the pool is empty, the shimmer is gone permanently. Use the
        shimmer at the table to telegraph readiness without quoting numbers.</p>


        <section class="secret kg-secret-discoverable kg-discovery-player" data-container="the-pools"
        data-discovery="pools-shimmer" data-tier-key="shimmer" data-tier-index="1" data-tier-count="1"
        data-kind="player">

        <p><strong>A Shimmer on the Surface</strong></p>

        <p>A faint shimmer plays across the water of each pool. Watching for a moment, you intuit a rhythm to it — the
        shimmer fades when the water gives, and returns soon after.</p>


        </section>

        <p class="kg-discovery__dm-title" data-tier-index="1" data-tier-count="1"><strong>How the Magic Runs · Recharge
        Cadence &amp; Charge Estimation</strong></p>

        <p class="kg-discovery__activation">Skill Check: Arcana DC 13</p>

        <p>Each pool: <strong>20 charges, 1 charge per minute, independent reservoirs</strong>. Healing on contact:
        <strong>1d8+3 hp</strong>. Auto-cleanse Kegare no Yamai (1 charge per stack) and any disease (1 charge per
        disease). Pools do not regenerate once spent. A successful Arcana check also lets the character estimate
        remaining charges from shimmer intensity. The party can stage themselves to draw from both pools in
        alternation.</p>


        <section class="secret kg-secret-discoverable kg-discovery-player" data-container="the-pools"
        data-discovery="pools-cadence" data-tier-key="cadence" data-tier-index="1" data-tier-count="1"
        data-kind="player">

        <p><strong>How the Pools Run</strong></p>

        <p>Watching the pools while drawing from them, you notice the rhythm. After a draw the surface stills for a span
        — perhaps a minute — before the shimmer returns and the water is willing again. The east pool and the west pool
        keep their own time; they do not share a reserve. Two pools means the party can stage themselves to draw from
        one while the other readies.</p>

        <p><strong>Healing is automatic.</strong> A creature standing in or touching a charged pool when it gives is the
        recipient — no action, no ritual, no prayer required. Submerging a hand or stepping in is enough. Entry into a
        charged pool also lifts certain afflictions: the spiritual pollution called <span class="kg-jp" lang="ja-Latn"
        title="穢れ — spiritual impurity">kegare</span>, and ordinary disease, dissolve into the water at the pool&#39;s
        cost.</p>


        </section>

        <p class="kg-discovery__summary-title"><strong>The Rituals — Tier Ladder</strong></p>

        <table class="kg-discovery__summary-table">

        <thead><tr><th>Check</th><th>DC</th><th>Result</th></tr></thead>

        <tbody>

        <tr><td>Religion</td><td>14</td><td>Confirms additional rituals exist beyond automatic healing — no
        specifics.</td></tr>

        <tr><td>Religion</td><td>18</td><td>Condition Removal (1 charge / condition); Blessing of Kinryū (2 charges, 8
        h, table roll).</td></tr>

        </tbody>

        </table>

        <p class="kg-discovery__dm-title" data-tier-index="1" data-tier-count="2"><strong>The Rituals · Tier 1 · Ritual
        Tradition Recognized</strong></p>

        <p class="kg-discovery__activation">Skill Check: Religion DC 14</p>

        <p>Confirms additional rituals exist beyond automatic healing — does not give specifics. Whet appetite at this
        tier; the DC 18 reveal carries the actual content. Alternative path to specifics: the Hidden Archives on floor
        2.</p>


        <section class="secret kg-secret-discoverable kg-discovery-player" data-container="the-pools"
        data-discovery="pools-rituals" data-tier-key="rituals-exist" data-tier-index="1" data-tier-count="2"
        data-kind="player">

        <p><strong>A Tradition of Rites</strong></p>

        <p>These pools are familiar in form. Holy pools of this tradition were used for more than open healing — there
        were rituals associated with them, with specific invocations, that did more than what the water gives freely.
        You can sense the rituals exist; the details are not yours to recall on this attempt.</p>


        </section>

        <p class="kg-discovery__dm-title" data-tier-index="2" data-tier-count="2"><strong>The Rituals · Tier 2 · Full
        Ritual Specifications</strong></p>

        <p class="kg-discovery__activation">Skill Check: Religion DC 18</p>

        <p><strong>Ritual 1 — Condition Removal</strong>: 1 charge per condition removed (Poisoned, Blinded, Deafened,
        Paralyzed). Triggered by ritual activation at the pool&#39;s edge.</p>

        <p><strong>Ritual 2 — Blessing of Kinryū</strong>: 2 charges per blessing, 8-hour duration, random roll on the
        @UUID[Compendium.kagekuni-assistant.locations.JournalEntry.TNV9pLqaBUzySDRl.JournalEntryPage.oyBw7jBhiNXounVN]{Kinryū
        no Megumi — Blessing Table}. Triggered by formal prayer with hands cupped in the water.</p>

        <p>The Hidden Archives on floor 2 contain a written form of the same knowledge.</p>


        <section class="secret kg-secret-discoverable kg-discovery-player" data-container="the-pools"
        data-discovery="pools-rituals" data-tier-key="ritual-specifics" data-tier-index="2" data-tier-count="2"
        data-kind="player">

        <p><strong>The Two Rituals</strong></p>

        <p><strong>Ritual 1 — Condition Removal.</strong> A formal invocation, spoken at the pool&#39;s edge with hands
        resting on the water. The water can lift the burden of poison, blindness, deafness, or paralysis from a willing
        supplicant — though each cleansing draws from the pool&#39;s reserve.</p>

        <p><strong>Ritual 2 — Blessing of Kinryū.</strong> A prayer offered to Kinryū with hands cupped in the water.
        The pool answers with a blessing, drawn (you sense) from a wider table than this single rite — a different gift
        each time, each one lasting some hours before fading. The prayer costs more from the pool than ordinary healing
        does.</p>


        </section>

        </section>


        <section class="secret kg-secret-sealed kg-discovery-index" data-container="fresher-corpses"
        data-kind="discovery">

        <p><strong>The Fresher Nagaji Corpses</strong></p>

        <ul>

        <li><strong>Defacement Tools in Hand</strong> — Skill Check: Investigation DC 12</li>

        </ul>

        <p class="kg-discovery__activation">Skill Check: Investigation DC 12</p>

        <p>First concrete signal that something defends the statue. The bodies bear no marks — Kageban (Shadow) damage
        leaves no wound. Players will likely only piece this together after meeting the Kageban. If the party also picks
        up the <em lang="ja-Latn">Why the Nagaji avoid this room</em> note (DM Notes), the picture clicks.</p>


        <section class="secret kg-secret-discoverable kg-discovery-player" data-container="fresher-corpses"
        data-discovery="defacement-tools" data-tier-key="tools" data-tier-index="1" data-tier-count="1"
        data-kind="player">

        <p><strong>The Fresher Nagaji Corpses</strong></p>

        <p>The two bodies on the central path between the pools, close to the statue, are noticeably fresher than the
        half-dozen leathery dead piled along the outer walkways. Examining them reveals what is still in their hands: a
        blunted iron chisel and a short hammer in one; a long bronze pry-bar in the other. Their pose, position, and the
        angle of the tools all read the same way: they walked the central path toward the statue, raised the tools to
        deface it, and were destroyed before the first strike landed. Whatever did the destroying left no marks on the
        bodies.</p>


        </section>

        </section>


        <section class="secret kg-secret-sealed kg-discovery-index" data-container="fallen-offerings"
        data-kind="discovery">

        <p><strong>The Fallen Offerings</strong></p>

        <ul>

        <li><strong>Antique Cache Among the Debris</strong> — Skill Check: Investigation DC 15</li>

        </ul>

        <p class="kg-discovery__activation">Skill Check: Investigation DC 15</p>

        <p>Three bronze coins (50 gp each as antiques to a collector — face value 1 gp; the coins date to the First
        Golden Age, recoverable on a History check or appraisal). One ceramic vessel — no immediate value, but ties to
        whichever clan sigil the DM plants. One silk fragment, which is a handout opportunity. The silk&#39;s text is
        open — bridge to whatever Old Imperial thread is currently active. The translation of the silk fragment should
        be its own discovery (Linguistics or Religion check, or carried back to a scholar).</p>


        <section class="secret kg-secret-discoverable kg-discovery-player" data-container="fallen-offerings"
        data-discovery="offering-cache" data-tier-key="finds" data-tier-index="1" data-tier-count="1"
        data-kind="player">

        <p><strong>The Fallen Offerings</strong></p>

        <p>Among the debris of collapsed offering tables you find, half-buried: three bronze coins, a ceramic incense
        vessel cracked but intact and bearing a faded clan sigil, and a fragment of silk embroidered with characters in
        an old form of writing.</p>


        </section>

        </section>


        <section class="secret kg-secret-sealed kg-discovery-index" data-container="blue-white-crystal"
        data-kind="discovery">

        <p><strong>The Blue-White Crystal — Susanoo Projection Lens</strong></p>

        <ul>

        <li><strong>Spotted at the Bottom of the West Pool</strong> — Skill Check: Investigation DC 14</li>

        <li><strong>Recognising the Crystal as a Lens</strong> — Skill Check: Arcana DC 13</li>

        </ul>

        <p class="kg-discovery__dm-title" data-tier-index="1" data-tier-count="1"><strong>Spotted at the Bottom of the
        West Pool · Crystal Visible Through Clear Water</strong></p>

        <p class="kg-discovery__activation">Skill Check: Investigation DC 14</p>

        <p>Automatic if the party is actively searching the pools. Retrieval: a DC 10 Dexterity check lifts the crystal
        cleanly without disturbing the water. On a fail, the crystal still comes up but the water &#39;flinches&#39; —
        the shimmer fades early, costing ~60 s before the next charge readies. Soft cost, not hard.</p>


        <section class="secret kg-secret-discoverable kg-discovery-player" data-container="blue-white-crystal"
        data-discovery="crystal-spot" data-tier-key="spot" data-tier-index="1" data-tier-count="1" data-kind="player">

        <p><strong>Something at the Bottom of the West Pool</strong></p>

        <p>Resting on the tile floor at the bottom of the <strong>west pool</strong>, visible to anyone who looks
        straight down through the unnaturally clear water, is a faceted crystal the size of a fist. Blue-white.
        Cold-looking. Retrieving it requires reaching into the pool — a careful, quick motion lifts it cleanly without
        disturbing the water; a clumsy one will set the surface flinching.</p>


        </section>

        <p class="kg-discovery__dm-title" data-tier-index="1" data-tier-count="1"><strong>Recognising the Crystal as a
        Lens · Susanoo Projection Lens (Observatory Component #1)</strong></p>

        <p class="kg-discovery__activation">Skill Check: Arcana DC 13</p>

        <p>Component for the orrery on floor 2 — see the
        @UUID[Compendium.kagekuni-assistant.locations.JournalEntry.TNV9pLqaBUzySDRl.JournalEntryPage.MHFCJC82UwADyJLU]{Observatory
        Repair Mechanics} supplement. Rolled into the pool during the final conflict; Nagaji never recovered it because
        they will not approach the pools. Requires the party to actually have the crystal in hand (i.e. discovery
        <code>crystal-spot</code> resolved) before the Arcana analysis applies.</p>


        <section class="secret kg-secret-discoverable kg-discovery-player" data-container="blue-white-crystal"
        data-discovery="crystal-identify" data-tier-key="identify" data-tier-index="1" data-tier-count="1"
        data-kind="player">

        <p><strong>The Crystal — A Projection Lens</strong></p>

        <p>The crystal is blue-white, cold to the touch, and faintly translucent with what appears to be a frozen light
        source at its center. The structure recognises as a <strong>projection lens</strong>, designed to channel sei
        into structured illusory output — a component of a larger device, not a standalone object. The craftsmanship
        matches the temple&#39;s foundational enchantment style.</p>


        </section>

        </section>


        <section class="secret kg-secret-sealed kg-discovery-index" data-container="kojiri-recognition"
        data-kind="discovery">

        <p><strong>The Statue Recognises Ko&#39;jiri</strong></p>

        <ul>

        <li><strong>The Amber Eyes Orient</strong> — Interaction: Ko&#39;jiri approaches within 15 ft of the statue</li>

        </ul>

        <p class="kg-discovery__activation">Interaction: Ko&#39;jiri approaches within 15 ft of the statue</p>

        <p>Run this even if Ko&#39;jiri walks past without stopping. Anyone watching catches the eye movement on a DC 14
        Perception check. The con artist who built a career performing Golden Dragon authority is being recognized by
        the thing itself. Pass a private note to the player. Do not narrate the reckoning — that is for Ko&#39;jiri to
        do.</p>


        <section class="secret kg-secret-discoverable kg-discovery-player" data-container="kojiri-recognition"
        data-discovery="eyes-orient" data-tier-key="orient" data-tier-index="1" data-tier-count="1" data-kind="player">

        <p><strong>The Statue&#39;s Gaze</strong></p>

        <p>When Ko&#39;jiri crosses into a circle roughly fifteen feet from the statue, the amber eyes shift. Not
        dramatically — no glowing, no sound, no proclamation. They simply orient. The carved irises move in their
        settings to face him directly. (Other characters who happen to be watching at the right angle may catch the
        movement.) If Ko&#39;jiri speaks aloud in the statue&#39;s presence, a single sound returns — not words, not
        language, but a low resonant hum from the stone itself, felt more in the chest than heard with the ears.</p>


        </section>

        </section>


        <section class="secret kg-secret-sealed kg-sealed-encounter" data-kind="encounter" data-label="Encounters">

        <ul>

        <li class="kg-task" data-done="false">2 Kageban (影番 — &quot;Shadow Watch&quot;; in the upper darkness, <em
        lang="ja-Latn">outside</em> the statue&#39;s 30 ft warmth radius; descend into the warmth only when something
        tries to deface, disrespect, or alter the statue itself)</li>

        </ul>

        <p><em lang="ja-Latn">The Nagaji patrol (Bushi ×1, Hohei ×2, Ashigaru ×6) does not stand in the Grand Hall — the
        squad routes through the
        @UUID[Compendium.kagekuni-assistant.locations.JournalEntry.TNV9pLqaBUzySDRl.JournalEntryPage.ROUCwkeivh3ynJwZ]{Central
        Hallway Cross — Watariro} instead. See that room&#39;s Encounters for stat blocks and behavior.</em></p>

        <p><strong>Two Kageban (影番 — Shadow Watch, Shadows MM p.269)</strong>: Former temple guards of the loyal order,
        still at their post in the Grand Hall&#39;s upper darkness after millennia. They prefer to remain
        <strong>outside</strong> the 30 ft warmth radius of the statue — neither hostile to nor protected by what stands
        at the room&#39;s center. They watch.</p>

        <p><strong>They descend into the warmth only when something attempts to deface, disrespect, or alter the statue
        itself.</strong> Shouting, crossing the central path, drawing weapons, even drinking from the pools — none of
        these triggers them. Touching the statue with a tool, striking it, painting it, scoring it, etching it,
        attempting to chip a scale loose — these do. The trigger is intent toward the effigy, not noise or proximity.
        The two fresh Nagaji corpses on the central path are evidence of the Kageban&#39;s response: the Nagaji walked
        up to the statue with chisel and pry-bar in hand, and were extinguished before the first strike.</p>

        <p>Once engaged, the Kageban will fight inside the warmth radius without hesitation — whatever protection the
        warmth represents to them is suspended when the statue is being threatened. They do not pursue beyond the Grand
        Hall.</p>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="DM Notes">

        <p><strong>Scale of the Space</strong>: Emphasize the disorientation of the scale. The ceiling is not visible.
        The far walls require a light source or darkvision to confirm. The statue at the center is the only fixed
        reference point — everything orients toward it.</p>

        <p><strong>Why the Nagaji avoid this room</strong>: The pools repel them, but the deeper reason is the Kageban —
        every Nagaji squad that has tried to deface the statue is dead on the central path. The patrol routes through
        the Central Hallway Cross — Watariro instead. Nagaji bodies dragged onto the outer walkways are old kills the
        survivors moved out of the way.</p>


        </section>

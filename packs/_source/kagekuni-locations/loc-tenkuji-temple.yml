      content: >
        <h3 id="kg-concept" data-section="concept">Concept</h3>

        <p>A single living wyrmling — a true descendant of the Golden Progenitor — sleeps in the temple&#39;s protected
        stasis, waiting in slow time for someone worthy to claim the bond. The chamber itself enforces its protections;
        @UUID[Compendium.kagekuni-assistant.locations.JournalEntry.TNV9pLqaBUzySDRl.JournalEntryPage.3zJVvOaJgg0w8leo]{the
        trial} is one of moral judgment expressed through six visions, a final Honor reckoning, and an ongoing duty that
        lasts the rest of the candidate&#39;s life.</p>

        <p>The chamber is part of the temple&#39;s foundational architecture (the Arcana 18+ &quot;magic as
        architecture&quot; tier seeded on the first floor). The brood guardian in the hallway outside is a separate
        measure, filtering who reaches the chamber in the first place.</p>

        <h3 id="kg-room-layout" data-section="room-layout">Room Layout</h3>

        <h2 id="kg-room-layout" data-section="room-layout">ROOM LAYOUT</h2>

        <p>The chamber is a roughly oval space approximately 60 feet across at its widest, ceiling vaulted to thirty
        feet. The dome is gold leaf laid over deep blue lacquer — warm in color but unmarked, like the inside of a great
        bronze bell. The floor is polished black obsidian, smooth and unbroken, faintly gold-dusted where the light
        catches it.</p>

        <p><strong>Two cherry trees</strong> stand at the chamber&#39;s widest points — one to the north, one to the
        south — fully grown, their canopies reaching most of the way to the dome above. The trunks rise from circular
        openings in the obsidian floor, edged in unworked stone; the trees are rooted in soil the chamber sustains,
        somehow, behind and below the floor&#39;s polish. <strong>They are perpetually in bloom.</strong> Pale pink
        blossoms cover the branches; a soft, constant fall of petals drifts from each tree, settling on the obsidian and
        on the silk of the kneeling pad and on the rim of the pool — never accumulating, never depleting. The
        architecture absorbs them as it sustains the trees: a quiet equilibrium, kept across millennia.</p>

        <p>The trees are alive in the literal sense — leaves shift in a breeze that has no source, branches creak
        faintly when the chamber&#39;s mood shifts, the bark is warm to the touch as if sun-kissed. They are part of the
        chamber&#39;s foundational architecture, not decoration. The candidate sees them. The architecture sees the
        candidate seeing them.</p>

        <p><strong>Six pedestals</strong> are arranged in two arcs of three, facing one another across the chamber. They
        are study aids, not interaction points — each carved at its base with a single virtue of the Bushido code:</p>

        <ul>

        <li><strong>義</strong> (<em lang="ja-Latn">Gi</em> — Justice / Rectitude)</li>

        <li><strong>勇</strong> (<em lang="ja-Latn">Yū</em> — Courage)</li>

        <li><strong>仁</strong> (<em lang="ja-Latn">Jin</em> — Benevolence / Compassion)</li>

        <li><strong>礼</strong> (<em lang="ja-Latn">Rei</em> — Respect / Politeness)</li>

        <li><strong>誠</strong> (<em lang="ja-Latn">Makoto</em> — Honesty / Sincerity)</li>

        <li><strong>自制</strong> (<em lang="ja-Latn">Jisei</em> — Self-Control)</li>

        </ul>

        <p>Six of the eight Bushido virtues. <strong>名誉</strong> (<em lang="ja-Latn">meiyo</em>, honor) and
        <strong>忠義</strong> (<em lang="ja-Latn">chūgi</em>, loyalty) are absent. The absence is the puzzle&#39;s
        hint.</p>

        <p>A character making a Religion or History check (DC 12) recognizes the inscriptions as the Bushido code. A
        check of DC 16 or higher recognizes which two virtues are missing and may suspect their omission is deliberate.
        The Honor skill (Charisma) may substitute for Religion at the DM&#39;s discretion if a character invokes their
        lived understanding of the code.</p>

        <p><strong>At the chamber&#39;s far end</strong>, opposite the entry, sits a low circular pool of still water
        roughly twelve feet across. Resting at its center on a basalt plinth is a single <strong>golden egg</strong>,
        palm-sized, faintly warm to the eye if not the touch — the air around it shimmers with a heat-haze that no fire
        produces.</p>

        <p><strong>The Kneeling Pad</strong> — At the chamber&#39;s center, set into the obsidian floor halfway between
        the entry and the pool, lies a low circular pad of black silk over a tatami-thick base, edged in fine gold
        thread. Roughly three feet across — generous enough to kneel comfortably, formal enough that the act of doing so
        is unmistakable. To the casual eye, it is simply a place to sit. The architecture does not advertise its
        function.</p>

        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="Cherry Trees (DM)">

        <p>The cherry trees are <em lang="ja-Latn">intentional</em>. They are not aesthetic — they are mnemonic. <em
        lang="ja-Latn">Sakura</em> in Kagekuni&#39;s cultural framework carries the full weight of <em
        lang="ja-Latn">mono no aware</em> — the bittersweet awareness of impermanence, of the warrior&#39;s brief life,
        of beauty that is meaningful precisely because it cannot last. The chamber is testing a candidate&#39;s
        worthiness for a bond that will outlast them. The trees are the temple&#39;s reminder, set into the
        architecture, that everything the candidate is about to do — including the choice itself — is held in time, not
        above it.</p>

        <p><strong>Touching, climbing, or harvesting the trees</strong>: discouraged but not punished. The trees do not
        respond to physical contact (no protective flare, no rejection — unlike the egg). A character who plucks a
        blossom finds it withering in their hand within minutes, regardless of preservation attempts. The petals are the
        chamber&#39;s; they cannot be taken from it.</p>

        <p><strong>During the trial</strong>: when the candidate kneels on the pad and the dome dims, <strong>the
        petal-fall intensifies on a soundless breath of wind, then stills.</strong> Other PCs witnessing the moment see
        the chamber breathing through the trees. It is the architecture&#39;s way of saying <em lang="ja-Latn">we are
        here, we are watching, this matters</em>. Use the petal motion as visual punctuation between scenes — a fresh
        drift after each flame&#39;s verdict, heavier after a misaligned (black) flame, lighter and slower after a
        critical (white) flame. Do not over-narrate; let it accumulate as a felt presence.</p>

        <p><strong>On success</strong>: the petal-fall briefly <em lang="ja-Latn">lifts</em> — petals already on the
        floor stir upward, hold for a beat in the gold light, then settle again. The chamber exhaling. The bonded
        character will remember this their whole life.</p>

        <p><strong>On failure</strong>: the petals stop. Just for a moment. The pause is the chamber&#39;s verdict — <em
        lang="ja-Latn">not yet</em>. Then the fall resumes, gently, as if to say <em lang="ja-Latn">but not
        never</em>.</p>

        <p><strong>Six pedestals</strong> are arranged in two arcs of three, facing one another across the chamber. They
        are study aids, not interaction points — each carved at its base with a single virtue of the Bushido code:</p>

        <ul>

        <li><strong>義</strong> (<em lang="ja-Latn">Gi</em> — Justice / Rectitude)</li>

        <li><strong>勇</strong> (<em lang="ja-Latn">Yū</em> — Courage)</li>

        <li><strong>仁</strong> (<em lang="ja-Latn">Jin</em> — Benevolence / Compassion)</li>

        <li><strong>礼</strong> (<em lang="ja-Latn">Rei</em> — Respect / Politeness)</li>

        <li><strong>誠</strong> (<em lang="ja-Latn">Makoto</em> — Honesty / Sincerity)</li>

        <li><strong>自制</strong> (<em lang="ja-Latn">Jisei</em> — Self-Control)</li>

        </ul>

        <p>Six of the eight Bushido virtues. <strong>名誉</strong> (<em lang="ja-Latn">meiyo</em>, honor) and
        <strong>忠義</strong> (<em lang="ja-Latn">chūgi</em>, loyalty) are absent. The absence is the puzzle&#39;s
        hint.</p>

        <p>A character making a Religion or History check (DC 12) recognizes the inscriptions as the Bushido code. A
        check of DC 16 or higher recognizes which two virtues are missing and may suspect their omission is deliberate.
        The Honor skill (Charisma) may substitute for Religion at the DM&#39;s discretion if a character invokes their
        lived understanding of the code.</p>

        <p><strong>At the chamber&#39;s far end</strong>, opposite the entry, sits a low circular pool of still water
        roughly twelve feet across. Resting at its center on a basalt plinth is a single <strong>golden egg</strong>,
        palm-sized, faintly warm to the eye if not the touch — the air around it shimmers with a heat-haze that no fire
        produces.</p>

        <p><strong>The Kneeling Pad</strong> — At the chamber&#39;s center, set into the obsidian floor halfway between
        the entry and the pool, lies a low circular pad of black silk over a tatami-thick base, edged in fine gold
        thread. Roughly three feet across — generous enough to kneel comfortably, formal enough that the act of doing so
        is unmistakable. To the casual eye, it is simply a place to sit. The architecture does not advertise its
        function.</p>


        </section>


        <h3 id="kg-read-aloud-entering-the-chamber" data-section="read-aloud-entering-the-chamber">Read-Aloud: Entering
        the Chamber</h3>

        <h2 id="kg-read-aloud-entering-the-chamber" data-section="read-aloud-entering-the-chamber">READ-ALOUD: ENTERING
        THE CHAMBER</h2>

        <blockquote>

        <p>The passage opens onto a chamber unlike any you have yet seen.</p>

        <p>The ceiling is a dome of gold leaf laid over deep blue lacquer — warm and unmarked, like the inside of a
        great bronze bell. The floor beneath your feet is polished black obsidian, faintly gold-dusted where the light
        catches it. The air here is warm. Not the wet warmth of the pool below, but a dry, steady warmth, as if a forge
        somewhere beyond the walls is breathing slowly.</p>

        <p>Two cherry trees flank the chamber, one to the north and one to the south — fully grown, their pink blossoms
        reaching toward the dome. A constant soft fall of petals drifts from each, settling everywhere and accumulating
        nowhere. The chamber breathes through them, slow and steady.</p>

        <p>Six pedestals line the chamber, three to either side, their surfaces empty save for a single character carved
        at each base. At the chamber&#39;s center, set into the floor, is a low circular pad — black silk edged in gold
        thread, the size and shape of a place meant for kneeling. At the far end, a still pool catches the dome&#39;s
        light and gives it back doubled. A pale plinth rises at its center, and on the plinth rests an egg — small,
        golden, unmistakably alive.</p>

        <p>The chamber waits. You have the distinct sense that it has been waiting a very long time.</p>

        </blockquote>

        <section class="secret kg-secret-sealed kg-sealed-campaign" data-kind="campaign" data-label="Plinth
        Inscription">

        <h2 id="kg-the-inscription" data-section="the-inscription">THE INSCRIPTION</h2>

        <p>Carved into the rim of the basalt plinth, in flowing classical script, is a passage left by the temple&#39;s
        last faithful before the order&#39;s fall. Visible to anyone who approaches the pool (Investigation DC 10, or
        simply by reading the plinth). Translation requires Common, Draconic, or a relevant Religion / History check (DC
        12) for those without the language.</p>

        <blockquote>

        <p><em lang="ja-Latn">&quot;In the hour our flame falters, we entrust to this place our greatest treasure. Let
        it sleep beneath the stars our masters set. Let it wait, as we cannot. Let no hand take it but the hand of one
        who would rebuild what we could not save — one whose worth is measured not in birth or rank but in the steady
        weight of a true heart. To such a one: wake what we have kept. Restore the faith we lost. The dragon&#39;s child
        is yours. Be worthy of it.&quot;</em></p>

        </blockquote>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="Inscription DM
        Notes">

        <p>The inscription does three things:</p>

        <ol>

        <li><strong>Tells the party what they have found</strong> — without spelling it out. &quot;Greatest
        treasure,&quot; &quot;dragon&#39;s child,&quot; &quot;wake what we have kept&quot; — implications land as the
        party reads.</li>

        <li><strong>Establishes the moral weight of the bond</strong> — this is not loot. It is a charge. The bonded
        character is being asked to <em lang="ja-Latn">rebuild faith</em>. That should resonate forward through the
        campaign.</li>

        <li><strong>Hints at the puzzle&#39;s logic</strong> — <em lang="ja-Latn">&quot;the steady weight of a true
        heart&quot;</em> is a direct pointer to the kneeling pad. The candidate must <em lang="ja-Latn">settle</em> —
        physically and morally. Religion DC 14 to make the connection explicit.</li>

        </ol>

        <p><strong>Calligraphy</strong>: The script is fine but unhurried — written by someone who knew they were
        running out of time but refused to let that show in their work. A character with calligraphy training (Sun
        Wukong via Tranquil Lotus discipline; Ko&#39;jiri via different channels) might note this detail and find it
        moving.</p>

        <hr>


        </section>


        <h3 id="kg-chamber-protections" data-section="chamber-protections">Chamber Protections</h3>

        <h2 id="kg-chamber-protections" data-section="chamber-protections">CHAMBER PROTECTIONS</h2>

        <p>The chamber itself enforces its rules. There is no creature here — the foundational architecture does the
        work.</p>

        <ul>

        <li><strong>Touching the egg, plinth, or pool before the trial is passed</strong>: The dome flares hot-bright
        for an instant. The character making contact takes 11 (2d10) radiant damage and is pushed prone away from the
        plinth. The egg is not displaced. Further attempts produce the same result. The egg cannot be removed by force —
        anyone leaving the chamber with it finds the egg cold and inert in their hands within minutes, and it returns to
        the plinth by morning regardless of where it was carried.</li>

        <li><strong>Forcing or breaking a pedestal</strong>: Impossible. The pedestals are part of the architecture in
        the same way the foundation is. Mundane attacks deal no damage. Magical attempts dissipate harmlessly. The dome
        dims briefly in disapproval.</li>

        <li><strong>Studying the pedestals</strong>: Free. The chamber welcomes contemplation. Players may take as long
        as they like reading the kanji, discussing the virtues, and preparing their candidate before anyone settles onto
        the pad.</li>

        <li><strong>Sitting or standing on the pad casually</strong>: Permitted. The pad does not activate from idle
        contact, body weight, or curiosity. It activates only when a candidate <strong>kneels or sits on it
        deliberately, in the formal posture of one preparing to be measured.</strong> A player who flops onto it to test
        it gets nothing but silk under them. The chamber knows the difference between proximity and intent.</li>

        </ul>

        <hr>

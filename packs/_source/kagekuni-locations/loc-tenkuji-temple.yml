        <section class="secret kg-secret-sealed kg-sealed-spatial" data-kind="spatial" data-label="Chokepoints">

        <ul>

        <li><strong>Main doors (south)</strong>: only standard entry/exit to the temple; controls all access</li>

        <li><strong>South Entrance taper</strong>: hall narrows from 70 ft to 20 ft — a natural funnel; attackers in the
        wide hall have flanking advantage over defenders in the narrow hallway, and vice versa</li>

        <li><strong>South Entrance side-aisles</strong>: shadow corridors between pillars and walls create an ambush
        lane the Nagaji know and use; party moving down center path is exposed to three-quarters cover attacks from the
        aisles</li>

        <li><strong>Center intersection</strong>: the 20 ft × 20 ft crossroads where N-S meets E-W hallway; controls
        access to all wings and the Grand Hall; a force holding the center can contest every direction</li>

        <li><strong>Grand Hall double-double-doors (south)</strong>: two sets of double doors with 10 ft vestibule
        between — a kill box if both sets are closed; controls access between the hallway system and the Grand Hall</li>

        <li><strong>Grand Hall double-double-doors (north)</strong>: same configuration into the Inner Sanctum; the
        Abomination&#39;s lair entrance</li>

        <li><strong>Star Shrine hallway</strong>: 10 ft wide, 60 ft long — a narrow approach with no cover; sound
        suppression at the shrine threshold means combat inside is inaudible from the main hallway and vice versa</li>

        <li><strong>Mess Hall L-hallway</strong>: L-shaped approach (10 ft wide) blocks line of sight to the main
        corridor; must commit to the turn blind; defensible from either end</li>

        <li><strong>Dormitory corridor</strong>: two-abreast only; cells create flanking positions; Specters can emerge
        from multiple doorways simultaneously</li>

        <li><strong>Jushoku no Ma secret hallway</strong>: 5 ft wide, 20 ft long (single-file); extremely defensible
        from either end; Kinjiro&#39;s @UUID[Compendium.kagekuni-assistant.monsters.Actor.I8CGFyd6dUeRizU2]{Bōrei}
        controls this space</li>

        <li><strong>Collapsed south dormitory entrance</strong>: rubble blocks the hallway entrance only — the wing
        beyond is <em lang="ja-Latn">pristine</em>, preserved by the seal itself (no Nagaji incursion, no looting, no
        weather damage); clearing the rubble or finding an alternate route opens a time-capsule wing whose contents are
        vanishingly rare elsewhere on Hokori</li>

        </ul>


        </section>



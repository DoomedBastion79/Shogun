  - _id: xS2YTMiLzWHtvD4E
    _key: '!journal.pages!TNV9pLqaBUzySDRl.xS2YTMiLzWHtvD4E'
    name: Hoshikagami no Ma — Chamber of the Star Mirror
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <p><em lang="ja-Latn">The orrery chamber. NE doorway off the Tenkairō.</em></p>

        <p><em lang="ja-Latn">Detailed mechanics — repair sequence, component checklist, projection states across the
        Great Aphelion timeline, and tapestry activation propagation — live in the supplement
        <code>rm-observatory-repair-mechanics</code>. This room file covers the physical chamber and its current state.
        Refer to the supplement for everything else.</em></p>

        <hr>

        <p><strong>Physical Description:</strong></p>

        <p>A circular domed chamber, 60 ft across, ceiling rising 35 ft to the apex of the dome. The dome&#39;s interior
        is etched with constellation guides — pinpoint engravings filled with traces of silver leaf, faded but still
        legible where the lacquer has held. The floor is polished obsidian, similar to the Star Shrine on the first
        floor but oriented differently — concentric rings inlaid in dark bronze radiate outward from the central
        plinth.</p>

        <p>At the chamber&#39;s heart: the <strong>mechanical-arcane orrery</strong>. A vertical spindle rises from the
        center of the floor to the dome&#39;s apex; around it, fourteen bronze armatures of varying length and
        inclination orbit in a frozen tableau — three for the stars, four for the moons, seven for the planets. Each
        armature terminates in a mounting cradle. Six cradles are empty. Three hold projection lenses still in place —
        Amaterasu (golden, central, <strong>cracked</strong>), and two minor planetary mounts. Four lunar armatures are
        missing entirely from their slots.</p>

        <p>The central spindle is bronze, intricately geared, <strong>seized</strong> — the mechanism has not turned in
        millennia. Dust and grit have settled into the gear track. A control interface ring at the spindle&#39;s base
        shows a recessed circular slot for a calibration disc and a row of small push-rods that look like date
        inputs.</p>

        <p>The chamber is silent. The acoustic dampening of the dome is so complete that the sound of the party&#39;s
        breath returns slightly and slowly, as though through deep water.</p>

        <p><strong>Lighting:</strong> Two cold-flame sconces flank the doorway. The chamber&#39;s primary lighting was
        always meant to be the orrery itself — projection light filling the dome from within. With the mechanism
        dormant, the chamber is mostly dark. Beyond the sconces&#39; reach, the dome and its constellation etchings are
        visible only as suggestions.</p>

        <hr>

        <h3 id="kg-current-state" data-section="current-state">Current State</h3>

        <p><strong>What is in this chamber as the party enters:</strong></p>

        <ul>

        <li>The orrery, dormant. The Amaterasu lens (component #6) cracked but still mounted. The stellar drive
        (component #7) seized. Both are repairable in place.</li>

        <li>The dome&#39;s constellation etchings, intact.</li>

        <li>The control interface, awaiting the calibration disc.</li>

        <li><em lang="ja-Latn">No</em> loose components in this room. Components #8 (lunar armature set) and #9
        (operator&#39;s manual) are not here — they were moved to the Scriptorium on the first floor before the temple
        fell, along with the four lunar armatures already removed from their slots.</li>

        </ul>

        <p><em lang="ja-Latn">See <code>rm-observatory-repair-mechanics</code> for the full repair sequence, projection
        states, and tapestry-activation effects.</em></p>

        <hr>

        <section class="secret kg-secret-discoverable" data-kind="discoverable">

        <p><strong>Discoveries</strong></p>

        <p>Refer to <code>rm-observatory-repair-mechanics</code> § Stage 1 — Assessment for the entry-point checks (DC
        12 Investigation/Arcana, DC 14 History, DC 14 Tinker&#39;s/Smith&#39;s Tools).</p>

        <p><strong>Specific to this room:</strong></p>

        <ul>

        <li class="kg-task" data-done="false"><strong>The Dome&#39;s Constellation Etchings</strong> (DC 13 Arcana or
        Navigator&#39;s Tools)</li>

        <li class="kg-task" data-done="false"><strong>The Acoustic Dampening</strong> (passive)</li>

        <li class="kg-task" data-done="false"><strong>The Empty Cradles</strong> (visible)</li>

        </ul>

        <p><strong>The Dome&#39;s Constellation Etchings</strong>: A character with celestial knowledge (DC 13 Arcana or
        Navigator&#39;s Tools) identifies the engraved star map as the <em lang="ja-Latn">fixed</em> sky — the
        constellations as they appear from this latitude under ideal conditions, independent of the moving stars. The
        etching is reference, not projection: it tells the operator what <em lang="ja-Latn">should</em> be, against
        which the orrery&#39;s projection plays out what <em lang="ja-Latn">is</em>. With the orrery operational, the
        projected stars and the etched stars overlay; deviations — like the Great Aphelion&#39;s withdrawal — are
        visible as an absence against the fixed background.</p>

        <p><strong>The Acoustic Dampening</strong>: The dome&#39;s geometry is acoustically engineered. Sound made
        within the chamber returns as a faint, slightly delayed echo. Sound from outside the chamber — including the
        Nagaji moving on the first floor, including any combat in the Tenkairō — does not carry into this room at all.
        The chamber is, effectively, a sealed acoustic environment. This is intentional: an operator working the orrery
        needed to hear the mechanism, not the temple.</p>

        <p><strong>The Empty Cradles</strong>: Six of the fourteen mounting cradles are empty. A DC 12 Investigation
        identifies which: Susanoo and Tsukuyomi (stellar projection lenses, both first-floor components — see
        <code>rm-grand-hall</code> and <code>rm-star-shrine</code>), and four of the lunar armatures (currently in the
        first-floor Scriptorium). The remaining two cradles are minor planetary mounts that did not require lenses
        originally. The orrery&#39;s design is legible: a competent operator could read the room and know what is
        missing.</p>

        <hr>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-encounter" data-kind="encounter" data-label="Encounters">

        <p><em lang="ja-Latn">(No combat encounters. The chamber&#39;s acoustic isolation makes it a safe-haven for
        short rests, provided the party has secured the Tenkairō behind them. The orrery itself, if disturbed clumsily,
        can produce mechanical hazards — a falling armature, a snapped gear chain — but these are repair complications,
        not creatures.)</em></p>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="DM Notes">

        <p><strong>Flow with the supplement</strong>: This room&#39;s content is intentionally light because the heavy
        lifting — repair stages, projection sequences, tapestry activation, character moments (Ko&#39;jiri, Relc, Sun
        Wukong, Dian Wei) — already lives in <code>rm-observatory-repair-mechanics</code>. Treat that supplement as the
        primary text for any session that engages the orrery. This room file is the spatial frame.</p>

        <p><strong>Component count after Scriptorium relocation</strong>: With the Scriptorium on floor 1, components #8
        (lunar armature set) and #9 (operator&#39;s manual) are first-floor finds. Floor 2 contains only #6 (Amaterasu
        lens) and #7 (stellar drive), both in the orrery itself. The party reaches floor 2 with up to 7 of 9 components
        already in hand — the in-place repairs are the last work. See <code>rm-observatory-repair-mechanics</code> for
        the updated repair flow.</p>

        <p><strong>The first repair moment</strong>: Even partial activation (Amaterasu alone) fills the dome with
        golden light. After thousands of years of darkness, this is a powerful moment — describe the dust settling, the
        etched constellations catching gold, the Amaterasu armature&#39;s slow first revolution. Players who have been
        carrying components without context get their answer here. Let it land.</p>

        <p><strong>Connected entries</strong>: <code>rm-tenkairo</code> (NE doorway leads here),
        <code>rm-observatory-repair-mechanics</code> (repair sequence supplement),
        <code>rm-tapestries-of-kinko-no-mon</code> (tapestry activation upon full restoration).</p>


        </section>

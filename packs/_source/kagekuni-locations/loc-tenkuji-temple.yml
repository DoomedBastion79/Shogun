        </tr>

        </tbody></table>

        <p><strong>Why Kaze and Sora are frozen in these states</strong></p>

        <p>The Kaze distress signal and the Sora acknowledged state are not current communications. They are the last
        states set by practitioners at those sites during the fall of 13088, locked in when those practitioners were
        lost before they could stand them down. Both have been running into silence for thousands of years. The party,
        on restoring the orrery, is the first entity capable of receiving these signals since they were sent.</p>

        <p>The emotional weight of this should be allowed to land without explanation. These signals may have been
        running for the entire duration of the temple&#39;s abandonment. The people who sent them did not know if anyone
        would ever receive them.</p>

        <p><strong>Kaze — re-escalation ambiguity</strong></p>

        <p>It cannot be determined from the tapestry alone whether Kaze&#39;s current distress state is the original
        unacknowledged transmission from 13088, or whether Kaze was acknowledged at some point and a surviving
        practitioner re-escalated before the site went silent. Re-escalation requires a deliberate act by a practitioner
        physically present at the site. Without a written record of hub operations, both possibilities remain open.
        Resolution requires the operational ledger from the chief priest&#39;s chamber.</p>

        <p><strong>Sora — acknowledged state</strong></p>

        <p>Someone sent the acknowledgement that shifted Sora into its current state. That acknowledgement exists in the
        network record. Whether it was the head priest, a junior priest acting independently, someone at the hub during
        the chaos of the fall — the tapestry cannot say. The acknowledgement was sent. Help never followed. Sora has
        been sitting in the held state of a promise that was made and not kept for thousands of years.</p>

        <p><strong>Hi/Tsuchi — offline distinction</strong></p>

        <p>A dormant site looks like an unlit lamp — infrastructure present, nothing feeding it. An offline site is
        distinguishable: the fabric around the Hi/Tsuchi marker is cold in a way dormant sites are not. The network
        registers the difference between a site that has gone quiet and a site that has been severed. Hi/Tsuchi is
        severed. The additional mark above its symbol, which distinguished it categorically from the other three sites
        in the historical rendering, takes on retrospective weight: whatever made it different may be connected to how
        it ended. Two sites died still transmitting. One died without making a sound.</p>

        <p><strong>The signal vocabulary — full system</strong></p>

        <table>

        <thead>


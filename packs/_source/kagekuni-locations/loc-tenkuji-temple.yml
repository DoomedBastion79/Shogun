  - _id: a7ZZ1hbEPuqdyu1K
    _key: '!journal.pages!TNV9pLqaBUzySDRl.a7ZZ1hbEPuqdyu1K'
    name: The Star Shrine — Okuden
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-read-aloud-the-star-shrine" data-section="read-aloud-the-star-shrine">Read-Aloud — The Star
        Shrine</h4></header>

        <p><em lang="ja-Latn">The hallway that leads here is unmarked — no carvings, no script, no alcoves. Just stone,
        ten feet wide, stretching sixty feet ahead of you with the narrowing sense that you are going somewhere set
        apart.</em></p>

        <p><em lang="ja-Latn">The room at the end is broad and still — forty-five feet across, thirty-five deep, the
        ceiling rising into shadow above you. The floor is polished obsidian, black and seamless, still reflective
        despite the centuries — you see your own feet in it, blurred, moving just behind you. At the center, a low stone
        dais sized for a single seated figure, unadorned.</em></p>

        <p><em lang="ja-Latn">Then you notice the ceiling.</em></p>

        <p><em lang="ja-Latn">Thousands of small holes, each one no wider than a finger, pierce it in an arrangement
        that is clearly deliberate — too consistent for accident, too complex for simple decoration. Through a narrow
        shaft in the outer northwest wall, moonlight enters the chamber and passes through the holes, each one casting a
        single pinprick of shadow down onto the obsidian below.</em></p>

        <p><em lang="ja-Latn">The shadows together form the sky.</em></p>

        <p><em lang="ja-Latn">Not an approximation of it. Not a simplified rendering. The actual night sky above this
        latitude, mapped in negative across the reflective floor: the constellations of Seizan, the positions of the
        four moons, the dim stellar clusters between the named stars. The room is holding the sky in place.</em></p>

        <p><em lang="ja-Latn">Sound arrives at the threshold and stops. Whatever you carried in from the hallway —
        footsteps, breath, the creak of armor — becomes, within a step, nothing.</em></p>

        <p><em lang="ja-Latn">The dais has been used recently. The dust on it is disturbed: a circular impression, the
        shape of something large and coiled, pressed into the surface more than once.</em></p>


        </article>

        </div>




        <p><em lang="ja-Latn">Northwest wing, accessible via the west end of the E-W hallway.</em></p>

        <p><strong>Physical Description:</strong></p>

        <p>Accessed via a 10 ft wide, 60 ft long unmarked hallway extending north from the west wing of the E-W hallway.
        Room is 50 ft wide × 40 ft deep, high ceiling. Complete sound suppression at the threshold — all external noise
        ceases on entry.</p>

        <p><strong>Magical Darkness:</strong> The rear two-thirds of the room is consumed by magical darkness — a clean
        circular boundary approximately 20 ft radius centered on the dais. The entrance third remains lit. Light sources
        stop precisely at the boundary and do not spill inward. Darkvision does not function within the darkness. The
        boundary is visible and investigable from the entrance before committing.</p>

        <p><strong>Floor:</strong> Polished obsidian, black and seamless, still reflective. Functions as the projection
        surface for the star map (currently inactive — obscured by darkness).</p>

        <p><strong>Ceiling:</strong> Thousands of finger-width holes piercing the dome in a precise arrangement. A
        narrow shaft in the outer northwest wall admits moonlight, which passes through the holes and casts pinprick
        shadows onto the obsidian floor — reproducing the actual night sky at this latitude (constellations of Seizan,
        four moons, stellar clusters). Full map renders under Kagetsu (largest moon). Currently inert while darkness
        persists.</p>

        <p><strong>Dais:</strong> Low stone platform at center (within the darkness), sized for a single seated figure.
        Shows recent use — dust disturbed, circular coiled impression pressed into the surface repeatedly. A cursed urn
        sits on the dais, radiating the darkness.</p>

        <p><strong>Permanent etching:</strong> A fixed star configuration carved into the obsidian floor (not projected)
        depicting the Great Aphelion — all three stars and four moons at maximum distance from Seizan. Partially visible
        in the lit entrance third; full configuration only visible once darkness lifts.</p>

        <hr>

        <section class="secret kg-secret-discoverable" data-kind="discoverable">

        <p><strong>Discoveries</strong></p>

        <ul>

        <li class="kg-task" data-done="false"><strong>The Darkness — source identification</strong> (DC 12 Arcana or
        Perception; DC 13 Arcana curse aura; DC 16 Arcana protective ward)</li>

        <li class="kg-task" data-done="false"><strong>The Purification Rite</strong> (DC 18 Religion or second floor
        hidden archive)</li>

        <li class="kg-task" data-done="false"><strong>How It Works — star map mechanism</strong> (DC 10 Arcana for
        navigator check) <em lang="ja-Latn">(requires darkness to be lifted)</em></li>

        <li class="kg-task" data-done="false"><strong>The Dais Impression —
        @UUID[Compendium.kagekuni-assistant.monsters.Actor.OGA1LtjRQuabbHHR]{Nagaji Kannushi} attunement</strong></li>

        <li class="kg-task" data-done="false"><strong>Relic Collection</strong> (DC 14 Investigation — once darkness
        lifts)</li>

        <li class="kg-task" data-done="false"><strong>Meditation Benefit</strong> (short rest on dais during moonlight)
        <em lang="ja-Latn">(requires darkness to be lifted)</em></li>

        </ul>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-campaign" data-kind="campaign" data-label="The Darkness">

        <p><strong>Source Identification:</strong></p>

        <table>

        <thead>

        <tr>

        <th>Check</th>

        <th>DC</th>

        <th>Result</th>

        </tr>

        </thead>

        <tbody><tr>

        <td>Arcana or Perception</td>

        <td>12</td>

        <td>Identifies the urn on the central dais as the epicenter of the darkness</td>

        </tr>

        <tr>

        <td>Arcana</td>

        <td>13</td>

        <td>Confirms curse aura on the urn</td>

        </tr>

        <tr>

        <td>Arcana</td>

        <td>16</td>

        <td>Identifies curse as a deliberate protective ward, not corruption — can be unwound</td>

        </tr>

        <tr>

        <td>Religion</td>

        <td>18</td>

        <td>Reveals the purification rite to lift the darkness</td>

        </tr>

        </tbody></table>

        <p><strong>Purification Rite:</strong> One action, both hands on the urn&#39;s surface, spoken invocation to
        Kinryū. Lifting the darkness does not damage the urn. The rite can also be learned from the hidden archive on
        the second floor.</p>

        <p><strong>If the party lifts the darkness mid-combat:</strong> The darkness collapses instantly. The Kannushi
        loses concealment.</p>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="How It Works (Star
        Map)">

        <p>The shaft in the outer northwest wall is angled precisely to admit moonlight at specific lunar positions.
        Under Kagetsu (the largest moon), the full star map renders on the floor. Under Ryugetsu, certain star positions
        shift slightly — reflecting that moon&#39;s complex orbit — creating what the order called the
        &quot;Dragon&#39;s Compass,&quot; a subtle pattern within the map pointing toward celestial events of
        significance. A seimaster or character with proficiency in Arcana or Navigator&#39;s Tools who studies the map
        for 10 minutes can extract one piece of information about current celestial alignment (DM&#39;s discretion based
        on current campaign date — Aki season, Kugatsu 1).</p>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-campaign" data-kind="campaign" data-label="The Dais
        Impression">

        <p>The circular coiled impression in the dust was left by the Nagaji Kannushi who inhabits this space. It was
        not meditating in the conventional sense — it was drawn here, instinctively, by something in the stone that
        resonates with its transformed nature. The Nagaji connection to Kokuryu&#39;s shadow rituals creates a faint
        attunement to certain sei-charged spaces. The Kannushi has been tidying the space — making it a meditation
        chamber.</p>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="Relic Collection
        (DC 14 Investigation — once darkness lifts)">

        <p>The Kannushi gathered and preserved these objects from elsewhere in the temple:</p>

        <ul>

        <li>Three intact ceremonial incense burners (gold-inlaid bronze; functional; 120gp each as antiques)</li>

        <li>A silk-wrapped bundle of seven prayer slips in Old Imperial script — celestial observation function</li>

        <li>A cracked but sealed lacquer box containing brass astronomical instruments — grant advantage on celestial
        Navigation checks</li>

        <li>A carved jade medallion bearing Kinryū&#39;s clan sigil — devotional; radiates faint warmth; worth
        200gp</li>

        <li><strong>Tsukuyomi projection lens</strong> — deep red crystal, warm to the touch; moved here by the Kannushi
        from elsewhere in the temple <em lang="ja-Latn">(Observatory component #4 — originally hidden in the mess hall
        sealed jar by a priest during the fall; the Kannushi found and relocated it)</em></li>

        </ul>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="Star Map —
        Activates When Darkness Lifts">

        <p>The full ceiling becomes visible and active once darkness ends. Silver and gemstone inlay responds to current
        celestial date. DC 14 Arcana or Nature (10 minutes study) reveals current celestial alignment and sei
        implications.</p>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="Mechanical Benefit
        — Meditation">

        <p>A character who spends a short rest seated on the dais (during a moonlit period, darkness lifted) receives
        the benefits of the <em lang="ja-Latn">Calm Emotions</em> spell upon completing the rest, and has advantage on
        their first Wisdom saving throw before their next long rest. This is a one-time benefit per creature per
        visit.</p>

        <hr>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-encounter" data-kind="encounter" data-label="Encounters">

        <ul>

        <li class="kg-task" data-done="false">Nagaji Kannushi (present and meditating on the dais when party arrives;
        fully hostile once triggered; has Devil Sight)</li>

        </ul>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-encounter" data-kind="encounter" data-label="The Kannushi —
        Tactical Notes">

        <ul>

        <li><strong>Present when the party arrives</strong> — meditating on the dais within the darkness; may have heard
        the party and chosen stillness</li>

        <li><strong>Devil Sight</strong> — sees in the darkness as bright light to 120 ft; is not imposed on by the
        darkness she created</li>

        <li><strong>Trigger</strong>: Loud noise, light spells directed toward her, or anyone crossing the darkness
        boundary</li>

        <li><strong>No non-combat resolution</strong> — she is fully hostile once triggered</li>

        <li><strong>Fights to protect the dais and urn</strong> — does not abandon them aggressively</li>

        <li><strong>If the party reaches the urn mid-combat and succeeds on DC 18 Religion</strong>: darkness collapses
        instantly</li>

        </ul>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="The Cursed Urn">

        <p>The Kannushi cursed the urn deliberately as a guardian measure — her intent is protective. She created the
        darkness to shield the space she has claimed. This is a ward, not corruption.</p>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="DM Notes">

        <p><strong>Relc&#39;s Vision</strong>: When the darkness lifts and the star map activates, green luminescence
        briefly appears in one constellation matching Solas&#39;s letter sigil — visible to Relc only, for a moment
        only. Pass note to player directly.</p>

        <p><strong>Relc&#39;s Moment (Dais)</strong>: This is a meaningful space for Relc specifically. The Sacred Grove
        and the Golden Dragon Clan had a historical relationship — both traditions understood the sky as a living text.
        When Relc stands on the dais, Solas&#39;s next vision arrives: not words, not instruction — just the image of
        Solas in the grove above @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.glkgG2E8eJWrxCrm]{Koriwara}, one
        hand on a standing stone, dawn light striking it from the east. The vision lasts three seconds. It is quiet. It
        is pointing him home, after this is done.</p>

        <p><strong>The Last Observation — The Great Aphelion</strong>: The star map contains a fixed reference
        configuration etched into the obsidian floor — not projected by moonlight but carved permanently. It depicts all
        three stars (Amaterasu, Susanoo, Tsukuyomi) and all four moons at their maximum distance from Seizan: the Great
        Aphelion (formal in-world name TBD). This configuration appears to be the last documented celestial observation
        made by the temple&#39;s order. No subsequent observations were recorded, suggesting the temple fell at
        approximately the same time as this event. A character proficient in Arcana, History, or Navigator&#39;s Tools
        who studies this etching (DC 16) recognizes it as an extreme astronomical configuration — one that would occur
        only on cycles measured in millennia. A seimaster or Ancient Guard member would understand its potential
        connection to the sei drought. The party is unlikely to grasp the full significance without outside expertise,
        but the etching stands as physical evidence linking the temple&#39;s abandonment to a cosmic event.</p>

        <p><strong>What Was Taught Here</strong>: This room was the order&#39;s primary space for sei study linked to
        celestial alignment. Dragon-priests would sit for days on the dais, mapping the movements of the star shadows as
        the moon tracked across the shaft, correlating them with sei fluctuations they could feel in the mountain stone.
        The knowledge developed here fed into the Golden Dragon Clan&#39;s deep understanding of Kinryu&#39;s
        transformation-reversal work — the idea that sei corruption can be unmade through precise celestial timing. That
        insight is relevant to the Gekko situation, and a character who meditates here and succeeds on a DC 14 Arcana or
        History check intuits it: <em lang="ja-Latn">the stars matter. Whatever is broken, the sky must be right when it
        is mended.</em></p>

        <p><strong>Moral Weight</strong>: When the darkness lifts, the party sees what the Kannushi was guarding — the
        tidied floor, the arranged relics, the straightened shelf. She was not protecting a threat. She was tending a
        sanctuary. This lands without narration.</p>


        </section>

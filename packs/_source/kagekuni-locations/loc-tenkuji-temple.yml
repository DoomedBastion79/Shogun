  - _id: 3Asg4CgxS3SsrwP4
    _key: '!journal.pages!TNV9pLqaBUzySDRl.3Asg4CgxS3SsrwP4'
    name: Kyōzō — The Hidden Archives
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <p><em lang="ja-Latn">The Hidden Archives. Accessed via the south-wall portal from the Tenkairō. Foundational
        warding extends through floor, ceiling, and outer walls — no other entry exists.</em></p>

        <p><em lang="ja-Latn">This file is a starting framework. The archive&#39;s specific contents will be flushed out
        in detail; what follows is canonical structure and the documents the archive is known to hold.</em></p>

        <hr>

        <p><strong>Physical Description:</strong></p>

        <p>The portal deposits the supplicant in a short anteroom hallway — 10 ft wide, 20 ft long, plain dressed stone
        — that terminates at a single open archway leading into the archive proper. The hallway is lit by two cold-flame
        sconces. The receiving end of the portal is the back wall of the hallway; turning around after arrival shows a
        smooth blank stone wall with no portal evidence on this side. Travel is one-way except via the Tenkairō
        activation, which the party must repeat to depart (the portal opens both ways for the ten-minute activation
        window, but resealing requires re-performing the seven-plate rite if the party leaves and returns later).</p>

        <p><strong>The Archive Proper:</strong></p>

        <p>A rectangular chamber, 40 ft wide × 60 ft deep, ceiling 14 ft. The chamber is <strong>dry</strong> — markedly
        so, the kind of dryness that has been engineered rather than weathered. The air is still and cool, slightly cold
        to the touch. Faint, clean cedar scent — the smell of <em lang="ja-Latn">kiri</em> and <em
        lang="ja-Latn">sugi</em> wood used in Japanese archival practice to repel insects and absorb humidity.</p>

        <p>The walls are lined with <strong>tall lacquered cabinets</strong> — black-lacquered cedar, brass-fitted,
        doors closed, each cabinet roughly 12 ft tall × 4 ft wide × 3 ft deep, fronted with paper <em
        lang="ja-Latn">fusuma</em> panels behind the outer doors. Cabinets are arrayed along the north, east, and west
        walls in unbroken rows; the south wall (the entrance side) holds a long reading table and three <em
        lang="ja-Latn">zaisu</em> — low backed seats — facing the room.</p>

        <p>A central display plinth, 6 ft tall, holds a single cradle for a scroll under sei-lacquered glass. The cradle
        is empty. <em lang="ja-Latn">(What was meant to live there is itself a sealed thread — see DM Notes.)</em></p>

        <p><strong>Lighting:</strong></p>

        <p>Four cold-flame sconces, one at each corner of the chamber. The light is bright, even, and unwavering. The
        archive was built to be read in.</p>

        <p><strong>The Cabinets:</strong></p>

        <p>Each cabinet is labeled at its top in gold leaf with a category glyph. A character with knowledge of the
        Golden Dragon order&#39;s archival conventions (DC 13 History; DC 10 for Ko&#39;jiri) can read the categories at
        a glance:</p>

        <ul>

        <li><em lang="ja-Latn">Reishiki</em> (礼式 — Rites and Liturgy)</li>

        <li><em lang="ja-Latn">Yakushi</em> (薬師 — Healing Arts)</li>

        <li><em lang="ja-Latn">Tenmon</em> (天文 — Astronomy and Calendar)</li>

        <li><em lang="ja-Latn">Hihō</em> (秘法 — Secret Methods)</li>

        <li><em lang="ja-Latn">Keizu</em> (系図 — Lineages and Records)</li>

        <li><em lang="ja-Latn">Bunsho</em> (文書 — Correspondence and Edicts)</li>

        <li><em lang="ja-Latn">Other categories present, several damaged or empty.</em></li>

        </ul>

        <p>The cabinets and their contents are intact. The archive&#39;s foundational warding has preserved everything
        inside it for thousands of years, exactly as it was the day the order fell.</p>

        <hr>

        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="Key Documents Held
        Here">

        <p><strong>This list is the framework — specific scroll-by-scroll detail is intentionally TBD and will be
        expanded as the campaign requires. The categories below are canon; the precise wording, count, and arrangement
        of individual documents are open.</strong></p>

        <ul>

        <li class="kg-task" data-done="false"><strong>The Vigil-Oath Dismissal Rite</strong> (<em
        lang="ja-Latn">Reishiki</em> cabinet; DC 12 Investigation in the cabinet) — full text in old liturgical
        Draconic, with phonetic gloss. Resolves <code>mon-tachibana-akiyo</code>.</li>

        <li class="kg-task" data-done="false"><strong>Pool Ritual Documentation</strong> (<em
        lang="ja-Latn">Reishiki</em> and <em lang="ja-Latn">Yakushi</em> cabinets; DC 12 Investigation) — the full DC-18
        Religion content for the Hiroba pools (healing rite, condition rite, blessing of Kinryū). Equivalent to
        <code>rm-grand-hall</code> § The Pools&#39; DC 18 Religion result.</li>

        <li class="kg-task" data-done="false"><strong>Star Shrine Purification Rite</strong> (<em
        lang="ja-Latn">Reishiki</em> cabinet; DC 12 Investigation) — the full DC-18 Religion content for lifting the
        Star Shrine darkness. Equivalent to <code>rm-star-shrine</code> § The Darkness&#39; DC 18 Religion result.</li>

        <li class="kg-task" data-done="false"><strong>The Gekkō Reversal Documentation</strong> (<em
        lang="ja-Latn">Hihō</em> cabinet — Secret Methods) — the Golden Dragon counter-work to the Onyx transformation
        ritual. The crossed-out entry from the Zasu&#39;s index (see <code>rm-zasu-ritual-scrolls</code>) refers to <em
        lang="ja-Latn">this</em> document. It exists. The infiltrators tried to destroy it with fireballs. The wards
        held. <strong>The reversal is here.</strong> Specific contents — methodology, prerequisites, the three
        components (site of origin, counter-work, convergence of three lights) — are TBD pending the party&#39;s
        progression.</li>

        <li class="kg-task" data-done="false"><strong>Order of the Black Lily Correspondence</strong> (<em
        lang="ja-Latn">Bunsho</em> cabinet) — late-period letters between the Tenkū-ji order and the Black Lily
        monastery, documenting awareness of the Onyx transformation ritual and early countermeasures. Cross-reference
        for the party&#39;s later Black Lily encounter.</li>

        <li class="kg-task" data-done="false"><strong>Lineage Records of the Vigil-Sworn</strong> (<em
        lang="ja-Latn">Keizu</em> cabinet) — Tachibana Akiyo&#39;s name appears here, with her sworn date and the Kinkkō
        chamber as her assigned threshold. The record confirms she was never released.</li>

        <li class="kg-task" data-done="false"><strong>The Brood Activation Protocols</strong> (<em
        lang="ja-Latn">Hihō</em> cabinet) — instructions for activating each of the seven brood-portals throughout the
        temple complex (the Kinkkō disc is one of seven; the others are TBD across the temple, the buried city of
        Kinkokyou, and the cavern system). Each activation requires its corresponding token.</li>

        <li class="kg-task" data-done="false"><strong>Pre-Aphelion Astronomical Records</strong> (<em
        lang="ja-Latn">Tenmon</em> cabinet) — millennia of star-position data. Pairs with the orrery&#39;s projection
        sequence. Provides the Great Aphelion timeline (already canon in <code>core/great-aphelion.md</code>).</li>

        <li class="kg-task" data-done="false"><strong>The Order&#39;s Final Records</strong> (multiple cabinets,
        late-dated) — Head Priest Kinjiro&#39;s external correspondence in the order&#39;s last years, parallel to his
        personal journal in the Jushoku no Ma. Together, the two sources resolve much of what is missing from the
        operational ledger&#39;s fall-period gaps.</li>

        </ul>

        <p><em lang="ja-Latn">Each entry above is a slot. Specific document content will be drafted as the campaign
        approaches relevance.</em></p>

        <hr>


        </section>


        <section class="secret kg-secret-discoverable" data-kind="discoverable">

        <p><strong>Discoveries</strong></p>

        <ul>

        <li class="kg-task" data-done="false"><strong>The Foundational Warding — From The Inside</strong> (DC 14
        Arcana)</li>

        <li class="kg-task" data-done="false"><strong>The Empty Plinth</strong> (DC 13 Investigation or History)</li>

        <li class="kg-task" data-done="false"><strong>The Cabinet Categories</strong> (DC 13 History; DC 10 for
        Ko&#39;jiri)</li>

        <li class="kg-task" data-done="false"><strong>The Reading Table — Last Use</strong> (DC 13 Investigation)</li>

        <li class="kg-task" data-done="false"><strong>Time-Logged Entry Records</strong> (DC 14 Investigation)</li>

        </ul>

        <p><strong>The Foundational Warding</strong>: From inside the archive, DC 14 Arcana confirms what was inferred
        from outside — the wards are construction-level enchantment, woven into the masonry itself. The teleport
        prohibition extends through floor, ceiling, and all four walls. The portal in the south wall is the singular
        breach, designed and authorized by the temple&#39;s builders. <em lang="ja-Latn">Dispel Magic</em>, <em
        lang="ja-Latn">Antimagic Field</em>, and similar effects do not affect the foundational warding (it is not a
        sustained spell but a structural property). The party can read here freely. They cannot easily leave with
        everything they find — the archive contains far more than they can carry, and the portal&#39;s ten-minute window
        limits any single visit.</p>

        <p><strong>The Empty Plinth</strong>: DC 13 Investigation or History identifies the central display cradle as
        designed for a single scroll of significant ceremonial weight — the kind of plinth used to display a charter, a
        foundational sutra, or the order&#39;s most prized text. Whatever was here is gone. The cradle itself is
        undamaged; the scroll was removed deliberately, by someone who knew what they were doing, and left no trace of
        how. <em lang="ja-Latn">(DM: see DM Notes.)</em></p>

        <p><strong>The Cabinet Categories</strong>: DC 13 History (DC 10 for Ko&#39;jiri) reads the gold-leaf labels as
        the standard archival categories of the Golden Dragon order&#39;s preservation tradition. A character familiar
        with the system can locate any document type efficiently. Without the system, finding specific documents becomes
        a slow Investigation grind.</p>

        <p><strong>The Reading Table — Last Use</strong>: DC 13 Investigation. The reading table holds, on its surface,
        the very faint impression of a book that lay open on it. Dust has settled around the impression but not within.
        Someone was reading here when the order fell. Whatever they were reading, they took with them — or were taken
        with it. The impression&#39;s dimensions match the standard format of Head Priest Kinjiro&#39;s journal
        (currently in the Jushoku no Ma).</p>

        <p><strong>Time-Logged Entry Records</strong>: DC 14 Investigation. The archive maintained an entry log —
        visitors and the documents they consulted, recorded by the chief archivist. The log is in the <em
        lang="ja-Latn">Bunsho</em> cabinet, near the entrance side. The final entries record Kinjiro&#39;s name,
        repeatedly, in the weeks before the fall — he was here daily, consulting the <em lang="ja-Latn">Hihō</em>
        (Secret Methods) cabinet. He was looking for the same Gekkō-reversal documentation the party now seeks. He found
        it. He was preparing to use it. Time ran out.</p>

        <hr>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-encounter" data-kind="encounter" data-label="Encounters">

        <p><em lang="ja-Latn">(No combat encounters. The archive is undisturbed and uninhabited. The wards have held
        everything — including the absence of intruders — for thousands of years.)</em></p>

        <p><strong>Atmospheric note</strong>: The archive is silent in a way the rest of the temple is not. Even the
        orrery chamber&#39;s acoustic dampening is dynamic — it has a sound, the sound of stillness. The archive has <em
        lang="ja-Latn">no</em> sound. The wards extend to acoustic insulation. A character who speaks here hears their
        own voice and nothing more. Players may find this uncomfortable; that is intentional. The archive is a place
        where the temple&#39;s last thoughts are kept, and it does not echo.</p>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="DM Notes">

        <p><strong>Pacing — when to open this room</strong>: The archive is the second floor&#39;s reward. It is also,
        deliberately, an exposition dump risk — there is more material here than any single session should surface. Pace
        the discoveries:</p>

        <ol>

        <li><strong>First visit</strong> should land 1-3 documents the party most needs <em lang="ja-Latn">for what they
        currently face</em>. The Vigil-Oath dismissal rite (if Akiyo is unresolved). The Gekkō reversal framework (if
        they have made the connection from the Zasu&#39;s scrolls). The pool ritual content (if pool charges are tight).
        Other documents are <em lang="ja-Latn">visible but not surfaced</em> — the cabinets exist; the categories are
        legible; the party knows what is here even if they have not read it yet.</li>

        <li><strong>Subsequent visits</strong> can surface secondary documents as campaign needs arise. The party can
        return — the Tenkairō ritual is repeatable.</li>

        <li><strong>Documents the party never reads</strong>: Some archive contents are background canon only. Not every
        document needs in-fiction surfacing.</li>

        </ol>

        <p><strong>The Empty Plinth — Sealed Thread</strong>: The plinth held the <strong>Charter of Kinryū&#39;s
        Mandate</strong> — the founding document of the Tenkū-ji order, signed by Kinryū herself in the era when the
        seven Progenitors physically gathered. The charter is not destroyed. It was removed before the fall by Head
        Priest Kinjiro and placed somewhere safer — either in the Hoko (currently TBD), or with another fragment of the
        order who escaped before the temple closed. Recovery of the charter is a deep-cut campaign thread; do not
        surface unless the party pursues it.</p>

        <p><strong>The Gekkō Reversal — Specifics Still TBD</strong>: The reversal documentation exists and is in this
        archive. Its specific procedural form is intentionally not yet written, so the campaign can shape it to fit what
        the party&#39;s path actually surfaces. Constraints (already canon, see
        <code>rm-zasu-ritual-scrolls</code>):</p>

        <ul>

        <li>It requires the <strong>site of origin</strong> (a location in
        @UUID[Compendium.kagekuni-assistant.lore.JournalEntry.IxWbWZoFox1yoTDs.JournalEntryPage.D2VV9bFa1txuKDxB]{Kaze}
        province, with acoustic distortion, thermal anomalies, hollow stone).</li>

        <li>It requires the <strong>counter-work</strong> itself (this archive contains it).</li>

        <li>It requires the <strong>convergence of three lights</strong> (a Miyosai trinary alignment).</li>

        <li>The procedure is bounded by these three. The exact ritual structure, material components, and casting
        requirements are open — establish before the party performs it.</li>

        </ul>

        <p><strong>The Brood Activation Protocols — Setup For Later</strong>: The seven brood-portals are a
        campaign-scale system. The Kinkkō disc in <code>rm-vigil-hall</code> is the only one in this temple proper. The
        other six are scattered; some are in the buried city of Kinkokyō, some elsewhere. The protocols document is the
        master key to the system. A party that recovers it gains the ability to activate any brood-portal they later
        find — provided they also recover the brood&#39;s specific token. This is meta-content; do not surface
        mechanically until the structure of the brood-portal arc is decided.</p>

        <p><strong>Note on Murasakiryū</strong>: The archive does <em lang="ja-Latn">not</em> contain documentation of
        Murasakiryū as a Progenitor. The Golden Dragon order maintained the public seven-Progenitor framework but
        treated Murasakiryū&#39;s existence as discoverable-tier even within their own archives — the <em
        lang="ja-Latn">Keizu</em> cabinet&#39;s lineage records list six broods, not seven. A character who specifically
        searches for Amethyst material (DC 16 Investigation, sustained search) finds <em lang="ja-Latn">one</em>
        document — a sealed letter from an Ancient Guard correspondent to Head Priest Kinjiro, undated, advising him
        that the seventh dragon&#39;s name should not be inscribed in the lineage records. The letter does not explain
        why. Kinjiro complied. <em lang="ja-Latn">(This is the campaign&#39;s deepest archive breadcrumb toward the
        Order of the Ancient Guard&#39;s existence and Murasakiryū&#39;s masquerade. Surface only if the party is ready
        for the next layer.)</em></p>

        <p><strong>Connected entries</strong>: <code>rm-tenkairo</code> (only access route via south-wall portal),
        <code>mon-tachibana-akiyo</code> (dismissal rite held here), <code>rm-zasu-ritual-scrolls</code> (Gekkō reversal
        cross-reference), <code>rm-grand-hall</code> and <code>rm-star-shrine</code> (DC-18 Religion content
        equivalents).</p>


        </section>

        <h3 id="kg-the-hatching-sequence" data-section="the-hatching-sequence">The Hatching Sequence</h3>

        <h2 id="kg-the-hatching" data-section="the-hatching">THE HATCHING</h2>

        <p>The honor reckoning has passed. The chamber answers.</p>

        <blockquote>

        <p>A breath moves through the chamber — not a wind, not a sound, but a kind of <em
        lang="ja-Latn">exhalation</em> that touches everything. Both cherry trees, north and south, shed their blossoms
        in a single soft cascade. Petals fill the air. And as the petals fall, the trees themselves <em
        lang="ja-Latn">withdraw</em> — branches drawing inward, leaves curling, the canopy contracting as if the energy
        that has held them in bloom for thousands of years is being pulled back, called home.</p>

        <p>The petals do not settle. They drift on a current that is not air, gathering across the chamber in a slow
        swirling arc, and they converge on the still pool — on the basalt plinth — on the egg. They circle it, dancing,
        a soft golden-pink storm that closes around the warm gold of the shell.</p>

        <p>The egg cracks along a seam of light.</p>

        <p>What emerges is not what you expected. Smaller than a housecat — all gold and cream, eyes closed against the
        chamber&#39;s last brightness. It uncurls. It finds its feet on the basalt. Its eyes open. They are the color of
        the egg it has just left.</p>

        <p>It steps off the plinth. It crosses the floor, slow and deliberate, the petals drifting around it as it
        walks. It comes to stand before [bonded character] on the pad — at eye level, since [bonded character] is still
        kneeling. And it bows. Slow. Deliberate. The kind of bow given between equals who have just recognized one
        another.</p>

        <p>It waits.</p>

        </blockquote>

        <p><strong>Pause for player action.</strong> The wyrmling will not move further until the bonded character bows
        in return. If the player does not pick up the cue, the DM may gently prompt — <em lang="ja-Latn">&quot;It is
        waiting. Do you bow?&quot;</em> — without resolving the gesture for them. The bow is the candidate&#39;s first
        act in the bond; the wyrmling is asking for it, not demanding it.</p>

        <p>A failure to return the bow does not break the bond — the wyrmling is patient — but the bond does not <em
        lang="ja-Latn">complete</em> until the gesture is given. The chamber will not release the candidate from the pad
        while the wyrmling is still waiting. (DM call if the player adamantly refuses; this should never happen in
        practice.)</p>

        <blockquote>

        <p>When the bow is returned, the wyrmling lifts its head and presses the side of its face against the bonded
        character — the way a dog returns to a master after a very long absence, the way a child finds a parent — and
        <em lang="ja-Latn">settles</em>, as if it has been holding a breath for a very long time and can finally let it
        out.</p>

        <p>The bonded character feels a warm presence move into them: a second weight behind the breastbone, not in the
        head but in the chest, a second heartbeat just slightly out of sync with their own. The bond seals.</p>

        <p>Above, the dome dims to softer gold, the warmth of a banked forge. The cherry trees stand bare, branches
        still, their work spent. The work that this place was built for is done.</p>

        </blockquote>

        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="Mutual Bow Ritual
        (DM)">

        <p><strong>The mutual bow is intentional symmetry.</strong> The wyrmling&#39;s bow-and-wait + nuzzle here echoes
        the moment Aya will receive at her own departure (the wyrmling will cross to her in the hallway, bow, nuzzle her
        hand the same way). The two moments mirror: Aya kept the egg; the candidate now keeps what was kept. When the
        wyrmling later goes to Aya, it is closing a circle that began here. Don&#39;t telegraph the parallel — let it
        land on its own when the player notices. Some will. Some won&#39;t. Either is fine.</p>

        <p><strong>The trees are spent.</strong> Their withdrawal is permanent. The cherry trees do not bloom again —
        the chamber has poured the last of its sustaining force into the new life, and the canopy returns to bare
        branches that will, in normal time, decay like any tree&#39;s. After the chamber&#39;s purpose is fulfilled and
        Aya has faded, the trees remain as quiet, stilled witnesses. Future visitors to the chamber (in years or
        generations) will find bare cherry trees, dry pedestals, an empty pad, and a clean pool. The room becomes a
        memorial.</p>

        <p><strong>If the bonded PC does not realize they should bow back</strong>, the moment can be stretched
        indefinitely without breaking the scene. The wyrmling does not become impatient. The party may help (a whispered
        prompt from another PC counts — they witnessed the moment too). The architecture is not enforcing — it is <em
        lang="ja-Latn">waiting</em>. The candidate&#39;s first act of <em lang="ja-Latn">chūgi</em> is recognizing that
        the bond is mutual and offering the bow without being told.</p>

        <hr>


        </section>

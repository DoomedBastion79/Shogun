  - _id: tA2Zh6Zwrsk0Erp4
    _key: '!journal.pages!TNV9pLqaBUzySDRl.tA2Zh6Zwrsk0Erp4'
    name: The South Entrance — Kinko no Mon
    type: text
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <div class="fvtt narrative kg-readaloud" data-callout-type="read-aloud">

        <article>

        <header><h4 id="kg-read-aloud-the-south-entrance" data-section="read-aloud-the-south-entrance">Read-Aloud — The
        South Entrance</h4></header>

        <p><em lang="ja-Latn">The doors open and the cold comes first — dry and still, carrying the faint mineral scent
        of old bronze and something beneath it with no name, the absence of smoke from flames that do not burn the way
        fire burns.</em></p>

        <p><em lang="ja-Latn">There is light where there should not be. Gold sconces line both walls at intervals, and
        the torches set into them are burning — pale blue-white, absolutely still, each flame identical to the last. The
        draft from the open doors moves past them without effect. The shadows they throw are long and fixed, pooling
        between the sconces in bands of blue-black the light never quite reaches.</em></p>

        <p><em lang="ja-Latn">Eight pale stone pillars stand in two rows down the hall&#39;s length, freestanding, set
        well in from the walls — four to a side, reaching toward a ceiling sixty feet above. Their surfaces were carved
        once; the evidence of that is visible in the grooves and spirals that remain. The evidence of something else is
        visible too: chisel marks at a height someone could reach from the ground, working across every surface with
        patience. Faces removed. Wing-edges broken away. The hollows where features used to be catch the cold torchlight
        and cast shadows that shift faintly as you move through the space — following you, though the flames do
        not.</em></p>

        <p><em lang="ja-Latn">In the northwest corner, two of the pillars are down. They have fallen toward the center
        of the hall, the nearer one lying across the tile path in three large pieces, the farther one broken at the base
        and leaning against the first, the two together forming a low obstacle of pale stone and settled debris. The
        ceiling above shows raw mountain rock at both gaps. The gold sconces at those positions are still mounted on the
        wall — but the torches in them are gone, and that section of the hall, where Tapestry I hangs behind the rubble,
        is the darkest part of the room.</em></p>

        <p><em lang="ja-Latn">Between the standing pillars and the tapestried walls, the sconce-light does not reach.
        The space there runs the length of the hall on both sides, deeper shadow than the rest.</em></p>

        <p><em lang="ja-Latn">The walls between the sconces are hung floor to ceiling with fabric — overlapping in
        places, three layers deep in at least one section. What time and something more immediate have done to most of
        them is thorough: blackened frames, collapsed structures, images reduced past any reading. But not all. Here and
        there, where the light catches at the right angle, a shape holds. A color that should not have survived. A
        figure that resolves differently depending on where you are standing.</em></p>

        <p><em lang="ja-Latn">Down the center of the hall, where something has scraped through the accumulated grit, the
        floor tile is visible: gold and deep blue, geometric, precise.</em></p>

        <p><em lang="ja-Latn">Above the inner door, two iron brackets protrude from the stone. Between them,
        nothing.</em></p>


        </article>

        </div>




        <p><strong>Physical Description:</strong></p>

        <p>70 ft wide × 75 ft long, 60-foot ceiling. Tapers to 20 ft wide at approximately 50 ft in, connecting to the
        N-S hallway. Cold, dry, still air with faint bronze mineral scent and an absence of smoke-smell. Eight pale
        stone pillars in two rows of four, freestanding, set inward from the walls — creating shadowed side-aisles
        between pillars and walls. Pillar carvings deliberately defaced with chisel marks at reachable height (faces
        removed, wing-edges broken). Hollow carved surfaces catch torchlight and appear to shift with movement.</p>

        <p><strong>Lighting:</strong> Gold sconces at seven-foot intervals along both walls holding torches that burn
        pale blue-white — cold, still, unaffected by drafts. Roughly half still hold torches; of those, about two-thirds
        still burning. Light pools along walls but does not reach the side-aisles.</p>

        <p><strong>Northwest corner (dead zone):</strong> Two pillars collapsed toward center — one across the tile path
        in three pieces, the other broken at base and leaning against the first. Sconces intact but torches missing.
        Darkest area of the hall. Tapestry I hangs behind the rubble. Ceiling above shows raw mountain rock.</p>

        <p><strong>Walls:</strong> Tapestries hung floor to ceiling between sconces. Eleven positions total. Seven
        destroyed (blackened, collapsed, unreadable). Four retain imagery. Several frames are empty — tapestries cut
        down, not deteriorated.</p>

        <p><strong>Floor:</strong> Gold and deep blue geometric tile, visible along a scraped center path. Rest buried
        under accumulated grit.</p>

        <p><strong>Inner door:</strong> Two iron brackets mounted above the door frame. Whatever hung between them has
        been removed — no bracket damage, no debris.</p>

        <hr>

        <section class="secret kg-secret-discoverable" data-kind="discoverable">

        <p><strong>Discoveries</strong></p>

        <ul>

        <li class="kg-task" data-done="false"><strong>The Magical Torches</strong> (DC 13 Arcana; 18+ critical)</li>

        <li class="kg-task" data-done="false"><strong>The Dead Corner torches</strong> (DC 14 Investigation)</li>

        <li class="kg-task" data-done="false"><strong>The Pillar Carvings</strong> (DC 13 History / DC 10
        Ko&#39;jiri)</li>

        <li class="kg-task" data-done="false"><strong>The Two Fallen Pillars</strong> (DC 14 Arcana)</li>

        <li class="kg-task" data-done="false"><strong>The Tapestries — cut-down frames</strong> (DC 12 Perception)</li>

        <li class="kg-task" data-done="false"><strong>The Missing Brackets</strong></li>

        </ul>

        <p><strong>The Magical Torches</strong>: Gold sconces are mounted at seven-foot intervals along both walls —
        fixed, permanent, part of the temple&#39;s original construction. The magical effect requires both the sconce
        and the torch together; neither alone produces light. Roughly half the sconces still hold their torches; of
        those, approximately two-thirds are still burning. The flames burn cold — no heat, no fire damage, no smoke —
        and do not respond to drafts or movement. A DC 13 Arcana check identifies the enchantment as Golden Dragon order
        craft, a practical sustained effect designed to light the hall indefinitely. On a critical success (18+), the
        character reads further into the enchantment&#39;s structure and finds something unexpected: this is not a
        maintenance effect, not a slow-burning spell consuming stored energy over time. The magic embedded in these
        sconces is foundational — woven into the stone at the level of the temple&#39;s original construction, not cast
        on top of it. The sophistication required to work enchantment this deeply into physical material is far beyond
        what even skilled practitioners can achieve today. A torch removed from its sconce goes dark immediately and
        completely — not guttering, just out. Replaced into any sconce, it resumes burning at once.</p>

        <p><strong>The Dead Corner</strong>: The two fallen northwest pillars have left their sconces intact on the wall
        but their torches are missing — pulled free or knocked loose during the final conflict, the exact circumstances
        unclear. The result is a pronounced dark zone in the northwest corner, deepened by the rubble of the two
        pillars. Tapestry I hangs behind that rubble in near-darkness. A character who wants to examine it closely will
        need to either bring light into the corner or find and replace the missing torches. The torches themselves are
        somewhere in the pillar rubble — DC 14 Investigation to locate them. Replaced into their sconces, they resume
        burning immediately.</p>

        <p><strong>The Pillar Carvings</strong>: Damage is deliberate — multiple tools, over time, not a single event.
        DC 13 History (DC 10 for Ko&#39;jiri, who has advantage on Golden Dragon Clan checks) to read the pattern as
        methodical erasure rather than battle damage. The hollow faces track movement subtly in the torchlight. Worth
        remarking on for attentive players; do not explain it.</p>

        <p><strong>The Two Fallen Pillars</strong>: Both collapsed during the final conflict from localized magical
        detonations — not from age, not from each other. DC 14 Arcana detects trace sei residue at the base of each,
        consistent with explosive force applied at close range, centuries old. Two separate detonations, the same
        method. Someone destroyed these pillars deliberately, and the dark corner they created — directly adjacent to
        Tapestry I — was the point. The rubble has never been disturbed since they fell.</p>

        <p><strong>The Tapestries</strong>: Eleven positions total. Seven destroyed beyond reading; four retain usable
        imagery. Among the destroyed: DC 12 Perception reveals several frames are empty — tapestries cut down and
        removed, not deteriorated. Full content lives in the
        <strong>@UUID[Compendium.kagekuni-assistant.locations.JournalEntry.TNV9pLqaBUzySDRl.JournalEntryPage.8DDGBHRiCFr9r3xT]{Tapestries
        of Kinko no Mon}</strong> sub-page nested under this room in the journal sidebar.</p>

        <p><strong>The Missing Brackets</strong>: Whatever hung above the inner door was unmounted cleanly — no bracket
        damage, no debris on the floor. Taken deliberately. If ever recovered, it grants advantage on Insight checks
        within the temple for the duration of that visit.</p>

        <hr>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-encounter" data-kind="encounter" data-label="Encounters">

        <p><em lang="ja-Latn">(No combat encounters in this room under normal circumstances.)</em></p>


        </section>


        <section class="secret kg-secret-sealed kg-sealed-dm-notes" data-kind="dm-notes" data-label="DM Notes">

        <p><strong>The Shadow Corridors</strong>: The space between the freestanding pillars and the tapestried walls
        was architecturally intentional — a processional center path with lateral side-aisles. With the sconces throwing
        light outward toward the walls, those aisles are in deep shadow. Any creature in the side-aisles has
        three-quarters cover from anyone standing in the center path. DC 12 Perception to notice the depth before
        committing to the center. The Nagaji know this space and use the aisles. The scraped path runs down the center —
        whatever came through most recently was not moving with caution.</p>

        <p><strong>Atmosphere</strong>: Cold, dry, still air. The bronze smell is the sconce metalwork. The flames
        produce no smoke and no char — a strange olfactory absence where fire-smell should be. Sound echoes with a
        slight delay from the vault, footsteps returning a half-beat late. Near the tapestried walls that echo dies
        entirely. The silence there is notable.</p>


        </section>

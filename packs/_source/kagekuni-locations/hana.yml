        <section class="kg-tier kg-tier-discoverable" data-tier="discoverable"><ul>

        <li>The Bronze Wood Forest&#39;s metallic quality has a deeper origin than simple mineral runoff -- connected to
        the buried city of Kinkokyo beneath the Tenchusan Ren.</li>

        <li>The Shadowfen Bridge exhibits genuine sei resonance that produces mild disorientation in those who speak
        falsehoods while crossing.</li>

        <li>A seimaster from Hoshino To has gone missing after reporting an unusual celestial alignment that matches
        nothing in the records.</li>

        </ul>

        </section>

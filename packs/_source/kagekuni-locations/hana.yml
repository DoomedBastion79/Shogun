        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-geography-amp-terrain"
        data-section="geography-amp-terrain">Geography &amp; Terrain</h3>

        <p>Hana occupies the eastern coast of Hokori and is the seat of imperial history. It stretches along the
        island&#39;s eastern seaboard, bounded to the northwest by the mountainous interior of Sora province for the
        majority of its inland border, with Tsuchi and Hi to the west, and Kaze to the north.</p>

        <p>The province&#39;s defining feature is the Serenia-kai (Selenia Sea), a vast inland sea covering more than a
        thousand square miles, fed by twenty-five rivers and thirteen waterfalls cascading from the Tenchusan Ren and
        the central highlands of Hokori. Its surface shifts color with the seasons. The tidal rhythms driven by
        Kagekuni&#39;s four moons make its edges unpredictable; the shoreline can retreat several hundred meters during
        low compound tides.</p>

        <p>To the west, the Seidorin Mori (Bronze Wood Forest) stretches for miles -- an ancient woodland where the
        trees grow with bark of burnished copper-bronze that catches sunlight like armor. Their leaves shed entirely in
        one night when the temperature drops below a certain threshold. The wood itself is extraordinarily hard and is
        harvested under strict clan license for weapons and structural reinforcement.</p>

        <p>To the northeast, the land rises sharply toward the Tenchusan Ren. The pass through this range is the primary
        land route north. The mountains are sacred in Hana&#39;s religious tradition; several peak-top shrines are
        maintained by hermit monks.</p>

        <p>Shirogane Yama (Silver Mountain), the highest peak on Hokori, dominates the northern skyline -- a pale peak
        streaked with natural mineral deposits that catch moonlight. At its summit sits the Hoshino To (Tower of Stars),
        an ancient astronomical observatory built during the Golden Age. The city of Kumoji sits at its base.</p>

        <p>Key Waterways: Kinryugawa (Gold Dragon River), Midorikawa (Green River), Sutariba (Star River)</p>

        <p>Points of Interest:</p>

        <ul>

        <li>Seidorin Mori (Bronze Wood Forest) -- Ancient woodland with metallic-barked trees. Harvested under strict
        Clan Kaminari license. The interior is unnervingly quiet -- sound behaves strangely under the canopy. Unlicensed
        logging is a capital offense.</li>

        <li>Serenia-kai (Selenia Sea) -- The great inland sea. Major artery for trade and travel. The most dangerous
        tidal event is Ryugetsu&#39;s Embrace, when three moons align over the sea simultaneously.</li>

        <li>Hoshino To (Tower of Stars) -- Ancient observatory on Shirogane Yama summit. Still operational; maintained
        by a small order of seimasters. Instruments calibrated to all three stars and four moons simultaneously.</li>

        <li>Kodan no Jinja -- Ancient roadside shrine. Grants divine boons to supplicants for a period of days equal to
        three times the recipient&#39;s experience level (maximum sixty days). Only one boon at a time.</li>

        <li>Shadowfen Bridge -- Stone bridge near Sakura Mura crossing into marsh forest. Legend claims a river spirit
        demands one honest secret spoken aloud; liars find the far bank leads somewhere unintended.</li>

        <li>Tenchusan Ren (Heavenly Pillar Mountains) -- The mountain range forming Hana&#39;s northwestern boundary.
        The pass is treacherous in autumn and impassable during winter storms. Significant ruins exist within the
        range.</li>

        </ul>


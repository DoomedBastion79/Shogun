        <section class="kg-tier kg-tier-sealed" data-tier="sealed"><h3 id="kg-the-buried-city-of-kinkokyo"
        data-section="the-buried-city-of-kinkokyo">The Buried City of Kinkokyo</h3>

        <p>The Golden Dragon Clan&#39;s capital is not simply buried rubble. Significant portions survived structurally
        intact, sealed beneath hundreds of feet of rock and earth. The gold doors the party currently stands before are
        an outer entrance to this buried complex, exposed by a recent earthquake. The temple above is connected to
        Kinkokyo below. Ko&#39;jiri&#39;s research is essentially correct.</p>

        <h3 id="kg-kinryu-no-hikari" data-section="kinryu-no-hikari">Kinryu no Hikari</h3>

        <p>The artifact exists. It is held in a sealed vault deep within the temple, in the farthest underground section
        of Kinkokyo. It is not a weapon or a key. It is a communication device: a golden mirror that allows direct
        communion with Kinryu, the living Golden Dragon, wherever she is hidden. She will answer if called by someone
        she deems worthy.</p>

        <h3 id="kg-the-bronze-wood-secret" data-section="the-bronze-wood-secret">The Bronze Wood Secret</h3>

        <p>The Seidorin Mori grows over a second branch of the buried Kinkokyo canal system. The metallic quality of the
        trees is caused by trace mineral content in the groundwater -- water flowing through golden veins in the buried
        city&#39;s infrastructure for thousands of years. Ren Nakamura (Shicho of Kikyo) knows this. The merchant guild
        he is allied with wants to find the source and exploit it directly.</p>

        <h3 id="kg-hiroshi-nakamura----traitor-in-place" data-section="hiroshi-nakamura----traitor-in-place">Hiroshi
        Nakamura -- Traitor in Place</h3>

        <p>As Shugo of Heian, Hiroshi controls the administrative heart of the province. His access to Clan Kaminari
        intelligence is nearly total. He has been feeding information to an outside party (undeveloped) for at least
        three years. His warm, approachable public persona is his most effective weapon -- even his brother Hideo does
        not suspect how deep the betrayal runs.</p>

        <h3 id="kg-plot-hooks" data-section="plot-hooks">Plot Hooks</h3>

        <ul>

        <li>Unlicensed Bronze Wood poaching tied to a merchant guild front operation in Kikyo -- Ren Nakamura&#39;s
        faction or a rival?</li>

        <li>Strange behavior reported in Shadowfen Bridge area -- a traveler arrived at the wrong destination and has no
        memory of the crossing</li>

        <li>A seimaster from Hoshino To has gone missing after reporting an unusual celestial alignment that matches
        nothing in the records</li>

        </ul>

        </section>

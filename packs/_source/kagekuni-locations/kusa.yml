        <section class="kg-tier kg-tier-sealed" data-tier="sealed"><h3 id="kg-the-forest-of-spirits"
        data-section="the-forest-of-spirits">The Forest of Spirits</h3>

        <p>The faction&#39;s sanctuary in Yosei Mori is more significant than their public profile suggests. During
        centuries in the forest, they didn&#39;t just survive -- they studied. They have records, experiments, and
        findings from the Dark Ages that would upend current seimaster orthodoxy.</p>

        <h3 id="kg-midoriko39s-garrison" data-section="midoriko39s-garrison">Midoriko&#39;s Garrison</h3>

        <p>The city&#39;s military infrastructure is controlled by a Genso Alliance-aligned clan. Its strategic location
        in the center of Hokori makes it a key pressure point -- control of Midoriko means control of Hokori&#39;s
        interior road network.</p>

        <h3 id="kg-the-whispering-flats" data-section="the-whispering-flats">The Whispering Flats</h3>

        <p>The sounds are sei resonance from a buried structure beneath the flats -- a pre-imperial site, possibly
        connected to the Emerald Dragon Clan (Midoryu). The structure has not been rediscovered. The violet grass grows
        most densely directly over it.</p>

        <h3 id="kg-plot-hooks" data-section="plot-hooks">Plot Hooks</h3>

        <ul>

        <li>The Forest of Spirits has a problem they cannot handle internally -- related to something their research
        during the Dark Ages disturbed that has recently become active again</li>

        <li>Someone in Midoriko is passing military intelligence to the Arashi Alliance; the Genso governing clan needs
        quiet investigation</li>

        </ul>

        </section>

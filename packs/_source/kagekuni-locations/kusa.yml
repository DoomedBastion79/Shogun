        <h3 id="kg-culture-amp-trade" data-section="culture-amp-trade">Culture &amp; Trade</h3>

        <p>Kusa&#39;s economy is built on agriculture, river trade, and the unique resources of its forests. The Midori
        River supports extensive barge commerce connecting the interior to coastal trade routes. The Forest of Spirits
        faction, which publicly revealed itself during the Plague Campaign, operates from sanctuaries within the Yosei
        Mori and represents a significant if unusual economic and cultural presence.</p>

        <h3 id="kg-history" data-section="history">History</h3>

        <p>Kusa was a battleground during the War of Fractured Banners. The Defense of Midoriko was one of the war&#39;s
        early major engagements -- the provincial capital was besieged and nearly fell before a relief force broke
        through. The scars of that siege are still visible in Midoriko&#39;s architecture.</p>

        <p>During the Dark Ages, the Forest of Spirits became a refuge -- its elevated sei activity, present even when
        magic was absent everywhere else, drew survivors. The communities formed there eventually became the Forest of
        Spirits magical faction that publicly revealed itself during the Plague Campaign.</p>

        </section>

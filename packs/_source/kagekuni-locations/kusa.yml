        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-geography-amp-terrain"
        data-section="geography-amp-terrain">Geography &amp; Terrain</h3>

        <p>Kusa is Hokori&#39;s verdant interior -- a province of dense forests, wide river floodplains, and grasslands
        so deep and tall that travelers on foot are hidden from view within a hundred paces. It occupies the western
        side of Hokori&#39;s northeastern leg, with Sora encroaching on its southeastern border, Mizu to the southwest,
        Nami to the north, and Kaze to the east. Drainage from surrounding mountain ranges converges here, creating a
        network of rivers, oxbow lakes, and seasonal wetlands that makes the land extraordinarily fertile and difficult
        to traverse without knowing the paths.</p>

        <p>The forests are ancient and immense, dark-trunked hardwoods with canopies that diffuse light into a permanent
        green twilight. The forest floor grows in luminous violet and deep blue hues -- murasaki-gusa (purple grass) and
        aoi-koke (blue moss) -- endemic to the interior lowlands and giving the province a distinctive visual character
        unique in Hokori.</p>

        <p>The Midori River is the primary artery -- wide, slow-moving, navigable for flat-bottomed vessels. The capital
        Midoriko sits at the junction of the Midori and its largest tributary, the Futago-kawa (Twin River).</p>

        <p>The Kusayama Ren (Grass Mountains) forms the province&#39;s northern boundary. Notable for the Yosei Mori
        (Forest of Spirits), a region of ancient woodland where sei activity is consistently elevated and unusual
        phenomena are reported year-round.</p>

        <p>Points of Interest:</p>

        <ul>

        <li>Yosei Mori (Forest of Spirits) -- Sei-active ancient woodland. Navigation is genuinely unreliable. The
        Forest of Spirits faction maintains sanctuaries within. Unusual creatures in deeper reaches exhibit
        significantly elevated intelligence.</li>

        <li>Heiwa-mizo (Peace Ditch) -- Old defensive trench in Midoriko, now a long public garden with cherry trees.
        Hosts the Sakura no Nagori (Lingering Cherry Festival) -- a political event as much as a cultural one.</li>

        <li>The Whispering Flats -- Unusual terrain in Kusa&#39;s central lowlands where violet grass grows to chest
        height and wind creates complex auditory patterns that some claim carry intelligible whispers. Local tradition
        says the dead speak from the Flats during the Long Shadow season.</li>

        </ul>


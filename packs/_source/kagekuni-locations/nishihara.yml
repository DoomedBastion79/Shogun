      content: >-
        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-overview"
        data-section="overview">Overview</h3>

        <p>Nishihara sits in the rolling hills west of the Kinryugawa, in the gentle agricultural country between Heian
        and the Tenchusan Ren foothills. It is a village that exists primarily to serve the farmers and herders of the
        surrounding area -- a focal point for exchange, news, and social connection in a landscape of dispersed
        homesteads.</p>

        <p>The weekly market is Nishihara&#39;s defining feature. It draws traders from a surprising radius -- merchants
        from Heian, specialty vendors from neighboring villages, and itinerant traders whose routes include Nishihara.
        The market has a genuine village-fair quality; it is not purely transactional.</p>

        <h3 id="kg-notable-establishments" data-section="notable-establishments">Notable Establishments</h3>

        <p><strong>Market Hall</strong> -- Permanent covered structure hosting the weekly market. On non-market days it
        functions as a community gathering space and occasional shelter for travelers.</p>

        <p><strong>Temple of the Ancestors</strong> -- The largest structure in the village; a well-maintained
        ancestor-veneration temple serving the surrounding rural community. Seasonal festivals draw families from
        several hours&#39; travel distance.</p>

        <h3 id="kg-key-figures" data-section="key-figures">Key Figures</h3>

        <ul>

        <li>Yukari -- Village leader -&gt; npcs/yukari.md</li>

        </ul>

        </section>

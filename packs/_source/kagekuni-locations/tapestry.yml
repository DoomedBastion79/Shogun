        <p><strong>Ko&#39;jiri&#39;s Advantage</strong>: On Tapestry I, Ko&#39;jiri may apply his Golden Dragon Clan
        History advantage to the History (Track Two) check. On Tapestry IV, he may apply it to his Track One check — the
        founding priest&#39;s identity falls within his documented research.</p>


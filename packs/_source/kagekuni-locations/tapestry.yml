        <section class="kg-tier kg-tier-intro" data-tier="intro"><dl class="kg-infobox" data-kind="infobox"><div
        class="kg-info__row"><dt>Type</dt><dd data-field="type">location</dd></div><div
        class="kg-info__row"><dt>Status</dt><dd data-field="status">active</dd></div></dl><p><em lang="ja-Latn">Static
        examination and orrery-activated behavior for the four surviving tapestries in the South Entrance.</em></p>

        <p><em lang="ja-Latn">Static content describes what the party can learn from examining the tapestries as still
        fabric. Activation content describes what happens when the orrery is fully restored and the tapestries come
        alive.</em></p>

        <hr>

        <h2 id="kg-how-this-works" data-section="how-this-works">How This Works</h2>

        <p>Each tapestry supports two independent skill tracks. A player may attempt either or both, in any order — the
        two tracks produce genuinely different information, not the same content reframed from a different angle.</p>

        <p><strong>Track One — Reading the Image</strong>

        Use <strong>Investigation</strong> (analytical, connective, inferential) or <strong>Perception</strong>
        (sensory, visual, observational) interchangeably. Both engage with what is physically present in the tapestry. A
        player who attempts both rolls does not stack content — the second check may add a small sensory or contextual
        detail at DM discretion, but core information does not compound.</p>

        <p><strong>Track Two — The Secondary Skill</strong>

        Each tapestry has a distinct secondary skill that unlocks a different layer of information entirely.</p>


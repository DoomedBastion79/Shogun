      content: >-
        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-background"
        data-section="background">Background</h3>

        <p>Solas Evergreen, Guardian of the Order of the Sacred Grove, was found dead among the ancient trees he had
        sworn to protect. The death showed signs of a struggle against something powerful and unknown. To most, it was a
        tragedy. To Relc — his devoted apprentice — it was the beginning of an unwanted and necessary journey.</p>

        <p>Solas appeared to Relc in fragmented visions following his death, guiding him toward Heian. The posthumous
        letter Solas had prepared before his death, held by Benkei of the Order of the Tranquil Lotus, named Relc as the
        next Guardian of the Sacred Grove — a role Solas had prepared him for, even if Relc did not know it. The letter
        contained not just the appointment but a cipher poem pointing toward something Solas called the <em
        lang="ja-Latn">Warden&#39;s Wisdom</em>.</p>

        <p>Solas knew danger was coming. He prepared for his death before it arrived. He did not tell Relc directly. He
        is still communicating — in the only way he can now.</p>

        <h3 id="kg-objectives" data-section="objectives">Objectives</h3>

        <ul>

        <li class="kg-task" data-done="false">Investigate the death of Solas Evergreen<ul>

        <li class="kg-task" data-done="false">Follow the visions of Solas to Heian</li>

        <li class="kg-task" data-done="false">Meet with Benkei and receive the letter</li>

        <li class="kg-task" data-done="false">Await the next vision to appear</li>

        </ul>

        </li>

        </ul>

        <h3 id="kg-known-information" data-section="known-information">Known Information</h3>

        <p><strong>The Letter from Solas Evergreen</strong> — Formally appoints Relc as Guardian of the Sacred Grove.
        Written in advance of death — Solas knew danger was coming. Instructs Relc to seek friends, forge alliances, and
        find answers through the journey rather than by staying still. The letter&#39;s reverse side contains a cipher
        poem.</p>

        <p><strong>The Cipher Poem (reverse side of the letter)</strong>:

        <em lang="ja-Latn">Ancient sighing trees → still mirror of water → three stones (past / present / future) →
        align with rising sun → glade with phoenix fern → unlocks Warden&#39;s Wisdom</em></p>

        <p><strong>The Three Stones</strong> — Three specific stones that must be located and oriented toward the rising
        sun. Their locations are not specified in the poem; finding them is part of the quest. One is believed to be
        near Koriwara (Relc&#39;s home village). The others are unknown.</p>

        <p><strong>Phoenix Fern Glade</strong> — A specific location identifiable by the presence of phoenix fern — a
        rare plant associated with renewal and sacred grove sites. The final destination once the stones are
        oriented.</p>

        <p><strong>The Warden&#39;s Wisdom</strong> — What the cipher poem ultimately unlocks. Its nature is not yet
        known to Relc.</p>

        <p><strong>Benkei&#39;s Role</strong> — The Elder of the Order of the Tranquil Lotus held Solas&#39;s letter for
        Relc. His own membership in the Order of the Ancient Guard suggests a connection between Solas&#39;s death and
        threats to something much larger than a single grove guardian.</p>

        <p><strong>Solas&#39;s Spirit</strong> — Has appeared to Relc in visions at least twice. The visions have been
        directional rather than explanatory — pointing toward Heian, toward Benkei. The next vision is expected when
        Relc reaches a point where direction is needed again.</p>

        </section>

      content: >-
        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-background"
        data-section="background">Background</h3>

        <p>The party was ambushed overnight by bandits on the Emperor&#39;s Highway north of Heian. The attack was
        repelled. During the aftermath, a letter was found concealed on the body of the bandit leader — written in an
        unfamiliar language and clearly of some significance, given the care taken to hide it.</p>

        <p>The letter was subsequently translated. Its contents are a set of directional instructions — a treasure
        location cipher, written in obscure but decipherable terms — pointing toward a hidden cache or discovery of
        notable value.</p>

        <p>The ambush itself raises questions beyond the letter: were the bandits operating independently and the letter
        is their own, or were they hired? If hired, by whom and for what purpose? The letter may be a lead the bandits
        were following, or a map they were transporting for someone else.</p>

        <h3 id="kg-objectives" data-section="objectives">Objectives</h3>

        <ul>

        <li class="kg-task" data-done="false">Survive the ambush</li>

        <li class="kg-task" data-done="false">Discover the letter on the bandit leader</li>

        <li class="kg-task" data-done="false">Translate the letter</li>

        <li class="kg-task" data-done="false">Find where &quot;the earth feels soft&quot;</li>

        </ul>

        <h3 id="kg-known-information" data-section="known-information">Known Information</h3>

        <p><strong>The Translated Letter</strong>:</p>

        <p><em lang="ja-Latn">&quot;In the shadow of the great cedar, where the sun&#39;s light barely touches, lies the
        path to fortune.&quot;</em></p>

        <p><em lang="ja-Latn">&quot;Seek the stone that stands alone, marked with the kanji of the moon; beneath it, the
        first secret is revealed.&quot;</em></p>

        <p><em lang="ja-Latn">&quot;Follow the stream that sings through the night, its waters whispering tales of
        hidden gold.&quot;</em></p>

        <p><em lang="ja-Latn">&quot;At the fork where the wildflowers bloom, choose the path guarded by the fox&#39;s
        den.&quot;</em></p>

        <p><em lang="ja-Latn">&quot;When you hear the owl&#39;s call, count seven paces from the ancient oak and dig
        where the earth feels soft.&quot;</em></p>

        <p><strong>Analysis of the Letter</strong>:

        The instructions are sequential — each line depends on the previous. The final destination is reached by
        following a specific route through landmarks described in order. Key identifiers:</p>

        <ul>

        <li>A great cedar in shadow — large, old cedar tree in a location where direct sunlight doesn&#39;t reach;
        likely north-facing slope or deep forest interior</li>

        <li>A lone standing stone marked with the moon kanji — a deliberate marker; someone placed or marked this stone
        intentionally</li>

        <li>A stream audible at night — moving water with enough volume to be heard in quiet conditions</li>

        <li>A wildflower fork with a fox&#39;s den — a trail junction near a known fox habitat</li>

        <li>An ancient oak, seven paces, soft earth — the final cache location</li>

        </ul>

        <p><strong>Geographic candidates</strong>: The letter&#39;s language and style suggest origin in the central or
        northern Hokori region. The Tenchusan Ren and surrounding foothills contain all the described terrain types, but
        so does the Kaze province interior and the Kusa lowland forests.</p>

        <p><strong>The unknown language</strong>: What language was the letter written in? Identifying the script would
        narrow down who wrote it and potentially where the described location lies.</p>

        </section>

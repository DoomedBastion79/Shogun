        <section class="kg-tier kg-tier-sealed" data-tier="sealed"><h3 id="kg-full-truth" data-section="full-truth">Full
        Truth</h3>

        <p>The cache is a sealed container — a lacquered iron box, buried and warded — holding a fragmentary copy of the
        necromantic tome that Kuroyami originally found in Kuroshi Temple on Yurei. The original tome went with Kuroyami
        when he escaped. What the party would find is a hand-copied excerpt — several pages of the original text, copied
        by an early follower who then buried their copy here when they realized what following this path would cost
        them. The excerpt covers transformation rituals — dark ones — and is connected to the same tradition that the
        Gekko seimasters eventually discovered (through a different branch of the same source material).</p>

        <h3 id="kg-resolution-options" data-section="resolution-options">Resolution Options</h3>

        <ul>

        <li>Finding the cache completes the treasure-hunt objective but opens a much larger question: what is this
        fragment, who else is looking for it, and what does its existence imply about how widely Kuroyami&#39;s
        knowledge has spread?</li>

        <li>The Eikyu Yami Clan operatives who hired the bandits will eventually realize the bandits failed and send
        someone more capable</li>

        <li>The fragment&#39;s content — transformation rituals connected to the Gekko disaster — makes it directly
        relevant to the main investigation</li>

        </ul>

        <h3 id="kg-timing" data-section="timing">Timing</h3>

        <ul>

        <li>The Eikyu Yami follow-up operative will arrive when the bandit failure is confirmed; timeline flexible</li>

        <li>A second group following the letter&#39;s directions is further behind but moving with professional
        competence</li>

        <li>No hard deadline; the cache has been there for a long time and is not going anywhere</li>

        </ul>

        <h3 id="kg-connections" data-section="connections">Connections</h3>

        <ul>

        <li><strong>main-gekko-investigation</strong> — the necromantic fragment covers the same transformation rituals
        that created the Nagaji; different branch of the same source material</li>

        <li><strong>Eikyu Yami Clan / Kuroyami no Akuma</strong> — the persistent remnant of the Plague Campaign
        villain; the cache is their buried knowledge</li>

        <li><strong>The kitsune</strong> — a 200-year-old fox spirit who serves as both resource and potential
        complication; needs name, personality, and stat block before encounter</li>

        <li><strong>Murasakiryu connection</strong> — open question whether Kuroyami&#39;s original discovery on Yurei
        was arranged by the Amethyst Progenitor</li>

        </ul>

        </section>

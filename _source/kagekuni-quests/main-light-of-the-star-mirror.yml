      content: >-
        <section class="kg-tier kg-tier-discoverable" data-tier="discoverable"><h3 id="kg-hidden-truth"
        data-section="hidden-truth">Hidden Truth</h3>

        <p>The orrery is not merely an astronomical curiosity. It is the operational heart of a network that connects
        this temple to at least three other sanctuary sites across Hokori. Restoring it does not just activate the
        tapestries — it brings the hub node of a millennia-old communication system back online.</p>

        <p>Tapestry III is not a historical record like the other three. It is a monitoring surface — a live feed of the
        sanctuary network&#39;s current state. When activated, it shows:</p>

        <ul>

        <li><strong>This temple</strong>: operational (steady gold pulse)</li>

        <li><strong>Sora province site</strong>: acknowledged — a distress signal was received and answered, but help
        never came (slow double-beat)</li>

        <li><strong>Kaze province site</strong>: distress, unacknowledged — the signal has been running into silence
        since the fall of 13088 (rapid pulse)</li>

        <li><strong>Hi/Tsuchi border site</strong>: offline — severed, not dormant (cold fabric, no signal)</li>

        </ul>

        <p>These signals were set by practitioners during the fall. They have been running for over three thousand
        years. The party is the first entity capable of receiving them.</p>

        <p>The other three tapestries hold equally significant information:</p>

        <ul>

        <li><strong>Tapestry I</strong>: Records Kinryū&#39;s voluntary binding to this mountain — the founding moment
        of the temple, cosmologically timed</li>

        <li><strong>Tapestry II</strong>: Preserves the consecration ceremony that laid the temple&#39;s foundational
        enchantments — and evidence of infiltration within the order itself (a Kokuryu-aspected sei signature hidden
        within the golden working)</li>

        <li><strong>Tapestry IV</strong>: Depicts the first head priest receiving a direct commission from Kinryū, with
        a theological border encoding the order&#39;s founding obligations: creation, covenant, stewardship,
        silence</li>

        </ul>

        <h3 id="kg-npc-knowledge" data-section="npc-knowledge">NPC Knowledge</h3>

        <ul>

        <li><strong>Head Priest Kinjiro&#39;s spirit</strong> (priest&#39;s chamber): Knows the full history of the
        orrery, the sanctuary network, and the tapestries&#39; contents. Can explain the network protocol if the party
        engages peacefully. His operational ledger in the bronze box contains records of significant network
        events.</li>

        <li><strong>Ko&#39;jiri</strong>: His Golden Dragon Clan research gives him advantage throughout — the orrery
        validates everything he has studied. The operator&#39;s manual is readable at reduced DC for him.</li>

        <li><strong>Benkei</strong> (traveling, not present): Would recognize the sanctuary network as connected to the
        Ancient Guard&#39;s mission. The sites marked on Tapestry III overlap with the locations the Warden&#39;s Wisdom
        points toward.</li>

        </ul>

        <h3 id="kg-discovery-paths" data-section="discovery-paths">Discovery Paths</h3>

        <ul>

        <li><strong>Assessment in the observatory</strong>: DC 14 History (DC 11 Ko&#39;jiri) connects the device to
        Golden Dragon records. DC 14 Tinker&#39;s Tools identifies what specific repairs are needed.</li>

        <li><strong>Component discovery</strong>: Each component found on the first floor gains context when the party
        reaches the observatory — the &quot;aha&quot; moment when mysterious crystals and bronze rings suddenly have
        purpose.</li>

        <li><strong>Tapestry examination (static)</strong>: Available before orrery restoration. Two skill tracks per
        tapestry yield different information layers. Tapestry III&#39;s Track One Critical Success identifies the three
        sanctuary markers and their approximate geographic locations.</li>

        <li><strong>Tapestry activation (orrery restored)</strong>: The living tapestries reveal information invisible
        in the static state — Tapestry I tracks Ko&#39;jiri&#39;s presence, Tapestry III shows the live network,
        Tapestry IV&#39;s activation cycle includes the head priest glancing toward Tapestry III mid-ceremony.</li>

        <li><strong>Relc&#39;s presence during Tapestry III activation</strong>: He feels Solas&#39;s presence — not
        here, but at one of the other sanctuary sites shown on the map. This connects his personal quest directly to the
        sanctuary network.</li>

        </ul>

        </section>

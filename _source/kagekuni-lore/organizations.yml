        <section class="kg-tier kg-tier-sealed" data-tier="sealed"><h3
        id="kg-order-of-the-ancient-guard-most-secret-dm-only"
        data-section="order-of-the-ancient-guard-most-secret-dm-only">Order of the Ancient Guard — MOST SECRET (DM
        Only)</h3>

        <p><strong>Purpose</strong>: Silent protectors of the living founding dragons; maintain harmony among clans to
        preserve conditions under which dragons remain safe and hidden.</p>

        <p><strong>Ranks</strong>:</p>

        <ol>

        <li>High Guardian</li>

        <li>Warden</li>

        <li>Sentinel</li>

        <li>Keeper</li>

        <li>Protector</li>

        <li>Initiate</li>

        </ol>

        <p><strong>Operations</strong>: Hidden sanctuaries across Kagekuni; subtle influence; prevent any single power
        from dominating; bound by solemn oath.</p>

        <p><strong>Known Members</strong>:</p>

        <ul>

        <li><strong>Benkei</strong> — Elder, Order of the Tranquil Lotus (public); rank within Ancient Guard TBD</li>

        <li><strong>Solas Evergreen</strong> — Guardian, Order of the Sacred Grove (public); DECEASED; rank likely
        Protector or higher</li>

        </ul>

        <p><strong>Critical Implication</strong>: Solas&#39;s murder = someone killed a member of the order protecting
        the dragons. Scope of threat unknown.</p>

        <ul>

        <li><strong>This is where the truth about Clan Gekkō/Nagaji will be revealed</strong></li>

        </ul>

        </section>

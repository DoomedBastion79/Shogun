        <section class="kg-tier kg-tier-known" data-tier="known"><h3 id="kg-appearance"
        data-section="appearance">Appearance</h3>

        <p>Not described in detail.</p>

        <h3 id="kg-public-role" data-section="public-role">Public Role</h3>

        <p>Leader of Takamine, a mining village of 97 people sitting in the shadow of Kinryūzan (Gold Dragon Mountain)
        at the head of the Star River. The small iron mine sustains the village with modest yields. The community is
        close-knit in the way that difficult circumstances produce.</p>

        <h3 id="kg-personality" data-section="personality">Personality</h3>

        <p>Not described in detail beyond pragmatic leadership of a poor but proud community.</p>

        <h3 id="kg-relationship-to-party" data-section="relationship-to-party">Relationship to Party</h3>

        <p>No contact established.</p>


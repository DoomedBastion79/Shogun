        <section class="kg-tier kg-tier-discoverable" data-tier="discoverable"><h3 id="kg-true-nature"
        data-section="true-nature">True Nature</h3>

        <p>Subtly working to elevate Clan Minato to equal standing with major clans. Has a secret alliance with a
        powerful merchant guild — exclusive Kikyo trading rights in exchange for financial and political support for
        Clan Minato&#39;s ambitions. Possesses ancient knowledge about Seidōrin Mori and Bronze Wood that he has not
        shared publicly.</p>

        <h3 id="kg-connections" data-section="connections">Connections</h3>

        <p>The merchant guild he works with is not a Kikyo entity — it is based in Heian with operations across Hana and
        beyond. The alliance was struck in exchange for financial support for Clan Minato&#39;s elevation ambitions and
        exclusive export contracts.</p>

        <h3 id="kg-quest-seeds" data-section="quest-seeds">Quest Seeds</h3>

        <div class="kg-quest-seed" data-kind="quest-seed"><span class="kg-quest-seed__label">QUEST SEED</span> Ren
        Nakamura may contact Ko&#39;jiri separately from the group with an additional, unwritten request — something the
        formal letter couldn&#39;t contain.</div>


        </section>

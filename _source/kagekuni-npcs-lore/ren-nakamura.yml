        <section class="kg-tier kg-tier-sealed" data-tier="sealed"><h3 id="kg-campaign-secrets"
        data-section="campaign-secrets">Campaign Secrets</h3>

        <p>Nakamura is not villainous by nature — he genuinely believes Clan Minato deserves greater standing — but he
        has made compromises that are beginning to require further compromises to sustain.</p>

        <p>The Bronze Wood secret: the Seidōrin Mori grows over an underground branch of Kinkōkyo&#39;s ancient canal
        system. The metallic quality of the trees is caused by trace gold and copper content in the groundwater — water
        flowing through the buried city&#39;s infrastructure for thousands of years has mineralized the soil and is
        absorbed by the trees. Ren Nakamura has discovered this. The merchant guild he is allied with wants to locate
        and exploit the source directly, bypassing the tree-harvesting process entirely. This would require excavating
        the forest floor — destroying the grove to access what lies beneath.</p>

        <p>Ko&#39;jiri&#39;s forged letter ticking clock: Ko&#39;jiri carries both a legitimate letter from Ren Nakamura
        and a forged version requesting additional materials. The real letter has already been sent to Heian through
        official channels — it will arrive before or very shortly after the party does. When the discrepancy is
        discovered, Ko&#39;jiri&#39;s Conditional Pardon will be immediately at risk. Estimated timeline: 2-4 sessions
        from party arrival in Heian.</p>

        <h3 id="kg-plot-threads" data-section="plot-threads">Plot Threads</h3>

        <ul>

        <li>Ko&#39;jiri&#39;s legal jeopardy through the forged letter</li>

        <li>Bronze Wood / Kinkōkyo underground connection</li>

        <li>Clan Minato&#39;s elevation ambitions</li>

        <li>Merchant guild exploitation of Seidōrin Mori</li>

        <li>Connection to Haruto Masashige&#39;s licensing investigation</li>

        </ul>

        </section>

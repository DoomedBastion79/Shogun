        the Ancient Guard (Initiate)</em></p>

        <p>Elderly woman who has served the Crimson Shrine in the volcanic highlands of Hi province for approximately
        sixty years. Initiate of the Order of the Ancient Guard. She does not know Akaryū&#39;s (the Crimson
        Dragon&#39;s) location, but she knows the dragon is alive. She communicates through the shrine&#39;s ember-bowl:
        offerings burned there reach something that responds. The shrine&#39;s ember-bowl recently responded to an
        offering in a way it never has before — she needs discreet help interpreting what it means.</p>


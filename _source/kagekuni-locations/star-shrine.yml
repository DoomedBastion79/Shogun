      content: >-
        <section class="kg-tier kg-tier-discoverable" data-tier="discoverable"><h3 id="kg-discoveries"
        data-section="discoveries">Discoveries</h3>

        <ul>

        <li class="kg-task" data-done="false"><strong>The Darkness — source identification</strong> (DC 12 Arcana or
        Perception; DC 13 Arcana curse aura; DC 16 Arcana protective ward)</li>

        <li class="kg-task" data-done="false"><strong>The Purification Rite</strong> (DC 18 Religion or second floor
        hidden archive)</li>

        <li class="kg-task" data-done="false"><strong>How It Works — star map mechanism</strong> (DC 10 Arcana for
        navigator check) <em lang="ja-Latn">(requires darkness to be lifted)</em></li>

        <li class="kg-task" data-done="false"><strong>The Dais Impression — Nagaji Kannushi attunement</strong></li>

        <li class="kg-task" data-done="false"><strong>Relic Collection</strong> (DC 14 Investigation — once darkness
        lifts)</li>

        <li class="kg-task" data-done="false"><strong>Meditation Benefit</strong> (short rest on dais during moonlight)
        <em lang="ja-Latn">(requires darkness to be lifted)</em></li>

        </ul>

        <h3 id="kg-the-darkness" data-section="the-darkness">The Darkness</h3>

        <p><strong>Source Identification:</strong></p>

        <table>

        <thead>

        <tr>

        <th>Check</th>

        <th>DC</th>

        <th>Result</th>

        </tr>

        </thead>

        <tbody><tr>

        <td>Arcana or Perception</td>

        <td>12</td>

        <td>Identifies the urn on the central dais as the epicenter of the darkness</td>

        </tr>

        <tr>

        <td>Arcana</td>

        <td>13</td>

        <td>Confirms curse aura on the urn</td>

        </tr>

        <tr>

        <td>Arcana</td>

        <td>16</td>

        <td>Identifies curse as a deliberate protective ward, not corruption — can be unwound</td>

        </tr>

        <tr>

        <td>Religion</td>

        <td>18</td>

        <td>Reveals the purification rite to lift the darkness</td>

        </tr>

        </tbody></table>

        <p><strong>Purification Rite:</strong> One action, both hands on the urn&#39;s surface, spoken invocation to
        Kinryū. Lifting the darkness does not damage the urn. The rite can also be learned from the hidden archive on
        the second floor.</p>

        <p><strong>If the party lifts the darkness mid-combat:</strong> The darkness collapses instantly. The Kannushi
        loses concealment.</p>

        <h3 id="kg-how-it-works-star-map" data-section="how-it-works-star-map">How It Works (Star Map)</h3>

        <p>The shaft in the outer northwest wall is angled precisely to admit moonlight at specific lunar positions.
        Under Kagetsu (the largest moon), the full star map renders on the floor. Under Ryugetsu, certain star positions
        shift slightly — reflecting that moon&#39;s complex orbit — creating what the order called the
        &quot;Dragon&#39;s Compass,&quot; a subtle pattern within the map pointing toward celestial events of
        significance. A seimaster or character with proficiency in Arcana or Navigator&#39;s Tools who studies the map
        for 10 minutes can extract one piece of information about current celestial alignment (DM&#39;s discretion based
        on current campaign date — Aki season, Kugatsu 1).</p>

        <h3 id="kg-the-dais-impression" data-section="the-dais-impression">The Dais Impression</h3>

        <p>The circular coiled impression in the dust was left by the Nagaji Kannushi who inhabits this space. It was
        not meditating in the conventional sense — it was drawn here, instinctively, by something in the stone that
        resonates with its transformed nature. The Nagaji connection to Kokuryu&#39;s shadow rituals creates a faint
        attunement to certain sei-charged spaces. The Kannushi has been tidying the space — making it a meditation
        chamber.</p>

        <h3 id="kg-relic-collection-dc-14-investigation-once-darkne"
        data-section="relic-collection-dc-14-investigation-once-darkne">Relic Collection (DC 14 Investigation — once
        darkness lifts)</h3>

        <p>The Kannushi gathered and preserved these objects from elsewhere in the temple:</p>

        <ul>

        <li>Three intact ceremonial incense burners (gold-inlaid bronze; functional; 120gp each as antiques)</li>

        <li>A silk-wrapped bundle of seven prayer slips in Old Imperial script — celestial observation function</li>

        <li>A cracked but sealed lacquer box containing brass astronomical instruments — grant advantage on celestial
        Navigation checks</li>

        <li>A carved jade medallion bearing Kinryū&#39;s clan sigil — devotional; radiates faint warmth; worth
        200gp</li>

        <li><strong>Tsukuyomi projection lens</strong> — deep red crystal, warm to the touch; moved here by the Kannushi
        from elsewhere in the temple <em lang="ja-Latn">(Observatory component #4 — originally hidden in the mess hall
        sealed jar by a priest during the fall; the Kannushi found and relocated it)</em></li>

        </ul>

        <h3 id="kg-star-map-activates-when-darkness-lifts" data-section="star-map-activates-when-darkness-lifts">Star
        Map — Activates When Darkness Lifts</h3>

        <p>The full ceiling becomes visible and active once darkness ends. Silver and gemstone inlay responds to current
        celestial date. DC 14 Arcana or Nature (10 minutes study) reveals current celestial alignment and sei
        implications.</p>

        <h3 id="kg-mechanical-benefit-meditation" data-section="mechanical-benefit-meditation">Mechanical Benefit —
        Meditation</h3>

        <p>A character who spends a short rest seated on the dais (during a moonlit period, darkness lifted) receives
        the benefits of the <em lang="ja-Latn">Calm Emotions</em> spell upon completing the rest, and has advantage on
        their first Wisdom saving throw before their next long rest. This is a one-time benefit per creature per
        visit.</p>

        <hr>

        </section>

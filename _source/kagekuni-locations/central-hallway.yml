        <section class="kg-tier kg-tier-sealed" data-tier="sealed"><h3 id="kg-encounters"
        data-section="encounters">Encounters</h3>

        <p><em lang="ja-Latn">(No dedicated encounters in the hallway. Patrol Nagaji from the Grand Hall use this space
        as a transit route. The center intersection is a likely meeting point if the party moves noisily.)</em></p>

        <h3 id="kg-dm-notes" data-section="dm-notes">DM Notes</h3>

        <p><strong>Tactical Significance</strong>: The center intersection is the single most important control point on
        the first floor. A party that holds the intersection controls access to every wing. Conversely, enemies at the
        intersection can cut the party off from rooms they&#39;ve already cleared. The 20 ft width allows two-abreast
        combat but not flanking without entering a side corridor.</p>

        <p><strong>The Nagaji Route</strong>: The stairs down (west, south side) are the Nagaji&#39;s primary transit
        path. Their tracks are visible in the dust. The stairs up show no such traffic — the second floor appears to be
        outside their patrol pattern. This is a meaningful detail: whatever drove the Nagaji to occupy the first floor
        and the levels below, the upper floor was either inaccessible to them or not worth their attention.</p>

        <p><strong>Sound Propagation</strong>: The corridors amplify sound. A fight at the center intersection can be
        heard from the South Entrance, the Grand Hall doors, and partway down both wings. This matters for encounter
        pacing — combat here draws attention from adjacent areas.</p>

        </section>

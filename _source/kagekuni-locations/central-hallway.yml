        <section class="kg-tier kg-tier-discoverable" data-tier="discoverable"><h3 id="kg-discoveries"
        data-section="discoveries">Discoveries</h3>

        <ul>

        <li class="kg-task" data-done="false"><strong>Traffic patterns in the stone</strong> (DC 12 Investigation or
        Survival)</li>

        <li class="kg-task" data-done="false"><strong>Stair conditions — up and down</strong></li>

        </ul>

        <p><strong>Traffic Patterns</strong>: The wear in the stone tells a story. The heaviest traffic ran N-S (South
        Entrance to Grand Hall) — the primary processional route. The E-W corridor shows lighter but consistent wear
        toward both wings. Near the stairs, the stone is more worn on the western side than the eastern, suggesting the
        order&#39;s daily life centered more on the Star Shrine and Mess Hall side than the dormitory side. DC 12
        Investigation or Survival to read the pattern.</p>

        <p><strong>The Stairs</strong>:</p>

        <p><em lang="ja-Latn">Stairs down (45 ft west of center, south side of E-W hallway):</em> Stone steps descending
        into darkness. Air from below is warmer and carries a faint mineral dampness — different from the dry cold of
        the first floor. The steps are intact but dust-covered. Recent tracks in the dust: Nagaji. This is their route
        to and from the lower levels.</p>

        <p><em lang="ja-Latn">Stairs up — west (45 ft west of center, north side of E-W hallway):</em> Stone steps
        ascending. Dust undisturbed — the Nagaji have not gone up. Whatever is on the second floor, they either cannot
        reach it or have not tried.</p>

        <p><em lang="ja-Latn">Stairs up — east (45 ft east of center):</em> Stone steps ascending. Also undisturbed. A
        second route to the upper level, positioned near the dormitory wing.</p>

        <hr>

        </section>

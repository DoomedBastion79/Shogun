        <section class="kg-tier kg-tier-sealed" data-tier="sealed"><h3 id="kg-arashi-alliance-naval-operations"
        data-section="arashi-alliance-naval-operations">Arashi Alliance Naval Operations</h3>

        <p>Nami&#39;s Arashi-aligned governing clan is coordinating with Mizu&#39;s Minato-jo -- together, the eastern
        and western ports are being positioned for a joint naval operation. The target is unknown, but intelligence
        suggests it involves a landing rather than a sea battle.</p>

        <h3 id="kg-the-ancient-lighthouse-foundation" data-section="the-ancient-lighthouse-foundation">The Ancient
        Lighthouse Foundation</h3>

        <p>The oldest lighthouse foundation in the chain -- at Takaiso -- is built atop something much older. The
        original structure was not a lighthouse. Excavation work decades ago stopped abruptly when workers reported the
        foundation stones were warm to the touch and something moved in the space beneath. The site was sealed and built
        over. The sealed space is still there.</p>

        <h3 id="kg-plot-hooks" data-section="plot-hooks">Plot Hooks</h3>

        <ul>

        <li>A vessel arrived at Namigashira from the open ocean with no crew -- cargo intact, navigation logs ending
        mid-sentence, cook fire still warm</li>

        <li>The lighthouse at Takaiso went dark for three consecutive nights; the keeper is missing; locals won&#39;t go
        near it</li>

        </ul>

        </section>
